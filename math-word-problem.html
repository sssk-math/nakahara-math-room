/* =====================================================
   6. 画面の切りかえ
   ===================================================== */
const SCREEN_NAMES = ['start', 'select', 'record', 'settings', 'problem'];

function showScreen(name) {
  SCREEN_NAMES.forEach(function (s) {
    $('scr-' + s).classList.toggle('hidden', s !== name);
  });
  if (name === 'start') {
    renderStart();
  } else if (name === 'select') {
    renderSelect();
  } else if (name === 'record') {
    renderRecord();
  }
}

function fitStage() {
  const s = Math.min(window.innerWidth / 960, (window.innerHeight - 24) / 640);
  $('stage').style.transform = 'translateX(-50%) scale(' + s + ')';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* =====================================================
   7. 開始・問題選択・記録・設定
   ===================================================== */
function renderStart() {
  const r = loadJSON(STORAGE_KEYS.resume, null);
  const ok = validResume(r);
  $('btnResume').disabled = !ok;
  if (ok) {
    const p = PROBLEMS[r.S.pid];
    $('resumeInfo').textContent = typeOf(p.typeId).name + ' 問題' + p.no;
  } else {
    $('resumeInfo').textContent = '';
  }
}

function renderSelect() {
  const cleared = loadJSON(STORAGE_KEYS.cleared, {});
  $('typeList').innerHTML = TYPES.map(function (t) {
    let btns = '';
    for (let n = 1; n <= t.count; n++) {
      const pid = t.id + '-' + n;
      const ready = !!PROBLEMS[pid];
      const cls = 'pbtn' + (ready ? '' : ' off') + (cleared[pid] ? ' done' : '');
      btns += '<button class="' + cls + '" data-open="' + pid + '"' + (ready ? '' : ' disabled') + '>' + n + '</button>';
    }
    return '<div class="tcard"><div class="tname">' + t.name + '</div><div class="pbtns">' + btns + '</div></div>';
  }).join('');
}

function renderRecord() {
  const rec = loadJSON(STORAGE_KEYS.records, {});
  $('recBody').innerHTML = TYPES.map(function (t) {
    const r = rec[t.id] || emptyRecord();
    const vals = [r.tries, r.noMiss, r.methods.word, r.methods.line, r.methods.table, r.methods.other];
    return '<tr><th>' + t.name + '</th>' + vals.map(function (v) {
      return '<td class="' + (v ? '' : 'zero') + '">' + v + '</td>';
    }).join('') + '</tr>';
  }).join('');
}

// 取り組み途中に「← 問題を選ぶ」を押したときは、確認メッセージを出す
function askBackToSelect() {
  if (S && S.stage !== 'clear') {
    $('confirm').classList.remove('hidden');
  } else {
    clearTimeout(advanceTimer);
    showScreen('select');
  }
}

function resetResume() {
  if (window.confirm('途中経過をリセットします。よろしいですか？')) {
    removeKey(STORAGE_KEYS.resume);
    S = null;
  }
}

function resetRecords() {
  if (window.confirm('記録とクリア済みの印をすべて消します。よろしいですか？')) {
    removeKey(STORAGE_KEYS.records);
    removeKey(STORAGE_KEYS.cleared);
  }
}

/* =====================================================
   8. 問題の進行
   ===================================================== */
function newSession(pid) {
  return {
    v: SESSION_VERSION,
    pid: pid,
    choice: null,
    method: null,
    stage: 'choice',
    mistakes: 0,
    hints: 0,
    fields: {},
    wordPool: null,   // 言葉の選択肢の並び順(1問につき1つ)
    cellPool: null,   // 表・線分図の選択肢の並び順(1問につき1つ)
    eqPool: null,     // 立式の選択肢の並び順(1問につき1つ)
    orders: { organize: {}, equation: [], solve: [] },
    activeId: null,
    msg: '',
    msgType: ''
  };
}

function stageIdx() {
  return STAGE_INDEX[S.stage];
}

function getPlan() {
  return PROBLEMS[S.pid].plan(S.choice);
}

// いまの段階で入力できる欄の順番
function currentOrder() {
  if (S.stage === 'organize') {
    return S.orders.organize[S.method] || [];
  }
  if (S.stage === 'equation') {
    return S.orders.equation;
  }
  if (S.stage === 'solve') {
    return S.orders.solve;
  }
  return [];
}

function saveResume() {
  if (S && S.stage !== 'clear') {
    saveJSON(STORAGE_KEYS.resume, { S: S });
  }
}

function openProblem(pid) {
  clearTimeout(advanceTimer);
  S = newSession(pid);
  saveResume();
  showScreen('problem');
  renderProblem();
}

function resumeProblem() {
  const r = loadJSON(STORAGE_KEYS.resume, null);
  if (!validResume(r)) {
    return;
  }
  clearTimeout(advanceTimer);
  S = r.S;
  showScreen('problem');
  renderProblem();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

// 正解1つ＋まぎらわしい選択肢(同じ段階の他の正解など)
function buildOptions(ans, pool) {
  const list = [ans];
  const seen = {};
  seen[canonicalKey(ans)] = true;
  shuffle(pool).forEach(function (s) {
    const k = canonicalKey(s);
    if (list.length < 6 && !seen[k]) {
      seen[k] = true;
      list.push(s);
    }
  });
  return shuffle(list);
}

// 同じ答えの選択肢をまとめる
function uniqueOptions(list) {
  const seen = {};
  return list.filter(function (s) {
    const k = canonicalKey(s);
    if (seen[k]) {
      return false;
    }
    seen[k] = true;
    return true;
  });
}

function makeField(def, pool) {
  const f = {
    kind: def.kind,
    tokens: [],
    caret: 0,
    word: '',
    status: 'idle',
    everWrong: false,
    selectMode: false,
    noSwitch: !!def.noSwitch,
    eq: !!def.eq,
    matchIdx: -1,
    hint: def.hint || ''
  };
  if (def.kind === 'word') {
    f.wline = def.wline;
    f.wslot = def.wslot;
    f.accept = def.accept;   // 正解の言葉を直接決める問題で使う
    f.swap = def.swap;       // 別の行の言葉(まちがえたときに専用メッセージを出す)
    f.smsg = def.smsg;
    f.fmsg = def.fmsg;
    f.pool = def.pool.slice(); // 並び順は1問につき1つ(S.wordPool)
  } else {
    f.ans = def.ans;
    f.options = def.options ? def.options.slice() : buildOptions(def.ans, pool || []);
  }
  return f;
}

function setActiveFirst() {
  const order = currentOrder();
  S.activeId = null;
  for (let i = 0; i < order.length; i++) {
    if (S.fields[order[i]].status !== 'ok') {
      S.activeId = order[i];
      return;
    }
  }
}

// 整理の欄は、方法ごとに別々に持つ(切りかえても入力が残る)
function ensureOrganize(m) {
  if (S.orders.organize[m]) {
    return;
  }
  const plan = getPlan();
  const ids = [];
  if (m === 'word') {
    const keys = Object.keys(plan.wordFields);
    if (!S.wordPool) {
      S.wordPool = shuffle(plan.wordFields[keys[0]].pool);
    }
    keys.forEach(function (k) {
      const fid = 'word:' + k;
      S.fields[fid] = makeField(Object.assign({}, plan.wordFields[k], { pool: S.wordPool }), []);
      ids.push(fid);
    });
  } else {
    // 表と線分図で欄の中身がちがう問題は、方法ごとに欄(plan.cellsBy)と選択肢の並びを持つ
    const cs = (plan.cellsBy && plan.cellsBy[m]) || plan.cells;
    const keys = (plan.order && plan.order[m]) || Object.keys(cs);
    const pk = plan.cellsBy ? m : 'all';
    S.cellPools = S.cellPools || {};
    if (!S.cellPools[pk]) {
      S.cellPools[pk] = shuffle(uniqueOptions(keys.map(function (k) {
        return cs[k].ans;
      }).concat((plan.extraOptions && plan.extraOptions[m]) || [])));
    }
    keys.forEach(function (k) {
      const fid = m + ':' + k;
      S.fields[fid] = makeField(Object.assign({}, cs[k], { options: S.cellPools[pk] }), []);
      ids.push(fid);
    });
  }
  S.orders.organize[m] = ids;
}

function ensureEquation() {
  if (S.orders.equation.length) {
    return;
  }
  const plan = getPlan();
  if (!S.eqPool) {
    S.eqPool = shuffle(plan.eqOptions);
  }
  plan.equations.forEach(function (eq, i) {
    const id = 'e' + (i + 1);
    S.fields[id] = makeField({ kind: 'expr', ans: eq, eq: true, options: S.eqPool });
    S.orders.equation.push(id);
  });
}

function ensureAnswers() {
  if (S.orders.solve.length) {
    return;
  }
  PROBLEMS[S.pid].asks.forEach(function (ask, i) {
    const id = 'a' + (i + 1);
    S.fields[id] = makeField({ kind: 'expr', ans: String(ask.value), noSwitch: true }, []);
    S.orders.solve.push(id);
  });
}

// 表の1行目を選ぶ(表の欄は、選んだあとに作る)
function chooseTableFirst(v) {
  if (S.stage !== 'organize' || S.method !== 'table' || S.tableFirst) {
    return;
  }
  S.tableFirst = v;
  delete S.orders.organize.table;
  if (S.cellPools) {
    delete S.cellPools.table;
  }
  Object.keys(S.fields).forEach(function (id) {
    if (id.indexOf('table:') === 0) {
      delete S.fields[id];
    }
  });
  ensureOrganize('table');
  setActiveFirst();
  commit();
}

// ①文字におく
function chooseX(cid) {
  S.choice = cid;
  S.stage = 'method';
  S.msg = '';
  S.msgType = '';
  S.activeId = null;
  commit();
}

// ②整理の方法(整理が終わるまで、いつでも変更できる)
function setMethod(m) {
  if (m === S.method) {
    return;
  }
  S.method = m;
  S.msg = '';
  S.msgType = '';
  if (m === 'other') {
    S.stage = 'solve';
    ensureAnswers();
  } else {
    S.stage = 'organize';
    ensureOrganize(m);
  }
  setActiveFirst();
  commit();
}

function advance() {
  if (!S) {
    return;
  }
  if (S.stage === 'organize') {
    S.stage = 'equation';
    ensureEquation();
  } else if (S.stage === 'equation') {
    S.stage = 'solve';
    ensureAnswers();
  } else if (S.stage === 'solve') {
    finishProblem();
    return;
  }
  setActiveFirst();
  S.msg = '';
  S.msgType = '';
  commit();
}

function finishProblem() {
  const p = PROBLEMS[S.pid];
  const rec = loadJSON(STORAGE_KEYS.records, {});
  const r = rec[p.typeId] || emptyRecord();
  r.tries++;
  if (S.mistakes === 0) {
    r.noMiss++;
  }
  r.methods[S.method]++;
  rec[p.typeId] = r;
  saveJSON(STORAGE_KEYS.records, rec);

  const cleared = loadJSON(STORAGE_KEYS.cleared, {});
  cleared[S.pid] = true;
  saveJSON(STORAGE_KEYS.cleared, cleared);

  removeKey(STORAGE_KEYS.resume);
  S.stage = 'clear';
  S.activeId = null;
  S.msg = 'せいかい！ ' + p.comments[S.method];
  S.msgType = 'ok';
  renderProblem();
}

function commit() {
  saveResume();
  renderProblem();
}

/* =====================================================
   9. 答え合わせ
   ===================================================== */
// ---- 言葉の式の判定 ----
// 言葉が「数」の言葉か「脚の本数など」の言葉か
function wordFamilyOf(info, w) {
  if (info.words.cnt.indexOf(w) >= 0) {
    return 'cnt';
  }
  if (info.words.val.indexOf(w) >= 0) {
    return 'val';
  }
  return null;
}

// その欄がある行は、どちらの行か。2つの文字をおくときは、先に正解になった欄で決まる
function expectedWordFamily(f, info) {
  if (info.fixed) {
    return info.fixed;
  }
  let own = null;
  let other = null;
  Object.keys(S.fields).forEach(function (id) {
    const g = S.fields[id];
    if (g.kind !== 'word' || g === f || g.status !== 'ok') {
      return;
    }
    const fam = wordFamilyOf(info, g.word);
    if (g.wline === f.wline) {
      own = fam;
    } else {
      other = fam;
    }
  });
  if (own) {
    return own;
  }
  if (other) {
    return other === 'cnt' ? 'val' : 'cnt';
  }
  return null;
}

function firstWordSlotField(line) {
  const ids = Object.keys(S.fields).filter(function (id) {
    const g = S.fields[id];
    return g.kind === 'word' && g.wline === line && g.wslot === 1;
  });
  return ids.length ? S.fields[ids[0]] : null;
}

// 選んだ言葉の正誤と、まちがえたときのメッセージ
function judgeWordChoice(f, word) {
  // 正解の言葉が決まっている問題(過不足算)
  if (f.accept !== undefined) {
    if (word === f.accept) {
      return { ok: true, msg: '' };
    }
    if (f.swap && f.swap.indexOf(word) >= 0) {
      return { ok: false, msg: f.smsg };
    }
    return { ok: false, msg: f.fmsg };
  }
  const info = getPlan().wordInfo;
  const fam = wordFamilyOf(info, word);
  const want = expectedWordFamily(f, info) || fam;
  if (!want) {
    return { ok: false, msg: info.formMsg };
  }
  // 行の種類がちがう(「数」の行に脚の本数の言葉を選んだ、など)
  if (fam !== want) {
    return { ok: false, msg: info.rowMsg[want] };
  }
  const idx = info.words[want].indexOf(word); // 0: 1つ目(つる) 1: 2つ目(かめ) 2: 全部
  if (idx === f.wslot - 1) {
    return { ok: true, msg: '' };
  }
  // 順番がちがうだけ(問題文の順番でつくる)
  if (f.wslot === 1 && idx === 1) {
    return { ok: false, msg: info.orderMsg };
  }
  if (f.wslot === 2 && idx === 0) {
    const first = firstWordSlotField(f.wline);
    if (!(first && first.status === 'ok')) {
      return { ok: false, msg: info.orderMsg };
    }
  }
  // 式の形がちがう(「全部」が＝の前に入っている、など)
  return { ok: false, msg: info.formMsg };
}

function judgeField(f) {
  if (f.kind === 'word') {
    return judgeWordChoice(f, f.word).ok;
  }
  const infix = tokensToInfix(f.tokens);
  if (f.eq) {
    const plan = getPlan();
    const used = {};
    Object.keys(S.fields).forEach(function (id) {
      const g = S.fields[id];
      if (g !== f && g.eq && g.status === 'ok') {
        used[g.matchIdx] = true;
      }
    });
    for (let k = 0; k < plan.equations.length; k++) {
      if (!used[k] && sameEquation(infix, tokensToInfix(strToTokens(plan.equations[k])))) {
        f.matchIdx = k;
        return true;
      }
    }
    return false;
  }
  return sameExpr(infix, tokensToInfix(strToTokens(f.ans)));
}

function allOk() {
  const order = currentOrder();
  return order.length > 0 && order.every(function (id) {
    return S.fields[id].status === 'ok';
  });
}

function afterCheck() {
  const cur = S.fields[S.activeId];
  if (!cur || cur.status === 'ok') {
    setActiveFirst();
  }
  if (allOk()) {
    S.msg = 'せいかい！';
    S.msgType = 'ok';
    commit();
    clearTimeout(advanceTimer);
    const pid = S.pid;
    const stage = S.stage;
    advanceTimer = setTimeout(function () {
      if (S && S.pid === pid && S.stage === stage) {
        advance();
      }
    }, 700);
  } else {
    commit();
  }
}

// 式として同じ値か(かっこをはずした形など)
function samePoly(a, b) {
  try {
    return polyKey(parsePoly(a)) === polyKey(parsePoly(b));
  } catch (e) {
    return false;
  }
}

// 方程式として同じ意味か(両辺を何倍かした式、項を移した式など)
function eqPoly(s) {
  const parts = s.split('=');
  if (parts.length !== 2) {
    throw new Error('equation');
  }
  return padd(parsePoly(parts[0]), pscale(parsePoly(parts[1]), -1));
}

function proportionalEquation(a, b) {
  try {
    const pa = eqPoly(a);
    const pb = eqPoly(b);
    const keys = Object.keys(Object.assign({}, pa, pb));
    const base = keys.filter(function (k) {
      return Math.abs(pb[k] || 0) > 1e-9;
    })[0];
    if (base === undefined) {
      return false;
    }
    const ratio = (pa[base] || 0) / pb[base];
    if (Math.abs(ratio) < 1e-9) {
      return false;
    }
    return keys.every(function (k) {
      return Math.abs((pa[k] || 0) - ratio * (pb[k] || 0)) < 1e-9;
    });
  } catch (e) {
    return false;
  }
}

// まちがえた欄ごとの、くわしいヒント
function wrongDetail(f) {
  const plan = getPlan();
  const infix = tokensToInfix(f.tokens);
  if (f.eq) {
    for (let k = 0; k < plan.equations.length; k++) {
      if (proportionalEquation(infix, tokensToInfix(strToTokens(plan.equations[k])))) {
        return '式の意味はあっているよ。整理した式を、かっこをはずしたり項をまとめたりせずに、そのまま書こう。';
      }
    }
    return plan.eqHint(S.method);
  }
  // 表・線分図: 1行目に「まちがっているところがあるよ。」、改行して2行目にくわしいヒント
  const lead = 'まちがっているところがあるよ。\n';
  if (samePoly(infix, tokensToInfix(strToTokens(f.ans)))) {
    return lead + '値はあっているよ。計算した形ではなく、計算する前の形(かっこをつけた形)で書こう。';
  }
  return lead + f.hint;
}

function checkStage() {
  if (!S || S.stage === 'clear' || S.stage === 'choice' || S.stage === 'method') {
    return;
  }
  if (S.stage === 'solve') {
    checkAnswer();
    return;
  }
  let filled = false;
  let wrong = false;
  let detail = '';
  currentOrder().forEach(function (id) {
    const f = S.fields[id];
    if (f.kind !== 'expr' || f.status === 'ok' || isEmpty(f)) {
      return;
    }
    filled = true;
    if (judgeField(f)) {
      f.status = 'ok';
    } else {
      f.status = 'ng';
      f.everWrong = true;
      wrong = true;
      if (!detail) {
        detail = wrongDetail(f);
      }
    }
  });
  if (wrong) {
    S.mistakes++;
    S.msg = detail;
    S.msgType = 'ng';
  } else if (!filled) {
    S.msg = '入力してから、答え合わせをしよう。';
    S.msgType = '';
  }
  afterCheck();
}

function wrongNote(v, i) {
  const p = PROBLEMS[S.pid];
  const asks = p.asks;
  const others = asks.map(function (a, j) {
    return j === i ? null : a;
  }).filter(Boolean).concat(p.others || []);
  for (let j = 0; j < others.length; j++) {
    if (Math.abs(v - others[j].value) < 1e-9) {
      return '「解」と「答え」の組み合わせを確認しよう。「解」があっていても「答え」を間違えたらもったいないよ。';
    }
  }
  return 'もう一度、方程式を解きなおしてみよう。ヒントも使えるよ。';
}

function checkAnswer() {
  const asks = PROBLEMS[S.pid].asks;
  let filled = false;
  let wrong = false;
  let note = '';
  S.orders.solve.forEach(function (id, i) {
    const f = S.fields[id];
    if (f.status === 'ok' || isEmpty(f)) {
      return;
    }
    const v = evalNumber(f.tokens);
    if (v === null) {
      note = '数で答えを入力しよう。';
      return;
    }
    filled = true;
    if (Math.abs(v - asks[i].value) < 1e-9) {
      f.status = 'ok';
    } else {
      f.status = 'ng';
      f.everWrong = true;
      wrong = true;
      note = wrongNote(v, i);
    }
  });
  if (wrong) {
    S.mistakes++;
    S.msg = note;
    S.msgType = 'ng';
  } else if (!filled) {
    S.msg = note || '答えを入力しよう。';
    S.msgType = '';
  }
  afterCheck();
}

function chipOptions(f) {
  return f.kind === 'word' ? f.pool : f.options;
}

function tapChip(idx) {
  const f = S.fields[S.activeId];
  if (!f || f.status === 'ok') {
    return;
  }
  const val = chipOptions(f)[idx];
  let wordResult = null;
  if (f.kind === 'word') {
    f.word = val;
    wordResult = judgeWordChoice(f, val);
  } else {
    f.tokens = strToTokens(val);
    f.caret = f.tokens.length;
  }
  if (wordResult ? wordResult.ok : judgeField(f)) {
    f.status = 'ok';
    S.msg = '';
    S.msgType = '';
  } else {
    f.status = 'ng';
    f.everWrong = true;
    S.mistakes++;
    S.msg = wordResult ? wordResult.msg : wrongDetail(f);
    S.msgType = 'ng';
  }
  afterCheck();
}

/* =====================================================
   10. 問題画面の表示
   ===================================================== */
function activeField() {
  return S && S.activeId ? S.fields[S.activeId] : null;
}

function fieldHTML(id, extraCls) {
  const f = S.fields[id];
  const active = S.activeId === id;
  let inner;
  // 選択肢から選ぶ欄にも、いま選んでいる欄がわかるようにカーソルを出す
  const showCaret = active && f.status !== 'ok';
  if (f.kind === 'word') {
    inner = esc(f.word) + (showCaret ? '<span class="caret"></span>' : '');
  } else {
    inner = renderTokens(f.tokens, f.caret, showCaret, /^a\d+$/.test(id));
  }
  const cls = 'fld ' + f.kind + (extraCls ? ' ' + extraCls : '') + (active ? ' active' : '') +
    (f.status === 'ok' ? ' ok' : f.status === 'ng' ? ' ng' : '');
  let sw = '';
  if (f.kind === 'expr' && f.everWrong && f.status !== 'ok' && !f.selectMode && !f.noSwitch) {
    sw = '<button class="sw" data-switch="' + id + '">選択肢</button>';
  }
  return '<span class="' + cls + '" data-fid="' + id + '">' + inner + '</span>' + sw;
}

// 整理が終わったあとは、入力枠をなくして文字・数だけを表示する
function organizeDone() {
  return S.method !== 'other' && stageIdx() >= 3;
}

function plainHTML(id) {
  const f = S.fields[id];
  return '<span class="plainv">' + (f.kind === 'word' ? esc(f.word) : renderTokens(f.tokens, -1, false)) + '</span>';
}

function cellHTML(id) {
  return organizeDone() ? plainHTML(id) : fieldHTML(id);
}

function tableHTML(plan) {
  if (plan.table.pick) {
    return '<div class="tpick"><div class="tpick-q">表の1行目に書くのは、どちら？</div><div class="tpick-btns">' +
      plan.table.choices.map(function (c) {
        return '<button class="pick" data-tfirst="' + c.v + '">' + c.label + '</button>';
      }).join('') + '</div></div>';
  }
  let h = '<table class="orgtable"><tr><th></th>' + plan.table.cols.map(function (c) {
    return '<th>' + c + '</th>';
  }).join('') + '</tr>';
  plan.table.rows.forEach(function (r) {
    h += '<tr><th>' + r.label + '</th>' + r.keys.map(function (k) {
      return '<td>' + cellHTML('table:' + k) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</table>';
}

function barsHTML(plan) {
  return plan.bars.map(function (b) {
    return '<div class="bar"' + (b.widthPct ? ' style="width:' + b.widthPct + '%"' : '') + '>' +
      '<div class="bar-title">' + b.title + '</div>' +
      '<div class="bar-total">' +
      (b.extra && b.extra.left ? '<span class="bar-extra-l">' + b.extra.label + cellHTML('line:' + b.extra.key) + '</span>' : '') +
      (b.totalLabel || '全部で') + cellHTML('line:' + b.total) +
      (b.extra && !b.extra.left ? '<span class="bar-extra">' + b.extra.label + cellHTML('line:' + b.extra.key) + '</span>' : '') +
      '</div>' +
      '<div class="bar-brace"></div>' +
      '<div class="bar-line">' + b.parts.map(function (p) {
        return '<div class="seg"' + (p.w ? ' style="flex:none;width:' + p.w + '%"' : '') + '>' +
          p.label + cellHTML('line:' + p.key) + '</div>';
      }).join('') + '</div></div>';
  }).join('');
}

// 言葉の式(整理が終わったあと): 言葉に半角のかっこをつけて、1行ずつ表示
function plainLineHTML(line) {
  return '<div class="wplain">' + line.parts.map(function (part) {
    if (part.frac) {
      return '<span class="wfrac"><span class="wfn">' + esc(S.fields['word:' + part.frac.num.id].word) + '</span>' +
        '<span class="wfd">' + esc(S.fields['word:' + part.frac.den.id].word) + '</span></span>';
    }
    if (!part.id) {
      return esc(part.text);
    }
    return '(' + esc(S.fields['word:' + part.id].word) + ')';
  }).join('') + '</div>';
}

function wordsHTML(plan) {
  if (organizeDone()) {
    return plan.words.map(plainLineHTML).join('');
  }
  return plan.words.map(function (line) {
    return '<div class="wline">' + line.parts.map(function (part) {
      if (part.frac) {
        return '<span class="wfrac"><span class="wfn">' + fieldHTML('word:' + part.frac.num.id) + '</span>' +
          '<span class="wfd">' + fieldHTML('word:' + part.frac.den.id) + '</span></span>';
      }
      return part.id ? fieldHTML('word:' + part.id) : '<span class="wt">' + part.text + '</span>';
    }).join('') + '</div>';
  }).join('');
}

function methodCardsHTML() {
  return '<div class="cards">' + METHODS.map(function (m) {
    return '<button class="card" data-method="' + m.id + '"><div class="card-icon">' + m.icon +
      '</div><b>' + m.name + '</b><span>' + m.desc + '</span></button>';
  }).join('') + '</div>';
}

function tabsHTML() {
  const unlocked = S.stage === 'organize' || (S.stage === 'solve' && S.method === 'other');
  return '<div class="mtabs">' + METHODS.map(function (m) {
    return '<button class="mtab' + (m.id === S.method ? ' on' : '') + '" data-tab="' + m.id + '" title="' + m.name + '"' +
      (unlocked ? '' : ' disabled') + '>' + m.icon + (m.id === S.method ? ' ' + m.name : '') + '</button>';
  }).join('') + '</div>';
}

// 「文字におく」の文: 1行に入りきらないときは「、」の切れ目で折り返す
function choiceLabelHTML(label) {
  const parts = label.split('、');
  return parts.map(function (part, i) {
    return '<span class="bun">' + esc(part + (i < parts.length - 1 ? '、' : '')) + '</span>';
  }).join('');
}

// 左ページ: ①文字におく → ②整理
function leftHTML(p) {
  const choice = p.choices.filter(function (c) {
    return c.id === S.choice;
  })[0];
  let h = '';

  // ①
  if (!choice) {
    h += '<div class="step now"><h3>① 何を文字におく？</h3><div class="pick-col">' +
      p.choices.map(function (c) {
        return '<button class="pick" data-choice="' + c.id + '">' + choiceLabelHTML(c.label) + '</button>';
      }).join('') + '</div></div>';
    return h;
  }
  h += '<div class="step"><h3>① 文字におく</h3><div class="summary">' + choiceLabelHTML(choice.label) + '</div></div>';

  // ②(整理が終わったら、選んだ方法を見出しの横に出し、ほかの方法は消す)
  const finished = !!S.method && (S.stage === 'clear' || organizeDone());
  const now = !finished && (S.stage === 'method' || S.stage === 'organize' || (S.stage === 'solve' && S.method === 'other'));
  const title = !S.method ? '② 整理の方法を選ぼう' : S.stage === 'organize' ? '② 整理しよう' : '② 整理';
  const tag = finished ? '<span class="mtag">' + methodOf(S.method).icon + ' ' + methodOf(S.method).name + '</span>' : '';
  const tabs = S.method && !finished ? tabsHTML() : '';
  h += '<div class="step' + (now ? ' now' : '') + '"><h3' + (tabs ? ' class="withtabs"' : '') + '>' + title + tag + tabs + '</h3>';
  if (!S.method) {
    h += methodCardsHTML();
  } else {
    const plan = getPlan();
    if (S.method === 'other') {
      if (!finished) {
        h += '<div class="summary">整理せず、紙などで考えて答えを求めよう。</div>';
      }
    } else if (S.method === 'table') {
      h += tableHTML(plan);
    } else if (S.method === 'line') {
      h += barsHTML(plan);
    } else {
      h += (finished ? '' : '<div class="wprompt">下の選択肢から言葉を選ぼう</div>') + wordsHTML(plan);
    }
  }
  return h + resultSlot('organize') + '</div>';
}

// 「{」は式2本の高さにぴったり合わせて伸び縮みさせる
const BRACE_SVG = '<div class="bracebox"><svg class="brace" viewBox="0 0 20 100" preserveAspectRatio="none" aria-hidden="true">' +
  '<path d="M17 2 C9 2 9 8 9 18 L9 40 C9 46 5 50 1 50 C5 50 9 54 9 60 L9 82 C9 92 9 98 17 98" ' +
  'fill="none" stroke="#1b2a3d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>';

// 右ページ: ③立式 → ④答え
function rightHTML(p) {
  const idx = stageIdx();
  let h = '';
  if (S.choice && S.method && S.method !== 'other' && idx >= 3) {
    const multi = S.orders.equation.length > 1;
    h += '<div class="step' + (S.stage === 'equation' ? ' now' : '') + '"><h3>③ 立式' + (multi ? '(2本)' : '') + '</h3>';
    // 正解したあと(④に進んだあと)は、入力枠を消して式だけを表示する
    const eqDone = idx >= 4;
    const rows = S.orders.equation.map(function (id) {
      return eqDone
        ? '<div class="eqrow plain">' + renderTokens(S.fields[id].tokens, -1, false) + '</div>'
        : '<div class="eqrow">' + fieldHTML(id, 'wide') + '</div>';
    }).join('');
    // 2本のときは連立方程式なので「{」でまとめる
    h += multi ? '<div class="eqblock">' + BRACE_SVG + '<div class="eqcol">' + rows + '</div></div>' : rows;
    h += resultSlot('equation');
    h += '</div>';
  }
  if (S.choice && idx >= 4) {
    const plan = getPlan();
    h += '<div class="step' + (S.stage === 'solve' ? ' now' : '') + '"><h3>④ 方程式を解いて、答えを入力しよう。<br>' +
      '<span class="h3sub">（ノートや紙に解いてみよう。）</span></h3>';
    h += '<div class="answerrow">' + p.asks.map(function (ask, i) {
      const id = 'a' + (i + 1);
      const val = S.stage === 'clear'
        ? '<span class="plainv">' + renderTokens(S.fields[id].tokens, -1, false, true) + '</span>'
        : fieldHTML(id);
      return ask.label + 'は' + val + ask.unit;
    }).join('<span class="gap"></span>') + '</div>';
    h += resultSlot('solve');
    // クリア後は、ヒントの文は閉じて場所をあける(見た数はリザルトに出す)
    h += (S.stage === 'clear' ? [] : plan.hints.slice(0, S.hints)).map(function (t, i) {
      return '<div class="hintbox">ヒント' + (i + 1) + '：' + esc(t) + '</div>';
    }).join('');
    h += '</div>';
  }
  return h || '<div class="placeholder">ここに、立式と答えを書いていくよ。</div>';
}

// 問題文: 文ごとに行をかえ、文のなかも文節(「|」で区切った部分)の切れ目でだけ折り返す
function probTextHTML(text) {
  return text.split('\n').map(function (sentence) {
    return '<div class="sent">' + sentence.split('|').map(function (b) {
      return '<span class="bun">' + esc(b) + '</span>';
    }).join('') + '</div>';
  }).join('');
}

function msgHTML(s) {
  return esc(s).replace(/\n/g, '<br>');
}

// リザルトメッセージは、いま入力している部分の真下に出す
function resultPlace() {
  if (S.stage === 'organize') {
    return S.msg ? 'organize' : '';
  }
  if (S.stage === 'equation') {
    return S.msg ? 'equation' : '';
  }
  if (S.stage === 'solve' || S.stage === 'clear') {
    return S.msg ? 'solve' : '';
  }
  return '';
}

function resultSlot(place) {
  return resultPlace() === place ? resultHTML('inline') : '';
}

// mode: 'inline'(入力中の部分の真下) / 'fixed'(右ページの下に固定)
function resultHTML(mode) {
  if (S.stage === 'clear') {
    return '<div class="result ok ' + mode + '"><div>' + msgHTML(S.msg) + '</div>' +
      '<div class="score">まちがえた回数：' + S.mistakes + '回　ヒントを見た数：' + S.hints + '</div>' +
      '<div class="resbtns">' +
      '<button class="btn small" data-act="retry">もう一度</button>' +
      '<button class="btn small sub" data-nav="select">問題を選ぶ</button>' +
      '<button class="btn small sub" data-nav="start">タイトルへ</button>' +
      '</div></div>';
  }
  if (!S.msg) {
    return '';
  }
  const cls = (S.msgType ? ' ' + S.msgType : '') + (S.msg === 'せいかい！' ? ' compact' : '');
  return '<div class="result ' + mode + cls + '">' + msgHTML(S.msg) + '</div>';
}

// 入力中の部分の真下に出したメッセージが見切れるときは、右ページの下の固定位置に出す
function settleResult() {
  const box = document.querySelector('#scr-problem .result.inline');
  if (!box) {
    return;
  }
  const page = box.closest('.page');
  const pr = page.getBoundingClientRect();
  const br = box.getBoundingClientRect();
  const k = pr.height / page.offsetHeight || 1;
  if (br.top >= pr.top && br.bottom <= pr.bottom - 3 * k) {
    return;
  }
  box.parentNode.removeChild(box);
  $('pageR').insertAdjacentHTML('beforeend', resultHTML('fixed'));
}

function renderChips() {
  const box = $('chips');
  const f = activeField();
  const show = f && f.status !== 'ok' && (S.stage === 'organize' || S.stage === 'equation') &&
    (f.kind === 'word' || f.selectMode);
  if (!show) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  box.classList.remove('hidden');
  box.innerHTML = chipOptions(f).map(function (opt, i) {
    const label = f.kind === 'word' ? esc(opt) : renderTokens(strToTokens(opt), -1, false);
    return '<button class="chip" data-chip="' + i + '">' + label + '</button>';
  }).join('');
}

function renderPad() {
  const f = activeField();
  const on = !!(f && f.kind === 'expr' && f.status !== 'ok' && !f.selectMode);
  Array.prototype.forEach.call($('pad').querySelectorAll('.padbtn'), function (b) {
    b.classList.toggle('disabled', !on);
  });
}

// 右下の操作ボタン(スクロールする領域の外に固定)
function renderActions() {
  const canCheck = S.stage === 'organize' || S.stage === 'equation' || S.stage === 'solve';
  const max = S.choice ? getPlan().hints.length : 0;
  const canHint = S.stage === 'solve' && S.hints < max;
  $('actions').innerHTML =
    '<button class="btn small sub" data-act="hint"' + (canHint ? '' : ' disabled') + '>ヒント(' + S.hints + '/' + max + ')</button> ' +
    '<button class="btn small" data-act="check"' + (canCheck ? '' : ' disabled') + '>答え合わせ</button>';
}

function renderProblem() {
  const p = PROBLEMS[S.pid];
  const left = $('pageL').scrollTop;
  const right = $('pageR').scrollTop;
  clearMath();
  $('probTitle').textContent = typeOf(p.typeId).name + ' 問題' + p.no;
  $('probText').innerHTML = probTextHTML(p.text);
  $('pageL').innerHTML = leftHTML(p);
  $('pageR').innerHTML = '<div class="steps">' + rightHTML(p) + '</div>';
  $('pageL').scrollTop = left;
  $('pageR').scrollTop = right;
  renderActions();
  renderChips();
  renderPad();
  typesetMath();
  fitMath();
  settleResult();
}

/* =====================================================
   11. 入力イベント
   ===================================================== */
function padInput(tok) {
  const f = activeField();
  if (!f || f.kind !== 'expr' || f.status === 'ok' || f.selectMode) {
    return;
  }
  if (tok === 'frac') {
    insertFraction(f);
  } else {
    insertToken(f, tok);
  }
  commit();
}

function focusNextField(back) {
  const order = currentOrder();
  if (!order.length) {
    return;
  }
  const i = order.indexOf(S.activeId);
  const n = order.length;
  for (let k = 1; k <= n; k++) {
    const id = order[(i + (back ? -k : k) + n * 2) % n];
    if (S.fields[id].status !== 'ok') {
      S.activeId = id;
      return;
    }
  }
}

// キーボードから入れられる演算記号
const KEY_SYMBOLS = { '+': '+', '-': '−', '*': '×', '(': '(', ')': ')', '=': '=' };

document.addEventListener('keydown', function (e) {
  if (!S || $('scr-problem').classList.contains('hidden') || S.stage === 'clear') {
    return;
  }
  if (!$('confirm').classList.contains('hidden')) {
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) {
    return;
  }
  const k = e.key;
  if (k === 'Tab') {
    focusNextField(e.shiftKey);
    e.preventDefault();
    commit();
    return;
  }
  const f = activeField();
  if (!f || f.kind !== 'expr' || f.status === 'ok' || f.selectMode) {
    return;
  }
  if (k === 'Backspace') {
    doBackspace(f);
  } else if (k === 'ArrowLeft') {
    moveCaret(f, 'left');
  } else if (k === 'ArrowRight') {
    moveCaret(f, 'right');
  } else if (k === 'ArrowUp') {
    moveCaret(f, 'up');
  } else if (k === 'ArrowDown') {
    moveCaret(f, 'down');
  } else if (k === 'Enter') {
    checkStage();
    e.preventDefault();
    return;
  } else if (/^[0-9.]$/.test(k)) {
    insertToken(f, k);
  } else if (/^[xyXY]$/.test(k)) {
    insertToken(f, k.toLowerCase());
  } else if (k === '/') {
    insertFraction(f); // 割り算は、すべて分数で入力する
  } else if (KEY_SYMBOLS[k]) {
    insertToken(f, KEY_SYMBOLS[k]);
  } else {
    return;
  }
  e.preventDefault();
  commit();
});

document.addEventListener('mousedown', function (e) {
  if (e.target.closest('.padbtn') || e.target.closest('.fld')) {
    e.preventDefault();
  }
});

document.addEventListener('click', function (e) {
  const t = e.target.closest(
    '[data-nav],[data-open],[data-act],[data-method],[data-tab],[data-choice],[data-fid],[data-switch],[data-chip],[data-pad],[data-tfirst]'
  );
  if (!t) {
    return;
  }
  const d = t.dataset;

  if (d.nav) {
    clearTimeout(advanceTimer);
    if (d.nav === 'resume') {
      resumeProblem();
    } else {
      showScreen(d.nav);
    }
  } else if (d.open) {
    openProblem(d.open);
  } else if (d.act) {
    if (d.act === 'check') {
      checkStage();
    } else if (d.act === 'hint') {
      if (S.stage === 'solve' && S.hints < getPlan().hints.length) {
        S.hints++;
        commit();
      }
    } else if (d.act === 'backSelect') {
      askBackToSelect();
    } else if (d.act === 'confirmYes') {
      $('confirm').classList.add('hidden');
      clearTimeout(advanceTimer);
      showScreen('select');
    } else if (d.act === 'confirmNo') {
      $('confirm').classList.add('hidden');
    } else if (d.act === 'retry') {
      openProblem(S.pid);
    } else if (d.act === 'resetResume') {
      resetResume();
    } else if (d.act === 'resetRecords') {
      resetRecords();
    }
  } else if (d.method) {
    setMethod(d.method);
  } else if (d.tab) {
    if (S.stage === 'organize' || (S.stage === 'solve' && S.method === 'other')) {
      setMethod(d.tab);
    }
  } else if (d.choice) {
    chooseX(d.choice);
  } else if (d.fid) {
    const f = S.fields[d.fid];
    if (f && f.status !== 'ok' && currentOrder().indexOf(d.fid) >= 0) {
      S.activeId = d.fid;
      if (f.kind === 'expr') {
        f.caret = f.tokens.length;
      }
      commit();
    }
  } else if (d.switch) {
    const f = S.fields[d.switch];
    f.selectMode = true;
    S.activeId = d.switch;
    commit();
  } else if (d.chip) {
    tapChip(parseInt(d.chip, 10));
  } else if (d.pad) {
    padInput(d.pad);
  } else if (d.tfirst) {
    chooseTableFirst(d.tfirst);
  }
});

/* =====================================================
   12. 起動
   ===================================================== */
window.addEventListener('resize', fitStage);
fitStage();
showScreen('start');
</script>
