<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章題に挑戦！</title>
<!-- MathJax 3(数式の表示)。読み込めないときは、これまでの簡易表示で動く -->
<script>
window.MathJax = {
  loader: { load: ['[tex]/html'] },
  tex: {
    packages: { '[+]': ['html'] },
    inlineMath: [['\\(', '\\)']]
  },
  chtml: { scale: 1.1 },
  options: {
    enableMenu: false,
    enableAssistiveMml: false
  },
  startup: {
    typeset: false,
    pageReady: function () {
      return MathJax.startup.defaultPageReady().then(function () {
        window.mjReady = true;
        if (typeof onMathReady === 'function') {
          onMathReady();
        }
      });
    }
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
/* ========== 色・基本 ========== */
:root {
  --ink: #1b2a3d;
  --ink-soft: #566377;
  --paper: #eef3f6;
  --grid: #d3e0e8;
  --card: #ffffff;
  --line: #c3d0da;
  --main: #2f5fb3;
  --main-dark: #234a8f;
  --main-soft: #e3ecfa;
  --marker: #ffd84d;
  --marker-soft: #fff4c2;
  --ok: #2f9e6b;
  --ok-soft: #e1f4ea;
  --ng: #d64545;
  --ng-soft: #fbe6e6;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #b9c6d0;
  color: var(--ink);
  font-family: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", sans-serif;
}

button {
  font-family: inherit;
}

/* ========== ステージ(960×640・画面に合わせて拡大縮小) ========== */
#stage {
  position: absolute;
  top: 12px;
  left: 50%;
  width: 960px;
  height: 640px;
  transform-origin: top center;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(27, 42, 61, 0.22);
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 18px;
}

.hidden {
  display: none !important;
}

/* ========== ボタン ========== */
.btn {
  padding: 12px 22px;
  border: 2px solid var(--main);
  border-radius: 6px;
  background: var(--main);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  background: var(--main-dark);
}

.btn.sub {
  background: #fff;
  color: var(--main);
}

.btn.sub:hover:not(:disabled) {
  background: var(--main-soft);
}

.btn.small {
  padding: 6px 14px;
  font-size: 16px;
}

.btn:disabled {
  border-color: #b7c0c9;
  background: #dfe4e9;
  color: #98a3af;
  cursor: not-allowed;
}

/* ========== 開始画面 ========== */
#scr-start {
  align-items: center;
  justify-content: center;
}

.hero {
  margin-bottom: 34px;
  text-align: center;
}

.hero h1 {
  display: inline-block;
  margin: 0;
  padding: 0 14px;
  font-size: 64px;
  letter-spacing: 0.04em;
  background-image: linear-gradient(transparent 62%, var(--marker) 62%, var(--marker) 92%, transparent 92%);
}

.hero p {
  margin: 14px 0 0;
  font-size: 20px;
  color: var(--ink-soft);
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 360px;
}

.menu .btn {
  width: 100%;
}

.resume-info {
  min-height: 20px;
  margin-top: -6px;
  font-size: 15px;
  color: var(--ink-soft);
  text-align: center;
}

/* ========== 共通ヘッダー ========== */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 34px;
  margin-bottom: 4px;
}

.topbar h2 {
  margin: 0;
  font-size: 22px;
}

.topbar .note {
  margin-left: auto;
  font-size: 14px;
  color: var(--ink-soft);
}

/* ========== 問題を選ぶ ========== */
.typelist {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 4px 4px 12px 0;
  overflow-y: auto;
  align-content: start;
}

.tcard {
  padding: 8px 10px 10px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--card);
}

.tname {
  margin-bottom: 6px;
  font-size: 17px;
  font-weight: bold;
}

.pbtns {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.pbtn {
  width: 34px;
  height: 34px;
  border: 2px solid var(--main);
  border-radius: 4px;
  background: #fff;
  color: var(--main);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.pbtn:hover:not(:disabled) {
  background: var(--main-soft);
}

.pbtn.done {
  border-color: var(--ok);
  background: var(--ok-soft);
  color: var(--ok);
}

.pbtn.off {
  border-color: #cdd5dc;
  background: #eef1f4;
  color: #a5afba;
  cursor: not-allowed;
}

.legend {
  margin-left: auto;
  font-size: 14px;
  color: var(--ink-soft);
}

/* ========== 記録 ========== */
.tablewrap {
  flex: 1;
  overflow-y: auto;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--card);
}

.rectable {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
}

.rectable th,
.rectable td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  text-align: center;
}

.rectable thead th {
  position: sticky;
  top: 0;
  background: var(--main-soft);
  z-index: 1;
}

.rectable tbody th {
  text-align: left;
  font-weight: bold;
}

.rectable td.zero {
  color: #aab4be;
}

/* ========== 設定 ========== */
.settings-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 560px;
  padding-top: 10px;
}

.settings-item {
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--card);
}

.settings-item p {
  margin: 0 0 10px;
  font-size: 16px;
  color: var(--ink-soft);
}

/* ========== 問題画面: 問題文 ========== */
.probtext {
  padding: 6px 12px;
  border-left: 8px solid var(--marker);
  background: var(--card);
  font-size: 21px;
  line-height: 1.4;
}

/* 問題文は、文をひとまとまりにして、入りきらないときだけ次の行へ送る(1文が長いときは文節の切れ目で折り返す) */
.sent {
  display: inline-block;
  max-width: 100%;
}

.bun {
  display: inline-block;
}

/* ========== 問題画面: ノート(左右2ページ) ========== */
.notebook {
  flex: 1;
  display: flex;
  gap: 10px;
  min-height: 0;
  margin: 6px 0 4px;
}

.page {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  overflow-y: auto;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #fff;
}

.step {
  margin-bottom: 8px;
  padding: 4px 6px 6px 10px;
  border-left: 5px solid var(--ok);
}

.step.now {
  border-left-color: var(--marker);
  background: rgba(255, 244, 194, 0.5);
}

.step h3 {
  margin: 0 0 5px;
  font-size: 15px;
  color: var(--ink-soft);
}

.step.now h3 {
  color: var(--main);
}

.summary {
  font-size: 17px;
  font-weight: bold;
}

.placeholder {
  padding: 12px 4px;
  font-size: 15px;
  color: #98a3af;
}

/* 文字におく・方法を選ぶカード */
.pick-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pick {
  padding: 10px 14px;
  border: 2px solid var(--main);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-size: 18px;
  font-weight: bold;
  text-align: left;
  cursor: pointer;
}

.pick:hover {
  background: var(--main-soft);
}

.cards {
  display: flex;
  gap: 6px;
}

.card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 2px;
  border: 2px solid #9db8e6;
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}

.card:hover {
  background: var(--main-soft);
}

.card b {
  font-size: 15px;
}

.card span {
  font-size: 11.5px;
  line-height: 1.35;
  color: var(--ink-soft);
  text-align: center;
}

.card-icon {
  font-size: 28px;
  line-height: 1;
}

/* 整理方法のタブ(整理が終わるまで切りかえ可能) */
/* 「② 整理しよう」の見出しの横に、方法のボタンをならべる */
.step h3.withtabs {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mtabs {
  display: flex;
  gap: 6px;
}

.mtab {
  padding: 3px 10px;
  border: 2px solid var(--main);
  border-radius: 14px;
  background: #fff;
  color: var(--main);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.mtab.on {
  background: var(--main);
  color: #fff;
}

.mtab:disabled {
  opacity: 0.55;
  cursor: default;
}

/* ========== 入力欄 ========== */
.fld {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 34px;
  margin: 0 3px;
  padding: 1px 8px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: #fff;
  font-size: 19px;
  vertical-align: middle;
  cursor: text;
}

.fld.word {
  min-width: 96px;
  margin: 0 2px;
  padding: 1px 6px;
  font-size: 13px;
  cursor: pointer;
}

.fld.wide {
  justify-content: flex-start;
  min-width: 280px;
}

.fld.active {
  border-color: var(--main);
  box-shadow: 0 0 0 3px var(--main-soft);
}

.fld.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.fld.ng {
  border-color: var(--ng);
  background: var(--ng-soft);
}

.sw {
  margin-left: -1px;
  padding: 2px 6px;
  border: 1.5px solid var(--main);
  border-radius: 4px;
  background: #fff;
  color: var(--main);
  font-size: 12px;
  cursor: pointer;
  vertical-align: middle;
}

.caret {
  display: inline-block;
  width: 2px;
  height: 1.2em;
  margin: 0 1px;
  background: var(--main);
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.tk.v {
  font-family: "Times New Roman", "Hiragino Mincho ProN", serif;
  font-style: italic;
}

.tk.op {
  padding: 0 0.14em;
}

.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  margin: 0 3px;
  vertical-align: middle;
}

.fn,
.fd {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0.9em;
  min-height: 1.1em;
  padding: 0 4px;
}

.fn {
  border-bottom: 2px solid var(--ink);
}

.slot {
  display: inline-block;
  width: 0.8em;
  height: 0.95em;
  border: 1.5px dashed var(--ink-soft);
  border-radius: 3px;
}

/* ========== MathJaxで表示する数式 ========== */
.mj {
  display: inline-block;
  line-height: 1.2;
  white-space: nowrap;
}

.mj mjx-container {
  margin: 0 !important;
}

/* 数字の大きさを、いまの「x」の大きさにそろえる(分数のなかは、そのままの大きさ) */
.mj mjx-mn {
  font-size: 80% !important;
}

.mj mjx-frac mjx-mn {
  font-size: 100% !important;
}

/* 分数: 分数の文字を75%にして、括線のすきまと左右の余白を詰める */
.mj mjx-frac {
  padding: 0 0.06em !important;
  font-size: 75% !important;
}

.mj mjx-line {
  margin-top: 0.02em !important;
  margin-bottom: 0.02em !important;
}

/* 分数のなかの「＋」「−」の左右のすきま */
.mj mjx-frac mjx-mo,
.mj mjx-frac mjx-mo + mjx-mn,
.mj mjx-frac mjx-mo + mjx-mi {
  margin-left: 0.12em !important;
}

/* 数式のなかのカーソル */
.mjxcaret {
  display: inline-block;
  background: var(--main);
  animation: blink 1s steps(1) infinite;
}

/* 分数の空き枠 */
.mjxslot {
  display: inline-block;
  border: 1.5px dashed var(--ink-soft);
  border-radius: 3px;
  background: transparent !important;
}

/* ========== 整理: 表(縦横に線をひく) ========== */
.orgtable {
  border-collapse: collapse;
  font-size: 16px;
}

.orgtable th,
.orgtable td {
  min-width: 70px;
  padding: 4px 8px;
  border: 2px solid var(--ink-soft);
  text-align: center;
  vertical-align: middle;
}

.orgtable th {
  background: var(--main-soft);
  font-weight: bold;
  white-space: nowrap;
}

.orgtable td .fld {
  margin: 0;
}

/* ========== 整理: 線分図 ========== */
.bar {
  width: 100%;
  margin-bottom: 6px;
}

.bar-title {
  margin-bottom: 2px;
  font-size: 14px;
  font-weight: bold;
  color: var(--main);
}

.bar-total {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 15px;
}

.bar-extra {
  margin-left: 18px;
}

.bar-extra-l {
  margin-right: 18px;
}

/* 表の1行目を選ぶ */
.tpick-q {
  margin: 6px 0;
  font-size: 15px;
  font-weight: bold;
}

.tpick-btns {
  display: flex;
  gap: 10px;
}

.tpick-btns .pick {
  flex: 1;
  width: auto;
  text-align: center;
}

/* 言葉の式の分数 */
.wfrac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  margin: 0 4px;
  vertical-align: middle;
}

.wfrac .wfn {
  padding-bottom: 3px;
  border-bottom: 2px solid var(--ink);
}

.wfrac .wfd {
  padding-top: 3px;
}

.bar-brace {
  height: 8px;
  border: 2px solid var(--main);
  border-bottom: none;
}

.bar-line {
  display: flex;
  height: 42px;
  border: 2px solid var(--main);
  border-radius: 4px;
  overflow: hidden;
}

.seg {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--main-soft);
  font-size: 15px;
}

.seg + .seg {
  border-left: 2px solid var(--main);
  background: var(--marker-soft);
}

/* ========== 整理: 言葉の式 ========== */
.wline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
  font-size: 18px;
}

.wline .wt {
  margin: 0 2px;
}

/* ========== 立式・答え ========== */
.eqrow {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  font-size: 19px;
}

.eqrow.plain {
  padding: 2px 6px;
  font-size: 21px;
}

.eqno {
  width: 24px;
  font-weight: bold;
  color: var(--main);
}

.answerrow {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  font-size: 19px;
}

.answerrow .gap {
  width: 12px;
}

.hintbox {
  margin-top: 6px;
  padding: 4px 10px;
  border-left: 5px solid var(--marker);
  background: var(--marker-soft);
  font-size: 14px;
  line-height: 1.5;
}

/* 右ページ: 上に立式・答え、いちばん下にリザルトメッセージ */
#pageR {
  display: flex;
  flex-direction: column;
}

.steps {
  flex: none;
}

.result {
  flex: none;
  min-height: 52px;
  margin-top: 6px;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--marker-soft);
  font-size: 15px;
  font-weight: bold;
  line-height: 1.4;
  color: var(--ink-soft);
}

.result.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
  color: var(--ok);
}

.result.ng {
  border-color: var(--ng);
  background: var(--ng-soft);
  color: var(--ng);
}

.result.none {
  border-color: transparent;
  background: transparent;
}

/* 入力中の部分に入りきらないときは、右ページの下に固定して出す */
.result.fixed {
  margin-top: auto;
  position: sticky;
  bottom: 0;
}

/* 「せいかい！」だけのときは、縦の幅を文字の大きさに合わせる */
.result.compact {
  min-height: 0;
  padding: 2px 12px;
  line-height: 1.3;
}

.result .score {
  margin-top: 2px;
  font-size: 13px;
  font-weight: normal;
  color: var(--ink-soft);
}

.result .resbtns {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

/* ========== 問題画面: 下の操作エリア ========== */
.bottombar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 4px;
}

.actions {
  display: flex;
  gap: 6px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 100px;
  padding: 2px;
  overflow-y: auto;
}

.chip {
  padding: 3px 12px;
  border: 2px solid var(--main);
  border-radius: 16px;
  background: #fff;
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
}

.chip:hover {
  background: var(--main-soft);
}

.pad {
  display: flex;
  gap: 6px;
}

.padbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 42px;
  padding: 0;
  border: 2px solid var(--main-dark);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
}

.padbtn:hover:not(.disabled) {
  background: var(--marker-soft);
}

.padbtn.disabled {
  border-color: #c4ccd4;
  color: #b0bac4;
  cursor: not-allowed;
}

.padbtn .frac {
  font-size: 14px;
}

.padbtn .fn,
.padbtn .fd {
  min-height: 0.9em;
  padding: 0 3px;
  line-height: 1.1;
}
/* ========== 整理が終わったあとの表示(入力枠なし) ========== */
.mtag {
  margin-left: 10px;
  padding: 1px 10px;
  border: 2px solid var(--main);
  border-radius: 12px;
  background: #fff;
  color: var(--main);
  font-size: 14px;
  font-weight: bold;
}

.wplain {
  margin-bottom: 4px;
  font-size: 17px;
  line-height: 1.5;
}

.plainv {
  font-size: 19px;
}

.seg .plainv {
  margin-left: 4px;
}

/* ========== 立式(2本)の連立の「{」 ========== */
.eqblock {
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.bracebox {
  position: relative;
  flex: none;
  width: 20px;
}

.brace {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.eqcol {
  flex: 1;
}

.eqcol .eqrow:last-child {
  margin-bottom: 0;
}

.h3sub {
  font-size: 13px;
  font-weight: normal;
  color: var(--ink-soft);
}

.wprompt {
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
  color: var(--main);
}

/* ========== 確認メッセージ ========== */
.modal {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(27, 42, 61, 0.45);
}

.modal-box {
  padding: 26px 40px 24px;
  border: 3px solid var(--main);
  border-radius: 10px;
  background: #fff;
  text-align: center;
}

.modal-box p {
  margin: 0 0 20px;
  font-size: 24px;
  font-weight: bold;
}

.modal-btns {
  display: flex;
  justify-content: center;

<script>
'use strict';

/* =====================================================
   1. 定数
   ===================================================== */
const $ = function (id) {
  return document.getElementById(id);
};

// 一度決めたlocalStorageのキーは変更しない
const STORAGE_KEYS = {
  records: 'bunshodai_records',
  cleared: 'bunshodai_cleared',
  resume: 'bunshodai_resume'
};

// 途中経過のデータ形式の版(古い形式の途中経過は読み込まない)
const SESSION_VERSION = 3;

const METHODS = [
  { id: 'word', name: '言葉の式', icon: '📝', desc: '「〇＋〇＝〇」<br>などと表す' },
  { id: 'line', name: '線分図', icon: '📏', desc: '全体と部分を<br>線で表す' },
  { id: 'table', name: '表', icon: '📊', desc: '縦横のマスに<br>整理する' },
  { id: 'other', name: 'その他', icon: '💭', desc: '直接答えを<br>考える' }
];

const TYPES = [
  { id: 'kabusoku', name: '過不足算', count: 3 },
  { id: 'sashiatsume', name: '差集め算', count: 2 },
  { id: 'tsurukame', name: 'つるかめ算', count: 3 },
  { id: 'tsurukametonbo', name: 'つるかめとんぼ算', count: 2 },
  { id: 'shokyo', name: '消去算', count: 2 },
  { id: 'daiyu', name: '代入算', count: 2 },
  { id: 'wasa', name: '和差算', count: 6 },
  { id: 'sabun', name: '差分算', count: 3 },
  { id: 'yaritori', name: 'やりとり算', count: 3 },
  { id: 'heikin', name: '平均算', count: 8 },
  { id: 'bunpai', name: '分配算', count: 7 },
  { id: 'sotou', name: '相当算', count: 5 },
  { id: 'shigoto', name: '仕事算', count: 10 },
  { id: 'nobe', name: 'のべ算', count: 6 },
  { id: 'kangen', name: '還元算', count: 3 },
  { id: 'newton', name: 'ニュートン算', count: 4 },
  { id: 'sonneki', name: '損益算', count: 12 },
  { id: 'noudo', name: '濃度算', count: 11 },
  { id: 'baisu', name: '倍数算', count: 8 },
  { id: 'baisuhenka', name: '倍数変化算', count: 1 },
  { id: 'nenrei', name: '年齢算', count: 4 },
  { id: 'deai', name: '旅人算－出会い算', count: 6 },
  { id: 'oitsuki', name: '旅人算－追いつき算', count: 5 },
  { id: 'ryusui', name: '流水算', count: 5 },
  { id: 'tsuuka', name: '通過算', count: 9 },
  { id: 'tokei', name: '時計算', count: 3 },
  { id: 'shuuki', name: '周期算', count: 9 },
  { id: 'nichireki', name: '日歴算', count: 7 }
];

// 進む順番: ①文字におく → ②整理の方法 → 整理 → ③立式 → ④答え
const STAGE_INDEX = { choice: 0, method: 1, organize: 2, equation: 3, solve: 4, clear: 5 };

// 問題データ(id → 問題)。問題は後から追加していく
const PROBLEMS = {};

let S = null;          // いま取り組んでいる問題の状態(保存対象)
let advanceTimer = null;

/* =====================================================
   2. 保存
   ===================================================== */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // 保存できない環境では何もしない
  }
}

function removeKey(key) {
  try {
    localStorage.removeItem(key);
  } catch (e) {
    // 何もしない
  }
}

function emptyRecord() {
  return { tries: 0, noMiss: 0, methods: { word: 0, line: 0, table: 0, other: 0 } };
}

function typeOf(typeId) {
  return TYPES.filter(function (t) {
    return t.id === typeId;
  })[0];
}

function methodOf(id) {
  return METHODS.filter(function (m) {
    return m.id === id;
  })[0];
}

// 読み込める形式の途中経過か
function validResume(r) {
  return !!(r && r.S && r.S.v === SESSION_VERSION && PROBLEMS[r.S.pid]);
}

/* =====================================================
   3. 数式の内部表現(トークン列)と判定
   トークン: 数字・小数点・x・y・記号 / 分数は F[ 分母 F| 分子 F]
   ===================================================== */
const INFIX_MAP = { '−': '-', '×': '*', '÷': '/', '²': '^2' };

// 答えの式の文字列をトークンにする(「÷」は分数の形に直す)
function strToTokens(s) {
  const t = s.split('');
  const isAtom = function (c) {
    return /[0-9a-z.]/.test(c);
  };
  let i = t.indexOf('÷');
  while (i >= 0) {
    // 分子: すぐ前のかっこ、または数・文字のまとまり
    let ns = i - 1;
    let num;
    if (t[i - 1] === ')') {
      let depth = 0;
      for (let j = i - 1; j >= 0; j--) {
        if (t[j] === ')') {
          depth++;
        } else if (t[j] === '(') {
          depth--;
          if (depth === 0) {
            ns = j;
            break;
          }
        }
      }
      num = t.slice(ns + 1, i - 1);
    } else {
      while (ns > 0 && isAtom(t[ns - 1])) {
        ns--;
      }
      num = t.slice(ns, i);
    }
    // 分母: すぐ後ろのかっこ、または数・文字のまとまり
    let de = i + 1;
    let den;
    if (t[de] === '(') {
      let depth = 0;
      let close = de;
      for (let j = de; j < t.length; j++) {
        if (t[j] === '(') {
          depth++;
        } else if (t[j] === ')') {
          depth--;
          if (depth === 0) {
            close = j;
            break;
          }
        }
      }
      den = t.slice(de + 1, close);
      de = close + 1;
    } else {
      while (de < t.length && isAtom(t[de])) {
        de++;
      }
      den = t.slice(i + 1, de);
    }
    t.splice.apply(t, [ns, de - ns, 'F['].concat(den, ['F|'], num, ['F]']));
    i = t.indexOf('÷');
  }
  return t;
}

function tokensToInfix(tokens) {
  let i = 0;

  function seq() {
    let out = '';
    while (i < tokens.length && tokens[i] !== 'F|' && tokens[i] !== 'F]') {
      const t = tokens[i];
      if (t === 'F[') {
        i++;
        const den = seq();
        if (tokens[i] === 'F|') {
          i++;
        }
        const num = seq();
        if (tokens[i] === 'F]') {
          i++;
        }
        out += '((' + num + ')/(' + den + '))';
      } else {
        out += INFIX_MAP[t] || t;
        i++;
      }
    }
    return out;
  }

  return seq();
}

/* --- 多項式(x, y)の計算 --- */
function padd(a, b) {
  const r = Object.assign({}, a);
  Object.keys(b).forEach(function (k) {
    r[k] = (r[k] || 0) + b[k];
  });
  return r;
}

function pscale(a, n) {
  const r = {};
  Object.keys(a).forEach(function (k) {
    r[k] = a[k] * n;
  });
  return r;
}

function pmul(a, b) {
  const r = {};
  Object.keys(a).forEach(function (ka) {
    Object.keys(b).forEach(function (kb) {
      const key = (ka + kb).split('').sort().join('');
      r[key] = (r[key] || 0) + a[ka] * b[kb];
    });
  });
  return r;
}

function pdiv(a, b) {
  const keys = Object.keys(b).filter(function (k) {
    return Math.abs(b[k]) > 1e-12;
  });
  if (keys.length !== 1 || keys[0] !== '') {
    throw new Error('divide');
  }
  return pscale(a, 1 / b['']);
}

function polyKey(p) {
  return Object.keys(p)
    .filter(function (k) {
      return Math.abs(p[k]) > 1e-9;
    })
    .sort()
    .map(function (k) {
      return k + ':' + p[k].toFixed(6);
    })
    .join(',');
}

function parsePoly(str) {
  let p = 0;

  function peek() {
    return str[p];
  }

  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') {
      const op = str[p++];
      const r = term();
      v = op === '+' ? padd(v, r) : padd(v, pscale(r, -1));
    }
    return v;
  }

  function term() {
    let v = factor();
    while (true) {
      const c = peek();
      if (c === '*') {
        p++;
        v = pmul(v, factor());
      } else if (c === '/') {
        p++;
        v = pdiv(v, factor());
      } else if (c !== undefined && /[0-9.xy(]/.test(c)) {
        v = pmul(v, factor());
      } else {
        break;
      }
    }
    return v;
  }

  function factor() {
    if (peek() === '-') {
      p++;
      return pscale(factor(), -1);
    }
    if (peek() === '+') {
      p++;
      return factor();
    }
    return power();
  }

  function power() {
    let v = atom();
    while (str[p] === '^') {
      p++;
      if (str[p] !== '2') {
        throw new Error('power');
      }
      p++;
      v = pmul(v, v);
    }
    return v;
  }

  function atom() {
    const c = peek();
    if (c === '(') {
      p++;
      const v = expr();
      if (peek() !== ')') {
        throw new Error('paren');
      }
      p++;
      return v;
    }
    if (c !== undefined && /[0-9.]/.test(c)) {
      let s = '';
      while (str[p] !== undefined && /[0-9.]/.test(str[p])) {
        s += str[p++];
      }
      const n = parseFloat(s);
      if (isNaN(n)) {
        throw new Error('number');
      }
      return { '': n };
    }
    if (c === 'x' || c === 'y') {
      p++;
      const o = {};
      o[c] = 1;
      return o;
    }
    throw new Error('atom');
  }

  const v = expr();
  if (p !== str.length) {
    throw new Error('rest');
  }
  return v;
}

// 一番外側の「＋」「−」で項に分ける(かっこの中は分けない)
function splitTerms(s) {
  const terms = [];
  let depth = 0;
  let cur = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(') {
      depth++;
    }
    if (c === ')') {
      depth--;
    }
    if (depth === 0 && (c === '+' || c === '-') && i > 0 && '*/^+-('.indexOf(s[i - 1]) < 0) {
      terms.push(cur);
      cur = c;
    } else {
      cur += c;
    }
  }
  terms.push(cur);
  return terms.filter(function (t) {
    return t !== '';
  });
}

// 項の並べ替えは同じ、項をまとめたりかっこを外したりした式は別の式として扱う
function termsKey(s) {
  return splitTerms(s)
    .map(function (t) {
      return polyKey(parsePoly(t));
    })
    .sort()
    .join('|');
}

function sameExpr(a, b) {
  try {
    return termsKey(a) === termsKey(b);
  } catch (e) {
    return false;
  }
}

function sameEquation(a, b) {
  try {
    const pa = a.split('=');
    const pb = b.split('=');
    if (pa.length !== 2 || pb.length !== 2) {
      return false;
    }
    const a1 = termsKey(pa[0]);
    const a2 = termsKey(pa[1]);
    const b1 = termsKey(pb[0]);
    const b2 = termsKey(pb[1]);
    return (a1 === b1 && a2 === b2) || (a1 === b2 && a2 === b1);
  } catch (e) {
    return false;
  }
}

// 答えの数値(文字がふくまれる・形がおかしいときは null)
function evalNumber(tokens) {
  try {
    const poly = parsePoly(tokensToInfix(tokens));
    const keys = Object.keys(poly).filter(function (k) {
      return Math.abs(poly[k]) > 1e-12;
    });
    if (keys.length === 0) {
      return 0;
    }
    if (keys.length === 1 && keys[0] === '') {
      return poly[''];
    }
    return null;
  } catch (e) {
    return null;
  }
}

function canonicalKey(s) {
  try {
    const infix = tokensToInfix(strToTokens(s));
    if (infix.indexOf('=') >= 0) {
      const parts = infix.split('=');
      return [termsKey(parts[0]), termsKey(parts[1])].sort().join('=');
    }
    return termsKey(infix);
  } catch (e) {
    return s;
  }
}

/* =====================================================
   4. 数式入力欄(キーボード＋画面上のテンキー)
   ===================================================== */
function tokenHTML(t) {
  if (t === 'x' || t === 'y') {
    return '<span class="tk v">' + t + '</span>';
  }
  if (t === '²') {
    return '<sup class="tk">2</sup>';
  }
  if ('+−×÷=()'.indexOf(t) >= 0) {
    return '<span class="tk op">' + t + '</span>';
  }
  return '<span class="tk">' + t + '</span>';
}

// MathJaxが使えるか
function mathReady() {
  return !!(window.mjReady && window.MathJax && typeof window.MathJax.typeset === 'function');
}

const TEX_MAP = { '−': '-', '×': '\\times ', '÷': '\\div ' };
const CARET_TEX = '\\class{mjxcaret}{\\rule{0.08em}{1.1em}}';
const SLOT_TEX = '\\class{mjxslot}{\\rule{0.6em}{0.8em}}';

// トークン列をTeXにする(カーソルも数式のなかに入れる)
function tokensToTeX(tokens, caret, showCaret) {
  let i = 0;

  function seq() {
    let out = '';
    let sup = false;
    while (true) {
      if (showCaret && i === caret) {
        out += CARET_TEX;
        sup = false;
      }
      if (i >= tokens.length || tokens[i] === 'F|' || tokens[i] === 'F]') {
        break;
      }
      const t = tokens[i];
      if (t === 'F[') {
        i++;
        const den = seq();
        if (tokens[i] === 'F|') {
          i++;
        }
        const num = seq();
        if (tokens[i] === 'F]') {
          i++;
        }
        out += '\\frac{' + (num || SLOT_TEX) + '}{' + (den || SLOT_TEX) + '}';
        sup = false;
      } else if (t === '²') {
        out += sup ? '{}^{2}' : '^{2}';
        sup = true;
        i++;
      } else {
        out += TEX_MAP[t] || t;
        sup = false;
        i++;
      }
    }
    return out;
  }

  let tex = '';
  while (true) {
    tex += seq();
    if (i >= tokens.length) {
      break;
    }
    i++;
  }
  return tex;
}

// 数式のHTML。MathJaxで組んだあと(typesetMath)に数式として表示される
// plain が true のとき(④答えの欄)は、MathJaxを使わない簡易表示にする
function renderTokens(tokens, caret, showCaret, plain) {
  if (plain || !mathReady()) {
    return renderTokensPlain(tokens, caret, showCaret);
  }
  if (!tokens.length) {
    return showCaret ? '<span class="caret"></span>' : '';
  }
  return '<span class="mj">\\(\\displaystyle ' + tokensToTeX(tokens, caret, showCaret) + '\\)</span>';
}

// 表・線分図の分数は、基本の大きさ(高さ28pxに合わせた大きさ)の1.25倍にする
const FIT_HEIGHT = 28;
const FRAC_SCALE = 1.25;

function fitMath() {
  if (!mathReady()) {
    return;
  }
  document.querySelectorAll('.orgtable .mj, .seg .mj, .bar-total .mj').forEach(function (el) {
    el.style.zoom = '';
    const h = el.offsetHeight;
    if (h > FIT_HEIGHT) {
      el.style.zoom = (FIT_HEIGHT / h) * FRAC_SCALE;
    }
  });
}

function mathTargets() {
  return [$('pageL'), $('pageR'), $('chips')];
}

function clearMath() {
  if (mathReady()) {
    try {
      MathJax.typesetClear(mathTargets());
    } catch (e) {
      // 何もしない
    }
  }
}

function typesetMath() {
  if (mathReady()) {
    try {
      MathJax.typeset(mathTargets());
    } catch (e) {
      // 何もしない
    }
  }
}

// MathJaxの準備ができたら、いまの画面を数式で描きなおす
function onMathReady() {
  if (S && !$('scr-problem').classList.contains('hidden')) {
    renderProblem();
  }
}

// MathJaxが使えないときの簡易表示
function renderTokensPlain(tokens, caret, showCaret) {
  let i = 0;

  function seq() {
    let html = '';
    while (true) {
      if (showCaret && i === caret) {
        html += '<span class="caret"></span>';
      }
      if (i >= tokens.length || tokens[i] === 'F|' || tokens[i] === 'F]') {
        break;
      }
      const t = tokens[i];
      if (t === 'F[') {
        i++;
        const den = seq();
        if (tokens[i] === 'F|') {
          i++;
        }
        const num = seq();
        if (tokens[i] === 'F]') {
          i++;
        }
        html += '<span class="frac"><span class="fn">' + (num || '<span class="slot"></span>') +
          '</span><span class="fd">' + (den || '<span class="slot"></span>') + '</span></span>';
      } else {
        html += tokenHTML(t);
        i++;
      }
    }
    return html;
  }

  let html = '';
  while (true) {
    html += seq();
    if (i >= tokens.length) {
      break;
    }
    i++;
  }
  return html;
}

// 対応する F| と F] の位置を探す
function matchFrac(tokens, start) {
  let depth = 0;
  let bar = -1;
  for (let i = start; i < tokens.length; i++) {
    if (tokens[i] === 'F[') {
      depth++;
    } else if (tokens[i] === 'F|' && depth === 1) {
      bar = i;
    } else if (tokens[i] === 'F]') {
      depth--;
      if (depth === 0) {
        return { bar: bar, end: i };
      }
    }
  }
  return null;
}

// いまのカーソルが分数の分母・分子のどちらにあるか
function slotAt(tokens, caret) {
  const stack = [];
  for (let i = 0; i < caret; i++) {
    if (tokens[i] === 'F[') {
      stack.push({ start: i, bar: -1 });
    } else if (tokens[i] === 'F|') {
      if (stack.length) {
        stack[stack.length - 1].bar = i;
      }
    } else if (tokens[i] === 'F]') {
      stack.pop();
    }
  }
  if (!stack.length) {
    return null;
  }
  const top = stack[stack.length - 1];
  return { kind: top.bar < 0 ? 'den' : 'num', start: top.start };
}

function touch(f) {
  if (f.status === 'ng') {
    f.status = 'idle';
  }
  // ③立式は、入力をし直してもリザルトメッセージを残しておく
  if (S.stage !== 'equation') {
    S.msg = '';
    S.msgType = '';
  }
}

function insertToken(f, t) {
  f.tokens.splice(f.caret, 0, t);
  f.caret++;
  touch(f);
}

function insertFraction(f) {
  f.tokens.splice(f.caret, 0, 'F[', 'F|', 'F]');
  f.caret += 1; // 分母から入力する
  touch(f);
}

function doBackspace(f) {
  if (f.caret <= 0) {
    return;
  }
  const prev = f.tokens[f.caret - 1];
  if (prev === 'F|' || prev === 'F]') {
    f.caret--;
  } else if (prev === 'F[') {
    if (f.tokens[f.caret] === 'F|' && f.tokens[f.caret + 1] === 'F]') {
      f.tokens.splice(f.caret - 1, 3);
    }
    f.caret--;
  } else {
    f.tokens.splice(f.caret - 1, 1);
    f.caret--;
  }
  touch(f);
}

function moveCaret(f, dir) {
  if (dir === 'left') {
    f.caret = Math.max(0, f.caret - 1);
  } else if (dir === 'right') {
    f.caret = Math.min(f.tokens.length, f.caret + 1);
  } else {
    const slot = slotAt(f.tokens, f.caret);
    if (!slot) {
      return;
    }
    const m = matchFrac(f.tokens, slot.start);
    if (!m) {
      return;
    }
    if (dir === 'up' && slot.kind === 'den') {
      f.caret = m.end;
    } else if (dir === 'down' && slot.kind === 'num') {
      f.caret = m.bar;
    }
  }
}

function isEmpty(f) {
  return f.tokens.length === 0;
}

/* =====================================================
   5. 問題データ: つるかめ算 問題1
   ===================================================== */
function coef(n, e) {
  return /^[xy0-9]+$/.test(e) ? n + e : n + '(' + e + ')';
}

// 係数つきの項(例: -2x, 40y)
function signedTerm(c, v) {
  return (c < 0 ? '−' + (-c) : String(c)) + v;
}

function signedNum(n) {
  return n < 0 ? '−' + (-n) : String(n);
}

// つるかめ算の問題を、数値と言葉(spec)から組み立てる
//   A・B: 2種類のもの(つる・かめ など)。per は1つあたりの値(脚の本数・値段・点数)
//   n: 全部の数  total: 全部の値(脚の総数・代金の合計・得点の合計)
function makeTsurukame(spec) {
  const A = spec.A;
  const B = spec.B;
  const n = spec.n;
  const T = spec.total;
  const p = A.per;
  const q = B.per;
  const xA = (T - q * n) / (p - q); // Aをxとおいたときの、xの値(Aの数)
  const yB = (T - p * n) / (q - p); // Bの数

  return {
    id: spec.id,
    typeId: 'tsurukame',
    no: spec.no,
    text: spec.text,
    asks: spec.asks,
    others: spec.others || [],
    choices: [
      { id: 'a', label: A.short + 'をx' + A.unit + 'とおく' },
      { id: 'b', label: B.short + 'をx' + B.unit + 'とおく' },
      { id: 'c', label: A.short + 'をx' + A.unit + '、' + B.short + 'をy' + B.unit + 'とおく' }
    ],
    comments: {
      word: '言葉の式にすると、' + spec.valRowName + 'の関係をたしかめながら式をつくれるね。',
      line: '線分図は、数と' + spec.valRowName + 'を別々の線で表すので、少し使いづらかったかもしれないね。',
      table: '表にすると、数と' + spec.valRowName + 'の関係がすっきり整理できるね。',
      other: 'じっくり考えて答えを出せたね。整理すると、考えがまとまりやすくなるよ。'
    },

    plan: function (cid) {
      const v = {
        a: { A: 'x', B: n + '−x' },
        b: { A: n + '−x', B: 'x' },
        c: { A: 'x', B: 'y' }
      }[cid];

      // 文字でおいたもの(おいていない方は、全部の数から引いて表す)
      const letters = {
        a: { A: 'x' },
        b: { B: 'x' },
        c: { A: 'x', B: 'y' }
      }[cid];

      // まちがえたときに出す、くわしいヒント
      function countHint(k) {
        const X = spec[k];
        const o = k === 'A' ? 'B' : 'A';
        if (letters[k]) {
          return X.cntWord + 'は、文字でおいた「' + letters[k] + '」だよ。';
        }
        return X.cntWord + 'は、全部の数(' + n + ')から' + spec[o].cntWord + '(' + letters[o] +
          ')をひいた「' + n + '−' + letters[o] + '」になるよ。';
      }

      function valueHint(k) {
        const X = spec[k];
        let t = X.valWord + 'は、(' + X.perText + ') × (' + X.cntWord + ') で表すよ。' + X.cntWord +
          'は「' + v[k] + '」だったね。';
        if (!/^[xy0-9]+$/.test(v[k])) {
          t += '計算した形ではなく、「' + coef(X.per, v[k]) + '」のようにかっこをつけて書こう。';
        }
        return t;
      }

      // 表・線分図で使う空欄(キー名は問題がちがっても共通)
      const cells = {
        tsuruCount: { kind: 'expr', ans: v.A, hint: countHint('A') },
        kameCount: { kind: 'expr', ans: v.B, hint: countHint('B') },
        totalCount: { kind: 'expr', ans: String(n), hint: spec.totalCntHint },
        tsuruLegs: { kind: 'expr', ans: coef(p, v.A), hint: valueHint('A') },
        kameLegs: { kind: 'expr', ans: coef(q, v.B), hint: valueHint('B') },
        totalLegs: { kind: 'expr', ans: String(T), hint: spec.totalValHint }
      };

      // 表は、横に「A・B・合計」、縦に「数・値」
      const table = {
        cols: [A.col, B.col, '合計'],
        rows: [
          { label: spec.numRowLabel, keys: ['tsuruCount', 'kameCount', 'totalCount'] },
          { label: spec.valRowLabel, keys: ['tsuruLegs', 'kameLegs', 'totalLegs'] }
        ]
      };

      const bars = [
        {
          title: spec.numRowLabel,
          total: 'totalCount',
          parts: [
            { label: A.col, key: 'tsuruCount' },
            { label: B.col, key: 'kameCount' }
          ]
        },
        {
          title: spec.valRowLabel,
          total: 'totalLegs',
          parts: [
            { label: A.segVal, key: 'tsuruLegs' },
            { label: B.segVal, key: 'kameLegs' }
          ]
        }
      ];

      // 言葉の式(立式と同じ式の行は書かない)
      // 言葉の選択肢の並び順は、1つの問題で1つにそろえる(S.wordPool)
      const pool = [A.cntWord, B.cntWord, spec.totalCntWord, A.valWord, B.valWord, spec.totalValWord];
      const wordFields = {};
      const words = [];
      let cnt = 0;

      // line: 何行目か(0から)  slot: 行のなかの何番目の空欄か(1〜3)
      function W(line, slot) {
        cnt++;
        const id = 'w' + cnt;
        wordFields[id] = { kind: 'word', pool: pool, wline: line, wslot: slot };
        return { id: id };
      }

      function T_(text) {
        return { text: text };
      }

      function wordLine(line) {
        return { kind: 'word', parts: [W(line, 1), T_('＋'), W(line, 2), T_('＝'), W(line, 3)] };
      }

      // 一方だけを文字でおくときは「脚の本数」の行が1本、
      // 2つの文字をおくときは「数」の行と「脚の本数」の行の2本(どちらを先に書いてもよい)
      words.push(wordLine(0));
      if (cid === 'c') {
        words.push(wordLine(1));
      }

      // 言葉の式の判定に使う言葉と、まちがえたときのメッセージ
      const wordInfo = {
        fixed: cid === 'c' ? null : 'val',
        words: {
          cnt: [A.cntWord, B.cntWord, spec.totalCntWord],
          val: [A.valWord, B.valWord, spec.totalValWord]
        },
        rowMsg: {
          cnt: '「数」についての式をつくろう。' + A.col + 'と' + B.col + 'をあわせると、全部でどうなるかな。',
          val: '「' + spec.valRowName + '」についての式をつくろう。' + A.segVal + 'と' + B.segVal +
            'をあわせると、全部で' + spec.valHow + 'になるかな。'
        },
        orderMsg: '間違っていないけど問題文の順番でつくろう。問題文を丁寧に読む練習だよ。',
        formMsg: '式の形をよくみてみよう。「〇＋〇＝〇」の形だよ。'
      };

      // 立式(言葉の式でできた式をそのまま答える)
      const eqA = p + 'x+' + coef(q, n + '−x') + '=' + T;
      const eqB = coef(p, n + '−x') + '+' + q + 'x=' + T;
      const equations = {
        a: [eqA],
        b: [eqB],
        c: ['x+y=' + n, p + 'x+' + q + 'y=' + T]
      }[cid];

      const eqOptions = {
        a: [eqA, q + 'x+' + coef(p, n + '−x') + '=' + T, p + 'x+' + q + 'x=' + T,
          p + 'x+' + q + '(' + n + '+x)=' + T, p + 'x+' + coef(q, n + '−x') + '=' + n],
        b: [eqB, coef(q, n + '−x') + '+' + p + 'x=' + T, p + 'x+' + q + 'x=' + T,
          p + '(' + n + '+x)+' + q + 'x=' + T, coef(p, n + '−x') + '+' + q + 'x=' + n],
        c: ['x+y=' + n, p + 'x+' + q + 'y=' + T, q + 'x+' + p + 'y=' + T, 'x+y=' + T, p + 'x+' + q + 'y=' + n]
      }[cid];

      // 立式をまちがえたときのヒント(整理の方法に合わせて出す)
      function eqHint(method) {
        if (method === 'word') {
          return cid === 'c'
            ? '2本の式をつくろう。1本は「数」の言葉の式、もう1本は「' + spec.valRowName +
              '」の言葉の式を、文字と数で書きかえるよ。' + A.perFull + '、' + B.perFull + 'だったね。'
            : '「' + spec.valRowName + '」の言葉の式を、文字と数で書きかえよう。' + A.perFull + '、' + B.perFull + '。' +
              A.cntWord + 'は「' + v.A + '」、' + B.cntWord + 'は「' + v.B + '」だったね。';
        }
        return cid === 'c'
          ? '2本の式をつくろう。1本は「数」の関係、もう1本は「' + spec.valRowName + '」の関係を、整理した文字と数で式にするよ。'
          : spec.valRowName + 'に注目しよう。整理した「' + coef(p, v.A) + '」と「' + coef(q, v.B) + '」をあわせた' +
            spec.valCountWord + 'が、合計の' + T + spec.valUnit + 'になるんだったね。';
      }

      // ヒント(1段階ずつ出す)
      const hints = {
        a: [
          'かっこをはずして(分配法則)、xの項と数の項をそれぞれ計算してみよう。',
          eqA + ' → ' + p + 'x+' + (q * n) + '−' + q + 'x=' + T + ' → ' + signedTerm(p - q, 'x') + '+' + (q * n) + '=' + T,
          signedTerm(p - q, 'x') + '=' + signedNum(T - q * n) + ' より x=' + xA + '。xは' + A.cntWord + '。' +
            B.cntWord + 'は ' + n + '−x で求めよう。'
        ],
        b: [
          'かっこをはずして(分配法則)、xの項と数の項をそれぞれ計算してみよう。',
          eqB + ' → ' + (p * n) + '−' + p + 'x+' + q + 'x=' + T + ' → ' + signedTerm(q - p, 'x') + '+' + (p * n) + '=' + T,
          signedTerm(q - p, 'x') + '=' + signedNum(T - p * n) + ' より x=' + yB + '。xは' + B.cntWord + '。' +
            A.cntWord + 'は ' + n + '−x で求めよう。'
        ],
        c: [
          '2つの式から、xかyのどちらかを消せないかな。x+y=' + n + ' を' + p + '倍すると、xの係数がそろうよ。',
          'x+y=' + n + ' を' + p + '倍して ' + p + 'x+' + p + 'y=' + (p * n) + '。' + p + 'x+' + q + 'y=' + T +
            ' から引くと ' + signedTerm(q - p, 'y') + '=' + signedNum(T - p * n) + '。',
          'y=' + yB + '。x+y=' + n + ' に代入すると、x+' + yB + '=' + n + '。'
        ]
      }[cid];

      return {
        cells: cells,
        table: table,
        bars: bars,
        wordFields: wordFields,
        words: words,
        wordInfo: wordInfo,
        equations: equations,
        eqOptions: eqOptions,
        eqHint: eqHint,
        hints: hints,
        extras: ['3', '6', '24', '48']
      };
    }
  };
}

/* =====================================================
   5b. 問題データ: 過不足算
   ===================================================== */
function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}

// 過不足算の問題を組み立てる
//   1つ目・2つ目の分け方: 1つ分に per1(per2) ずつ配ると、過不足 c1(c2) (あまりは+、不足は−)
//   group: 配る先(人・長椅子)  thing: 配るもの(反物・リンゴ・人)
//   文字のおき方: a=groupをx  b=thingをx  c=groupをx、thingをy
function makeKabusoku(spec) {
  const p = [spec.per1, spec.per2];
  const c = [spec.c1, spec.c2];
  const m = [Math.abs(c[0]), Math.abs(c[1])];
  const gU = spec.group.unit;
  const tU = spec.thing.unit;
  const wGroup = spec.group.word;
  const wThing = spec.thing.word;
  const w = [spec.give(p[0]), spec.give(p[1])];
  const wOne = spec.one;
  const exW = spec.exWords;
  const sit = spec.sit;
  const mixed = c[0] > 0 && c[1] < 0;
  const lcm = p[0] * p[1] / gcd(p[0], p[1]);
  const sgn = function (k) { return c[k] > 0 ? '+' : '−'; };     // 過不足の符号
  const flip = function (k) { return c[k] > 0 ? '−' : '+'; };    // 逆の符号
  const sg = [sgn(0) + m[0], sgn(1) + m[1]];                    // 「+8」「−7」
  const wC = [wThing + (c[0] > 0 ? '－' : '＋') + exW[0], wThing + (c[1] > 0 ? '－' : '＋') + exW[1]];
  const same = exW[0] === exW[1];
  const txt = function (s) { return s.replace(/÷/g, '/'); };
  const num = function (n) { return n < 0 ? '−' + (-n) : String(n); };
  const lin = function (a, d) { return a + 'x' + (d >= 0 ? '+' + d : '−' + (-d)); };
  const exNames = same ? exW[0] + 'は' + m[0] + 'と' + m[1] : exW[0] + 'は' + m[0] + '、' + exW[1] + 'は' + m[1];

  // 表の中身。kind='P': groupが文字(x)  kind='T': thingが文字(L)  both: 2つの文字(groupはx、thingはy)
  function tableParts(kind, L, both) {
    const E = {};
    [0, 1].forEach(function (i) {
      const k = i + 1;
      if (kind === 'P') {
        E['ppl' + k] = 'x';
        E['give' + k] = p[i] + 'x';
        E['tot' + k] = both ? 'y' : p[i] + 'x' + sgn(i) + m[i];
      } else {
        E['give' + k] = L + flip(i) + m[i];
        E['ppl' + k] = both ? 'x' : '(' + E['give' + k] + ')÷' + p[i];
        E['tot' + k] = L;
      }
    });
    const hint = {};
    if (kind === 'P') {
      hint.ppl = function () { return wGroup + 'は、文字でおいた「x」だよ。'; };
      hint.give = function (k) {
        return w[k - 1] + 'は、(' + spec.perPhrase(p[k - 1]) + ') × (' + wGroup + ') で表すよ。' + wGroup + 'は「x」だったね。';
      };
      hint.tot = function (k) {
        if (both) { return wThing + 'は、文字でおいた「y」だよ。'; }
        return wThing + 'は、(' + w[k - 1] + ') + (過不足) で表すよ。' + w[k - 1] + 'は「' + p[k - 1] + 'x」、過不足は「' + sg[k - 1] + '」だったね。';
      };
    } else {
      hint.tot = function () { return wThing + 'は、文字でおいた「' + L + '」だよ。'; };
      hint.give = function (k) {
        return w[k - 1] + 'は、(' + wThing + ') − (過不足) で表すよ。' + wThing + 'は「' + L + '」、過不足は「' + sg[k - 1] + '」だったね。' +
          (c[k - 1] < 0 ? 'ひく数が負の数のときは、符号に気をつけよう。' : '');
      };
      hint.ppl = function (k) {
        if (both) { return wGroup + 'は、文字でおいた「x」だよ。'; }
        return wGroup + 'は、(' + w[k - 1] + ')を(' + spec.perPhrase(p[k - 1]) + ')でわった数だよ。' + w[k - 1] + 'は「' + E['give' + k] + '」だったね。分数で書こう。';
      };
    }
    hint.ex = function (k) { return spec.exTable[k - 1]; };
    const names = kind === 'P' ? ['ppl', 'give', 'ex', 'tot'] : ['tot', 'ex', 'give', 'ppl'];
    const cells = {};
    names.forEach(function (name) {
      [1, 2].forEach(function (k) {
        cells[name + k] = { kind: 'expr', ans: name === 'ex' ? sg[k - 1] : E[name + k], hint: hint[name](k) };
      });
    });
    return {
      cells: cells,
      order: Object.keys(cells),
      table: {
        cols: [p[0] + spec.colSuffix, p[1] + spec.colSuffix],
        rows: names.map(function (name) {
          return { label: spec.rowLabels[name], keys: [name + '1', name + '2'] };
        })
      }
    };
  }

  return {
    id: spec.id,
    typeId: 'kabusoku',
    no: spec.no,
    text: spec.text,
    asks: spec.asks,
    others: [],
    choices: [
      { id: 'a', label: wGroup + 'をx' + gU + 'とおく' },
      { id: 'b', label: wThing + 'をx' + tU + 'とおく' },
      { id: 'c', label: wGroup + 'をx' + gU + '、' + wThing + 'をy' + tU + 'とおく' }
    ],
    comments: spec.comments,

    plan: function (cid) {
      const mode = { a: 'P', b: 'T', c: 'B' }[cid]; // P: groupがx  T: thingがx  B: 2つの文字
      const tl = mode === 'T' ? 'x' : 'y';
      const first = (mode === 'B' && S && S.method === 'table') ? S.tableFirst : null;

      // ---- 表 ----
      let tableDef;
      if (mode === 'B' && !first) {
        tableDef = { cells: {}, order: [], table: { pick: true, choices: [{ v: 'ppl', label: wGroup }, { v: 'thing', label: wThing }] } };
      } else if (mode === 'T') {
        tableDef = tableParts('T', 'x', false);
      } else if (mode === 'B' && first === 'thing') {
        tableDef = tableParts('T', 'y', true);
      } else {
        tableDef = tableParts('P', 'x', mode === 'B');
      }

      // ---- 線分図 ----
      const X = {};
      [0, 1].forEach(function (i) {
        const k = i + 1;
        if (mode === 'T') {
          X['give' + k] = 'x' + flip(i) + m[i];
          X['ppl' + k] = '(' + X['give' + k] + ')÷' + p[i];
          X['tot' + k] = 'x';
        } else {
          X['ppl' + k] = 'x';
          X['give' + k] = p[i] + 'x';
          X['tot' + k] = mode === 'P' ? p[i] + 'x' + sgn(i) + m[i] : 'y';
        }
      });
      const pplHint = function (k) {
        if (mode === 'T') {
          return wGroup + 'は、(' + w[k - 1] + ')を(' + spec.perPhrase(p[k - 1]) + ')でわった数だよ。' + w[k - 1] + 'は「' + X['give' + k] + '」だったね。分数で書こう。';
        }
        return wGroup + 'は、文字でおいた「x」だよ。';
      };
      const giveHint = function (k) {
        if (mode === 'T') {
          return w[k - 1] + 'は、(' + wThing + ') ' + flip(k - 1) + ' (' + exW[k - 1] + ') で表すよ。' + wThing + 'は「x」、' + exW[k - 1] + 'は「' + m[k - 1] + '」だったね。';
        }
        return w[k - 1] + 'は、(' + spec.perPhrase(p[k - 1]) + ') × (' + wGroup + ') で表すよ。' + wGroup + 'は「x」だったね。';
      };
      const totHint = function (k) {
        if (mode === 'P') {
          return wThing + 'は、(' + w[k - 1] + ') ' + sgn(k - 1) + ' (' + exW[k - 1] + ') で表すよ。' + w[k - 1] + 'は「' + p[k - 1] + 'x」、' + exW[k - 1] + 'は「' + m[k - 1] + '」だったね。';
        }
        return wThing + 'は、文字でおいた「' + tl + '」だよ。';
      };
      const cellsLine = {};
      [1, 2].forEach(function (k) {
        cellsLine['ppl' + k] = { kind: 'expr', ans: X['ppl' + k], hint: pplHint(k) };
        cellsLine['give' + k] = { kind: 'expr', ans: X['give' + k], hint: giveHint(k) };
        cellsLine['ex' + k] = { kind: 'expr', ans: String(m[k - 1]), hint: spec.exBar[k - 1] };
        cellsLine['tot' + k] = { kind: 'expr', ans: X['tot' + k], hint: totHint(k) };
      });
      const left = mode !== 'T';
      const bars = mixed
        ? [
          { title: sit[0], widthPct: 74, totalLabel: wThing, total: 'tot1',
            parts: [{ label: w[0], key: 'give1', w: 66 }, { label: exW[0], key: 'ex1', w: 34 }],
            extra: { label: wGroup, key: 'ppl1', left: left } },
          { title: sit[1], widthPct: 100, totalLabel: w[1], total: 'give2',
            parts: [{ label: wThing, key: 'tot2', w: 74 }, { label: exW[1], key: 'ex2', w: 26 }],
            extra: { label: wGroup, key: 'ppl2', left: left } }
        ]
        : [
          { title: sit[0], widthPct: 100, totalLabel: wThing, total: 'tot1',
            parts: [{ label: w[0], key: 'give1', w: 50 }, { label: exW[0], key: 'ex1', w: 50 }],
            extra: { label: wGroup, key: 'ppl1', left: left } },
          { title: sit[1], widthPct: 100, totalLabel: wThing, total: 'tot2',
            parts: [{ label: w[1], key: 'give2', w: 58 }, { label: exW[1], key: 'ex2', w: 42 }],
            extra: { label: wGroup, key: 'ppl2', left: left } }
        ];
      const lineOrder = mode === 'T'
        ? ['tot1', 'ex1', 'give1', 'ppl1', 'tot2', 'ex2', 'give2', 'ppl2']
        : ['ppl1', 'give1', 'ex1', 'tot1', 'ppl2', 'give2', 'ex2', 'tot2'];

      // ---- 言葉の式 ----
      const uniq = function (a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); };
      const pool = mode === 'T' ? uniq([wGroup, wC[0], wC[1], wOne]) : uniq([w[0], w[1], exW[0], exW[1], wThing]);
      const wordFields = {};
      let cnt = 0;
      const msg = [
        'この行は「' + sit[0] + '」ほうの式だよ。問題文の1つ目の分け方を読み直そう。',
        'この行は「' + sit[1] + '」ほうの式だよ。問題文の2つ目の分け方を読み直そう。'
      ];
      const formOp = function (k) { return '式の形をよくみてみよう。「〇' + (c[k] > 0 ? '＋' : '－') + '〇＝〇」の形だよ。'; };
      const formDiv = '式の形をよくみてみよう。「' + wGroup + '＝〇/〇」の分数の形だよ。';
      const W = function (line, slot, accept, swap, smsg, fmsg) {
        cnt++;
        const id = 'w' + cnt;
        wordFields[id] = { kind: 'word', pool: pool, wline: line, wslot: slot, accept: accept, swap: swap, smsg: smsg, fmsg: fmsg };
        return { id: id };
      };
      const T_ = function (text) { return { text: text }; };
      const words = [];
      if (mode === 'T') {
        const lines = same ? 1 : 2;
        for (let i = 0; i < lines; i++) {
          words.push({ kind: 'word', parts: [W(i, 1, wGroup, [], msg[i], formDiv), T_('＝'), {
            frac: { num: W(i, 2, wC[i], same ? [] : [wC[1 - i]], msg[i], formDiv), den: W(i, 3, wOne, [], msg[i], formDiv) }
          }] });
        }
      } else {
        [0, 1].forEach(function (i) {
          words.push({ kind: 'word', parts: [
            W(i, 1, w[i], [w[1 - i]], msg[i], formOp(i)), T_(c[i] > 0 ? '＋' : '－'),
            W(i, 2, exW[i], same ? [] : [exW[1 - i]], msg[i], formOp(i)), T_('＝'), W(i, 3, wThing, [], msg[i], formOp(i))
          ] });
        });
      }

      // ---- 立式 ----
      const jn = function (a, b) { return a + '=' + b; };
      const totP = [p[0] + 'x' + sgn(0) + m[0], p[1] + 'x' + sgn(1) + m[1]];
      const inner = function (i, s) { return '(' + s + m[i] + ')÷' + p[i]; };
      const eqP = jn(totP[0], totP[1]);
      const eqT = jn('(x' + flip(0) + m[0] + ')÷' + p[0], '(x' + flip(1) + m[1] + ')÷' + p[1]);
      const eqBp = ['y=' + totP[0], 'y=' + totP[1]];
      const eqBt = ['x=(y' + flip(0) + m[0] + ')÷' + p[0], 'x=(y' + flip(1) + m[1] + ')÷' + p[1]];
      const equations = { P: [eqP], T: [eqT], B: first === 'thing' ? eqBt : eqBp }[mode];
      const eqOptions = {
        P: [eqP,
          jn(p[0] + 'x' + flip(0) + m[0], p[1] + 'x' + flip(1) + m[1]),
          jn(totP[0], p[1] + 'x' + flip(1) + m[1]),
          jn(p[0] + 'x' + flip(0) + m[0], totP[1]),
          jn(p[1] + 'x' + sgn(0) + m[0], p[0] + 'x' + sgn(1) + m[1]),
          jn(totP[0], p[1] + 'x')],
        T: [eqT,
          jn('(x' + sgn(0) + m[0] + ')÷' + p[0], '(x' + sgn(1) + m[1] + ')÷' + p[1]),
          jn('(x' + flip(0) + m[0] + ')÷' + p[0], '(x' + sgn(1) + m[1] + ')÷' + p[1]),
          jn('(x' + sgn(0) + m[0] + ')÷' + p[0], '(x' + flip(1) + m[1] + ')÷' + p[1]),
          jn('(x' + flip(0) + m[0] + ')÷' + p[1], '(x' + flip(1) + m[1] + ')÷' + p[0]),
          jn('(x' + flip(0) + m[0] + ')×' + p[0], '(x' + flip(1) + m[1] + ')×' + p[1])],
        B: first === 'thing'
          ? [eqBt[0], eqBt[1], 'x=(y' + sgn(0) + m[0] + ')÷' + p[0], 'x=(y' + sgn(1) + m[1] + ')÷' + p[1],
            'y=(x' + flip(0) + m[0] + ')÷' + p[0], 'y=(x' + flip(1) + m[1] + ')÷' + p[1]]
          : [eqBp[0], eqBp[1], 'y=' + p[0] + 'x' + flip(0) + m[0], 'y=' + p[1] + 'x' + flip(1) + m[1],
            'x=' + p[0] + 'y' + sgn(0) + m[0], 'x=' + p[1] + 'y' + sgn(1) + m[1]]
      }[mode];

      const eqHint = function (method) {
        if (mode === 'B') {
          if (method === 'word') {
            return '2本の式をつくろう。1本は「' + sit[0] + '」とき、もう1本は「' + sit[1] + '」ときの言葉の式を、文字と数で書きかえるよ。' +
              wGroup + 'は「x」、' + wThing + 'は「y」だったね。';
          }
          return first === 'thing'
            ? '2本の式をつくろう。表の「' + spec.rowLabels.give.replace(/\(.*$/, '') + '」を、' + wGroup + 'xを使った式と、' + wThing + 'yを使った式で表して、等しいとおくよ。' + wGroup + 'xについて、分数で書こう。'
            : '2本の式をつくろう。「' + sit[0] + '」ときの関係と、「' + sit[1] + '」ときの関係を、整理した文字と数で式にするよ。';
        }
        if (mode === 'T') {
          return method === 'word'
            ? '2つの言葉の式の「' + wGroup + '」が等しいことを使うよ。' + wThing + 'は「x」、' + exNames + '、' + wOne + 'は' + p[0] + 'と' + p[1] + 'だったね。'
            : wGroup + 'に注目しよう。整理した「' + txt(X.ppl1) + '」と「' + txt(X.ppl2) + '」は、どちらも' + wGroup + 'を表しているから等しいんだったね。';
        }
        return method === 'word'
          ? '2つの言葉の式の「' + wThing + '」が等しいことを使うよ。' + w[0] + 'は「' + p[0] + 'x」、' + w[1] + 'は「' + p[1] + 'x」、' + exNames + 'だったね。'
          : wThing + 'に注目しよう。整理した「' + X.tot1 + '」と「' + X.tot2 + '」は、どちらも' + wThing + 'を表しているから等しいんだったね。';
      };

      // ---- ヒント ----
      const move = num(c[1]) + (c[0] >= 0 ? '−' + c[0] : '+' + (-c[0]));
      const step2P = p[0] + 'x−' + p[1] + 'x=' + move + ' → ' + signedTerm(p[0] - p[1], 'x') + '=' + signedNum(c[1] - c[0]);
      const d = [-c[0], -c[1]]; // xにたす数(配る数 = x + d)
      const hints = {
        P: [
          'xの項を左辺に、数の項を右辺に集めてみよう(移項)。',
          eqP + ' → ' + step2P,
          'x=' + spec.people + '。xは' + wGroup + '。' + wThing + 'は ' + totP[0] + ' で求めよう。'
        ],
        T: [
          '分数をなくすために、両辺に' + p[0] + 'と' + p[1] + 'の最小公倍数' + lcm + 'をかけてみよう。',
          txt(eqT) + ' の両辺に' + lcm + 'をかけると ' + p[1] + '(x' + num(d[0]).replace(/^(\d)/, '+$1') + ')=' + p[0] + '(x' + num(d[1]).replace(/^(\d)/, '+$1') + ')。かっこをはずして、xの項と数の項をそれぞれ計算してみよう。',
          lin(p[1], p[1] * d[0]) + '=' + lin(p[0], p[0] * d[1]) + ' より x=' + spec.total + '。xは' + wThing + '。' +
            wGroup + 'は (x' + num(d[0]).replace(/^(\d)/, '+$1') + ')/' + p[0] + ' で求めよう。'
        ],
        B: first === 'thing'
          ? [
            '2つの式の左辺はどちらも' + wGroup + 'のxだね。右辺どうしを等しいとおいて、yだけの式をつくってみよう。分数は、両辺に' + lcm + 'をかけてなくそう。',
            '(y' + num(d[0]).replace(/^(\d)/, '+$1') + ')/' + p[0] + '=(y' + num(d[1]).replace(/^(\d)/, '+$1') + ')/' + p[1] + ' の両辺に' + lcm + 'をかけると ' +
              p[1] + '(y' + num(d[0]).replace(/^(\d)/, '+$1') + ')=' + p[0] + '(y' + num(d[1]).replace(/^(\d)/, '+$1') + ')。かっこをはずして、yの項と数の項をそれぞれ計算してみよう。',
            lin(p[1], p[1] * d[0]).replace('x', 'y') + '=' + lin(p[0], p[0] * d[1]).replace('x', 'y') + ' より y=' + spec.total + '。yは' + wThing + '。' +
              wGroup + 'は x=(y' + num(d[0]).replace(/^(\d)/, '+$1') + ')/' + p[0] + ' で求めよう。'
          ]
          : [
            '2つの式の左辺はどちらも' + wThing + 'のyだね。右辺どうしを等しいとおいて、xだけの式をつくってみよう。',
            totP[0] + '=' + totP[1] + ' → ' + step2P + '。',
            'x=' + spec.people + '。y=' + totP[0] + ' に代入すると、y=' + p[0] + '×' + spec.people + sgn(0) + m[0] + '。'
          ]
      }[mode];

      return {
        cells: cellsLine,
        cellsBy: { table: tableDef.cells, line: cellsLine },
        table: tableDef.table,
        bars: bars,
        order: { line: lineOrder, table: tableDef.order },
        extraOptions: { table: [flip(0) + m[0], flip(1) + m[1]] },
        wordFields: wordFields,
        words: words,
        equations: equations,
        eqOptions: eqOptions,
        eqHint: eqHint,
        hints: hints
      };
    }
  };
}
