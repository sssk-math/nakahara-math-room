<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15001.平面図形</title>
    <script>
        /* ==========================================================================
           1. MathJaxの基本設定
           ========================================================================== */
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    
    <style>
        /* ==========================================================================
           1. 全体の基本設定【共通】
           ========================================================================== */
        /* --- 全称要素の基本設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* --- ボディの基本スタイル --- */
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            min-height: 100vh;
            overflow: hidden;
        }
        /* --- アプリコンテナのレイアウト設定 --- */
        #app-container {
            width: 960px;
            height: 640px;
            flex-shrink: 0;
            min-width: 960px;
            min-height: 640px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 12px;
            position: relative;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px 20px;
        }

        /* ==========================================================================
           2. ヘッダー・タイトル・利き手切り替えボタン【共通】
           ========================================================================== */
        /* --- ヘッダー領域のレイアウト設定 --- */
        header { 
            text-align: center; 
        }
        /* --- タイトル見出しのスタイル --- */
        h1 { 
            font-size: 24px; 
            color: #333; 
            margin-bottom: 5px; 
        }
        /* --- タイトルバーのグリッドレイアウト --- */
        .title-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 0px;
        }
        /* --- 利き手設定ボタンの共通スタイル --- */
        .title-hand-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        /* --- 利き手設定ボタンの活性状態スタイル --- */
        .title-hand-btn.active { 
            background-color: #1a73e8;
            color: white;
        }
        /* --- 左利きレイアウト（反転配置）のスタイル --- */
        .game-layout.left-handed {
            flex-direction: row-reverse;
        }

        /* ==========================================================================
           3. キー・ボタン類（キーパッド・ミニキー・送信ボタン）【共通】
           ========================================================================== */
        /* --- キーパッドのグリッド配置 --- */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(5, 56px); 
            gap: 1px; 
            margin-bottom: 8px; 
        }
        /* --- キー（ボタン）の共通スタイル --- */
        .key {
            height: 46px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }
        /* --- キーが押下された時のスタイル --- */
        .key:active:not(:disabled) { 
            background-color: #dee2e6; 
            transform: scale(0.95); 
        }
        /* --- 数字キーのスタイル --- */
        .key.num-btn { 
            font-family: 'MathJax_Main', 'Times New Roman', Times, serif; 
        }
        /* --- 演算子キーのスタイル --- */
        .key.op-btn { 
            background-color: #e7f5ff; 
            border-color: #a5d8ff; 
            color: #007bff; 
            font-size: 20px; 
        }
        /* --- 文字キーのスタイル --- */
        .key.var-btn { 
            background-color: #f3f0ff; 
            border-color: #d0bfff; 
            color: #6f42c1; 
            font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: normal; 
            font-size: 26px; 
        }
        /* --- 単位キーのスタイル --- */
        .key.unit-btn { 
            background-color: #fff0f6; 
            border-color: #ffdeeb; 
            color: #d6336c; 
            font-size: 18px; 
            font-weight: bold; 
        }
        /* --- 分数キーのスタイル --- */
        .key.frac-btn { 
            background-color: #fff9db; 
            border-color: #fff3bf; 
            color: #f59f00; 
            font-size: 18px; 
        }
        /* --- かっこキーのスタイル --- */
        .key.paren-btn { 
            background-color: #ebfbee; 
            border-color: #b2f2bb; 
            color: #2b8a3e; 
            font-size: 20px; 
        }
        /* --- 矢印キーのスタイル --- */
        .key.arrow-btn { 
            background-color: #fff3e0; 
            border-color: #ffe0b2; 
            color: #e65100; 
            font-weight: bold; 
        }
        /* --- キーパッド内ボタンの無効化状態スタイル --- */
        .keypad button:disabled { 
            background-color: #d1d5db !important; 
            color: #9ca3af !important; 
            border-color: #cbd5e1 !important; 
            cursor: not-allowed; 
            opacity: 0.6; 
            box-shadow: none !important; 
            transform: none !important; 
        }
        /* --- コントロールキー群のレイアウト --- */
        .control-keys { 
            display: grid; 
            grid-template-columns: repeat(3, 92px); 
            gap: 4px; 
            width: 100%; 
            justify-content: center; 
        }
        /* --- アクションボタンのスタイル --- */
        .key.action-btn { 
            background-color: #28a745; 
            color: #fff; 
            font-size: 18px; 
            height: 46px; 
            border-color: #1e7e34; 
            width: 100%; 
        }
        /* --- アクションボタンの判定モード時スタイル --- */
        .key.action-btn.judge-mode { 
            background-color: #007bff; 
            border-color: #0069d9; 
        }
        /* --- クリアキーのスタイル --- */
        .key.clear-btn { 
            background-color: #e9ecef; 
            font-size: 16px; 
            height: 46px; 
            width: 100%; 
            color: #333; 
        }
        /* --- 戻るボタンのスタイル --- */
        .key.action-btn-back {
            background-color: #fb8c00;
            color: #fff;
            border: none;
            font-size: 18px;
            height: 46px;
            width: 100%;
        }
        /* --- 戻るボタンの無効化状態スタイル --- */
        .key.action-btn-back:disabled {
            background-color: #ffcc80;
            color: #fff;
            cursor: not-allowed;
        }
        /* --- 小さなボタンやキーのスタイル --- */
        .key-mini {
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        /* --- 小さなボタンが押下された時のスタイル --- */
        .key-mini:active {
            background-color: #dee2e6;
        }
        /* --- クリアボタン(小)のスタイル --- */
        .key-mini.btn-clear {
            grid-column: span 2;
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-size: 14px;
        }
        /* --- クリアボタン(小)が押下された時のスタイル --- */
        .key-mini.btn-clear:active {
            background-color: #ffcdd2;
        }
        /* --- 送信ボタンのスタイル --- */
        #send-btn {
            padding: 6px 12px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 34px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
        }
        /* --- 送信ボタンが無効化された時のスタイル --- */
        #send-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ==========================================================================
           4. 画面の共通設定・開始画面【共通】
           ========================================================================== */
        /* --- 画面（app-screen）の共通レイアウト --- */
        .app-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background-color: #eceff1;
        }
        /* --- 検定画面の背景色 --- */
        #screen-kentei {
            background-color: #ffffff;
        }
        /* --- グループ選択画面のレイアウト --- */
        #screen-mondai-groups {
            justify-content: center;
            align-items: center;
        }
        /* --- 開始画面のレイアウト --- */
        .start-screen {
            justify-content: center;
            align-items: center;
            gap: 28px;
        }
        /* --- 開始画面のメインタイトル --- */
        .start-title-main {
            font-size: 18px;
            font-weight: normal;
            color: #333;
        }
        /* --- 開始画面のサブタイトル --- */
        .start-title-sub {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
        }
        /* --- 開始メニューのレイアウト --- */
        .start-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
        }
        /* --- 開始メニューボタンのスタイル --- */
        .start-menu-btn {
            height: 64px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- 開始メニューボタンが押下された時のスタイル --- */
        .start-menu-btn:active {
            transform: scale(0.97);
        }

        /* ==========================================================================
           5. サブ画面・問題選択画面【共通】
           ========================================================================== */
        /* --- サブ画面ヘッダーのレイアウト --- */
        .sub-screen-header {
            text-align: center;
            margin-bottom: 10px;
        }
        /* --- サブ画面ヘッダーの見出しスタイル --- */
        .sub-screen-header h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 0;
        }
        /* --- チュートリアル風サブボタンのスタイル --- */
        .btn-tutorial-hud-secondary {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- チュートリアル風サブボタンが押下された時のスタイル --- */
        .btn-tutorial-hud-secondary:active {
            background-color: #bbdefb;
        }
        /* --- 準備中画面のレイアウト --- */
        .placeholder-screen {
            justify-content: center;
            align-items: center;
            gap: 24px;
        }
        /* --- 練習モード無効化時のスタイル --- */
        .practice-disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(60%);
        }
        /* --- 問題選択グリッドのレイアウト --- */
        .mondai-grid {
            flex: 1;
            min-height: 0;
            max-height: 495px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            padding: 4px;
            background-color: #ffffff;
            border-radius: 8px;
        }
        /* --- 問題選択セルの基本スタイル --- */
        .grid-cell {
            position: relative;
            height: 50px;
            font-size: 11px;
            background-color: #e7f5ff;
            border: 1px solid #a5d8ff;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1px;
        }
        /* --- 問題選択セル（ロック中）のスタイル --- */
        .grid-cell.locked {
            background-color: #e9ecef;
            border-color: #ced4da;
            color: #adb5bd;
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* --- 問題選択セル（選択可能）が押下された時のスタイル --- */
        .grid-cell.available:active {
            transform: scale(0.95);
        }
        /* --- 問題選択セル（満点）のスタイル --- */
        .grid-cell.star-perfect {
            background-color: #fff9db;
            border-color: #ffe066;
        }
        /* --- 問題選択セル（ミスあり）のスタイル --- */
        .grid-cell.star-mistake {
            background-color: #f1f3f5;
            border-color: #ced4da;
        }
        /* --- 問題選択セルの星マーク配置 --- */
        .grid-cell-star {
            position: absolute;
            top: 1px;
            right: 3px;
            font-size: 12px;
        }
        /* --- 満点マークの色 --- */
        .star-perfect-mark { color: #f5a623; }
        /* --- ミスありマークの色 --- */
        .star-mistake-mark { color: #999; }
        /* --- 問題選択セルの式表示スタイル --- */
        .grid-cell-formula {
            font-size: 12px;
            line-height: 1.1;
        }
        /* --- 問題選択セルの番号表示スタイル --- */
        .grid-cell-num {
            font-size: 9px;
            color: #999;
            margin-top: 1px;
        }
        /* --- 記録画面の区分(問題選択/検定) --- */
        .kiroku-section { width: 560px; margin: 0 auto; }
        .kiroku-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            text-align: left;
        }

        /* ==========================================================================
           6. 記録画面【共通】
           ========================================================================== */
        /* --- 記録カード群のレイアウト --- */
        .kiroku-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 560px;
            margin: 0 auto;
        }
        /* --- 記録カードのスタイル --- */
        .kiroku-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px 18px;
            text-align: center;
        }
        /* --- 記録カードのラベルスタイル --- */
        .kiroku-card-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        /* --- 記録カードの値スタイル --- */
        .kiroku-card-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a73e8;
        }

        /* ==========================================================================
           7. 設定画面・リセット確認ダイアログ【共通】
           ========================================================================== */
        /* --- 設定画面のリセットボタン群のレイアウト --- */
        .settei-reset-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        /* --- リセットボタンのスタイル --- */
        .settei-reset-btn {
            width: 280px;
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            color: #c0392b;
            background-color: #fdecea;
            border: 1px solid #f1a9a0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- リセットボタンが押下された時のスタイル --- */
        .settei-reset-btn:active {
            background-color: #f8d3ce;
        }
        /* --- リセット確認ダイアログのオーバーレイ --- */
        .reset-confirm-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 12px;
        }
        /* --- リセット確認ダイアログのボックス --- */
        .reset-confirm-box {
            width: 340px;
            background-color: #fff;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        /* --- リセット確認ダイアログのメッセージ --- */
        .reset-confirm-message {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        /* --- リセット確認ダイアログのボタン群のレイアウト --- */
        .reset-confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        /* --- リセット確認ボタン（キャンセル・OK）の共通スタイル --- */
        .reset-confirm-cancel, .reset-confirm-ok {
            flex: 1;
            height: 44px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }
        /* --- リセット確認キャンセルボタンの色 --- */
        .reset-confirm-cancel {
            background-color: #e9ecef;
            color: #333;
        }
        /* --- リセット確認OKボタンの色 --- */
        .reset-confirm-ok {
            background-color: #e74c3c;
            color: #fff;
        }

        /* ==========================================================================
           8. グループ選択画面【共通】
           ========================================================================== */
        /* --- グループ選択リストのレイアウト --- */
        .group-select-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 250px;
            margin: 0 auto;
        }
        /* --- グループ選択ボタンのスタイル --- */
        .group-select-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
        }
        /* --- グループ選択ボタンが押下された時のスタイル --- */
        .group-select-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        /* --- グループ選択ボタンの無効化状態スタイル --- */
        .group-select-btn:disabled {
            background-color: #cfd8dc;
            color: #90a4ae;
            cursor: not-allowed;
        }
        /* --- グループ選択ボタンのサブテキストスタイル --- */
        .group-select-btn .group-select-sub {
            font-size: 12px;
            font-weight: normal;
        }
        /* --- グループ選択ボタンの1行目テキストスタイル --- */
        .group-select-btn > span:first-child {
           white-space: nowrap;
       }

        /* ==========================================================================
           9. メインゲーム画面・左右パネル【共通】
           ========================================================================== */
        /* --- ゲームメインレイアウトの構造設定 --- */
        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 8px;
        }
        /* --- 左パネル（問題表示エリア）のレイアウト --- */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
        }
        /* --- 右パネル（操作・キーパッドエリア）のレイアウト --- */
        .right-panel {
            width: 285px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           10. タイマー・自己ベスト・記録表示【共通】
           ========================================================================== */
        /* --- タイマーコンテナのレイアウト設定 --- */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f4;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 0px;
            font-weight: bold;
            box-sizing: border-box;
            height: 52px;
        }
        /* --- タイマー表示のスタイル --- */
        #timer-display {
            font-size: 20px;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }
        /* --- 記録表示ボックスのスタイル --- */
        .record-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border-left: 2px solid #ccc;
            padding-left: 12px;
            height: 100%;
        }
        /* --- ベスト記録更新メッセージのスタイル --- */
        #best-update-message {
            font-size: 12px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
            height: 1.2em;
            margin-bottom: 1px;
        }
        /* --- ベスト記録ラベルのコンテナスタイル --- */
        .best-label-container {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
        }

        /* ==========================================================================
           11. 生徒番号入力・ツールチップ【共通】
           ========================================================================== */
        /* --- 生徒番号入力エリアのスタイル --- */
        .number-field-wrapper {
            position: relative;
            display: inline-block;
        }
        /* --- ログイン入力フィールドの共通スタイル --- */
        .login-input {
            font-size: 15px;
            padding: 4px 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-weight: normal;
            width: 80px;
        }
        /* --- 入力フィールドのフォーカス時スタイル --- */
        .login-input:focus {
            border-color: #1a73e8;
        }
        /* --- 専用テンキー付き吹き出しのスタイル --- */
        .input-tooltip {
            display: none;
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            border: 2px solid #333333;
            color: #333333;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            width: 210px;
        }
        /* --- input-tooltipのツールチップ表示用スタイル --- */
        .input-tooltip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #333333 transparent;
        }
        /* --- ツールチップを表示状態にするスタイル --- */
        .input-tooltip.show {
            display: block;
        }
        /* --- ヒント表示用のツールチップスタイル --- */
        .tooltip-hint {
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }
        /* --- ミニテンキーのグリッド配置 --- */
        .keypad-mini {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
        }
        /* --- エラーメッセージ表示用のスタイル --- */
        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        /* ==========================================================================
           12. 問題文・出題数式表示エリア【共通】
           ========================================================================== */
        /* --- 問題表示のレイアウト --- */
        .question-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        /* --- 問題文のテキスト表示スタイル --- */
        .question-text { 
            font-size: 20px; 
            color: #333; 
            font-weight: bold; 
        }
        /* --- 進捗表示のスタイル --- */
        .progress { 
            font-size: 16px; 
            color: #666; 
        }
        /* --- 数式表示エリアのスタイル設定 --- */
        .formula-display {
            font-size: 26px;
            line-height: 1.4;
            text-align: center;
            color: #000;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ccc;
            height: auto;
            min-height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* --- 数式表示コンテナのレイアウト設定 --- */
        .formula-display mjx-container { 
            display: inline !important; 
            white-space: normal; 
        }

        /* ==========================================================================
           13. 入力枠・ステップバッジ【共通】
           ========================================================================== */
        /* --- 入力ブロックコンテナのレイアウト設定 --- */
        .input-block-container { 
            display: flex; 
            flex-direction: column; 
            gap: 0px; 
            width: 100%; 
            margin-bottom: 4px; 
        }
        /* --- 入力グループの基本レイアウト設定 --- */
        .input-box-group {
            background: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 4px 10px;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        /* --- 入力グループのフォーカス状態スタイル --- */
        .input-box-group.active-focus { 
            border-color: #007bff; 
            background-color: #f0f7ff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
        }
        /* --- 入力グループの正解確定時スタイル --- */
        .input-box-group.locked-correct { 
            border-color: #81c784; 
            background-color: #e8f5e9; 
            cursor: default; 
        }
        /* --- 入力グループの無効化状態スタイル --- */
        .input-box-group.locked-disabled { 
            border-color: #e9ecef; 
            background-color: #f8f9fa; 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        /* --- 入力グループの入力エラー時スタイル --- */
        .input-box-group.error-shake { 
            border-color: #e57373; 
            background-color: #ffebee; 
        }
        /* --- 入力ラベルのスタイル --- */
        .input-label { 
            font-size: 13px; 
            color: #495057; 
            font-weight: bold; 
            margin-bottom: 0px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        /* --- ステップバッジのスタイル --- */
        .step-badge { 
            font-size: 11px; 
            padding: 1px 6px; 
            border-radius: 4px; 
            background-color: #dee2e6; 
            color: #495057; 
        }
        /* --- 正解確定時のステップバッジスタイル --- */
        .locked-correct .step-badge { 
            background-color: #28a745; 
            color: white; 
        }

        /* ==========================================================================
           14. 数式エディタ・「＝」の縦揃えCSS Gridレイアウト【共通】
           ========================================================================== */
        /* --- 数式レンダリング領域のスタイル --- */
        .mathjax-render-zone {
            min-height: 34px;
            font-size: 22px; 
            color: #212529; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            width: 100%;
        }
        /* --- 💡 「＝」を揃えるための3列のCSS Grid設定 --- */
        .equation-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            width: 100%;
        }
        /* --- 数式の左寄せスタイル --- */
        .eq-left {
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }
        /* --- 数式の中央寄せスタイル --- */
        .eq-equal {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        /* --- 数式の右寄せスタイル --- */
        .eq-right {
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }
        /* --- 数式エディタのコンテナスタイル --- */
        .math-editor-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            width: 0;
            height: 0;
            overflow: hidden;
        }
        /* --- ワイド分数モード時のコンテナスタイル --- */
        .math-editor-container.wide-fraction-mode {
            height: 60px;
            padding: 4px 14px;
            flex-wrap: wrap;
            overflow: visible;
            border: none !important; 
            background-color: transparent !important; 
        }
        /* --- プレースホルダーのスタイル --- */
        .placeholder-text {
            font-size: 16px;
            color: #adb5bd;
        }
        /* --- エディタのテキストノードスタイル --- */
        .editor-text-node {
            border: none;
            outline: none;
            font-size: 24px; 
            text-align: left;
            min-width: 20px;
            height: 32px;
            background: transparent;
            color: #000000;
            pointer-events: none; 
        }
        /* --- エディタのテキストノードのプレースホルダー --- */
        .editor-text-node::placeholder {
            font-size: 16px;
            color: #adb5bd; 
        }
        /* --- 小さなステップボックスのスタイル --- */
        .step-box-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 34px;
            border: 2px solid #ced4da;
             border-radius: 6px;
            background-color: #f0f7ff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            margin: 0 0px;
            padding: 0 8px;
        }
        /* --- アクティブな小さなステップボックスのスタイル --- */
        .step-box-small.active-side {
            border-color: #007bff;
            background-color: #f8f9fa;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }
        /* --- 正解確定時の小さなステップボックスのスタイル --- */
        .locked-correct .step-box-small {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
        }
        /* --- エディタの分数ノードスタイル --- */
        .editor-fraction-node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            min-width: 40px;
            margin: 0 4px;
        }
        /* --- @エディタの分数線スタイル --- */
        .editor-fraction-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 2px 0;
        }
        /* --- エディタの分数入力欄のスタイル --- */
        .editor-fraction-field {
            width: 40px;
            height: 24px;
            font-size: 20px; 
            text-align: center;
            border: none !important; 
            background-color: transparent !important; 
            outline: none;
            color: #000000;
            pointer-events: none; 
            font-family: 'Times New Roman', Times, serif !important; 
            font-style: italic !important; 
        }

        /* ==========================================================================
           15. 正解・不正解メッセージ・ヒント・フッター【共通】
           ========================================================================== */
        /* --- 結果メッセージの共通スタイル --- */
        .result-message { 
            font-size: 17px; 
            font-weight: bold; 
            min-height: 40px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: auto; 
            margin-right: auto; 
            white-space: pre-wrap; 
            width: 100%; 
        }
        /* --- 正解メッセージの文字色 --- */
        .correct { color: #28a745; }
        /* --- 不正解メッセージの文字色 --- */
        .incorrect { color: #e67e22; }
        /* --- ヒント表示エリアのスタイル --- */
        .hint-container { 
            width: 100%; 
            height: 205px; 
            background-color: #fff9db; 
            border: 1px dashed #f59f00; 
            border-radius: 8px; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-bottom: 8px; 
        }
        /* --- ヒントのタイトルのスタイル --- */
        .hint-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #f59f00; 
            margin-bottom: 4px; 
            text-align: left; 
        }
        /* --- ヒント本文のスタイル --- */
        .hint-body { 
            font-size: 16px; 
            font-weight: bold;
            color: #495057; 
            line-height: 1.4; 
            text-align: left; 
        }
        /* --- フッターのスタイル --- */
        footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #000000;
            font-weight: bold;
            padding-top: 4px;
            border-top: 1px solid #cfd8dc;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: #ffffff;
            border-radius: 0 0 10px 10px;
            padding-bottom: 4px;
        }


        /* --- 図形表示（SVG）の外枠 --- */
        .fg {
            width: 100%;
            max-height: 200px;
        }
        /* --- 図形の線・点の基本スタイル --- */
        .fg .pt {
            stroke: #8a94a6;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }
        /* --- 点（●）の塗り --- */
        .fg .dot {
            fill: #8a94a6;
            stroke: none;
        }
        /* --- 強調表示（赤） --- */
        .fg .hl {
            stroke: #e53935;
        }
        /* --- 強調表示（点） --- */
        .fg .dot.hl {
            fill: #e53935;
        }
        /* --- タップ判定用の太い透明線 --- */
        .fg .hit {
            stroke: transparent;
            stroke-width: 18;
            fill: none;
            pointer-events: stroke;
        }
        /* --- 面（塗りつぶし）の基本スタイル --- */
        .fg .fl {
            fill: rgba(0,0,0,.001);
            stroke: none;
        }
        /* --- 強調表示（面） --- */
        .fg .fl.hl {
            fill: rgba(229,57,53,.2);
        }
        /* --- タップできる部分 --- */
        .fg .part {
            cursor: pointer;
        }
               /* --- 選択中の線（赤） --- */
        .fg .sel .pt {
            stroke: #e53935;
        }
        /* --- 選択中の点（赤） --- */
        .fg .sel .dot {
            fill: #e53935;
        }
        /* --- 選択中の面（赤） --- */
        .fg .sel .fl {
            fill: rgba(229, 57, 53, .2);
        }
        .fg .sel polygon.fl {
            stroke: #e53935 !important;
        }
        /* --- タップ判定用の透明線は選択中も透明のまま --- */
        .fg .sel .hit {
            stroke: transparent;
        }
        /* --- 図中のラベル文字 --- */
        .fg text {
            font-size: 15px;
            fill: #455;
        }
        /* --- 出題文のスタイル --- */
        .qprompt {
            font-size: 20px;
            font-weight: bold;
            margin: 6px 0;
        }
       /* --- 選択肢ボタンの配置（テンキーの位置・縦4つ） --- */
        .chs {
            display: flex;
            flex-direction: column;
            gap: 1px;
            width: 100%;
            height: 187px;
            margin-bottom: 8px;
        }
        /* --- 選択肢ボタン（テンキーと同じ高さ） --- */
        .chs .chb {
            height: 46px;
            padding: 0 8px;
            font-size: 18px;
        }
        /* --- 出題画面の図を大きく表示 --- */
        #qa {
            width: 100%;
        }
        #qa .fg {
            max-height: 330px;
        }
        /* --- 「ヒント」ボタンの無効化状態 --- */
        #hint-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* --- 選択肢ボタンのスタイル --- */
        .chb {
            padding: 10px;
            font-size: 19px;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }
        /* --- 選択肢ボタンのホバー時スタイル --- */
        .chb:hover {
            background: #eef6ff;
        }
        /* --- 弧ABの記号（⌒）用ラッパー --- */
        .arcab {
            position: relative;
            display: inline-block;
        }
        /* --- 弧ABの記号（⌒）の表示 --- */
        .arcab::before {
            content: '\2312';
            position: absolute;
            top: -.6em;
            left: 0;
            right: 0;
            text-align: center;
        }
        /* --- 用語カード一覧のグリッド（問題選択のグリッドと同じ高さに固定） --- */
        .ygrid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
            max-height: 495px;
            overflow: auto;
            padding: 4px;
        }
        /* --- 用語カード一覧グリッドの行の配置 --- */
        #ycards {
            align-content: start;
        }
        /* --- 用語カードのスタイル --- */
        .ycard {
            background: #fff;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }
        /* --- 用語カードの用語名 --- */
        .ycard b {
            font-size: 17px;
            display: block;
        }
        /* --- 問題選択グリッドの行の配置 --- */
        #mondai-grid-wrap {
            align-content: start;
        }
        /* --- 問題選択セルの番号表示 --- */
        #mondai-grid-wrap .grid-cell-num {
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
        /* --- 用語一覧（分野選択）画面のレイアウト --- */
        #screen-yougo {
            justify-content: center;
            align-items: center;
        }
        /* --- 用語一覧（分野選択）ボタンの配置 --- */
        #yougo-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 470px;
            gap: 12px;
        }

    </style>
</head>

                    <div class="input-tooltip" id="number-tooltip">

        const totalMs = Math.max(0, Math.round(ms));
        const min = Math.floor(totalMs / 60000);
        const sec = Math.floor((totalMs % 60000) / 1000);
        const msec = Math.floor((totalMs % 1000) / 100);
        return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
    }

        return `ベストタイム(${QUESTION_COUNT}問): ${timeStr}`;

        if (!numberField) return;

            e.stopPropagation();
            if (isConfirmed || numberField.value !== '') {
                numberField.value = '';
                isConfirmed = false;
                errorDisplay.style.display = 'none';
                updateSendButtonState();
            }
            tooltip.classList.add('show');
            numberField.focus();
        });

        tooltip.addEventListener('click', (e) => { e.stopPropagation(); });

                numberField.blur();
                updateSendButtonState();
            }
        });

        if (!numberField) return;
        let currentVal = numberField.value;

        if (currentVal.length === 4) {
            currentVal = '';
            errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        if (currentVal.length === 4) {
            const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
            if (isValid) completeInput(currentVal); 
            else errorDisplay.style.display = 'block';
        }

        isConfirmed = true;

        numberField.blur();
        updateSendButtonState();

            numberField.value = currentVal.slice(0, -1);

        updateSendButtonState();

        const sendBtnBottom = document.getElementById('action-btn');   
    
        if (sendBtnTop && sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
        
        if (sendBtnTop) sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
            if (sendBtnBottom) {
                sendBtnBottom.disabled = !canSend;
                if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                else sendBtnBottom.className = "key action-btn judge-mode"; 
            }
        }
    }
    function executeFormSubmit(num, timeText, stageCount) {

        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
            [FORM_NUM_ID]:         num,                               
            [FORM_TIME_ID]:        timeText,    
            [FORM_STAGE_COUNT_ID]: stageCount                  
        };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        
        setTimeout(() => { document.body.removeChild(form); }, 1000);
    }

        const numInput = numberField ? numberField.value.trim() : "";

            return;
        }

        const sendBtnBottom = document.getElementById('action-btn'); 
        
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信中";
            sendBtnTop.disabled = true;

            sendBtnBottom.textContent = "送信中";

    function svgOf(sc, hl, tap, only) {
        const S = SC[sc];
        let h = '<svg class="fg" viewBox="0 0 320 220">';
        S.p.forEach((p) => {
            const [id, k, ...a] = p;
            if (only && k !== 'd' && !hl.includes(id) && !(CTX[only] || []).includes(id)) return;
            const on = hl.includes(id) ? ' hl' : '';
            let e,
                hit = '';
            if (k === 'p' || k === 'd') e = `<circle cx="${a[0]}" cy="${a[1]}" r="6" class="pt dot${on}"/>`;
            else if (k === 'l') e = `<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" class="pt${on}"/>`;
            else if (k === 'a') e = `<path d="${a[0]}" class="pt${on}"/>`;
            else if (k === 'o') e = `<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" class="pt${on}"/>`;
            else if (k === 'f') e = `<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" class="fl${on}"/>`;
            else if (k === 'q') e = `<path d="${a[0]}" class="fl${on}"/>`;
            else
                e = `<polygon points="${a[0]}" class="fl${on}" style="stroke:${on ? '#e53935' : '#8a94a6'};stroke-width:3"/>`;
            if (tap && k !== 'd') {
                if (k !== 'f' && k !== 'g' && k !== 'q') hit = e.replace('class="pt', 'class="hit pt');
                h += `<g class="part" data-id="${id}" onclick="tapPart('${id}',this)">${e}${hit.replace(/ dot| hl/g, '')}</g>`;
            } else h += e;
        });
        if (!only) S.L.forEach((l) => (h += `<text x="${l[0]}" y="${l[1]}">${l[2]}</text>`));
        return h + '</svg>';
    }

    const TERMS = TD.map((a) => ({ g: a[0], n: a[1], d: a[2], s: a[3], t: a[4], h: a[5] || a[4], m: a[6], cs: a[7], q: a[8] }));
    const SD = [

    const ITEMS = { 1: TERMS, 2: TERMS.filter((t) => t.t.length), 3: SYM },
        FN = { 1: '①図を見て用語を選ぶ', 2: '②用語を見て図をタップ', 3: '③表し方を選ぶ' };
    const sg = (a, b) =>
        a.g === b.g ||
        (a.g === '図形と距離' && (b.g === '基本' || b.g === '位置関係')) ||

    const plain = (s) => s.replace(/<[^>]+>/g, '');
    let PR = ld('hm_pr', {}),

    function chunks(f, k) {
        const N = ITEMS[f].length;
        if (!SETS[f] || SETS[f].n !== N) {
            SETS[f] = { n: N, o: Array.from({ length: 9 }, () => shuf([...Array(N).keys()])) };
            sv('hm_sets', SETS);
        }
        const od = k === 1 ? [...Array(N).keys()] : SETS[f].o[k - 2],
            r = [];
        for (let i = 0; i < od.length; i += 1) r.push(od.slice(i, i + 1));
        return r;
    }

    function openMondaiSelect() {

    function enterMondaiGrid(f) {
        document.getElementById('mondai-group-title').textContent = '📚 ' + FN[f];
        showScreen('screen-mondai');
        let h = '',
            prev = 1;
        for (let k = 1; k <= 10; k++)
            chunks(f, k).forEach((c, j) => {
                const s = PR[f + '-' + k + '-' + j] || 0,
                    un = prev >= 1;
                prev = s;
                h += `<button type="button" class="grid-cell ${!un ? 'locked' : s == 2 ? 'star-perfect' : s == 1 ? 'star-mistake' : 'available'}" ${un ? `onclick="startSet(${f},${k},${j})"` : 'disabled'}>${un && s ? `<span class="grid-cell-star ${s == 2 ? 'star-perfect-mark' : 'star-mistake-mark'}">${s == 2 ? '★' : '☆'}</span>` : ''}<span class="grid-cell-num">${k}-${j + 1}</span></button>`;

    let midFn = null;

    function setAct(t, f, c = 'action-btn judge-mode') {

        b.className = 'key ' + c;

    function setMid(t, f, c = 'clear-btn') {

    function handleMid() {

    function startNextSet() {
        const f = cur.f,

            j = cur.j + 1;
        if (j < chunks(f, k).length) return startSet(f, k, j);
        if (k < 10) return startSet(f, k + 1, 0);
        enterMondaiGrid(f);

    function startSet(f, k, j) {
        mode = 'p';

    function beginQuiz() {
        qi = 0;
        showScreen('screen-kentei');

    function bump(n) {
        CNT[n] = (CNT[n] || 0) + 1;
        sv('hm_cnt', CNT);
    }

    function loadQ() {
        wrong = 0;
        sel = [];
        locked = false;
        const q = Q[qi],
            it = ITEMS[q.f][q.i],
            key = q.f + '_' + q.i;
        if (mode === 'k' || !seen[key]) {
            seen[key] = 1;
            bump(plain(it.n));
        }
        document.getElementById('progress').textContent = `${qi + 1} / ${Q.length}問　${FN[q.f]}`;
        document.getElementById('result-message').textContent = '';
        document.getElementById('result-message').className = 'result-message';
        document.getElementById('hint-text').textContent = '';
       const qa = document.getElementById('qa');
        const chs = document.getElementById('chs');
        currentControlState = 'playing';
        setAct('判定する', null);
        setMid('ヒント', showHint);
        chs.innerHTML = '';
        if (q.f === 2) {
            setAct('判定する', null);
            qa.innerHTML =
                `<div class="qprompt">「${it.q || it.n}」を${it.m ? 'すべて' : ''}タップして「判定する」を押そう</div>` +
                svgOf(it.s, [], true);
        } else {
            const same = shuf(ITEMS[q.f].filter((x) => x !== it && sg(x, it))).slice(0, 2),
                diff = shuf(ITEMS[q.f].filter((x) => !sg(x, it))).slice(0, 1);
            CH = shuf([it, ...same, ...diff]);
            qa.innerHTML =
                `<div class="qprompt">${q.f === 1 ? '赤い部分は何ですか？' : 'この図の表し方は？'}</div>` +
                svgOf(it.s, it.h, false);
            chs.innerHTML = CH.map((c, i) => `<button class="chb" onclick="choose(${i})">${c.n}</button>`).join('');
        }
    }

   function showHint() {
        if (locked) return;
        document.getElementById('hint-text').innerHTML = cq().d;
    }

    function cq() {
        const q = Q[qi];
        return ITEMS[q.f][q.i];
    }

    function choose(i) {
        if (locked) return;
        const it = cq();
        if (CH[i] === it) ok();
        else miss(!sg(CH[i], it));
    }

    function tapPart(id, el) {
        if (locked) return;
        const it = cq();
        const x = sel.indexOf(id);
        if (x >= 0) {
            sel.splice(x, 1);
            el.classList.remove('sel');
        } else {
            if (!it.m) {
                sel = [];
                document.querySelectorAll('.fg .sel').forEach((e) => e.classList.remove('sel'));
            }
            sel.push(id);
            el.classList.add('sel');
        }
        setAct('判定する', sel.length ? decide : null);
    }

    function decide() {
        if (locked) return;
        const it = cq();
        const hit = it.m ? it.t.every((x) => sel.includes(x)) && sel.length === it.t.length : sel.length === 1 && it.t.includes(sel[0]);
        if (hit) ok();
        else {
            sel = [];
            document.querySelectorAll('.fg .sel').forEach((e) => e.classList.remove('sel'));
            setAct('判定する', null);
            miss(false);
        }
    }

    function msg(t, c) {
        const r = document.getElementById('result-message');
        r.textContent = t;
        r.className = 'result-message ' + c;
    }

    function ok() {
        locked = true;
        const it = cq();
        msg('正解！', 'correct');
        document.getElementById('hint-text').innerHTML = `<b>${it.n}</b>：${it.d}`;
        if (mode === 'k') ksc++;
        if (mode === 'p' && qi + 1 >= Q.length) {
            const pk = cur.f + '-' + cur.k + '-' + cur.j;
            PR[pk] = Math.max(PR[pk] || 0, anyWrong ? 1 : 2);
            sv('hm_pr', PR);
        }
       if (qi + 1 < Q.length) {
            setAct('次の問題', next);
            setMid('ヒント', null);
        } else if (mode === 'k') {
            next();
        } else {
            setAct('終了', null, 'clear-btn');
            setMid('次へ', startNextSet, 'action-btn judge-mode');
        }
    }

    function miss(fatal) {
        anyWrong = true;
        wrong++;
        if (fatal || wrong >= 3) return force();
        msg('不正解。もう一度！', 'incorrect');
    }

    function force() {
        locked = true;
        const it = cq();
        document.getElementById('hint-text').innerHTML = `<b>${it.n}</b>：${it.d}`;
        if (mode === 'p') {
            msg('強制終了。答えは「' + plain(it.n) + '」。この問題を最初からやり直します。', 'incorrect');
            setAct('やり直す', () => {
                seen = {};
                anyWrong = false;
                beginQuiz();
            });
            setMid('ヒント', null);
        } else {
            clearInterval(tmr);
            kenteiAttemptCount++;
            correctStreakCount = 0;
            saveKenteiRecords();
            msg('ここで検定終了。答えは「' + plain(it.n) + '」。', 'incorrect');
           setFinished();
        }
    }

    function next() {
        qi++;
        if (qi < Q.length) return loadQ();
        if (mode === 'p') {
            const k = cur.f + '-' + cur.k + '-' + cur.j,
                s = anyWrong ? 1 : 2;
            PR[k] = Math.max(PR[k] || 0, s);
            sv('hm_pr', PR);
            msg('クリア！' + (s == 2 ? '★' : '☆'), 'correct');
            setAct('問題選択へ', () => enterMondaiGrid(cur.f));
        } else {
            clearInterval(tmr);
            const ms = Date.now() - t0,
                tx = formatMs(ms);
            lastClearTimeText = tx;
            score = ksc;
            isCorrectState = true;
            kenteiAttemptCount++;
            CLR++;
            sv('hm_clr', CLR);
            correctStreakCount++;
            maxStreakCount = Math.max(maxStreakCount, correctStreakCount);
            if (bestNormalTimeMs === null || ms < bestNormalTimeMs) {
                bestNormalTimeMs = ms;
                document.getElementById('best-normal-display').innerText = bestTimeText(tx);
                document.getElementById('best-update-message').innerText = '🎉 ベスト更新！';
            }
            saveKenteiRecords();
            updateSendButtonState();
            msg(`検定クリア！ タイム ${tx}`, 'correct');
           setFinished();
        }
    }

    function enterKenteiScreen() {
        mode = 'k';
        showScreen('screen-kentei');
        document.getElementById('timer-container-area').classList.remove('practice-disabled');
        document.getElementById('timer-display').innerText = '⏱️ 00:00.0';
        document.getElementById('qa').innerHTML = '<div class="qprompt">スタートを押すと、6問の検定が始まります。</div>';
        document.getElementById('chs').innerHTML = '';
        locked = true;
        ['progress', 'result-message', 'hint-text'].forEach((i) => (document.getElementById(i).textContent = ''));
       currentControlState = 'start';
        setAct('スタート', startKentei, 'action-btn');
        setMid('ヒント', null);
    }

    function startKentei() {
        mode = 'k';
        clearInterval(tmr);
        const used = new Set(),
            out = [];
        [1, 2, 3].forEach((f) => {
            ITEMS[f]
                .map((it, i) => ({ f, i, n: plain(it.n) }))
                .filter((x) => !used.has(x.n))
                .sort((a, b) => (CNT[a.n] || 0) - (CNT[b.n] || 0) || Math.random() - 0.5)
                .slice(0, 2)
                .forEach((x) => {
                    used.add(x.n);
                    out.push({ f: x.f, i: x.i });
                });
        });
        Q = shuf(out);
        ksc = 0;
        isCorrectState = false;
        window.isAlreadySubmitted = false;
        numberField.disabled = false;
        const sb = document.getElementById('send-btn');
        sb.textContent = '送信';
        sb.disabled = true;
        document.getElementById('best-update-message').innerText = '';
        t0 = Date.now();
        tmr = setInterval(() => {
            document.getElementById('timer-display').innerText = '⏱️ ' + formatMs(Date.now() - t0);
        }, 100);
        beginQuiz();
    }
    let ksc = 0;

    function goBackQ() {
        clearInterval(tmr);
        if (mode === 'p') enterMondaiGrid(cur.f);
        else showScreen('screen-start');
    }

    function showYougo() {
        showScreen('screen-yougo');
        document.getElementById('yougo-wrap').innerHTML = [...new Set(TERMS.map((t) => t.g))]
            .map(
                (g) =>
                    `<button type="button" class="group-select-btn" onclick="openCards('${g}')"><span>${g}</span><span class="group-select-sub">${TERMS.filter((t) => t.g === g).length}用語</span></button>`
            )
            .join('');
    }

    function openCards(g) {
        document.getElementById('yougo-title').textContent = '📖 ' + g;
        document.getElementById('ycards').innerHTML = TERMS.map((t, i) =>
            t.g === g
                ? `<div class="ycard" onclick="zoomCard(${i})"><b>${t.n}</b>${t.cs ? svgOf(t.cs, t.h, false) : svgOf(t.s, t.h, false, t.n)}<small>${CNT[t.n] || 0}回出題</small></div>`
                : ''
        ).join('');
        showScreen('screen-yougo-cards');
    }

    function zoomCard(i) {
        const t = TERMS[i];
        document.getElementById('zoom-box').innerHTML =
            `<div style="font-size:24px;font-weight:bold">${t.n}</div>${t.cs ? svgOf(t.cs, t.h, false) : svgOf(t.s, t.h, false, t.n)}<div style="font-size:18px;margin:8px 0">${t.d}</div><div style="color:#789">${CNT[t.n] || 0}回出題</div>`;
        document.getElementById('zoom-modal').style.display = 'flex';
    }

    function renderKiroku() {
        const c = [];
        [1, 2, 3].forEach((f) => {
            let n = 0,
                tot = 0;
            for (let k = 1; k <= 10; k++)
                chunks(f, k).forEach((x, j) => {
                    tot++;
                    if (PR[f + '-' + k + '-' + j] == 2) n++;
                });
            c.push([FN[f], `★：${n}問／全${tot}問`]);
        });
        const d = [];
        d.push(
            ['検定：受検回数', kenteiAttemptCount + '回'],
            ['検定：クリア回数', CLR + '回'],
            ['検定：ベストタイム', bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-'],
            ['検定：連続クリア記録', `現在：${correctStreakCount}回／最高：${maxStreakCount}回`]
        );
        const h = (r) =>
            r
                .map(
                    (a) =>
                        `<div class="kiroku-card"><div class="kiroku-card-label">${a[0]}</div><div class="kiroku-card-value">${a[1]}</div></div>`
                )
                .join('');
        document.getElementById('kiroku-cards-mondai').innerHTML = h(c);
        document.getElementById('kiroku-cards-kentei').innerHTML = h(d);
    }

    function openResetConfirm(t) {
        pendingResetType = t;
        document.getElementById('reset-confirm-message').textContent =
            t === 'mondai'
                ? '問題選択の★/☆の記録がすべてリセットされます。よろしいですか？'
                : '検定の記録と、用語の出題回数がリセットされます。よろしいですか？';
        document.getElementById('reset-confirm-modal').style.display = 'flex';
    }

    function confirmReset() {
        if (pendingResetType === 'mondai') {
            PR = {};
            sv('hm_pr', PR);
        } else {
            bestNormalTimeMs = null;
            correctStreakCount = 0;
            maxStreakCount = 0;
            kenteiAttemptCount = 0;
            CLR = 0;
            CNT = {};
            sv('hm_clr', 0);
            sv('hm_cnt', CNT);
            saveKenteiRecords();
            document.getElementById('best-normal-display').innerText = bestTimeText('--:--.-');
        }
        closeResetConfirm();
    }
    window.addEventListener('resize', resizeApp);
    window.addEventListener('DOMContentLoaded', () => {
        resizeApp();
        initValidationControls();
        loadKenteiRecords();
        document.getElementById('best-normal-display').innerText = bestTimeText(
            bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-'
        );
        showScreen('screen-start');
    });

</script>
</body>
</html>
