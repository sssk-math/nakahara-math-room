    function refreshMathJaxPreview() {
            const q = quizData[currentQuestionIndex];

            // ②〜⑤ およびスタート前の汎用表示ロジック
            const buildPreview = (stage, leftEdId, rightEdId, leftDefault, rightDefault, noSmallBox = false) => {
                const leftEd = document.getElementById(leftEdId);
                const rightEd = document.getElementById(rightEdId);
                const preview = document.getElementById(`math-preview-${stage}`);
                const group = document.getElementById(`group-${stage}`);
                if (!preview) return;

                const getVal = ed => {
                    let val = "";
                    if (ed) {
                        ed.childNodes.forEach(n => {
                            if (n.classList && n.classList.contains('editor-fraction-node')) {
                                const top = n.querySelector('.frac-top') ? n.querySelector('.frac-top').value : "";
                                const bottom = n.querySelector('.frac-bottom') ? n.querySelector('.frac-bottom').value : "";
                                if (top !== "" || bottom !== "") {
                                    val += `\\frac{${top}}{${bottom}}`;
                                }
                            } else if (n.value) {
                                val += n.value; 
                            }
                        });
                    }
                    return val;
                };
                const leftVal = getVal(leftEd);
                const rightVal = getVal(rightEd);
                const isCorrect = group && group.classList.contains('locked-correct');

                let leftHtml, rightHtml;

                if (isCorrect || noSmallBox) {
                    leftHtml = leftVal ? `$${leftVal}$` : `$${leftDefault}$`;
                    rightHtml = rightVal ? `$${rightVal}$` : (noSmallBox && !rightVal ? `<span class="placeholder-text">${rightDefault}</span>` : `$${rightDefault}$`);
                } else {
                    const leftActive = activeEditorId === leftEdId ? 'active-side' : '';
                    const rightActive = activeEditorId === rightEdId ? 'active-side' : '';
                    leftHtml = `<span class="step-box-small ${leftActive}">${leftVal ? `$${leftVal}$` : `<span class="placeholder-text">${leftDefault}</span>`}</span>`;
                    rightHtml = `<span class="step-box-small ${rightActive}">${rightVal ? `$${rightVal}$` : `<span class="placeholder-text">${rightDefault}</span>`}</span>`;
                }

                preview.innerHTML = `
                    <div class="equation-grid">
                        <div class="eq-left">${leftHtml}</div>
                        <div class="eq-equal">$=$</div>
                        <div class="eq-right">${rightHtml}</div>
                    </div>`;
            };

            // ① 分母をはらう の表示制御（スタート前は「左辺＝右辺」、スタート後は式＋×数入力枠）
            const previewCD = document.getElementById('math-preview-clear-denom');
            if (gameStarted && q) {
                const leftEdCD = document.getElementById('math-editor-clear-denom-left');
                const rightEdCD = document.getElementById('math-editor-clear-denom-right');
                const groupCD = document.getElementById('group-clear-denom');

                if (previewCD) {
                    // 多項式（+や-を含む式）の場合はかっこをつけるヘルパー関数
                    const wrapExpr = str => {
                        const clean = str.replace(/^[+-]/, '');
                        return (clean.includes('+') || clean.includes('-')) ? `(${str})` : str;
                    };

                    const getVal = ed => {
                        let val = "";
                        if (ed) {
                            ed.childNodes.forEach(n => { if (n.value) val += n.value; });
                        }
                        return val;
                    };
                    const leftVal = getVal(leftEdCD);
                    const rightVal = getVal(rightEdCD);
                    const isCorrect = groupCD && groupCD.classList.contains('locked-correct');

                    const leftExpr = wrapExpr(q.leftPart);
                    const rightExpr = wrapExpr(q.rightPart);

                    let leftHtml, rightHtml;
                    if (isCorrect) {
                        leftHtml = `$${leftExpr}${leftVal}$`;
                        rightHtml = `$${rightExpr}${rightVal}$`;
                    } else {
                        const leftActive = activeEditorId === 'math-editor-clear-denom-left' ? 'active-side' : '';
                        const rightActive = activeEditorId === 'math-editor-clear-denom-right' ? 'active-side' : '';
                        leftHtml = `$${leftExpr}$ <span class="step-box-small ${leftActive}">${leftVal ? `$${leftVal}$` : `<span class="placeholder-text">×数</span>`}</span>`;
                        rightHtml = `$${rightExpr}$ <span class="step-box-small ${rightActive}">${rightVal ? `$${rightVal}$` : `<span class="placeholder-text">×数</span>`}</span>`;
                    }

                    previewCD.innerHTML = `
                        <div class="equation-grid">
                            <div class="eq-left">${leftHtml}</div>
                            <div class="eq-equal">$=$</div>
                            <div class="eq-right">${rightHtml}</div>
                        </div>`;
                }
            } else {
                buildPreview('clear-denom', 'math-editor-clear-denom-left', 'math-editor-clear-denom-right', '左辺', '右辺');
            }

            buildPreview('expansion', 'math-editor-expansion-left', 'math-editor-expansion-right', '左辺', '右辺');
            buildPreview('transposition', 'math-editor-transposition-left', 'math-editor-transposition-right', '左辺', '右辺');
            buildPreview('arrangement', 'math-editor-arrangement-left', 'math-editor-arrangement-right', '左辺', '右辺');
            buildPreview('answer', null, 'math-editor-answer-right', 'x', '解を入力', true);

            updateMathJax([
                document.getElementById('math-preview-clear-denom'),
                document.getElementById('math-preview-expansion'),
                document.getElementById('math-preview-transposition'),
                document.getElementById('math-preview-arrangement'),
                document.getElementById('math-preview-answer')
            ]);
        }

    function updateMathJax(elements) {
        if (window.MathJax && MathJax.typesetPromise) {
            if (MathJax.typesetClear) MathJax.typesetClear(elements);
            mathjaxPromise = mathjaxPromise.then(() => MathJax.typesetPromise(elements))
                .catch((err) => console.log("MathJax typesetting failed: " + err.message));
        }
    }

    /* ==========================================================================
       5. 問題生成関数
       ========================================================================== */
    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

    const getRandomInt = (min, max, excludeZero = true) => {
        let r;
        do {
            r = Math.floor(Math.random() * (max - min + 1)) + min;
        } while (excludeZero && r === 0);
        return r;
    };

    const formatTerm = (n, d, isX, isFirst) => {
        if (n === 0) return "";
        let sign = (n * d < 0) ? "-" : (isFirst ? "" : "+");
        n = Math.abs(n);
        d = Math.abs(d);
        let xStr = isX ? "x" : "";
        let valStr = "";
        if (d === 1) {
            if (isX && n === 1) valStr = "";
            else valStr = n;
        } else {
            valStr = `\\frac{${n}}{${d}}`;
        }
        return `${sign}${valStr}${xStr}`;
    };

    const formatPoly = (a, b) => {
        let res = "";
        if (a === 1) res += "x";
        else if (a === -1) res += "-x";
        else if (a !== 0) res += a + "x";
        
        if (b > 0) res += (res ? "+" : "") + b;
        else if (b < 0) res += b;
        
        if (res === "") return "0";
        return res;
    };

    const formatClearDenom = (str, mult) => {
        const cleanStr = str.replace(/^[+-]/, '');
        if (cleanStr.includes('+') || cleanStr.includes('-')) {
            return `(${str})×${mult}`;
        } else {
            return `${str.replace(/^\+/, '')}×${mult}`;
        }
    };

    // 項のフォーマット用ヘルパー
    const formatCoeffTerm = (val, isX, isFirst) => {
        if (val === 0) return "";
        let absVal = Math.abs(val);
        let sign = val < 0 ? "-" : (isFirst ? "" : "+");
        let body = isX ? (absVal === 1 ? "x" : `${absVal}x`) : `${absVal}`;
        return `${sign}${body}`;
    };

    // ステップ2：展開（かっこはずし）の両順序対応生成
    const buildExp = (coeffX, constTerm) => {
        if (coeffX === 0) return [formatCoeffTerm(constTerm, false, true)];
        if (constTerm === 0) return [formatCoeffTerm(coeffX, true, true)];
        
        const order1 = formatCoeffTerm(coeffX, true, true) + formatCoeffTerm(constTerm, false, false);
        const order2 = formatCoeffTerm(constTerm, false, true) + formatCoeffTerm(coeffX, true, false);
        return [order1, order2];
    };

    // ステップ3：左辺(xの項)の移項順列生成
    const buildTransL = (L_a, R_a) => {
        if (L_a === 0) return [formatCoeffTerm(-R_a, true, true)];
        if (R_a === 0) return [formatCoeffTerm(L_a, true, true)];
        
        const order1 = formatCoeffTerm(L_a, true, true) + formatCoeffTerm(-R_a, true, false);
        const order2 = formatCoeffTerm(-R_a, true, true) + formatCoeffTerm(L_a, true, false);
        return [order1, order2];
    };

    // ステップ3：右辺(定数項)の移項順列生成
    const buildTransR = (R_c, L_c) => {
        if (R_c === 0) return [formatCoeffTerm(-L_c, false, true)];
        if (L_c === 0) return [formatCoeffTerm(R_c, false, true)];
        
        const order1 = formatCoeffTerm(R_c, false, true) + formatCoeffTerm(-L_c, false, false);
        const order2 = formatCoeffTerm(-L_c, false, true) + formatCoeffTerm(R_c, false, false);
        return [order1, order2];
    };

        const lcm = (a, b) => Math.abs(a * b) / gcd(Math.abs(a), Math.abs(b));

        function generateQuizData() {
            // 1問ぶんのパターン問題を生成する内部関数
            // posPattern: 1〜6 (①係数×係数, ②定数×定数, ③左辺集中, ④右辺集中, ⑤混合対角A, ⑥混合対角B)
            // orderPattern: 0〜3 (0:基本形, 1:左辺入れ替え, 2:右辺入れ替え, 3:両辺入れ替え)
            const generatePatternQuiz = (posPattern, orderPattern) => {
                while (true) {
                    // 1. 互いに素な分母ペアの候補をランダムに選択
                    const denomPairs = [[2, 3], [2, 5], [2, 7], [3, 4], [3, 5], [3, 7], [4, 5], [4, 7], [5, 6], [5, 7]];
                    let [d1, d2] = denomPairs[Math.floor(Math.random() * denomPairs.length)];
                    if (Math.random() < 0.5) [d1, d2] = [d2, d1]; // ランダムに入れ替え

                    const M = d1 * d2; // 互いに素なので積が最小公倍数

                    // 2. 6パターンに応じた分母の割り当て (a, b, p, q)
                    let d_a = 1, d_b = 1, d_p = 1, d_q = 1;
                    if (posPattern === 1)      { d_a = d1; d_p = d2; } // ① 係数 × 係数
                    else if (posPattern === 2) { d_b = d1; d_q = d2; } // ② 定数 × 定数
                    else if (posPattern === 3) { d_a = d1; d_b = d2; } // ③ 左辺集中
                    else if (posPattern === 4) { d_p = d1; d_q = d2; } // ④ 右辺集中
                    else if (posPattern === 5) { d_a = d1; d_q = d2; } // ⑤ 混合・対角A
                    else if (posPattern === 6) { d_b = d1; d_p = d2; } // ⑥ 混合・対角B

                    // 3. 分子を決定するヘルパー (約分できない・0でない整数)
                    const getNum = (d) => {
                        let n;
                        do {
                            n = getRandomInt(-5, 5, true);
                        } while (d > 1 && gcd(Math.abs(n), d) !== 1);
                        return n;
                    };

                    const n_a = getNum(d_a);
                    const n_b = getNum(d_b);
                    const n_p = getNum(d_p);
                    const n_q = getNum(d_q);

                    // 両辺に M をかけたときの整数係数
                    const L_a = n_a * (M / d_a);
                    const L_c = n_b * (M / d_b);
                    const R_a = n_p * (M / d_p);
                    const R_c = n_q * (M / d_q);

                    // xの係数が同じ、または定数項が同じ場合は再生成
                    if (L_a === R_a || L_c === R_c) continue;

                    // 4. 項の並び順 (orderPattern) に応じた問題文の生成
                    let leftPart = "", rightPart = "";
                    if (orderPattern === 0) {
                        // 基本形: ax + b = px + q
                        leftPart  = formatTerm(n_a, d_a, true, true) + formatTerm(n_b, d_b, false, false);
                        rightPart = formatTerm(n_p, d_p, true, true) + formatTerm(n_q, d_q, false, false);
                    } else if (orderPattern === 1) {
                        // 左辺入れ替え: b + ax = px + q
                        leftPart  = formatTerm(n_b, d_b, false, true) + formatTerm(n_a, d_a, true, false);
                        rightPart = formatTerm(n_p, d_p, true, true) + formatTerm(n_q, d_q, false, false);
                    } else if (orderPattern === 2) {
                        // 右辺入れ替え: ax + b = q + px
                        leftPart  = formatTerm(n_a, d_a, true, true) + formatTerm(n_b, d_b, false, false);
                        rightPart = formatTerm(n_q, d_q, false, true) + formatTerm(n_p, d_p, true, false);
                    } else if (orderPattern === 3) {
                        // 両辺入れ替え: b + ax = q + px
                        leftPart  = formatTerm(n_b, d_b, false, true) + formatTerm(n_a, d_a, true, false);
                        rightPart = formatTerm(n_q, d_q, false, true) + formatTerm(n_p, d_p, true, false);
                    }

                    // 5. 正答の自動算出・約分処理
                    const num = R_c - L_c;
                    const den = L_a - R_a;
                    let ansStr = "0";

                    if (num !== 0) {
                        const sign = (num * den < 0) ? "-" : "";
                        const absNum = Math.abs(num);
                        const absDen = Math.abs(den);
                        const g = gcd(absNum, absDen);
                        const redNum = absNum / g;
                        const redDen = absDen / g;
                        
                        if (redDen === 1) {
                            ansStr = `${sign}${redNum}`;
                        } else {
                            ansStr = `${sign}${redNum}/${redDen}`;
                        }
                    }

                    return {
                        leftPart: leftPart,
                        rightPart: rightPart,
                        clearDenomLeftAns: `×${M}`,
                        clearDenomRightAns: `×${M}`,
                        expLeftList: buildExp(L_a, L_c),
                        expRightList: buildExp(R_a, R_c),
                        transLeftList: buildTransL(L_a, R_a),
                        transRightList: buildTransR(R_c, L_c),
                        arrLeftAns: formatPoly(L_a - R_a, 0),
                        arrRightAns: (R_c - L_c).toString(),
                        answer: ansStr
                    };
                }
            };

            // 6×4＝24パターンから重複なしでランダムに4つを選択して出題
            const allCombinations = [];
            for (let p = 1; p <= 6; p++) {
                for (let o = 0; o <= 3; o++) {
                    allCombinations.push({ pos: p, order: o });
                }
            }

            const selected = [];
            while (selected.length < 4) {
                const idx = Math.floor(Math.random() * allCombinations.length);
                selected.push(allCombinations.splice(idx, 1)[0]);
            }

            return selected.map(item => generatePatternQuiz(item.pos, item.order));
        }

    /* ==========================================================================
       6. ヒントデータ

            timeoutClearDenom: "時間切れ！<br>分母の最小公倍数をすべての項にかけよう！",
            expansionInit: "次は分配法則を使って、かっこをはずそう！",
            expansionError: "符号に気をつけて展開しよう！",
            timeoutExpansion: "時間切れ！<br>符号に気をつけて展開しよう！",
            transpositionInit: "かっこがはずれたね！<br>次は $x$ の項を左へ、数字を右へ移項しよう！",
            transpositionError: "移項すると「符号が変わる」ことに注意しよう！",
            timeoutTransposition: "時間切れ！<br>移項すると符号が変わることに注意しよう！",
            timeoutArrangement: "時間切れ！<br>計算ミスがないかもう一度確かめよう。",
            arrangementInit: "移項バッチリ！<br>次は両辺を計算して整理しよう。",
            arrangementError: "計算ミスかも？もう一度確かめよう。",
            answerInit: "計算バッチリ！<br>最後に解 $x$ を求めよう。",
            answerError: "最後の一息！解をもう一度確かめよう。",
            timeoutAnswer: "時間切れ！<br>解をもう一度確かめよう。",
            nextQuestion: "正解！<br>『次の問題へ』を押そう。",
            allFinished: "全問終了！<br>『送信』ボタンを押そう。"
