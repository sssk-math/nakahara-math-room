<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 方程式（Step13：異分母をふくむ方程式②）</title>
    <script>
        /* ==========================================================================
           1. MathJaxの基本設定
           ========================================================================== */
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        /* ==========================================================================
           2. 画面全体の基本デザイン
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 960px;
            height: 640px;
            flex-shrink: 0;
            min-width: 960px;
            min-height: 640px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 12px;
            position: relative;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px 20px;
        }

        /* ==========================================================================
           3. ヘッダー・タイトル・利き手切り替えボタン
           ========================================================================== */
        header { text-align: center; }

        h1 { font-size: 24px; color: #333; margin-bottom: 5px; }

        .title-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 0px;
        }

        .title-hand-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .title-hand-btn.active { 
            background-color: #1a73e8;
            color: white;
        }

        .game-layout.left-handed {
            flex-direction: row-reverse;
        }

        /* ==========================================================================
           4. タイマー・自己ベスト・生徒番号入力エリア
           ========================================================================== */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f4;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 0px;
            font-weight: bold;
            box-sizing: border-box;
            height: 52px;
        }

        #timer-display {
            font-size: 20px;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }
        
        .record-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border-left: 2px solid #ccc;
            padding-left: 12px;
            height: 100%;
        }

        #best-update-message {
            font-size: 12px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
            height: 1.2em;
            margin-bottom: 1px;
        }

        .best-label-container {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
        }

        .number-field-wrapper {
            position: relative;
            display: inline-block;
        }

        .login-input {
            font-size: 15px;
            padding: 4px 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-weight: normal;
            width: 80px;
        }

        .login-input:focus {
            border-color: #1a73e8;
        }

        .input-tooltip {
            display: none;
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            border: 2px solid #333333;
            color: #333333;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            width: 210px;
        }

        .input-tooltip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #333333 transparent;
        }

        .input-tooltip.show {
            display: block;
        }

        .tooltip-hint {
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }

        .keypad-mini {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
        }

        .key-mini {
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key-mini:active {
            background-color: #dee2e6;
        }

        .key-mini.btn-clear {
            grid-column: span 2;
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-size: 14px;
        }

        .key-mini.btn-clear:active {
            background-color: #ffcdd2;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        #send-btn {
            padding: 6px 12px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 34px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
        }

        #send-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ==========================================================================
           5. メインゲーム画面・左右パネル
           ========================================================================== */
        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 8px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
        }

        .right-panel {
            width: 285px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           6. 問題文・出題数式表示エリア
           ========================================================================== */
        .question-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .question-text { 
            font-size: 20px; 
            color: #333; 
            font-weight: bold; 
        }

        .progress { 
            font-size: 16px; 
            color: #666; 
        }
        
        .formula-display {
            font-size: 26px;
            line-height: 1.4;
            text-align: center;
            color: #000;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ccc;
            height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .formula-display mjx-container { 
            display: inline !important; 
            white-space: normal; 
        }

        /* ==========================================================================
           7. 入力枠のスタイル・「＝」の縦揃えCSS Gridレイアウト
           ========================================================================== */
        .input-block-container { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            width: 100%; 
            margin-bottom: 4px; 
        }

        .input-box-group {
            background: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 4px 10px;
            height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .input-box-group.active-focus { 
            border-color: #007bff; 
            background-color: #f0f7ff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
        }

        .input-box-group.locked-correct { 
            border-color: #81c784; 
            background-color: #e8f5e9; 
            cursor: default; 
        }

        .input-box-group.locked-disabled { 
            border-color: #e9ecef; 
            background-color: #f8f9fa; 
            opacity: 0.6; 
            cursor: not-allowed; 
        }

        .input-box-group.error-shake { 
            border-color: #e57373; 
            background-color: #ffebee; 
        }

        .input-label { 
            font-size: 13px; 
            color: #495057; 
            font-weight: bold; 
            margin-bottom: 0px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .step-badge { 
            font-size: 11px; 
            padding: 1px 6px; 
            border-radius: 4px; 
            background-color: #dee2e6; 
            color: #495057; 
        }

        .locked-correct .step-badge { 
            background-color: #28a745; 
            color: white; 
        }

        .mathjax-render-zone {
            min-height: 34px;
            font-size: 22px; 
            color: #212529; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            width: 100%;
        }

        /* 💡 「＝」を揃えるための3列のCSS Grid設定 */
        .equation-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            width: 100%;
        }

        .eq-left {
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }

        .eq-equal {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .eq-right {
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }

        .math-editor-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        .math-editor-container.wide-fraction-mode {
            height: 60px;
            padding: 4px 14px;
            flex-wrap: wrap;
            overflow: visible;
            border: none !important; 
            background-color: transparent !important; 
        }

        .placeholder-text {
            font-size: 16px;
            color: #adb5bd;
        }

        .editor-text-node {
            border: none;
            outline: none;
            font-size: 24px; 
            text-align: left;
            min-width: 20px;
            height: 32px;
            background: transparent;
            color: #000000;
            pointer-events: none; 
        }

        .editor-text-node::placeholder {
            font-size: 16px;
            color: #adb5bd; 
        }

        .step-box-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 34px;
            border: 2px solid #ced4da;
             border-radius: 6px;
            background-color: #f0f7ff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            margin: 0 0px;
            padding: 0 8px;
        }

        .step-box-small.active-side {
            border-color: #007bff;
            background-color: #f8f9fa;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        .locked-correct .step-box-small {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
        }

        .editor-fraction-node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            min-width: 40px;
            margin: 0 4px;
        }

        .editor-fraction-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 2px 0;
        }

        .editor-fraction-field {
            width: 40px;
            height: 24px;
            font-size: 20px; 
            text-align: center;
            border: none !important; 
            background-color: transparent !important; 
            outline: none;
            color: #000000;
            pointer-events: none; 
            font-family: 'Times New Roman', Times, serif !important; 
            font-style: italic !important; 
        }

        /* ==========================================================================
           8. ソフトキーパッドおよび各種ボタン
           ========================================================================== */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(5, 56px); 
            gap: 1px; 
            margin-bottom: 8px; 
        }

        .key {
            height: 46px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .key:active:not(:disabled) { 
            background-color: #dee2e6; 
            transform: scale(0.95); 
        }
        
        .key.num-btn { 
            font-family: 'MathJax_Main', 'Times New Roman', Times, serif; 
        }

        .key.op-btn { 
            background-color: #e7f5ff; 
            border-color: #a5d8ff; 
            color: #007bff; 
            font-size: 20px; 
        }

        .key.var-btn { 
            background-color: #f3f0ff; 
            border-color: #d0bfff; 
            color: #6f42c1; 
            font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: normal; 
            font-size: 26px; 
        }

        .key.unit-btn { 
            background-color: #fff0f6; 
            border-color: #ffdeeb; 
            color: #d6336c; 
            font-size: 18px; 
            font-weight: bold; 
        }

        .key.frac-btn { 
            background-color: #fff9db; 
            border-color: #fff3bf; 
            color: #f59f00; 
            font-size: 18px; 
        }

        .key.paren-btn { 
            background-color: #ebfbee; 
            border-color: #b2f2bb; 
            color: #2b8a3e; 
            font-size: 20px; 
        }

        .key.arrow-btn { 
            background-color: #fff3e0; 
            border-color: #ffe0b2; 
            color: #e65100; 
            font-weight: bold; 
        }

        .keypad button:disabled { 
            background-color: #d1d5db !important; 
            color: #9ca3af !important; 
            border-color: #cbd5e1 !important; 
            cursor: not-allowed; 
            opacity: 0.6; 
            box-shadow: none !important; 
            transform: none !important; 
        }

        .control-keys { 
            display: grid; 
            grid-template-columns: repeat(3, 92px); 
            gap: 4px; 
            width: 100%; 
            justify-content: center; 
        }

        .key.action-btn { 
            background-color: #28a745; 
            color: #fff; 
            font-size: 18px; 
            height: 46px; 
            border-color: #1e7e34; 
            width: 100%; 
        }

        .key.action-btn.judge-mode { 
            background-color: #007bff; 
            border-color: #0069d9; 
        }

        .key.clear-btn { 
            background-color: #e9ecef; 
            font-size: 16px; 
            height: 46px; 
            width: 100%; 
            color: #333; 
        }

        /* ==========================================================================
           9. 正解・不正解メッセージ・フッター・ヒント
           ========================================================================== */
        .result-message { 
            font-size: 17px; 
            font-weight: bold; 
            min-height: 40px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: auto; 
            margin-right: auto; 
            white-space: pre-wrap; 
            width: 100%; 
        }

        .correct { color: #28a745; }
        .incorrect { color: #e67e22; }

        .hint-container { 
            width: 100%; 
            height: 205px; 
            background-color: #fff9db; 
            border: 1px dashed #f59f00; 
            border-radius: 8px; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-bottom: 8px; 
        }

        .hint-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #f59f00; 
            margin-bottom: 4px; 
            text-align: left; 
        }

        .hint-body { 
            font-size: 16px; 
            font-weight: bold;
            color: #495057; 
            line-height: 1.4; 
            text-align: left; 
        }

    footer {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #000000;
    font-weight: bold;
    padding-top: 4px;
    border-top: 1px solid #cfd8dc;
    position: absolute;
    bottom: 0;
    left: 0;
    background-color: #ffffff;
    border-radius: 0 0 10px 10px;
    padding-bottom: 4px;
    }
    </style>
</head>

<body>
    <div id="app-container">
        <header>
            <div class="title-bar">
                <button class="title-hand-btn" id="hand-left-btn" onclick="changeHandedness('left')">👈 左利き</button>
                <h1> 方程式（Step13：異分母をふくむ方程式②）</h1>
                <button class="title-hand-btn active" id="hand-right-btn" onclick="changeHandedness('right')">右利き 👉</button>
            </div>
        </header>

        <div class="timer-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="timer-display">⏱️ 00:00.0</div>
                <div class="record-box">
                    <div id="best-update-message"></div>
                    <div class="best-label-container">
                        <div id="best-normal-display">ベストタイム(4問): --:--.-</div>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="number-field-wrapper" id="wrapper-area">
                    <input type="text" id="number-field" class="login-input" placeholder="生徒番号" readonly autocomplete="off">
                    
                    <div class="input-tooltip" id="number-tooltip">
                        <div class="tooltip-hint">
                            💡 1年2組34番 → 「1234」<br>
                            <span style="font-size: 10px; color: #888;">クラス: 1〜5組 / 番号: 01〜35</span>
                        </div>
                        
                        <div class="keypad-mini">
                            <button class="key-mini" onclick="pressNum('7')">7</button>
                            <button class="key-mini" onclick="pressNum('8')">8</button>
                            <button class="key-mini" onclick="pressNum('9')">9</button>
                            
                            <button class="key-mini" onclick="pressNum('4')">4</button>
                            <button class="key-mini" onclick="pressNum('5')">5</button>
                            <button class="key-mini" onclick="pressNum('6')">6</button>
                            
                            <button class="key-mini" onclick="pressNum('1')">1</button>
                            <button class="key-mini" onclick="pressNum('2')">2</button>
                            <button class="key-mini" onclick="pressNum('3')">3</button>
                            
                            <button class="key-mini" onclick="pressNum('0')">0</button>
                            <button class="key-mini btn-clear" onclick="pressClear()">⌫ 消す</button>
                        </div>
                        
                        <div class="error-msg" id="error-display">存在しない番号です</div>
                    </div>
                </div>
                <button id="send-btn" onclick="manualSendToGoogleForm()" disabled>送信</button>
            </div>
        </div>
        
        <div class="main-content" id="quiz-screen">
            <div class="game-layout">
                <div class="left-panel">
                    <div class="question-wrapper">
                        <span class="question-text">次の計算をしなさい。</span>
                        <span id="countdown-timer" style="display:none; color:#e57373; font-weight:bold; margin-left:15px; font-size:18px;"></span>
                        <span class="progress" id="progress">スタートボタンを押してください。</span>
                    </div>
                    <div class="formula-display" id="formula-box"></div>

                    <div class="input-block-container" id="dynamic-input-container">
                        <div class="input-box-group active-focus" id="group-clear-denom" onclick="focusDefaultNode('math-editor-clear-denom-left')">
                            <div class="input-label">
                                <span>① 分母をはらう</span>
                                <span class="step-badge" id="badge-clear-denom">入力中</span>
                            </div>
                            <div id="math-preview-clear-denom" class="mathjax-render-zone"></div>
                            <div id="math-editor-clear-denom-left" class="math-editor-container"></div>
                            <div id="math-editor-clear-denom-right" class="math-editor-container"></div>
                        </div>

                        <div class="input-box-group locked-disabled" id="group-expansion" onclick="focusDefaultNode('math-editor-expansion-left')">
                            <div class="input-label">
                                <span>② かっこをはずす</span>
                                <span class="step-badge" id="badge-expansion">ロック中</span>
                            </div>
                            <div id="math-preview-expansion" class="mathjax-render-zone"></div>
                            <div id="math-editor-expansion-left" class="math-editor-container"></div>
                            <div id="math-editor-expansion-right" class="math-editor-container"></div>
                        </div>

                        <div class="input-box-group locked-disabled" id="group-transposition" onclick="focusDefaultNode('math-editor-transposition-left')">
                            <div class="input-label">
                                <span>③ 移項</span>
                                <span class="step-badge" id="badge-transposition">ロック中</span>
                            </div>
                            <div id="math-preview-transposition" class="mathjax-render-zone"></div>
                            <div id="math-editor-transposition-left" class="math-editor-container"></div>
                            <div id="math-editor-transposition-right" class="math-editor-container"></div>
                        </div>

                        <div class="input-box-group locked-disabled" id="group-arrangement" onclick="focusDefaultNode('math-editor-arrangement-left')">
                            <div class="input-label">

<script>
    /* ==========================================================================
       1. グローバル変数・連携用設定
       ========================================================================== */
        const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfem5igsY7R6GywjAhbbt_qBbMBCFp5Jx-wANApOLZFipEzug/formResponse';
    const FORM_NUM_ID         = 'entry.351767117';   // 問題番号
    const FORM_NAME_ID        = 'entry.785004272';   // 名前
    const FORM_TIME_ID        = 'entry.1218861448';  // クリアタイム
    const FORM_STAGE_COUNT_ID = 'entry.2033679053';  // 正解数

    let startTime              = 0;
    let timerInterval          = null;
    let bestNormalTimeMs       = null;
    let lastClearTimeText      = "";
    let elapsedBeforeResume    = 0;

    let gameStarted            = false;
    let isCompleted            = false;
    let isCorrectState         = false;
    let quizData               = [];
    let currentQuestionIndex   = 0;
    let score                  = 0;
    let currentQuestionWrongCount = 0;

    let currentStage           = 'clear-denom';
    let activeEditorId         = 'math-editor-clear-denom-left';

    let questionTimerId        = null;
    let questionTimeLeft       = 45;
    let currentControlState    = 'start';

    const container            = document.getElementById('app-container');
    const formulaBox           = document.getElementById('formula-box');
    const actionBtn            = document.getElementById('action-btn');
    const clearBtn             = document.getElementById('clear-btn');
    const clearAllBtn          = document.getElementById('clear-all-btn');
    const resultMsgEl          = document.getElementById('result-message');
    const progressEl           = document.getElementById('progress');

    let mathjaxPromise         = Promise.resolve();

    const numberField = document.getElementById('number-field');
    const tooltip = document.getElementById('number-tooltip');
    const errorDisplay = document.getElementById('error-display');
    let isConfirmed = false;

    /* ==========================================================================
       2. タイマーや生徒番号、記録送信などの関数
       ========================================================================== */
    function resizeApp() {
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
        container.style.transform = `scale(${scale})`;
    }

    function startTimerClock() {
        isCorrectState = false;
        lastClearTimeText = "";
        elapsedBeforeResume = 0;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('best-update-message').innerText = "";
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = "送信";
        }
        if (numberField) numberField.disabled = false;
    }

    function updateTimer() {
        const diff = (Date.now() - startTime) + elapsedBeforeResume;
        const min = Math.floor(diff / 60000);
        const sec = Math.floor((diff % 60000) / 1000);
        const msec = Math.floor((diff % 1000) / 100);
        const minStr = String(min).padStart(2, '0');
        const secStr = String(sec).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
    }

    function stopTimerClockAndEvaluate() {
        clearInterval(timerInterval);
        isCorrectState = true; 
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        lastClearTimeText = finalTimeStr;
        
        const totalElapsedTimeMs = (Date.now() - startTime) + elapsedBeforeResume;
        elapsedBeforeResume = totalElapsedTimeMs;
        if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
            bestNormalTimeMs = totalElapsedTimeMs;
            document.getElementById('best-normal-display').innerText = `ベストタイム(4問): ${finalTimeStr}`;
            document.getElementById('best-update-message').innerText = "🎉 ベスト更新！";
        }
        
        const numInput = numberField ? numberField.value.trim() : "";
        const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
        
        if (isValidNum && !window.isAlreadySubmitted) {
            executeFormSubmit(numInput, "", lastClearTimeText, score);
            window.isAlreadySubmitted = true; 
            
            const sendBtnTop = document.getElementById('send-btn');
            const sendBtnBottom = document.getElementById('clear-btn');
            if (sendBtnTop) {
                sendBtnTop.textContent = "完了";
                sendBtnTop.disabled = true;
            }
            if (sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.disabled = true;
                sendBtnBottom.className = "key clear-btn";
            }
            if (numberField) numberField.disabled = true;
        } else {
            window.isAlreadySubmitted = false;
            if (numberField) numberField.disabled = false;
        }
        
        updateSendButtonState();
    }

    function startQuestionTimer() {
        clearInterval(questionTimerId);
        if (!gameStarted || isCompleted) {
            document.getElementById('countdown-timer').style.display = 'none';
            return;
        }

        if (currentQuestionWrongCount >= 2) {
            document.getElementById('countdown-timer').style.display = 'inline-block';
            document.getElementById('countdown-timer').textContent = "じっくりタイム";
            return;
        }
        questionTimeLeft = 45;
        updateQuestionTimerUI();
        document.getElementById('countdown-timer').style.display = 'inline-block';
        
        questionTimerId = setInterval(() => {
            questionTimeLeft--;
            updateQuestionTimerUI();
            if (questionTimeLeft <= 0) {
                handleQuestionTimeout();
            }
        }, 1000);
    }

    function updateQuestionTimerUI() {
        const el = document.getElementById('countdown-timer');
        if (el) el.textContent = `残り ${questionTimeLeft}秒`;
    }

    function handleQuestionTimeout() {
            clearInterval(questionTimerId);
            
            // 【修正1】現在の問題データ q を取得
            const q = quizData[currentQuestionIndex];
            if (!q) return;

            // 【修正2】現在のステージの入力枠グループを取得
            const targetGroup = document.getElementById('group-' + currentStage);
            const hintBody = document.getElementById('hint-text');

            // ステージごとのタイムアウト時ヒントを表示
            if (currentStage === 'clear-denom') {
                let userLeft = getUserAnswerBySide('clear-denom', 'left');
                let userRight = getUserAnswerBySide('clear-denom', 'right');
                
                // 入力されている場合は正解判定を試みる
                if (userLeft && userRight) {
                    const clean = str => (str || '').replace(/^\(([0-9x]+)\)/, '$1').replace(/^\+/, '');
                    if (clean(userLeft) === clean(q.clearDenomLeftAns) && clean(userRight) === clean(q.clearDenomRightAns)) {
                        document.getElementById('group-clear-denom').className = "input-box-group locked-correct";
                        document.getElementById('badge-clear-denom').textContent = "正解！";

                        currentStage = 'expansion';
                        activeEditorId = 'math-editor-expansion-left';
                        document.getElementById('group-expansion').className = "input-box-group active-focus";
                        document.getElementById('badge-expansion').textContent = "入力中";

                        hintBody.innerHTML = HINT_DATA.expansionInit;
                        focusDefaultNode(); refreshMathJaxPreview();
                        startQuestionTimer();
                        return;
                    }
                }
                hintBody.innerHTML = HINT_DATA.timeoutClearDenom;
            } else if (currentStage === 'expansion') {
                hintBody.innerHTML = HINT_DATA.timeoutExpansion;
            } else if (currentStage === 'transposition') {
                hintBody.innerHTML = HINT_DATA.timeoutTransposition;
            } else if (currentStage === 'arrangement') {
                hintBody.innerHTML = HINT_DATA.timeoutArrangement;
            } else if (currentStage === 'answer') {
                hintBody.innerHTML = HINT_DATA.timeoutAnswer;
            }
            
            // エラーアニメーションを実行してタイマー再開
            showStepError(targetGroup);
            startQuestionTimer();
        }

    function initValidationControls() {
        if (!numberField) return;

        numberField.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isConfirmed || numberField.value !== '') {
                numberField.value = '';
                isConfirmed = false;
                errorDisplay.style.display = 'none';
                updateSendButtonState();
            }
            tooltip.classList.add('show');
            numberField.focus();
        });

        tooltip.addEventListener('click', (e) => { e.stopPropagation(); });

        document.addEventListener('click', (e) => {
            if (tooltip.classList.contains('show') && !isConfirmed) {
                numberField.value = '';
                errorDisplay.style.display = 'none';
                tooltip.classList.remove('show');
                numberField.blur();
                updateSendButtonState();
            }
        });
    }

    function pressNum(num) {
        if (!numberField) return;
        let currentVal = numberField.value;

        if (currentVal.length === 4) {
            currentVal = '';
            errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        if (currentVal.length === 4) {
            const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
            if (isValid) completeInput(currentVal); 
            else errorDisplay.style.display = 'block';
        }
    }

    function completeInput(value) {
        isConfirmed = true;
        tooltip.classList.remove('show');
        numberField.blur();
        updateSendButtonState();
    }

    function pressClear() {
        if (!numberField) return;
        let currentVal = numberField.value;
        if (currentVal.length > 0) {
            numberField.value = currentVal.slice(0, -1);
        }
        errorDisplay.style.display = 'none';
        isConfirmed = false;
        updateSendButtonState();
    }

    function updateSendButtonState() {
        if (window.isAlreadySubmitted) return;

        const numVal = numberField ? numberField.value.trim() : "";
        const sendBtnTop = document.getElementById('send-btn');       
        const sendBtnBottom = document.getElementById('clear-btn');   
    
        if (sendBtnTop && sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
        
        if (sendBtnTop) sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
            if (sendBtnBottom) {
                sendBtnBottom.disabled = !canSend;
                if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                else sendBtnBottom.className = "key action-btn judge-mode"; 
            }
        }
    }

    function executeFormSubmit(num, name, timeText, stageCount) {
        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
            [FORM_NUM_ID]:         num,                               
            [FORM_NAME_ID]:        name,
            [FORM_TIME_ID]:        timeText,    
            [FORM_STAGE_COUNT_ID]: stageCount                  
        };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        
        setTimeout(() => { document.body.removeChild(form); }, 1000);
    }

    function manualSendToGoogleForm() {
        const numInput = numberField ? numberField.value.trim() : "";
        if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
            return;
        }
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('clear-btn'); 
        
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信中";
            sendBtnTop.disabled = true; 
        }
        if (currentControlState === 'finished' && sendBtnBottom) {
            sendBtnBottom.textContent = "送信中";
            sendBtnBottom.disabled = true;
            sendBtnBottom.className = "key clear-btn"; 
        }
        
        const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        const timeToSend = lastClearTimeText || currentTimerText;
        executeFormSubmit(numInput, "", timeToSend, score);
        window.isAlreadySubmitted = true;
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');
    
        setTimeout(() => { 
            if (sendBtnTop) sendBtnTop.textContent = "完了"; 
            if (currentControlState === 'finished' && sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.className = "key clear-btn"; 
            }
        }, 1000);
    }

        /* ==========================================================================
           連動用同期関数（入力枠①の両辺同期）
           ========================================================================== */
        function syncClearDenom() {
        if (!activeEditorId.includes('clear-denom')) return;
        const sourceEd = document.getElementById(activeEditorId);
        const targetId = activeEditorId.endsWith('-left')
            ? 'math-editor-clear-denom-right'
            : 'math-editor-clear-denom-left';
        const targetEd = document.getElementById(targetId);
        if (!sourceEd || !targetEd) return;

        targetEd.innerHTML = '';
        targetEd.className = sourceEd.className;
        
        sourceEd.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('editor-text-node')) {
                // 新しいノードとして正しく再作成する
                createTextBlock(targetEd, node.value);
            } else if (node.classList && node.classList.contains('editor-fraction-node')) {
                const fracNode = node.cloneNode(true);
                // クローンした input に対しても keydown 無効化イベントを再付与
                fracNode.querySelectorAll('input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => e.preventDefault());
                });
                targetEd.appendChild(fracNode);
            }
        });
        
        // コピー先側の入力幅も再計算する
        const currentActive = activeEditorId;
        activeEditorId = targetId;
        updateInputWidths();
        activeEditorId = currentActive;
    }

    /* ==========================================================================
       3. テンキー、コントロールキーなどの制御関数
       ========================================================================== */
    function pressKey(key) {
            if (!gameStarted || isCompleted) return;

            if (key === '=') {
                if (activeEditorId.endsWith('-left')) {
                    activeEditorId = activeEditorId.replace('-left', '-right');
                } else if (activeEditorId.endsWith('-right') && !activeEditorId.includes('answer')) {
                    activeEditorId = activeEditorId.replace('-right', '-left');
                }
                focusDefaultNode(activeEditorId);
                return;
            }

            const currentEd = document.getElementById(activeEditorId);
            if (!currentEd) return;
            let active = document.activeElement;

            if (!active || !currentEd.contains(active) || (!active.classList.contains('editor-text-node') && !active.classList.contains('editor-fraction-field'))) {
                const inputs = currentEd.querySelectorAll('input');
                active = inputs[inputs.length - 1];
                if (active) active.focus();
            }

            if (!active) return;
            
            let targetGroup = null;
            if (activeEditorId.includes('clear-denom')) targetGroup = document.getElementById('group-clear-denom');
            else if (activeEditorId.includes('expansion')) targetGroup = document.getElementById('group-expansion');
            else if (activeEditorId.includes('transposition')) targetGroup = document.getElementById('group-transposition');
            else if (activeEditorId.includes('arrangement')) targetGroup = document.getElementById('group-arrangement');
            else targetGroup = document.getElementById('group-answer');

            if (targetGroup && targetGroup.classList.contains('error-shake')) {
                targetGroup.classList.remove('error-shake');
                targetGroup.classList.add('active-focus');
            }
            
            if (key === 'clear') {
                currentEd.innerHTML = ''; 
                createTextBlock(currentEd, "").focus();
                currentEd.classList.remove('wide-fraction-mode');
                updateInputWidths();
                syncClearDenom();
                refreshMathJaxPreview(); 
                updateControlKeysState(currentControlState);
                return;
            }
            
            if (key === 'Backspace') {
                const isFrac = active.classList.contains('editor-fraction-field');
                
                if (isFrac) {
                    const fracNode = active.closest('.editor-fraction-node');
                    const fields = fracNode.querySelectorAll('.editor-fraction-field');
                    
                    if (fields[0].value.length === 0 && fields[1].value.length === 0) {
                        let prev = fracNode.previousSibling;
                        fracNode.remove();
                        
                        if (prev) {
                            if (prev.classList.contains('editor-fraction-node')) {
                                prev.querySelectorAll('.editor-fraction-field')[1].focus();
                            } else {
                                prev.focus();
                            }
                        } else {
                            createTextBlock(currentEd, "").focus();
                        }
                        
                        if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
                            currentEd.classList.remove('wide-fraction-mode');
                        }
                    } else {
                        if (active.value.length > 0) {
                            const start = active.selectionStart;
                            const end = active.selectionEnd;
                            const val = active.value;
                            if (start !== end) {
                                active.value = val.substring(0, start) + val.substring(end);
                                active.selectionStart = active.selectionEnd = start;
                            } else if (start > 0) {
                                active.value = val.substring(0, start - 1) + val.substring(start);
                                active.selectionStart = active.selectionEnd = start - 1;
                            }
                        }
                    }
                } else {
                    if (active.value.length > 0) {
                        active.value = active.value.slice(0, -1);
                    } else {
                        const allNodes = currentEd.querySelectorAll('.editor-text-node, .editor-fraction-node');
                        if (allNodes.length > 1) {
                            let prev = active.previousSibling;
                            active.remove();
                            if (prev) {
                                if (prev.classList.contains('editor-fraction-node')) {
                                    prev.querySelectorAll('.editor-fraction-field')[1].focus();
                                } else {
                                    prev.focus();
                                }
                            }
                        }
                    }
                }
                updateInputWidths();
                if (document.activeElement) document.activeElement.focus();
                syncClearDenom();
                refreshMathJaxPreview();
                updateControlKeysState(currentControlState);
                return;
            }

            if (active.classList.contains('editor-fraction-field')) {
                if (!/^[0-9]$/.test(key)) {
                    const fracNode = active.closest('.editor-fraction-node');
                    if (fracNode && fracNode.nextSibling) {
                        active = fracNode.nextSibling;
                        active.focus();
                    }
                }
            }

            const start = active.selectionStart;
            const end = active.selectionEnd;
            const val = active.value;
            active.value = val.substring(0, start) + key + val.substring(end);
            active.selectionStart = active.selectionEnd = start + key.length;

            updateInputWidths();
            active.focus();
            syncClearDenom();
            refreshMathJaxPreview();
            updateControlKeysState(currentControlState);
        }

        function convertDenominatorToFraction() {
            if (!gameStarted || isCompleted) return;
            const currentEd = document.getElementById(activeEditorId);
            if (!currentEd) return;
            
            let active = document.activeElement;
            if (!active || !currentEd.contains(active)) {
                const inputs = currentEd.querySelectorAll('input');
                active = inputs[inputs.length - 1];
            }
            if (!active || active.classList.contains('editor-fraction-field')) return;

            currentEd.classList.add('wide-fraction-mode');

            const fracNode = document.createElement('div');
            fracNode.className = 'editor-fraction-node';

            const topField = document.createElement('input');
            topField.type = 'text';
            topField.className = 'editor-fraction-field frac-top';
            topField.readOnly = true;
            topField.addEventListener('keydown', (e) => e.preventDefault());

            const line = document.createElement('div');
            line.className = 'editor-fraction-line';

            const bottomField = document.createElement('input');
            bottomField.type = 'text';
            bottomField.className = 'editor-fraction-field frac-bottom';
            bottomField.readOnly = true;
            bottomField.addEventListener('keydown', (e) => e.preventDefault());

            fracNode.appendChild(topField);
            fracNode.appendChild(line);
            fracNode.appendChild(bottomField);

            if (active.classList.contains('editor-text-node')) {
                let val = active.value;
                let match = val.match(/[0-9a-zA-Z]+$/);
                
                if (match && match.index > 0) {
                    let preStr = val.substring(0, match.index);
                    const preNode = document.createElement('input');
                    preNode.type = 'text';
                    preNode.className = 'editor-text-node';
                    preNode.value = preStr;
                    preNode.readOnly = true;
                    preNode.addEventListener('keydown', (e) => e.preventDefault());
                    currentEd.insertBefore(preNode, active);
                    
                    bottomField.value = match[0];
                } else if (match && match.index === 0) {
                    bottomField.value = match[0];
                } else {
                    bottomField.value = val;
                }
                
                active.value = "";
                currentEd.insertBefore(fracNode, active);
                topField.focus(); 
            } else {
                currentEd.appendChild(fracNode);
                topField.focus();
            }

            updateInputWidths();
            syncClearDenom();
            refreshMathJaxPreview();
            updateControlKeysState(currentControlState);
        }

    function handleDeleteBehavior(active) {
        const currentEd = document.getElementById(activeEditorId);
        const isFrac = active.classList.contains('editor-fraction-field');
        if (isFrac) {
            const fracNode = active.closest('.editor-fraction-node');
            const fields = fracNode.querySelectorAll('.editor-fraction-field');
            if (fields[0].value.length === 0 && fields[1].value.length === 0) {
                let prev = fracNode.previousSibling;
                fracNode.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                } else createTextBlock(currentEd, "").focus();
            }
        } else {
            const allNodes = currentEd.querySelectorAll('.editor-text-node, .editor-fraction-node');
            if (allNodes.length > 1) {
                let prev = active.previousSibling;
                active.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                }
            }
        }
        
        if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
            currentEd.classList.remove('wide-fraction-mode');
        }
        updateInputWidths();
    }

        if (!gameStarted) {
            startQuizGame();
            return;
        }
        if (isCompleted) {
            if (currentQuestionIndex === 3) {
                restartQuiz();
                return;
            }
            nextQuestion();
            return;
        }
        checkAnswer(); 
    }

            clearBtn.textContent = "消す"; clearBtn.disabled = true;

    function createTextBlock(containerEl, initialValue = "") {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'editor-text-node';
        input.value = initialValue;
        input.autocomplete = 'off';
        input.inputMode = 'none'; 
        input.readOnly = true;
        if (containerEl.childNodes.length === 0) {
            input.placeholder = "ここに入力";
        }
            
        input.addEventListener('keydown', (e) => e.preventDefault());
        containerEl.appendChild(input);
        return input;

                node.style.width = `${Math.max(20, w)}px`;

    function getUserAnswerBySide(stage, side) {
        const ed = document.getElementById(`math-editor-${stage}-${side}`);
        if (!ed) return "";
        let result = "";
        ed.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('editor-fraction-node')) {
                const top = node.querySelector('.frac-top') ? node.querySelector('.frac-top').value : "";
                const bottom = node.querySelector('.frac-bottom') ? node.querySelector('.frac-bottom').value : "";
                if (top !== "" || bottom !== "") {
                    result += `${top}/${bottom}`;
                }
            } else if (node.classList && node.classList.contains('editor-text-node')) {
                result += node.value;
            }
        });
        let s = result.replace(/\s+/g, "");
        if (s.startsWith("+")) s = s.substring(1);
        return s;
    }

    function checkAnswer() {
        const q = quizData[currentQuestionIndex];
        // ※ここにあった startQuestionTimer(); を削除し、判定が間違っていた場合のみリセットするように変更
        
        if (currentStage === 'clear-denom') {
            let userLeft = getUserAnswerBySide('clear-denom', 'left');
            let userRight = getUserAnswerBySide('clear-denom', 'right');
            if (!userLeft && !userRight) return;
            
            const clean = str => (str || '').replace(/^\(([0-9x]+)\)/, '$1').replace(/^\+/, '');
            
            if (clean(userLeft) === clean(q.clearDenomLeftAns) && clean(userRight) === clean(q.clearDenomRightAns)) {
                document.getElementById('group-clear-denom').className = "input-box-group locked-correct";
                document.getElementById('badge-clear-denom').textContent = "正解！";

                currentStage = 'expansion';
                activeEditorId = 'math-editor-expansion-left';
                document.getElementById('group-expansion').className = "input-box-group active-focus";
                document.getElementById('badge-expansion').textContent = "入力中";

                document.getElementById('hint-text').innerHTML = HINT_DATA.expansionInit;
                focusDefaultNode(); refreshMathJaxPreview();
                startQuestionTimer(); // 正解時：タイマーをリセットして再開
            } else {
                showStepError(document.getElementById('group-clear-denom'));
                document.getElementById('hint-text').innerHTML = HINT_DATA.clearDenomError;
            }
        }
        else if (currentStage === 'expansion') {
            let userLeft = getUserAnswerBySide('expansion', 'left');
            let userRight = getUserAnswerBySide('expansion', 'right');
            if (!userLeft && !userRight) return;
            
            // expLeftList と expRightList の配列に含まれているか判定
            if (q.expLeftList.includes(userLeft) && q.expRightList.includes(userRight)) {
                document.getElementById('group-expansion').className = "input-box-group locked-correct";
                document.getElementById('badge-expansion').textContent = "正解！";

                currentStage = 'transposition';
                activeEditorId = 'math-editor-transposition-left';
                document.getElementById('group-transposition').className = "input-box-group active-focus";
                document.getElementById('badge-transposition').textContent = "入力中";

                document.getElementById('hint-text').innerHTML = HINT_DATA.transpositionInit;
                focusDefaultNode(); refreshMathJaxPreview();
                startQuestionTimer(); // 正解時：タイマーをリセットして再開
            } else {
                showStepError(document.getElementById('group-expansion'));
                document.getElementById('hint-text').innerHTML = HINT_DATA.expansionError;
            }
        }
        else if (currentStage === 'transposition') {
            let userLeft = getUserAnswerBySide('transposition', 'left');
            let userRight = getUserAnswerBySide('transposition', 'right');
            if (!userLeft && !userRight) return;
            
            if (q.transLeftList.includes(userLeft) && q.transRightList.includes(userRight)) {
                document.getElementById('group-transposition').className = "input-box-group locked-correct";
                document.getElementById('badge-transposition').textContent = "正解！";

                currentStage = 'arrangement';
                activeEditorId = 'math-editor-arrangement-left';
                document.getElementById('group-arrangement').className = "input-box-group active-focus";
                document.getElementById('badge-arrangement').textContent = "入力中";

                document.getElementById('hint-text').innerHTML = HINT_DATA.arrangementInit;
                focusDefaultNode(); refreshMathJaxPreview();
                startQuestionTimer(); // 正解時：タイマーをリセットして再開
            } else {
                showStepError(document.getElementById('group-transposition'));
                document.getElementById('hint-text').innerHTML = HINT_DATA.transpositionError;
            }
        } else if (currentStage === 'arrangement') {
            let userLeft = getUserAnswerBySide('arrangement', 'left');
            let userRight = getUserAnswerBySide('arrangement', 'right');
            if (!userLeft && !userRight) return;
            
            if (userLeft === q.arrLeftAns && userRight === q.arrRightAns) {
                document.getElementById('group-arrangement').className = "input-box-group locked-correct";
                document.getElementById('badge-arrangement').textContent = "正解！";

                currentStage = 'answer';
                activeEditorId = 'math-editor-answer-right';
                document.getElementById('group-answer').className = "input-box-group active-focus";
                document.getElementById('badge-answer').textContent = "入力中";

                document.getElementById('hint-text').innerHTML = HINT_DATA.answerInit;
                focusDefaultNode(); refreshMathJaxPreview();
            } else {
                showStepError(document.getElementById('group-arrangement'));
                document.getElementById('hint-text').innerHTML = HINT_DATA.arrangementError;
                startQuestionTimer(); // 正解時：タイマーをリセットして再開
            }
        } else if (currentStage === 'answer') {
            let userAns = getUserAnswerBySide('answer', 'right');
            if (!userAns) return;
            
            if (userAns === q.answer) {
                isCompleted = true;
                clearInterval(questionTimerId);
                document.getElementById('countdown-timer').style.display = 'none';
                document.getElementById('group-answer').className = "input-box-group locked-correct";
                document.getElementById('badge-answer').textContent = "正解！";

                if (currentQuestionWrongCount === 0) score++;
                if (document.activeElement) document.activeElement.blur();
                refreshMathJaxPreview();

                if (currentQuestionIndex === 3) {
                    stopTimerClockAndEvaluate();
                    resultMsgEl.textContent = `全 4 問中 ${score} 問ノーミス正解！`;
                    resultMsgEl.className = "result-message correct";
                    progressEl.textContent = (score === 4) ? "全問ノーミスパーフェクト！" : "全問終了！";
                    document.getElementById('hint-text').innerHTML = HINT_DATA.allFinished;
                    updateControlKeysState('finished'); updateSendButtonState();
                } else {
                    resultMsgEl.textContent = "";
                    document.getElementById('hint-text').innerHTML = HINT_DATA.nextQuestion;
                    updateControlKeysState('cleared');
                }
            } else {
                showStepError(document.getElementById('group-answer'));
                document.getElementById('hint-text').innerHTML = HINT_DATA.answerError;
            }
        }
    }
