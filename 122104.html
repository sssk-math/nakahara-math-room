        /* ==========================================================================
           JS: 分数
           ========================================================================== */
        /* --- デフォルトノードにフォーカスを当てる関数 --- */
        function focusDefaultNode(editorId = activeEditorId) {
            if (!gameStarted || isCompleted) return;

            // 追加：対象の枠がロックされている場合は処理を中断し、選択不可にする
            const targetGroupId = (editorId === 'math-editor-expression') ? 'group-expression' : 'group-answer';
            const targetGroup = document.getElementById(targetGroupId);
            if (targetGroup && targetGroup.classList.contains('locked-disabled')) {
                return; 
            }

            const ed = document.getElementById(editorId);
            if (ed) {
                activeEditorId = editorId;
                
                // 枠のアクティブクラス（見た目の強調）の切り替え
                if (editorId === 'math-editor-expression') {
                    document.getElementById('group-expression').classList.add('active-focus');
                    document.getElementById('group-answer').classList.remove('active-focus');
                } else {
                    document.getElementById('group-answer').classList.add('active-focus');
                    if (document.getElementById('group-expression')) {
                        document.getElementById('group-expression').classList.remove('active-focus');
                    }
                }
                
                // 実際の入力フォーカスを当てる
                const input = ed.querySelector('.editor-text-node') || ed.querySelector('input');
                if (input) input.focus();
                refreshMathJaxPreview();
            }
        }

        /* --- テキストブロックを作成する関数 --- */
        function createTextBlock(containerEl, initialValue = "") {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'editor-text-node';
            input.value = initialValue;
            input.autocomplete = 'off';
            input.inputMode = 'none'; 
            input.readOnly = true;
            if (containerEl.childNodes.length === 0) {
                if (containerEl.id === 'math-editor-expression') {
                    input.placeholder = "ここに途中式を入力";
                } else {
                    input.placeholder = "ここに答えを入力";
                }
            }
                
            input.addEventListener('keydown', (e) => e.preventDefault());
            containerEl.appendChild(input);
            return input;
        }
        
        /* --- 分母を分数形式に変換する関数 --- */
        function convertDenominatorToFraction() {
                if (!gameStarted || isCompleted) return;
                const currentEd = document.getElementById(activeEditorId);
                let currentInputNode = document.activeElement;
                if (!currentInputNode || !currentEd.contains(currentInputNode) || !currentInputNode.classList.contains('editor-text-node')) {
                        const inputs = currentEd.querySelectorAll('.editor-text-node');
                        currentInputNode = inputs[inputs.length - 1];
                }
                if (!currentInputNode) return;
                const currentText = currentInputNode.value || "";
                
                // 末尾の連続する数字だけを抽出し、手前の記号と切り分ける
                const match = currentText.match(/^(.*?)(\d+)$/);
                let keepText = currentText; 
                let denValue = "";          
                if (match) {
                        keepText = match[1];
                        denValue = match[2];
                }
                const fractionNode = document.createElement("div");
                fractionNode.className = "editor-fraction-node";
                const numInput = document.createElement("input");
                numInput.type = "text";
                numInput.className = "editor-fraction-field frac-top";
                numInput.inputMode = "none";
                numInput.readOnly = true; 
                const line = document.createElement("div");
                line.className = "editor-fraction-line";
                const denInput = document.createElement("input");
                denInput.type = "text";
                denInput.className = "editor-fraction-field frac-bottom";
                denInput.inputMode = "none";
                denInput.readOnly = true; 

                // 切り分けた数字を分母にセット
                denInput.value = denValue;
                numInput.addEventListener('keydown', (e) => e.preventDefault());
                denInput.addEventListener('keydown', (e) => e.preventDefault());
                fractionNode.appendChild(numInput);
                fractionNode.appendChild(line);
                fractionNode.appendChild(denInput);

                // 手前の記号だけを残し、その直後に分数を挿入する
                currentInputNode.value = keepText;
            currentInputNode.parentNode.insertBefore(fractionNode, currentInputNode.nextSibling);
            const nextTextNode = createTextBlock(currentEd, "");
            currentEd.insertBefore(nextTextNode, fractionNode.nextSibling);
            currentEd.classList.add('wide-fraction-mode'); 
            updateInputWidths();
            
            numInput.focus();
            refreshMathJaxPreview();
            updateControlKeysState(currentControlState);
        }

        /* --- 入力フィールドの幅を更新する関数 --- */
        function updateInputWidths() {
                const ed = document.getElementById(activeEditorId);
                if (!ed) return;
                ed.querySelectorAll('.editor-text-node').forEach(node => {
                        let displayStr = node.value || "";
                        let w = displayStr.length * 15 + 12;
                        
                        if (displayStr === "" && node.placeholder) w = 220;
                        
                        node.style.width = `${Math.max(20, w)}px`;
                });
        }

        /* ==========================================================================
           JS: 利き手切り替え
           ========================================================================== */
        /* --- 利き手を変更する関数 --- */
        function changeHandedness(hand) {
            const workspace = document.querySelector('.game-layout');
            const rightBtn = document.getElementById('hand-right-btn');
            const leftBtn = document.getElementById('hand-left-btn');
            if (hand === 'left') {
                workspace.classList.add('left-handed');
                leftBtn.classList.add('active');
                rightBtn.classList.remove('active');
            } else {
                workspace.classList.remove('left-handed');
                rightBtn.classList.add('active');
                leftBtn.classList.remove('active');
            }
        }

        /* ==========================================================================
           JS: 送信フォーム・タイマー処理（安全ガード付き）
           ========================================================================== */
        /* --- 送信ボタンおよびクリアボタンのアクティブ状態の更新 --- */
        function updateSendButtonState() {
            // すでに送信完了している場合は状態を上書きしない
            if (window.isAlreadySubmitted) return;

            const numVal = numberField ? numberField.value.trim() : "";
            const sendBtnTop = document.getElementById('send-btn');       
            const sendBtnBottom = document.getElementById('action-btn');   
        
            if (sendBtnTop && sendBtnTop.textContent === "完了") return;

            // 生徒番号が4桁で確定(isConfirmed)しており、かつゲームクリア状態であれば送信可能
            const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
            
            if (sendBtnTop) sendBtnTop.disabled = !canSend;
            if (currentControlState === 'finished') {
                if (sendBtnBottom) {
                    sendBtnBottom.disabled = !canSend;
                    if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                    else sendBtnBottom.className = "key action-btn judge-mode"; 
                }
            }
        }

        /* --- フォーム送信を実行する関数 --- */
        function executeFormSubmit(num, name, timeText, stageCount) {
            const form = document.createElement('form');
            form.action = GOOGLE_FORM_URL;
            form.method = 'POST';
            form.target = 'hidden_iframe';
            
            const fields = {
                [FORM_NUM_ID]:         num,                               
                [FORM_NAME_ID]:        name,
                [FORM_TIME_ID]:        timeText,    
                [FORM_STAGE_COUNT_ID]: stageCount                  
            };
            for (const key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }
            document.body.appendChild(form);
            try { form.submit(); } catch (e) { console.error('送信エラー', e); }
            document.body.removeChild(form);
        }

        /* --- Googleフォームへ手動で送信する関数 --- */
        function manualSendToGoogleForm() {
            const numInput = numberField ? numberField.value.trim() : "";
            if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
                return;
            }
            
            const sendBtnTop = document.getElementById('send-btn');
            const sendBtnBottom = document.getElementById('action-btn'); 
            
            if (sendBtnTop) {
                sendBtnTop.textContent = "送信中";
                sendBtnTop.disabled = true; 
            }
            if (currentControlState === 'finished' && sendBtnBottom) {
                sendBtnBottom.textContent = "送信中";
                sendBtnBottom.disabled = true;
                sendBtnBottom.className = "key clear-btn"; 
            }
            
            // データ送信
            const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
            const timeToSend = lastClearTimeText || currentTimerText;
            executeFormSubmit(numInput, "", timeToSend, score);
            window.isAlreadySubmitted = true;
            
            // 送信後は生徒番号をロックして変更不可にする
            if (numberField) numberField.disabled = true;
            if (tooltip) tooltip.classList.remove('show');
        
            setTimeout(() => { 
                if (sendBtnTop) sendBtnTop.textContent = "完了"; 
                if (currentControlState === 'finished' && sendBtnBottom) {
                    sendBtnBottom.textContent = "完了";
                    sendBtnBottom.className = "key clear-btn"; 
                }
            }, 1000);
        }

        /* ==========================================================================
           JS: タイマー
           ========================================================================== */
        /* --- タイマーを更新する関数 --- */
        function updateTimer() {
            const diff = (Date.now() - startTime) + elapsedBeforeResume;
            const min = Math.floor(diff / 60000);
            const sec = Math.floor((diff % 60000) / 1000);
            const msec = Math.floor((diff % 1000) / 100);
            const minStr = String(min).padStart(2, '0');
            const secStr = String(sec).padStart(2, '0');
            document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
        }
        /* --- タイマークロックを開始する関数 --- */
        function startTimerClock() {
            if (practiceMode) return;
            isCorrectState = false;
            lastClearTimeText = "";
            elapsedBeforeResume = 0;
            
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
            document.getElementById('best-update-message').innerText = "";
            const sendBtn = document.getElementById('send-btn');
            if (sendBtn) {
                sendBtn.disabled = true;
                sendBtn.textContent = "送信";
            }
            if (numberField) numberField.disabled = false;
        }
        /* --- タイマークロックを停止し、結果を評価する関数 --- */
        function stopTimerClockAndEvaluate() {
            clearInterval(timerInterval);
            isCorrectState = true; 
            clearInterval(questionTimerId);
            document.getElementById('countdown-timer').style.display = 'none';
            const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
            lastClearTimeText = finalTimeStr;
            
            const totalElapsedTimeMs = (Date.now() - startTime) + elapsedBeforeResume;
            elapsedBeforeResume = totalElapsedTimeMs;
            if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
                bestNormalTimeMs = totalElapsedTimeMs;
                document.getElementById('best-normal-display').innerText = `ベストタイム(6問): ${finalTimeStr}`;
                document.getElementById('best-update-message').innerText = "🎉 ベスト更新！";
                saveKenteiRecords();
            }
            
            const numInput = numberField ? numberField.value.trim() : "";
            const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
            
            if (isValidNum && !window.isAlreadySubmitted) {
                // ルートA：事前に入力済みの場合 → 自動送信して完全ロック
                executeFormSubmit(numInput, "", lastClearTimeText, score);
                window.isAlreadySubmitted = true; 
                
                const sendBtnTop = document.getElementById('send-btn');
                const sendBtnBottom = document.getElementById('action-btn');
                if (sendBtnTop) {
                    sendBtnTop.textContent = "完了";
                    sendBtnTop.disabled = true;
                }
                if (sendBtnBottom) {
                    sendBtnBottom.textContent = "完了";
                    sendBtnBottom.disabled = true;
                    sendBtnBottom.className = "key clear-btn";
                }
                if (numberField) numberField.disabled = true;
            } else {
                // ルートB：未入力の場合 → 手動入力のためにロック解除
                window.isAlreadySubmitted = false;
                if (numberField) numberField.disabled = false;
            }
            
            updateSendButtonState();
        }

        /* --- 設定画面：リセット確認モーダルの制御 --- */
        let pendingResetType = null;

        function openResetConfirm(type) {
            pendingResetType = type;
            const msgEl = document.getElementById('reset-confirm-message');
            if (msgEl) {
                msgEl.textContent = (type === 'mondai')
                    ? '問題選択の取り組み（★/☆の記録）がすべてリセットされます。よろしいですか？'
                    : '検定のベストタイム・連続正解記録がリセットされます。よろしいですか？';
            }
            const modal = document.getElementById('reset-confirm-modal');
            if (modal) modal.style.display = 'flex';
        }

        function closeResetConfirm() {
            pendingResetType = null;
            const modal = document.getElementById('reset-confirm-modal');
            if (modal) modal.style.display = 'none';
        }

        function confirmReset() {
            if (pendingResetType === 'mondai') {
                resetPracticeProgress();
            } else if (pendingResetType === 'kiroku') {
                bestNormalTimeMs = null;
                correctStreakCount = 0;
                maxStreakCount = 0;
                saveKenteiRecords();
                if (!practiceMode) {
                    const bestDisplayEl = document.getElementById('best-normal-display');
                    if (bestDisplayEl) bestDisplayEl.innerText = 'ベストタイム(6問): --:--.-';
                }
            }
            closeResetConfirm();
        }


        let practiceMode              = false;
        let practiceCurrentIndex      = null;
        let practiceProgress          = [];   // 0=未挑戦, 1=ミスありクリア, 2=ノーミスクリア（★）
        let savedQuizData              = null;
        let savedCurrentQuestionIndex  = 0;
        let savedTimerDisplayText      = null;
        let savedBestDisplayText       = null;

        const PRACTICE_PROGRESS_KEY = 'doukou_3koumoku_practice_progress_v1';

        /* --- 検定の記録(ベストタイム・連続正解記録) --- */
        let correctStreakCount = 0;
        let maxStreakCount = 0;
        const KENTEI_RECORDS_KEY = 'doukou_3koumoku_kentei_records_v1';

        function formatMs(ms) {
            const totalMs = Math.max(0, Math.round(ms));
            const min = Math.floor(totalMs / 60000);
            const sec = Math.floor((totalMs % 60000) / 1000);
            const msec = Math.floor((totalMs % 1000) / 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
        }

        function loadKenteiRecords() {
            try {
                const raw = localStorage.getItem(KENTEI_RECORDS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    bestNormalTimeMs = (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null;
                    correctStreakCount = (typeof parsed.streak === 'number') ? parsed.streak : 0;
                    maxStreakCount = (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : 0;
                    return;
                }
            } catch (e) { /* 読み込み失敗時は初期化 */ }
            bestNormalTimeMs = null;
            correctStreakCount = 0;
            maxStreakCount = 0;
        }

        function saveKenteiRecords() {
            try {
                localStorage.setItem(KENTEI_RECORDS_KEY, JSON.stringify({ bestTimeMs: bestNormalTimeMs, streak: correctStreakCount, maxStreak: maxStreakCount }));
            } catch (e) { /* 保存失敗時は何もしない */ }
        }

        /* --- 記録画面を描画する関数 --- */
        function renderKirokuScreen() {
            const perfectCount = practiceProgress.filter(s => s === 2).length;
            const mistakeCount = practiceProgress.filter(s => s === 1).length;
            const mondaiCountEl = document.getElementById('kiroku-mondai-count');
            if (mondaiCountEl) mondaiCountEl.textContent = `★：${perfectCount}問／☆：${mistakeCount}問`;

            const bestTimeEl = document.getElementById('kiroku-best-time');
            if (bestTimeEl) bestTimeEl.textContent = (bestNormalTimeMs !== null) ? formatMs(bestNormalTimeMs) : '--:--.-';

            const streakEl = document.getElementById('kiroku-streak');
            if (streakEl) streakEl.textContent = `現在：${correctStreakCount}問／最高：${maxStreakCount}問`;
        }



        function loadPracticeProgress() {
            try {
                const raw = localStorage.getItem(PRACTICE_PROGRESS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length === FIXED_PROBLEMS.length) {
                        practiceProgress = parsed;
                        return;
                    }
                }
            } catch (e) { /* 読み込み失敗時は初期化 */ }
            practiceProgress = new Array(FIXED_PROBLEMS.length).fill(0);
        }

        function savePracticeProgress() {
            try {
                localStorage.setItem(PRACTICE_PROGRESS_KEY, JSON.stringify(practiceProgress));
            } catch (e) { /* 保存失敗時は何もしない */ }
        }

        function resetPracticeProgress() {
            practiceProgress = new Array(FIXED_PROBLEMS.length).fill(0);
            savePracticeProgress();
        }

        /* --- 問題選択画面のグリッドを描画する関数 --- */
        function renderMondaiGrid() {
            const wrap = document.getElementById('mondai-grid-wrap');
            if (!wrap) return;

            let html = '';
            for (let i = 0; i < FIXED_PROBLEMS.length; i++) {
                const status = practiceProgress[i] || 0;
                const unlocked = (i === 0) || (practiceProgress[i - 1] >= 1);

                let cellClass = 'grid-cell';
                let starHtml = '';
                if (!unlocked) {
                    cellClass += ' locked';
                } else if (status === 2) {
                    cellClass += ' star-perfect';
                    starHtml = '<span class="grid-cell-star star-perfect-mark">★</span>';
                } else if (status === 1) {
                    cellClass += ' star-mistake';
                    starHtml = '<span class="grid-cell-star star-mistake-mark">☆</span>';
                } else {
                    cellClass += ' available';
                }

                const disabledAttr = unlocked ? '' : 'disabled';
                const onclickAttr = unlocked ? `onclick="startPractice(${i})"` : '';

                html += `<button type="button" class="${cellClass}" ${onclickAttr} ${disabledAttr}>`
                      +   `${starHtml}<span class="grid-cell-num">${i + 1}</span>`
                      +   `<span class="grid-cell-formula">${FIXED_PROBLEMS[i].html}</span>`
                      + `</button>`;
            }
            wrap.innerHTML = html;
            wrap.scrollTop = 0;
            updateMathJax([wrap]);
        }

        /* --- 固定問題の演習を開始する関数 --- */
        function startPractice(index) {
            if (!practiceMode) {
                savedQuizData = quizData;
                savedCurrentQuestionIndex = currentQuestionIndex;

                const timerDisplayEl = document.getElementById('timer-display');
                const bestDisplayEl = document.getElementById('best-normal-display');
                savedTimerDisplayText = timerDisplayEl ? timerDisplayEl.innerText : null;
                savedBestDisplayText = bestDisplayEl ? bestDisplayEl.innerText : null;
                if (timerDisplayEl) timerDisplayEl.innerText = '⏱️ --:--.-';
                if (bestDisplayEl) bestDisplayEl.innerText = 'ベストタイム(6問): --:--.-';
            }
            practiceMode = true;
            practiceCurrentIndex = index;
            quizData = [FIXED_PROBLEMS[index]];
            currentQuestionIndex = 0;

            const timerArea = document.getElementById('timer-container-area');
            if (timerArea) timerArea.classList.add('practice-disabled');

            showScreen('screen-kentei');
            startQuizGame();
        }

        /* --- 問題選択モードを終了し、検定用の状態に戻す関数 --- */
        function exitPracticeMode() {
            practiceMode = false;
            practiceCurrentIndex = null;
            quizData = savedQuizData || generateQuizData();
            currentQuestionIndex = savedCurrentQuestionIndex || 0;
            gameStarted = false;
            isCompleted = false;

            const timerDisplayEl = document.getElementById('timer-display');
            const bestDisplayEl = document.getElementById('best-normal-display');
            if (timerDisplayEl && savedTimerDisplayText !== null) timerDisplayEl.innerText = savedTimerDisplayText;
            if (bestDisplayEl && savedBestDisplayText !== null) bestDisplayEl.innerText = savedBestDisplayText;

            const timerArea = document.getElementById('timer-container-area');
            if (timerArea) timerArea.classList.remove('practice-disabled');

            showStartLayout();
        }

        /* --- 検定画面下部の「戻る」ボタンの処理を振り分ける関数 --- */
        function goBackFromKentei() {
            if (practiceMode) {
                exitPracticeMode();
                showScreen('screen-mondai');
                renderMondaiGrid();
            } else {
                showScreen('screen-start');
            }
        }

        /* --- 現在の問題の結果(★/☆)を保存する共通処理 --- */
        function saveCurrentPracticeResult() {
            const idx = practiceCurrentIndex;
            if (idx === null || idx === undefined) return;
            const star = (currentQuestionWrongCount > 0 || isStepMode) ? 1 : 2;
            const prev = practiceProgress[idx] || 0;
            practiceProgress[idx] = Math.max(prev, star);
            savePracticeProgress();
        }

        /* --- 「戻る」：結果を保存して問題選択画面へ戻る --- */
        function recordPracticeResult() {
            saveCurrentPracticeResult();
            exitPracticeMode();
            showScreen('screen-mondai');
            renderMondaiGrid();
        }

        /* --- 「次へ」：結果を保存して次の固定問題へ進む --- */
        function advancePracticeToNext() {
            saveCurrentPracticeResult();
            const nextIndex = practiceCurrentIndex + 1;
            if (nextIndex < FIXED_PROBLEMS.length) {
                startPractice(nextIndex);
            } else {
                exitPracticeMode();
                showScreen('screen-mondai');
                renderMondaiGrid();
            }
        }

           JS: クイズデータ自動生成
           ========================================================================== */
        /* --- クイズデータを生成する関数 --- */
        /* --- クイズデータを生成する関数 --- */
        function generateQuizData() {
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            const formatTerm = (coef) => {
                if (coef === 1) return "x";
                if (coef === -1) return "-x";
                return `${coef}x`;
            };

            // 6パターンをランダムに並び替え、そのうち1問だけ2桁(10〜99)にする
            const patterns = ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'].sort(() => Math.random() - 0.5);
            const doubleDigitIndex = randInt(0, 5);

            let list = [];

            patterns.forEach((type, idx) => {
                const isDouble = (idx === doubleDigitIndex);
                const lo = isDouble ? 10 : 1;
                const hi = isDouble ? 99 : 9;

                let A, B, C, total, expr, ansStep;
                while (true) {
                    A = randInt(lo, hi);
                    B = randInt(lo, hi);
                    C = randInt(lo, hi);

                    switch (type) {
                        case 'q1':
                            total = A + B + C;
                            expr = `${formatTerm(A)} + ${formatTerm(B)} + ${formatTerm(C)}`;
                            ansStep = `(${A}+${B}+${C})x`;
                            break;
                        case 'q2':
                            total = A - B - C;
                            expr = `${formatTerm(A)} - ${formatTerm(B)} - ${formatTerm(C)}`;
                            ansStep = `(${A}-${B}-${C})x`;
                            break;
                        case 'q3':
                            total = A - B + C;
                            expr = `${formatTerm(A)} - ${formatTerm(B)} + ${formatTerm(C)}`;
                            ansStep = `(${A}-${B}+${C})x`;
                            break;
                        case 'q4':
                            total = -A + B - C;
                            expr = `${formatTerm(-A)} + ${formatTerm(B)} - ${formatTerm(C)}`;
                            ansStep = `(-${A}+${B}-${C})x`;
                            break;
                        case 'q5':
                            total = A - B + C;
                            expr = `${formatTerm(A)} + (${formatTerm(-B)}) + ${formatTerm(C)}`;
                            ansStep = `(${A}-${B}+${C})x`;
                            break;
                        case 'q6':
                            total = A + B - C;
                            expr = `${formatTerm(A)} - (${formatTerm(-B)}) - ${formatTerm(C)}`;
                            ansStep = `(${A}+${B}-${C})x`;
                            break;
                    }

                    // 1桁の場合のみ、答えが極端に大きくなりすぎないよう制御(-20〜20)
                    if (isDouble || (total >= -20 && total <= 20)) break;
                }

                let answer;
                if (total === 0) answer = "0";
                else if (total === 1) answer = "x";
                else if (total === -1) answer = "-x";
                else answer = `${total}x`;

                list.push({
                    html: `$$${expr}$$`,
                    ansStep: ansStep,
                    answer: answer
                });
            });

            return list;
        }
