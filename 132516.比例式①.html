<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> <title>比例式（Step16：$ a:b=c:d $）</title></title>
    <script>
        /* ==========================================================================
           1. MathJaxの基本設定
           ========================================================================== */
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        /* ==========================================================================
           2. 画面全体の基本デザイン
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 960px;
            height: 640px;
            flex-shrink: 0;
            min-width: 960px;
            min-height: 640px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 12px;
            position: relative;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px 20px;
        }

        /* ==========================================================================
           3. ヘッダー・タイトル・利き手切り替えボタン
           ========================================================================== */
        header { text-align: center; }

        h1 { font-size: 24px; color: #333; margin-bottom: 5px; }

        .title-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 0px;
        }

        .title-hand-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .title-hand-btn.active { 
            background-color: #1a73e8;
            color: white;
        }

        .game-layout.left-handed {
            flex-direction: row-reverse;
        }

        /* ==========================================================================
           4. タイマー・自己ベスト・生徒番号入力エリア
           ========================================================================== */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f4;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 0px;
            font-weight: bold;
            box-sizing: border-box;
            height: 52px;
        }

        #timer-display {
            font-size: 20px;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }
        
        .record-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border-left: 2px solid #ccc;
            padding-left: 12px;
            height: 100%;
        }

        #best-update-message {
            font-size: 12px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
            height: 1.2em;
            margin-bottom: 1px;
        }

        .best-label-container {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
        }

        .number-field-wrapper {
            position: relative;
            display: inline-block;
        }

        .login-input {
            font-size: 15px;
            padding: 4px 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-weight: normal;
            width: 80px;
        }

        .login-input:focus {
            border-color: #1a73e8;
        }

        .input-tooltip {
            display: none;
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            border: 2px solid #333333;
            color: #333333;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            width: 210px;
        }

        .input-tooltip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #333333 transparent;
        }

        .input-tooltip.show {
            display: block;
        }

        .tooltip-hint {
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }

        .keypad-mini {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
        }

        .key-mini {
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key-mini:active {
            background-color: #dee2e6;
        }

        .key-mini.btn-clear {
            grid-column: span 2;
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-size: 14px;
        }

        .key-mini.btn-clear:active {
            background-color: #ffcdd2;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        #send-btn {
            padding: 6px 12px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 34px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
        }

        #send-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ==========================================================================
           5. メインゲーム画面・左右パネル
           ========================================================================== */
        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 8px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
        }

        .right-panel {
            width: 285px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           6. 問題文・出題数式表示エリア
           ========================================================================== */
        .question-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .question-text { 
            font-size: 20px; 
            color: #333; 
            font-weight: bold; 
        }

        .progress { 
            font-size: 16px; 
            color: #666; 
        }
        
        .formula-display {
            font-size: 26px;
            line-height: 1.4;
            text-align: center;
            color: #000;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ccc;
            height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .formula-display mjx-container { 
            display: inline !important; 
            white-space: normal; 
        }

        /* ==========================================================================
           7. 入力枠のスタイル・「＝」の縦揃えCSS Gridレイアウト
           ========================================================================== */
        .input-block-container { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            width: 100%; 
            margin-bottom: 4px; 
        }

        .input-box-group {
            background: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 4px 10px;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .input-box-group.active-focus { 
            border-color: #007bff; 
            background-color: #f0f7ff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
        }

        .input-box-group.locked-correct { 
            border-color: #81c784; 
            background-color: #e8f5e9; 
            cursor: default; 
        }

        .input-box-group.locked-disabled { 
            border-color: #e9ecef; 
            background-color: #f8f9fa; 
            opacity: 0.6; 
            cursor: not-allowed; 
        }

        .input-box-group.error-shake { 
            border-color: #e57373; 
            background-color: #ffebee; 
        }

        .input-label { 
            font-size: 13px; 
            color: #495057; 
            font-weight: bold; 
            margin-bottom: 0px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .step-badge { 
            font-size: 11px; 
            padding: 1px 6px; 
            border-radius: 4px; 
            background-color: #dee2e6; 
            color: #495057; 
        }

        .locked-correct .step-badge { 
            background-color: #28a745; 
            color: white; 
        }

        .mathjax-render-zone {
            min-height: 34px;
            font-size: 22px; 
            color: #212529; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            width: 100%;
        }

        .mathjax-render-zone.sentence-zone {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
            text-align: center;
            display: block;
        }

        #math-preview-answer {
            gap: 14px;
        }

        /* 💡 「＝」を揃えるための3列のCSS Grid設定 */
        .equation-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            width: 100%;
        }

        .eq-left {
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }

        .eq-equal {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .eq-right {
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }

        #math-editor-expression,
        #math-editor-transposition,
        #math-editor-answer {
            pointer-events: none;
        }

        .math-editor-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        .math-editor-container.wide-fraction-mode {
            height: 86px;
            padding: 4px 14px;
            flex-wrap: wrap;
            overflow: visible;
            border: none !important; 
            background-color: transparent !important; 
        }

        .placeholder-text {
            font-size: 16px;
            color: #adb5bd;
        }

        .editor-text-node {
            border: none;
            outline: none;
            font-size: 24px; 
            text-align: left;
            min-width: 20px;
            height: 32px;
            background: transparent;
            color: #000000;
            pointer-events: none; 
        }

        .editor-text-node::placeholder {
            font-size: 16px;
            color: #adb5bd; 
        }

        .step-box-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 34px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            background-color: #f0f7ff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            margin: 0 0px;
            padding: 0 8px;
        }

        .step-box-small.active-side {
            border-color: #007bff;
            background-color: #f8f9fa;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        .editor-fraction-node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            min-width: 40px;
            margin: 0 4px;
        }

        .editor-fraction-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 3px 0;
        }

        .editor-fraction-field {
            width: 40px;
            height: 24px;
            font-size: 20px; 
            text-align: center;
            border: none !important; 
            background-color: transparent !important; 
            outline: none;
            color: #000000;
            pointer-events: none; 
            font-family: 'Times New Roman', Times, serif !important; 
            font-style: italic !important; 
        }

        #intermediate-expression input,
        .intermediate-expression input,
        #intermediate-expression .inner-box,
        #intermediate-expression [contenteditable="true"] {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important; /* スマホやブラウザ固有の文字色上書き防止 */
            opacity: 1 !important;
        }

        .locked-correct .step-box-small {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
        }

        /* ==========================================================================
           10. ヒント枠のスタイル（右パネル下部）
           ========================================================================== */
        .hint-container { 
            width: 100%; 
            height: 205px; 
            background-color: #fff9db; 
            border: 1px dashed #f59f00; 
            border-radius: 8px; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-bottom: 8px; 
        }

        .hint-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #f59f00; 
            margin-bottom: 4px; 
            text-align: left; 
        }

        .hint-body { 
            font-size: 16px; 
            font-weight: bold;
            color: #495057; 
            line-height: 1.4; 
            text-align: left; 
        }

        /* ==========================================================================
           8. ソフトキーパッドおよび各種ボタン
           ========================================================================== */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(5, 56px); 
            gap: 1px; 
            margin-bottom: 8px; 
        }

        .key {
            height: 46px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key:active:not(:disabled) { 
            background-color: #dee2e6; 
            transform: scale(0.95); 
        }
        
        .key.num-btn { 
            font-family: 'MathJax_Main', 'Times New Roman', Times, serif; 
        }

        .key.op-btn { 
            background-color: #e7f5ff; 
            border-color: #a5d8ff; 
            color: #007bff; 
            font-size: 20px; 
        }

        .key.var-btn { 
            background-color: #f3f0ff; 
            border-color: #d0bfff; 
            color: #6f42c1; 
            font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: normal; 
            font-size: 26px; 
        }

        .key.unit-btn { 
            background-color: #fff0f6; 
            border-color: #ffdeeb; 
            color: #d6336c; 
            font-size: 18px; 
            font-weight: bold; 
        }

        .key.frac-btn { 
            background-color: #fff9db; 
            border-color: #fff3bf; 
            color: #f59f00; 
            font-size: 18px; 
        }

        .key.paren-btn { 
            background-color: #ebfbee; 
            border-color: #b2f2bb; 
            color: #2b8a3e; 
            font-size: 20px; 
        }

        .key.arrow-btn { 
            background-color: #fff3e0; 
            border-color: #ffe0b2; 
            color: #e65100; 
            font-weight: bold; 
        }

        .keypad button:disabled { 
            background-color: #d1d5db !important; 
            color: #9ca3af !important; 
            border-color: #cbd5e1 !important; 
            cursor: not-allowed; 
            opacity: 0.6; 
            box-shadow: none !important; 
            transform: none !important; 
        }

        .control-keys { 
            display: grid; 
            grid-template-columns: repeat(3, 92px); 
            gap: 4px; 
            width: 100%; 
            justify-content: center; 
        }

        .key.action-btn { 
            background-color: #28a745; 
            color: #fff; 
            font-size: 18px; 
            height: 46px; 
            border-color: #1e7e34; 
            width: 100%; 
        }

        .key.action-btn.judge-mode { 
            background-color: #007bff; 
            border-color: #0069d9; 
        }

        .key.clear-btn { 
            background-color: #e9ecef; 
            font-size: 16px; 
            height: 46px; 
            width: 100%; 
            color: #333; 
        }

        .key.clear-btn.hint-mode { 
            background-color: #fd7e14; 
            border-color: #dc6a02; 
            color: #fff; 
        }

        /* ==========================================================================
           9. 正解・不正解メッセージ・フッター
           ========================================================================== */
        .result-message { 
            font-size: 17px; 
            font-weight: bold; 
            min-height: 48px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: auto; 
            margin-right: auto; 
            margin-top: 0px; 
            white-space: pre-wrap; 
            width: 100%; 
        }

        .correct { color: #28a745; }
        .incorrect { color: #e67e22; }

    footer {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #000000;
    font-weight: bold;
    padding-top: 4px;
    border-top: 1px solid #cfd8dc;
    position: absolute;
    bottom: 0;
    left: 0;
    background-color: #ffffff;
    border-radius: 0 0 10px 10px;
    padding-bottom: 4px;
    }
    </style>
</head>

<body>
    <div id="app-container">
        <header>
            <div class="title-bar">
                <button class="title-hand-btn" id="hand-left-btn" onclick="changeHandedness('left')">👈 左利き</button>
                <h1>比例式（Step16：$ a:b=c:d $）</h1>
                <button class="title-hand-btn active" id="hand-right-btn" onclick="changeHandedness('right')">右利き 👉</button>
            </div>
        </header>

        <div class="timer-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="timer-display">⏱️ 00:00.0</div>
                <div class="record-box">
                    <div id="best-update-message"></div>
                    <div class="best-label-container">
                        <div id="best-normal-display">ベストタイム(6問): --:--.-</div>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
            <div class="number-field-wrapper" id="wrapper-area">
                <input type="text" id="number-field" class="login-input" placeholder="生徒番号" readonly autocomplete="off">
                
                <div class="input-tooltip" id="number-tooltip">
                    <div class="tooltip-hint">
                        💡 1年2組34番 → 「1234」<br>
                        <span style="font-size: 10px; color: #888;">クラス: 1〜5組 / 番号: 01〜35</span>
                    </div>
                    
                    <div class="keypad-mini">
                        <button class="key-mini" onclick="pressNum('7')">7</button>
                        <button class="key-mini" onclick="pressNum('8')">8</button>
                        <button class="key-mini" onclick="pressNum('9')">9</button>
                        
                        <button class="key-mini" onclick="pressNum('4')">4</button>
                        <button class="key-mini" onclick="pressNum('5')">5</button>
                        <button class="key-mini" onclick="pressNum('6')">6</button>
                        
                        <button class="key-mini" onclick="pressNum('1')">1</button>
                        <button class="key-mini" onclick="pressNum('2')">2</button>
                        <button class="key-mini" onclick="pressNum('3')">3</button>
                        
                        <button class="key-mini" onclick="pressNum('0')">0</button>
                        <button class="key-mini btn-clear" onclick="pressClear()">⌫ 消す</button>
                    </div>
                    
                    <div class="error-msg" id="error-display">存在しない番号です</div>
                </div>
            </div>
                <button id="send-btn" onclick="manualSendToGoogleForm()" disabled>送信</button>
        </div>
        </div>
        
        <div class="main-content" id="quiz-screen">
            <div class="game-layout">
                <div class="left-panel">
                    <div class="question-wrapper">
                        <span class="question-text">次の計算をしなさい。</span>
                        <span id="countdown-timer" style="display:none; color:#e57373; font-weight:bold; margin-left:15px; font-size:18px;"></span>
                        <span class="progress" id="progress">スタートボタンを押してください。</span>
                    </div>
                    <div class="formula-display" id="formula-box"></div>

                    <div class="input-block-container" id="dynamic-input-container">
    <!-- ① 性質の利用 -->
    <div class="input-box-group locked-disabled" id="group-transposition" onclick="focusDefaultNode(activeEditorId)" style="display:none;">
        <div class="input-label">
            <span>① 性質の利用</span>
            <span class="step-badge" id="badge-transposition">ロック中</span>
        </div>
        <div id="math-preview-transposition" class="mathjax-render-zone sentence-zone"></div>
        <div id="math-editor-transposition-1" class="math-editor-container"></div>
        <div id="math-editor-transposition-2" class="math-editor-container"></div>
        <div id="math-editor-transposition-3" class="math-editor-container"></div>
        <div id="math-editor-transposition-4" class="math-editor-container"></div>
        <div id="math-editor-transposition-5" class="math-editor-container"></div>
    </div>

    <!-- ③ 解 -->

<script>
    /* ==========================================================================
       1. グローバル変数・連携用設定
       ========================================================================== */
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/********/formResponse';
    const FORM_NUM_ID         = 'entry.351767117';   // 問題番号
    const FORM_NAME_ID        = 'entry.785004272';   // 名前
    const FORM_TIME_ID        = 'entry.1218861448';  // クリアタイム
    const FORM_STAGE_COUNT_ID = 'entry.2033679053';  // 正解数

    let startTime              = 0;
    let timerInterval          = null;
    let bestNormalTimeMs       = null;
    let lastClearTimeText      = "";
    let elapsedBeforeResume    = 0;

    let gameStarted            = false;
    let isCompleted            = false;
    let isCorrectState         = false;
    let quizData               = [];
    let currentQuestionIndex   = 0;
    let score                  = 0;
    let currentQuestionWrongCount = 0;
    let isTranspositionRevealed   = false;

    // 💡 ステップモード用変数
    let currentStage           = 'transposition'; // 'transposition'(移項), 'arrangement'(整理), 'answer'(解)
    let activeEditorId         = 'math-editor-transposition-left'; // 初期フォーカスは移項の左辺

    // 💡 30秒タイマー用変数
    let questionTimerId        = null;
    let questionTimeLeft       = 30;
    let currentControlState    = 'start';

    // DOM要素の取得
    const container            = document.getElementById('app-container');
    const formulaBox           = document.getElementById('formula-box');
    const actionBtn            = document.getElementById('action-btn');
    const clearBtn             = document.getElementById('clear-btn');
    const clearAllBtn          = document.getElementById('clear-all-btn');
    const resultMsgEl          = document.getElementById('result-message');
    const progressEl           = document.getElementById('progress');

    let mathjaxPromise         = Promise.resolve();

    /* --- 生徒番号テンキー用変数 --- */
    const numberField = document.getElementById('number-field');
    const tooltip = document.getElementById('number-tooltip');
    const errorDisplay = document.getElementById('error-display');
    let isConfirmed = false;

    /* ==========================================================================
       2. タイマーや生徒番号、記録送信などゲームの本筋とは関係のない部分の関数
       ========================================================================== */
    function resizeApp() {
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
        container.style.transform = `scale(${scale})`;
    }

    function startTimerClock() {
        isCorrectState = false;
        lastClearTimeText = "";
        elapsedBeforeResume = 0;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('best-update-message').innerText = "";
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = "送信";
        }
        if (numberField) numberField.disabled = false;
    }

    function updateTimer() {
        const diff = (Date.now() - startTime) + elapsedBeforeResume;
        const min = Math.floor(diff / 60000);
        const sec = Math.floor((diff % 60000) / 1000);
        const msec = Math.floor((diff % 1000) / 100);
        const minStr = String(min).padStart(2, '0');
        const secStr = String(sec).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
    }

    function stopTimerClockAndEvaluate() {
        clearInterval(timerInterval);
        isCorrectState = true; 
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        lastClearTimeText = finalTimeStr;
        
        const totalElapsedTimeMs = (Date.now() - startTime) + elapsedBeforeResume;
        elapsedBeforeResume = totalElapsedTimeMs;
        if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
            bestNormalTimeMs = totalElapsedTimeMs;
            document.getElementById('best-normal-display').innerText = `ベストタイム(6問): ${finalTimeStr}`;
            document.getElementById('best-update-message').innerText = "🎉 ベスト更新！";
        }
        
        const numInput = numberField ? numberField.value.trim() : "";
        const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
        
        if (isValidNum && !window.isAlreadySubmitted) {
            executeFormSubmit(numInput, "", lastClearTimeText, score);
            window.isAlreadySubmitted = true; 
            
            const sendBtnTop = document.getElementById('send-btn');
            const sendBtnBottom = document.getElementById('clear-btn');
            if (sendBtnTop) {
                sendBtnTop.textContent = "完了";
                sendBtnTop.disabled = true;
            }
            if (sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.disabled = true;
                sendBtnBottom.className = "key clear-btn";
            }
            if (numberField) numberField.disabled = true;
        } else {
            window.isAlreadySubmitted = false;
            if (numberField) numberField.disabled = false;
        }
        
        updateSendButtonState();
    }

    function startQuestionTimer() {
        clearInterval(questionTimerId);
        if (!gameStarted || isCompleted) {
            document.getElementById('countdown-timer').style.display = 'none';
            return;
        }

        if (currentQuestionWrongCount >= 2) {
            document.getElementById('countdown-timer').style.display = 'inline-block';
            document.getElementById('countdown-timer').textContent = "じっくりタイム";
            return;
        }
        questionTimeLeft = 30;
        updateQuestionTimerUI();
        document.getElementById('countdown-timer').style.display = 'inline-block';
        
        questionTimerId = setInterval(() => {
            questionTimeLeft--;
            updateQuestionTimerUI();
            if (questionTimeLeft <= 0) {
                handleQuestionTimeout();
            }
        }, 1000);
    }

    function updateQuestionTimerUI() {
        const el = document.getElementById('countdown-timer');
        if (el) el.textContent = `残り ${questionTimeLeft}秒`;
    }

    function handleQuestionTimeout() {
        clearInterval(questionTimerId);
        let targetGroup;
        const hintBody = document.getElementById('hint-text');

        if (currentStage === 'expression') {
            targetGroup = document.getElementById('group-expression');
            setHintText(HINT_DATA.timeoutExpression);
        } else if (currentStage === 'transposition') {
            targetGroup = document.getElementById('group-transposition');
            setHintText(HINT_DATA.timeoutTransposition);
        } else {
            targetGroup = document.getElementById('group-answer');
            setHintText(HINT_DATA.timeoutAnswer);
        }
        
        showStepError(targetGroup);
        startQuestionTimer();
    }

    function initValidationControls() {
        if (!numberField) return;

        numberField.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isConfirmed || numberField.value !== '') {
                numberField.value = '';
                isConfirmed = false;
                errorDisplay.style.display = 'none';
                updateSendButtonState();
            }
            tooltip.classList.add('show');
            numberField.focus();
        });

        tooltip.addEventListener('click', (e) => { e.stopPropagation(); });

        document.addEventListener('click', (e) => {
            if (tooltip.classList.contains('show') && !isConfirmed) {
                numberField.value = '';
                errorDisplay.style.display = 'none';
                tooltip.classList.remove('show');
                numberField.blur();
                updateSendButtonState();
            }
        });
    }

    function pressNum(num) {
        if (!numberField) return;
        let currentVal = numberField.value;

        if (currentVal.length === 4) {
            currentVal = '';
            errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        if (currentVal.length === 4) {
            const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
            if (isValid) completeInput(currentVal); 
            else errorDisplay.style.display = 'block';
        }
    }

    function completeInput(value) {
        isConfirmed = true;
        tooltip.classList.remove('show');
        numberField.blur();
        updateSendButtonState();
    }

    function pressClear() {
        if (!numberField) return;
        let currentVal = numberField.value;
        if (currentVal.length > 0) {
            numberField.value = currentVal.slice(0, -1);
        }
        errorDisplay.style.display = 'none';
        isConfirmed = false;
        updateSendButtonState();
    }

    function updateSendButtonState() {
        if (window.isAlreadySubmitted) return;

        const numVal = numberField ? numberField.value.trim() : "";
        const sendBtnTop = document.getElementById('send-btn');       
        const sendBtnBottom = document.getElementById('clear-btn');   
    
        if (sendBtnTop && sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
        
        if (sendBtnTop) sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
            if (sendBtnBottom) {
                sendBtnBottom.disabled = !canSend;
                if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                else sendBtnBottom.className = "key action-btn judge-mode"; 
            }
        }
    }

    function executeFormSubmit(num, name, timeText, stageCount) {
        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
            [FORM_NUM_ID]:         num,                               
            [FORM_NAME_ID]:        name,
            [FORM_TIME_ID]:        timeText,    
            [FORM_STAGE_COUNT_ID]: stageCount                  
        };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        
        // 通信キャンセルを防ぐため削除を遅延
        setTimeout(() => { document.body.removeChild(form); }, 1000);
    }

    function manualSendToGoogleForm() {
        const numInput = numberField ? numberField.value.trim() : "";
        if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
            return;
        }
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('clear-btn'); 
        
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信中";
            sendBtnTop.disabled = true; 
        }
        if (currentControlState === 'finished' && sendBtnBottom) {
            sendBtnBottom.textContent = "送信中";
            sendBtnBottom.disabled = true;
            sendBtnBottom.className = "key clear-btn"; 
        }
        
        const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        const timeToSend = lastClearTimeText || currentTimerText;
        executeFormSubmit(numInput, "", timeToSend, score);
        window.isAlreadySubmitted = true;
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');
    
        setTimeout(() => { 
            if (sendBtnTop) sendBtnTop.textContent = "完了"; 
            if (currentControlState === 'finished' && sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.className = "key clear-btn"; 
            }
        }, 1000);
    }

    /* ==========================================================================
       3. テンキー、コントロールキーなどの制御関数
       ========================================================================== */
    function pressKey(key) {
    if (!gameStarted || isCompleted) return;

    // 矢印キー・「＝」キーで入力枠（①の1〜5枠）を移動する
    if (key === '←') {
        if (activeEditorId.startsWith('math-editor-transposition-')) {
            let idx = parseInt(activeEditorId.replace('math-editor-transposition-', ''));
            if (idx > 1) idx--;
            activeEditorId = `math-editor-transposition-${idx}`;
            focusDefaultNode(activeEditorId);
        }
        return;
    }
    if (key === '→' || key === '=') {
        if (activeEditorId.startsWith('math-editor-transposition-')) {
            let idx = parseInt(activeEditorId.replace('math-editor-transposition-', ''));
            if (idx < 4) idx++;
            activeEditorId = `math-editor-transposition-${idx}`;
            focusDefaultNode(activeEditorId);
        }
        return;
    }

    const currentEd = document.getElementById(activeEditorId);
    if (!currentEd) return;
        let active = document.activeElement;

        if (!active || !currentEd.contains(active) || (!active.classList.contains('editor-text-node') && !active.classList.contains('editor-fraction-field'))) {
            const inputs = currentEd.querySelectorAll('input');
            active = inputs[inputs.length - 1];
            if (active) active.focus();
        }

        if (!active) return;
        
        let targetGroup = null;
        if (activeEditorId === 'math-editor-expression') targetGroup = document.getElementById('group-expression');
        else if (activeEditorId === 'math-editor-transposition') targetGroup = document.getElementById('group-transposition');
        else targetGroup = document.getElementById('group-answer');

        if (targetGroup && targetGroup.classList.contains('error-shake')) {
            targetGroup.classList.remove('error-shake');
            targetGroup.classList.add('active-focus');
        }
        
        if (key === 'clear') {
            currentEd.innerHTML = ''; 
            createTextBlock(currentEd, "").focus();
            currentEd.classList.remove('wide-fraction-mode');
            updateInputWidths();
            refreshMathJaxPreview(); 
            updateControlKeysState(currentControlState);
            return;
        }
        
        if (key === 'Backspace') {
            const isFrac = active.classList.contains('editor-fraction-field');
            
            if (isFrac) {
                const fracNode = active.closest('.editor-fraction-node');
                let prev = fracNode.previousSibling;
                fracNode.remove();
                
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else {
                        prev.focus();
                    }
                } else {
                    createTextBlock(currentEd, "").focus();
                }
                
                if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
                    currentEd.classList.remove('wide-fraction-mode');
                }
            }
            else if (active.selectionStart === 0 && active.selectionEnd === 0 && active.previousSibling && active.previousSibling.classList.contains('editor-fraction-node')) {
                const fracNode = active.previousSibling;
                fracNode.remove();
                
                if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
                    currentEd.classList.remove('wide-fraction-mode');
                }
                active.focus();
            }
            else {
                if (active.value.length === 0) { 
                    handleDeleteBehavior(active); 
                } else {
                    const start = active.selectionStart;
                    const end = active.selectionEnd;
                    const val = active.value;
                    if (start !== end) {
                        active.value = val.substring(0, start) + val.substring(end);
                        active.selectionStart = active.selectionEnd = start;
                    } else if (start > 0) {
                        active.value = val.substring(0, start - 1) + val.substring(start);
                        active.selectionStart = active.selectionEnd = start - 1;
                    }
                }
            }
        } else {
            if (!/^[0-9]$/.test(key) && active.classList.contains('editor-fraction-field')) {
                const fracNode = active.closest('.editor-fraction-node');
                if (fracNode && fracNode.nextSibling && fracNode.nextSibling.classList.contains('editor-text-node')) {
                    active = fracNode.nextSibling;
                }
            }
            const start = active.selectionStart;
            active.value = active.value.substring(0, start) + key + active.value.substring(active.selectionEnd);
            active.selectionStart = active.selectionEnd = start + key.length;
        }

        updateInputWidths();
        active.focus();
        refreshMathJaxPreview();
        updateControlKeysState(currentControlState);
    }

    function handleDeleteBehavior(active) {
        const currentEd = document.getElementById(activeEditorId);
        const isFrac = active.classList.contains('editor-fraction-field');
        if (isFrac) {
            const fracNode = active.closest('.editor-fraction-node');
            const fields = fracNode.querySelectorAll('.editor-fraction-field');
            if (fields[0].value.length === 0 && fields[1].value.length === 0) {
                let prev = fracNode.previousSibling;
                fracNode.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                } else createTextBlock(currentEd, "").focus();
            }
        } else {
            const allNodes = currentEd.querySelectorAll('.editor-text-node, .editor-fraction-node');
            if (allNodes.length > 1) {
                let prev = active.previousSibling;
                active.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                }
            }
        }
        
        if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
            currentEd.classList.remove('wide-fraction-mode');
        }
        updateInputWidths();
    }

    function handleAction() {
        if (!gameStarted) {
            startQuizGame();
            return;
        }
        if (isCompleted) {
            if (currentQuestionIndex === 5) {
                restartQuiz();
                return;
            }
            nextQuestion();
            return;
        }
        checkAnswer(); 
    }

    function handleRightBtn() {
        if (currentControlState === 'finished') {
            restartQuiz();
        } else {
            pressKey('clear');
        }
    }

    function handleCenterBtn() {
        if (currentControlState === 'finished') {
            manualSendToGoogleForm();
        } else if (currentControlState === 'playing' && clearBtn.classList.contains('hint-mode')) {
            revealTranspositionHint();
        } else {
            pressKey('Backspace');
        }
    }
    function updateControlKeysState(state) {
        currentControlState = state;
        actionBtn.className = "key action-btn";
        clearBtn.className = "key clear-btn";
        clearAllBtn.className = "key clear-btn";

        if (state === 'start') {
            actionBtn.textContent = "スタート"; actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.disabled = true;
            clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = true;
        } else if (state === 'playing') {
            actionBtn.textContent = "判定する";
            actionBtn.className = "key action-btn judge-mode";
            actionBtn.disabled = false;
            const showHintBtn = !isTranspositionRevealed && currentStage === 'answer' && getUserAnswerBySide('answer', 'right') === '';
            if (showHintBtn) {
                clearBtn.textContent = "ヒント"; clearBtn.className = "key clear-btn hint-mode"; clearBtn.disabled = false;
            } else {
                clearBtn.textContent = "消す"; clearBtn.className = "key clear-btn"; clearBtn.disabled = false;
            }
            clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = false;
        } else if (state === 'cleared') {
            actionBtn.textContent = "次の問題"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.disabled = true;
            clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = true;
        } else if (state === 'finished') {
            actionBtn.textContent = "全問終了"; actionBtn.className = "key clear-btn"; actionBtn.disabled = true;
            clearBtn.textContent = "送信"; clearBtn.className = "key action-btn judge-mode"; clearBtn.disabled = false;
            clearAllBtn.textContent = "もう一回"; clearAllBtn.className = "key action-btn"; clearAllBtn.disabled = false;
        }
    }

    function changeHandedness(hand) {
        const workspace = document.querySelector('.game-layout');
        const rightBtn = document.getElementById('hand-right-btn');
        const leftBtn = document.getElementById('hand-left-btn');
        if (hand === 'left') {
            workspace.classList.add('left-handed');
            leftBtn.classList.add('active');
            rightBtn.classList.remove('active');
        } else {
            workspace.classList.remove('left-handed');
            rightBtn.classList.add('active');
            leftBtn.classList.remove('active');
        }
    }

    function createTextBlock(containerEl, initialValue = "") {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'editor-text-node';
        input.value = initialValue;
        input.autocomplete = 'off';
        input.inputMode = 'none'; 
        input.readOnly = true;
        if (containerEl.childNodes.length === 0) {
            if (containerEl.id === 'math-editor-expression') {
                input.placeholder = "ここに途中式を入力";
            } else if (containerEl.id === 'math-editor-transposition') {
                input.placeholder = "ここに移項した式を入力";
            } else {
                input.placeholder = "ここに答えを入力";
            }
        }
            
        input.addEventListener('keydown', (e) => e.preventDefault());
        containerEl.appendChild(input);
        return input;
    }
    
    function convertDenominatorToFraction() {
        if (!gameStarted || isCompleted) return;
        const currentEd = document.getElementById(activeEditorId);
        let currentInputNode = document.activeElement;
        if (!currentInputNode || !currentEd.contains(currentInputNode) || !currentInputNode.classList.contains('editor-text-node')) {
                const inputs = currentEd.querySelectorAll('.editor-text-node');
                currentInputNode = inputs[inputs.length - 1];
        }
        if (!currentInputNode) return;
        const currentText = currentInputNode.value || "";
        
        const match = currentText.match(/^(.*?)(\d+)$/);
        let keepText = currentText; 
        let denValue = "";          
        if (match) {
                keepText = match[1];
                denValue = match[2];
        }
        const fractionNode = document.createElement("div");
        fractionNode.className = "editor-fraction-node";
        const numInput = document.createElement("input");
        numInput.type = "text";
        numInput.className = "editor-fraction-field frac-top";
        numInput.inputMode = "none";
        numInput.readOnly = true; 
        const line = document.createElement("div");
        line.className = "editor-fraction-line";
        const denInput = document.createElement("input");
        denInput.type = "text";
        denInput.className = "editor-fraction-field frac-bottom";
        denInput.inputMode = "none";
        denInput.readOnly = true; 

        denInput.value = denValue;
        numInput.addEventListener('keydown', (e) => e.preventDefault());
        denInput.addEventListener('keydown', (e) => e.preventDefault());
        fractionNode.appendChild(numInput);
        fractionNode.appendChild(line);
        fractionNode.appendChild(denInput);

        currentInputNode.value = keepText;
        currentInputNode.parentNode.insertBefore(fractionNode, currentInputNode.nextSibling);
        const nextTextNode = createTextBlock(currentEd, "");
        currentEd.insertBefore(nextTextNode, fractionNode.nextSibling);
        currentEd.classList.add('wide-fraction-mode'); 
        updateInputWidths();
        
        numInput.focus();
        refreshMathJaxPreview();
        updateControlKeysState(currentControlState);
    }

    function updateInputWidths() {
        const ed = document.getElementById(activeEditorId);
        if (!ed) return;
        ed.querySelectorAll('.editor-text-node').forEach(node => {
                let displayStr = node.value || "";
                let w = displayStr.length * 15 + 12;
                if (displayStr === "" && node.placeholder) w = 220;
                node.style.width = `${Math.max(20, w)}px`;
        });
    }

    /* ==========================================================================
       4. ゲームの進行に関する関数
       ========================================================================== */
    function showStartLayout() {
        window.isAlreadySubmitted = false;
        const sendBtnTop = document.getElementById('send-btn');
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信";
            sendBtnTop.disabled = true;
        }
        if (numberField) numberField.disabled = false;

        gameStarted = false;
        isCompleted = false;
        progressEl.textContent = "スタートボタンを押してください";
        formulaBox.innerHTML = `<span style="color:#aaa; font-size:24px;">生徒番号を入力→【スタート】</span>`;
        setHintText(HINT_DATA.start);

        document.getElementById('badge-transposition').textContent = "ロック中";
        document.getElementById('badge-answer').textContent = "ロック中";

        document.getElementById('group-transposition').className = "input-box-group locked-disabled";
        document.getElementById('group-answer').className = "input-box-group locked-disabled";

        ['math-editor-transposition-1', 'math-editor-transposition-2', 'math-editor-transposition-3',
         'math-editor-transposition-4', 'math-editor-transposition-5',
         'math-editor-answer-right'].forEach(id => {
            const ed = document.getElementById(id);
            if (ed) {
                ed.innerHTML = '';
                ed.classList.remove('wide-fraction-mode');
                createTextBlock(ed, "");
                updateInputWidths();
            }
        });

        updateControlKeysState('start');
        resultMsgEl.textContent = "";
        refreshMathJaxPreview();
    }

    function startQuizGame() {
        window.isAlreadySubmitted = false; 
        gameStarted = true;
        score = 0;
        currentQuestionIndex = 0;
        startTimerClock();       
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');

        loadQuestion(); 
        if (actionBtn) actionBtn.className = "key action-btn judge-mode"; 
    }

    function loadQuestion() {
        isCompleted = false;
        currentQuestionWrongCount = 0;
        resultMsgEl.textContent = "";
        resultMsgEl.className = "result-message";

        // 入力枠①は問題ごとに非表示にリセットし、「解」の入力からスタート
        isTranspositionRevealed = false;
        document.getElementById('group-transposition').style.display = 'none';
        document.getElementById('answer-label-text').textContent = '解';

        currentStage = 'answer';
        activeEditorId = 'math-editor-answer-right';

        document.getElementById('badge-transposition').textContent = "ロック中";
        document.getElementById('badge-answer').textContent = "入力中";

        document.getElementById('group-transposition').className = "input-box-group locked-disabled";
        document.getElementById('group-answer').className = "input-box-group active-focus";

        ['math-editor-transposition-1', 'math-editor-transposition-2', 'math-editor-transposition-3',
         'math-editor-transposition-4', 'math-editor-transposition-5',
         'math-editor-answer-right'].forEach(id => {
            const ed = document.getElementById(id);
            if (ed) { ed.innerHTML = ''; createTextBlock(ed, ""); }
        });

        updateControlKeysState('playing');

        const q = quizData[currentQuestionIndex];
        progressEl.textContent = `第 ${currentQuestionIndex + 1} 問 / 全 6 問`;
        
        formulaBox.innerHTML = `
            <div class="equation-grid">
                <div class="eq-left">$${q.leftPart}$</div>
                <div class="eq-equal">$=$</div>
                <div class="eq-right">$${q.rightPart}$</div>
            </div>`;
        updateMathJax([formulaBox]);

        setHintText(HINT_DATA.answerInit);

        setTimeout(() => { focusDefaultNode(); refreshMathJaxPreview(); }, 50);
        startQuestionTimer();
    }

    // 💡【新規追加】左右の入力枠から値を取得して空白と先頭の＋を取り除くヘルパー関数
    function getUserAnswerBySide(stage, side) {
        const ed = document.getElementById(`math-editor-${stage}-${side}`);
        if (!ed) return "";
        let result = "";
        ed.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('editor-fraction-node')) {
                const top = node.querySelector('.frac-top') ? node.querySelector('.frac-top').value : "";
                const bottom = node.querySelector('.frac-bottom') ? node.querySelector('.frac-bottom').value : "";
                result += `${top}/${bottom}`;
            } else if (node.classList && node.classList.contains('editor-text-node')) {
                result += node.value;
            }
        });
        let s = result.replace(/\s+/g, "");
        if (s.startsWith("+")) s = s.substring(1);
        return s;
    }

    function triggerStepMode() {
        if (isStepMode && currentStage === 'expression') return;
        
        isStepMode = true;
        currentStage = 'expression';
        activeEditorId = 'math-editor-expression';

        const groupExpr = document.getElementById('group-expression');
        groupExpr.style.display = 'flex';
        document.getElementById('label-transposition-text').innerText = '② 移項';
        document.getElementById('label-answer-text').innerText = '③ 解';

        groupExpr.className = "input-box-group active-focus";
        document.getElementById('group-transposition').className = "input-box-group locked-disabled";
        document.getElementById('group-answer').className = "input-box-group locked-disabled";

        document.getElementById('badge-expression').textContent = "入力中";
        document.getElementById('badge-transposition').textContent = "ロック中";

        document.getElementById('hint-text').innerHTML = HINT_DATA.expressionTrigger;

        focusDefaultNode('math-editor-expression');
        updateControlKeysState('expression');
    }

    function checkAnswer() {
        const q = quizData[currentQuestionIndex];
        startQuestionTimer();
        
        if (currentStage === 'transposition') {
            // 枠1〜4の入力値を取得
            let userAnsList = [];
            for (let i = 1; i <= 4; i++) {
                let ed = document.getElementById(`math-editor-transposition-${i}`);
                let val = "";
                if (ed) {
                    ed.childNodes.forEach(n => { if (n.value) val += n.value; });
                }
                userAnsList.push(val.trim());
            }

            // 全5枠の一致判定
            let isTransCorrect = userAnsList.length === q.transAns.length &&
                userAnsList.every((val, idx) => val.toLowerCase() === q.transAns[idx].toLowerCase());

            if (isTransCorrect) {
                document.getElementById('group-transposition').className = "input-box-group locked-correct";
                document.getElementById('badge-transposition').textContent = "正解！";

                currentStage = 'answer';
                activeEditorId = 'math-editor-answer-right';
                document.getElementById('group-answer').className = "input-box-group active-focus";
                document.getElementById('badge-answer').textContent = "入力中";

                setHintText(HINT_DATA.answerInit);
                focusDefaultNode(); refreshMathJaxPreview();
            } else {
                showStepError(document.getElementById('group-transposition'));
                setHintText(HINT_DATA.transpositionError);
            }
        } else if (currentStage === 'answer') {
            let userAns = getUserAnswerBySide('answer', 'right');
            if (!userAns) return;
            
            // 最終解の判定
            if (userAns === q.answer) {
                isCompleted = true;
                clearInterval(questionTimerId);
                document.getElementById('countdown-timer').style.display = 'none';
                document.getElementById('group-answer').className = "input-box-group locked-correct";
                document.getElementById('badge-answer').textContent = "正解！";

                if (currentQuestionWrongCount === 0) score++;
                if (document.activeElement) document.activeElement.blur();
                refreshMathJaxPreview();

                if (currentQuestionIndex === 5) {
                    stopTimerClockAndEvaluate();
                    resultMsgEl.textContent = `全 6 問中 ${score} 問ノーミス正解！`;
                    resultMsgEl.className = "result-message correct";
                    progressEl.textContent = (score === 6) ? "全問ノーミスパーフェクト！" : "全問終了！";
                    setHintText(HINT_DATA.allFinished);
                    updateControlKeysState('finished'); updateSendButtonState();
                } else {
                    resultMsgEl.textContent = "";
                    setHintText(HINT_DATA.nextQuestion);
                    updateControlKeysState('cleared');
                }
            } else {
                showStepError(document.getElementById('group-answer'));
                setHintText(HINT_DATA.answerError);
            }
        }
    }

    function showStepError(groupEl) {
        currentQuestionWrongCount++;
        startQuestionTimer();
        if (groupEl) {
            groupEl.classList.remove('error-shake');
            void groupEl.offsetWidth;
            groupEl.classList.add('error-shake');
        }

        if (currentQuestionWrongCount >= 2) {
            revealTranspositionHint();
        }
    }

    function revealTranspositionHint() {
        if (isTranspositionRevealed || currentStage !== 'answer') return;
        isTranspositionRevealed = true;
        document.getElementById('group-transposition').style.display = '';
        document.getElementById('answer-label-text').textContent = '② 解';
        document.getElementById('badge-transposition').textContent = "入力中";
        document.getElementById('badge-answer').textContent = "ロック中";
        document.getElementById('group-transposition').className = "input-box-group active-focus";
        document.getElementById('group-answer').className = "input-box-group locked-disabled";

        const answerEd = document.getElementById('math-editor-answer-right');
        if (answerEd) { answerEd.innerHTML = ''; createTextBlock(answerEd, ""); }

        currentStage = 'transposition';
        activeEditorId = 'math-editor-transposition-1';
        setHintText(HINT_DATA.transpositionInit);
        focusDefaultNode(); refreshMathJaxPreview();
    }

    function focusDefaultNode(editorId = activeEditorId) {
    if (!gameStarted || isCompleted) return;
    
    // 対象のグループを特定
    let targetGroupId = 'group-transposition';
    if (editorId.includes('answer')) targetGroupId = 'group-answer';

    const targetGroup = document.getElementById(targetGroupId);
    if (targetGroup && targetGroup.classList.contains('locked-disabled')) return;

    activeEditorId = editorId;
    
    // 背景色のハイライトを更新
    ['group-transposition', 'group-answer'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active-focus');
    });
    if (targetGroup) targetGroup.classList.add('active-focus');

    const ed = document.getElementById(editorId);
    if (ed) {
        const input = ed.querySelector('.editor-text-node') || ed.querySelector('input');
        if (input) input.focus();
    }
    refreshMathJaxPreview();
}

    function getCombinedUserAnswer() {
        const ed = document.getElementById(activeEditorId);
        if (!ed) return "";
        let result = "";
        ed.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('editor-fraction-node')) {
                const top = node.querySelector('.frac-top') ? node.querySelector('.frac-top').value : "";
                const bottom = node.querySelector('.frac-bottom') ? node.querySelector('.frac-bottom').value : "";
                result += `${top}/${bottom}`;
            } else if (node.classList && node.classList.contains('editor-text-node')) {
                result += node.value;
            }
        });
        return result;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); }
    }

    function restartQuiz() {
        quizData = generateQuizData(); 
        showStartLayout(); 
    }

    function refreshMathJaxPreview() {
    if (!quizData[currentQuestionIndex]) return;

    const getVal = edId => {
        const ed = document.getElementById(edId);
        let val = "";
        if (ed) ed.childNodes.forEach(n => { if (n.value) val += n.value; });
        return val;
    };

    // ① 性質の利用のプレビュー表示構築
    const previewTrans = document.getElementById('math-preview-transposition');
    const groupTrans = document.getElementById('group-transposition');
    if (previewTrans) {
        const isCorrect = groupTrans && groupTrans.classList.contains('locked-correct');
        const vals = [];
        for (let i = 1; i <= 5; i++) {
            vals[i] = getVal(`math-editor-transposition-${i}`);
        }

        const renderBox = (idx) => {
            const val = vals[idx];
            if (isCorrect) {
                return val ? `<span class="step-box-small">$${val}$</span>` : `?`;
            }
            const isActive = activeEditorId === `math-editor-transposition-${idx}` ? 'active-side' : '';
            return `<span class="step-box-small ${isActive}">${val ? `$${val}$` : `<span class="placeholder-text">?</span>`}</span>`;
        };

        if (quizData[currentQuestionIndex].transPattern === 'expand') {
            previewTrans.innerHTML = `${renderBox(1)} を ${renderBox(2)} にするには ${renderBox(3)} 倍すればいいので、<br>${renderBox(3)} 倍して ${renderBox(4)} となるような、$x$ の値を求める。`;
        } else {
            previewTrans.innerHTML = `${renderBox(1)} を ${renderBox(2)} にするには ${renderBox(3)} 倍すればいいので、<br>${renderBox(4)} を ${renderBox(3)} 倍して $x$ の値を求める。`;
        }
    }

    // ② 解のプレビュー表示 (x = [解])
    const previewAns = document.getElementById('math-preview-answer');
    const groupAns = document.getElementById('group-answer');
    if (previewAns) {
        const isCorrect = groupAns && groupAns.classList.contains('locked-correct');
        const valRight = getVal('math-editor-answer-right');
        let rightHtml;
        if (isCorrect) {
            rightHtml = valRight ? `$${valRight}$` : `?`;
        } else {
            const isActive = activeEditorId === 'math-editor-answer-right' ? 'active-side' : '';
            rightHtml = `<span class="step-box-small ${isActive}">${valRight ? `$${valRight}$` : `<span class="placeholder-text">解</span>`}</span>`;
        }
        previewAns.innerHTML = `$x = $ ${rightHtml}`;
    }

    updateMathJax([
        document.getElementById('math-preview-transposition'),
        document.getElementById('math-preview-answer')
    ]);
}

    function updateMathJax(elements) {
        if (window.MathJax && MathJax.typesetPromise) {
            if (MathJax.typesetClear) MathJax.typesetClear(elements);
            mathjaxPromise = mathjaxPromise.then(() => MathJax.typesetPromise(elements))
                .catch((err) => console.log("MathJax typesetting failed: " + err.message));
        }
    }

    function setHintText(html) {
        const hintEl = document.getElementById('hint-text');
        if (hintEl) {
            hintEl.innerHTML = html;
            updateMathJax([hintEl]);
        }
    }

    /* ==========================================================================
       5. 問題生成関数
       ========================================================================== */
    function generateQuizData() {
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function gcd(m, n) {
            m = Math.abs(m); n = Math.abs(n);
            while (n) { let t = n; n = m % n; m = t; }
            return m;
        }

        // ⑴〜⑷ を各1問 ＋ ランダムに2問
        const types = [1, 2, 3, 4, getRandomInt(1, 4), getRandomInt(1, 4)];
        shuffleArray(types);

        // 拡大3問・縮小3問をランダムにペアリング
        const patterns = ['expand', 'expand', 'expand', 'reduce', 'reduce', 'reduce'];
        shuffleArray(patterns);

        const questions = [];

        for (let i = 0; i < 6; i++) {
            let type = types[i];
            let pattern = patterns[i];
            let a, b, c, d, k, x, leftStr, rightStr;
            let isValid = false;

            while (!isValid) {
                // 倍率 k (2〜5倍)
                k = getRandomInt(2, 5);

                let p, q;
                if (pattern === 'expand') {
                    // 拡大パターン: xと同じ辺の数値(p, q)を1〜9に設定
                    p = getRandomInt(1, 9);
                    q = getRandomInt(1, 9);
                } else {
                    // 縮小パターン: 反対の辺の数値(p, q)を1〜9に設定（xがk倍しても9を超えないよう制限）
                    p = getRandomInt(1, Math.floor(9 / k));
                    q = getRandomInt(1, 9);
                }

                if (p === q) continue;
                if (gcd(p, q) !== 1) continue;

                if (pattern === 'expand') {
                    if (type === 1) { x = p; b = q; c = p * k; d = q * k; }
                    else if (type === 2) { a = p; x = q; c = p * k; d = q * k; }
                    else if (type === 3) { x = p; d = q; a = p * k; b = q * k; }
                    else if (type === 4) { c = p; x = q; a = p * k; b = q * k; }
                } else {
                    if (type === 1) { c = p; d = q; x = p * k; b = q * k; }
                    else if (type === 2) { c = p; d = q; a = p * k; x = q * k; }
                    else if (type === 3) { a = p; b = q; x = p * k; d = q * k; }
                    else if (type === 4) { a = p; b = q; c = p * k; x = q * k; }
                }

                if (type === 1) { leftStr = `x : ${b}`; rightStr = `${c} : ${d}`; }
                else if (type === 2) { leftStr = `${a} : x`; rightStr = `${c} : ${d}`; }
                else if (type === 3) { leftStr = `${a} : ${b}`; rightStr = `x : ${d}`; }
                else if (type === 4) { leftStr = `${a} : ${b}`; rightStr = `${c} : x`; }

                // 解xの範囲チェック（必ず1〜9の自然数）
                if (x < 1 || x > 9) continue;
                // 数値の大きさ制限（数値が大きくなりすぎないように制御）
                if (a > 85 || b > 85 || c > 85 || d > 85) continue;

                isValid = true;
            }
            
            let transAns = [];
            let box4Val = 1;
            let transPattern = 'reduce';

            if (type === 1) { // x : b = c : d
                leftStr = `x : ${b}`;
                rightStr = `${c} : ${d}`;
                box4Val = c;
                transPattern = (box4Val < x) ? 'reduce' : 'expand';
                transAns = [Math.min(b, d).toString(), Math.max(b, d).toString(), k.toString(), c.toString()];
            } else if (type === 2) { // a : x = c : d
                leftStr = `${a} : x`;
                rightStr = `${c} : ${d}`;
                box4Val = d;
                transPattern = (box4Val < x) ? 'reduce' : 'expand';
                transAns = [Math.min(a, c).toString(), Math.max(a, c).toString(), k.toString(), d.toString()];
            } else if (type === 3) { // a : b = x : d
                leftStr = `${a} : ${b}`;
                rightStr = `x : ${d}`;
                box4Val = a;
                transPattern = (box4Val < x) ? 'reduce' : 'expand';
                transAns = [Math.min(b, d).toString(), Math.max(b, d).toString(), k.toString(), a.toString()];
            } else if (type === 4) { // a : b = c : x
                leftStr = `${a} : ${b}`;
                rightStr = `${c} : x`;
                box4Val = b;
                transPattern = (box4Val < x) ? 'reduce' : 'expand';
                transAns = [Math.min(a, c).toString(), Math.max(a, c).toString(), k.toString(), b.toString()];
            }

            // ② 整理 正解判定用配列
            let arrRightAns = [
                `${box4Val}×${k}`,
                `${k}×${box4Val}`,
                x.toString()
            ];

            questions.push({
                leftPart: leftStr,
                rightPart: rightStr,
                transAns: transAns,
                arrRightAns: arrRightAns,
                answer: x.toString(),
                transPattern: transPattern
            });
        }

        return shuffleArray(questions);
    }

    /* ==========================================================================
       6. ヒントデータ
       ========================================================================== */
    const HINT_DATA = {
        start: "目指せ！パーフェクト！",
        transpositionInit: "前項・後項が何倍になっているか考えて枠を埋めよう！",
        transpositionError: "倍率や比の項の当てはめをもう一度確かめよう！",
        timeoutTransposition: "時間切れ！<br>何倍になっているか考えて枠を埋めよう！",
        arrangementInit: "性質の利用バッチリ！<br>次は $x$ を求める式を書こう（例：$1 × 4$）。",
        arrangementError: "整理の式をもう一度確かめよう！（例：$1 × 4$）",
        answerInit: "解 $x$ を求めよう。",
        answerError: "最後の一息！解をもう一度確かめよう。",
        timeoutAnswer: "時間切れ！<br>解をもう一度確かめよう。",
        nextQuestion: "正解！<br>『次の問題へ』を押そう。",
        allFinished: "全問終了！<br>『送信』ボタンを押そう。"
    };

    /* ==========================================================================
       7. イベントリスナー・初期化
       ========================================================================== */
    window.addEventListener('resize', resizeApp);
    window.addEventListener('DOMContentLoaded', () => {
        resizeApp();
        initValidationControls();
        quizData = generateQuizData();
        showStartLayout();
    });

</script>
