function hintOf(key) {   // いまの問題の種類（整数／分数／反比例）に合ったヒントを返す
    const q = quizData[currentQuestionIndex];
    return HINT_SETS[q ? q.type : 'int'][key];
}


/* ==========================================================================
   3. タイマー【共通】
   ========================================================================== */
function startTimerClock() {
    isCorrectState = false;
    lastClearTimeText = "";
    elapsedBeforeResume = 0;
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 100);
    document.getElementById('best-update-message').innerText = "";
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "送信"; }
    if (numberField) numberField.disabled = false;
}
function updateTimer() {
    const diff = (Date.now() - startTime) + elapsedBeforeResume;
    if (diff >= KENTEI_TIME_LIMIT_MS) { handleKenteiTimeUp(); return; }
    const min = Math.floor(diff / 60000);
    const sec = Math.floor((diff % 60000) / 1000);
    const msec = Math.floor((diff % 1000) / 100);
    document.getElementById('timer-display').innerText = `⏱️ ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
}
function handleKenteiTimeUp() {
    if (!gameStarted || isCompleted) return;
    clearInterval(timerInterval);
    clearInterval(questionTimerId);
    isCompleted = true;
    drawing = false;
    document.getElementById('timer-display').innerText = `⏱️ ${formatMs(KENTEI_TIME_LIMIT_MS)}`;
    correctStreakCount = 0;
    saveKenteiRecords();
    if (document.activeElement) document.activeElement.blur();
    stopTimerClockAndEvaluate(true);
    resultMsgEl.textContent = `時間切れ！全 ${quizData.length} 問中 ${score} 問ノーミス正解`;
    resultMsgEl.className = "result-message incorrect";
    progressEl.textContent = "時間切れ！";
    setGraphActive(false);
    setHint(hintOf('allFinished'));
    updateStageTabs();
    updateControlKeysState('finished'); updateSendButtonState();
}
function stopTimerClockAndEvaluate(isTimeUp = false) {
    clearInterval(timerInterval);
    isCorrectState = true;
    clearInterval(questionTimerId);
    document.getElementById('countdown-timer').style.display = 'none';
    const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
    lastClearTimeText = finalTimeStr;

    const totalElapsedTimeMs = isTimeUp ? KENTEI_TIME_LIMIT_MS : ((Date.now() - startTime) + elapsedBeforeResume);
    elapsedBeforeResume = totalElapsedTimeMs;

    kenteiAttemptCount++;
    saveKenteiRecords();

    if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
        bestNormalTimeMs = totalElapsedTimeMs;
        document.getElementById('best-normal-display').innerText = bestTimeText(finalTimeStr);
        document.getElementById('best-update-message').innerText = isTimeUp ? "" : "🎉 ベスト更新！";
        saveKenteiRecords();
    }

    const numInput = numberField ? numberField.value.trim() : "";
    const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
    if (isValidNum && !window.isAlreadySubmitted) {
        executeFormSubmit(numInput, lastClearTimeText, score);
        window.isAlreadySubmitted = true;
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('action-btn');
        if (sendBtnTop) { sendBtnTop.textContent = "完了"; sendBtnTop.disabled = true; }
        if (sendBtnBottom) { sendBtnBottom.textContent = "完了"; sendBtnBottom.disabled = true; sendBtnBottom.className = "key clear-btn"; }
        if (numberField) numberField.disabled = true;
    } else {
        window.isAlreadySubmitted = false;
        if (numberField) numberField.disabled = false;
    }
    updateSendButtonState();
}
function startQuestionTimer() {
    clearInterval(questionTimerId);
    const cd = document.getElementById('countdown-timer');
    if (!gameStarted || isCompleted) { cd.style.display = 'none'; return; }
    if (currentQuestionWrongCount >= 2) {
        cd.style.display = 'inline-block';
        cd.textContent = "じっくりタイム";
        return;
    }
    questionTimeLeft = (currentStage === 'draw') ? DRAW_TIME_LIMIT_SEC : QUESTION_TIME_LIMIT_SEC;
    updateQuestionTimerUI();
    cd.style.display = 'inline-block';
    questionTimerId = setInterval(() => {
        questionTimeLeft--;
        updateQuestionTimerUI();
        if (questionTimeLeft <= 0) handleQuestionTimeout();
    }, 1000);
}
function updateQuestionTimerUI() {
    const el = document.getElementById('countdown-timer');
    if (el) el.textContent = `残り ${questionTimeLeft}秒`;
}
function formatMs(ms) {
    const totalMs = Math.max(0, Math.round(ms));
    const min = Math.floor(totalMs / 60000);
    const sec = Math.floor((totalMs % 60000) / 1000);
    const msec = Math.floor((totalMs % 1000) / 100);
    return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
}
function bestTimeText(timeStr) { return `ベストタイム(${QUESTION_COUNT}問): ${timeStr}`; }


/* ==========================================================================
   4. 生徒番号入力・記録送信【共通】
   ========================================================================== */
function initValidationControls() {
    if (!numberField) return;
    numberField.addEventListener('click', (e) => {

}
function pressNum(num) {
    if (!numberField) return;

    if (currentVal.length === 4) { currentVal = ''; errorDisplay.style.display = 'none'; }
    currentVal += num;

        const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);

}
function completeInput() {

function pressClear() {

}
function updateSendButtonState() {
    if (window.isAlreadySubmitted) return;

function executeFormSubmit(num, timeText, stageCount) {
    const form = document.createElement('form');
    form.action = GOOGLE_FORM_URL;
    form.method = 'POST';
    form.target = 'hidden_iframe';
    const fields = { [FORM_NUM_ID]: num, [FORM_TIME_ID]: timeText, [FORM_STAGE_COUNT_ID]: stageCount };
    for (const key in fields) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
    }
    document.body.appendChild(form);
    try { form.submit(); } catch (e) { console.error('送信エラー', e); }
    setTimeout(() => { document.body.removeChild(form); }, 1000);
}
function manualSendToGoogleForm() {
    const numInput = numberField ? numberField.value.trim() : "";
    if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) return;
    const sendBtnTop = document.getElementById('send-btn');
    const sendBtnBottom = document.getElementById('action-btn');
    if (sendBtnTop) { sendBtnTop.textContent = "送信中"; sendBtnTop.disabled = true; }
    if (currentControlState === 'finished' && sendBtnBottom) {
        sendBtnBottom.textContent = "送信中"; sendBtnBottom.disabled = true; sendBtnBottom.className = "key clear-btn";
    }
    const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
    executeFormSubmit(numInput, lastClearTimeText || currentTimerText, score);
    window.isAlreadySubmitted = true;
    if (numberField) numberField.disabled = true;
    if (tooltip) tooltip.classList.remove('show');
    setTimeout(() => {
        if (sendBtnTop) sendBtnTop.textContent = "完了";
        if (currentControlState === 'finished' && sendBtnBottom) { sendBtnBottom.textContent = "完了"; sendBtnBottom.className = "key clear-btn"; }
    }, 1000);
}

function loadKenteiRecords() {
    try {
        const raw = localStorage.getItem(KENTEI_RECORDS_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.qc !== QUESTION_COUNT) throw new Error('問題数がちがう古い記録');
            bestNormalTimeMs = (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null;
            correctStreakCount = (typeof parsed.streak === 'number') ? parsed.streak : 0;
            maxStreakCount = (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : 0;
            kenteiAttemptCount = (typeof parsed.attempts === 'number') ? parsed.attempts : 0;
            return;
        }
    } catch (e) { /* 読み込み失敗時は初期化 */ }
    bestNormalTimeMs = null; correctStreakCount = 0; maxStreakCount = 0; kenteiAttemptCount = 0;
}
function saveKenteiRecords() {
    try {
        localStorage.setItem(KENTEI_RECORDS_KEY, JSON.stringify({ bestTimeMs: bestNormalTimeMs, streak: correctStreakCount, maxStreak: maxStreakCount, attempts: kenteiAttemptCount, qc: QUESTION_COUNT }));

function changeHandedness(hand) {

function enterKenteiScreen() {

/* ==========================================================================
   7. グラフ（点をとる／線を引く）【固有】
   ========================================================================== */
const fmtNum = n => (n < 0 ? '−' + (-n) : String(n));
const keyOf = p => p.x + ',' + p.y;
const toPx = x => GRAPH.center + x * GRAPH.unit;
const toPy = y => GRAPH.center - y * GRAPH.unit;

function buildGraph() {
    const svg = document.getElementById('graph-svg');
    const c = GRAPH.center, u = GRAPH.unit, r = GRAPH.range;
    const lo = c - r * u, hi = c + r * u;
    let s = '';
    for (let i = -r; i <= r; i++) {
        if (i === 0) continue;
        const p = c + i * u;
        s += `<line x1="${p}" y1="${lo}" x2="${p}" y2="${hi}" stroke="#cfd8dc" stroke-width="1"/>`;
        s += `<line x1="${lo}" y1="${p}" x2="${hi}" y2="${p}" stroke="#cfd8dc" stroke-width="1"/>`;
    }
    s += `<line x1="${lo - 14}" y1="${c}" x2="${hi + 14}" y2="${c}" stroke="#333" stroke-width="2"/>`;
    s += `<line x1="${c}" y1="${hi + 14}" x2="${c}" y2="${lo - 14}" stroke="#333" stroke-width="2"/>`;
    s += `<polygon points="${hi + 26},${c} ${hi + 12},${c - 6} ${hi + 12},${c + 6}" fill="#333"/>`;
    s += `<polygon points="${c},${lo - 26} ${c - 6},${lo - 12} ${c + 6},${lo - 12}" fill="#333"/>`;
    s += `<text class="svg-axis-label" x="${hi + 22}" y="${c + 22}">x</text>`;
    s += `<text class="svg-axis-label" x="${c + 12}" y="${lo - 18}">y</text>`;
    s += `<text class="svg-axis-label" x="${c - 8}" y="${c + 17}" text-anchor="end" style="font-style:normal;">O</text>`;
    for (let i = -r; i <= r; i++) {
        if (i === 0) continue;
        s += `<text class="svg-tick-label" x="${c + i * u}" y="${c + 20}" text-anchor="middle">${fmtNum(i)}</text>`;
        s += `<text class="svg-tick-label" x="${c - 7}" y="${c - i * u + 6}" text-anchor="end">${fmtNum(i)}</text>`;
    }
    s += `<g id="layer-strokes"></g><g id="layer-ideal"></g><g id="layer-preview"></g><g id="layer-points"></g>`;
    s += `<circle id="hover-dot" cx="-100" cy="-100" r="${POINT_R + 1}" fill="rgba(255,112,67,0.30)"/>`;
    svg.innerHTML = s;

    svg.addEventListener('click', onGraphClick);
    svg.addEventListener('mousemove', onGraphHover);
    svg.addEventListener('mouseleave', hideHoverDot);
    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', endStroke);
    svg.addEventListener('pointercancel', endStroke);
}
function pointFromEvent(e) {   // 画面上の位置 → グラフの座標（連続値）
    const svg = document.getElementById('graph-svg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: (p.x - GRAPH.center) / GRAPH.unit, y: (GRAPH.center - p.y) / GRAPH.unit };
}
function eventToLattice(e) {
    const p = pointFromEvent(e);
    const x = Math.round(p.x), y = Math.round(p.y);
    if (Math.abs(x) > GRAPH.range || Math.abs(y) > GRAPH.range) return null;
    return { x: x, y: y };
}
const canPlot = () => gameStarted && !isCompleted && currentStage === 'plot' && currentControlState === 'playing';
const canDraw = () => gameStarted && !isCompleted && currentStage === 'draw' && currentControlState === 'playing';

function setGraphActive(active) {
    document.getElementById('graph-frame').classList.toggle('inactive', !active);
    if (!active) hideHoverDot();
}
function hideHoverDot() {
    const h = document.getElementById('hover-dot');
    if (h) { h.setAttribute('cx', -100); h.setAttribute('cy', -100); }
}
function resetGraphState() {
    plotted = []; segments = []; dragRaw = null; strokeColor = 'normal'; drawing = false;
    ['layer-strokes', 'layer-ideal', 'layer-preview', 'layer-points'].forEach(id => {
        const l = document.getElementById(id);
        if (l) l.innerHTML = '';
    });
    const frame = document.getElementById('graph-frame');
    frame.classList.remove('error-shake', 'locked-correct');
    document.getElementById('graph-svg').classList.remove('drawing');
    hideHoverDot();
}
function afterGraphEdit() {
    judgeLocked = false;
    strokeColor = 'normal';
    document.getElementById('graph-frame').classList.remove('error-shake');
    renderPlotted();
    renderSegments();
    updateControlKeysState('playing');
}

/* --- 手順1：点をとる --- */
function onGraphClick(e) {
    if (!canPlot()) return;
    const pt = eventToLattice(e);
    if (!pt) return;
    const i = plotted.findIndex(p => p.x === pt.x && p.y === pt.y);
    if (i >= 0) plotted.splice(i, 1); else plotted.push(pt);
    afterGraphEdit();
}
function onGraphHover(e) {
    const h = document.getElementById('hover-dot');
    if (!h) return;
    if (!canPlot()) { hideHoverDot(); return; }
    const pt = eventToLattice(e);
    if (!pt) { hideHoverDot(); return; }
    h.setAttribute('cx', toPx(pt.x)); h.setAttribute('cy', toPy(pt.y));
}
function undoPoint() {
    if (!canPlot() || !plotted.length) return;
    plotted.pop();
    afterGraphEdit();
}
function renderPlotted(badSet) {
    const layer = document.getElementById('layer-points');
    if (!layer) return;
    const ok = stageProgress >= 1;
    let s = '';
    plotted.forEach(p => {
        const bad = badSet && badSet.has(keyOf(p));
        const fill = ok ? '#2e7d32' : (bad ? '#d32f2f' : '#ff7043');
        s += `<circle cx="${toPx(p.x)}" cy="${toPy(p.y)}" r="${POINT_R}" fill="${fill}" stroke="#ffffff" stroke-width="2"/>`;
    });
    layer.innerHTML = s;
}
function checkPlot(q) {
    const target = q.plotPoints;   // グラフの枠内で、直線（曲線）が通るすべての格子点
    const exp = new Set(target.map(keyOf));
    const got = new Set(plotted.map(keyOf));
    const extra = plotted.filter(p => !exp.has(keyOf(p)));
    const missing = target.filter(p => !got.has(keyOf(p)));
    if (!extra.length && !missing.length) { advanceToDraw(); return; }
    renderPlotted(new Set(extra.map(keyOf)));
    let hint;
    if (extra.length) {
        if (q.inv && extra.some(p => p.x === 0)) hint = hintOf('plotZero');
        else if (extra.some(p => exp.has(p.y + ',' + p.x))) hint = hintOf('plotSwap');
        else hint = hintOf('plotExtra');
    } else {
        hint = hintOf('plotMissing')(missing.length);
    }
    setHint(hint);
    showStepError(document.getElementById('graph-frame'));
    judgeLocked = true;
    updateControlKeysState('playing');
}
function advanceToDraw() {
    currentStage = 'draw';
    stageProgress = 1;
    judgeLocked = false;
    document.getElementById('graph-frame').classList.remove('error-shake');
    document.getElementById('graph-svg').classList.add('drawing');
    hideHoverDot();
    renderPlotted();
    resultMsgEl.textContent = '① 点：正解！';
    resultMsgEl.className = 'result-message correct';
    setHint(hintOf('drawInit'));
    updateStageTabs();
    updateControlKeysState('playing');
    startQuestionTimer();
}

/* --- 手順2：線を引く ---
   比例  ＝定規：始点→終点をドラッグ。正解の線に近ければ吸着、はなれていれば揺れて消える
   反比例＝フリーハンド：なぞった線が曲線に近ければ、なめらかな正解の曲線に自動で直る */
function onPointerDown(e) {
    if (!canDraw()) return;
    e.preventDefault();
    const svg = document.getElementById('graph-svg');
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    dragRaw = [pointFromEvent(e)];
    drawing = true;
    judgeLocked = false;
    strokeColor = 'normal';
    document.getElementById('graph-frame').classList.remove('error-shake');
    renderSegments();
    renderPreview();
    updateControlKeysState('playing');
}
function onPointerMove(e) {
    if (!drawing || !dragRaw || !canDraw()) return;
    const q = quizData[currentQuestionIndex];
    const p = pointFromEvent(e);
    if (q.inv) {
        const last = dragRaw[dragRaw.length - 1];
        if (Math.hypot(p.x - last.x, p.y - last.y) < 0.04) return;
        dragRaw.push(p);
    } else {
        dragRaw[1] = p;   // 定規は始点と今の位置だけ
    }
    renderPreview();
}
function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    try { document.getElementById('graph-svg').releasePointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    const raw = dragRaw;
    dragRaw = null;
    const prev = document.getElementById('layer-preview');
    if (prev) prev.innerHTML = '';
    if (raw && e.type !== 'pointercancel' && canDraw()) {
        const q = quizData[currentQuestionIndex];
        const res = q.inv ? snapFreehand(raw, q) : snapRuler(raw, q);
        if (res.ok) { segments.push(res.seg); renderSegments(); }
        else if (res.key !== 'tiny') rejectRaw(raw, res.key);
    }
    updateControlKeysState('playing');
}
function undoStroke() {
    if (!canDraw() || !segments.length) return;
    segments.pop();
    afterGraphEdit();
}
function rawSvg(raw, col, cls) {
    const q = quizData[currentQuestionIndex];
    const P = p => `${toPx(p.x).toFixed(1)},${toPy(p.y).toFixed(1)}`;
    const pts = q.inv ? raw.map(P).join(' ') : P(raw[0]) + ' ' + P(raw[raw.length - 1]);
    return `<polyline class="${cls}" points="${pts}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
}
function renderPreview() {
    const layer = document.getElementById('layer-preview');
    if (!layer) return;
    if (!dragRaw || dragRaw.length < 2) { layer.innerHTML = ''; return; }
    layer.innerHTML = rawSvg(dragRaw, '#90caf9', 'graph-ruler-preview');
}
function rejectRaw(raw, key) {   // 吸着・補正できなかった線：揺れて消える（ミス1回）
    const layer = document.getElementById('layer-preview');
    if (layer && raw.length >= 2) {
        layer.innerHTML = rawSvg(raw, '#e53935', 'graph-wrong-line-reject');
        setTimeout(() => {
            const l = document.getElementById('layer-preview');
            if (l && !drawing) l.innerHTML = '';
        }, 500);
    }
    setHint(hintOf(key));
    showStepError(document.getElementById('graph-frame'));
}
function renderSegments() {
    const layer = document.getElementById('layer-strokes');
    if (!layer) return;
    const col = strokeColor === 'bad' ? '#e53935' : (strokeColor === 'ok' ? '#2e7d32' : '#1e88e5');
    let s = '';
    segments.forEach(sg => {
        const pts = sg.pts.map(p => `${toPx(p.x).toFixed(1)},${toPy(p.y).toFixed(1)}`).join(' ');
        s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
    });
    layer.innerHTML = s;
}
function renderIdeal(q) {
    const layer = document.getElementById('layer-ideal');
    if (!layer) return;
    let s = '';
    q.idealPaths.forEach(path => {
        const pts = path.map(p => `${toPx(p.x).toFixed(1)},${toPy(p.y).toFixed(1)}`).join(' ');
        s += `<polyline points="${pts}" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
    });
    layer.innerHTML = s;
}

/* --- 比例：定規の吸着 --- */
function snapRuler(raw, q) {
    if (raw.length < 2) return { ok: false, key: 'tiny' };
    const a = q.a, p = raw[0], r = raw[raw.length - 1];
    if (Math.hypot(r.x - p.x, r.y - p.y) < 0.6) return { ok: false, key: 'tiny' };
    const n = Math.sqrt(1 + a * a);
    const d = pt => Math.abs(a * pt.x - pt.y) / n;
    if (d(p) > RULER_SNAP || d(r) > RULER_SNAP) return { ok: false, key: 'drawFar' };
    let s0 = (p.x + a * p.y) / n, s1 = (r.x + a * r.y) / n;   // 正解の線に沿った位置（正解の線へ垂直に落とす）
    if (s0 > s1) { const t = s0; s0 = s1; s1 = t; }
    const sMax = q.spans[0][1];
    s0 = Math.max(-sMax, s0); s1 = Math.min(sMax, s1);
    if (s0 < -sMax + EDGE_SNAP) s0 = -sMax;   // 端の近くで止めたら端までのばす
    if (s1 > sMax - EDGE_SNAP) s1 = sMax;
    if (s1 - s0 < 0.3) return { ok: false, key: 'tiny' };
    const pt = s => ({ x: s / n, y: a * s / n });
    return { ok: true, seg: { g: 0, lo: s0, hi: s1, pts: [pt(s0), pt(s1)] } };
}

/* --- 反比例：フリーハンドの自動補正 --- */
function snapFreehand(raw, q) {
    if (raw.length < 2) return { ok: false, key: 'tiny' };
    const dens = densify([raw]);
    if (dens.length < 8) return { ok: false, key: 'tiny' };   // 短すぎるなぞり
    const px = raw.some(p => p.x > 0.15), nx = raw.some(p => p.x < -0.15);
    const py = raw.some(p => p.y > 0.15), ny = raw.some(p => p.y < -0.15);
    if ((px && nx) || (py && ny)) return { ok: false, key: 'drawCross' };
    let near = 0;
    dens.forEach(p => { if (distToIdeal(p, q) <= AUTO_TOL) near++; });
    if (near / dens.length < AUTO_RATIO) return { ok: false, key: 'drawFar' };
    const mx = dens.reduce((s, p) => s + p.x, 0) / dens.length;
    const g = mx > 0 ? 0 : 1;                  // 0＝x>0側、1＝x<0側
    const path = q.idealPaths[g], cum = q.cum[g], total = cum[cum.length - 1];
    const nearest = pt => {
        let bi = 0, bd = 1e9;
        for (let k = 0; k < path.length; k++) {
            const dd = Math.hypot(path[k].x - pt.x, path[k].y - pt.y);
            if (dd < bd) { bd = dd; bi = k; }
        }
        return bi;
    };
    let i = nearest(raw[0]), j = nearest(raw[raw.length - 1]);
    if (i > j) { const t = i; i = j; j = t; }
    if (cum[i] < EDGE_SNAP) i = 0;                       // 端の近くで止めたら端までのばす
    if (cum[j] > total - EDGE_SNAP) j = path.length - 1;
    if (cum[j] - cum[i] < 0.5) return { ok: false, key: 'tiny' };
    return { ok: true, seg: { g: g, lo: cum[i], hi: cum[j], pts: path.slice(i, j + 1) } };
}

/* --- 判定に使う計算 --- */
function densify(strs) {   // 点と点のあいだを細かく補う（間隔0.1目盛り以下）
    const out = [];
    strs.forEach(s => {
        if (s.length === 1) { out.push(s[0]); return; }
        for (let i = 1; i < s.length; i++) {
            const a = s[i - 1], b = s[i];
            const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 0.1));
            for (let k = (i === 1 ? 0 : 1); k <= n; k++) {
                out.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
            }
        }
    });
    return out;
}
function distToIdeal(p, q) {
    if (!q.inv) return Math.abs(q.a * p.x - p.y) / Math.sqrt(q.a * q.a + 1);
    let m = 1e9;
    for (const s of q.sample) {
        const d = Math.hypot(s.x - p.x, s.y - p.y);
        if (d < m) m = d;
    }
    return m;
}
/* --- 線の判定：引いた線が、端から端まで（すき間なく）つながっているか --- */
function judgeDraw(q) {
    let missing = false, gap = false, short = false;
    q.spans.forEach((span, gi) => {
        const iv = segments.filter(s => s.g === gi).map(s => [s.lo, s.hi]).sort((x, y) => x[0] - y[0]);
        if (!iv.length) { missing = true; return; }
        const merged = [];
        iv.forEach(v => {
            const last = merged[merged.length - 1];
            if (last && v[0] <= last[1] + GAP_TOL) last[1] = Math.max(last[1], v[1]);
            else merged.push([v[0], v[1]]);
        });
        if (merged.length > 1) gap = true;
        else if (merged[0][0] > span[0] + 0.01 || merged[0][1] < span[1] - 0.01) short = true;
    });
    if (missing) return { ok: false, key: q.inv ? 'drawBranch' : 'drawShort' };
    if (gap) return { ok: false, key: 'drawGap' };
    if (short) return { ok: false, key: 'drawShort' };
    return { ok: true };
}
function checkDraw(q) {
    const r = judgeDraw(q);
    const frame = document.getElementById('graph-frame');
    if (!r.ok) {
        strokeColor = 'bad';
        renderSegments();
        setHint(hintOf(r.key));
        showStepError(frame);
        judgeLocked = true;
        updateControlKeysState('playing');
        return;
    }
    isCompleted = true;
    drawing = false;
    clearInterval(questionTimerId);
    document.getElementById('countdown-timer').style.display = 'none';
    stageProgress = 2;
    strokeColor = 'ok';
    renderSegments();
    renderIdeal(q);
    frame.classList.remove('error-shake');
    frame.classList.add('locked-correct', 'inactive');
    updateStageTabs();

    if (currentQuestionWrongCount === 0) {
        score++;
        correctStreakCount++;
        if (correctStreakCount > maxStreakCount) maxStreakCount = correctStreakCount;
        saveKenteiRecords();
    }
    if (document.activeElement) document.activeElement.blur();

    if (currentQuestionIndex === QUESTION_COUNT - 1) {
        stopTimerClockAndEvaluate();
        resultMsgEl.textContent = `全 ${QUESTION_COUNT} 問中 ${score} 問ノーミス正解！`;
        resultMsgEl.className = "result-message correct";
        progressEl.textContent = (score === QUESTION_COUNT) ? "全問ノーミスパーフェクト！" : "全問終了！";
        setHint(hintOf('allFinished'));
        updateControlKeysState('finished'); updateSendButtonState();
    } else {
        resultMsgEl.textContent = '② 線：正解！';
        resultMsgEl.className = 'result-message correct';
        setHint(hintOf('nextQuestion'));
        updateControlKeysState('cleared');
    }
}

/* ==========================================================================
   9. 問題の生成【固有】
   ========================================================================== */
const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};
const coefText = a => (a === 1 ? '' : (a === -1 ? '-' : String(a)));

/* --- 比例 y=ax（比例定数が整数）：aは ±1,±2,±3 --- */
function buildPropQuestion(a) {
    const xr = Math.min(GRAPH.range, GRAPH.range / Math.abs(a));   // 枠の端（x=±6 または y=±6）
    const eR = { x: xr, y: a * xr }, eL = { x: -xr, y: -a * xr };
    const plotPoints = [];   // グラフの枠内で直線が通るすべての格子点
    for (let x = -GRAPH.range; x <= GRAPH.range; x++) {
        const y = a * x;
        if (Math.abs(y) <= GRAPH.range) plotPoints.push({ x: x, y: y });
    }
    return {
        type: 'int', inv: false, a: a,
        plotPoints: plotPoints,
        html: `<div class="problem-inner">関数 $y=${coefText(a)}x$ のグラフをかきなさい。</div>`,
        spans: [[-xr * Math.sqrt(1 + a * a), xr * Math.sqrt(1 + a * a)]],
        idealPaths: [[eL, eR]]
    };
}
/* --- 比例 y=(p/d)x（比例定数が分数）：p,d は5以下の既約分数（仮分数もOK）。
   点をとる手順の正解は、枠内で直線が通る格子点すべて（xが分母の倍数の点） --- */
const FRAC_LIST = [[1, 2], [1, 3], [1, 4], [1, 5], [2, 3], [2, 5], [3, 2], [3, 4], [3, 5], [4, 3], [4, 5], [5, 2], [5, 3], [5, 4]];
function buildFracQuestion(sign, p, d) {
    const a = sign * p / d;
    const xr = Math.min(GRAPH.range, GRAPH.range / Math.abs(a));   // 枠の端（x=±6 または y=±6）
    const eR = { x: xr, y: a * xr }, eL = { x: -xr, y: -a * xr };
    const plotPoints = [];   // グラフの枠内で直線が通るすべての格子点（整数のまま計算）
    for (let k = -GRAPH.range; k <= GRAPH.range; k++) {
        const x = k * d, y = sign * p * k + 0;
        if (Math.abs(x) <= GRAPH.range && Math.abs(y) <= GRAPH.range) plotPoints.push({ x: x, y: y });
    }
    return {
        type: 'frac', inv: false, a: a,
        plotPoints: plotPoints,
        html: `<div class="problem-inner">関数 $y=${sign < 0 ? '-' : ''}\\dfrac{${p}}{${d}}x$ のグラフをかきなさい。</div>`,
        spans: [[-xr * Math.sqrt(1 + a * a), xr * Math.sqrt(1 + a * a)]],
        idealPaths: [[eL, eR]]
    };
}
/* --- 反比例 y=a/x：点をとる手順の正解は、枠内（|x|≦6, |y|≦6）で曲線が通るすべての格子点 --- */
function buildInvQuestion(a) {
    const A = Math.abs(a), R = GRAPH.range;
    const plotPoints = [];
    for (let x = -R; x <= R; x++) {
        if (x === 0 || a % x !== 0) continue;
        const y = a / x;
        if (Math.abs(y) <= R) plotPoints.push({ x: x, y: y });
    }
    const cums = [], idealPaths = [], sample = [];
    [1, -1].forEach(sx => {
        const path = [];   // 枠内の曲線（x を対数的に刻む）
        const x0 = A / R, N = 200;
        for (let k = 0; k <= N; k++) {
            const x = sx * x0 * Math.pow(R / x0, k / N);
            path.push({ x: x, y: a / x });
        }
        idealPaths.push(path);
        const cm = [0];   // 曲線に沿った長さ
        for (let k = 1; k < path.length; k++) cm.push(cm[k - 1] + Math.hypot(path[k].x - path[k - 1].x, path[k].y - path[k - 1].y));
        cums.push(cm);
        const xmin = A / 7, M = 600;   // 判定用の細かい点列（枠の少し外まで）
        for (let k = 0; k <= M; k++) {
            const x = sx * xmin * Math.pow(7 / xmin, k / M);
            sample.push({ x: x, y: a / x });
        }
    });
    return {
        type: 'inv', inv: true, a: a,
        plotPoints: plotPoints,
        html: `<div class="problem-inner">関数 $y=${a < 0 ? '-' : ''}\\dfrac{${A}}{x}$ のグラフをかきなさい。</div>`,
        cum: cums, spans: cums.map(c => [0, c[c.length - 1]]), idealPaths: idealPaths, sample: sample
    };
}
/* 1問目＝比例（整数）、2問目＝比例（分数）、3・4問目＝反比例。
   比例の2問は a>0 と a<0 を1問ずつ、反比例の2問も a>0 と a<0 を1問ずつ（順番はランダム） */
function generateQuizData() {
    const v = shuffle([1, 2, 3]);
    const f = shuffle(FRAC_LIST);
    const w = shuffle([6, 12, 18, 24]);
    const s1 = Math.random() < 0.5 ? 1 : -1;
    const s2 = Math.random() < 0.5 ? 1 : -1;
    return [
        buildPropQuestion(s1 * v[0]),
        buildFracQuestion(-s1, f[0][0], f[0][1]),
        buildInvQuestion(s2 * w[0]),
        buildInvQuestion(-s2 * w[1])
    ];
}

        plotMissing: n => `点があと ${n} 個たりないよ。<br>枠の中で直線が通る点を、すべてとろう。（枠の外の点はとれないよ）`,

    }),
    /* 反比例 */
    inv: Object.assign({}, HINT_COMMON, {
        plotInit: "式の $x$ に値を代入して、曲線が通る点を探そう。<br>グラフの枠の中で曲線が通る<b>すべての点</b>をタップしてとろう。もう一度タップすると消えるよ。",
        plotMissing: n => `点があと ${n} 個たりないよ。<br>グラフの中で曲線が通る点を、すべてとろう。`,
        plotExtra: "曲線が通らない点があるよ（赤い点）。<br>$x$ と $y$ をかけた数が、式の数になる点だけをとろう。",
        plotSwap: "$x$ 座標と $y$ 座標が入れかわっていないかな？<br>$(x, y)$ の順に読もう。",
        plotZero: "$x=0$ のときは、0でわれないよ。<br>$y$ 軸の上に点はとれないよ。",
        timeoutPlot: "時間切れ！<br>$x \\times y$ が式の数になる点（$x$, $y$ がともに整数）をとろう。",
        drawInit: "反比例のグラフは、軸と交わらない<b>2つのなめらかな曲線</b>だよ。<br>点を通るように指でなぞろう。少しずれてもなめらかな曲線に直るよ。<b>端から端まで</b>、1本ずつ描こう（何回かに分けてもOK）。",
        drawFar: "なぞった線が、点を通る曲線からはなれているよ。<br>直線ではなく、点をなめらかにつなぐ曲線をなぞり直そう。",
        drawShort: "曲線が端まで届いていないよ。<br>点をつないだだけにしないで、軸に近づくところまで、グラフの端までのばそう。",
        drawGap: "曲線がとぎれているよ。<br>すき間もなぞって、ひと続きの曲線にしよう。",
        drawCross: "曲線は $x$ 軸や $y$ 軸とは交わらないよ。<br>軸に近づいても、軸をこえないように描こう。",
        drawBranch: "曲線は2つあるよ。<br>もう1つの曲線も、端から端まで描こう。",
        timeoutDraw: "時間切れ！<br>点をなめらかな曲線でつないで、端から端までなぞろう。"
    })
};


/* ==========================================================================
   11. イベントリスナー・初期化【共通】
   ========================================================================== */
window.addEventListener('resize', resizeApp);
/* iPad（Safari）：なぞったとき画面が引っ張られたり拡大されたりしないようにする（ヒント欄のスクロールだけは許可） */
document.addEventListener('touchmove', function (e) {
    if (!(e.target.closest && e.target.closest('.hint-container'))) e.preventDefault();
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
});
window.addEventListener('DOMContentLoaded', () => {
    resizeApp();
    initValidationControls();
    buildGraph();
    quizData = generateQuizData();
    loadKenteiRecords();
    const bestDisplayEl = document.getElementById('best-normal-display');
    if (bestDisplayEl) bestDisplayEl.innerText = bestTimeText(bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-');
    showStartLayout();
    showScreen('screen-start');
});

</script>
