<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>変化と対応 Step2 座標を読む</title>
    <script>
        /* ==========================================================================
           1. MathJaxの基本設定
           ========================================================================== */
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        /* ==========================================================================
           2. 画面全体の基本デザイン
           ========================================================================== */
        /* --- 全称要素の基本設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ボディの基本スタイル --- */
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- アプリコンテナのレイアウト設定 --- */
        #app-container {
            width: 960px;
            height: 640px;
            flex-shrink: 0;
            min-width: 960px;
            min-height: 640px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 12px;
            position: relative;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px 20px;
        }

        /* ==========================================================================
           3. ヘッダー・タイトル・利き手切り替えボタン
           ========================================================================== */
        /* --- ヘッダー領域のレイアウト設定 --- */
        header { 
            text-align: center; 
        }

        /* --- タイトル見出しのスタイル --- */
        h1 { 
            font-size: 24px; 
            color: #333; 
            margin-bottom: 5px; 
        }

        /* --- タイトルバーのグリッドレイアウト --- */
        .title-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 0px;
        }

        /* --- 利き手設定ボタンの共通スタイル --- */
        .title-hand-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        /* --- 利き手設定ボタンの活性状態スタイル --- */
        .title-hand-btn.active { 
            background-color: #1a73e8;
            color: white;
        }

        /* --- 左利きレイアウト（反転配置）のスタイル --- */
        .game-layout.left-handed {
            flex-direction: row-reverse;
        }

        /* ==========================================================================
           4. タイマー・自己ベスト・生徒番号入力エリア
           ========================================================================== */
        /* --- タイマーコンテナのレイアウト設定 --- */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f4;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 0px;
            font-weight: bold;
            box-sizing: border-box;
            height: 52px;
        }

        /* --- タイマー表示のスタイル --- */
        #timer-display {
            font-size: 20px;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }
        
        /* --- 記録表示ボックスのスタイル --- */
        .record-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border-left: 2px solid #ccc;
            padding-left: 12px;
            height: 100%;
        }

        /* --- ベスト記録更新メッセージのスタイル --- */
        #best-update-message {
            font-size: 12px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
            height: 1.2em;
            margin-bottom: 1px;
        }

        /* --- ベスト記録ラベルのコンテナスタイル --- */
        .best-label-container {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
        }

        /* --- 生徒番号入力エリアのスタイル --- */
        .number-field-wrapper {
            position: relative;
            display: inline-block;
        }

        /* --- ログイン入力フィールドの共通スタイル --- */
        .login-input {
            font-size: 15px;
            padding: 4px 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-weight: normal;
            width: 80px;
        }

        /* --- 入力フィールドのフォーカス時スタイル --- */
        .login-input:focus {
            border-color: #1a73e8;
        }

        /* --- 専用テンキー付き吹き出しのスタイル --- */
        .input-tooltip {
            display: none;
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            border: 2px solid #333333;
            color: #333333;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            width: 210px;
        }

        /* --- input-tooltipのツールチップ表示用スタイル --- */
        .input-tooltip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #333333 transparent;
        }

        /* --- ツールチップを表示状態にするスタイル --- */
        .input-tooltip.show {
            display: block;
        }

        /* --- ヒント表示用のツールチップスタイル --- */
        .tooltip-hint {
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }

        /* --- ミニテンキーのグリッド配置 --- */
        .keypad-mini {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
        }

        /* --- 小さなボタンやキーのスタイル --- */
        .key-mini {
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* --- 小さなボタンが押下された時のスタイル --- */
        .key-mini:active {
            background-color: #dee2e6;
        }

        /* --- クリアボタン(小)のスタイル --- */
        .key-mini.btn-clear {
            grid-column: span 2;
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-size: 14px;
        }

        /* --- クリアボタン(小)が押下された時のスタイル --- */
        .key-mini.btn-clear:active {
            background-color: #ffcdd2;
        }

        /* --- エラーメッセージ表示用のスタイル --- */
        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        /* --- 送信ボタンのスタイル --- */
        #send-btn {
            padding: 6px 12px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 34px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
        }

        /* --- 送信ボタンが無効化された時のスタイル --- */
        #send-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ==========================================================================
           5. メインゲーム画面・左右パネル
           ========================================================================== */
        /* --- ゲームメインレイアウトの構造設定 --- */
        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 8px;
        }

        /* --- 左パネル（問題表示エリア）のレイアウト --- */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
        }

        /* --- 右パネル（操作・キーパッドエリア）のレイアウト --- */
        .right-panel {
            width: 285px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           6. 問題文・出題数式表示エリア
           ========================================================================== */
        /* ---問題表示のレイアウト --- */
        .question-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* --- 問題文のテキスト表示スタイル --- */
        .question-text { 
            font-size: 20px; 
            color: #333; 
            font-weight: bold; 
        }

        /* --- 進捗表示のスタイル --- */
        .progress { 
            font-size: 16px; 
            color: #666; 
        }

        /* --- 数式表示エリアのスタイル設定 --- */
        .formula-display {
            font-size: 26px;
            line-height: 1.4;
            text-align: center;
            color: #000;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ccc;
            height: auto;
            min-height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 数式表示コンテナのレイアウト設定 --- */
        .formula-display mjx-container { 
            display: inline !important; 
            white-space: normal; 
        }

        /* ==========================================================================
           7. 入力枠のスタイル・「＝」の縦揃えCSS Gridレイアウト
           ========================================================================== */
        /* --- 入力ブロックコンテナのレイアウト設定 --- */
        .input-block-container { 
            display: flex; 
            flex-direction: column; 
            gap: 0px; 
            width: 100%; 
            margin-bottom: 4px; 
        }

        /* --- 入力グループの基本レイアウト設定 --- */
        .input-box-group {
            background: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 4px 10px;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        /* --- 入力グループのフォーカス状態スタイル --- */
        .input-box-group.active-focus { 
            border-color: #007bff; 
            background-color: #f0f7ff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
        }

        /* --- 入力グループの正解確定時スタイル --- */
        .input-box-group.locked-correct { 
            border-color: #81c784; 
            background-color: #e8f5e9; 
            cursor: default; 
        }

        /* --- 入力グループの無効化状態スタイル --- */
        .input-box-group.locked-disabled { 
            border-color: #e9ecef; 
            background-color: #f8f9fa; 
            opacity: 0.6; 
            cursor: not-allowed; 
        }

        /* --- 入力グループの入力エラー時スタイル --- */
        .input-box-group.error-shake { 
            border-color: #e57373; 
            background-color: #ffebee; 
        }

        /* --- 入力ラベルのスタイル --- */
        .input-label { 
            font-size: 13px; 
            color: #495057; 
            font-weight: bold; 
            margin-bottom: 0px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* --- ステップバッジのスタイル --- */
        .step-badge { 
            font-size: 11px; 
            padding: 1px 6px; 
            border-radius: 4px; 
            background-color: #dee2e6; 
            color: #495057; 
        }

        /* --- 正解確定時のステップバッジスタイル --- */
        .locked-correct .step-badge { 
            background-color: #28a745; 
            color: white; 
        }

        /* --- 数式レンダリング領域のスタイル --- */
        .mathjax-render-zone {
            min-height: 34px;
            font-size: 22px; 
            color: #212529; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            width: 100%;
        }

        /* 💡 「＝」を揃えるための3列のCSS Grid設定 */
        .equation-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            width: 100%;
        }

        /* --- 数式の左寄せスタイル --- */
        .eq-left {
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }

        /* --- 数式の中央寄せスタイル --- */
        .eq-equal {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        /* --- 数式の右寄せスタイル --- */
        .eq-right {
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }

        /* --- 数式エディタのコンテナスタイル --- */
        .math-editor-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* --- ワイド分数モード時のコンテナスタイル --- */
        .math-editor-container.wide-fraction-mode {
            height: 60px;
            padding: 4px 14px;
            flex-wrap: wrap;
            overflow: visible;
            border: none !important; 
            background-color: transparent !important; 
        }

        /* --- プレースホルダーのスタイル --- */
        .placeholder-text {
            font-size: 16px;
            color: #adb5bd;
        }

        /* --- エディタのテキストノードスタイル --- */
        .editor-text-node {
            border: none;
            outline: none;
            font-size: 24px; 
            text-align: left;
            min-width: 20px;
            height: 32px;
            background: transparent;
            color: #000000;
            pointer-events: none; 
        }

        .editor-text-node::placeholder {
            font-size: 16px;
            color: #adb5bd; 
        }

        /* --- 小さなステップボックスのスタイル --- */
        .step-box-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 34px;
            border: 2px solid #ced4da;
             border-radius: 6px;
            background-color: #f0f7ff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            margin: 0 0px;
            padding: 0 8px;
        }

        /* --- アクティブな小さなステップボックスのスタイル --- */
        .step-box-small.active-side {
            border-color: #007bff;
            background-color: #f8f9fa;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        /* --- 正解確定時の小さなステップボックスのスタイル --- */
        .locked-correct .step-box-small {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
        }

        /* --- エディタの分数ノードスタイル --- */
        .editor-fraction-node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            min-width: 40px;
            margin: 0 4px;
        }

        /* --- @エディタの分数線スタイル --- */
        .editor-fraction-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 2px 0;
        }

        .editor-fraction-field {
            width: 40px;
            height: 24px;
            font-size: 20px; 
            text-align: center;
            border: none !important; 
            background-color: transparent !important; 
            outline: none;
            color: #000000;
            pointer-events: none; 
            font-family: 'Times New Roman', Times, serif !important; 
            font-style: italic !important; 
        }

        /* ==========================================================================
           8. ソフトキーパッドおよび各種ボタン
           ========================================================================== */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(5, 56px); 
            gap: 1px; 
            margin-bottom: 8px; 
        }

        .key {
            height: 46px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .key:active:not(:disabled) { 
            background-color: #dee2e6; 
            transform: scale(0.95); 
        }
        
        .key.num-btn { 
            font-family: 'MathJax_Main', 'Times New Roman', Times, serif; 
        }

        .key.op-btn { 
            background-color: #e7f5ff; 
            border-color: #a5d8ff; 
            color: #007bff; 
            font-size: 20px; 
        }

        .key.var-btn { 
            background-color: #f3f0ff; 
            border-color: #d0bfff; 
            color: #6f42c1; 
            font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: normal; 
            font-size: 26px; 
        }

        .key.unit-btn { 
            background-color: #fff0f6; 
            border-color: #ffdeeb; 
            color: #d6336c; 
            font-size: 18px; 
            font-weight: bold; 
        }

        .key.frac-btn { 
            background-color: #fff9db; 
            border-color: #fff3bf; 
            color: #f59f00; 
            font-size: 18px; 
        }

        .key.paren-btn { 
            background-color: #ebfbee; 
            border-color: #b2f2bb; 
            color: #2b8a3e; 
            font-size: 20px; 
        }

        .key.arrow-btn { 
            background-color: #fff3e0; 
            border-color: #ffe0b2; 
            color: #e65100; 
            font-weight: bold; 
        }

        .keypad button:disabled { 
            background-color: #d1d5db !important; 
            color: #9ca3af !important; 
            border-color: #cbd5e1 !important; 
            cursor: not-allowed; 
            opacity: 0.6; 
            box-shadow: none !important; 
            transform: none !important; 
        }

        .control-keys { 
            display: grid; 
            grid-template-columns: repeat(3, 92px); 
            gap: 4px; 
            width: 100%; 
            justify-content: center; 
        }

        .key.action-btn { 
            background-color: #28a745; 
            color: #fff; 
            font-size: 18px; 
            height: 46px; 
            border-color: #1e7e34; 
            width: 100%; 
        }

        .key.action-btn.judge-mode { 
            background-color: #007bff; 
            border-color: #0069d9; 
        }

        .key.clear-btn { 
            background-color: #e9ecef; 
            font-size: 16px; 
            height: 46px; 
            width: 100%; 
            color: #333; 
        }

        /* ==========================================================================
           9. 正解・不正解メッセージ・フッター・ヒント
           ========================================================================== */
        .result-message { 
            font-size: 17px; 
            font-weight: bold; 
            min-height: 40px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: auto; 
            margin-right: auto; 
            white-space: pre-wrap; 
            width: 100%; 
        }

        .correct { color: #28a745; }
        .incorrect { color: #e67e22; }

        .hint-container { 
            width: 100%; 
            height: 205px; 
            background-color: #fff9db; 
            border: 1px dashed #f59f00; 
            border-radius: 8px; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-bottom: 8px; 
        }

        .hint-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #f59f00; 
            margin-bottom: 4px; 
            text-align: left; 
        }

        .hint-body { 
            font-size: 16px; 
            font-weight: bold;
            color: #495057; 
            line-height: 1.4; 
            text-align: left; 
        }

        footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #000000;
            font-weight: bold;
            padding-top: 4px;
            border-top: 1px solid #cfd8dc;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: #ffffff;
            border-radius: 0 0 10px 10px;
            padding-bottom: 4px;
        }
    
        /* ==========================================================================
           11. 開始画面・グループ選択/問題選択/記録/設定 画面（テンプレート移植分）
           ========================================================================== */
        .app-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background-color: #eceff1;
        }

        #screen-kentei {
            background-color: #ffffff;
        }

        #screen-mondai-groups {
            justify-content: center;
            align-items: center;
        }

        .start-screen {
            justify-content: center;
            align-items: center;
            gap: 28px;

        .start-title-sub {

            font-weight: bold;
            color: #333;

        }

            flex-direction: column;
            gap: 16px;
            width: 320px;
        }

        .start-menu-btn {
            height: 64px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;

        .start-menu-btn:active {

        }

        .sub-screen-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .sub-screen-header h1 {
            font-size: 22px;
            color: #333;

        }

        .btn-tutorial-hud-secondary {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #e3f2fd;

            border-radius: 8px;
            cursor: pointer;

            background-color: #bbdefb;
        }

        .placeholder-screen {
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        .practice-disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(60%);
        }

        .mondai-grid {
            flex: 1;
            min-height: 0;
            max-height: 495px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            padding: 4px;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .grid-cell {
            position: relative;
            height: 50px;
            font-size: 11px;
            background-color: #e7f5ff;
            border: 1px solid #a5d8ff;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1px;
        }

        .grid-cell.locked {
            background-color: #e9ecef;
            border-color: #ced4da;
            color: #adb5bd;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .grid-cell.available:active {
            transform: scale(0.95);
        }

        .grid-cell.star-perfect {
            background-color: #fff9db;
            border-color: #ffe066;
        }

        .grid-cell.star-mistake {
            background-color: #f1f3f5;
            border-color: #ced4da;
        }

        .grid-cell-star {
            position: absolute;
            top: 1px;
            right: 3px;
            font-size: 12px;
        }

        .star-perfect-mark { color: #f5a623; }
        .star-mistake-mark { color: #999; }

        .grid-cell-formula {
            font-size: 12px;
            line-height: 1.1;
        }

        .grid-cell-num {
            font-size: 9px;
            color: #999;
            margin-top: 1px;
        }

        .key.action-btn-back {
            background-color: #fb8c00;
            color: #fff;
            border: none;
            font-size: 18px;
            height: 46px;
            width: 100%;
        }

        .key.action-btn-back:disabled {
            background-color: #ffcc80;
            color: #fff;
            cursor: not-allowed;
        }

        .kiroku-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 560px;
            margin: 0 auto;
        }

        .kiroku-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px 18px;
            text-align: center;
        }

        .kiroku-card-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .kiroku-card-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a73e8;
        }

        .settei-reset-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .settei-reset-btn {
            width: 280px;
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            color: #c0392b;
            background-color: #fdecea;
            border: 1px solid #f1a9a0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .settei-reset-btn:active {
            background-color: #f8d3ce;
        }

        .reset-confirm-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 12px;
        }

        .reset-confirm-box {
            width: 340px;
            background-color: #fff;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .reset-confirm-message {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .reset-confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .reset-confirm-cancel, .reset-confirm-ok {
            flex: 1;
            height: 44px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .reset-confirm-cancel {
            background-color: #e9ecef;
            color: #333;
        }

        .reset-confirm-ok {
            background-color: #e74c3c;
            color: #fff;
        }

        /* --- グループ選択画面専用 --- */
        .group-select-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 470px;
            margin: 0 auto;
        }

        .group-select-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
        }

        .group-select-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .group-select-btn:disabled {
            background-color: #cfd8dc;
            color: #90a4ae;
            cursor: not-allowed;
        }

        .group-select-btn .group-select-sub {
            font-size: 12px;
            font-weight: normal;
        }

       .group-select-btn > span:first-child {
           white-space: nowrap;
       }

        /* ==========================================================================
           12. 座標アプリ固有：問題枠（左・約1）とグラフ枠（右・約4）の横2分割
           ========================================================================== */
        /* --- 左パネル：問題枠とグラフ枠を横に並べる（テンプレートの縦積みを上書き） --- */
        .left-panel {
            flex: 1;
            min-width: 0;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 8px;
            height: auto;
        }

        /* --- 問題枠 --- */
        .problem-frame {
            flex: 3 1 0;
            min-width: 0;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background-color: #f8f9fa;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 8px 6px;
        }

        .problem-frame .progress {
            font-size: 13px;
            text-align: center;
            line-height: 1.3;
        }

        #countdown-timer {
            font-size: 14px;
            color: #e57373;
            font-weight: bold;
            text-align: center;
        }

        .problem-frame .question-text {
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
            margin-top: 4px;
        }

        .coord-display {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
            margin: 4px 0 8px;
            min-height: 30px;
        }

        .selected-info {
            width: 100%;
            text-align: center;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 6px 2px;
        }

        .selected-info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .selected-info-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
        }

        .problem-frame .result-message {
            margin-top: auto;
            font-size: 15px;
            min-height: 60px;
        }

        /* --- グラフ枠 --- */
        .graph-frame {
            flex: 7 1 0;
            min-width: 0;
            align-self: flex-start;
            height: 480px;
            background-color: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            overflow: hidden;
            transition: opacity 0.2s, border-color 0.2s, background-color 0.2s;
        }

        #graph-svg {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }

        .graph-frame.inactive {
            opacity: 0.5;
            pointer-events: none;
        }

        .graph-frame.locked-correct.inactive {
            opacity: 1;
        }

        .graph-frame.locked-correct {
            border-color: #81c784;
            background-color: #e8f5e9;
        }

        .graph-frame.error-shake {
            border-color: #e57373;
            background-color: #ffebee;
            animation: graph-shake 0.35s;
        }

        @keyframes graph-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .svg-axis-label {
            font-size: 19px;
            font-style: italic;
            fill: #333;
        }

        .svg-tick-label {
            font-size: 18px;
            fill: #555;
        }

        .svg-point-label {
            font-size: 20px;
            font-weight: bold;
            fill: #2e7d32;
        }


        /* ==========================================================================
           13. 検定の分岐：記録画面（2種類並べる）・検定②の問題表示
           ========================================================================== */
        .kiroku-section-title {
            width: 700px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 0 auto 6px;
            text-align: left;
        }

        .kiroku-cards.kiroku-cards-3 {
            grid-template-columns: 1fr 1fr 1.4fr;
            width: 700px;
        }

        .kiroku-cards-3 .kiroku-card {
            padding: 10px 8px;
        }

        /* 検定②：点P・点Aの表示（問題枠の幅に合わせて折り返す） */
        .coord-display.move-info {
            font-size: 18px;
            line-height: 1.5;
            white-space: normal;
            text-align: left;
            width: 100%;
            padding: 0 6px;
        }

        .move-line {
            margin-bottom: 6px;
        }

        /* ==========================================================================
           14. 検定：座標を読む　問題枠（上）／グラフ枠（左下）＋解答枠（右下）
           ========================================================================== */
        .left-panel {
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 8px;
        }
        .problem-frame {
            flex: none;
            height: 58px;
            box-sizing: border-box;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 10px;
        }
        .problem-frame .pf-left {
            width: 122px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .problem-frame .question-text {
            flex: 1;
            margin: 0;
            font-size: 19px;
            font-weight: bold;
            white-space: nowrap;
        }
        .problem-frame .result-message {
            width: 215px;
            margin: 0;
            min-height: 0;
            font-size: 14px;
            text-align: center;
            white-space: pre-line;
            line-height: 1.3;
        }
        .read-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .graph-frame {
            flex: none;
            width: 396px;
            height: 396px;
        }
        #graph-svg { cursor: default; }
        .answer-frame {
            flex: 1;
            min-width: 0;
            height: 396px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: #f8f9fa;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 6px 4px;
        }
        .answer-title { font-size: 14px; font-weight: bold; text-align: center; color: #333; }
        #answer-rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 4px 2px;
            border: 2px solid transparent;
            border-radius: 8px;
        }
        .a-label { width: 24px; text-align: center; font-size: 22px; font-weight: bold; color: #0d3b66; }
        .a-par   { font-size: 22px; font-weight: bold; color: #0d3b66; }
        .cbox {
            width: 48px; height: 38px; padding: 0;
            font-size: 20px; font-weight: bold; font-family: inherit; color: #1b2a3a;
            background: #fff; border: 2px solid #9cc3e0; border-radius: 6px; cursor: pointer;
        }
        .cbox.ph { font-size: 14px; font-weight: normal; font-style: italic; color: #8a97a3; }
        .cbox.sel { border-color: #e53935; background: #fff6f5; box-shadow: 0 0 0 2px #f6b5b2; }
        .cbox:disabled { cursor: default; }
        .answer-row.pending { opacity: 0.45; }
        .answer-row.done { background: #e8f5e9; border-color: #81c784; }
        .answer-row.done .cbox { border-color: #81c784; background: #f1f8e9; color: #2e7d32; }
        .answer-row.wrong { background: #ffebee; border-color: #e57373; animation: graph-shake 0.35s; }
        .answer-row.wrong .cbox { border-color: #e57373; }
        .svg-pt-label { font-size: 24px; font-weight: bold; fill: #0d3b66; }
        .svg-pt-label.done { fill: #2e7d32; }
    </style>
</head>

<body>
    <div id="app-container">
        <!-- ===== 開始画面 ===== -->
        <div id="screen-start" class="app-screen start-screen">
            <div class="start-title" style="text-align:center;">
                <div class="start-title-main">変化と対応</div>
                <div class="start-title-sub">Step2：座標を読む</div>
            </div>
            <div class="start-menu">
                <button class="start-menu-btn" onclick="enterKenteiScreen()">📝 検定</button>
                <button class="start-menu-btn" onclick="showScreen('screen-kiroku'); renderKirokuScreen();">🏆 記録</button>
                <button class="start-menu-btn" onclick="showScreen('screen-settei')">⚙️ 設定</button>
            </div>
        </div>

        <!-- ===== 記録画面 ===== -->
        <div id="screen-kiroku" class="app-screen" style="display:none; align-items:center; justify-content:center; gap:16px;">
            <div class="sub-screen-header"><h1>🏆 記録</h1></div>
            <div>
                <div class="kiroku-section-title">検定：座標を読む</div>
                <div class="kiroku-cards kiroku-cards-3">
                    <div class="kiroku-card">
                        <div class="kiroku-card-label">受検回数</div>
                        <div class="kiroku-card-value" id="kiroku-attempts-coord">0回</div>
                    </div>
                    <div class="kiroku-card">
                        <div class="kiroku-card-label">ベストタイム</div>
                        <div class="kiroku-card-value" id="kiroku-best-time-coord">--:--.-</div>
                    </div>
                    <div class="kiroku-card">
                        <div class="kiroku-card-label">連続正解記録</div>
                        <div class="kiroku-card-value" id="kiroku-streak-coord">現在：0問／最高：0問</div>
                    </div>
                </div>
            </div>
            <button class="btn-tutorial-hud-secondary" onclick="showScreen('screen-start')">←開始画面へ</button>
        </div>

        <!-- ===== 設定画面 ===== -->
        <div id="screen-settei" class="app-screen" style="display:none; align-items:center; justify-content:center; gap:16px;">
            <div class="sub-screen-header"><h1>⚙️ 設定</h1></div>
            <div class="settei-reset-buttons">
                <button class="settei-reset-btn" onclick="openResetConfirm('kiroku')">🗑️ 記録をリセットする</button>
            </div>
            <button class="btn-tutorial-hud-secondary" onclick="showScreen('screen-start')">←開始画面へ</button>
        </div>

        <!-- ===== リセット確認ダイアログ ===== -->
        <div id="reset-confirm-modal" class="reset-confirm-overlay" style="display:none;">
            <div class="reset-confirm-box">
                <div class="reset-confirm-message" id="reset-confirm-message"></div>
                <div class="reset-confirm-buttons">
                    <button class="reset-confirm-cancel" onclick="closeResetConfirm()">キャンセル</button>
                    <button class="reset-confirm-ok" onclick="confirmReset()">リセットする</button>
                </div>
            </div>
        </div>

        <!-- ===== 検定画面 ===== -->
        <div id="screen-kentei" class="app-screen" style="display:none;">
        <header>
            <div class="title-bar">
                <button class="title-hand-btn" id="hand-left-btn" onclick="changeHandedness('left')">👈 左利き</button>
                <h1 id="kentei-title">変化と対応（検定：座標を読む）</h1>
                <button class="title-hand-btn active" id="hand-right-btn" onclick="changeHandedness('right')">右利き 👉</button>
            </div>
        </header>

        <div class="timer-container" id="timer-container-area">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="timer-display">⏱️ 00:00.0</div>
                <div class="record-box">
                    <div id="best-update-message"></div>
                    <div class="best-label-container">
                        <div id="best-normal-display">ベストタイム(5問): --:--.-</div>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="number-field-wrapper" id="wrapper-area">
                    <input type="text" id="number-field" class="login-input" placeholder="生徒番号" readonly autocomplete="off">
                    
                    <div class="input-tooltip" id="number-tooltip">
                        <div class="tooltip-hint">
                            💡 1年2組34番 → 「1234」<br>
                            <span style="font-size: 10px; color: #888;">クラス: 1〜5組 / 番号: 01〜35</span>
                        </div>
                        
                        <div class="keypad-mini">
                            <button class="key-mini" onclick="pressNum('7')">7</button>
                            <button class="key-mini" onclick="pressNum('8')">8</button>
                            <button class="key-mini" onclick="pressNum('9')">9</button>
                            
                            <button class="key-mini" onclick="pressNum('4')">4</button>
                            <button class="key-mini" onclick="pressNum('5')">5</button>
                            <button class="key-mini" onclick="pressNum('6')">6</button>
                            
                            <button class="key-mini" onclick="pressNum('1')">1</button>
                            <button class="key-mini" onclick="pressNum('2')">2</button>
                            <button class="key-mini" onclick="pressNum('3')">3</button>
                            
                            <button class="key-mini" onclick="pressNum('0')">0</button>
                            <button class="key-mini btn-clear" onclick="pressClear()">⌫ 消す</button>

                        <div class="error-msg" id="error-display">存在しない番号です</div>

                <button id="send-btn" onclick="manualSendToGoogleForm()" disabled>送信</button>

        <div class="main-content" id="quiz-screen">
            <div class="game-layout">
                <div class="left-panel">
                    <!-- 問題枠（上段・横幅いっぱい） -->
                    <div class="problem-frame" id="problem-frame">
                        <div class="pf-left">
                            <span class="progress" id="progress"></span>
                            <span id="countdown-timer" style="display:none;"></span>
                        </div>
                        <div class="question-text" id="question-text"></div>
                        <div id="result-message" class="result-message"></div>
                    </div>

                    <!-- 下段：グラフ枠（左）と解答枠（右）を横並び -->
                    <div class="read-row">
                        <div class="graph-frame inactive" id="graph-frame">
                            <svg id="graph-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg"></svg>
                        </div>
                        <div class="answer-frame" id="answer-frame">
