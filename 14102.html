                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="hint-container" id="hint-container">
                        <div class="hint-title">💡 考え方のヒント</div>
                        <div class="hint-body" id="hint-text">目指せ！パーフェクト！</div>
                    </div>

                    <!-- テンキー：数字(0〜9)と「−」で座標を入力。そのほかのキーは見た目のまま無効 -->
                    <div class="keypad">
                        <button class="key num-btn" data-k="7" onclick="pressKey('7')">$7$</button>
                        <button class="key num-btn" data-k="8" onclick="pressKey('8')">$8$</button>
                        <button class="key num-btn" data-k="9" onclick="pressKey('9')">$9$</button>
                        <button class="key var-btn" disabled></button>
                        <button class="key var-btn" disabled></button>

                        <button class="key num-btn" data-k="4" onclick="pressKey('4')">$4$</button>
                        <button class="key num-btn" data-k="5" onclick="pressKey('5')">$5$</button>
                        <button class="key num-btn" data-k="6" onclick="pressKey('6')">$6$</button>
                        <button class="key op-btn" disabled>$+$</button>
                        <button class="key op-btn" data-k="neg" onclick="pressKey('neg')">$-$</button>

                        <button class="key num-btn" data-k="1" onclick="pressKey('1')">$1$</button>
                        <button class="key num-btn" data-k="2" onclick="pressKey('2')">$2$</button>
                        <button class="key num-btn" data-k="3" onclick="pressKey('3')">$3$</button>
                        <button class="key op-btn" disabled>$×$</button>
                        <button class="key frac-btn" disabled></button>

                        <button class="key num-btn" data-k="0" onclick="pressKey('0')">$0$</button>
                        <button class="key paren-btn" disabled>$($</button>
                        <button class="key paren-btn" disabled>$)$</button>
                        <button class="key var-btn" disabled></button>
                        <button class="key op-btn" disabled>$=$</button>
                    </div>
                    <div class="control-keys">
                        <button class="key action-btn" id="action-btn" onclick="handleAction()">スタート</button>
                        <button class="key clear-btn" id="clear-btn" onmousedown="event.preventDefault()" onclick="handleCenterBtn()">消す</button>
                        <button class="key clear-btn" id="clear-all-btn" onmousedown="event.preventDefault()" onclick="handleRightBtn()">全消去</button>
                    </div>
                </div>
            </div>
        </div>

        </div>

        <footer>
            © 中原先生の数学部屋
        </footer>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    /* ==========================================================================
       1. グローバル変数・連携用設定【共通・固有】
       ========================================================================== */

    /* --- 共通の変数（タイマー・進行状態・画面部品） --- */
    let startTime              = 0;
    let timerInterval          = null;
    let bestNormalTimeMs       = null;
    let kenteiAttemptCount     = 0;
    let lastClearTimeText      = "";
    let elapsedBeforeResume    = 0;

    let gameStarted            = false;
    let isCompleted            = false;
    let isCorrectState         = false;
    let quizData               = [];
    let currentQuestionIndex   = 0;
    let score                  = 0;
    let currentQuestionWrongCount = 0;

    let questionTimerId        = null;
    let currentControlState    = 'start';

    const container            = document.getElementById('app-container');
    const actionBtn            = document.getElementById('action-btn');
    const clearBtn             = document.getElementById('clear-btn');
    const clearAllBtn          = document.getElementById('clear-all-btn');
    const resultMsgEl          = document.getElementById('result-message');
    const progressEl           = document.getElementById('progress');

    const numberField = document.getElementById('number-field');
    const tooltip = document.getElementById('number-tooltip');
    const errorDisplay = document.getElementById('error-display');
    let isConfirmed = false;

    let correctStreakCount = 0;
    let maxStreakCount = 0;
    let pendingResetType = null;

    /* --- 固有の変数・設定値 --- */
    // ★注意：以下のGoogleフォーム連携先はテンプレートのままです。このアプリ用のフォームを作成したら差し替えてください。
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe6xB9-9sFuxGjVV2ns599HAN_AA0RoGVgrG9JOAJdKAjCDHw/formResponse';
    const FORM_NUM_ID         = 'entry.351767117';   // 問題番号
    const FORM_TIME_ID        = 'entry.1218861448';  // クリアタイム
    const FORM_STAGE_COUNT_ID = 'entry.2033679053';  // 正解数

    const KENTEI_TIME_LIMIT_MS = 5 * 60 * 1000;  // 検定の制限時間（5分）
    const QUESTION_TIME_LIMIT_SEC = 45;          // 1問の制限秒数
    const QUESTION_COUNT = 5;                    // 検定の問題数（generateQuizData の出題数と一致させる）
    let questionTimeLeft       = QUESTION_TIME_LIMIT_SEC;

    // 検定は「座標を読む」の1種類（記録は端末のlocalStorageに保存）
    let currentMode = 'coord';
    const KENTEI_RECORDS_KEYS = {
        coord: 'henka_taiou_zahyou_read_kentei_v1'
    };
    const KENTEI_MODE_NAMES = {
        coord: '検定：座標を読む'
    };

    /* --- 座標平面の設定（viewBox 480×480、原点は中央、1目盛り36px、表示範囲 -6〜6） --- */
    const GRAPH = { size: 480, center: 240, unit: 34, range: 6 };
    const POINT_R = 8;                           // 点の半径（グラフ上の長さ）
    const QUESTION_RANGE = 5;                    // 出題する座標の絶対値の最大
    const POINT_LABELS = ['A', 'B', 'C', 'D', 'E'];
    let answers = POINT_LABELS.map(() => ({ x: '', y: '' }));   // 入力中の値（符号つき1桁の文字列）
    let rowDone = POINT_LABELS.map(() => false);                // 正解済みの点
    let currentField  = 'x';                     // 入力中の欄：'x' または 'y'
    let judgeLocked   = false;                   // 不正解後、入力を直すまで判定ボタンを無効にする


    /* ==========================================================================
       2. 画面・表示【共通】
       ========================================================================== */

    /* --- 画面サイズに合わせた全体の拡大縮小（resizeApp） --- */
    function resizeApp() {
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
        container.style.transform = `scale(${scale})`;
    }

    /* --- 画面の切り替え（showScreen） --- */
    function showScreen(screenId) {
        document.querySelectorAll('.app-screen').forEach(el => {
            el.style.display = 'none';
        });
        const target = document.getElementById(screenId);
        if (target) target.style.display = 'flex';
    }


    /* ==========================================================================
       3. タイマー【共通】
       ========================================================================== */

    /* --- 検定タイマーの開始（startTimerClock） --- */
    function startTimerClock() {
        isCorrectState = false;
        lastClearTimeText = "";
        elapsedBeforeResume = 0;

        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('best-update-message').innerText = "";
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = "送信";
        }
        if (numberField) numberField.disabled = false;
    }

    /* --- 検定タイマーの表示更新（updateTimer） --- */
    function updateTimer() {
        const diff = (Date.now() - startTime) + elapsedBeforeResume;
        if (diff >= KENTEI_TIME_LIMIT_MS) { handleKenteiTimeUp(); return; }
        const min = Math.floor(diff / 60000);
        const sec = Math.floor((diff % 60000) / 1000);
        const msec = Math.floor((diff % 1000) / 100);
        const minStr = String(min).padStart(2, '0');
        const secStr = String(sec).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
    }

    /* --- 検定の制限時間切れ処理（handleKenteiTimeUp） --- */
    function handleKenteiTimeUp() {
        if (!gameStarted || isCompleted) return;
        clearInterval(timerInterval);
        clearInterval(questionTimerId);
        isCompleted = true;
        document.getElementById('timer-display').innerText = `⏱️ ${formatMs(KENTEI_TIME_LIMIT_MS)}`;

        // 時間切れは連続正解記録をリセット
        correctStreakCount = 0;
        saveKenteiRecords();

        if (document.activeElement) document.activeElement.blur();
        stopTimerClockAndEvaluate(true);   // 送信処理は全問終了時と共通
        resultMsgEl.textContent = `時間切れ！\n全 ${quizData.length} 問中\n${score} 問ノーミス正解`;
        resultMsgEl.className = "result-message incorrect";
        progressEl.textContent = "時間切れ！";
        document.getElementById('hint-text').innerHTML = hintData().allFinished;
        setGraphActive(false);
        updateControlKeysState('finished'); updateSendButtonState();
    }

    /* --- タイマー停止とクリア判定（stopTimerClockAndEvaluate） --- */
    function stopTimerClockAndEvaluate(isTimeUp = false) {
        clearInterval(timerInterval);
        isCorrectState = true;
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        lastClearTimeText = finalTimeStr;

        const totalElapsedTimeMs = isTimeUp ? KENTEI_TIME_LIMIT_MS : ((Date.now() - startTime) + elapsedBeforeResume);
        elapsedBeforeResume = totalElapsedTimeMs;

        kenteiAttemptCount++;
        saveKenteiRecords();

        if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
            bestNormalTimeMs = totalElapsedTimeMs;
            document.getElementById('best-normal-display').innerText = bestTimeText(finalTimeStr);
            document.getElementById('best-update-message').innerText = isTimeUp ? "" : "🎉 ベスト更新！";
            saveKenteiRecords();
        }

        const numInput = numberField ? numberField.value.trim() : "";
        const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));

        if (isValidNum && !window.isAlreadySubmitted) {
            executeFormSubmit(numInput, lastClearTimeText, score);
            window.isAlreadySubmitted = true;

            const sendBtnTop = document.getElementById('send-btn');
            const sendBtnBottom = document.getElementById('action-btn');
            if (sendBtnTop) {
                sendBtnTop.textContent = "完了";
                sendBtnTop.disabled = true;
            }
            if (sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.disabled = true;
                sendBtnBottom.className = "key clear-btn";
            }
            if (numberField) numberField.disabled = true;
        } else {
            window.isAlreadySubmitted = false;
            if (numberField) numberField.disabled = false;
        }

        updateSendButtonState();
    }

    /* --- 1問ごとのタイマー開始（startQuestionTimer） --- */
    function startQuestionTimer() {
        clearInterval(questionTimerId);
        if (!gameStarted || isCompleted) {
            document.getElementById('countdown-timer').style.display = 'none';
            return;
        }

        if (currentQuestionWrongCount >= 2) {
            document.getElementById('countdown-timer').style.display = 'block';
            document.getElementById('countdown-timer').textContent = "じっくりタイム";
            return;
        }
        questionTimeLeft = QUESTION_TIME_LIMIT_SEC;
        updateQuestionTimerUI();
        document.getElementById('countdown-timer').style.display = 'block';

        questionTimerId = setInterval(() => {
            questionTimeLeft--;
            updateQuestionTimerUI();
            if (questionTimeLeft <= 0) {
                handleQuestionTimeout();
            }
        }, 1000);
    }

    /* --- 1問ごとのタイマー表示更新（updateQuestionTimerUI） --- */
    function updateQuestionTimerUI() {
        const el = document.getElementById('countdown-timer');
        if (el) el.textContent = `残り ${questionTimeLeft}秒`;
    }

    /* --- ミリ秒の時間表示への変換（formatMs） --- */
    function formatMs(ms) {
        const totalMs = Math.max(0, Math.round(ms));
        const min = Math.floor(totalMs / 60000);
        const sec = Math.floor((totalMs % 60000) / 1000);
        const msec = Math.floor((totalMs % 1000) / 100);
        return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
    }

    /* --- ベストタイム表示文字列（問題数は QUESTION_COUNT から） --- */
    function bestTimeText(timeStr) {
        return `ベストタイム(${QUESTION_COUNT}問): ${timeStr}`;
    }


    /* ==========================================================================
       4. 生徒番号入力・記録送信【共通】
       ========================================================================== */

    /* --- 生徒番号入力欄の初期設定（initValidationControls） --- */
    function initValidationControls() {
        if (!numberField) return;

        numberField.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isConfirmed || numberField.value !== '') {
                numberField.value = '';
                isConfirmed = false;
                errorDisplay.style.display = 'none';
                updateSendButtonState();
            }
            tooltip.classList.add('show');
            numberField.focus();
        });

        tooltip.addEventListener('click', (e) => { e.stopPropagation(); });

        document.addEventListener('click', (e) => {
            if (tooltip.classList.contains('show') && !isConfirmed) {
                numberField.value = '';
                errorDisplay.style.display = 'none';
                tooltip.classList.remove('show');
                numberField.blur();
                updateSendButtonState();
            }
        });
    }

    /* --- 生徒番号の数字入力（pressNum） --- */
    function pressNum(num) {
        if (!numberField) return;
        let currentVal = numberField.value;

        if (currentVal.length === 4) {
            currentVal = '';
            errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        if (currentVal.length === 4) {
            const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
            if (isValid) completeInput(currentVal); 
            else errorDisplay.style.display = 'block';
        }
    }

    /* --- 生徒番号の確定（completeInput） --- */
    function completeInput(value) {
        isConfirmed = true;
        tooltip.classList.remove('show');
        numberField.blur();
        updateSendButtonState();
    }

    /* --- 生徒番号の1文字削除（pressClear） --- */
    function pressClear() {
        if (!numberField) return;
        let currentVal = numberField.value;
        if (currentVal.length > 0) {
            numberField.value = currentVal.slice(0, -1);
        }
        errorDisplay.style.display = 'none';
        isConfirmed = false;
        updateSendButtonState();
    }

    /* --- 送信ボタンの状態更新（updateSendButtonState） --- */
    function updateSendButtonState() {
        if (window.isAlreadySubmitted) return;

        const numVal = numberField ? numberField.value.trim() : "";
        const sendBtnTop = document.getElementById('send-btn');       
        const sendBtnBottom = document.getElementById('action-btn');   
    
        if (sendBtnTop && sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
        
        if (sendBtnTop) sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
            if (sendBtnBottom) {
                sendBtnBottom.disabled = !canSend;
                if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                else sendBtnBottom.className = "key action-btn judge-mode"; 
            }
        }
    }

    /* --- Googleフォームへの送信実行（executeFormSubmit） --- */
    function executeFormSubmit(num, timeText, stageCount) {

        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
            [FORM_NUM_ID]:         num,                               
            [FORM_TIME_ID]:        timeText,    
            [FORM_STAGE_COUNT_ID]: stageCount                  
        };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        
        setTimeout(() => { document.body.removeChild(form); }, 1000);
    }

    /* --- 送信ボタン押下時の送信処理（manualSendToGoogleForm） --- */
    function manualSendToGoogleForm() {
        const numInput = numberField ? numberField.value.trim() : "";
        if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
            return;
        }
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('action-btn'); 
        
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信中";
            sendBtnTop.disabled = true; 
        }
        if (currentControlState === 'finished' && sendBtnBottom) {
            sendBtnBottom.textContent = "送信中";
            sendBtnBottom.disabled = true;
            sendBtnBottom.className = "key clear-btn"; 
        }
        
        const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        const timeToSend = lastClearTimeText || currentTimerText;
        executeFormSubmit(numInput, timeToSend, score);
        window.isAlreadySubmitted = true;
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');
    
        setTimeout(() => { 
            if (sendBtnTop) sendBtnTop.textContent = "完了"; 
            if (currentControlState === 'finished' && sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.className = "key clear-btn"; 
            }
        }, 1000);
    }



    /* ==========================================================================
       5. 記録の保存・読み込み・記録画面【共通】
       ========================================================================== */

    /* --- 指定した検定の記録をlocalStorageから読む（readKenteiRecords） --- */
    function readKenteiRecords(mode) {
        try {
            const raw = localStorage.getItem(KENTEI_RECORDS_KEYS[mode]);
            if (raw) {
                const parsed = JSON.parse(raw);
                return {
                    bestTimeMs: (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null,
                    streak:     (typeof parsed.streak === 'number') ? parsed.streak : 0,
                    maxStreak:  (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : 0,
                    attempts:   (typeof parsed.attempts === 'number') ? parsed.attempts : 0
                };
            }
        } catch (e) { /* 読み込み失敗時は初期値 */ }
        return { bestTimeMs: null, streak: 0, maxStreak: 0, attempts: 0 };
    }

    /* --- 現在の検定の記録の読み込み（loadKenteiRecords） --- */
    function loadKenteiRecords() {
        const rec = readKenteiRecords(currentMode);
        bestNormalTimeMs = rec.bestTimeMs;
        correctStreakCount = rec.streak;
        maxStreakCount = rec.maxStreak;
        kenteiAttemptCount = rec.attempts;
    }

    /* --- 現在の検定の記録の保存（saveKenteiRecords） --- */
    function saveKenteiRecords() {
        try {
            localStorage.setItem(KENTEI_RECORDS_KEYS[currentMode], JSON.stringify({ bestTimeMs: bestNormalTimeMs, streak: correctStreakCount, maxStreak: maxStreakCount, attempts: kenteiAttemptCount }));
        } catch (e) { /* 保存失敗時は何もしない */ }
    }

    /* --- タイマー枠のベストタイム表示を現在の検定に合わせて更新（refreshBestDisplay） --- */
    function refreshBestDisplay() {
        const el = document.getElementById('best-normal-display');
        if (el) el.innerText = bestTimeText(bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-');
    }

    /* --- 記録画面の描画（renderKirokuScreen）：検定①・②・③を並べて表示 --- */
    function renderKirokuScreen() {
        ['coord'].forEach(mode => {
            const rec = readKenteiRecords(mode);
            const bestEl = document.getElementById('kiroku-best-time-' + mode);
            if (bestEl) bestEl.textContent = (rec.bestTimeMs !== null) ? formatMs(rec.bestTimeMs) : '--:--.-';
            const streakEl = document.getElementById('kiroku-streak-' + mode);
            if (streakEl) streakEl.textContent = `現在：${rec.streak}問／最高：${rec.maxStreak}問`;
            const attemptsEl = document.getElementById('kiroku-attempts-' + mode);
            if (attemptsEl) attemptsEl.textContent = `${rec.attempts}回`;
        });
    }

    /* --- リセット確認を開く（openResetConfirm） --- */
    function openResetConfirm(type) {
        pendingResetType = type;
        const msgEl = document.getElementById('reset-confirm-message');
        if (msgEl) msgEl.textContent = '検定のベストタイム・連続正解記録・受検回数がすべてリセットされます。よろしいですか？';
        const modal = document.getElementById('reset-confirm-modal');
        if (modal) modal.style.display = 'flex';
    }

    /* --- リセット確認を閉じる（closeResetConfirm） --- */
    function closeResetConfirm() {
        pendingResetType = null;
        const modal = document.getElementById('reset-confirm-modal');
        if (modal) modal.style.display = 'none';
    }

    /* --- リセットの実行（confirmReset） --- */
    function confirmReset() {
        if (pendingResetType === 'kiroku') {
            ['coord'].forEach(mode => {
                try { localStorage.removeItem(KENTEI_RECORDS_KEYS[mode]); } catch (e) { /* 失敗時は何もしない */ }
            });
            bestNormalTimeMs = null;
            correctStreakCount = 0;
            maxStreakCount = 0;
            kenteiAttemptCount = 0;
            refreshBestDisplay();
            renderKirokuScreen();
        }
        closeResetConfirm();
    }


    /* ==========================================================================
       6. 画面遷移・コントロールキー【共通】
       ========================================================================== */

    /* --- 検定画面への移行（enterKenteiScreen） --- */
    function enterKenteiScreen() {
        currentMode = 'coord';
        loadKenteiRecords();
        refreshBestDisplay();
        document.getElementById('kentei-title').textContent = `変化と対応（${KENTEI_MODE_NAMES[currentMode]}）`;
        restartQuiz();
        showScreen('screen-kentei');
    }

    /* --- 検定画面から戻る処理（goBackFromKentei） --- */
    function goBackFromKentei() {
        clearInterval(timerInterval);
        clearInterval(questionTimerId);
        showScreen('screen-start');
    }

    /* --- アクションボタン（スタート・判定・次の問題・送信）の処理（handleAction） --- */
    function handleAction() {
        if (!gameStarted) {
            startQuizGame();
            return;
        }
        if (isCompleted) {
            if (currentControlState === 'finished') manualSendToGoogleForm();
            return;
        }
        onActionKey();   // x入力中は「次へ」、y入力中は「判定」
    }

    /* --- 右ボタンの処理（handleRightBtn）：戻る／全消去 --- */
    function handleRightBtn() {
        if (currentControlState === 'start' || currentControlState === 'finished') {
            goBackFromKentei();
        } else {
            clearCurrentRow();
        }
    }

    /* --- 中央ボタンの処理（handleCenterBtn）：もう一回／消す --- */
    function handleCenterBtn() {
        if (currentControlState === 'finished') {
            restartQuiz();
        } else {
            pressKey('bs');
        }
    }

    /* --- コントロールキーの表示状態の更新（updateControlKeysState） --- */
    function updateControlKeysState(state) {
        currentControlState = state;
        actionBtn.className = "key action-btn";
        clearBtn.className = "key clear-btn";
        clearAllBtn.className = "key clear-btn";

        if (state === 'start') {
            actionBtn.textContent = "スタート"; actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.disabled = true;
            clearAllBtn.textContent = "戻る";
            clearAllBtn.className = "key action-btn-back";
            clearAllBtn.disabled = false;
        } else if (state === 'playing') {
            const a = answers[currentQuestionIndex] || { x: '', y: '' };
            const valid = /^-?\d$/.test(a[currentField]);
            actionBtn.textContent = (currentField === 'y') ? "判定" : "次へ";
            actionBtn.className = "key action-btn judge-mode";
            clearBtn.textContent = "消す"; clearBtn.className = "key clear-btn";
            clearAllBtn.textContent = "全消去"; clearAllBtn.className = "key clear-btn";
            actionBtn.disabled = (!valid || (currentField === 'y' && judgeLocked));   // 数を入れるまで／不正解後は直すまで進めない
            clearBtn.disabled = (a[currentField] === '');
            clearAllBtn.disabled = (a.x === '' && a.y === '');
        } else if (state === 'cleared') {
            actionBtn.textContent = "次の問題"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.disabled = true;
            clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = true;
        } else if (state === 'finished') {
            actionBtn.textContent = "送信"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
            clearBtn.textContent = "もう一回"; clearBtn.className = "key action-btn"; clearBtn.disabled = false;
            clearAllBtn.textContent = "戻る"; clearAllBtn.className = "key action-btn-back"; clearAllBtn.disabled = false;
        }
    }

    /* --- 利き手（左右レイアウト）の切り替え（changeHandedness） --- */
    function changeHandedness(hand) {
        const workspace = document.querySelector('.game-layout');
        const rightBtn = document.getElementById('hand-right-btn');
        const leftBtn = document.getElementById('hand-left-btn');
        if (hand === 'left') {
            workspace.classList.add('left-handed');
            leftBtn.classList.add('active');
            rightBtn.classList.remove('active');
        } else {
            workspace.classList.remove('left-handed');
            rightBtn.classList.add('active');
            leftBtn.classList.remove('active');
        }
    }

    /* --- 不正解・時間切れ時の処理（showStepError）：ミス回数の加算・連続正解のリセット・グラフ枠の揺れ --- */
    function showStepError(frameEl) {
        currentQuestionWrongCount++;
        if (correctStreakCount !== 0) {
            correctStreakCount = 0;
            saveKenteiRecords();
        }
        startQuestionTimer();
        if (frameEl) {
            frameEl.classList.remove('error-shake');
            void frameEl.offsetWidth;
            frameEl.classList.add('error-shake');
        }
    }


    /* ==========================================================================
       7. 座標平面（描画）・解答枠【固有】
       ========================================================================== */

    /* --- 数値の表示（負の数は「−」） --- */
    function fmtNum(n) {
        return (n < 0) ? `−${-n}` : String(n);
    }

    /* --- 座標→SVG上の位置への変換 --- */
    function toPx(x) { return GRAPH.center + x * GRAPH.unit; }
    function toPy(y) { return GRAPH.center - y * GRAPH.unit; }

    /* --- 座標平面の描画（buildGraph）：格子・軸・目盛り。点A〜Eは「スタート」後に layer-points へ描く --- */
    function buildGraph() {
        const svg = document.getElementById('graph-svg');
        const c = GRAPH.center, u = GRAPH.unit, r = GRAPH.range;
        const lo = c - r * u, hi = c + r * u;
        let s = '';

        // 格子線
        for (let i = -r; i <= r; i++) {
            if (i === 0) continue;
            const p = c + i * u;
            s += `<line x1="${p}" y1="${lo}" x2="${p}" y2="${hi}" stroke="#cfd8dc" stroke-width="1"/>`;
            s += `<line x1="${lo}" y1="${p}" x2="${hi}" y2="${p}" stroke="#cfd8dc" stroke-width="1"/>`;
        }
        // x軸・y軸（矢印つき）
        s += `<line x1="${lo - 14}" y1="${c}" x2="${hi + 14}" y2="${c}" stroke="#333" stroke-width="2"/>`;
        s += `<line x1="${c}" y1="${hi + 14}" x2="${c}" y2="${lo - 14}" stroke="#333" stroke-width="2"/>`;
        s += `<polygon points="${hi + 26},${c} ${hi + 12},${c - 6} ${hi + 12},${c + 6}" fill="#333"/>`;
        s += `<polygon points="${c},${lo - 26} ${c - 6},${lo - 12} ${c + 6},${lo - 12}" fill="#333"/>`;
        // 軸ラベル・原点
        s += `<text class="svg-axis-label" x="${hi + 22}" y="${c + 22}">x</text>`;
        s += `<text class="svg-axis-label" x="${c + 12}" y="${lo - 18}">y</text>`;
        s += `<text class="svg-axis-label" x="${c - 8}" y="${c + 17}" text-anchor="end" style="font-style:normal;">O</text>`;
        // 目盛りの数字
        for (let i = -r; i <= r; i++) {
            if (i === 0) continue;
            s += `<text class="svg-tick-label" x="${c + i * u}" y="${c + 20}" text-anchor="middle">${fmtNum(i)}</text>`;
            s += `<text class="svg-tick-label" x="${c - 7}" y="${c - i * u + 6}" text-anchor="end">${fmtNum(i)}</text>`;
        }
        // 点A〜Eの表示用レイヤー
        s += `<g id="layer-points"></g>`;
        svg.innerHTML = s;
    }

    /* --- 点A〜Eをグラフに描く（drawPoints）：スタートした時に表示する --- */
    function drawPoints() {
        const layer = document.getElementById('layer-points');
        if (!layer) return;
        let s = '';
        quizData.forEach((q, i) => {
            const px = toPx(q.x), py = toPy(q.y);
            s += `<circle id="pt-dot-${i}" cx="${px}" cy="${py}" r="${POINT_R}" fill="#1e88e5" stroke="#ffffff" stroke-width="2"/>`;
            s += `<text id="pt-lab-${i}" class="svg-pt-label" x="${px + POINT_R + 2}" y="${py - POINT_R - 2}">${q.label}</text>`;
        });
        layer.innerHTML = s;
    }

    /* --- 正解した点を緑にする（markPointDone） --- */
    function markPointDone(i) {
        const dot = document.getElementById('pt-dot-' + i);
        const lab = document.getElementById('pt-lab-' + i);
        if (dot) dot.setAttribute('fill', '#2e7d32');
        if (lab) lab.classList.add('done');
    }

    /* --- 解答枠の行（A〜E）を作る（buildAnswerRows） --- */
    function buildAnswerRows() {
        let h = '';
        POINT_LABELS.forEach((L, i) => {
            h += `<div class="answer-row pending" id="row-${i}">` +
                 `<span class="a-label">${L}</span><span class="a-par">(</span>` +
                 `<button type="button" class="cbox ph" id="cb-${i}-x" onclick="selectField(${i}, 'x')">x</button>` +
                 `<span class="a-par">,</span>` +
                 `<button type="button" class="cbox ph" id="cb-${i}-y" onclick="selectField(${i}, 'y')">y</button>` +
                 `<span class="a-par">)</span></div>`;
        });
        document.getElementById('answer-rows').innerHTML = h;
    }

    /* --- 解答枠の表示更新（renderAnswerRows）：正解済み＝緑／入力中の欄＝赤枠／まだの点＝薄く --- */
    function renderAnswerRows() {
        const playing = gameStarted && !isCompleted;
        POINT_LABELS.forEach((L, i) => {
            const row = document.getElementById('row-' + i);
            if (!row) return;
            const isCur = playing && (i === currentQuestionIndex);
            row.classList.toggle('done', rowDone[i]);
            row.classList.toggle('pending', !rowDone[i] && !isCur);
            if (!isCur) row.classList.remove('wrong');
            ['x', 'y'].forEach(f => {
                const b = document.getElementById(`cb-${i}-${f}`);
                const v = answers[i][f];
                b.textContent = (v === '') ? f : v.replace('-', '−');
                b.classList.toggle('ph', v === '');
                b.classList.toggle('sel', isCur && currentField === f);
                b.disabled = !isCur;
            });
        });
    }

    /* --- 入力する欄の切り替え（selectField）：いま答えている点のx・yだけタップで切り替えられる --- */
    function selectField(i, f) {
        if (!gameStarted || isCompleted || i !== currentQuestionIndex) return;
        currentField = f;
        renderAnswerRows();
        updateControlKeysState('playing');
    }

    /* --- テンキー・「消す」の入力処理（pressKey）：数字は1桁（符号つき）、「−」で符号の切り替え、'bs'で1文字消す --- */
    function pressKey(k) {
        if (!gameStarted || isCompleted) return;
        const a = answers[currentQuestionIndex];
        let v = a[currentField];
        if (k === 'bs') v = v.slice(0, -1);
        else if (k === 'neg') v = v.startsWith('-') ? v.slice(1) : '-' + v;
        else v = (v.startsWith('-') ? '-' : '') + k;
        a[currentField] = v;
        afterEdit();
    }

    /* --- 「全消去」：いま答えている点のx・yを両方消して、xから入力し直す --- */
    function clearCurrentRow() {
        if (!gameStarted || isCompleted) return;
        const a = answers[currentQuestionIndex];
        a.x = ''; a.y = '';
        currentField = 'x';
        afterEdit();
    }

    /* --- 入力を直したあとの共通処理：不正解のロックを解除して表示を更新 --- */
    function afterEdit() {
        judgeLocked = false;
        const row = document.getElementById('row-' + currentQuestionIndex);
        if (row) row.classList.remove('wrong');
        renderAnswerRows();
        updateControlKeysState('playing');
    }

    /* --- テンキーの使用可否（setKeypadEnabled）：数字0〜9と「−」だけが対象 --- */
    function setKeypadEnabled(on) {
        document.querySelectorAll('.keypad button[data-k]').forEach(b => { b.disabled = !on; });
    }

    /* --- グラフ枠の表示切り替え（setGraphActive）：スタート前・時間切れは薄く表示 --- */
    function setGraphActive(active) {
        document.getElementById('graph-frame').classList.toggle('inactive', !active);
        if (!active) {
            setKeypadEnabled(false);
            renderAnswerRows();
        }
    }

    /* --- グラフと解答枠の初期化（resetGraphState） --- */
    function resetGraphState() {
        answers = POINT_LABELS.map(() => ({ x: '', y: '' }));
        rowDone = POINT_LABELS.map(() => false);
        currentField = 'x';
        judgeLocked = false;
        const layer = document.getElementById('layer-points');
        if (layer) layer.innerHTML = '';
        document.querySelectorAll('.answer-row').forEach(r => r.classList.remove('wrong'));
        renderAnswerRows();
    }


    /* ==========================================================================
       8. 出題・ゲーム進行【固有】
       ========================================================================== */

    /* --- 整数の乱数（getRandomInt） --- */
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /* --- 配列のシャッフル（shuffleArray） --- */
    function shuffleArray(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
    }

    /* --- 出題データの生成（generateQuizData）：第1〜第4象限から1点ずつ＋軸上の点1点、A〜Eへの割り当てはランダム --- */
    function generateQuizData() {
        const quadrants = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
        const list = quadrants.map(([sx, sy]) => ({
            x: sx * getRandomInt(1, QUESTION_RANGE),
            y: sy * getRandomInt(1, QUESTION_RANGE)
        }));
        // 軸上の点を1点：(0, a) または (a, 0)（a は 0 以外）
        const a = (Math.random() < 0.5 ? 1 : -1) * getRandomInt(1, QUESTION_RANGE);
        list.push(Math.random() < 0.5 ? { x: 0, y: a } : { x: a, y: 0 });
        return shuffleArray(list).map((p, i) => ({ label: POINT_LABELS[i], x: p.x, y: p.y }));
    }

    /* --- スタート前の表示（showStartLayout） --- */
    function showStartLayout() {
        window.isAlreadySubmitted = false;
        const sendBtnTop = document.getElementById('send-btn');
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信";
            sendBtnTop.disabled = true;
        }
        if (numberField) numberField.disabled = false;

        gameStarted = false;
        isCompleted = false;
        currentQuestionIndex = 0;
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        progressEl.textContent = "スタート前";
        document.getElementById('question-text').innerHTML = "生徒番号を入力 →【スタート】";
        document.getElementById('hint-text').innerHTML = hintData().start;
        resetGraphState();
        setGraphActive(false);
        updateControlKeysState('start');
        resultMsgEl.textContent = "";
        resultMsgEl.className = "result-message";
    }

    /* --- ゲームの開始（startQuizGame）：点A〜Eを表示してAから答える --- */
    function startQuizGame() {
        window.isAlreadySubmitted = false;
        gameStarted = true;
        score = 0;
        currentQuestionIndex = 0;
        startTimerClock();

        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');

        drawPoints();
        loadQuestion();
    }

    /* --- 点の読み込みと表示（loadQuestion）：currentQuestionIndex番目の点（A〜E）の入力を始める --- */
    function loadQuestion() {
        isCompleted = false;
        currentQuestionWrongCount = 0;
        currentField = 'x';
        judgeLocked = false;
        resultMsgEl.textContent = "";
        resultMsgEl.className = "result-message";

        setGraphActive(true);
        setKeypadEnabled(true);
        renderAnswerRows();
        updateControlKeysState('playing');

        progressEl.textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${QUESTION_COUNT} 問`;
        document.getElementById('question-text').innerHTML = "次の図の座標を答えなさい。";
        document.getElementById('hint-text').innerHTML = hintData().init;

        startQuestionTimer();
    }

    /* --- もう一回（再スタート）（restartQuiz） --- */
    function restartQuiz() {
        quizData = generateQuizData();
        showStartLayout();
    }

    /* --- 1問ごとの時間切れ処理（handleQuestionTimeout） --- */
    function handleQuestionTimeout() {
        clearInterval(questionTimerId);
        const q = quizData[currentQuestionIndex];
        if (!q || isCompleted) return;
        document.getElementById('hint-text').innerHTML = hintData().timeout;
        showStepError(document.getElementById('row-' + currentQuestionIndex));   // ミス回数を加算し、タイマーを再開する
    }


    /* ==========================================================================
       9. 判定・ヒント【固有】
       ========================================================================== */

    /* --- 不正解時のヒント文の作成（buildWrongHint）：どちらの座標が違うか／入れかわり／符号 --- */
    function buildWrongHint(q, sel) {
        const xOk = (sel.x === q.x);
        const yOk = (sel.y === q.y);

        // x座標とy座標の入れかわり
        if (sel.x === q.y && sel.y === q.x && q.x !== q.y) {
            return HINT_DATA.swapped;
        }
        if (xOk && !yOk) {
            return (Math.abs(sel.y) === Math.abs(q.y))
                ? HINT_DATA.yoksign
                : HINT_DATA.yError;
        }
        if (!xOk && yOk) {
            return (Math.abs(sel.x) === Math.abs(q.x))
                ? HINT_DATA.xsign
                : HINT_DATA.xError;
        }
        // 両方違う
        if (Math.abs(sel.x) === Math.abs(q.x) && Math.abs(sel.y) === Math.abs(q.y)) {
            return HINT_DATA.bothSign;
        }
        return HINT_DATA.bothError;
    }

    /* --- 「次へ」「判定」ボタンの処理（onActionKey）：x入力中は y へ進み、y入力中は判定する --- */
    function onActionKey() {
        const a = answers[currentQuestionIndex];
        if (currentField === 'x') {
            if (!/^-?\d$/.test(a.x)) return;
            currentField = 'y';
            renderAnswerRows();
            updateControlKeysState('playing');
        } else {
            checkAnswer();
        }
    }

    /* --- 判定（checkAnswer）：1点ずつ判定。最初の判定で正解した点だけ1点 --- */
    function checkAnswer() {
        const i = currentQuestionIndex;
        const q = quizData[i];
        const a = answers[i];
        if (!q || judgeLocked || !/^-?\d$/.test(a.x) || !/^-?\d$/.test(a.y)) return;

        const sel = { x: parseInt(a.x, 10), y: parseInt(a.y, 10) };
        const row = document.getElementById('row-' + i);

        if (sel.x === q.x && sel.y === q.y) {
            // ---- 正解 ----
            clearInterval(questionTimerId);
            document.getElementById('countdown-timer').style.display = 'none';
            rowDone[i] = true;
            markPointDone(i);

            if (currentQuestionWrongCount === 0) {
                score++;
                correctStreakCount++;
                if (correctStreakCount > maxStreakCount) maxStreakCount = correctStreakCount;
                saveKenteiRecords();
            }
            if (document.activeElement) document.activeElement.blur();

            if (i === QUESTION_COUNT - 1) {
                isCompleted = true;
                stopTimerClockAndEvaluate();
                resultMsgEl.textContent = `全 ${QUESTION_COUNT} 問中 ${score} 問ノーミス正解！`;
                resultMsgEl.className = "result-message correct";
                progressEl.textContent = (score === QUESTION_COUNT) ? "全問ノーミスパーフェクト！" : "全問終了！";
                document.getElementById('hint-text').innerHTML = hintData().allFinished;
                setKeypadEnabled(false);
                renderAnswerRows();
                updateControlKeysState('finished'); updateSendButtonState();
            } else {
                currentQuestionIndex++;
                loadQuestion();                                   // 次の点へ自動で進む
                resultMsgEl.textContent = "正解！";
                resultMsgEl.className = "result-message correct";
                document.getElementById('hint-text').innerHTML = hintData().nextQuestion;
            }
        } else {
            // ---- 不正解：赤い枠とヒントを表示し、入力を直すまで判定できない ----
            document.getElementById('hint-text').innerHTML = buildWrongHint(q, sel);
            row.classList.remove('wrong');
            void row.offsetWidth;
            row.classList.add('wrong');
            showStepError(null);
            judgeLocked = true;
            updateControlKeysState('playing');
        }
    }


    /* ==========================================================================
       10. ヒント文のデータ【固有】
       ========================================================================== */
    /* --- ヒント文（$x$ $y$ はMathJaxで数式として表示される） --- */
    const HINT_DATA = {
        start: "目指せ！パーフェクト！",
        init: "座標は（$x$座標, $y$座標）の順だよ。<br>原点から、$x$座標は右（＋）・左（−）、$y$座標は上（＋）・下（−）へ進もう。",
        timeout: "時間切れ！<br>原点から、$x$座標の分だけ左右に、$y$座標の分だけ上下に進んだ場所だよ。",
        xError: "$x$座標がちがうよ。<br>原点から左右に、何目盛り進むかな？",
        yError: "$y$座標がちがうよ。<br>原点から上下に、何目盛り進むかな？",
        xsign: "$x$座標の符号を確かめよう。<br>$x$座標が＋なら右、−なら左だよ。",
        yoksign: "$y$座標の符号を確かめよう。<br>$y$座標が＋なら上、−なら下だよ。",
        bothError: "$x$座標も$y$座標もちがうよ。<br>原点から、まず左右（$x$）へ、次に上下（$y$）へ進もう。",
        bothSign: "$x$座標と$y$座標の符号を確かめよう。<br>$x$座標は＋なら右・−なら左、$y$座標は＋なら上・−なら下だよ。",
        swapped: "$x$座標と$y$座標が入れかわっていないかな？<br>（$x$座標, $y$座標）の順に読もう。",
        nextQuestion: "正解！<br>次の点の座標も読み取ろう。",
        allFinished: "全問終了！<br>『送信』ボタンを押そう。"
    };

    /* --- ヒント文の取得（hintData）：検定は1種類のみ --- */
    function hintData() {
        return HINT_DATA;
    }

    /* --- MathJax対応（setupHintMathJax）：ヒント枠・問題枠の座標が書き換わるたびに $...$ を数式として描画する --- */
    function setupHintMathJax() {
        ['hint-text'].forEach(id => {
            const el = document.getElementById(id);
            let typesetting = false;
            const render = () => {
                if (typesetting || !window.MathJax || !MathJax.typesetPromise) return;
                typesetting = true;
                MathJax.typesetPromise([el])
                    .catch(() => {})
                    .then(() => { typesetting = false; observer.takeRecords(); });   // 描画による書き換えは再処理しない
            };
            const observer = new MutationObserver(render);
            observer.observe(el, { childList: true, subtree: true });
        });
    }

    /* ==========================================================================
       11. イベントリスナー・初期化【共通】
       ========================================================================== */

    /* --- 画面リサイズ時の拡大縮小（resize） --- */
    window.addEventListener('resize', resizeApp);

    /* --- 読み込み完了時の初期化（DOMContentLoaded） --- */
    window.addEventListener('DOMContentLoaded', () => {
        resizeApp();
        initValidationControls();
        buildGraph();
        buildAnswerRows();
        setupHintMathJax();
        quizData = generateQuizData();
        loadKenteiRecords();
        const bestDisplayEl = document.getElementById('best-normal-display');
        if (bestDisplayEl) bestDisplayEl.innerText = bestTimeText(bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-');
        showStartLayout();
        showScreen('screen-start');
    });

</script>
</body>
