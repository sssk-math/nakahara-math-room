<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字式の加減（Step7：文字式の差）</title>
    <script>
    /* ==========================================================================
       1. MathJaxの基本設定
       ========================================================================== */
    window.MathJax = {
        tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
        },
        options: {
        enableMenu: false
        }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
    /* ==========================================================================
       2. 画面全体の基本デザイン
       ========================================================================== */
    /* --- 全称要素の基本設定 --- */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    /* --- ボディの基本スタイル --- */
    body {
        background-color: #ffffff;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        min-height: 100vh;
        overflow: hidden;
    }

    /* --- アプリコンテナのレイアウト設定 --- */
    #app-container {
        width: 960px;
        height: 640px;
        aspect-ratio: 3 / 2;
        flex-shrink: 0;
        background-color: #ffffff;
        border: 2px solid #333333;
        border-radius: 12px;
        position: relative;
        transform-origin: top center;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 10px 20px 28px;
    }

    /* ==========================================================================
       3. ヘッダー・タイトル・利き手切り替えボタン
       ========================================================================== */
    /* --- ヘッダー領域のレイアウト設定 --- */
    header { 
        text-align: center; 
    }

    /* --- タイトル見出しのスタイル --- */
    h1 { 
        font-size: 24px; 
        color: #333; 
        margin-bottom: 5px; 
    }

    /* --- タイトルバーのグリッドレイアウト --- */
    .title-bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 15px;
        margin-bottom: 0px;
    }

    /* --- 利き手設定ボタンの共通スタイル --- */
    .title-hand-btn {
        padding: 6px 14px;
        font-size: 0.85rem;
        font-weight: bold;
        background-color: #e0e0e0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
    }

    /* --- 利き手設定ボタンの活性状態スタイル --- */
    .title-hand-btn.active { 
        background-color: #1a73e8;
        color: white;
    }

    /* --- 左利きレイアウト（反転配置）のスタイル --- */
    .game-layout.left-handed {
        flex-direction: row-reverse;
    }

    /* ==========================================================================
       4. タイマー・自己ベスト・成績送信エリア
       ========================================================================== */
    /* --- タイマーコンテナのレイアウト設定 --- */
    .timer-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f1f3f4;
        padding: 8px 16px;
        border-radius: 6px;
        margin-top: 8px;
        margin-bottom: 0px;
        font-weight: bold;
        box-sizing: border-box;
        height: 52px;
    }

    /* --- タイマー表示のスタイル --- */
    #timer-display {
        font-size: 20px;
        color: #1a73e8;
        font-variant-numeric: tabular-nums;
        min-width: 110px;
    }
    
    /* --- 記録表示ボックスのスタイル --- */
    .record-box {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        border-left: 2px solid #ccc;
        padding-left: 12px;
        height: 100%;
    }

    /* --- ベスト記録更新メッセージのスタイル --- */
    #best-update-message {
        font-size: 12px;
        font-weight: bold;
        color: #1a73e8;
        white-space: nowrap;
        height: 1.2em;
        margin-bottom: 1px;
    }

    /* --- ベスト記録ラベルのコンテナスタイル --- */
    .best-label-container {
        display: flex;
        gap: 15px;
        font-size: 12px;
        color: #5f6368;
        white-space: nowrap;
    }

    /* --- 生徒番号入力エリアのスタイル --- */
    .number-field-wrapper {
        position: relative;
        display: inline-block;
    }

    /* --- ログイン入力フィールドの共通スタイル --- */
    .login-input {
        font-size: 15px;
        padding: 4px 8px;
        border: 2px solid #ccc;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
        font-weight: normal;
        width: 80px;
    }

    /* --- 入力フィールドのフォーカス時スタイル --- */
    .login-input:focus { 
        border-color: #1a73e8; 
    }

    /* --- 専用テンキー付き吹き出しのスタイル --- */
    .input-tooltip {
        display: none;
        position: absolute;
        top: 120%;
        left: 50%;
        transform: translateX(-50%);
        background-color: #ffffff;
        border: 2px solid #333333;
        color: #333333;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        z-index: 100;
        width: 210px;
    }

    /* --- input-tooltipのツールチップ表示用スタイル --- */
    .input-tooltip::before {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border-width: 8px;
        border-style: solid;
        border-color: transparent transparent #333333 transparent;
    }

    /* --- ツールチップを表示状態にするスタイル --- */
    .input-tooltip.show {
        display: block;
    }

    /* --- ヒント表示用のツールチップスタイル --- */
    .tooltip-hint {
        font-size: 11px;
        font-weight: bold;
        color: #5f6368;
        margin-bottom: 8px;
        text-align: center;
        line-height: 1.4;
        white-space: nowrap;
    }

    /* --- ミニテンキーのグリッド配置 --- */
    .keypad-mini {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        gap: 6px;
        justify-content: center;
    }

    /* --- 小さなボタンやキーのスタイル --- */
    .key-mini {
        height: 40px;
        font-size: 18px;
        font-weight: bold;
        background-color: #f1f3f5;
        border: 1px solid #ced4da;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
    }

    /* --- 小さなボタンが押下された時のスタイル --- */
    .key-mini:active {
        background-color: #dee2e6;
    }

    /* --- クリアボタン(小)のスタイル --- */
    .key-mini.btn-clear {
        grid-column: span 2;
        background-color: #ffebee;
        border-color: #ffcdd2;
        color: #c62828;
        font-size: 14px;
    }

    /* --- クリアボタン(小)が押下された時のスタイル --- */
    .key-mini.btn-clear:active {
        background-color: #ffcdd2;
    }

    /* --- エラーメッセージ表示用のスタイル --- */
    .error-msg {
        color: #d32f2f;
        font-size: 12px;
        margin-top: 8px;
        font-weight: bold;
        display: none;
        text-align: center;
        white-space: nowrap;
    }

    /* --- 送信ボタンのスタイル --- */
    #send-btn {
        padding: 6px 12px;
        font-size: 15px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        height: 34px;
        min-width: 76px;
        text-align: center;
        font-weight: bold;
    }

    /* --- 送信ボタンが無効化された時のスタイル --- */
    #send-btn:disabled {
        background-color: #ccc;
        color: #888;
        cursor: not-allowed;
    }

    /* ==========================================================================
       5. メインゲーム画面・左右パネル
       ========================================================================== */
    /* --- ゲームメインレイアウトの構造設定 --- */
    .game-layout {
        display: flex;
        flex-grow: 1;
        width: 100%;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-top: 8px;
    }

    /* --- 左パネル（問題表示エリア）のレイアウト --- */
    .left-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        height: 100%;
    }

    /* --- 右パネル（操作・キーパッドエリア）のレイアウト --- */
    .right-panel {
        width: 285px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* ==========================================================================
       6. 問題文・出題数式表示エリア
       ========================================================================== */
    /* ---問題表示のレイアウト --- */
    .question-wrapper {
        display: flex;
        justify-content: space-between;
        width: 100%;
    }

    /* --- 問題文のテキスト表示スタイル --- */
    .question-text { 
        font-size: 18px; 
        color: #333; 
        font-weight: bold; 
    }

    /* --- 進捗表示のスタイル --- */
    .progress { 
        font-size: 16px; 
        color: #666; 
        font-weight: bold;
    }
    
    /* --- 数式表示エリアのスタイル設定 --- */
    .formula-display {
        font-size: 28px;
        line-height: 1.4;
        text-align: center;
        color: #000;
        margin-bottom: 12px;
        background-color: #f8f9fa;
        padding: 10px 15px;
        border-radius: 8px;
        border: 2px solid #ccc;
        height: 95px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 数式表示コンテナのレイアウト設定 --- */
    .formula-display mjx-container { 
        display: inline !important; 
        white-space: normal; 
    }

    /* ==========================================================================
       7. 入力枠のスタイル
       ========================================================================== */
    /* --- 入力ブロックコンテナのレイアウト設定 --- */
    .input-block-container { 
        display: flex; 
        flex-direction: column; 
        gap: 3px; 
        width: 100%; 
        margin-bottom: 10px; 
    }

    /* --- 入力グループの基本レイアウト設定 --- */
    .input-box-group {
        background: #ffffff;
        border: 2px solid #ced4da;
        border-radius: 8px;
        padding: 8px 14px;
        height: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        cursor: pointer;
    }

    /* --- 入力グループのフォーカス状態スタイル --- */
    .input-box-group.active-focus { 
        border-color: #007bff; 
        background-color: #f0f7ff; 
        box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
    }

    /* --- 入力グループの正解確定時スタイル --- */
    .input-box-group.locked-correct { 
        border-color: #81c784; 
        background-color: #e8f5e9; 
        cursor: default; 
    }

    /* --- 入力グループの無効化状態スタイル --- */
    .input-box-group.locked-disabled { 
        border-color: #e9ecef; 
        background-color: #f8f9fa; 
        opacity: 0.6; 
        cursor: not-allowed; 
    }

    /* --- 入力グループの入力エラー時スタイル --- */
    .input-box-group.error-shake { 
        border-color: #e57373; 
        background-color: #ffebee; 
    }

    /* --- 入力ラベルのスタイル --- */
    .input-label { 
        font-size: 13px; 
        color: #495057; 
        font-weight: bold; 
        margin-bottom: 2px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }

    /* --- ステップバッジのスタイル --- */
    .step-badge { 
        font-size: 11px; 
        padding: 1px 6px; 
        border-radius: 4px; 
        background-color: #dee2e6; 
        color: #495057; 
    }

    /* --- 正解確定時のステップバッジスタイル --- */
    .locked-correct .step-badge { 
        background-color: #28a745; 
        color: white; 
    }

    /* --- 数式レンダリング領域のスタイル --- */
    .mathjax-render-zone { 
        min-height: 38px;
        font-size: 24px; 
        padding-left: 30px; 
        color: #212529; 
        display: flex; 
        align-items: center; 
        justify-content: flex-start; 
        overflow: hidden; 
    }

    /* --- 途中式と答えの入力枠を、ユーザーのタップ・クリック操作から完全に遮断 --- */
    #math-editor-expression,
    #math-editor-answer {
        pointer-events: none;
    }

    /* --- プレースホルダーのスタイル --- */
    .placeholder-text {
        font-size: 16px;
        color: #adb5bd;
    }

    /* --- プレースホルダー（入力ヒント）専用のスタイル --- */
    .editor-text-node::placeholder {
        font-size: 16px;
        color: #adb5bd; 
    }

    /* ==========================================================================
       10. ヒント枠のスタイル（右パネル下部）
       ========================================================================== */
    /* --- ヒントコンテナのレイアウト設定 --- */
    .hint-container { 
        width: 100%; 
        height: 205px; 
        background-color: #fff9db; 
        border: 1px dashed #f59f00; 
        border-radius: 8px; 
        padding: 10px 12px; 
        box-sizing: border-box; 
        display: flex; 
        flex-direction: column; 
        overflow-y: auto; 
        margin-bottom: 8px; 
    }

    /* --- ヒントタイトルのスタイル --- */
    .hint-title { 
        font-size: 13px; 
        font-weight: bold; 
        color: #f59f00; 
        margin-bottom: 4px; 
        text-align: left; 
    }

    /* --- ヒント本文のスタイル --- */
    .hint-body { 
        font-size: 16px; 
        font-weight: bold;
        color: #495057; 
        line-height: 1.4; 
        text-align: left; 
    }

    /* ==========================================================================
       8. ソフトキーパッドおよび各種ボタン
       ========================================================================== */
    /* --- キーパッドのグリッドレイアウト設定 --- */
    .keypad { 
        display: grid; 
        grid-template-columns: repeat(5, 56px); 
        gap: 1px; 
        margin-bottom: 8px; 
    }

    /* --- 各キーの共通スタイル --- */
    .key {
        height: 46px;
        font-size: 24px;
        font-weight: bold;
        background-color: #f1f3f5;
        border: 1px solid #ced4da;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s;
    }

    /* --- キー押下時のインタラクションスタイル --- */
    .key:active:not(:disabled) { 
        background-color: #dee2e6; 
        transform: scale(0.95); 
    }
    
    /* --- 演算子キーのスタイル --- */
    .key.op-btn { 
        background-color: #e7f5ff; 
        border-color: #a5d8ff; 
        color: #007bff; 
        font-size: 20px; 
    }

    /* --- 変数キーのスタイル --- */
    .key.var-btn { 
        background-color: #f3f0ff; 
        border-color: #d0bfff; 
        color: #6f42c1; 
        font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
        font-style: italic; 
        font-weight: normal; 
        font-size: 26px; 
    }

    /* --- 単位キーのスタイル --- */
    .key.unit-btn { 
        background-color: #fff0f6; 
        border-color: #ffdeeb; 
        color: #d6336c; 
        font-size: 18px; 
        font-weight: bold; 
    }

    /* --- 分数キーのスタイル --- */
    .key.frac-btn { 
        background-color: #fff9db; 
        border-color: #fff3bf; 
        color: #f59f00; 
        font-size: 18px; 
    }

    /* --- 括弧キーのスタイル --- */
    .key.paren-btn { 
        background-color: #ebfbee; 
        border-color: #b2f2bb; 
        color: #2b8a3e; 
        font-size: 20px; 
    }

    /* --- 方向キーのスタイル --- */
    .key.arrow-btn { 
        background-color: #fff3e0; 
        border-color: #ffe0b2; 
        color: #e65100; 
        font-weight: bold; 
    }

    /* --- 無効化されたキーのスタイル --- */
    .keypad button:disabled { 
        background-color: #d1d5db !important; 
        color: #9ca3af !important; 
        border-color: #cbd5e1 !important; 
        cursor: not-allowed; 
        opacity: 0.6; 
        box-shadow: none !important; 
        transform: none !important; 
    }

    /* --- 制御キー（アクション・クリア）のレイアウト設定 --- */
    .control-keys { 
        display: grid; 
        grid-template-columns: repeat(3, 92px); 
        gap: 4px; 
        width: 100%; 
        justify-content: center; 
    }

    /* --- アクションボタンのスタイル --- */
    .key.action-btn { 
        background-color: #28a745; 
        color: #fff; 
        font-size: 18px; 
        height: 46px; 
        border-color: #1e7e34; 
        width: 100%; 
    }

    /* --- 判定モード時のアクションボタンスタイル --- */
    .key.action-btn.judge-mode { 
        background-color: #007bff; 
        border-color: #0069d9; 
    }

    /* --- クリアボタンのスタイル --- */
    .key.clear-btn { 
        background-color: #e9ecef; 
        font-size: 16px; 
        height: 46px; 
        width: 100%; 
        color: #333; 
    }

    /* --- 数式エディタのコンテナスタイル --- */
    .math-editor-container {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        z-index: -1;
        width: 0;
        height: 0;
        overflow: hidden;
    }

    /* --- ワイド分数モード時のコンテナスタイル --- */
    .math-editor-container.wide-fraction-mode {
        height: 86px;
        padding: 4px 14px;
        flex-wrap: wrap;
        overflow: visible;
        border: none !important; 
        background-color: transparent !important; 
    }

    /* --- エディタのテキストノードスタイル --- */
    .editor-text-node {
        border: none;
        outline: none;
        font-size: 26px; 
        text-align: left;
        min-width: 20px;
        height: 38px;
        background: transparent;
        color: #000000;
        pointer-events: none; 
    }

    /* --- エディタの分数ノードスタイル --- */
    .editor-fraction-node {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
        min-width: 50px;
        margin: 0 4px;
    }

    /* --- エディタの分数線スタイル --- */
    .editor-fraction-line {
        width: 100%;
        height: 2px;
        background-color: #333;
        margin: 3px 0;
    }

    /* --- エディタの分数フィールドスタイル --- */
    .editor-fraction-field {
        width: 50px;
        height: 30px;
        font-size: 24px; 
        text-align: center;
        border: none !important; 
        background-color: transparent !important; 
        outline: none;
        color: #000000;
        pointer-events: none; 
        font-family: 'Times New Roman', Times, serif !important; 
        font-style: italic !important; 
    }

    /* ==========================================================================
       9. 正解・不正解メッセージ・フッター
       ========================================================================== */
    /* --- 結果メッセージの表示スタイル --- */
    .result-message { 
        font-size: 17px; 
        font-weight: bold; 
        min-height: 48px; 
        text-align: center; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin-left: auto; 
        margin-right: auto; 
        margin-top: 0px; 
        white-space: pre-wrap; 
        width: 100%; 
    }

    /* --- 正解時のメッセージカラー --- */
    .correct { 
        color: #28a745; 
    }

    /* --- 不正解時のメッセージカラー --- */
    .incorrect { 
        color: #e67e22; 
    }

    /* --- フッターのスタイル --- */
    footer {
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #000000;
        font-weight: bold;
        padding-top: 4px;
        border-top: 1px solid #cfd8dc;
        position: absolute;
        bottom: 0;
        left: 0;
        background-color: #ffffff;
        border-radius: 0 0 10px 10px;
        padding-bottom: 4px;
    }

    </style>
</head>

<body>
    <div id="app-container">
    <header>
        <div class="title-bar">
        <button class="title-hand-btn" id="hand-left-btn" onclick="changeHandedness('left')">👈 左利き</button>
        <h1>文字式の加減（Step7：文字式の差）</h1>
        <button class="title-hand-btn active" id="hand-right-btn" onclick="changeHandedness('right')">右利き 👉</button>
        </div>
    </header>

    <div class="timer-container">
        <div style="display: flex; align-items: center; gap: 15px;">
        <div id="timer-display">⏱️ 00:00.0</div>
        <div class="record-box">
            <div id="best-update-message"></div>
            <div class="best-label-container">
            <div id="best-normal-display">ベストタイム(6問): --:--.-</div>
            </div>
        </div>
        </div>

    <script>
    /* ==========================================================================
       JS: グローバル変数・連携用設定
       ========================================================================== */
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScyrtX2kzsQFQZ845KuRKpfuaDmXba9Z_D9RqiRy-CQnvzluw/formResponse';
    const FORM_NUM_ID     = 'entry.351767117';   // 問題番号
    const FORM_NAME_ID    = 'entry.785004272';   // 名前
    const FORM_TIME_ID    = 'entry.1218861448';  // クリアタイム
    const FORM_STAGE_COUNT_ID = 'entry.2033679053';  // 正解数

    let startTime          = 0;
    let timerInterval      = null;
    let bestNormalTimeMs       = null;
    let lastClearTimeText      = "";
    let elapsedBeforeResume    = 0;

    let gameStarted        = false;
    let isCompleted        = false;
    let isCorrectState     = false;
    let quizData           = [];
    let currentQuestionIndex   = 0;
    let score          = 0;
    let currentQuestionWrongCount = 0;

    // 💡 ステップモード用変数
    let userInput          = "";
    let lastSubmittedInput     = "";
    let userInputExpr      = "";
    let userInputAns       = "";
    let isStepMode         = false;
    let currentStep        = 1;

    // 💡 30秒タイマー用変数
    let questionTimerId    = null;
    let questionTimeLeft       = 30;
    let currentControlState    = 'start';
    let activeEditorId = 'math-editor-answer';

    // 2段階入力用の管理変数
    let activeStep = 'intermediate';
    let inputBuffers = { intermediate: "", answer: "" };
    let stepCompleted = { intermediate: false, answer: false };

    const container        = document.getElementById('app-container');      // HTML内のメイン表示エリアを取得
    const formulaBox       = document.getElementById('formula-box');    // 問題を表示するためのHTML要素を取得
    const actionBtn        = document.getElementById('action-btn');     // 操作用ボタン（開始/回答など）を取得
    const resultMsgEl      = document.getElementById('result-message');     // 結果メッセージを表示するHTML要素を取得
    const progressEl       = document.getElementById('progress');       // 進捗状況（何問目かなど）を表示するHTML要素を取得

    let mathjaxPromise     = Promise.resolve();

    /* --- 生徒番号テンキー用変数 --- */
    const numberField = document.getElementById('number-field');
    const tooltip = document.getElementById('number-tooltip');
    const errorDisplay = document.getElementById('error-display');
    let isConfirmed = false;

    function updateMathJax(elements) {
        if (window.MathJax && MathJax.typesetPromise) {
        if (MathJax.typesetClear) MathJax.typesetClear(elements);
        mathjaxPromise = mathjaxPromise.then(() => MathJax.typesetPromise(elements))
            .catch((err) => console.log("MathJax typesetting failed: " + err.message));
        }
    }

    /* ==========================================================================
       JS: 画面リサイズ
       ========================================================================== */
    /* --- アプリのサイズを調整する関数 --- */
    function resizeApp() {
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
        container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeApp);
    window.addEventListener('DOMContentLoaded', () => { 
        resizeApp(); 
        initValidationControls(); 
        quizData = generateQuizData(); 
        showStartLayout(); 
    });

    /* ==========================================================================
       JS: 初期画面レイアウト
       ========================================================================== */
    /* --- 開始レイアウトを表示する関数 --- */
    function showStartLayout() {
        //「もう一回」押下時のロック解除・初期化処理
        window.isAlreadySubmitted = false;
        const sendBtnTop = document.getElementById('send-btn');
        if (sendBtnTop) {
        sendBtnTop.textContent = "送信";
        sendBtnTop.disabled = true;
        }
        if (numberField) {
        numberField.disabled = false;
        }

        gameStarted = false;
        isCompleted = false;
        progressEl.textContent = "第 - 問／全 6 問";
        formulaBox.innerHTML = `<span style="color:#aaa; font-size:24px;">生徒番号を入力→【スタート】</span>`;
        document.getElementById('hint-text').innerHTML = "目指せ！パーフェクト！";

        inputBuffers = { intermediate: "", answer: "" };
        stepCompleted = { intermediate: false, answer: false };
        renderInputFields();

        const currentEd = document.getElementById(activeEditorId);
        if (currentEd) {
        currentEd.innerHTML = '';
        currentEd.classList.remove('wide-fraction-mode');
        }

        document.getElementById('group-intermediate').className = "input-box-group locked-disabled";
        document.getElementById('group-answer').className = "input-box-group locked-disabled";
        updateControlKeysState('start');
        resultMsgEl.textContent = "";
    }

    /* ==========================================================================
       JS: ゲーム進行    // ===== 開始→出題 =====
       ========================================================================== */
    /* --- クイズゲームを開始する関数 --- */
    function startQuizGame() {
        window.isAlreadySubmitted = false; 
        gameStarted = true;
        score = 0;
        currentQuestionIndex = 0;
        startTimerClock();       
        
        // ゲーム開始後に生徒番号を選択不可にし、テンキー付き吹き出しを閉じる
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');

        loadQuestion(); 
        if (actionBtn) actionBtn.className = "key action-btn judge-mode"; 
    }

    /* --- 問題データの読み込み処理 --- */
    function loadQuestion() {
        isCompleted = false;
        currentQuestionWrongCount = 0; 
        stepCompleted.intermediate = false;
        stepCompleted.answer = false;
        inputBuffers.intermediate = "";
        inputBuffers.answer = "";

        resultMsgEl.textContent = ""; 
        resultMsgEl.className = "result-message";
        updateControlKeysState('playing');
        const gInt = document.getElementById('group-intermediate');
        const gAns = document.getElementById('group-answer');
        gInt.className = "input-box-group active-focus";
        gAns.className = "input-box-group locked-disabled";
        activeStep = 'intermediate';

        renderInputFields();

        const q = quizData[currentQuestionIndex];
        progressEl.textContent = `第 ${currentQuestionIndex + 1} 問 / 全 6 問`;
        formulaBox.innerHTML = q.html;
        updateMathJax([formulaBox]);

        // ===== 初期ヒント =====
        document.getElementById('hint-text').innerHTML = HINT_MASTER.status.initial;
        startQuestionTimer(); // 💡 タイマー始動
    }

    // ===== 正誤判定 =====
    /* --- アクションを処理する関数 --- */
    function handleAction() {
        if (!gameStarted) { startQuizGame(); return; }
        if (isCompleted) {
        if (currentQuestionIndex === 5) { restartQuiz(); return; }
        nextQuestion();
        return;
        }

        const isEvaluated = checkCurrentStep();
        if (isEvaluated) {
        startQuestionTimer();
        }
    }

    /* --- 回答のミスを分析してヒントを返す関数 --- */
    function analyzeMistake(userStr, correctStr) {
        // 1. 文字（x）のつけ忘れチェック
        if (correctStr.includes('x') && !userStr.includes('x')) {
        return HINT_MASTER.mistakes.first.charWrong;
        }
        
        // 2. 符号ミスのチェック（マイナスを外して同じになれば符号ミスと判定）
        let userAbs = userStr.replace(/\+/g, '').replace(/-/g, '');
        let correctAbs = correctStr.replace(/\+/g, '').replace(/-/g, '');
        if (userAbs === correctAbs && userAbs !== "") {
        return HINT_MASTER.mistakes.first.signWrong;
        }

        // 3. それ以外の計算ミスなど
        return HINT_MASTER.mistakes.first.otherWrong;
    }

    /* --- 現在のステップを確認する関数 --- */
    function checkCurrentStep() {
        const q = quizData[currentQuestionIndex];
        const userStr = inputBuffers[activeStep].replace(/\s+/g, "").trim();
        const targetGroup = document.getElementById(`group-${activeStep}`);
        const hintBody = document.getElementById('hint-text');

        if (!userStr) return false;

        // 先頭の「+」チェック
        if (userStr.startsWith('+')) {
        showStepError(targetGroup);
        hintBody.innerHTML = HINT_MASTER.rules.noStartingPlus;
        return;
        }

        // 「1x」「-1x」のチェック
        if (/(^|[+\-*/()])1x/.test(userStr) || /(^|[+\-*/()])-1x/.test(userStr)) {
        showStepError(targetGroup);
        hintBody.innerHTML = HINT_MASTER.rules.noOneX;
        return;
        }

        // 途中式のチェック
        if (activeStep === 'intermediate') {
        if (userStr === q.intermediate || userStr === q.intermediateAlt) {
            stepCompleted.intermediate = true;
            targetGroup.className = "input-box-group locked-correct";

            activeStep = 'answer';
            const ansGroup = document.getElementById('group-answer');
            ansGroup.className = "input-box-group active-focus";
            
            // ▼ 変更点：途中式正解時のリザルトメッセージを非表示化（ヒント枠だけで案内する）
            resultMsgEl.textContent = ""; 
            
            // 正解時のヒント文言を呼び出し
            hintBody.innerHTML = HINT_MASTER.intermediate.correct;
            renderInputFields();
            startQuestionTimer();

        } else {
            showStepError(targetGroup);
            
            // 不正解時のヒント文言を条件に合わせて呼び出し
            if (q.isBack && !userStr.includes("×")) {
            hintBody.innerHTML = HINT_MASTER.intermediate.errorBack;
            } else {
            hintBody.innerHTML = HINT_MASTER.intermediate.errorDefault;
            }
        }
        } 
        // 答えのチェック
        else if (activeStep === 'answer') {
        if (userStr === q.answer) {
            stepCompleted.answer = true;
            isCompleted = true;
            targetGroup.className = "input-box-group locked-correct";
            renderInputFields();
            if (currentQuestionWrongCount === 0) score++;
            
            // 全4問なので、インデックス3でクリア
            if (currentQuestionIndex === 5) {
            stopTimerClockAndEvaluate(); 
            
            // ▼ 全問クリア時のリザルトメッセージは残す
            resultMsgEl.textContent = `全 6 問中 ${score} 問ノーミス正解！`;
            resultMsgEl.className = "result-message correct";
            
            progressEl.textContent = (score === 6) ? "全問ノーミスパーフェクト！" : "全問終了！";
            hintBody.innerHTML = HINT_MASTER.status.sendPrompt;
            
            updateControlKeysState('finished');
            updateSendButtonState();
            } else {
            // ▼ 変更点：各問題正解時（クリア以外）のリザルトメッセージを非表示化
            resultMsgEl.textContent = ""; 
            
            if (currentQuestionWrongCount === 0) hintBody.innerHTML = HINT_MASTER.status.correctFirst;
            else hintBody.innerHTML = HINT_MASTER.status.correctFixed;
            
            updateControlKeysState('cleared');
            }
        } else {
            showStepError(targetGroup);
            hintBody.innerHTML = analyzeMistake(userStr, q.answer);
        }
        }
    }

    /* --- ステップのエラーを表示する関数 --- */
    function showStepError(groupEl) {
        currentQuestionWrongCount++;
        groupEl.classList.remove('error-shake');
        void groupEl.offsetWidth; 
        groupEl.classList.add('error-shake');
    }

    // ===== クイズの進行 =====
    /* --- 次の問題へ進む関数 --- */
    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); }
    }

    /* --- クイズを再開する関数 --- */
    function restartQuiz() {
        quizData = generateQuizData(); 
        showStartLayout(); 
    }

    /* ==========================================================================
       JS: 30秒タイマー
       ========================================================================== */
    // 💡 30秒タイマーの制御
    function startQuestionTimer() {
        clearInterval(questionTimerId);
        if (!gameStarted || isCompleted) {
        document.getElementById('countdown-timer').style.display = 'none';
        return;
        }

        // 💡 追加：3回目以降（2回ミス）はカウントダウンを停止して「じっくりタイム」にする
        if (currentQuestionWrongCount >= 2) {
        document.getElementById('countdown-timer').style.display = 'inline-block';
        document.getElementById('countdown-timer').textContent = "じっくりタイム";
        return;
        }

        questionTimeLeft = 30;
        updateQuestionTimerUI();
        document.getElementById('countdown-timer').style.display = 'inline-block';
        
        questionTimerId = setInterval(() => {
        questionTimeLeft--;
        updateQuestionTimerUI();
        if (questionTimeLeft <= 0) {
            handleQuestionTimeout();
        }
        }, 1000);
    }

    /* --- 問題のタイマーUIを更新する関数 --- */
    function updateQuestionTimerUI() {
        const el = document.getElementById('countdown-timer');
        if (el) el.textContent = `残り ${questionTimeLeft}秒`;
    }

    /* --- 問題のタイムアウトを処理する関数 --- */
    function handleQuestionTimeout() {
        clearInterval(questionTimerId);
        let targetGroup;
        if (!isStepMode) {
        targetGroup = document.getElementById('group-' + activeStep);
        } else {
        targetGroup = (currentStep === 1) ? document.getElementById('group-expression') : document.getElementById('group-answer');
        }
        
        showStepError(targetGroup);
        
        // ▼ タイムアップ専用ヒントを HINT_MASTER から呼び出し ▼[cite: 4]
        const hintBody = document.getElementById('hint-text');
        if (isStepMode && currentStep === 1) {
        hintBody.innerHTML = HINT_MASTER.timeout.stepMode;
        } else {
        hintBody.innerHTML = HINT_MASTER.timeout.default;
        }
        
        startQuestionTimer(); // タイマー再スタート
    }

    /* ==========================================================================
       JS: 入力枠ステップ・MathJaxレンダリング
       ========================================================================== */
    /* --- ステップを選択する関数 --- */
    function selectStep(step) {
        if (!gameStarted || isCompleted) return;
        if (stepCompleted[step]) return; 
        if (step === 'answer' && !stepCompleted.intermediate) return; 
        activeStep = step;
        document.getElementById('group-intermediate').classList.remove('active-focus');
        document.getElementById('group-answer').classList.remove('active-focus');
        document.getElementById(`group-${step}`).classList.add('active-focus');
    }

    /* --- 入力フィールドをレンダリングする関数 --- */
    function renderInputFields() {
        ['intermediate', 'answer'].forEach(step => {
        const el = document.getElementById(`render-${step}`);
        if (!el) return;
        
        const badge = document.getElementById(`badge-${step}`);
        const str = inputBuffers[step];
        if (stepCompleted[step]) badge.textContent = "正解！";
        else if (gameStarted && activeStep === step) badge.textContent = "入力中...";
        else badge.textContent = "ロック中";
        if (str === "") {
            el.innerHTML = `<span class="placeholder-text">${step === 'intermediate' ? 'ここに途中式を入力' : 'ここに答えを入力'}</span>`;
        } else {
            el.innerHTML = `$${str}$`;
        }
        });
        updateMathJax([document.getElementById('render-intermediate'), document.getElementById('render-answer')]);
    }

    /* ==========================================================================
       JS: テンキー入力
       ========================================================================== */
    /* --- キー入力を処理する関数 --- */
    function pressKey(key) {
        if (!gameStarted || isCompleted) return;

        let currentStr = inputBuffers[activeStep];
        if (key === 'clear') {
        inputBuffers[activeStep] = "";
        } else if (key === 'Backspace') {
        inputBuffers[activeStep] = currentStr.slice(0, -1);
        } else {
        if (currentStr.length < 20) inputBuffers[activeStep] += key;
        }
        renderInputFields();
    }


    /* ==========================================================================
       JS: 生徒番号用ミニテンキー制御
       ========================================================================== */
    /* --- 1. 入力欄クリック・タップ時、および画面外タップ時の制御初期化 --- */
    function initValidationControls() {
        if (!numberField) return;

        // 入力欄クリック時の処理
        numberField.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isConfirmed || numberField.value !== '') {
            numberField.value = '';
            isConfirmed = false;
            errorDisplay.style.display = 'none';
            updateSendButtonState();
        }
        tooltip.classList.add('show');
        numberField.focus();
        });

        tooltip.addEventListener('click', (e) => {
        e.stopPropagation();
        });

        // 枠外（画面の別の場所）をタップしたときに未確定ならリセットして閉じる
        document.addEventListener('click', (e) => {
        if (tooltip.classList.contains('show') && !isConfirmed) {
            numberField.value = '';
            errorDisplay.style.display = 'none';
            tooltip.classList.remove('show');
            numberField.blur();
            updateSendButtonState();
        }
        });
    }

    /* --- 2. 数字キー押下時の処理 --- */
    function pressNum(num) {
        if (!numberField) return;
        let currentVal = numberField.value;

        // すでに4桁入っている（エラー状態）のに新しく数字が押された場合、
        // 自動的にリセットして、その数字を1桁目にする
        if (currentVal.length === 4) {
        currentVal = '';
        errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        // 4桁入力された瞬間にバリデーション判定
        if (currentVal.length === 4) {
        const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);

        if (isValid) {
            completeInput(currentVal); 
        } else {
            errorDisplay.style.display = 'block';
        }
        }
    }

    /* --- 3. 入力完了時の確定処理 --- */
    function completeInput(value) {
        isConfirmed = true;
        tooltip.classList.remove('show');
        numberField.blur();
        console.log('確定した番号: ' + value);
        updateSendButtonState();
    }

    /* --- 4. 「消す」キー（1文字削除）押下時の処理 --- */
    function pressClear() {
        if (!numberField) return;
        let currentVal = numberField.value;
        if (currentVal.length > 0) {
        numberField.value = currentVal.slice(0, -1);
        }
        errorDisplay.style.display = 'none';
        isConfirmed = false;
        updateSendButtonState();
    }

    /* ==========================================================================
       JS: コントロールキー
       ========================================================================== */
    /* --- コントロールキーの状態更新関数 --- */
    function updateControlKeysState(state) {
        currentControlState = state;
        const btnLeft = document.getElementById('action-btn');
        const btnCenter = document.getElementById('clear-btn');
        const btnRight = document.getElementById('clear-all-btn');
    
        // 一旦クラスをリセット（色味の変更用）
        btnLeft.className = "key action-btn";
        btnCenter.className = "key clear-btn";
        btnRight.className = "key clear-btn";
    
        if (state === 'start') {
        // 【ゲーム開始時】 [スタート][消す(無効)][全消去(無効)]
        btnLeft.textContent = "スタート"; 
        btnLeft.disabled = false;

        btnCenter.textContent = "消す"; 
        btnCenter.disabled = true;

        btnRight.textContent = "全消去"; 
        btnRight.disabled = true;

        } else if (state === 'playing') {
　          // 【ゲーム時】 [判定する][消す(有効)][全消去(有効)]
        btnLeft.textContent = "判定する"; 
        btnLeft.className = "key action-btn judge-mode";
        btnLeft.disabled = false;

        btnCenter.textContent = "消す";
        btnCenter.disabled = false;

        btnRight.textContent = "全消去";
        btnRight.disabled = false;

        } else if (state === 'cleared') {
        // 【ゲームクリア時（各問正解時）】 [次の問題][消す(無効)][全消去(有効)]
        btnLeft.textContent = "次の問題"; 
        btnLeft.className = "key action-btn judge-mode"; 
        btnLeft.disabled = false;

        btnCenter.textContent = "消す"; 
        btnCenter.disabled = true;

        btnRight.textContent = "全消去"; 
        btnRight.disabled = false;

        } else if (state === 'finished') {
        // 【ゲーム終了時】 [終了(無効)][送信][もう一回]

        // 1. 左の「終了」ボタン: 灰色に変更し、完全にクリック不可にする
        btnLeft.textContent = "終了"; 
        btnLeft.className = "key clear-btn"; 
        btnLeft.disabled = true; 
        
        // 2. 真ん中の「送信」ボタン: 右上の送信ボタンと同じ青色ベースにする
        btnCenter.textContent = "送信"; 
        btnCenter.className = "key action-btn judge-mode"; 
        // ※有効/無効の切り替えは updateSendButtonState() が自動で処理します

        // 3. 右の「もう一回」ボタン: スタートボタンと同じ緑色にする
        btnRight.textContent = "もう一回"; 
        btnRight.className = "key action-btn"; 
        btnRight.disabled = false;
        }
    }

    /* --- 中央ボタンの操作を処理する関数 --- */
    function handleCenterBtn() {
        // 終了時は送信処理、それ以外は1文字消去
        if (currentControlState === 'finished') manualSendToGoogleForm();
        else pressKey('Backspace');
    }
    
    /* --- 右ボタンの操作を処理する関数 --- */
    function handleRightBtn() {
        // 終了時はもう一回（リスタート）、それ以外は全消去
        if (currentControlState === 'finished') restartQuiz();
        else pressKey('clear');
    }

    /* ==========================================================================
       JS: 利き手切り替え
       ========================================================================== */
    /* --- 利き手を変更する関数 --- */
    function changeHandedness(hand) {
        const workspace = document.querySelector('.game-layout');
        const rightBtn = document.getElementById('hand-right-btn');
        const leftBtn = document.getElementById('hand-left-btn');

        if (hand === 'left') {
        workspace.classList.add('left-handed');
        leftBtn.classList.add('active');
        rightBtn.classList.remove('active');
        } else {
        workspace.classList.remove('left-handed');
        rightBtn.classList.add('active');
        leftBtn.classList.remove('active');
        }
    }

    /* ==========================================================================
       JS: 送信フォーム・タイマー処理
       ========================================================================== */
    /* --- 送信ボタンの状態を更新する関数 --- */
    function updateSendButtonState() {
        const numVal = document.getElementById('number-field').value.trim();
        const sendBtnTop = document.getElementById('send-btn');       
        const sendBtnBottom = document.getElementById('clear-btn');   
    
        if (sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "");
        sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
        sendBtnBottom.disabled = !canSend;
        if (!canSend) sendBtnBottom.className = "key clear-btn"; 
        else sendBtnBottom.className = "key action-btn judge-mode"; 
        }
    }

    /* --- フォーム送信を実行する関数 --- */
    function executeFormSubmit(num, name, timeText, stageCount) {
        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
        [FORM_NUM_ID]:     num,                   
        [FORM_TIME_ID]:    timeText,    
        [FORM_STAGE_COUNT_ID]: stageCount          
        };
        for (const key in fields) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        document.body.removeChild(form);
    }

    /* --- Googleフォームへ手動で送信する関数 --- */
    function manualSendToGoogleForm() {
        const numInput = numberField ? numberField.value.trim() : "";
        if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
        return;
        }
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('clear-btn'); 
        
        if (sendBtnTop) {
        sendBtnTop.textContent = "送信中";
        sendBtnTop.disabled = true; 
        }
        if (currentControlState === 'finished' && sendBtnBottom) {
        sendBtnBottom.textContent = "送信中";
        sendBtnBottom.disabled = true;
        sendBtnBottom.className = "key clear-btn"; 
        }
        
        // データ送信
        const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        const timeToSend = lastClearTimeText || currentTimerText;
        executeFormSubmit(numInput, "", timeToSend, score);
        window.isAlreadySubmitted = true;
        
        // 送信後は生徒番号をロックして変更不可にする
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');
    
        setTimeout(() => { 
        if (sendBtnTop) sendBtnTop.textContent = "完了"; 
        if (currentControlState === 'finished' && sendBtnBottom) {
            sendBtnBottom.textContent = "完了";
            sendBtnBottom.className = "key clear-btn"; 
        }
        }, 1000);
    }

    /* ==========================================================================
       JS: タイマー
       ========================================================================== */
    /* --- タイマーを更新する関数 --- */
    function updateTimer() {
        const diff = (Date.now() - startTime) + elapsedBeforeResume;
        const min = Math.floor(diff / 60000);
        const sec = Math.floor((diff % 60000) / 1000);
        const msec = Math.floor((diff % 1000) / 100);

        const minStr = String(min).padStart(2, '0');
        const secStr = String(sec).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
    }

    /* --- タイマークロックを開始する関数 --- */
    function startTimerClock() {
        isCorrectState = false;
        lastClearTimeText = "";
        elapsedBeforeResume = 0;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('best-update-message').innerText = "";
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.textContent = "送信";
        }
        if (numberField) numberField.disabled = false;
    }
    /* --- タイマークロックを停止し、結果を評価する関数 --- */
    function stopTimerClockAndEvaluate() {
        clearInterval(timerInterval);
        isCorrectState = true; 
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        lastClearTimeText = finalTimeStr;
        
        const totalElapsedTimeMs = (Date.now() - startTime) + elapsedBeforeResume;
        elapsedBeforeResume = totalElapsedTimeMs;
        if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
        bestNormalTimeMs = totalElapsedTimeMs;
        document.getElementById('best-normal-display').innerText = `ベストタイム(6問): ${finalTimeStr}`;
        document.getElementById('best-update-message').innerText = "🎉 ベスト更新！";
        }
        
        const numInput = numberField ? numberField.value.trim() : "";
        const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
        
        if (isValidNum && !window.isAlreadySubmitted) {
        // ルートA：事前に入力済みの場合 → 自動送信して完全ロック
        executeFormSubmit(numInput, "", lastClearTimeText, score);
        window.isAlreadySubmitted = true; 
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('clear-btn');
        if (sendBtnTop) {
            sendBtnTop.textContent = "完了";
            sendBtnTop.disabled = true;
        }
        if (sendBtnBottom) {
            sendBtnBottom.textContent = "完了";
            sendBtnBottom.disabled = true;
            sendBtnBottom.className = "key clear-btn";
        }
        if (numberField) numberField.disabled = true;
        } else {
        // ルートB：未入力の場合 → 手動入力のためにロック解除
        window.isAlreadySubmitted = false;
        if (numberField) numberField.disabled = false;
        }
        
        updateSendButtonState();
    }

    /* ==========================================================================
       JS: クイズデータ自動生成
       ========================================================================== */
    /* --- ランダムデータを生成する関数 --- */
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randRangeExcludeZero(min, max) {
        let val = 0;
        while (val === 0) { val = randInt(min, max); }
        return val;
    }

    /* --- クイズデータを生成する関数 --- */
    function generateQuizData() {
        let list = [];

        function formatTerm(coef, isFirst) {
            if (coef === 0) return "";
            let res = "";
            if (coef === 1) res = "x";
            else if (coef === -1) res = "-x";
            else res = coef + "x";

            if (!isFirst && coef > 0) return "+" + res;
            return res;
        }

        function formatNum(num, isFirst) {
            if (num === 0) return "";
            if (!isFirst && num > 0) return "+" + num;
            return String(num);
        }

        // カッコ内の文字列を生成
        function makeExprText(c1, c2, isXFirst) {
            if (isXFirst) {
                let t1 = formatTerm(c1, true);
                let t2 = formatNum(c2, t1 === "");
                return t1 + t2;
            } else {
                let t1 = formatNum(c1, true);
                let t2 = formatTerm(c2, t1 === "");
                return t1 + t2;
            }
        }

        // 引き算用：カッコを外した時の後半部分の結合（符号を反転させる）
        function makeExprIntermediateSub(c1, c2, isXFirst) {
            if (isXFirst) {
                let t1 = formatTerm(-c1, false);
                let t2 = formatNum(-c2, false);
                return t1 + t2;
            } else {
                let t1 = formatNum(-c1, false);
                let t2 = formatTerm(-c2, false);
                return t1 + t2;
            }
        }

        for (let i = 0; i < 6; i++) {
            let qText = "";
            let correctIntermediate = "";
            let correctAnswer = "";

            // 問1〜3は正の数のみ(1〜9)、問4〜6は正負の数(-9〜9、0を除く)
            let A, B, C, D;
            if (i < 3) {
                A = randInt(1, 9);
                B = randInt(1, 9);
                C = randInt(1, 9);
                D = randInt(1, 9);
            } else {
                A = randRangeExcludeZero(-9, 9);
                B = randRangeExcludeZero(-9, 9);
                C = randRangeExcludeZero(-9, 9);
                D = randRangeExcludeZero(-9, 9);
            }

            if (i === 0) {
                // 問1： M - (M + N) -> Ax - (Bx + C)
                let expr = makeExprText(B, C, true);
                qText = `${formatTerm(A, true)} - (${expr})`;
                correctIntermediate = formatTerm(A, true) + makeExprIntermediateSub(B, C, true);

                let totalX = A - B;
                let totalNum = -C;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;

            } else if (i === 1) {
                // 問2： N - (M + N) -> A - (Bx + C)
                let expr = makeExprText(B, C, true);
                qText = `${formatNum(A, true)} - (${expr})`;
                correctIntermediate = formatNum(A, true) + makeExprIntermediateSub(B, C, true);

                let totalX = -B;
                let totalNum = A - C;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;

            } else if (i === 2) {
                // 問3 ： (M + N) - (M + N) -> (Ax + B) - (Cx + D)
                let expr1 = makeExprText(A, B, true);
                let expr2 = makeExprText(C, D, true);
                qText = `(${expr1}) - (${expr2})`;
                correctIntermediate = expr1 + makeExprIntermediateSub(C, D, true);

                let totalX = A - C;
                let totalNum = B - D;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;

            } else if (i === 3) {
                // 問4 ： (M + N) - (N + M) -> (Ax + B) - (C + Dx)
                let expr1 = makeExprText(A, B, true);
                let expr2 = makeExprText(C, D, false);
                qText = `(${expr1}) - (${expr2})`;
                correctIntermediate = expr1 + makeExprIntermediateSub(C, D, false);

                let totalX = A - D;
                let totalNum = B - C;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;

            } else if (i === 4) {
                // 問5 ： (N + M) - (M + N) -> (A + Bx) - (Cx + D)
                let expr1 = makeExprText(A, B, false);
                let expr2 = makeExprText(C, D, true);
                qText = `(${expr1}) - (${expr2})`;
                correctIntermediate = expr1 + makeExprIntermediateSub(C, D, true);

                let totalX = B - C;
                let totalNum = A - D;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;

            } else if (i === 5) {
                // 問6 ： (N + M) - (N + M) -> (A + Bx) - (C + Dx)
                let expr1 = makeExprText(A, B, false);
                let expr2 = makeExprText(C, D, false);
                qText = `(${expr1}) - (${expr2})`;
                correctIntermediate = expr1 + makeExprIntermediateSub(C, D, false);

                let totalX = B - D;
                let totalNum = A - C;
                let tx = formatTerm(totalX, true);
                let tn = formatNum(totalNum, tx === "");
                correctAnswer = (tx + tn === "") ? "0" : tx + tn;
            }

            list.push({
                html: `$${qText}$`,
                intermediate: correctIntermediate,
                answer: correctAnswer
            });
        }
        return list;
    }
