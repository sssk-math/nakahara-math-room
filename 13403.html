const IS_INV = (MODE === 'inv');

/* ==========================================================================
   2. 画面・表示【共通】
   ========================================================================== */
function resizeApp() {
    const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
    container.style.transform = `scale(${scale})`;
}
function showScreen(screenId) {
    document.querySelectorAll('.app-screen').forEach(el => { el.style.display = 'none'; });
    const target = document.getElementById(screenId);
    if (target) target.style.display = 'flex';
}
function updateMathJax(elements) {
    if (window.MathJax && MathJax.typesetPromise) {
        if (MathJax.typesetClear) MathJax.typesetClear(elements);
        mathjaxPromise = mathjaxPromise.then(() => MathJax.typesetPromise(elements))
            .catch((err) => console.log("MathJax typesetting failed: " + err.message));
    }
}
function setHint(html) {
    const el = document.getElementById('hint-text');
    el.innerHTML = html;
    updateMathJax([el]);
}


/* ==========================================================================
   3. タイマー【共通】
   ========================================================================== */
function startTimerClock() {
    isCorrectState = false;
    lastClearTimeText = "";
    elapsedBeforeResume = 0;
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 100);
    document.getElementById('best-update-message').innerText = "";
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "送信"; }
    if (numberField) numberField.disabled = false;
}
function updateTimer() {
    const diff = (Date.now() - startTime) + elapsedBeforeResume;
    if (diff >= KENTEI_TIME_LIMIT_MS) { handleKenteiTimeUp(); return; }
    const min = Math.floor(diff / 60000);
    const sec = Math.floor((diff % 60000) / 1000);
    const msec = Math.floor((diff % 1000) / 100);
    document.getElementById('timer-display').innerText = `⏱️ ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
}
function handleKenteiTimeUp() {
    if (!gameStarted || isCompleted) return;
    clearInterval(timerInterval);
    clearInterval(questionTimerId);
    isCompleted = true;
    drawing = false;
    document.getElementById('timer-display').innerText = `⏱️ ${formatMs(KENTEI_TIME_LIMIT_MS)}`;
    correctStreakCount = 0;
    saveKenteiRecords();
    if (document.activeElement) document.activeElement.blur();
    stopTimerClockAndEvaluate(true);
    resultMsgEl.textContent = `時間切れ！全 ${quizData.length} 問中 ${score} 問ノーミス正解`;
    resultMsgEl.className = "result-message incorrect";
    progressEl.textContent = "時間切れ！";
    setGraphActive(false);
    setHint(HINT_DATA.allFinished);
    updateStageTabs();
    updateControlKeysState('finished'); updateSendButtonState();
}
function stopTimerClockAndEvaluate(isTimeUp = false) {
    clearInterval(timerInterval);
    isCorrectState = true;
    clearInterval(questionTimerId);
    document.getElementById('countdown-timer').style.display = 'none';
    const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
    lastClearTimeText = finalTimeStr;

    const totalElapsedTimeMs = isTimeUp ? KENTEI_TIME_LIMIT_MS : ((Date.now() - startTime) + elapsedBeforeResume);
    elapsedBeforeResume = totalElapsedTimeMs;

    kenteiAttemptCount++;
    saveKenteiRecords();

    if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
        bestNormalTimeMs = totalElapsedTimeMs;
        document.getElementById('best-normal-display').innerText = bestTimeText(finalTimeStr);
        document.getElementById('best-update-message').innerText = isTimeUp ? "" : "🎉 ベスト更新！";
        saveKenteiRecords();
    }

    const numInput = numberField ? numberField.value.trim() : "";
    const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
    if (isValidNum && !window.isAlreadySubmitted) {
        executeFormSubmit(numInput, lastClearTimeText, score);
        window.isAlreadySubmitted = true;
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('action-btn');
        if (sendBtnTop) { sendBtnTop.textContent = "完了"; sendBtnTop.disabled = true; }
        if (sendBtnBottom) { sendBtnBottom.textContent = "完了"; sendBtnBottom.disabled = true; sendBtnBottom.className = "key clear-btn"; }
        if (numberField) numberField.disabled = true;
    } else {
        window.isAlreadySubmitted = false;
        if (numberField) numberField.disabled = false;
    }
    updateSendButtonState();
}
function startQuestionTimer() {
    clearInterval(questionTimerId);
    const cd = document.getElementById('countdown-timer');
    if (!gameStarted || isCompleted) { cd.style.display = 'none'; return; }
    if (currentQuestionWrongCount >= 2) {
        cd.style.display = 'inline-block';
        cd.textContent = "じっくりタイム";
        return;
    }
    questionTimeLeft = (currentStage === 'draw') ? DRAW_TIME_LIMIT_SEC : QUESTION_TIME_LIMIT_SEC;
    updateQuestionTimerUI();
    cd.style.display = 'inline-block';
    questionTimerId = setInterval(() => {
        questionTimeLeft--;
        updateQuestionTimerUI();
        if (questionTimeLeft <= 0) handleQuestionTimeout();
    }, 1000);
}
function updateQuestionTimerUI() {
    const el = document.getElementById('countdown-timer');
    if (el) el.textContent = `残り ${questionTimeLeft}秒`;
}
function formatMs(ms) {
    const totalMs = Math.max(0, Math.round(ms));
    const min = Math.floor(totalMs / 60000);
    const sec = Math.floor((totalMs % 60000) / 1000);
    const msec = Math.floor((totalMs % 1000) / 100);
    return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
}
function bestTimeText(timeStr) { return `ベストタイム(${QUESTION_COUNT}問): ${timeStr}`; }


/* ==========================================================================
   4. 生徒番号入力・記録送信【共通】
   ========================================================================== */
function initValidationControls() {
    if (!numberField) return;
    numberField.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isConfirmed || numberField.value !== '') {
            numberField.value = '';
            isConfirmed = false;
            errorDisplay.style.display = 'none';
            updateSendButtonState();
        }
        tooltip.classList.add('show');
        numberField.focus();
    });
    tooltip.addEventListener('click', (e) => { e.stopPropagation(); });
    document.addEventListener('click', () => {
        if (tooltip.classList.contains('show') && !isConfirmed) {
            numberField.value = '';
            errorDisplay.style.display = 'none';
            tooltip.classList.remove('show');
            numberField.blur();
            updateSendButtonState();
        }
    });
}
function pressNum(num) {
    if (!numberField) return;
    let currentVal = numberField.value;
    if (currentVal.length === 4) { currentVal = ''; errorDisplay.style.display = 'none'; }
    currentVal += num;
    numberField.value = currentVal;
    updateSendButtonState();
    if (currentVal.length === 4) {
        const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
        if (isValid) completeInput(currentVal);
        else errorDisplay.style.display = 'block';
    }
}
function completeInput() {
    isConfirmed = true;
    tooltip.classList.remove('show');
    numberField.blur();
    updateSendButtonState();
}
function pressClear() {
    if (!numberField) return;
    const currentVal = numberField.value;
    if (currentVal.length > 0) numberField.value = currentVal.slice(0, -1);
    errorDisplay.style.display = 'none';
    isConfirmed = false;
    updateSendButtonState();
}
function updateSendButtonState() {
    if (window.isAlreadySubmitted) return;
    const numVal = numberField ? numberField.value.trim() : "";
    const sendBtnTop = document.getElementById('send-btn');
    const sendBtnBottom = document.getElementById('action-btn');
    if (sendBtnTop && sendBtnTop.textContent === "完了") return;
    const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
    if (sendBtnTop) sendBtnTop.disabled = !canSend;
    if (currentControlState === 'finished' && sendBtnBottom) {
        sendBtnBottom.disabled = !canSend;
        sendBtnBottom.className = canSend ? "key action-btn judge-mode" : "key clear-btn";
    }
}
function executeFormSubmit(num, timeText, stageCount) {
    const form = document.createElement('form');
    form.action = GOOGLE_FORM_URL;
    form.method = 'POST';
    form.target = 'hidden_iframe';
    const fields = { [FORM_NUM_ID]: num, [FORM_TIME_ID]: timeText, [FORM_STAGE_COUNT_ID]: stageCount };
    for (const key in fields) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
    }
    document.body.appendChild(form);
    try { form.submit(); } catch (e) { console.error('送信エラー', e); }
    setTimeout(() => { document.body.removeChild(form); }, 1000);
}
function manualSendToGoogleForm() {
    const numInput = numberField ? numberField.value.trim() : "";
    if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) return;
    const sendBtnTop = document.getElementById('send-btn');
    const sendBtnBottom = document.getElementById('action-btn');
    if (sendBtnTop) { sendBtnTop.textContent = "送信中"; sendBtnTop.disabled = true; }
    if (currentControlState === 'finished' && sendBtnBottom) {
        sendBtnBottom.textContent = "送信中"; sendBtnBottom.disabled = true; sendBtnBottom.className = "key clear-btn";
    }
    const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
    executeFormSubmit(numInput, lastClearTimeText || currentTimerText, score);
    window.isAlreadySubmitted = true;
    if (numberField) numberField.disabled = true;
    if (tooltip) tooltip.classList.remove('show');
    setTimeout(() => {
        if (sendBtnTop) sendBtnTop.textContent = "完了";
        if (currentControlState === 'finished' && sendBtnBottom) { sendBtnBottom.textContent = "完了"; sendBtnBottom.className = "key clear-btn"; }
    }, 1000);
}


/* ==========================================================================
   5. 記録の保存・読み込み・記録画面【共通】
   ========================================================================== */
function loadKenteiRecords() {
    try {
        const raw = localStorage.getItem(KENTEI_RECORDS_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            bestNormalTimeMs = (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null;
            correctStreakCount = (typeof parsed.streak === 'number') ? parsed.streak : 0;
            maxStreakCount = (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : 0;
            kenteiAttemptCount = (typeof parsed.attempts === 'number') ? parsed.attempts : 0;
            return;
        }
    } catch (e) { /* 読み込み失敗時は初期化 */ }
    bestNormalTimeMs = null; correctStreakCount = 0; maxStreakCount = 0; kenteiAttemptCount = 0;
}
function saveKenteiRecords() {
    try {
        localStorage.setItem(KENTEI_RECORDS_KEY, JSON.stringify({ bestTimeMs: bestNormalTimeMs, streak: correctStreakCount, maxStreak: maxStreakCount, attempts: kenteiAttemptCount }));
    } catch (e) { /* 保存失敗時は何もしない */ }
}
function changeHandedness(hand) {
    const workspace = document.querySelector('.game-layout');
    const rightBtn = document.getElementById('hand-right-btn');
    const leftBtn = document.getElementById('hand-left-btn');
    if (hand === 'left') { workspace.classList.add('left-handed'); leftBtn.classList.add('active'); rightBtn.classList.remove('active'); }
    else { workspace.classList.remove('left-handed'); rightBtn.classList.add('active'); leftBtn.classList.remove('active'); }
}
function enterKenteiScreen() { restartQuiz(); showScreen('screen-kentei'); }
function goBackFromKentei() {

}
function renderKirokuScreen() {

function openResetConfirm(type) {

/* ==========================================================================
   6. 操作ボタン・キー状態【共通・固有】
   ========================================================================== */
function handleAction() {
    if (!gameStarted) { startQuizGame(); return; }
    if (isCompleted) {
        if (currentControlState === 'finished') { manualSendToGoogleForm(); return; }
        nextQuestion();
        return;
    }
    checkAnswer();
}
function handleRightBtn() {
    if (currentControlState === 'start' || currentControlState === 'finished') goBackFromKentei();
    else clearAllInput();
}
function handleCenterBtn() {
    if (currentControlState === 'finished') { restartQuiz(); return; }
    if (!gameStarted || isCompleted) return;
    if (currentStage === 'table') pressKey('Backspace');
    else if (currentStage === 'plot') undoPoint();
    else undoStroke();
}
function hasStageInput() {
    if (currentStage === 'table') return !isCurrentStageEmpty();
    if (currentStage === 'plot') return plotted.length > 0;
    return strokes.length > 0;
}
function updateControlKeysState(state) {
    currentControlState = state;
    actionBtn.className = "key action-btn";
    clearBtn.className = "key clear-btn";
    clearAllBtn.className = "key clear-btn";
    if (state === 'start') {
        actionBtn.textContent = "スタート"; actionBtn.disabled = false;
        clearBtn.textContent = "消す"; clearBtn.disabled = true;
        clearAllBtn.textContent = "戻る"; clearAllBtn.className = "key action-btn-back"; clearAllBtn.disabled = false;
    } else if (state === 'playing') {
        const has = hasStageInput();
        actionBtn.textContent = "判定する"; actionBtn.className = "key action-btn judge-mode";
        actionBtn.disabled = (!has || judgeLocked);
        clearBtn.textContent = "消す"; clearBtn.disabled = !has;
        clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = !has;
    } else if (state === 'cleared') {
        actionBtn.textContent = "次の問題"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
        clearBtn.textContent = "消す"; clearBtn.disabled = true;
        clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = true;
    } else if (state === 'finished') {
        actionBtn.textContent = "送信"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
        clearBtn.textContent = "もう一回"; clearBtn.className = "key action-btn"; clearBtn.disabled = false;
        clearAllBtn.textContent = "戻る"; clearAllBtn.className = "key action-btn-back"; clearAllBtn.disabled = false;
    }
    updateKeypadState();
}
/* --- テンキーは「表」の手順のときだけ使える --- */
function updateKeypadState() {
    const on = gameStarted && !isCompleted && currentStage === 'table';
    document.querySelectorAll('.keypad button[data-k]').forEach(b => { b.disabled = !on; });
}
function updateStageTabs() {
    ['table', 'plot', 'draw'].forEach((s, i) => {
        const el = document.getElementById('tab-' + s);
        if (!el) return;
        let cls = 'step-tab';
        if (i < stageProgress) cls += ' done';
        else if (gameStarted && !isCompleted && i === stageProgress) cls += ' active';
        el.className = cls;
    });
}
function clearAllInput() {
    if (!gameStarted || isCompleted) return;
    if (currentStage === 'table') pressKey('clear');
    else if (currentStage === 'plot') { plotted = []; afterGraphEdit(); }
    else { strokes = []; afterGraphEdit(); }
}


/* ==========================================================================
   7. 手順1：表の入力【固有】
   ========================================================================== */
const fmtNum = n => (n < 0 ? '−' + (-n) : String(n));
const keyOf = p => p.x + ',' + p.y;

function buildTable() {
    let h = '<tr><th>$x$</th><th>$y$</th></tr>';
    TABLE_X.forEach((x, i) => {
        h += `<tr><td class="xv">${fmtNum(x)}</td><td><div class="cell" data-i="${i}" onclick="selectCell(${i})"></div></td></tr>`;
    });
    document.getElementById('prop-table').innerHTML = h;
    updateMathJax([document.getElementById('prop-table')]);
}
function setTableUI(cls) { document.getElementById('group-table').className = 'input-box-group ' + cls; }
function renderCells() {
    document.querySelectorAll('.cell[data-i]').forEach(el => {
        const i = parseInt(el.getAttribute('data-i'), 10);
        const isActive = gameStarted && !isCompleted && currentStage === 'table' && i === activeIdx && cellState[i] !== 'ok';
        el.textContent = cellVals[i].replace('-', '−');
        el.className = 'cell' + (cellState[i] ? ' ' + cellState[i] : '') + (isActive ? ' active' : '');
    });
}
function selectCell(i) {
    if (!gameStarted || isCompleted || currentStage !== 'table') return;
    if (!TABLE_CELLS.includes(i) || cellState[i] === 'ok') return;
    activeIdx = i;
    renderCells();
}
function moveActive(dir) {
    const list = TABLE_CELLS.filter(i => cellState[i] !== 'ok');
    if (list.length === 0) return;
    let pos = list.indexOf(activeIdx);
    pos = (pos < 0) ? 0 : (pos + dir + list.length) % list.length;
    activeIdx = list[pos];
}
function isCurrentStageEmpty() {
    return TABLE_CELLS.filter(i => cellState[i] !== 'ok').every(i => cellVals[i] === '');
}
function pressKey(key) {
    if (!gameStarted || isCompleted || currentStage !== 'table') return;
    const group = document.getElementById('group-table');
    if (group) group.classList.remove('error-shake');

    if (key === 'prev') { moveActive(-1); renderCells(); return; }
    if (key === 'next') { moveActive(1); renderCells(); return; }

    if (key === 'clear') {   // 全消去：未正解のマスをすべて空にする
        TABLE_CELLS.forEach(i => { if (cellState[i] !== 'ok') { cellVals[i] = ''; cellState[i] = ''; } });
        const list = TABLE_CELLS.filter(i => cellState[i] !== 'ok');
        if (list.length) activeIdx = list[0];
        judgeLocked = false;
        renderCells(); updateControlKeysState('playing');
        return;
    }

    const i = activeIdx;
    if (!TABLE_CELLS.includes(i) || cellState[i] === 'ok') return;
    let val = cellVals[i];
    if (key === 'Backspace') {
        val = val.slice(0, -1);
    } else if (key === '-') {
        if (val !== '') return;
        val = '-';
    } else if (key === '×') {
        if (!IS_INV || val !== '') return;
        val = '×';
    } else if (/^[0-9]$/.test(key)) {
        if (val.includes('×') || val.length >= 3) return;
        if (val === '-' && key === '0') return;
        if (val === '0') val = '';
        val = val + key;
    } else {
        return;
    }
    cellVals[i] = val;
    cellState[i] = '';
    judgeLocked = false;
    renderCells();
    updateControlKeysState('playing');
}
function checkTable(q) {
    const empties = TABLE_CELLS.filter(i => cellVals[i] === '');
    if (empties.length > 0) {   // 空きマスがあるときは不正解に数えない
        empties.forEach(i => { cellState[i] = 'ng'; });
        activeIdx = empties[0];
        renderCells();
        setHint(HINT_DATA.tableEmpty);
        return;
    }
    let allOk = true;
    TABLE_CELLS.forEach(i => {
        if (cellVals[i] === q.ys[i]) cellState[i] = 'ok';
        else { cellState[i] = 'ng'; allOk = false; }
    });
    if (allOk) { advanceToPlot(); return; }
    const ngs = TABLE_CELLS.filter(i => cellState[i] === 'ng');
    activeIdx = ngs[0];
    renderCells();
    let hint = HINT_DATA.tableError;
    if (IS_INV && ngs.some(i => TABLE_X[i] === 0)) hint = HINT_DATA.tableZero;
    else if (ngs.some(i => cellVals[i].replace('-', '') === q.ys[i].replace('-', ''))) hint = HINT_DATA.tableSign;
    showStepError(document.getElementById('group-table'));
    judgeLocked = true;
    setHint(hint);
    updateControlKeysState('playing');
}
function advanceToPlot() {
    TABLE_CELLS.forEach(i => { cellState[i] = 'ok'; });
    setTableUI('locked-correct');
    currentStage = 'plot';
    stageProgress = 1;
    judgeLocked = false;
    setGraphActive(true);
    resultMsgEl.textContent = '① 表：正解！';
    resultMsgEl.className = 'result-message correct';
    setHint(HINT_DATA.plotInit);
    renderCells(); updateStageTabs();
    updateControlKeysState('playing');
    startQuestionTimer();
}


/* ==========================================================================
   8. 手順2・3：グラフ（点をとる／線を引く）【固有】
   ========================================================================== */
const toPx = x => GRAPH.center + x * GRAPH.unit;
const toPy = y => GRAPH.center - y * GRAPH.unit;

function buildGraph() {
    const svg = document.getElementById('graph-svg');
    const c = GRAPH.center, u = GRAPH.unit, r = GRAPH.range;
    const lo = c - r * u, hi = c + r * u;
    let s = '';
    for (let i = -r; i <= r; i++) {
        if (i === 0) continue;
        const p = c + i * u;
        s += `<line x1="${p}" y1="${lo}" x2="${p}" y2="${hi}" stroke="#cfd8dc" stroke-width="1"/>`;
        s += `<line x1="${lo}" y1="${p}" x2="${hi}" y2="${p}" stroke="#cfd8dc" stroke-width="1"/>`;
    }
    s += `<line x1="${lo - 14}" y1="${c}" x2="${hi + 14}" y2="${c}" stroke="#333" stroke-width="2"/>`;
    s += `<line x1="${c}" y1="${hi + 14}" x2="${c}" y2="${lo - 14}" stroke="#333" stroke-width="2"/>`;
    s += `<polygon points="${hi + 26},${c} ${hi + 12},${c - 6} ${hi + 12},${c + 6}" fill="#333"/>`;
    s += `<polygon points="${c},${lo - 26} ${c - 6},${lo - 12} ${c + 6},${lo - 12}" fill="#333"/>`;
    s += `<text class="svg-axis-label" x="${hi + 22}" y="${c + 22}">x</text>`;
    s += `<text class="svg-axis-label" x="${c + 12}" y="${lo - 18}">y</text>`;
    s += `<text class="svg-axis-label" x="${c - 8}" y="${c + 17}" text-anchor="end" style="font-style:normal;">O</text>`;
    for (let i = -r; i <= r; i++) {
        if (i === 0) continue;
        s += `<text class="svg-tick-label" x="${c + i * u}" y="${c + 20}" text-anchor="middle">${fmtNum(i)}</text>`;
        s += `<text class="svg-tick-label" x="${c - 7}" y="${c - i * u + 6}" text-anchor="end">${fmtNum(i)}</text>`;
    }
    s += `<g id="layer-strokes"></g><g id="layer-ideal"></g><g id="layer-points"></g>`;
    s += `<circle id="hover-dot" cx="-100" cy="-100" r="${POINT_R + 1}" fill="rgba(255,112,67,0.30)"/>`;
    svg.innerHTML = s;

    svg.addEventListener('click', onGraphClick);
    svg.addEventListener('mousemove', onGraphHover);
    svg.addEventListener('mouseleave', hideHoverDot);
    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', endStroke);
    svg.addEventListener('pointercancel', endStroke);
}
function pointFromEvent(e) {   // 画面上の位置 → グラフの座標（連続値）
    const svg = document.getElementById('graph-svg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: (p.x - GRAPH.center) / GRAPH.unit, y: (GRAPH.center - p.y) / GRAPH.unit };
}
function eventToLattice(e) {
    const p = pointFromEvent(e);
    const x = Math.round(p.x), y = Math.round(p.y);
    if (Math.abs(x) > GRAPH.range || Math.abs(y) > GRAPH.range) return null;
    return { x: x, y: y };
}
const canPlot = () => gameStarted && !isCompleted && currentStage === 'plot' && currentControlState === 'playing';
const canDraw = () => gameStarted && !isCompleted && currentStage === 'draw' && currentControlState === 'playing';

function setGraphActive(active) {
    document.getElementById('graph-frame').classList.toggle('inactive', !active);
    if (!active) hideHoverDot();
}
function hideHoverDot() {
    const h = document.getElementById('hover-dot');
    if (h) { h.setAttribute('cx', -100); h.setAttribute('cy', -100); }
}
function resetGraphState() {
    plotted = []; strokes = []; strokeColor = 'normal'; drawing = false;
    ['layer-strokes', 'layer-ideal', 'layer-points'].forEach(id => {
        const l = document.getElementById(id);
        if (l) l.innerHTML = '';
    });
    const frame = document.getElementById('graph-frame');
    frame.classList.remove('error-shake', 'locked-correct');
    document.getElementById('graph-svg').classList.remove('drawing');
    hideHoverDot();
}
function afterGraphEdit() {
    judgeLocked = false;
    strokeColor = 'normal';
    document.getElementById('graph-frame').classList.remove('error-shake');
    renderPlotted();
    renderStrokes();
    updateControlKeysState('playing');
}

/* --- 手順2：点をとる --- */
function onGraphClick(e) {
    if (!canPlot()) return;
    const pt = eventToLattice(e);
    if (!pt) return;
    const i = plotted.findIndex(p => p.x === pt.x && p.y === pt.y);
    if (i >= 0) plotted.splice(i, 1); else plotted.push(pt);
    afterGraphEdit();
}
function onGraphHover(e) {
    const h = document.getElementById('hover-dot');
    if (!h) return;
    if (!canPlot()) { hideHoverDot(); return; }
    const pt = eventToLattice(e);
    if (!pt) { hideHoverDot(); return; }
    h.setAttribute('cx', toPx(pt.x)); h.setAttribute('cy', toPy(pt.y));
}
function undoPoint() {
    if (!canPlot() || !plotted.length) return;
    plotted.pop();
    afterGraphEdit();
}
function renderPlotted(badSet) {
    const layer = document.getElementById('layer-points');
    if (!layer) return;
    const ok = stageProgress >= 2;
    let s = '';
    plotted.forEach(p => {
        const bad = badSet && badSet.has(keyOf(p));
        const fill = ok ? '#2e7d32' : (bad ? '#d32f2f' : '#ff7043');
        s += `<circle cx="${toPx(p.x)}" cy="${toPy(p.y)}" r="${POINT_R}" fill="${fill}" stroke="#ffffff" stroke-width="2"/>`;
    });
    layer.innerHTML = s;
}
function checkPlot(q) {
    const exp = new Set(q.points.map(keyOf));
    const got = new Set(plotted.map(keyOf));
    const extra = plotted.filter(p => !exp.has(keyOf(p)));
    const missing = q.points.filter(p => !got.has(keyOf(p)));
    if (!extra.length && !missing.length) { advanceToDraw(); return; }
    renderPlotted(new Set(extra.map(keyOf)));
    let hint;
    if (extra.length) {
        if (IS_INV && extra.some(p => p.x === 0)) hint = HINT_DATA.plotZero;
        else if (extra.some(p => exp.has(p.y + ',' + p.x))) hint = HINT_DATA.plotSwap;
        else hint = HINT_DATA.plotExtra;
    } else {
        hint = HINT_DATA.plotMissing(missing.length);
    }
    setHint(hint);
    showStepError(document.getElementById('graph-frame'));
    judgeLocked = true;
    updateControlKeysState('playing');
}
function advanceToDraw() {
    currentStage = 'draw';
    stageProgress = 2;
    judgeLocked = false;
    document.getElementById('graph-frame').classList.remove('error-shake');
    document.getElementById('graph-svg').classList.add('drawing');
    hideHoverDot();
    renderPlotted();
    resultMsgEl.textContent = '② 点：正解！';
    resultMsgEl.className = 'result-message correct';
    setHint(HINT_DATA.drawInit);
    updateStageTabs();
    updateControlKeysState('playing');
    startQuestionTimer();
}

/* --- 手順3：線をなぞる（ドラッグ） --- */
function onPointerDown(e) {
    if (!canDraw()) return;
    e.preventDefault();
    const svg = document.getElementById('graph-svg');
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    strokes.push([pointFromEvent(e)]);
    drawing = true;
    judgeLocked = false;
    strokeColor = 'normal';
    document.getElementById('graph-frame').classList.remove('error-shake');
    renderStrokes();
    updateControlKeysState('playing');
}
function onPointerMove(e) {
    if (!drawing || !canDraw()) return;
    const s = strokes[strokes.length - 1];
    const p = pointFromEvent(e);
    const last = s[s.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 0.04) return;
    s.push(p);
    renderStrokes();
}
function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    try { document.getElementById('graph-svg').releasePointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    updateControlKeysState('playing');
}
function undoStroke() {
    if (!canDraw() || !strokes.length) return;
    strokes.pop();
    afterGraphEdit();
}
function renderStrokes() {
    const layer = document.getElementById('layer-strokes');
    if (!layer) return;
    const col = strokeColor === 'bad' ? '#e53935' : (strokeColor === 'ok' ? '#43a047' : '#1e88e5');
    let s = '';
    strokes.forEach(st => {
        if (st.length === 1) {
            s += `<circle cx="${toPx(st[0].x).toFixed(1)}" cy="${toPy(st[0].y).toFixed(1)}" r="3" fill="${col}" opacity=".5"/>`;
            return;
        }
        const pts = st.map(p => `${toPx(p.x).toFixed(1)},${toPy(p.y).toFixed(1)}`).join(' ');
        s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>`;
    });
    layer.innerHTML = s;
}
function renderIdeal(q) {
    const layer = document.getElementById('layer-ideal');
    if (!layer) return;
    let s = '';
    q.idealPaths.forEach(path => {
        const pts = path.map(p => `${toPx(p.x).toFixed(1)},${toPy(p.y).toFixed(1)}`).join(' ');
        s += `<polyline points="${pts}" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    });
    layer.innerHTML = s;
}

/* --- 判定に使う計算 --- */
function densify(strs) {   // 点と点のあいだを細かく補う（間隔0.1目盛り以下）
    const out = [];
    strs.forEach(s => {
        if (s.length === 1) { out.push(s[0]); return; }
        for (let i = 1; i < s.length; i++) {
            const a = s[i - 1], b = s[i];
            const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 0.1));
            for (let k = (i === 1 ? 0 : 1); k <= n; k++) {
                out.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
            }
        }
    });
    return out;
}
function distToIdeal(p, q) {
    if (!IS_INV) return Math.abs(q.a * p.x - p.y) / Math.sqrt(q.a * q.a + 1);
    let m = 1e9;
    for (const s of q.sample) {
        const d = Math.hypot(s.x - p.x, s.y - p.y);
        if (d < m) m = d;
    }
    return m;
}
function minDistTo(e, pts) {
    let m = 1e9;
    for (const p of pts) {
        const d = Math.hypot(p.x - e.x, p.y - e.y);
        if (d < m) m = d;
    }
    return m;
}
/* --- 線の判定：{ok:true} または {ok:false, key:ヒントの種類} --- */
function judgeDraw(q) {
    const pts = densify(strokes);
    if (!pts.length) return { ok: false, key: 'drawFar' };
    if (IS_INV) {   // 反比例：軸をこえていないか
        let cross = false;
        strokes.forEach(s => {
            const px = s.some(p => p.x > 0.15), nx = s.some(p => p.x < -0.15);
            const py = s.some(p => p.y > 0.15), ny = s.some(p => p.y < -0.15);
            if ((px && nx) || (py && ny)) cross = true;
        });
        if (cross) return { ok: false, key: 'drawCross' };
    }
    let near = 0;
    pts.forEach(p => { if (distToIdeal(p, q) <= DRAW_TOL) near++; });
    if (near / pts.length < ACC_RATIO) return { ok: false, key: 'drawFar' };
    // 端から端まで描けているか（点をつないだだけになっていないか）
    let missingGroup = false, short = false;
    q.endGroups.forEach(g => {
        const reached = g.map(e => minDistTo(e, pts) <= END_TOL);
        if (!reached[0] && !reached[1]) missingGroup = true;
        else if (!(reached[0] && reached[1])) short = true;
    });
    if (IS_INV && missingGroup) return { ok: false, key: 'drawBranch' };
    if (missingGroup || short) return { ok: false, key: 'drawShort' };
    return { ok: true };
}
function checkDraw(q) {
    const r = judgeDraw(q);
    const frame = document.getElementById('graph-frame');
    if (!r.ok) {
        strokeColor = 'bad';
        renderStrokes();
        setHint(HINT_DATA[r.key]);
        showStepError(frame);
        judgeLocked = true;
        updateControlKeysState('playing');
        return;
    }
    isCompleted = true;
    drawing = false;
    clearInterval(questionTimerId);
    document.getElementById('countdown-timer').style.display = 'none';
    stageProgress = 3;
    strokeColor = 'ok';
    renderStrokes();
    renderIdeal(q);
    frame.classList.remove('error-shake');
    frame.classList.add('locked-correct', 'inactive');
    updateStageTabs();

    if (currentQuestionWrongCount === 0) {
        score++;
        correctStreakCount++;
        if (correctStreakCount > maxStreakCount) maxStreakCount = correctStreakCount;
        saveKenteiRecords();
    }
    if (document.activeElement) document.activeElement.blur();

    if (currentQuestionIndex === QUESTION_COUNT - 1) {
        stopTimerClockAndEvaluate();
        resultMsgEl.textContent = `全 ${QUESTION_COUNT} 問中 ${score} 問ノーミス正解！`;
        resultMsgEl.className = "result-message correct";
        progressEl.textContent = (score === QUESTION_COUNT) ? "全問ノーミスパーフェクト！" : "全問終了！";
        setHint(HINT_DATA.allFinished);
        updateControlKeysState('finished'); updateSendButtonState();
    } else {
        resultMsgEl.textContent = '③ 線：正解！';
        resultMsgEl.className = 'result-message correct';
        setHint(HINT_DATA.nextQuestion);
        updateControlKeysState('cleared');
    }
}

/* ==========================================================================
   10. 問題の生成【固有】
   ========================================================================== */
const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};
const coefText = a => (a === 1 ? '' : (a === -1 ? '-' : String(a)));

/* --- 比例 y=ax：x=-2〜2、aは ±1,±2,±3 から5つ --- */
function buildPropQuestion(a) {
    const xs = [-2, -1, 0, 1, 2];
    const xr = Math.min(GRAPH.range, GRAPH.range / Math.abs(a));   // 枠の端（x=±6 または y=±6）
    const eR = { x: xr, y: a * xr }, eL = { x: -xr, y: -a * xr };
    return {
        a: a, xs: xs,
        ys: xs.map(x => String(a * x)),
        points: xs.map(x => ({ x: x, y: a * x })),
        html: `<div class="problem-inner">関数 $y=${coefText(a)}x$ のグラフをかきなさい。</div>`,
        endGroups: [[eL, eR]],
        idealPaths: [[eL, eR]]
    };
}
/* --- 反比例 y=a/x：x=0 は「×」。表のxは枠内（|x|≦6, |y|≦6）に収まる約数の±と0 --- */
function buildInvQuestion(a) {
    const A = Math.abs(a), R = GRAPH.range;
    const ds = [1, 2, 3, 4, 5, 6].filter(d => A % d === 0 && A / d <= R);
    const xs = [...ds.slice().reverse().map(d => -d), 0, ...ds];
    const sign = a > 0 ? 1 : -1;
    const endGroups = [], idealPaths = [], sample = [];
    [1, -1].forEach(sx => {
        const sy = sign * sx;
        endGroups.push([{ x: R * sx, y: a / (R * sx) }, { x: a / (R * sy), y: R * sy }]);
        const path = [];   // 枠内の曲線（x を対数的に刻む）
        const x0 = A / R, N = 120;
        for (let k = 0; k <= N; k++) {
            const x = sx * x0 * Math.pow(R / x0, k / N);
            path.push({ x: x, y: a / x });
        }
        idealPaths.push(path);
        const xmin = A / 7, M = 600;   // 判定用の細かい点列（枠の少し外まで）
        for (let k = 0; k <= M; k++) {
            const x = sx * xmin * Math.pow(7 / xmin, k / M);
            sample.push({ x: x, y: a / x });
        }
    });
    return {
        a: a, xs: xs,
        ys: xs.map(x => (x === 0 ? '×' : String(a / x))),
        points: xs.filter(x => x !== 0).map(x => ({ x: x, y: a / x })),
        html: `<div class="problem-inner">関数 $y=${a < 0 ? '-' : ''}\\dfrac{${A}}{x}$ のグラフをかきなさい。</div>`,
        endGroups: endGroups, idealPaths: idealPaths, sample: sample
    };
}
function generateQuizData() {
    if (!IS_INV) return shuffle([1, -1, 2, -2, 3, -3]).slice(0, QUESTION_COUNT).map(buildPropQuestion);
    const abs = shuffle([3, 4, 5, 6, 12]);
    const signs = shuffle([1, 1, -1, -1, Math.random() < 0.5 ? 1 : -1]);
    return abs.map((v, i) => buildInvQuestion(v * signs[i]));
}


/* ==========================================================================
   11. ヒント【固有】
   ========================================================================== */
const HINTS = {
