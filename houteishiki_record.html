<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方程式シリーズ 記録一覧</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #eceff1;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        padding: 24px 16px 60px;
    }
    h1 {
        text-align: center;
        font-size: 24px;
        color: #333;
        margin-bottom: 24px;
    }
    .kiroku-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
    }
    .kiroku-card {
        background-color: #ffffff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 8px 10px;
        text-align: center;
    }
    .kiroku-card-title {
        font-size: 12px;
        font-weight: bold;
        color: #333;
        margin-bottom: 6px;
        line-height: 1.3;
        min-height: 2.6em;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .kiroku-card-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: #666;
        padding: 2px 0;
    }
    .kiroku-card-row-value {
        font-size: 11px;
        font-weight: bold;
        color: #1a73e8;
    }
    .kiroku-challenge-btn {
        display: inline-block;
        margin-top: 6px;
        padding: 5px 14px;
        font-size: 11px;
        font-weight: bold;
        color: #fff;
        background-color: #1a73e8;
        border: none;
        border-radius: 6px;
        text-decoration: none;
        cursor: pointer;
    }
    .kiroku-challenge-btn:active { transform: scale(0.97); }

    @media (max-width: 480px) {
        .kiroku-cards { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .kiroku-card { padding: 6px 4px; }
        .kiroku-card-title { font-size: 10px; }
        .kiroku-card-row { font-size: 8px; }
        .kiroku-card-row-value { font-size: 9px; }
        .kiroku-challenge-btn { font-size: 9px; padding: 4px 8px; }
    }
</style>
</head>
<body>

    <h1>方程式シリーズ 記録一覧</h1>

    <div class="kiroku-cards" id="kiroku-cards-wrap"></div>

    <script>
        // 各アプリの設定(アプリ名・リンク先・保存キー)
        const APPS = [
            { name: "基本の一次方程式",         url: "132206.html", practiceKey: "houtei_kihon_practice_progress_v1",    kenteiKey: "houtei_kihon_kentei_records_v1" },
            { name: "かっこがある一次方程式",    url: "132307.html", practiceKey: "kakko_ga_aru_practice_progress_v1",    kenteiKey: "kakko_ga_aru_kentei_records_v1" },
            { name: "小数をふくむ一次方程式",    url: "132308.html", practiceKey: "shousu_fukumu_practice_progress_v1",   kenteiKey: "shousu_fukumu_kentei_records_v1" },
            { name: "大きい数をふくむ一次方程式", url: "132309.html", practiceKey: "houtei_ookiisu_practice_progress_v1",  kenteiKey: "houtei_ookiisu_kentei_records_v1" },
            { name: "分数の項が1つ",             url: "132410.html", practiceKey: "bunsu_1kou_practice_progress_v1",      kenteiKey: "bunsu_1kou_kentei_records_v1" },
            { name: "同分母",                   url: "132411.html", practiceKey: "onaji_bunbo_practice_progress_v1",     kenteiKey: "onaji_bunbo_kentei_records_v1" },
            { name: "異分母①",                  url: "132412.html", practiceKey: "ibunbo1_practice_progress_v1",         kenteiKey: "ibunbo1_kentei_records_v1" },
            { name: "異分母②",                  url: "132413.html", practiceKey: "ibunbo2_practice_progress_v1",         kenteiKey: "ibunbo2_kentei_records_v1" },
            { name: "分数式",          url: "132414.html", practiceKey: "bunsushiki_practice_progress_v1",      kenteiKey: "bunsushiki_kentei_records_v1" }
        ];

        function formatMs(ms) {
            const totalMs = Math.max(0, Math.round(ms));
            const min = Math.floor(totalMs / 60000);
            const sec = Math.floor((totalMs % 60000) / 1000);
            const msec = Math.floor((totalMs % 1000) / 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
        }

        function readPracticeSummary(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed) || parsed.length === 0) return null;
                const perfectCount = parsed.filter(s => s === 2).length;
                const mistakeCount = parsed.filter(s => s === 1).length;
                return { perfectCount, mistakeCount };
            } catch (e) {
                return null;
            }
        }

        function readKenteiSummary(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                const bestTimeMs = (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null;
                const maxStreak = (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : null;
                const streak = (typeof parsed.streak === 'number') ? parsed.streak : null;
                if (bestTimeMs === null && maxStreak === null) return null;
                return { bestTimeMs, maxStreak, streak };
            } catch (e) {
                return null;
            }
        }

        function renderCards() {
            const wrap = document.getElementById('kiroku-cards-wrap');
            let html = '';

            APPS.forEach(app => {
                const practice = readPracticeSummary(app.practiceKey);
                const kentei = readKenteiSummary(app.kenteiKey);

                const mondaiText = practice
                    ? `★：${practice.perfectCount}問／☆：${practice.mistakeCount}問`
                    : '--';
                const bestTimeText = (kentei && kentei.bestTimeMs !== null)
                    ? formatMs(kentei.bestTimeMs)
                    : '--:--.-';
                const streakText = kentei
                    ? `最高：${kentei.maxStreak !== null ? kentei.maxStreak : 0}問`
                    : '--';

                html += `
                    <div class="kiroku-card">
                        <div class="kiroku-card-title">${app.name}</div>
                        <div class="kiroku-card-row">
                            <span>問題選択</span>
                            <span class="kiroku-card-row-value">${mondaiText}</span>
                        </div>
                        <div class="kiroku-card-row">
                            <span>検定ベストタイム</span>
                            <span class="kiroku-card-row-value">${bestTimeText}</span>
                        </div>
                        <div class="kiroku-card-row">
                            <span>検定連続正解</span>
                            <span class="kiroku-card-row-value">${streakText}</span>
                        </div>
                        <a class="kiroku-challenge-btn" href="${app.url}">挑戦する</a>
                    </div>`;
            });

            wrap.innerHTML = html;
        }

        renderCards();
    </script>

</body>
</html>
