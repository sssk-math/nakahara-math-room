    /* --- 削除キー（Backspace）の動作（handleDeleteBehavior） --- */
    function handleDeleteBehavior(active) {
        const currentEd = document.getElementById(activeEditorId);
        const isFrac = active.classList.contains('editor-fraction-field');
        if (isFrac) {
            const fracNode = active.closest('.editor-fraction-node');
            const fields = fracNode.querySelectorAll('.editor-fraction-field');
            if (fields[0].value.length === 0 && fields[1].value.length === 0) {
                let prev = fracNode.previousSibling;
                fracNode.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                } else createTextBlock(currentEd, "").focus();
            }
        } else {
            const allNodes = currentEd.querySelectorAll('.editor-text-node, .editor-fraction-node');
            if (allNodes.length > 1) {
                let prev = active.previousSibling;
                active.remove();
                if (prev) {
                    if (prev.classList.contains('editor-fraction-node')) {
                        prev.querySelectorAll('.editor-fraction-field')[1].focus();
                    } else prev.focus();
                }
            }
        }
        
        if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
            currentEd.classList.remove('wide-fraction-mode');
        }
        updateInputWidths();
    }

    /* --- アクションボタン（判定・次へ・送信など）の処理（handleAction） --- */
    function handleAction() {
        if (!gameStarted) {
            startQuizGame();
            return;
        }
        if (isCompleted) {
            if (practiceMode) {
                recordPracticeResult();
                return;
            }
            if (currentControlState === 'finished') {
                manualSendToGoogleForm();
                return;
            }
            nextQuestion();
            return;
        }
        checkAnswer(); 
    }

    /* --- 右ボタンの処理（handleRightBtn） --- */
    function handleRightBtn() {
        if (currentControlState === 'start') {
            goBackFromKentei();
            return;
        }
        if (practiceMode && currentControlState === 'cleared') {
            recordPracticeResult();
            return;
        }
        if (practiceMode && currentControlState === 'playing' && isCurrentStageEmpty()) {
            goBackFromKentei();
            return;
        }
        if (currentControlState === 'finished') {
            goBackFromKentei();
        } else {
            pressKey('clear');
        }
    }

    /* --- 中央ボタンの処理（handleCenterBtn） --- */
    function handleCenterBtn() {
        if (practiceMode && currentControlState === 'cleared') {
            advancePracticeToNext();
            return;
        }
        if (currentControlState === 'finished') {
            restartQuiz();
        } else {
            pressKey('Backspace');
        }
    }

    /* --- コントロールキーの表示状態の更新（updateControlKeysState） --- */
    function updateControlKeysState(state) {
        currentControlState = state;
        actionBtn.className = "key action-btn";
        clearBtn.className = "key clear-btn";
        clearAllBtn.className = "key clear-btn";

        if (state === 'start') {
            actionBtn.textContent = "スタート"; actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.disabled = true;
            clearAllBtn.textContent = "戻る";
            clearAllBtn.className = "key action-btn-back";
            clearAllBtn.disabled = false;
        } else if (state === 'playing') {
            actionBtn.textContent = "判定する";
            actionBtn.className = "key action-btn judge-mode";
            actionBtn.disabled = false;
            clearBtn.textContent = "消す"; clearBtn.className = "key clear-btn"; clearBtn.disabled = false;
            if (isCurrentStageEmpty()) {
                actionBtn.disabled = true;
                clearBtn.disabled = true;
                if (practiceMode) {
                    clearAllBtn.textContent = "戻る";
                    clearAllBtn.className = "key action-btn-back";
                    clearAllBtn.disabled = false;
                } else {
                    clearAllBtn.textContent = "全消去";
                    clearAllBtn.className = "key clear-btn";
                    clearAllBtn.disabled = true;
                }
            } else {
                clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = false;
            }
        } else if (state === 'cleared') {
            if (practiceMode) {
                actionBtn.textContent = "終了"; actionBtn.className = "key clear-btn"; actionBtn.disabled = true;
                clearBtn.textContent = "次へ"; clearBtn.className = "key action-btn judge-mode"; clearBtn.disabled = false;
                clearAllBtn.textContent = "戻る"; clearAllBtn.className = "key action-btn-back"; clearAllBtn.disabled = false;
            } else {
                actionBtn.textContent = "次の問題"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
                clearBtn.textContent = "消す"; clearBtn.disabled = true;
                clearAllBtn.textContent = "全消去"; clearAllBtn.disabled = true;
            }
        } else if (state === 'finished') {
            actionBtn.textContent = "送信"; actionBtn.className = "key action-btn judge-mode"; actionBtn.disabled = false;
            clearBtn.textContent = "もう一回"; clearBtn.className = "key action-btn"; clearBtn.disabled = false;
            clearAllBtn.textContent = "戻る"; clearAllBtn.className = "key action-btn-back"; clearAllBtn.disabled = false;
        }
    }

    /* --- 利き手（左右レイアウト）の切り替え（changeHandedness） --- */
    function changeHandedness(hand) {
        const workspace = document.querySelector('.game-layout');
        const rightBtn = document.getElementById('hand-right-btn');
        const leftBtn = document.getElementById('hand-left-btn');
        if (hand === 'left') {
            workspace.classList.add('left-handed');
            leftBtn.classList.add('active');
            rightBtn.classList.remove('active');
        } else {
            workspace.classList.remove('left-handed');
            rightBtn.classList.add('active');
            leftBtn.classList.remove('active');
        }
    }

    /* --- 入力欄の幅の自動調整（updateInputWidths） --- */
    function updateInputWidths() {
        const ed = document.getElementById(activeEditorId);
        if (!ed) return;
        ed.querySelectorAll('.editor-text-node').forEach(node => {
                let displayStr = node.value || "";
                let w = displayStr.length * 15 + 12;
                if (displayStr === "") w = 150;
                node.style.width = `${Math.max(20, w)}px`;
        });
    }

    /* --- 現在のステージの未入力判定（isCurrentStageEmpty） --- */
function isCurrentStageEmpty() {
    // 「+」だけの入力も「入力あり」として扱う
    // （getUserAnswerBySide は先頭の+を除去するため、ここでは使わない）
    const hasInput = (stage, side) => {
        const ed = document.getElementById(`math-editor-${stage}-${side}`);
        if (!ed) return false;
        return Array.from(ed.querySelectorAll('.editor-text-node, .editor-fraction-field'))
            .some(el => el.value.replace(/\s+/g, '') !== '');
    };
    if (isRightOnlyStage(currentStage)) {
        return !hasInput(currentStage, 'right');
    }
    return !hasInput(currentStage, 'left') && !hasInput(currentStage, 'right');
}

    /* --- ステージの不正解時の処理（showStepError） --- */
    function showStepError(groupEl) {
        currentQuestionWrongCount++;
        if (!practiceMode && correctStreakCount !== 0) {
            correctStreakCount = 0;
            saveKenteiRecords();
        }
        startQuestionTimer();
        if (groupEl) {
            groupEl.classList.remove('error-shake');
            void groupEl.offsetWidth;
            groupEl.classList.add('error-shake');
        }
    }


    /* ==========================================================================
       8. ステージ依存の関数【共通（ACTIVE_STAGES で動作）】
       ========================================================================== */

    /* --- ステージ一覧のヘルパー（STAGE_ORDER / ACTIVE_STAGES から ID・次のステージ・ヒントのキーを返す） --- */
    function stageGroupId(stage)     { return `group-${stage}`; }
    function stageBadgeId(stage)     { return `badge-${stage}`; }
    function isRightOnlyStage(stage) { return stage === 'answer'; }   // 右辺だけ入力するステージ
    function stageEditorIds(stage) {
        return isRightOnlyStage(stage)
            ? [`math-editor-${stage}-right`]
            : [`math-editor-${stage}-left`, `math-editor-${stage}-right`];
    }
    function stageFirstEditorId(stage) { return stageEditorIds(stage)[0]; }
    function stageOfEditorId(editorId) {
        return ACTIVE_STAGES.find(s => editorId.includes(s)) || ACTIVE_STAGES[0];
    }
    function nextStage(stage) {
        const i = ACTIVE_STAGES.indexOf(stage);
        return (i >= 0 && i < ACTIVE_STAGES.length - 1) ? ACTIVE_STAGES[i + 1] : null;
    }
    function stageCamel(stage) {   // 'clear-denom' → 'clearDenom'
        return stage.replace(/-([a-z])/g, (m, c) => c.toUpperCase());
    }
    function stageHintKey(stage, suffix) {   // ('clear-denom', 'Init') → 'clearDenomInit'
        return stageCamel(stage) + suffix;
    }
    function stageTimeoutHintKey(stage) {    // 'clear-denom' → 'timeoutClearDenom'
        const c = stageCamel(stage);
        return 'timeout' + c.charAt(0).toUpperCase() + c.slice(1);
    }
    function hideInactiveStages() {          // 使わないステージの入力枠を非表示にする
        STAGE_ORDER.forEach(s => {
            if (!ACTIVE_STAGES.includes(s)) {
                const el = document.getElementById(stageGroupId(s));
                if (el) el.style.display = 'none';
            }
        });
    }

    /* --- 正解後に次のステージへ進む共通の遷移処理（advanceStage） --- */
    function advanceStage(fromStage, restartTimer = true) {
        const next = nextStage(fromStage);
        document.getElementById(stageGroupId(fromStage)).className = "input-box-group locked-correct";
        document.getElementById(stageBadgeId(fromStage)).textContent = "正解！";
        if (!next) return;
        currentStage = next;
        activeEditorId = stageFirstEditorId(next);
        document.getElementById(stageGroupId(next)).className = "input-box-group active-focus";
        document.getElementById(stageBadgeId(next)).textContent = "入力中";
        document.getElementById('hint-text').innerHTML = HINT_DATA[stageHintKey(next, 'Init')];
        updateMathJax([document.getElementById('hint-text')]);
        focusDefaultNode(); refreshMathJaxPreview();
        updateControlKeysState('playing');
        if (restartTimer) startQuestionTimer();   // 正解時：タイマーをリセットして再開
    }

    /* --- キー入力の処理（pressKey） --- */
    function pressKey(key) {
            if (!gameStarted || isCompleted) return;

            if (key === '=') {
                if (activeEditorId.endsWith('-left')) {
                    activeEditorId = activeEditorId.replace('-left', '-right');
                } else if (activeEditorId.endsWith('-right') && !activeEditorId.includes('answer')) {
                    activeEditorId = activeEditorId.replace('-right', '-left');
                }
                focusDefaultNode(activeEditorId);
                return;
            }

            const currentEd = document.getElementById(activeEditorId);
            if (!currentEd) return;
            let active = document.activeElement;

            if (!active || !currentEd.contains(active) || (!active.classList.contains('editor-text-node') && !active.classList.contains('editor-fraction-field'))) {
                const inputs = currentEd.querySelectorAll('input');
                active = inputs[inputs.length - 1];
                if (active) active.focus();
            }

            if (!active) return;
            
            let targetGroup = null;
            targetGroup = document.getElementById(stageGroupId(stageOfEditorId(activeEditorId)));

            if (targetGroup && targetGroup.classList.contains('error-shake')) {
                targetGroup.classList.remove('error-shake');
                targetGroup.classList.add('active-focus');
            }
            
            if (key === 'clear') {
                currentEd.innerHTML = ''; 
                createTextBlock(currentEd, "").focus();
                currentEd.classList.remove('wide-fraction-mode');
                updateInputWidths();
                syncClearDenom();
                refreshMathJaxPreview(); 
                updateControlKeysState(currentControlState);
                return;
            }
            
            if (key === 'Backspace') {
                const isFrac = active.classList.contains('editor-fraction-field');
                
                if (isFrac) {
                    const fracNode = active.closest('.editor-fraction-node');
                    const fields = fracNode.querySelectorAll('.editor-fraction-field');
                    
                    if (fields[0].value.length === 0 && fields[1].value.length === 0) {
                        let prev = fracNode.previousSibling;
                        fracNode.remove();
                        
                        if (prev) {
                            if (prev.classList.contains('editor-fraction-node')) {
                                prev.querySelectorAll('.editor-fraction-field')[1].focus();
                            } else {
                                prev.focus();
                            }
                        } else {
                            createTextBlock(currentEd, "").focus();
                        }
                        
                        if (currentEd.querySelectorAll('.editor-fraction-node').length === 0) {
                            currentEd.classList.remove('wide-fraction-mode');
                        }
                    } else {
                        if (active.value.length > 0) {
                            const start = active.selectionStart;
                            const end = active.selectionEnd;
                            const val = active.value;
                            if (start !== end) {
                                active.value = val.substring(0, start) + val.substring(end);
                                active.selectionStart = active.selectionEnd = start;
                            } else if (start > 0) {
                                active.value = val.substring(0, start - 1) + val.substring(start);
                                active.selectionStart = active.selectionEnd = start - 1;
                            }
                        }
                    }
                } else {
                    if (active.value.length > 0) {
                        active.value = active.value.slice(0, -1);
                    } else {
                        const allNodes = currentEd.querySelectorAll('.editor-text-node, .editor-fraction-node');
                        if (allNodes.length > 1) {
                            let prev = active.previousSibling;
                            active.remove();
                            if (prev) {
                                if (prev.classList.contains('editor-fraction-node')) {
                                    prev.querySelectorAll('.editor-fraction-field')[1].focus();
                                } else {
                                    prev.focus();
                                }
                            }
                        }
                    }
                }
                updateInputWidths();
                if (document.activeElement) document.activeElement.focus();
                syncClearDenom();
                refreshMathJaxPreview();
                updateControlKeysState(currentControlState);
                return;
            }

            if (active.classList.contains('editor-fraction-field')) {
                if (!/^[0-9]$/.test(key)) {
                    const fracNode = active.closest('.editor-fraction-node');
                    if (fracNode && fracNode.nextSibling) {
                        active = fracNode.nextSibling;
                        active.focus();
                    }
                }
            }

            const start = active.selectionStart;
            const end = active.selectionEnd;
            const val = active.value;
            active.value = val.substring(0, start) + key + val.substring(end);
            active.selectionStart = active.selectionEnd = start + key.length;

            updateInputWidths();
            active.focus();
            syncClearDenom();
            refreshMathJaxPreview();
            updateControlKeysState(currentControlState);
        }

    /* --- 分母入力から分数への変換（convertDenominatorToFraction） --- */
        function convertDenominatorToFraction() {
            if (!gameStarted || isCompleted) return;
            const currentEd = document.getElementById(activeEditorId);
            if (!currentEd) return;
            
            let active = document.activeElement;
            if (!active || !currentEd.contains(active)) {
                const inputs = currentEd.querySelectorAll('input');
                active = inputs[inputs.length - 1];
            }
            if (!active || active.classList.contains('editor-fraction-field')) return;

            currentEd.classList.add('wide-fraction-mode');

            const fracNode = document.createElement('div');
            fracNode.className = 'editor-fraction-node';

            const topField = document.createElement('input');
            topField.type = 'text';
            topField.className = 'editor-fraction-field frac-top';
            topField.readOnly = true;
            topField.addEventListener('keydown', (e) => e.preventDefault());

            const line = document.createElement('div');
            line.className = 'editor-fraction-line';

            const bottomField = document.createElement('input');
            bottomField.type = 'text';
            bottomField.className = 'editor-fraction-field frac-bottom';
            bottomField.readOnly = true;
            bottomField.addEventListener('keydown', (e) => e.preventDefault());

            fracNode.appendChild(topField);
            fracNode.appendChild(line);
            fracNode.appendChild(bottomField);

            if (active.classList.contains('editor-text-node')) {
                let val = active.value;
                let match = val.match(/[0-9a-zA-Z]+$/);
                
                if (match && match.index > 0) {
                    let preStr = val.substring(0, match.index);
                    const preNode = document.createElement('input');
                    preNode.type = 'text';
                    preNode.className = 'editor-text-node';
                    preNode.value = preStr;
                    preNode.readOnly = true;
                    preNode.addEventListener('keydown', (e) => e.preventDefault());
                    currentEd.insertBefore(preNode, active);
                    
                    bottomField.value = match[0];
                } else if (match && match.index === 0) {
                    bottomField.value = match[0];
                } else {
                    bottomField.value = val;
                }
                
                active.value = "";
                currentEd.insertBefore(fracNode, active);
                topField.focus(); 
            } else {
                currentEd.appendChild(fracNode);
                topField.focus();
            }

            updateInputWidths();
            syncClearDenom();
            refreshMathJaxPreview();
            updateControlKeysState(currentControlState);
        }

    /* --- 「分母をはらう」ステージの左右の入力欄の同期（syncClearDenom） --- */
        function syncClearDenom() {
        if (!activeEditorId.includes('clear-denom')) return;
        const sourceEd = document.getElementById(activeEditorId);
        const targetId = activeEditorId.endsWith('-left')
            ? 'math-editor-clear-denom-right'
            : 'math-editor-clear-denom-left';
        const targetEd = document.getElementById(targetId);
        if (!sourceEd || !targetEd) return;

        targetEd.innerHTML = '';
        targetEd.className = sourceEd.className;
        
        sourceEd.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('editor-text-node')) {
                // 新しいノードとして正しく再作成する
                createTextBlock(targetEd, node.value);
            } else if (node.classList && node.classList.contains('editor-fraction-node')) {
                const fracNode = node.cloneNode(true);
                // クローンした input に対しても keydown 無効化イベントを再付与
                fracNode.querySelectorAll('input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => e.preventDefault());
                });
                targetEd.appendChild(fracNode);
            }
        });
        
        // コピー先側の入力幅も再計算する
        const currentActive = activeEditorId;
        activeEditorId = targetId;
        updateInputWidths();
        activeEditorId = currentActive;
    }

    /* --- 入力欄のテキストブロックの作成（createTextBlock） --- */
    function createTextBlock(containerEl, initialValue = "") {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'editor-text-node';
        input.value = initialValue;
        input.autocomplete = 'off';
        input.inputMode = 'none'; 
        input.readOnly = true;
            
        input.addEventListener('keydown', (e) => e.preventDefault());
        containerEl.appendChild(input);
        return input;
    }

    /* --- 入力欄の初期フォーカス（focusDefaultNode） --- */
    function focusDefaultNode(editorId = activeEditorId) {
        if (!gameStarted || isCompleted) return;
        const targetGroupId = stageGroupId(stageOfEditorId(editorId));
        const targetGroup = document.getElementById(targetGroupId);
        if (targetGroup && targetGroup.classList.contains('locked-disabled')) return;
        activeEditorId = editorId;
        STAGE_ORDER.forEach(s => {
            const el = document.getElementById(stageGroupId(s));
            if (el) el.classList.remove('active-focus');
        });
        if (targetGroup) targetGroup.classList.add('active-focus');
        const ed = document.getElementById(editorId);
        if (ed) {
            const input = ed.querySelector('.editor-text-node') || ed.querySelector('input');
            if (input) input.focus();
        }
        refreshMathJaxPreview();
    }

    /* --- 開始画面の表示（showStartLayout） --- */
    function showStartLayout() {
        window.isAlreadySubmitted = false;
        const sendBtnTop = document.getElementById('send-btn');
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信";
            sendBtnTop.disabled = true;
        }
        if (numberField) numberField.disabled = false;

        gameStarted = false;
        isCompleted = false;
        progressEl.textContent = "スタートボタンを押してください";
        formulaBox.innerHTML = practiceMode
            ? `<span style="color:#aaa; font-size:24px;">【スタート】を押して挑戦しよう</span>`
            : `<span style="color:#aaa; font-size:24px;">生徒番号を入力→【スタート】</span>`;
        document.getElementById('hint-text').innerHTML = HINT_DATA.start;

        ACTIVE_STAGES.forEach(s => {
            document.getElementById(stageBadgeId(s)).textContent = "ロック中";
            document.getElementById(stageGroupId(s)).className = "input-box-group locked-disabled";
        });
        STAGE_ORDER.forEach(s => stageEditorIds(s).forEach(id => {
            const ed = document.getElementById(id);
            if (ed) {
                ed.innerHTML = '';
                ed.classList.remove('wide-fraction-mode');
                createTextBlock(ed, "");
                updateInputWidths();
            }
        }));
        updateControlKeysState('start');
        resultMsgEl.textContent = "";
        refreshMathJaxPreview();
    }

    /* --- ゲームの開始（startQuizGame） --- */
    function startQuizGame() {
        window.isAlreadySubmitted = false; 
        gameStarted = true;
        score = 0;
        currentQuestionIndex = 0;
        startTimerClock();       
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');

        loadQuestion(); 
        if (actionBtn) actionBtn.className = "key action-btn judge-mode"; 
    }

    /* --- 問題の読み込みと表示（loadQuestion） --- */
    function loadQuestion() {
        isCompleted = false;
        currentQuestionWrongCount = 0;
        resultMsgEl.textContent = "";
        resultMsgEl.className = "result-message";

        currentStage = ACTIVE_STAGES[0];
        activeEditorId = stageFirstEditorId(ACTIVE_STAGES[0]);
        ACTIVE_STAGES.forEach((s, i) => {
            document.getElementById(stageBadgeId(s)).textContent = (i === 0) ? "入力中" : "ロック中";
            document.getElementById(stageGroupId(s)).className = (i === 0) ? "input-box-group active-focus" : "input-box-group locked-disabled";
        });
        STAGE_ORDER.forEach(s => stageEditorIds(s).forEach(id => {
            const ed = document.getElementById(id);
            if (ed) { ed.innerHTML = ''; createTextBlock(ed, ""); }
        }));
        updateControlKeysState('playing');

        const q = quizData[currentQuestionIndex];
        progressEl.textContent = practiceMode
            ? `${GROUP_INFO[practiceCurrentGroup].mark} ${GROUP_INFO[practiceCurrentGroup].desc}`
            : `第 ${currentQuestionIndex + 1} 問 / 全 ${QUESTION_COUNT} 問`;
        
        formulaBox.innerHTML = `
            <div class="equation-grid">
                <div class="eq-left">$${q.leftPart.replace(/\\d?frac/g, '\\dfrac')}$</div>
                <div class="eq-equal">$=$</div>
                <div class="eq-right">$${q.rightPart.replace(/\\d?frac/g, '\\dfrac')}$</div>
            </div>`;
        updateMathJax([formulaBox]);

        document.getElementById('hint-text').innerHTML = HINT_DATA[stageHintKey(ACTIVE_STAGES[0], 'Init')];
        updateMathJax([document.getElementById('hint-text')]);

        setTimeout(() => { focusDefaultNode(); refreshMathJaxPreview(); }, 50);
        startQuestionTimer();
    }

    /* --- 次の問題への移動（nextQuestion） --- */
    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); }
    }

    /* --- もう一回（再スタート）（restartQuiz） --- */
    function restartQuiz() {
        quizData = generateQuizData(); 
        showStartLayout(); 
    }

    /* --- 1問ごとの時間切れ処理（handleQuestionTimeout） --- */
    function handleQuestionTimeout() {
            clearInterval(questionTimerId);
            
            // 【修正1】現在の問題データ q を取得
            const q = quizData[currentQuestionIndex];
            if (!q) return;

            // 【修正2】現在のステージの入力枠グループを取得
            const targetGroup = document.getElementById('group-' + currentStage);
            const hintBody = document.getElementById('hint-text');

            // ステージごとのタイムアウト時ヒントを表示
            hintBody.innerHTML = HINT_DATA[stageTimeoutHintKey(currentStage)];

            // エラーアニメーションを実行してタイマー再開
            showStepError(targetGroup);
            startQuestionTimer();
        }


    /* ==========================================================================
       9. 判定・作図ロジック【固有】
       ========================================================================== */

    /* --- 作図エリアの大きさと、作図の状態（CW, CH, drawn など） --- */
    const CW = 590;
    const CH = 310;
    let drawn = [];          // 描いた作図（円・直線）の一覧
    let drag = null;         // ドラッグ中の状態
    let tool = null;         // 選択中の道具（null / 'compass' / 'ruler'）
    let needle = null;       // コンパスの針の位置（置いていないときは null）
    let compassFixed = false; // コンパス（固定）：直前の弧と同じ半径にするか

    /* --- 幾何の道具（V, dist, unit, offL, dot, side, eq） --- */
    function V(x, y) {
        return { x: x, y: y };
    }

    function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function unit(a, b) {
        const len = dist(a, b) || 1;
        return V((b.x - a.x) / len, (b.y - a.y) / len);
    }

    /* 点pから「点aを通り向きuの直線」までの距離 */
    function offL(p, a, u) {
        return Math.abs((p.x - a.x) * u.y - (p.y - a.y) * u.x);
    }

    function dot(u, v) {
        return u.x * v.x + u.y * v.y;
    }

    /* 点aを通り向きuの直線上での、点pの位置（符号つき） */
    function side(p, a, u) {
        return (p.x - a.x) * u.x + (p.y - a.y) * u.y;
    }

    function eq(x, y, tol = 6) {
        return Math.abs(x - y) <= tol;
    }

    /* --- 1手ごとの正誤判定（pred）：問題ごとの手順（q.steps）を使う --- */
    function pred(q, k, op, M) {
        return q.steps[k].pred(op, M);
    }

    /* --- 検定：描いた図が何手目まで正しいか（solve） --- */
    function solve(q, k, used, M) {
        if (k >= q.n) return k;
        let best = k;
        for (let i = 0; i < drawn.length && best < q.n; i++) {
            if (used.includes(i) || !pred(q, k, drawn[i], M)) continue;
            const reached = solve(q, k + 1, used.concat(i), M.concat([drawn[i]]));
            best = Math.max(best, reached);
        }
        return best;
    }

    /* --- シード付き乱数（mulberry） --- */
    function mulberry(a) {
        return function () {
            a |= 0;
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    /* --- 小さな道具（RAD, rr, oneOf, polar, segCross） --- */
    const RAD = Math.PI / 180;

    /* lo〜hi の乱数 */
    function rr(rnd, lo, hi) {
        return lo + (hi - lo) * rnd();
    }

    /* 配列からひとつ選ぶ */
    function oneOf(arr, rnd) {
        return arr[Math.floor(rnd() * arr.length)];
    }

    /* 点pから、角度ang・長さlen だけ進んだ点 */
    function polar(p, ang, len) {
        return V(p.x + len * Math.cos(ang), p.y + len * Math.sin(ang));
    }

    /* 線分abと線分cdが交わっているか */
    function segCross(a, b, c, d) {
        const r = V(b.x - a.x, b.y - a.y);
        const t = V(d.x - c.x, d.y - c.y);
        const den = r.x * t.y - r.y * t.x;
        if (Math.abs(den) < 1e-9) return false;
        const s = ((c.x - a.x) * t.y - (c.y - a.y) * t.x) / den;
        const u = ((c.x - a.x) * r.y - (c.y - a.y) * r.x) / den;
        return s >= 0 && s <= 1 && u >= 0 && u <= 1;
    }

    /* --- 手順の部品：垂直二等分線（3手）。base ＝ 全体の何手目から始まるか --- */
    function stepsPerpBisector(P, Q, nP, nQ, base) {
        const L = dist(P, Q);
        const mid = V((P.x + Q.x) / 2, (P.y + Q.y) / 2);
        const u = unit(P, Q);
        return [
            {
                hint: '点' + nP + 'を中心に、' + nP + nQ + 'の半分より大きい半径の弧をかこう。',
                pred: (op) => op.t === 'c' && dist(op.p, P) < 8 && op.r > L / 2 + 5
            },
            {
                hint: '点' + nQ + 'を中心に、さっきと同じ半径の弧をかこう。2つの弧が交わるようにね。',
                sameR: true,
                pred: (op, M) => op.t === 'c' && dist(op.p, Q) < 8 && eq(op.r, M[base].r) && arcCrossCount(M[base], op) >= 2
            },
            {
                hint: '2つの弧の交点を2つとも通る直線を引こう。',
                pred: (op) => {
                    if (op.t !== 'l') return false;
                    const d = unit(op.a, op.b);
                    return Math.abs(dot(d, u)) < 0.04 && offL(mid, op.a, d) < 6;
                }
            }
        ];
    }

    /* --- 手順の部品：角の二等分線（4手）。rays：O→u1、O→u2 の2本の半直線、ub：二等分線の向き --- */
    function stepsAngleBisector(O, u1, u2, ub, w, rl, base, n1, n2) {
        const arcStep = (u, k) => (op, M) => {
            if (op.t !== 'c') return false;
            const onRay = offL(op.p, O, u) < 6 && side(op.p, O, u) > 0;
            const sameDist = eq(dist(op.p, O), M[base].r);
            const bigEnough = op.r > M[base].r * Math.sin(w / 2) + 5;
            const sameRadius = (k === 1) || eq(op.r, M[base + 1].r);
            const crossOk = (k === 1) || arcCrossCount(M[base + 1], op) >= 1;
            const diffFromFirst = !eq(op.r, M[base].r);
            return onRay && sameDist && bigEnough && sameRadius && diffFromFirst && crossOk;
        };
        return [
            {
                hint: '頂点Oを中心に弧をかいて、' + n1 + 'と' + n2 + 'に交わらせよう。',
                pred: (op) => op.t === 'c' && dist(op.p, O) < 8 && op.r > 15 && op.r < rl - 8
            },
            {
                hint: n1 + 'との交点を中心に弧をかこう。半径は2つの交点の距離の半分より大きく、1手目の弧とは違う半径にしてね。',
                pred: arcStep(u1, 1)
            },
            {
                hint: n2 + 'との交点を中心に、同じ半径の弧をかこう。',
                sameR: true,
                pred: arcStep(u2, 2)
            },
            {
                hint: '点Oと、2つの弧の交点を通る直線を引こう。',
                pred: (op) => {
                    if (op.t !== 'l') return false;
                    const d = unit(op.a, op.b);
                    return offL(O, op.a, d) < 6 && Math.abs(d.x * ub.y - d.y * ub.x) < 0.04;
                }
            }
        ];
    }

    /* --- 手順の部品：垂線（4手）。kind：'on' ＝ 直線上の点P、'off' ＝ 直線上にない点P --- */
    function stepsPerp(P, F, u, d, kind, base, nP, nL) {
        const arcStep = (k) => (op, M) => {
            if (op.t !== 'c') return false;
            const r0 = M[base].r;
            if (!(offL(op.p, F, u) < 6 && eq(dist(op.p, P), r0))) return false;
            const need = (kind === 'on')
                ? r0 + 5
                : Math.sqrt(Math.max(0, r0 * r0 - d * d)) + 5;
            if (op.r <= need) return false;
            if (k === 1) return true;
            return eq(op.r, M[base + 1].r) && dist(op.p, M[base + 1].p) > 10 && arcCrossCount(M[base + 1], op) >= 1;
        };
        return [
            {
                hint: (kind === 'on')
                    ? '点' + nP + 'を中心に弧をかいて、' + nL + 'と2点で交わらせよう。'
                    : '点' + nP + 'を中心に、' + nL + 'と2点で交わる大きさの弧をかこう。',
                pred: (op) => op.t === 'c' && dist(op.p, P) < 8 && ((kind === 'on') ? (op.r > 25 && op.r < 160) : (op.r > d + 8))
            },
            {
                hint: nL + '上の交点の1つを中心に、' + ((kind === 'on') ? 'さっきより大きい' : '2つの交点の距離の半分より大きい') + '半径の弧をかこう。',
                pred: arcStep(1)
            },
            {
                hint: 'もう1つの交点を中心に、同じ半径の弧をかこう。',
                sameR: true,
                pred: arcStep(2)
            },
            {
                hint: '点' + nP + 'と、2つの弧の交点を通る直線を引こう。',
                pred: (op) => {
                    if (op.t !== 'l') return false;
                    const dd = unit(op.a, op.b);
                    return offL(P, op.a, dd) < 6 && Math.abs(dot(dd, u)) < 0.04;
                }
            }
        ];
    }

    /* --- 手順の部品：答えの点をとる（1手） --- */
    function stepMark(target, hint) {
        return {
            hint: hint,
            pred: (op) => op.t === 'p' && dist(op.p, target) < 8
        };
    }

    /* --- 角の図（OYは水平・右向き、OXは上向きに角wだけ開く）の共通部分 --- */
    function makeAngleBase(rnd, wLo, wHi) {
        const O = V(rr(rnd, 60, 150), rr(rnd, 250, 280));
        const w = rr(rnd, wLo, wHi) * RAD;
        const rl = 215;
        return {
            O: O, w: w, rl: rl,
            u1: V(Math.cos(-w), Math.sin(-w)),
            u2: V(1, 0),
            ub: V(Math.cos(-w / 2), Math.sin(-w / 2)),
            X: polar(O, -w, rl),
            Y: polar(O, 0, rl)
        };
    }

    /* --- 問題の種類（グループごと） --- */
    const PROBLEM_TYPES = {
        A: ['A-point', 'A-fold'],
        B: ['B-point', 'B-fold', 'B-quarter'],
        C: ['C-dist', 'C-height', 'C-perp']
    };

    /* --- 問題の種類ごとの生成。条件に合わない図になったら null を返す（やり直し） --- */
    const PROBLEM_BUILDERS = {

        /* ① 2点から等距離の点（直線ℓは水平） */
        'A-point': function (rnd) {
            const yl = rr(rnd, 225, 262);
            const A = V(rr(rnd, 60, 260), rr(rnd, 85, 155));
            const t = rr(rnd, -45, 45) * RAD;
            const B = polar(A, t, rr(rnd, 120, 220));
            const mid = V((A.x + B.x) / 2, (A.y + B.y) / 2);
            const n = V(-Math.sin(t), Math.cos(t));
            const s = (yl - mid.y) / n.y;
            const X = V(mid.x + n.x * s, yl);
            if (B.y < 70 || B.y > 170 || X.x < 60 || X.x > 530) return null;
            return {
                g: 'A', type: 'A-point',
                text: oneOf([
                    'AとBから等しい距離にある、ℓ上の点Pを作図しなさい。',
                    '線分ABを底辺とする二等辺三角形ABPの頂点Pを、ℓ上に作図しなさい。',
                    '2つの駅A、Bから等しい距離にある、道路ℓ上の点Pを作図しなさい。'
                ], rnd),
                pts: [A, B],
                segs: [[V(-1000, yl), V(CW + 1000, yl)]],
                labels: [[A, 'A', -18, -8], [B, 'B', 8, -8], [V(20, yl), 'ℓ', 0, -12]],
                steps: stepsPerpBisector(A, B, 'A', 'B', 0)
                    .concat([stepMark(X, '垂直二等分線とℓの交点をタップして、点Pをとろう。')]),
                target: X, ansLabel: 'P'
            };
        },

        /* ① 折り紙の折り目（点Aを点Bに重ねる） */
        'A-fold': function (rnd) {
            let A = V(rr(rnd, 70, 220), rr(rnd, 60, 250));
            let B = polar(A, rr(rnd, -60, 60) * RAD, rr(rnd, 200, 330));
            if (B.x > 540 || B.y < 40 || B.y > 270) return null;
            if (rnd() < 0.5) { const tmp = A; A = B; B = tmp; }
            const e = [V(15, 15), V(575, 15), V(575, 295), V(15, 295)];
            return {
                g: 'A', type: 'A-fold',
                text: '点Aが点Bに重なるように折る。折り目を作図しなさい。',
                pts: [A, B],
                segs: [[e[0], e[1]], [e[1], e[2]], [e[2], e[3]], [e[3], e[0]]],
                labels: [[A, 'A', -18, -8], [B, 'B', 8, -8]],
                steps: stepsPerpBisector(A, B, 'A', 'B', 0)
            };
        },

        /* ② 2辺から等距離の点（線分AB上） */
        'B-point': function (rnd) {
            const a = makeAngleBase(rnd, 50, 100);
            const T = polar(a.O, -a.w / 2, rr(rnd, 120, 185));
            const dirAng = -a.w / 2 + oneOf([-1, 1], rnd) * rr(rnd, 55, 125) * RAD;
            const half = rr(rnd, 45, 70);
            const A = polar(T, dirAng + Math.PI, half);
            const B = polar(T, dirAng, half);
            if (segCross(A, B, a.O, a.X) || segCross(A, B, a.O, a.Y)) return null;
            return {
                g: 'B', type: 'B-point',
                text: oneOf([
                    '∠XOYの2辺から等しい距離にある、AB上の点Pを作図しなさい。',
                    '2本の道OX、OYから等しい距離にある、AB上の点Pを作図しなさい。'
                ], rnd),
                pts: [a.O, a.X, a.Y, A, B],
                segs: [[a.O, a.X], [a.O, a.Y], [A, B]],
                labels: [[a.O, 'O', -18, 14], [a.X, 'X', 6, -6], [a.Y, 'Y', 6, 14], [A, 'A', 8, -8], [B, 'B', 8, -8]],
                steps: stepsAngleBisector(a.O, a.u1, a.u2, a.ub, a.w, a.rl, 0, '辺OX', '辺OY')
                    .concat([stepMark(T, '二等分線と線分ABの交点をタップして、点Pをとろう。')]),
                target: T, ansLabel: 'P'
            };
        },

        /* ② 折り紙の折り目（辺OXを辺OYに重ねる） */
        'B-fold': function (rnd) {
            const a = makeAngleBase(rnd, 40, 100);
            return {
                g: 'B', type: 'B-fold',
                text: '辺OXが辺OYに重なるように折る。折り目を作図しなさい。',
                pts: [a.O, a.X, a.Y],
                segs: [[a.O, a.X], [a.O, a.Y]],
                labels: [[a.O, 'O', -18, 14], [a.X, 'X', 6, -6], [a.Y, 'Y', 6, 14]],
                steps: stepsAngleBisector(a.O, a.u1, a.u2, a.ub, a.w, a.rl, 0, '辺OX', '辺OY')
            };
        },

        /* ② 角の4等分（二等分線をもう一度二等分する） */
        'B-quarter': function (rnd) {
            const a = makeAngleBase(rnd, 64, 100);
            const ub2 = V(Math.cos(-a.w * 3 / 4), Math.sin(-a.w * 3 / 4));
            return {
                g: 'B', type: 'B-quarter',
                text: '∠XOYの4分の1の角∠XOZをつくる直線OZを作図しなさい。',
                pts: [a.O, a.X, a.Y],
                segs: [[a.O, a.X], [a.O, a.Y]],
                labels: [[a.O, 'O', -18, 14], [a.X, 'X', 6, -6], [a.Y, 'Y', 6, 14]],
                steps: stepsAngleBisector(a.O, a.u1, a.u2, a.ub, a.w, a.rl, 0, '辺OX', '辺OY')
                    .concat(stepsAngleBisector(a.O, a.u1, a.ub, ub2, a.w / 2, a.rl, 4, '辺OX', '1本目の二等分線'))
            };
        },

        /* ③ 点と直線の距離（垂線の足Hに点をとる） */
        'C-dist': function (rnd) {
            const t = rr(rnd, -15, 15) * RAD;
            const u = V(Math.cos(t), Math.sin(t));
            const nv = V(u.y, -u.x);
            const F = V(rr(rnd, 210, 380), rr(rnd, 150, 190));
            const d = rr(rnd, 75, 105) * (rnd() < 0.5 ? 1 : -1);
            const P = V(F.x + nv.x * d, F.y + nv.y * d);
            const E = [V(F.x - 1000 * u.x, F.y - 1000 * u.y), V(F.x + 1000 * u.x, F.y + 1000 * u.y)];
            const labL = V(F.x - 170 * u.x, F.y - 170 * u.y);
            return {
                g: 'C', type: 'C-dist',
                text: oneOf([
                    '点Pから直線ℓに垂線PHを引き、Hに点をとりなさい。',
                    '点Pと直線ℓの距離を表す線分PHの、点Hを作図しなさい。'
                ], rnd),
                pts: [P],
                segs: [E],
                labels: [[P, 'P', 8, -8], [labL, 'ℓ', 0, -14]],
                steps: stepsPerp(P, F, u, Math.abs(d), 'off', 0, 'P', 'ℓ')
                    .concat([stepMark(F, '垂線とℓの交点をタップして、点Hをとろう。')]),
                target: F, ansLabel: 'H'
            };
        },

        /* ③ 三角形の高さ（辺BCは水平。頂点Aから垂線AHを引く） */
        'C-height': function (rnd) {
            const yb = rr(rnd, 235, 268);
            const B = V(rr(rnd, 70, 150), yb);
            const C = V(B.x + rr(rnd, 280, 380), yb);
            if (C.x > 560) return null;
            const h = rr(rnd, 120, 175);
            const A = V(rr(rnd, B.x + 80, C.x - 80), yb - h);
            const F = V(A.x, yb);
            return {
                g: 'C', type: 'C-height',
                text: '△ABCで、頂点Aから辺BCへの垂線AHを作図し、Hに点をとりなさい。',
                pts: [A, B, C],
                segs: [[A, B], [A, C], [V(-1000, yb), V(CW + 1000, yb)]],
                labels: [[A, 'A', -5, -10], [B, 'B', -18, 14], [C, 'C', 6, 14]],
                steps: stepsPerp(A, F, V(1, 0), h, 'off', 0, 'A', '辺BC')
                    .concat([stepMark(F, '垂線と辺BCの交点をタップして、点Hをとろう。')]),
                target: F, ansLabel: 'H'
            };
        },

        /* ③ ℓ上の点Pを通る垂線と、斜めの直線mとの交点Q（ℓは水平） */
        'C-perp': function (rnd) {
            const yl = rr(rnd, 225, 262);
            const P = V(rr(rnd, 150, 420), yl);
            const h = rr(rnd, 90, 150);
            const Q = V(P.x, yl - h);
            const phi = oneOf([-1, 1], rnd) * rr(rnd, 25, 65) * RAD;
            const dir = V(Math.cos(phi), Math.sin(phi));
            const M1 = V(Q.x - 1500 * dir.x, Q.y - 1500 * dir.y);
            const M2 = V(Q.x + 1500 * dir.x, Q.y + 1500 * dir.y);
            /* 直線mのラベルは、画面内に入る側に置く */
            let labM = polar(Q, phi, 140);
            if (labM.x > 560 || labM.y < 25 || labM.y > 290) labM = polar(Q, phi + Math.PI, 140);
            return {
                g: 'C', type: 'C-perp',
                text: 'Pを通るℓの垂線と、直線mとの交点Qを作図しなさい。',
                pts: [P],
                segs: [[V(-1000, yl), V(CW + 1000, yl)], [M1, M2]],
                labels: [[P, 'P', 8, 16], [V(20, yl), 'ℓ', 0, -12], [labM, 'm', 6, -8]],
                steps: stepsPerp(P, P, V(1, 0), 0, 'on', 0, 'P', 'ℓ')
                    .concat([stepMark(Q, '垂線と直線mの交点をタップして、点Qをとろう。')]),
                target: Q, ansLabel: 'Q'
            };
        }
    };

    /* --- 生成した図のチェック（点が画面内・点どうしが近すぎない） --- */
    function validProblem(q) {
        const inside = p => p.x >= 14 && p.x <= CW - 14 && p.y >= 14 && p.y <= CH - 14;
        if (!q.pts.every(inside)) return false;
        if (q.target && !inside(q.target)) return false;
        for (let i = 0; i < q.pts.length; i++) {
            for (let j = i + 1; j < q.pts.length; j++) {
                if (dist(q.pts[i], q.pts[j]) < 40) return false;
            }
        }
        return true;
    }

    /* --- 問題の生成（makeProblem）：条件に合うまでやり直す --- */
    function makeProblem(g, rnd, forcedType = null) {
        const types = forcedType ? [forcedType] : PROBLEM_TYPES[g];
        let last = null;
        for (let i = 0; i < 300; i++) {
            const q = PROBLEM_BUILDERS[oneOf(types, rnd)](rnd);
            if (!q) continue;
            q.n = q.steps.length;
            last = q;
            if (validProblem(q)) return q;
        }
        return last || PROBLEM_BUILDERS[types[0]](rnd);
    }

    /* --- 検定用の問題セットの生成（generateQuizData） --- */
    function generateQuizData() {
        const groups = KENTEI_GROUPS.slice();
        for (let i = groups.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [groups[i], groups[j]] = [groups[j], groups[i]];
        }
        return groups.map(g => makeProblem(g, Math.random));
    }


    /* ==========================================================================
       11. 固有データ（グループ・規定問題・ヒント）【固有】
       ========================================================================== */

    /* --- グループ情報（GROUP_INFO） --- */
    const GROUP_INFO = {
        A: { label: 'グループA', mark: '①', desc: '垂直二等分線の作図の応用' },
        B: { label: 'グループB', mark: '②', desc: '角の二等分線の作図の応用' },
        C: { label: 'グループC', mark: '③', desc: '垂線の作図の応用' }
    };

    /* --- グループの並び順（GROUP_ORDER） --- */
    const GROUP_ORDER = ['A', 'B', 'C'];

    /* --- ヒント文のデータ（HINT_DATA） --- */
    const HINT_DATA = {
        start: "目指せ！パーフェクト！",
        init: "コンパス：針の点をタップ→弧をドラッグ（もう一度押すと固定）<br>定規：2点をドラッグ<br>点：交点をタップ",
        nextQuestion: "正解！<br>『次の問題』を押そう。",
        allFinished: "全問終了！<br>『送信』ボタンを押そう。"
    };


    /* ==========================================================================
       12. イベントリスナー・初期化【共通】
       ========================================================================== */

    /* --- 画面リサイズ時の拡大縮小（resize） --- */
    window.addEventListener('resize', resizeApp);

    /* --- 読み込み完了時の初期化（DOMContentLoaded） --- */
    window.addEventListener('DOMContentLoaded', () => {
        resizeApp();
        initValidationControls();
        quizData = generateQuizData();
        loadPracticeProgress();
        loadKenteiRecords();
        hideInactiveStages();
        const bestDisplayEl = document.getElementById('best-normal-display');
        if (bestDisplayEl) bestDisplayEl.innerText = bestTimeText(bestNormalTimeMs !== null ? formatMs(bestNormalTimeMs) : '--:--.-');
        showStartLayout();
        showScreen('screen-start');
    });

</script>
<script>
    /* ==========================================================================
       13. 作図の画面・操作【固有】（作図用に差し替える関数を含む）
       ========================================================================== */
    const cv = document.getElementById('sakuzu-canvas');
    const ctx = cv.getContext('2d');

    /* --- 結果メッセージの表示（msg） --- */
    function msg(text, cls) {
        resultMsgEl.textContent = text;
        resultMsgEl.className = 'result-message ' + (cls || '');
    }

    /* --- 現在の問題（curQ） --- */
    function curQ() {
        return quizData[currentQuestionIndex];
    }

    /* --- 道具ボタンの見た目の更新（updateToolButtons） --- */
    function updateToolButtons() {
        const compassBtn = document.getElementById('tool-compass');
        compassBtn.classList.toggle('active', tool === 'compass');
        compassBtn.textContent = (tool === 'compass' && compassFixed) ? '🧭 コンパス（固定）' : '🧭 コンパス';
        document.getElementById('tool-ruler').classList.toggle('active', tool === 'ruler');
        document.getElementById('tool-point').classList.toggle('active', tool === 'point');
    }

    /* --- 道具の選択／選択解除（setTool）：コンパス選択中にもう一度押すと「通常 ⇄ 固定」 --- */
    function setTool(name) {
        if (name === 'compass' && tool === 'compass') {
            if (!compassFixed && lastArcRadius() === null) {
                msg('先に1本弧を描いてね。', 'incorrect');
                return;
            }
            compassFixed = !compassFixed;
        } else {
            tool = (tool === name) ? null : name;
            compassFixed = false;
        }
        needle = null;
        drag = null;
        updateToolButtons();
        draw();
    }

    /* --- 直前に描いた弧（円）の半径（なければ null）（lastArcRadius） --- */
    function lastArcRadius() {
        const circles = drawn.filter(o => o.t === 'c');
        return circles.length ? circles[circles.length - 1].r : null;
    }

    /* --- 点pが弧cの範囲内にあるか（onArcRange）：弧の端は3pxぶんゆるめに見る --- */
    function onArcRange(c, p) {
        if (c.a0 === undefined) return true;
        const full = 2 * Math.PI;
        const tol = 3 / c.r;
        let diff = (Math.atan2(p.y - c.p.y, p.x - c.p.x) - c.a0) % full;
        if (diff < 0) diff += full;
        return diff <= (c.a1 - c.a0) + tol || diff >= full - tol;
    }

    /* --- 弧どうしが交わっている点の数（0〜2）（arcCrossCount） --- */
    function arcCrossCount(c1, c2) {
        const d = dist(c1.p, c2.p);
        if (d < 1e-6 || d > c1.r + c2.r || d < Math.abs(c1.r - c2.r)) return 0;
        const a = (c1.r * c1.r - c2.r * c2.r + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, c1.r * c1.r - a * a));
        const ux = (c2.p.x - c1.p.x) / d, uy = (c2.p.y - c1.p.y) / d;
        const mx = c1.p.x + a * ux, my = c1.p.y + a * uy;
        return [V(mx - h * uy, my + h * ux), V(mx + h * uy, my - h * ux)]
            .filter(pt => onArcRange(c1, pt) && onArcRange(c2, pt))
            .length;
    }

    /* --- 交点の計算（ixs） --- */
    function ixs(q) {
        const segs = q.segs.slice();
        const circles = drawn.filter(o => o.t === 'c');
        const out = [];

        drawn.forEach(o => {
            if (o.t !== 'l') return;
            const d = unit(o.a, o.b);
            segs.push([
                V(o.a.x - d.x * 2000, o.a.y - d.y * 2000),
                V(o.a.x + d.x * 2000, o.a.y + d.y * 2000)
            ]);
        });

        const add = (p) => {
            if (p.x >= -1 && p.x <= CW + 1 && p.y >= -1 && p.y <= CH + 1) out.push(p);
        };

        /* 直線どうし */
        for (let i = 0; i < segs.length; i++) {
            for (let j = i + 1; j < segs.length; j++) {
                const p = segs[i][0], p2 = segs[i][1];
                const s0 = segs[j][0], s2 = segs[j][1];
                const r = V(p2.x - p.x, p2.y - p.y);
                const t = V(s2.x - s0.x, s2.y - s0.y);
                const den = r.x * t.y - r.y * t.x;
                if (Math.abs(den) < 1e-9) continue;
                const a = ((s0.x - p.x) * t.y - (s0.y - p.y) * t.x) / den;
                const b = ((s0.x - p.x) * r.y - (s0.y - p.y) * r.x) / den;
                if (a >= 0 && a <= 1 && b >= 0 && b <= 1) add(V(p.x + a * r.x, p.y + a * r.y));
            }
        }

        /* 円と直線 */
        circles.forEach(c => {
            segs.forEach(seg => {
                const a = seg[0], b = seg[1];
                const d = V(b.x - a.x, b.y - a.y);
                const f = V(a.x - c.p.x, a.y - c.p.y);
                const A = dot(d, d);
                const B = 2 * dot(f, d);
                const K = dot(f, f) - c.r * c.r;
                const D = B * B - 4 * A * K;
                if (D < 0) return;
                [-1, 1].forEach(sign => {
                    const t = (-B + sign * Math.sqrt(D)) / (2 * A);
                    if (t >= 0 && t <= 1) {
                        const pt = V(a.x + t * d.x, a.y + t * d.y);
                        if (onArcRange(c, pt)) add(pt);
                    }
                });
            });
        });

        /* 円どうし */
        for (let i = 0; i < circles.length; i++) {
            for (let j = i + 1; j < circles.length; j++) {
                const c1 = circles[i], c2 = circles[j];
                const d = dist(c1.p, c2.p);
                if (d < 1e-6 || d > c1.r + c2.r || d < Math.abs(c1.r - c2.r)) continue;
                const a = (c1.r * c1.r - c2.r * c2.r + d * d) / (2 * d);
                const h = Math.sqrt(Math.max(0, c1.r * c1.r - a * a));
                const ux = (c2.p.x - c1.p.x) / d, uy = (c2.p.y - c1.p.y) / d;
                const mx = c1.p.x + a * ux, my = c1.p.y + a * uy;
                [V(mx - h * uy, my + h * ux), V(mx + h * uy, my - h * ux)].forEach(pt => {
                    if (onArcRange(c1, pt) && onArcRange(c2, pt)) add(pt);
                });
            }
        }
        return out;
    }

    /* --- いちばん近い点（与えられた点・交点）を探す（nearSnap） --- */
    function nearSnap(p, th) {
        const q = curQ();
        let best = null;
        let bestDist = th;
        q.pts.concat(ixs(q)).forEach(s => {
            const d = dist(s, p);
            if (d < bestDist) {
                bestDist = d;
                best = s;
            }
        });
        return best;
    }

    /* --- 交点のうち、いちばん近いものを探す（nearIx）：点をとる道具用 --- */
    function nearIx(p, th) {
        let best = null;
        let bestDist = th;
        ixs(curQ()).forEach(s => {
            const d = dist(s, p);
            if (d < bestDist) {
                bestDist = d;
                best = s;
            }
        });
        return best;
    }

    /* --- 作図エリアの描画（draw） --- */
    function draw() {
        ctx.clearRect(0, 0, CW, CH);
        const q = curQ();
        if (!q || !gameStarted) return;
        ctx.lineCap = 'round';

        const drawLine = (a, b, color, width) => {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        };
        const drawPoint = (p, r, color) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, 7);
            ctx.fillStyle = color;
            ctx.fill();
        };

        /* 円（弧）・直線を、色と太さを指定して描く */
        const drawOp = (o, color, width) => {
            if (o.t === 'c') {
                ctx.beginPath();
                ctx.arc(o.p.x, o.p.y, o.r, o.a0 === undefined ? 0 : o.a0, o.a0 === undefined ? 7 : o.a1);
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.stroke();
            } else {
                const d = unit(o.a, o.b);
                drawLine(
                    V(o.a.x - d.x * 2000, o.a.y - d.y * 2000),
                    V(o.a.x + d.x * 2000, o.a.y + d.y * 2000),
                    color, width
                );
            }
        };

        /* 与えられた図形 */
        q.segs.forEach(seg => drawLine(seg[0], seg[1], '#333', 2.5));

        /* 描いた円・直線・点（練習：今の手番＝赤、終わった線＝青／答えの点は赤） */
        drawn.forEach((o, i) => {
            if (o.t === 'p') {
                drawPoint(o.p, 5, '#e53935');
                ctx.fillStyle = '#e53935';
                ctx.font = 'bold 17px sans-serif';
                ctx.fillText(q.ansLabel || '', o.p.x + 8, o.p.y - 8);
            } else if (practiceMode) {
                drawOp(o, (i === drawn.length - 1) ? '#e53935' : '#1a73e8', 2);
            } else if (o.t === 'c') {
                drawOp(o, '#1a73e8', 1.5);
            } else {
                drawOp(o, '#e65100', 2);
            }
        });

        /* 針の位置（コンパス選択中）：固定のときは、直前の弧と同じ半径のガイド円も出す */
        if (needle && tool === 'compass') {
            const guideR = lastArcRadius();
            if (compassFixed && guideR !== null) {
                ctx.setLineDash([3, 5]);
                ctx.beginPath();
                ctx.arc(needle.x, needle.y, guideR, 0, 7);
                ctx.strokeStyle = '#b5d3fa';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (!drag) drawPoint(needle, 7, 'rgba(26,115,232,.35)');
        }

        /* ドラッグ中のプレビュー */
        if (drag) {
            ctx.setLineDash([5, 4]);
            if (tool === 'compass') {
                /* ほとんど動かしていない（タップ）間は、弧を出さない */
                if (drag.r >= 12 && drag.moved >= 8) {
                    const a0 = (drag.cum >= 0) ? drag.a0 : drag.a0 + drag.cum;
                    const a1 = (drag.cum >= 0) ? drag.a0 + drag.cum : drag.a0;
                    const prev = drawn.length ? drawn[drawn.length - 1] : null;
                    /* 同じ半径で弧をかく手順（q.steps の sameR）なら、半径が合うと赤くなる */
                    const nextStep = q.steps[drawn.length];
                    const sameStep = practiceMode && prev && prev.t === 'c' && nextStep && nextStep.sameR;
                    const sameR = sameStep && eq(drag.r, prev.r);

                    /* 検定：直前の円と同じ半径（正解判定と同じ許容差）になったら実線にする */
                    const circles = drawn.filter(o => o.t === 'c');
                    const prevCircle = circles.length ? circles[circles.length - 1] : null;
                    if (!practiceMode && prevCircle && eq(drag.r, prevCircle.r)) {
                        ctx.setLineDash([]);
                    }

                    ctx.beginPath();
                    ctx.arc(drag.s.x, drag.s.y, drag.r, a0, a1);
                    ctx.strokeStyle = sameR ? '#e53935' : '#74a9f0';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            } else {
                drawLine(drag.s, drag.p, practiceMode ? '#74a9f0' : '#f0a070', 2);
            }
            ctx.setLineDash([]);
            drawPoint(drag.s, 7, 'rgba(26,115,232,.35)');
        }

        /* 交点・与えられた点・ラベル */
        ixs(q).forEach(p => drawPoint(p, 3, '#777'));
        q.pts.forEach(p => drawPoint(p, 4, '#000'));
        ctx.fillStyle = '#000';
        ctx.font = 'bold 17px sans-serif';
        q.labels.forEach(l => ctx.fillText(l[1], l[0].x + l[2], l[0].y + l[3]));
    }

    /* --- キャンバス上の座標への変換（cpos） --- */
    function cpos(e) {
        const r = cv.getBoundingClientRect();
        return V((e.clientX - r.left) * CW / r.width, (e.clientY - r.top) * CH / r.height);
    }

    /* --- ポインタ操作（コンパス／定規） --- */
    cv.addEventListener('pointerdown', e => {
        if (!gameStarted || isCompleted) return;
        if (!tool) {
            msg('コンパス・定規・点のどれかを選んでね。', 'incorrect');
            return;
        }
        const pos = cpos(e);

        /* 点をとる：交点の近くをタップ */
        if (tool === 'point') {
            const hit = nearIx(pos, 18);
            if (!hit) {
                msg('交点の近くをタップしてね。', 'incorrect');
                return;
            }
            addOp({ t: 'p', p: V(hit.x, hit.y) });
            return;
        }

        if (tool === 'compass') {
            /* 固定にしているのに直前の弧がない（消したあと）ときは、通常に戻す */
            if (compassFixed && lastArcRadius() === null) {
                compassFixed = false;
                updateToolButtons();
            }
            const snap = nearSnap(pos, 18);

            /* ①針の位置をタップ */
            if (!needle) {
                if (!snap) {
                    msg('針は点の上に置いてね。', 'incorrect');
                    return;
                }
                needle = V(snap.x, snap.y);
                msg('', '');
                draw();
                return;
            }

            /* ②弧の始点を押して、ドラッグで弧をなぞる（固定：半径は直前の弧のまま、押した向きから始める） */
            let r, a0;
            if (compassFixed) {
                r = lastArcRadius();
                a0 = Math.atan2(pos.y - needle.y, pos.x - needle.x);
            } else {
                const start = snap || pos;
                r = dist(needle, start);
                a0 = Math.atan2(start.y - needle.y, start.x - needle.x);
            }
            drag = { s: V(needle.x, needle.y), p: pos, down: pos, r: r, a0: a0, last: a0, cum: 0, moved: 0 };
            cv.setPointerCapture(e.pointerId);
            draw();
            return;
        }

        const s = nearSnap(pos, 18);
        if (!s) {
            msg('点の上から始めてね。', 'incorrect');
            return;
        }
        drag = { s: V(s.x, s.y), p: pos };
        cv.setPointerCapture(e.pointerId);
        draw();
    });

    cv.addEventListener('pointermove', e => {
        if (!drag) return;
        drag.p = cpos(e);

        if (tool === 'compass') {
            drag.moved = Math.max(drag.moved, dist(drag.down, drag.p));
            /* 針のすぐそばでは角度が定まらないので、角度は更新しない */
            if (dist(drag.s, drag.p) > 6) {
                const ang = Math.atan2(drag.p.y - drag.s.y, drag.p.x - drag.s.x);
                let diff = ang - drag.last;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                drag.cum = Math.max(-2 * Math.PI, Math.min(2 * Math.PI, drag.cum + diff));
                drag.last = ang;
            }
        }
        draw();
    });

    cv.addEventListener('pointerup', e => {
        if (!drag) return;
        const d = drag;
        drag = null;

        if (tool === 'compass') {
            /* ほとんど動かさずに離したらタップ：針を置きなおす */
            if (d.moved < 8) {
                const snap = nearSnap(d.down, 18);
                if (snap) {
                    needle = V(snap.x, snap.y);
                    msg('', '');
                } else {
                    msg('針は点の上に置いてね。', 'incorrect');
                }
                draw();
                return;
            }
            /* 短すぎる弧は無視（針はそのまま） */
            if (d.r < 12 || d.r * Math.abs(d.cum) < 12) {
                draw();
                return;
            }
            const a0 = (d.cum >= 0) ? d.a0 : d.a0 + d.cum;
            const a1 = (d.cum >= 0) ? d.a0 + d.cum : d.a0;
            needle = null;   // 弧を描いたら針はリセット
            addOp({ t: 'c', p: d.s, r: d.r, a0: a0, a1: a1 });
            return;
        }

        const s = d.s;
        const p = cpos(e);
        const end = nearSnap(p, 12);
        if (!end || dist(end, s) < 8) {
            msg('もう1つの点までドラッグしてね。', 'incorrect');
            draw();
            return;
        }
        addOp({ t: 'l', a: s, b: V(end.x, end.y) });
    });

    cv.addEventListener('pointercancel', () => {
        drag = null;
        draw();
    });

    /* --- 作図の追加と判定（練習は1手ごと、検定は「判定する」でまとめて）（addOp） --- */
    function addOp(op) {
        const q = curQ();
        if (!practiceMode) {
            drawn.push(op);
            msg('', '');
            draw();
            updateControlKeysState(currentControlState);
            return;
        }
        if (pred(q, drawn.length, op, drawn)) {
            drawn.push(op);
            msg('✔ 手順' + drawn.length + ' OK！', 'correct');
            draw();
            if (drawn.length >= q.n) finishQuestion();
            else updateControlKeysState(currentControlState);
        } else {
            showStepError(null);
            document.getElementById('hint-text').textContent = q.steps[drawn.length].hint;
            msg('✖ ちがうみたい。ヒントを見てやりなおそう。', 'incorrect');
            draw();
        }
    }

    /* --- 1問クリア時の処理（finishQuestion） --- */
    function finishQuestion() {
        isCompleted = true;
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';

        if (currentQuestionWrongCount === 0) {
            score++;
            if (!practiceMode) {
                correctStreakCount++;
                if (correctStreakCount > maxStreakCount) maxStreakCount = correctStreakCount;
                saveKenteiRecords();
            }
        }
        if (document.activeElement) document.activeElement.blur();
        draw();

        if (currentQuestionIndex === QUESTION_COUNT - 1) {
            stopTimerClockAndEvaluate();
            resultMsgEl.textContent = `全 ${QUESTION_COUNT} 問中 ${score} 問ノーミス正解！`;
            resultMsgEl.className = "result-message correct";
            progressEl.textContent = (score === QUESTION_COUNT) ? "全問ノーミスパーフェクト！" : "全問終了！";
            document.getElementById('hint-text').innerHTML = HINT_DATA.allFinished;
            updateControlKeysState('finished');
            updateSendButtonState();
        } else {
            msg('✔ 作図できた！', 'correct');
            document.getElementById('hint-text').innerHTML = HINT_DATA.nextQuestion;
            updateControlKeysState('cleared');
        }
    }

    /* --- 答えの判定（checkAnswer）：作図用に差し替え --- */
    function checkAnswer() {
        const q = curQ();
        if (!q || drawn.length === 0) return;

        const k = solve(q, 0, [], []);
        if (k >= q.n) {
            finishQuestion();
            return;
        }
        if (practiceMode) {
            msg('まだ途中だよ。手順' + (k + 1) + 'に進もう。', 'incorrect');
            return;
        }
        showStepError(null);
        document.getElementById('hint-text').textContent = q.steps[k].hint;
        msg('手順' + (k + 1) + 'でつまずいているよ。', 'incorrect');
    }

    /* --- キー入力（pressKey）：作図用に差し替え（消す・全消去・お手本の一手戻す） --- */
    function pressKey(key) {
        if (!gameStarted || isCompleted) return;
        if (key === 'Backspace') drawn.pop();
        else if (key === 'clear') drawn = [];
        drag = null;
        needle = null;
        msg('', '');
        draw();
        updateControlKeysState(currentControlState);
    }

    /* --- 現在のステージの未入力判定（isCurrentStageEmpty）：作図用に差し替え --- */
    function isCurrentStageEmpty() {
        return drawn.length === 0;
    }

    /* --- 途中式プレビューの更新（refreshMathJaxPreview）：作図の再描画に差し替え --- */
    function refreshMathJaxPreview() {
        draw();
    }

    /* --- 1問ごとの時間切れ処理（handleQuestionTimeout）：作図用に差し替え --- */
    function handleQuestionTimeout() {
        clearInterval(questionTimerId);
        document.getElementById('hint-text').textContent = '時間切れ！手順をもう一度確かめよう。';
        showStepError(null);
    }

    /* --- 開始画面の表示（showStartLayout）：作図用に差し替え --- */
    function showStartLayout() {
        window.isAlreadySubmitted = false;
        const sendBtnTop = document.getElementById('send-btn');
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信";
            sendBtnTop.disabled = true;
        }
        if (numberField) numberField.disabled = false;

        gameStarted = false;
        isCompleted = false;
        drawn = [];
        drag = null;
        needle = null;
        progressEl.textContent = "スタートボタンを押してください";
        formulaBox.innerHTML = practiceMode
            ? `<span style="color:#aaa; font-size:20px;">【スタート】を押して挑戦しよう</span>`
            : `<span style="color:#aaa; font-size:20px;">生徒番号を入力→【スタート】</span>`;
        document.getElementById('hint-text').innerHTML = HINT_DATA.start;
        updateControlKeysState('start');
        resultMsgEl.textContent = '';
        draw();
    }

    /* --- 問題の読み込みと表示（loadQuestion）：作図用に差し替え --- */
    function loadQuestion() {
        isCompleted = false;
        currentQuestionWrongCount = 0;
        msg('', '');
        drawn = [];
        drag = null;
        tool = null;
        compassFixed = false;
        needle = null;
        updateToolButtons();
        document.getElementById('tool-compass').blur();
        document.getElementById('tool-ruler').blur();
        document.getElementById('tool-point').blur();
        updateControlKeysState('playing');

        const q = curQ();
        progressEl.textContent = practiceMode
            ? `${GROUP_INFO[practiceCurrentGroup].mark} ${GROUP_INFO[practiceCurrentGroup].desc}`
            : `第 ${currentQuestionIndex + 1} 問 / 全 ${QUESTION_COUNT} 問`;
        formulaBox.textContent = q.text;
        document.getElementById('hint-text').innerHTML = HINT_DATA.init;
        draw();
        startQuestionTimer();
    }

</script>
</body>
</html>
