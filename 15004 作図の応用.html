<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15004.作図の応用</title>
    <script>
        /* ==========================================================================
           1. MathJaxの基本設定
           ========================================================================== */
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        /* ==========================================================================
           1. 全体の基本設定【共通】
           ========================================================================== */
        /* --- 全称要素の基本設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* --- ボディの基本スタイル --- */
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            min-height: 100vh;
            overflow: hidden;
        }
        /* --- アプリコンテナのレイアウト設定 --- */
        #app-container {
            width: 960px;
            height: 640px;
            flex-shrink: 0;
            min-width: 960px;
            min-height: 640px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 12px;
            position: relative;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px 20px;
        }

        /* ==========================================================================
           2. ヘッダー・タイトル・利き手切り替えボタン【共通】
           ========================================================================== */
        /* --- ヘッダー領域のレイアウト設定 --- */
        header { 
            text-align: center; 
        }
        /* --- タイトル見出しのスタイル --- */
        h1 { 
            font-size: 24px; 
            color: #333; 
            margin-bottom: 5px; 
        }
        /* --- タイトルバーのグリッドレイアウト --- */
        .title-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 0px;
        }
        /* --- 利き手設定ボタンの共通スタイル --- */
        .title-hand-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        /* --- 利き手設定ボタンの活性状態スタイル --- */
        .title-hand-btn.active { 
            background-color: #1a73e8;
            color: white;
        }
        /* --- 左利きレイアウト（反転配置）のスタイル --- */
        .game-layout.left-handed {
            flex-direction: row-reverse;
        }

        /* ==========================================================================
           3. キー・ボタン類（キーパッド・ミニキー・送信ボタン）【共通】
           ========================================================================== */
        /* --- キーパッドのグリッド配置 --- */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(5, 56px); 
            gap: 1px; 
            margin-bottom: 8px; 
        }
        /* --- キー（ボタン）の共通スタイル --- */
        .key {
            height: 46px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }
        /* --- キーが押下された時のスタイル --- */
        .key:active:not(:disabled) { 
            background-color: #dee2e6; 
            transform: scale(0.95); 
        }
        /* --- 数字キーのスタイル --- */
        .key.num-btn { 
            font-family: 'MathJax_Main', 'Times New Roman', Times, serif; 
        }
        /* --- 演算子キーのスタイル --- */
        .key.op-btn { 
            background-color: #e7f5ff; 
            border-color: #a5d8ff; 
            color: #007bff; 
            font-size: 20px; 
        }
        /* --- 文字キーのスタイル --- */
        .key.var-btn { 
            background-color: #f3f0ff; 
            border-color: #d0bfff; 
            color: #6f42c1; 
            font-family: 'MathJax_Math', 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: normal; 
            font-size: 26px; 
        }
        /* --- 単位キーのスタイル --- */
        .key.unit-btn { 
            background-color: #fff0f6; 
            border-color: #ffdeeb; 
            color: #d6336c; 
            font-size: 18px; 
            font-weight: bold; 
        }
        /* --- 分数キーのスタイル --- */
        .key.frac-btn { 
            background-color: #fff9db; 
            border-color: #fff3bf; 
            color: #f59f00; 
            font-size: 18px; 
        }
        /* --- かっこキーのスタイル --- */
        .key.paren-btn { 
            background-color: #ebfbee; 
            border-color: #b2f2bb; 
            color: #2b8a3e; 
            font-size: 20px; 
        }
        /* --- 矢印キーのスタイル --- */
        .key.arrow-btn { 
            background-color: #fff3e0; 
            border-color: #ffe0b2; 
            color: #e65100; 
            font-weight: bold; 
        }
        /* --- キーパッド内ボタンの無効化状態スタイル --- */
        .keypad button:disabled { 
            background-color: #d1d5db !important; 
            color: #9ca3af !important; 
            border-color: #cbd5e1 !important; 
            cursor: not-allowed; 
            opacity: 0.6; 
            box-shadow: none !important; 
            transform: none !important; 
        }
        /* --- コントロールキー群のレイアウト --- */
        .control-keys { 
            display: grid; 
            grid-template-columns: repeat(3, 92px); 
            gap: 4px; 
            width: 100%; 
            justify-content: center; 
        }
        /* --- アクションボタンのスタイル --- */
        .key.action-btn { 
            background-color: #28a745; 
            color: #fff; 
            font-size: 18px; 
            height: 46px; 
            border-color: #1e7e34; 
            width: 100%; 
        }
        /* --- アクションボタンの判定モード時スタイル --- */
        .key.action-btn.judge-mode { 
            background-color: #007bff; 
            border-color: #0069d9; 
        }
        /* --- クリアキーのスタイル --- */
        .key.clear-btn { 
            background-color: #e9ecef; 
            font-size: 16px; 
            height: 46px; 
            width: 100%; 
            color: #333; 
        }
        /* --- 戻るボタンのスタイル --- */
        .key.action-btn-back {
            background-color: #fb8c00;
            color: #fff;
            border: none;
            font-size: 18px;
            height: 46px;
            width: 100%;
        }
        /* --- 戻るボタンの無効化状態スタイル --- */
        .key.action-btn-back:disabled {
            background-color: #ffcc80;
            color: #fff;
            cursor: not-allowed;
        }
        /* --- 小さなボタンやキーのスタイル --- */
        .key-mini {
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        /* --- 小さなボタンが押下された時のスタイル --- */
        .key-mini:active {
            background-color: #dee2e6;
        }
        /* --- クリアボタン(小)のスタイル --- */
        .key-mini.btn-clear {
            grid-column: span 2;
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-size: 14px;
        }
        /* --- クリアボタン(小)が押下された時のスタイル --- */
        .key-mini.btn-clear:active {
            background-color: #ffcdd2;
        }
        /* --- 送信ボタンのスタイル --- */
        #send-btn {
            padding: 6px 12px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 34px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
        }
        /* --- 送信ボタンが無効化された時のスタイル --- */
        #send-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ==========================================================================
           4. 画面の共通設定・開始画面【共通】
           ========================================================================== */
        /* --- 画面（app-screen）の共通レイアウト --- */
        .app-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background-color: #eceff1;
        }
        /* --- 検定画面の背景色 --- */
        #screen-kentei {
            background-color: #ffffff;
        }
        /* --- グループ選択画面のレイアウト --- */
        #screen-mondai-groups {
            justify-content: center;
            align-items: center;
        }
        /* --- 開始画面のレイアウト --- */
        .start-screen {
            justify-content: center;
            align-items: center;
            gap: 28px;
        }
        /* --- 開始画面のメインタイトル --- */
        .start-title-main {
            font-size: 18px;
            font-weight: normal;
            color: #333;
        }
        /* --- 開始画面のサブタイトル --- */
        .start-title-sub {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
        }
        /* --- 開始メニューのレイアウト --- */
        .start-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
        }
        /* --- 開始メニューボタンのスタイル --- */
        .start-menu-btn {
            height: 64px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- 開始メニューボタンが押下された時のスタイル --- */
        .start-menu-btn:active {
            transform: scale(0.97);
        }

        /* ==========================================================================
           5. サブ画面・問題選択画面【共通】
           ========================================================================== */
        /* --- サブ画面ヘッダーのレイアウト --- */
        .sub-screen-header {
            text-align: center;
            margin-bottom: 10px;
        }
        /* --- サブ画面ヘッダーの見出しスタイル --- */
        .sub-screen-header h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 0;
        }
        /* --- チュートリアル風サブボタンのスタイル --- */
        .btn-tutorial-hud-secondary {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- チュートリアル風サブボタンが押下された時のスタイル --- */
        .btn-tutorial-hud-secondary:active {
            background-color: #bbdefb;
        }
        /* --- 準備中画面のレイアウト --- */
        .placeholder-screen {
            justify-content: center;
            align-items: center;
            gap: 24px;
        }
        /* --- 練習モード無効化時のスタイル --- */
        .practice-disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(60%);
        }

        /* ==========================================================================
           6. 記録画面【共通】
           ========================================================================== */
        /* --- 記録画面の区分(問題選択/検定) --- */
        .kiroku-section {
            width: 560px;
            margin: 0 auto;
        }
        .kiroku-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            text-align: left;
        }
        /* --- 記録カード群のレイアウト --- */
        .kiroku-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 560px;
            margin: 0 auto;
        }
        /* --- 記録カードのスタイル --- */
        .kiroku-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px 18px;
            text-align: center;
        }
        /* --- 記録カードのラベルスタイル --- */
        .kiroku-card-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        /* --- 記録カードの値スタイル --- */
        .kiroku-card-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a73e8;
        }

        /* ==========================================================================
           7. 設定画面・リセット確認ダイアログ【共通】
           ========================================================================== */
        /* --- 設定画面のリセットボタン群のレイアウト --- */
        .settei-reset-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        /* --- リセットボタンのスタイル --- */
        .settei-reset-btn {
            width: 280px;
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            color: #c0392b;
            background-color: #fdecea;
            border: 1px solid #f1a9a0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        /* --- リセットボタンが押下された時のスタイル --- */
        .settei-reset-btn:active {
            background-color: #f8d3ce;
        }
        /* --- リセット確認ダイアログのオーバーレイ --- */
        .reset-confirm-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 12px;
        }
        /* --- リセット確認ダイアログのボックス --- */
        .reset-confirm-box {
            width: 340px;
            background-color: #fff;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        /* --- リセット確認ダイアログのメッセージ --- */
        .reset-confirm-message {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        /* --- リセット確認ダイアログのボタン群のレイアウト --- */
        .reset-confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        /* --- リセット確認ボタン（キャンセル・OK）の共通スタイル --- */
        .reset-confirm-cancel, .reset-confirm-ok {
            flex: 1;
            height: 44px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }
        /* --- リセット確認キャンセルボタンの色 --- */
        .reset-confirm-cancel {
            background-color: #e9ecef;
            color: #333;
        }
        /* --- リセット確認OKボタンの色 --- */
        .reset-confirm-ok {
            background-color: #e74c3c;
            color: #fff;
        }

        /* ==========================================================================
           8. グループ選択画面【共通】
           ========================================================================== */
        /* --- グループ選択リストのレイアウト --- */
        .group-select-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: auto;
            margin: 0 auto;
        }
        /* --- グループ選択ボタンのスタイル --- */
        .group-select-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
        }
        /* --- グループ選択ボタンが押下された時のスタイル --- */
        .group-select-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        /* --- グループ選択ボタンの無効化状態スタイル --- */
        .group-select-btn:disabled {
            background-color: #cfd8dc;
            color: #90a4ae;
            cursor: not-allowed;
        }
        /* --- グループ選択ボタンのサブテキストスタイル --- */
        .group-select-btn .group-select-sub {
            font-size: 12px;
            font-weight: normal;
        }
        /* --- グループ選択ボタンの1行目テキストスタイル --- */
        .group-select-btn > span:first-child {
           white-space: nowrap;
       }

        /* ==========================================================================
           9. メインゲーム画面・左右パネル【共通】
           ========================================================================== */
        /* --- ゲームメインレイアウトの構造設定 --- */
        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 8px;
        }
        /* --- 左パネル（問題表示エリア）のレイアウト --- */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
        }
        /* --- 右パネル（操作・キーパッドエリア）のレイアウト --- */
        .right-panel {
            width: 285px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           10. タイマー・自己ベスト・記録表示【共通】
           ========================================================================== */
        /* --- タイマーコンテナのレイアウト設定 --- */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f4;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 0px;
            font-weight: bold;
            box-sizing: border-box;
            height: 52px;
        }
        /* --- タイマー表示のスタイル --- */
        #timer-display {
            font-size: 20px;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }
        /* --- 記録表示ボックスのスタイル --- */
        .record-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border-left: 2px solid #ccc;
            padding-left: 12px;
            height: 100%;
        }
        /* --- ベスト記録更新メッセージのスタイル --- */
        #best-update-message {
            font-size: 12px;
            font-weight: bold;
            color: #1a73e8;
            white-space: nowrap;
            height: 1.2em;
            margin-bottom: 1px;
        }
        /* --- ベスト記録ラベルのコンテナスタイル --- */
        .best-label-container {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
        }

        /* ==========================================================================
           11. 生徒番号入力・ツールチップ【共通】
           ========================================================================== */
        /* --- 生徒番号入力エリアのスタイル --- */
        .number-field-wrapper {
            position: relative;
            display: inline-block;
        }
        /* --- ログイン入力フィールドの共通スタイル --- */
        .login-input {
            font-size: 15px;
            padding: 4px 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-weight: normal;
            width: 80px;
        }
        /* --- 入力フィールドのフォーカス時スタイル --- */
        .login-input:focus {
            border-color: #1a73e8;
        }
        /* --- 専用テンキー付き吹き出しのスタイル --- */
        .input-tooltip {
            display: none;
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            border: 2px solid #333333;
            color: #333333;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            width: 210px;
        }
        /* --- input-tooltipのツールチップ表示用スタイル --- */
        .input-tooltip::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent #333333 transparent;
        }
        /* --- ツールチップを表示状態にするスタイル --- */
        .input-tooltip.show {
            display: block;
        }
        /* --- ヒント表示用のツールチップスタイル --- */
        .tooltip-hint {
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }
        /* --- ミニテンキーのグリッド配置 --- */
        .keypad-mini {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
        }
        /* --- エラーメッセージ表示用のスタイル --- */
        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        /* ==========================================================================
           12. 問題文・出題数式表示エリア【共通】
           ========================================================================== */
        /* --- 問題表示のレイアウト --- */
        .question-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        /* --- 問題文のテキスト表示スタイル --- */
        .question-text { 
            font-size: 20px; 
            color: #333; 
            font-weight: bold; 
        }
        /* --- 進捗表示のスタイル --- */
        .progress { 
            font-size: 16px; 
            color: #666; 
        }
        /* --- 数式表示エリアのスタイル設定 --- */
        .formula-display {
            font-size: 26px;
            line-height: 1.4;
            text-align: center;
            color: #000;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ccc;
            height: auto;
            min-height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* --- 数式表示コンテナのレイアウト設定 --- */
        .formula-display mjx-container { 
            display: inline !important; 
            white-space: normal; 
        }

        /* ==========================================================================
           13. 入力枠・ステップバッジ【共通】
           ========================================================================== */
        /* --- 入力ブロックコンテナのレイアウト設定 --- */
        .input-block-container { 
            display: flex; 
            flex-direction: column; 
            gap: 0px; 
            width: 100%; 
            margin-bottom: 4px; 
        }
        /* --- 入力グループの基本レイアウト設定 --- */
        .input-box-group {
            background: #ffffff;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 4px 10px;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        /* --- 入力グループのフォーカス状態スタイル --- */
        .input-box-group.active-focus { 
            border-color: #007bff; 
            background-color: #f0f7ff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15); 
        }
        /* --- 入力グループの正解確定時スタイル --- */
        .input-box-group.locked-correct { 
            border-color: #81c784; 
            background-color: #e8f5e9; 
            cursor: default; 
        }
        /* --- 入力グループの無効化状態スタイル --- */
        .input-box-group.locked-disabled { 
            border-color: #e9ecef; 
            background-color: #f8f9fa; 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        /* --- 入力グループの入力エラー時スタイル --- */
        .input-box-group.error-shake { 
            border-color: #e57373; 
            background-color: #ffebee; 
        }
        /* --- 入力ラベルのスタイル --- */
        .input-label { 
            font-size: 13px; 
            color: #495057; 
            font-weight: bold; 
            margin-bottom: 0px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        /* --- ステップバッジのスタイル --- */
        .step-badge { 
            font-size: 11px; 
            padding: 1px 6px; 
            border-radius: 4px; 
            background-color: #dee2e6; 
            color: #495057; 
        }
        /* --- 正解確定時のステップバッジスタイル --- */
        .locked-correct .step-badge { 
            background-color: #28a745; 
            color: white; 
        }

        /* ==========================================================================
           14. 数式エディタ・「＝」の縦揃えCSS Gridレイアウト【共通】
           ========================================================================== */
        /* --- 数式レンダリング領域のスタイル --- */
        .mathjax-render-zone {
            min-height: 34px;
            font-size: 22px; 
            color: #212529; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            width: 100%;
        }
        /* --- 💡 「＝」を揃えるための3列のCSS Grid設定 --- */
        .equation-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            width: 100%;
        }
        /* --- 数式の左寄せスタイル --- */
        .eq-left {
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }
        /* --- 数式の中央寄せスタイル --- */
        .eq-equal {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        /* --- 数式の右寄せスタイル --- */
        .eq-right {
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
        }
        /* --- 数式エディタのコンテナスタイル --- */
        .math-editor-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            width: 0;
            height: 0;
            overflow: hidden;
        }
        /* --- ワイド分数モード時のコンテナスタイル --- */
        .math-editor-container.wide-fraction-mode {
            height: 60px;
            padding: 4px 14px;
            flex-wrap: wrap;
            overflow: visible;
            border: none !important; 
            background-color: transparent !important; 
        }
        /* --- プレースホルダーのスタイル --- */
        .placeholder-text {
            font-size: 16px;
            color: #adb5bd;
        }
        /* --- エディタのテキストノードスタイル --- */
        .editor-text-node {
            border: none;
            outline: none;
            font-size: 24px; 
            text-align: left;
            min-width: 20px;
            height: 32px;
            background: transparent;
            color: #000000;
            pointer-events: none; 
        }
        /* --- エディタのテキストノードのプレースホルダー --- */
        .editor-text-node::placeholder {
            font-size: 16px;
            color: #adb5bd; 
        }
        /* --- 小さなステップボックスのスタイル --- */
        .step-box-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 34px;
            border: 2px solid #ced4da;
             border-radius: 6px;
            background-color: #f0f7ff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            margin: 0 0px;
            padding: 0 8px;
        }
        /* --- アクティブな小さなステップボックスのスタイル --- */

            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }
        /* --- 正解確定時の小さなステップボックスのスタイル --- */
        .locked-correct .step-box-small {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
        }
        /* --- エディタの分数ノードスタイル --- */
        .editor-fraction-node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            min-width: 40px;
            margin: 0 4px;
        }
        /* --- @エディタの分数線スタイル --- */
        .editor-fraction-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 2px 0;
        }
        /* --- エディタの分数入力欄のスタイル --- */
        .editor-fraction-field {
            width: 40px;
            height: 24px;
            font-size: 20px; 
            text-align: center;
            border: none !important; 
            background-color: transparent !important; 
            outline: none;
            color: #000000;
            pointer-events: none; 
            font-family: 'Times New Roman', Times, serif !important; 
            font-style: italic !important; 
        }

        /* ==========================================================================
           15. 正解・不正解メッセージ・ヒント・フッター【共通】
           ========================================================================== */
        /* --- 結果メッセージの共通スタイル --- */
        .result-message { 
            font-size: 17px; 
            font-weight: bold; 
            min-height: 40px; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: auto; 
            margin-right: auto;

            width: 100%;

        /* --- 正解メッセージの文字色 --- */
        .correct { color: #28a745; }
        /* --- 不正解メッセージの文字色 --- */
        .incorrect { color: #e67e22; }
        /* --- ヒント表示エリアのスタイル --- */
        .hint-container { 
            width: 100%; 
            height: 205px; 
            background-color: #fff9db; 
            border: 1px dashed #f59f00; 
            border-radius: 8px; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-bottom: 8px; 
        }
        /* --- ヒントのタイトルのスタイル --- */
        .hint-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #f59f00; 
            margin-bottom: 4px; 
            text-align: left; 
        }
        /* --- ヒント本文のスタイル --- */
        .hint-body { 
            font-size: 16px; 
            font-weight: bold;
            color: #495057; 
            line-height: 1.4; 
            text-align: left; 
        }
        /* --- フッターのスタイル --- */
        footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #000000;
            font-weight: bold;
            padding-top: 4px;
            border-top: 1px solid #cfd8dc;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: #ffffff;
            border-radius: 0 0 10px 10px;
            padding-bottom: 4px;
        }

    
        /* ==========================================================================
           13. 作図アプリ固有のスタイル【固有】
           ========================================================================== */
        /* --- 道具ボタン（コンパス・定規・点）の配置：コンパスは1段目、定規と点は2段目 --- */
        .tool-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }
        /* --- 道具ボタンのスタイル --- */
        .tool-btn {
            flex: 1;
            height: 40px;
            font-size: 15px;
            font-weight: bold;
            background-color: #f1f3f5;
            border: 2px solid #ced4da;
            border-radius: 8px;
            cursor: pointer;
            padding: 0 2px;
            white-space: nowrap;
        }
        /* --- コンパスボタンは1段目いっぱいに広げる --- */
        #tool-compass {
            flex: 1 1 100%;
        }
        /* --- 定規ボタンと点ボタンは2段目を半分ずつ --- */
        #tool-ruler,
        #tool-point {
            flex: 1 1 0;
        }
        /* --- 道具ボタンが2段になるぶん、ヒント欄を低くする --- */
        #hint-container {
            height: 150px;
        }
        /* --- 道具ボタンの選択中スタイル --- */
        .tool-btn.active {
            background-color: #e7f5ff;
            border-color: #1a73e8;
            color: #1a73e8;
        }
        /* --- 作図キャンバスのスタイル --- */
        #sakuzu-canvas {
            width: 100%;
            background-color: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            touch-action: none;
        }
    </style>
</head>

    let activeEditorId         = stageFirstEditorId(ACTIVE_STAGES[0]);

    let practiceProgress = { A: 0, B: 0, C: 0 };
    const PRACTICE_PROGRESS_KEY = 'sakuzu_ouyou_practice_progress_v1';
    const KENTEI_RECORDS_KEY = 'sakuzu_ouyou_kentei_records_v1';

       2. 画面・表示【共通】
       ========================================================================== */

    /* --- 画面サイズに合わせた全体の拡大縮小（resizeApp） --- */
    function resizeApp() {
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640, 1);
        container.style.transform = `scale(${scale})`;
    }

    /* --- 画面の切り替え（showScreen） --- */
    function showScreen(screenId) {
        document.querySelectorAll('.app-screen').forEach(el => {
            el.style.display = 'none';
        });
        const target = document.getElementById(screenId);
        if (target) target.style.display = 'flex';

    /* --- MathJaxによる数式の再描画（updateMathJax） --- */
    function updateMathJax(elements) {
        if (window.MathJax && MathJax.typesetPromise) {
            if (MathJax.typesetClear) MathJax.typesetClear(elements);
            mathjaxPromise = mathjaxPromise.then(() => MathJax.typesetPromise(elements))
                .catch((err) => console.log("MathJax typesetting failed: " + err.message));
        }
    }


    /* ==========================================================================
       3. タイマー【共通】
       ========================================================================== */

    /* --- 検定タイマーの開始（startTimerClock） --- */
    function startTimerClock() {
        if (practiceMode) return;
        isCorrectState = false;
        lastClearTimeText = "";
        elapsedBeforeResume = 0;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 100);
        document.getElementById('best-update-message').innerText = "";
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = "送信";
        }
        if (numberField) numberField.disabled = false;
    }

    /* --- 検定タイマーの表示更新（updateTimer） --- */
    function updateTimer() {
        const diff = (Date.now() - startTime) + elapsedBeforeResume;
        if (diff >= KENTEI_TIME_LIMIT_MS) { handleKenteiTimeUp(); return; }
        const min = Math.floor(diff / 60000);
        const sec = Math.floor((diff % 60000) / 1000);
        const msec = Math.floor((diff % 1000) / 100);
        const minStr = String(min).padStart(2, '0');
        const secStr = String(sec).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${minStr}:${secStr}.${msec}`;
    }

    /* --- 検定の制限時間切れ処理（handleKenteiTimeUp） --- */
    function handleKenteiTimeUp() {
        if (!gameStarted || isCompleted || practiceMode) return;
        clearInterval(timerInterval);
        clearInterval(questionTimerId);
        isCompleted = true;
        document.getElementById('timer-display').innerText = `⏱️ ${formatMs(KENTEI_TIME_LIMIT_MS)}`;

    // 時間切れは連続正解記録をリセット
        correctStreakCount = 0;
        saveKenteiRecords();

        if (document.activeElement) document.activeElement.blur();
        stopTimerClockAndEvaluate(true);   // 送信処理は全問終了時と共通
        resultMsgEl.textContent = `時間切れ！全 ${quizData.length} 問中 ${score} 問ノーミス正解`;
        resultMsgEl.className = "result-message incorrect";
        progressEl.textContent = "時間切れ！";
        document.getElementById('hint-text').innerHTML = HINT_DATA.allFinished;
        updateControlKeysState('finished'); updateSendButtonState();
    }

    /* --- タイマー停止とクリア判定（stopTimerClockAndEvaluate） --- */
    function stopTimerClockAndEvaluate(isTimeUp = false) {
        clearInterval(timerInterval);
        isCorrectState = true; 
        clearInterval(questionTimerId);
        document.getElementById('countdown-timer').style.display = 'none';
        const finalTimeStr = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        lastClearTimeText = finalTimeStr;

    const totalElapsedTimeMs = isTimeUp ? KENTEI_TIME_LIMIT_MS : ((Date.now() - startTime) + elapsedBeforeResume);
    elapsedBeforeResume = totalElapsedTimeMs;

    if (!practiceMode) {
        kenteiAttemptCount++;
        if (!isTimeUp) kenteiClearCount++;   // 時間切れでなければクリア
        saveKenteiRecords();
    }

    if (bestNormalTimeMs === null || totalElapsedTimeMs < bestNormalTimeMs) {
        bestNormalTimeMs = totalElapsedTimeMs;
        document.getElementById('best-normal-display').innerText = bestTimeText(finalTimeStr);
        document.getElementById('best-update-message').innerText = isTimeUp ? "" : "🎉 ベスト更新！";
        saveKenteiRecords();
    }

        const numInput = numberField ? numberField.value.trim() : "";
        const isValidNum = (isConfirmed && /^\d{4}$/.test(numInput));
        
        if (isValidNum && !window.isAlreadySubmitted) {
            executeFormSubmit(numInput, lastClearTimeText, score);
            window.isAlreadySubmitted = true; 
            
            const sendBtnTop = document.getElementById('send-btn');
            const sendBtnBottom = document.getElementById('action-btn');
            if (sendBtnTop) {
                sendBtnTop.textContent = "完了";
                sendBtnTop.disabled = true;
            }
            if (sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.disabled = true;
                sendBtnBottom.className = "key clear-btn";
            }
            if (numberField) numberField.disabled = true;
        } else {
            window.isAlreadySubmitted = false;
            if (numberField) numberField.disabled = false;
        }
        
        updateSendButtonState();
    }

    /* --- 1問ごとのタイマー開始（startQuestionTimer） --- */
    function startQuestionTimer() {
        clearInterval(questionTimerId);
        if (practiceMode) {
            document.getElementById('countdown-timer').style.display = 'none';
            return;
        }
        if (!gameStarted || isCompleted) {
            document.getElementById('countdown-timer').style.display = 'none';
            return;
        }

        if (currentQuestionWrongCount >= 2) {
            document.getElementById('countdown-timer').style.display = 'inline-block';
            document.getElementById('countdown-timer').textContent = "じっくりタイム";
            return;
        }
        questionTimeLeft = QUESTION_TIME_LIMIT_SEC;
        updateQuestionTimerUI();
        document.getElementById('countdown-timer').style.display = 'inline-block';
        
        questionTimerId = setInterval(() => {
            questionTimeLeft--;
            updateQuestionTimerUI();
            if (questionTimeLeft <= 0) {
                handleQuestionTimeout();
            }
        }, 1000);
    }

    /* --- 1問ごとのタイマー表示更新（updateQuestionTimerUI） --- */
    function updateQuestionTimerUI() {
        const el = document.getElementById('countdown-timer');
        if (el) el.textContent = `残り ${questionTimeLeft}秒`;
    }

    /* --- ミリ秒の時間表示への変換（formatMs） --- */
    function formatMs(ms) {
        const totalMs = Math.max(0, Math.round(ms));
        const min = Math.floor(totalMs / 60000);
        const sec = Math.floor((totalMs % 60000) / 1000);
        const msec = Math.floor((totalMs % 1000) / 100);
        return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${msec}`;
    }

    /* --- ベストタイム表示文字列（問題数は QUESTION_COUNT から） --- */
    function bestTimeText(timeStr) {
        return `ベストタイム(${QUESTION_COUNT}問): ${timeStr}`;
    }


    /* ==========================================================================
       4. 生徒番号入力・記録送信【共通】
       ========================================================================== */

    /* --- 生徒番号入力欄の初期設定（initValidationControls） --- */
    function initValidationControls() {
        if (!numberField) return;

        numberField.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isConfirmed || numberField.value !== '') {
                numberField.value = '';
                isConfirmed = false;
                errorDisplay.style.display = 'none';
                updateSendButtonState();
            }
            tooltip.classList.add('show');
            numberField.focus();
        });

        tooltip.addEventListener('click', (e) => { e.stopPropagation(); });

        document.addEventListener('click', (e) => {
            if (tooltip.classList.contains('show') && !isConfirmed) {
                numberField.value = '';
                errorDisplay.style.display = 'none';
                tooltip.classList.remove('show');
                numberField.blur();
                updateSendButtonState();
            }
        });
    }

    /* --- 生徒番号の数字入力（pressNum） --- */
    function pressNum(num) {
        if (!numberField) return;
        let currentVal = numberField.value;

        if (currentVal.length === 4) {
            currentVal = '';
            errorDisplay.style.display = 'none';
        }

        currentVal += num;
        numberField.value = currentVal;
        updateSendButtonState();

        if (currentVal.length === 4) {
            const isValid = /^(9999|[1-3][1-5](0[1-9]|[1-2][0-9]|3[0-5]))$/.test(currentVal);
            if (isValid) completeInput(currentVal); 
            else errorDisplay.style.display = 'block';
        }
    }

    /* --- 生徒番号の確定（completeInput） --- */
    function completeInput(value) {
        isConfirmed = true;
        tooltip.classList.remove('show');
        numberField.blur();
        updateSendButtonState();
    }

    /* --- 生徒番号の1文字削除（pressClear） --- */
    function pressClear() {
        if (!numberField) return;
        let currentVal = numberField.value;
        if (currentVal.length > 0) {
            numberField.value = currentVal.slice(0, -1);
        }
        errorDisplay.style.display = 'none';
        isConfirmed = false;
        updateSendButtonState();
    }

    /* --- 送信ボタンの状態更新（updateSendButtonState） --- */
    function updateSendButtonState() {
        if (window.isAlreadySubmitted) return;

        const numVal = numberField ? numberField.value.trim() : "";
        const sendBtnTop = document.getElementById('send-btn');       
        const sendBtnBottom = document.getElementById('action-btn');   
    
        if (sendBtnTop && sendBtnTop.textContent === "完了") return;
        const canSend = (isCorrectState && numVal !== "" && /^\d{4}$/.test(numVal) && isConfirmed);
        
        if (sendBtnTop) sendBtnTop.disabled = !canSend;
        if (currentControlState === 'finished') {
            if (sendBtnBottom) {
                sendBtnBottom.disabled = !canSend;
                if (!canSend) sendBtnBottom.className = "key clear-btn"; 
                else sendBtnBottom.className = "key action-btn judge-mode"; 
            }
        }
    }

    /* --- Googleフォームへの送信実行（executeFormSubmit） --- */
    function executeFormSubmit(num, timeText, stageCount) {

        const form = document.createElement('form');
        form.action = GOOGLE_FORM_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';
        
        const fields = {
            [FORM_NUM_ID]:         num,                               
            [FORM_TIME_ID]:        timeText,    
            [FORM_STAGE_COUNT_ID]: stageCount                  
        };
        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        try { form.submit(); } catch (e) { console.error('送信エラー', e); }
        
        setTimeout(() => { document.body.removeChild(form); }, 1000);
    }

    /* --- 送信ボタン押下時の送信処理（manualSendToGoogleForm） --- */
    function manualSendToGoogleForm() {
        const numInput = numberField ? numberField.value.trim() : "";
        if (numInput === "" || !isConfirmed || !/^\d{4}$/.test(numInput) || !isCorrectState || window.isAlreadySubmitted) {
            return;
        }
        
        const sendBtnTop = document.getElementById('send-btn');
        const sendBtnBottom = document.getElementById('action-btn'); 
        
        if (sendBtnTop) {
            sendBtnTop.textContent = "送信中";
            sendBtnTop.disabled = true; 
        }
        if (currentControlState === 'finished' && sendBtnBottom) {
            sendBtnBottom.textContent = "送信中";
            sendBtnBottom.disabled = true;
            sendBtnBottom.className = "key clear-btn"; 
        }
        
        const currentTimerText = document.getElementById('timer-display').innerText.replace('⏱️ ', '');
        const timeToSend = lastClearTimeText || currentTimerText;
        executeFormSubmit(numInput, timeToSend, score);
        window.isAlreadySubmitted = true;
        
        if (numberField) numberField.disabled = true;
        if (tooltip) tooltip.classList.remove('show');
    
        setTimeout(() => { 
            if (sendBtnTop) sendBtnTop.textContent = "完了"; 
            if (currentControlState === 'finished' && sendBtnBottom) {
                sendBtnBottom.textContent = "完了";
                sendBtnBottom.className = "key clear-btn"; 
            }
        }, 1000);
    }


    /* ==========================================================================
       5. 記録の保存・読み込み・記録画面【共通】
       ========================================================================== */

    /* --- 検定記録の読み込み（loadKenteiRecords） --- */
    function loadKenteiRecords() {
        try {
            const raw = localStorage.getItem(KENTEI_RECORDS_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                bestNormalTimeMs = (typeof parsed.bestTimeMs === 'number') ? parsed.bestTimeMs : null;
                correctStreakCount = (typeof parsed.streak === 'number') ? parsed.streak : 0;
                maxStreakCount = (typeof parsed.maxStreak === 'number') ? parsed.maxStreak : 0;
                kenteiAttemptCount = (typeof parsed.attempts === 'number') ? parsed.attempts : 0;
                kenteiClearCount = (typeof parsed.clears === 'number') ? parsed.clears : 0;
                return;
            }
        } catch (e) { /* 読み込み失敗時は初期化 */ }
        bestNormalTimeMs = null;
        correctStreakCount = 0;
        maxStreakCount = 0;
        kenteiAttemptCount = 0;
        kenteiClearCount = 0;
    }

    /* --- 検定記録の保存（saveKenteiRecords） --- */
    function saveKenteiRecords() {
        try {
            localStorage.setItem(KENTEI_RECORDS_KEY, JSON.stringify({
                bestTimeMs: bestNormalTimeMs,
                streak: correctStreakCount,
                maxStreak: maxStreakCount,
                attempts: kenteiAttemptCount,
                clears: kenteiClearCount
            }));        } catch (e) { /* 保存失敗時は何もしない */ }
    }

    /* --- 問題選択の進捗の読み込み（loadPracticeProgress） --- */
    function loadPracticeProgress() {
        try {
            const raw = localStorage.getItem(PRACTICE_PROGRESS_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                let ok = true;
                GROUP_ORDER.forEach(g => {
                    if (typeof parsed[g] !== 'number') ok = false;
                });
                if (ok) { practiceProgress = parsed; return; }
            }
        } catch (e) { /* 読み込み失敗時は初期化 */ }
        practiceProgress = {};
        GROUP_ORDER.forEach(g => { practiceProgress[g] = 0; });
    }

    /* --- 問題選択の進捗の保存（savePracticeProgress） --- */
    function savePracticeProgress() {
        try {
            localStorage.setItem(PRACTICE_PROGRESS_KEY, JSON.stringify(practiceProgress));
        } catch (e) { /* 保存失敗時は何もしない */ }
    }

    /* --- 問題選択の進捗のリセット（resetPracticeProgress） --- */
    function resetPracticeProgress() {
        GROUP_ORDER.forEach(g => { practiceProgress[g] = 0; });
        savePracticeProgress();
    }

        /* --- 記録画面の描画（renderKirokuScreen） --- */
    function renderKirokuScreen() {
        const mondai = GROUP_ORDER.map(g => [
            `${GROUP_INFO[g].mark} ${GROUP_INFO[g].desc}`,
            `ノーミス：${practiceProgress[g] || 0}回`
        ]);

        const kentei = [
            ['検定：受検回数', `${kenteiAttemptCount}回`],
            ['検定：クリア回数', `${kenteiClearCount}回`],
            ['検定：ベストタイム', (bestNormalTimeMs !== null) ? formatMs(bestNormalTimeMs) : '--:--.-'],
            ['検定：連続正解記録', `現在：${correctStreakCount}問／最高：${maxStreakCount}問`]
        ];

        const toCards = (rows) => rows.map(a =>
            `<div class="kiroku-card">`
            + `<div class="kiroku-card-label">${a[0]}</div>`
            + `<div class="kiroku-card-value">${a[1]}</div>`
            + `</div>`
        ).join('');

        document.getElementById('kiroku-cards-mondai').innerHTML = toCards(mondai);
        document.getElementById('kiroku-cards-kentei').innerHTML = toCards(kentei);
    }

    /* --- リセット確認を開く（openResetConfirm） --- */
    function openResetConfirm(type) {
        pendingResetType = type;
        const msgEl = document.getElementById('reset-confirm-message');
        if (msgEl) {
            msgEl.textContent = (type === 'mondai')
                ? '問題選択のノーミスクリア回数がすべてリセットされます。よろしいですか？'
                : '検定のベストタイム・連続正解記録・受検回数がリセットされます。よろしいですか？';
        }
        const modal = document.getElementById('reset-confirm-modal');
        if (modal) modal.style.display = 'flex';
    }

    /* --- リセット確認を閉じる（closeResetConfirm） --- */
    function closeResetConfirm() {
        pendingResetType = null;
        const modal = document.getElementById('reset-confirm-modal');
        if (modal) modal.style.display = 'none';
    }

    /* --- リセットの実行（confirmReset） --- */
    function confirmReset() {
        if (pendingResetType === 'mondai') {
            resetPracticeProgress();
        } else if (pendingResetType === 'kiroku') {
            bestNormalTimeMs = null;
            correctStreakCount = 0;
            maxStreakCount = 0;
            kenteiAttemptCount = 0;
            kenteiClearCount = 0;
            saveKenteiRecords();
            if (!practiceMode) {
                const bestDisplayEl = document.getElementById('best-normal-display');
                if (bestDisplayEl) bestDisplayEl.innerText = bestTimeText('--:--.-');
            }
        }
        closeResetConfirm();
    }

    let typeSelectGroup = null;      // 種類を選んでいるグループ
    let practiceCurrentType = null;  // 練習中の問題の種類（null ＝ ランダム）

    function renderTypeSelectScreen(group) {
        const wrap = document.getElementById('type-select-wrap');
        if (!wrap) return;

        document.getElementById('type-select-title').textContent = `📚 ${info.mark} ${info.desc}`;

    /* --- 練習モードの開始（startPractice） --- */
    function startPractice(group, type = null) {
        if (!practiceMode) {
            savedQuizData = quizData;
            savedCurrentQuestionIndex = currentQuestionIndex;

            const timerDisplayEl = document.getElementById('timer-display');
            const bestDisplayEl = document.getElementById('best-normal-display');
            savedTimerDisplayText = timerDisplayEl ? timerDisplayEl.innerText : null;
            savedBestDisplayText = bestDisplayEl ? bestDisplayEl.innerText : null;
            if (timerDisplayEl) timerDisplayEl.innerText = '⏱️ --:--.-';
            if (bestDisplayEl) bestDisplayEl.innerText = bestTimeText('--:--.-');
        }
        practiceMode = true;
        practiceCurrentGroup = group;
        practiceCurrentType = type;
        quizData = [makeProblem(group, Math.random, type)];
        currentQuestionIndex = 0;

        const timerArea = document.getElementById('timer-container-area');
        if (timerArea) timerArea.classList.add('practice-disabled');

        showScreen('screen-kentei');
        startQuizGame();
    }

    /* --- 練習モードの終了（exitPracticeMode） --- */
    function exitPracticeMode() {
        practiceMode = false;
        practiceCurrentGroup = null;
        quizData = savedQuizData || generateQuizData();
        currentQuestionIndex = savedCurrentQuestionIndex || 0;
        gameStarted = false;
        isCompleted = false;

        const timerDisplayEl = document.getElementById('timer-display');
        const bestDisplayEl = document.getElementById('best-normal-display');
        if (timerDisplayEl && savedTimerDisplayText !== null) timerDisplayEl.innerText = savedTimerDisplayText;
        if (bestDisplayEl && savedBestDisplayText !== null) bestDisplayEl.innerText = savedBestDisplayText;

        const timerArea = document.getElementById('timer-container-area');
        if (timerArea) timerArea.classList.remove('practice-disabled');

        showStartLayout();
    }

    function goBackFromKentei() {

            exitPracticeMode();
            openTypeSelect(g);
        } else {
            showScreen('screen-start');
        }
    }

    /* --- 練習結果（星）の保存（saveCurrentPracticeResult） --- */
    function saveCurrentPracticeResult() {
        const group = practiceCurrentGroup;
        if (!group) return;
        if (currentQuestionWrongCount === 0) {
            practiceProgress[group] = (practiceProgress[group] || 0) + 1;
            savePracticeProgress();
        }
    }

    /* --- 練習結果の記録と問題選択画面への復帰（recordPracticeResult） --- */
    function recordPracticeResult() {
        const g = practiceCurrentGroup;
        saveCurrentPracticeResult();
        exitPracticeMode();
        openTypeSelect(g);
    }

    /* --- 次の練習問題への移動（advancePracticeToNext） --- */
    function advancePracticeToNext() {
        const group = practiceCurrentGroup;
        saveCurrentPracticeResult();
        startPractice(group, practiceCurrentType);
    }
