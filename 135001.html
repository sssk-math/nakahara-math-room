<script>
/* ==========================================================================
   1. グローバル変数・保存キー【共通】
   ========================================================================== */
const SESSION_KEY = 'riyou_session_v1';
const RECORDS_KEY = 'riyou_records_v1';
const container = document.getElementById('app-container');
const $ = id => document.getElementById(id);

let S = null;          // 現在の問題の状態
let R = null;          // 記録
let curOpts = [];      // 右パネルの選択肢（シャッフル済み）
let hintMsg = '';
let wrongOpts = [];    // まちがえて選んだ選択肢（赤く表示する）
let lastOpt = '';      // 直前に押した選択肢
let pendingReset = null;

/* ==========================================================================
   2. タイプ一覧・整理方法・出題文言【固有】
   ========================================================================== */
const TYPES = [
    {id: 'daikin',   name: '個数と代金',       ready: true},
    {id: 'otsuri',   name: 'おつり',           ready: true},
    {id: 'ookishou', name: '多い・少ない',     ready: false},
    {id: 'awasete',  name: '合わせて〇個',     ready: false},
    {id: 'kafusoku', name: '過不足',           ready: true},
    {id: 'nenrei',   name: '年齢',             ready: false},
    {id: 'heikin',   name: '平均',             ready: false},
    {id: 'wariai',   name: '割合',             ready: false},
    {id: 'noudo',    name: '食塩水・濃度',     ready: false},
    {id: 'hayasa',   name: '道のり・速さ・時間', ready: true}
];
const METHODS = {
    words:   {label: '言葉の式', icon: '📝', desc: '言葉で「〇＋〇＝〇」と表す'},
    diagram: {label: '線分図',   icon: '📏', desc: '全体と部分を線で表す'},
    table:   {label: '表',       icon: '📊', desc: '縦横のマスに整理する'}
};
const TALK = {
    var:    '① 求めたいものを文字 x でおこう。何を x とおく？',
    method: '② 整理の方法を選ぼう。やりにくければ途中で変えてもOK！',
    fill:   '③ 選んだ方法で整理しよう。空欄にあてはまるものをタップ！',
    eq:     '④ 整理をもとに、方程式をつくろう。',
    done:   '🎉 立式できたね！'
};

/* --- 乱数ユーティリティ --- */
function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
/* --- 選択肢の組み立て：正解（同じ文字列が複数あってもそのまま）＋まぎらわしい選択肢（重複は除く） --- */
function mkPool(answers, distractors) {
    return [...answers, ...distractors.filter((d, i) => !answers.includes(d) && distractors.indexOf(d) === i)];
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* ==========================================================================
   3. 問題生成・問題データ：個数と代金【固有】
   ========================================================================== */
function genDaikin() {
    const pairs = [
        ['りんご', '個', 'みかん', '個'],
        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(5, 20) * 10;
        x = randInt(3, 20) * 10;
        p = randInt(2, 8);
        q = randInt(2, 8);
    } while (a === x || p === q);
    return {A, uA, B, uB, a, x, p, q, T: a * p + q * x};
}

function specDaikin(p) {
    const uA = p.uA || '個';
    const uB = p.uB || '個';
    const U = (uA === uB) ? uA : `${uA}・${uB}`;   // 表の「数量」行の単位
    const ap = `${p.a}×${p.p}（円）`;
    const aq = `${p.a}×${p.q}（円）`;
    const xq = `x×${p.q}（円）`;
    const xp = `x×${p.p}（円）`;
    const tot = `${p.T}（円）`;
    const f1 = Math.round(Math.min(0.7, Math.max(0.3, (p.a * p.p) / p.T)) * 100);
    const f2 = 100 - f1;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;

    const slots3 = [
        {ans: ap,  hint: `${p.A}の代金は「単価×数量」だよ。`},
        {ans: xq,  hint: `${p.B}1${uB}の値段が x 円。${p.q}${uB}分の代金は？`},
        {ans: tot, hint: '代金の合計は問題文に書いてあるよ。'}
    ];
    const pool3 = [...new Set([ap, aq, xp, xq, tot, `${p.a}×x（円）`])];

    const tslots = [
        {ans: `${p.a}`,          hint: `${p.A}の単価は問題文に書いてあるよ。`},
        {ans: `${p.p}`,          hint: `${p.A}は何${uA}買ったかな？`},
        {ans: `${p.q}`,          hint: `${p.B}は何${uB}買ったかな？`},
        {ans: 'x',               hint: '求めたいものを x とおいたね。単価の欄だよ。'},
        {ans: `${p.a * p.p}`,    hint: `${p.A}の代金は「単価×数量」。計算した数を選ぼう。`},
        {ans: `${p.q}x`,         hint: `${p.B}の代金は「単価×数量」。単価は x だよ。`},
        {ans: `${p.T}`,          hint: '代金の合計は問題文に書いてあるよ。'}
    ];

    return {

function genOtsuri() {
    const pairs = [
        ['りんご', '個', 'みかん', '個'],
        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(3, 15) * 10;
        x = randInt(3, 15) * 10;
        p = randInt(2, 6);
        q = randInt(2, 6);
    } while (a === x || p === q);
    const T = a * p + q * x;
    const M = (Math.floor(T / 500) + 1) * 500;
    return {A, uA, B, uB, a, x, p, q, T, M, c: M - T};
}

   kind='dist'：道のりを求める（往復の時間の合計）／kind='time'：時間を求める（道のりの合計）
   ========================================================================== */
const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));

function genHayasa() {
    const places = [['家', '駅'], ['学校', '図書館'], ['公園', '店'], ['駅', '病院']];
    const [P, Q] = places[randInt(0, places.length - 1)];

    if (Math.random() < 0.5) {
        const sp = [3, 4, 5, 6, 8, 10, 12];
        let a, b, x, T;
        do {
            a = sp[randInt(0, sp.length - 1)];
            b = sp[randInt(0, sp.length - 1)];
            x = (a * b / gcd(a, b)) * randInt(1, 3);
            T = x / a + x / b;
        } while (a === b || x > 60 || T > 15);
        return {kind: 'dist', P, Q, a, b, x, T};
    }

    let a, b, x, t;
    do {
        a = randInt(3, 6);
        b = [8, 9, 10, 12][randInt(0, 3)];
        x = randInt(1, 4);
        t = randInt(1, 3);
    } while (x === t);
    return {kind: 'time', P, Q, a, b, x, t, D: a * x + b * t};
}

function specHayasa(p) {
    const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;

        + `<div class="dg-line"><div class="dg-seg" style="flex:${f1}"></div><div class="dg-seg" style="flex:${100 - f1}"></div></div>`
        + `<div class="dg-row"><div class="dg-part" style="flex:${f1}"><div class="dg-bracket down"></div>${lab(n[0], s[0])}</div>`
        + `<div class="dg-part" style="flex:${100 - f1}"><div class="dg-bracket down"></div>${lab(n[1], s[1])}</div></div></div>`;
    const clamp = r => Math.round(Math.min(0.65, Math.max(0.35, r)) * 100);

        const slots3 = [

        const tslots = [

            {ans: fr('x', p.a), hint: slots3[0].hint},

        return {
            text: `${p.P}から${p.Q}まで往復しました。行きは時速${p.a}km、帰りは時速${p.b}kmで進んだところ、往復で${p.T}時間かかりました。${p.P}から${p.Q}までの道のりは何kmですか。`,

                        + `<tr><th>時間（時間）</th><td>${s[4]}</td><td>${s[5]}</td><td>${s[6]}</td></tr></table>`
                }
            },
            eqAns: `${fr('x', p.a)}+${fr('x', p.b)}=${p.T}`,

            eqHint: '「行きの時間＋帰りの時間＝往復の時間」を式にしよう。時間＝道のり÷速さ だよ。',

                table:   {mark: '◎', msg: '表は「速さ・時間・道のり」の関係を縦横に整理できるので、時間＝道のり÷速さ の計算が見えやすい！'}
            }
        };
    }

    /* --- 時間を求める（道のりの合計） --- */
    const walk = `${p.a}×x（km）`;
    const run = `${p.b}×${p.t}（km）`;
    const tot = `${p.D}（km）`;
    const names = ['歩いた道のり', '走った道のり', '全体の道のり'];
    const slots3 = [
        {ans: walk, hint: '歩いた道のりは「速さ×時間」。歩いた時間を x 時間とおいたね。'},

        {ans: tot,  hint: '全体の道のりは問題文に書いてあるよ。'}

    const pool3 = [...new Set([walk, run, tot, `${p.b}×x（km）`, `${p.a}×${p.t}（km）`, `${p.a + p.b}（km）`])];
    const tslots = [

        varAns: '歩いた時間',
        varWrong: ['走った時間', '歩いた道のり', '全体の道のり'],

/* ==========================================================================
   3d. 問題生成・問題データ：過不足【固有】
   kind='haifu'：配る問題（余りと不足）／kind='seki'：長椅子・テーブルに座る問題
   どちらも「人数（または数）をx」とおき、a x + r1 = c x − r2 の形になる
   ========================================================================== */
function genHaifu() {
    const items = [
        ['えんぴつ', '本', '生徒'],
        ['あめ', '個', '子ども'],
        ['色紙', '枚', '生徒'],
        ['みかん', '個', '子ども'],
        ['ノート', '冊', '生徒']
    ];
    const [A, u, H] = items[randInt(0, items.length - 1)];
    let a, d, x, r1, r2;
    do {
        a = randInt(2, 6);
        d = randInt(1, 3);
        x = randInt(6, 25);
        r1 = randInt(2, 20);
        r2 = d * x - r1;
    } while (r2 < 2 || r2 > 25 || r1 === r2);
    return {kind: 'haifu', A, u, H, a, c: a + d, x, r1, r2};
}

function genSeki() {
    const nouns = [['長椅子', '脚'], ['テーブル', '台']];
    const [N, U] = nouns[randInt(0, nouns.length - 1)];
    let a, d, c, t, x, r1, r2;
    do {
        a = randInt(3, 8);
        d = randInt(1, 2);
        c = a + d;
        t = randInt(1, c - 1);
        x = randInt(5, 20);
        r2 = c - t;
        r1 = d * x - r2;
    } while (r1 < 2 || r1 > 25 || r2 === t);
    return {kind: 'seki', N, U, a, c, t, x, r1, r2};
}

function genKafusoku() {
    return (Math.random() < 0.5) ? genHaifu() : genSeki();
}

function specKafusoku(p) {
    const seki = (p.kind === 'seki');
    const {a, c, r1, r2} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
    const clamp = (r, lo, hi) => Math.round(Math.min(hi, Math.max(lo, r)) * 100);

    /* --- 問題ごとの文言・選択肢・ヒント --- */
    let K;
    if (seki) {
        const {N, U, t} = p;
        K = {
            text: `${N}を何${U}か並べます。集まった人たちが${N}1${U}に${a}人ずつ座ると${r1}人が座れず、${c}人ずつ座ると${t}人だけ座った${N}が1${U}できました。${N}は全部で何${U}ありますか。`,
            varAns: `${N}の数`,
            varWrong: ['集まった人たちの人数', `${N}1${U}に座る人数`, '座れなかった人数'],
            ax: `${a}×x（席）`, r1s: `${r1}（人）`, cx: `${c}×x（席）`, r2s: `${r2}（席）`,
            extra: [`${a + c}×x（席）`, `${t}（人）`],
            wordNames: ['座席の数', '余った人数', '座席の数', '余った座席数'],
            dgNames: [`${a}人ずつの座席の数`, '余った人数', `${c}人ずつの座席の数`, '余った座席数'],
            totalName: '集まった人数',
            hints: [
                `${a}人ずつ座るとき、${N}1${U}の座席は${a}席。座席の数は「1${U}の席数×${U}の数」だよ。`,
                `${a}人ずつ座ったときに座れなかった人数は、問題文に書いてあるよ。`,
                `${c}人ずつ座るときの座席の数も「1${U}の席数×${U}の数」だよ。`,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いている座席は何席？`
            ],
            th: [`${a}人ずつ`, `${c}人ずつ`],
            rows: [`1${U}の席数（席）`, `${N}の数（${U}）`, '座席の数（席）', '余った人数（人）', '余った座席数（席）'],
            thints: [
                `${a}人ずつ座るとき、${N}1${U}の座席は${a}席だよ。`,
                `${c}人ずつ座るとき、${N}1${U}の座席は${c}席だよ。`,
                `求めたいもの（${N}の数）を x とおいたね。1回目の${U}数の欄だよ。`,
                `2回目も同じ${N}の数 x だよ。`,
                '座席の数は「1' + U + 'の席数×' + U + 'の数」。1回目の欄だよ。',
                '座席の数は「1' + U + 'の席数×' + U + 'の数」。2回目の欄だよ。',
                `${a}人ずつ座ったときに座れなかった人数は、問題文に書いてあるよ。`,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いている座席は何席？`
            ],
            tExtra: [`${t}`, `${a + c}`, `${r1 + r2}`],
            eqWrong: [`${a}x+${r1}=${c}x-${t}`, `${a}x+${r1}=${c}x+${r2}`, `${c}x+${r1}=${a}x-${r2}`],
            eqHint: '集まった人数は「座席の数＋座れなかった人数」でも、「座席の数−空いた座席数」でも表せるよ。この2つが等しいことを式にしよう。',
            whole: '座り方が変わっても集まった人数は同じ'
        };
    } else {
        const {A, u, H} = p;
        const r2hint = `${c}${u}ずつ配ったときの不足は問題文に書いてあるよ。`;
        K = {
            text: `${A}を何人かの${H}に配ります。${a}${u}ずつ配ると${r1}${u}余り、${c}${u}ずつ配ると${r2}${u}不足します。${H}の人数を求めなさい。`,
            varAns: `${H}の人数`,
            varWrong: [`${A}の全体の数`, `1人に配る${A}の数`, `余った${A}の数`],
            ax: `${a}×x（${u}）`, r1s: `${r1}（${u}）`, cx: `${c}×x（${u}）`, r2s: `${r2}（${u}）`,
            extra: [`${a + c}×x（${u}）`, `${r1 + r2}（${u}）`],
            wordNames: [`${a}${u}ずつ配る数`, '余り', `${c}${u}ずつ配る数`, '不足'],
            dgNames: [`${a}${u}ずつ配る数`, '余り', `${c}${u}ずつ配る数`, '不足'],
            totalName: `全体の${A}の数`,
            hints: [
                `${a}${u}ずつ配った数は「1人分×人数」。${H}の人数を x 人とおいたね。`,
                `${a}${u}ずつ配ったときの余りは問題文に書いてあるよ。`,
                `${c}${u}ずつ配った数も「1人分×人数」だよ。`,
                r2hint
            ],
            th: [`${a}${u}ずつ`, `${c}${u}ずつ`],
            rows: [`1人分（${u}）`, '人数（人）', `配った数（${u}）`, `余り（${u}）`, `不足（${u}）`],
            thints: [
                `${a}${u}ずつ配るときの1人分は、問題文に書いてあるよ。`,
                `${c}${u}ずつ配るときの1人分は、問題文に書いてあるよ。`,
                `求めたいもの（${H}の人数）を x とおいたね。1回目の人数の欄だよ。`,
                '2回目も同じ人数 x だよ。',
                '配った数は「1人分×人数」。1回目の欄だよ。',
                '配った数は「1人分×人数」。2回目の欄だよ。',
                `${a}${u}ずつ配ったときの余りは問題文に書いてあるよ。`,
                r2hint
            ],
            tExtra: [`${a + c}`, `${r1 + r2}`, `${a + c}x`],
            eqWrong: [`${c}x+${r1}=${a}x-${r2}`, `${a}x+${r2}=${c}x-${r1}`, `${a}x+${r1}=${c}x+${r2}`],
            eqHint: '「配った数＋余り」と「配った数−不足」は、どちらも全体の数。この2つが等しいことを式にしよう。',
            whole: 'どちらの配り方でも全体の数は同じ'
        };
    }

    const slots4 = [
        {ans: K.ax,  hint: K.hints[0]},
        {ans: K.r1s, hint: K.hints[1]},
        {ans: K.cx,  hint: K.hints[2]},
        {ans: K.r2s, hint: K.hints[3]}
    ];
    const pool4 = [...new Set([K.ax, K.r1s, K.cx, K.r2s, ...K.extra])];

    const tans = [`${a}`, `${c}`, 'x', 'x', `${a}x`, `${c}x`, `${r1}`, `${r2}`];
    const tslots = tans.map((ans, i) => ({ans: ans, hint: K.thints[i]}));

    /* --- 線分図（上の線：a x + r1、下の線：全体 + 不足 = c x）を縦に小さくまとめる --- */
    const seg = f => `<div class="dg-seg" style="flex:${f}"></div>`;
    const part = (t, s, f) => `<div class="dg-part" style="flex:${f}"><div class="dg-bracket down"></div>${lab(t, s)}</div>`;
    const bar = (parts, w) => `<div style="width:${w}%"><div class="dg-line">${parts.map(q => seg(q[2])).join('')}</div>`
        + `<div class="dg-row">${parts.map(q => part(q[0], q[1], q[2])).join('')}</div></div>`;
    const T = a * p.x + r1;

    const diagramLayout = s => {
        const f1 = clamp((a * p.x) / T, 0.3, 0.7);
        const fr2 = clamp(r2 / (T + r2), 0.25, 0.4);
        const w1 = 100 - fr2;
        return '<div class="dg compact">'
            + bar([[K.dgNames[0], s[0], f1], [K.dgNames[1], s[1], 100 - f1]], w1)
            + `<div class="dg-top" style="margin-top:8px;">${lab(K.dgNames[2], s[2])}</div><div class="dg-bracket up"></div>`
            + bar([[K.totalName, '', w1], [K.dgNames[3], s[3], fr2]], 100)
            + '</div>';
    };

    return {
        text: K.text,
        varAns: K.varAns,
        varWrong: K.varWrong,
        fill: {
            words: {
                slots: slots4,
                pool: pool4,
                layout: s => `<div class="words">${lab(K.wordNames[0], s[0])}<div class="op">＋</div>${lab(K.wordNames[1], s[1])}<div class="op">＝</div>${lab(K.wordNames[2], s[2])}<div class="op">−</div>${lab(K.wordNames[3], s[3])}</div>`
            },
            diagram: {
                slots: slots4,
                pool: pool4,
                layout: diagramLayout
            },
            table: {
                slots: tslots,
                pool: mkPool(tans, K.tExtra),
                layout: s => `<table class="tbl"><tr><th></th><th>${K.th[0]}</th><th>${K.th[1]}</th></tr>`
                    + `<tr><th>${K.rows[0]}</th><td>${s[0]}</td><td>${s[1]}</td></tr>`
                    + `<tr><th>${K.rows[1]}</th><td>${s[2]}</td><td>${s[3]}</td></tr>`
                    + `<tr><th>${K.rows[2]}</th><td>${s[4]}</td><td>${s[5]}</td></tr>`
                    + `<tr><th>${K.rows[3]}</th><td>${s[6]}</td><td></td></tr>`
                    + `<tr><th>${K.rows[4]}</th><td></td><td>${s[7]}</td></tr></table>`
            }
        },
        eqAns: `${a}x+${r1}=${c}x-${r2}`,
        eqWrong: K.eqWrong,
        eqHint: K.eqHint,
        best: 'diagram',
        fit: {
            words:   {mark: '○', msg: `言葉の式でも書けるけれど、「${K.whole}」という見方は、線分図のほうがつかみやすいかも。`},
            diagram: {mark: '◎', msg: `線分図は、「${K.whole}」という関係が見やすい！`},
            table:   {mark: '△', msg: `表は1回目と2回目の数は整理しやすいけれど、「${K.whole}」という関係が表からは見えにくくて、少し使いづらかったかも。`}
        }
    };
}

const GENS  = {daikin: genDaikin, otsuri: genOtsuri, kafusoku: genKafusoku, hayasa: genHayasa};
const SPECS = {daikin: specDaikin, otsuri: specOtsuri, kafusoku: specKafusoku, hayasa: specHayasa};

/* ==========================================================================
   4. 画面・保存・記録【共通】
   ========================================================================== */
function resizeApp() {
    const scale = Math.min(window.innerWidth / 960, (window.innerHeight - 12) / 640, 1);
    container.style.transform = `scale(${scale})`;
}

function showScreen(id) {
    document.querySelectorAll('.app-screen').forEach(el => { el.style.display = 'none'; });
    $(id).style.display = 'flex';
}

function goStart() {
    renderStart();
    showScreen('screen-start');
}

function saveSession() {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(S)); } catch (e) { /* 保存失敗時は何もしない */ }
}

function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 何もしない */ }
}

function loadSession() {
    try {
        const s = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (s && GENS[s.typeId] && s.p && s.step) return s;
    } catch (e) { /* 読み込み失敗時は無視 */ }
    return null;
}

function saveRecords() {
    try { localStorage.setItem(RECORDS_KEY, JSON.stringify(R)); } catch (e) { /* 保存失敗時は何もしない */ }
}

function loadRecords() {
    let r = null;
    try { r = JSON.parse(localStorage.getItem(RECORDS_KEY)); } catch (e) { /* 初期化 */ }
    R = (r && r.types) ? r : {types: {}};
    TYPES.forEach(t => {
        R.types[t.id] = Object.assign({count: 0, words: 0, diagram: 0, table: 0}, R.types[t.id]);
    });
}

function renderStart() {
    const saved = loadSession();
    const btn = $('btn-resume');
    if (saved) {
        const t = TYPES.find(x => x.id === saved.typeId);
        btn.textContent = `▶ 続きから（${t.name}）`;
        btn.style.display = 'block';
    } else {
        btn.style.display = 'none';
    }
}

function renderTypeSelect() {
    $('type-grid').innerHTML = TYPES.map(t =>
        `<button class="type-btn" ${t.ready ? `onclick="openType('${t.id}')"` : 'disabled'}>${t.name}${t.ready ? '' : '（準備中）'}</button>`
    ).join('');
}

function renderKiroku() {
    $('kiroku-body').innerHTML = TYPES.map(t => {
        const r = R.types[t.id];
        return `<tr><th>${t.name}</th><td>${r.count}</td><td>${r.words}</td><td>${r.diagram}</td><td>${r.table}</td></tr>`;
    }).join('');
}

function openReset(type) {
    pendingReset = type;
    $('reset-msg').textContent = (type === 'records')
        ? 'タイプ別の記録がすべてリセットされます。よろしいですか？'
        : '途中経過（続きから再開するデータ）がリセットされます。よろしいですか？';
    $('reset-modal').style.display = 'flex';
}

function closeReset() {
    pendingReset = null;
    $('reset-modal').style.display = 'none';
}

function confirmReset() {
    if (pendingReset === 'records') {
        R = {types: {}};
        loadRecordsDefaults();
        saveRecords();
    } else if (pendingReset === 'session') {
        try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 何もしない */ }
        S = null;
    }
    closeReset();
}

function loadRecordsDefaults() {
    TYPES.forEach(t => { R.types[t.id] = {count: 0, words: 0, diagram: 0, table: 0}; });
}

function setHand(hand) {
    $('game-layout').classList.toggle('left-handed', hand === 'left');
    $('hand-left-btn').classList.toggle('active', hand === 'left');
    $('hand-right-btn').classList.toggle('active', hand === 'right');
}

/* ==========================================================================
   5. 演習の進行【共通】
   ========================================================================== */
function newSession(typeId) {
    return {typeId: typeId, p: GENS[typeId](), step: 'var', method: null, filled: 0, miss: 0};
}

function buildSpec() {
    return SPECS[S.typeId](S.p);
}

function openType(id) {
    const saved = loadSession();
    S = (saved && saved.typeId === id) ? saved : newSession(id);
    startExercise();
}

function resumeSession() {
    S = loadSession();
    if (S) startExercise();
}

function startExercise() {
    hintMsg = '';
    enterStep();
    saveSession();
    showScreen('screen-exercise');
    render();
}

/* --- ステップに入る時に選択肢をシャッフルして保持する --- */
function enterStep() {
    wrongOpts = [];
    const sp = buildSpec();
    if (S.step === 'var') curOpts = shuffle([sp.varAns, ...sp.varWrong]);
    else if (S.step === 'fill') curOpts = shuffle(sp.fill[S.method].pool);
    else if (S.step === 'eq') curOpts = shuffle([sp.eqAns, ...sp.eqWrong]);
    else curOpts = [];
}

/* --- 画面に出す選択肢（穴埋め済みのものは除く） --- */
function visibleOpts() {
    if (S.step !== 'fill') return curOpts;
    const rest = curOpts.slice();
    buildSpec().fill[S.method].slots.slice(0, S.filled).forEach(sl => {
        const i = rest.indexOf(sl.ans);
        if (i >= 0) rest.splice(i, 1);
    });
    return rest;
}

function pickMethod(m) {
    S.method = m;
    S.filled = 0;
    S.step = 'fill';
    R.types[S.typeId][m]++;
    saveRecords();
    hintMsg = '光っている空欄から順に埋めていこう。';
    enterStep();
    saveSession();
    render();
}

function switchMethod() {
    S.step = 'method';
    S.method = null;
    S.filled = 0;
    hintMsg = '別の方法で整理し直してみよう。やりにくいと感じたことが大事なヒントだよ。';
    enterStep();
    saveSession();
    render();
}

function nextProblem() {
    S = newSession(S.typeId);
    hintMsg = '';
    enterStep();
    saveSession();
    render();
}

function choose(i) {
    const sp = buildSpec();
    const opt = visibleOpts()[i];
    lastOpt = opt;
    if (S.step === 'var') {
        answer(opt === sp.varAns, '今回求めたいものは何かな？問題文の最後の一文を読み直そう。', () => { S.step = 'method'; });
    } else if (S.step === 'fill') {
        const spec = sp.fill[S.method];
        const slot = spec.slots[S.filled];
        answer(opt === slot.ans, slot.hint, () => {
            S.filled++;
            if (S.filled === spec.slots.length) S.step = 'eq';
        });
    } else if (S.step === 'eq') {
        answer(opt === sp.eqAns, sp.eqHint, () => {
            S.step = 'done';
            R.types[S.typeId].count++;
            saveRecords();
        });
    }
}

function answer(ok, hint, onOk) {
    if (ok) {
        const before = S.step;
        hintMsg = 'いいね！その調子！';
        wrongOpts = [];
        onOk();
        if (S.step !== before) enterStep();
    } else {
        S.miss++;
        hintMsg = hint;
        if (!wrongOpts.includes(lastOpt)) wrongOpts.push(lastOpt);
    }
    if (S.step === 'done') clearSession();
    else saveSession();
    render();
}

/* ==========================================================================
   6. 描画【共通】
   ========================================================================== */
function slotHtml(sp, filled) {
    /* 言葉の式では、選択肢についている（円）（時間）（km）などの単位を外して表示する */
    const shown = ans => (S.method === 'words') ? ans.replace(/（[^（）]*）$/, '') : ans;
    return sp.fill[S.method].slots.map((s, i) =>
        i < filled
            ? `<span class="slot ok">${shown(s.ans)}</span>`
            : `<span class="slot${i === filled ? ' act' : ''}">？</span>`
    );
}

function optButtons(list) {
    return list.map((o, i) =>
        `<button class="opt${wrongOpts.includes(o) ? ' wrong' : ''}" onclick="choose(${i})">${o}</button>`
    ).join('');
}

function methodCards() {
    return '<div class="cards">' + Object.keys(METHODS).map(k =>
        `<button class="card" onclick="pickMethod('${k}')"><div class="card-icon">${METHODS[k].icon}</div><b>${METHODS[k].label}</b><span>${METHODS[k].desc}</span></button>`
    ).join('') + '</div>';
}

function render() {
    const sp = buildSpec();
    const type = TYPES.find(t => t.id === S.typeId);
    $('ex-title').textContent = `一次方程式の利用（${type.name}）`;
    $('problem-box').textContent = sp.text;
    $('talk').textContent = TALK[S.step];
    $('hint-text').innerHTML = hintMsg;

    const xline = (S.step === 'var') ? '' : `<div class="xline">${sp.varAns}をxとおく</div>`;
    const mhead = S.method ? `<div class="mhead">整理方法：${METHODS[S.method].icon} ${METHODS[S.method].label}</div>` : '';
    let work = '';
    let optTitle = '';
    let opts = '';
    let one = false;

    if (S.step === 'var') {
        work = '<div class="bigq"><span class="slot act">？</span>をxとおく</div>';
        optTitle = 'x にあてはまるものは？';
        opts = optButtons(visibleOpts());
        one = true;
    } else if (S.step === 'method') {
        work = xline + methodCards();
        optTitle = '← 整理の方法を選んでね';
    } else if (S.step === 'fill') {
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, S.filled));
        optTitle = 'あてはまるものを選ぼう';
        opts = optButtons(visibleOpts());
    } else if (S.step === 'eq') {
        const n = sp.fill[S.method].slots.length;
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, n))
            + '<div class="bigq">方程式：<span class="slot act">？</span></div>';
        optTitle = '方程式を選ぼう';
        opts = optButtons(visibleOpts());
        one = true;
    } else {
        const n = sp.fill[S.method].slots.length;
        const f = sp.fit[S.method];
        const best = (S.method !== sp.best) ? `<br>この問題は「${METHODS[sp.best].label}」がいちばん整理しやすいよ。` : '';
        const miss = (S.miss === 0) ? 'ノーミス！' : `まちがい ${S.miss}回`;
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, n))
            + `<div class="bigq">方程式：<span class="slot ok">${sp.eqAns}</span></div>`;
        $('hint-text').innerHTML = `${miss}　この方法との相性：${f.mark}<br><br>${f.msg}${best}`;
        opts = '<button class="opt next" onclick="nextProblem()">次の問題へ ▶</button>';
    }

    $('work-area').innerHTML = work;
    $('opt-title').textContent = optTitle;
    $('hint-box').className = 'hint-container' + (S.step === 'done' ? ' wide' : '');
    $('opt-grid').className = 'opt-grid' + (one ? ' one' : '') + (S.step === 'done' ? ' done' : '');
    $('opt-grid').innerHTML = opts;
    $('switch-btn').disabled = !(S.step === 'fill' || S.step === 'eq');
}

/* ==========================================================================
   7. 初期化【共通】
   ========================================================================== */
window.addEventListener('resize', resizeApp);
window.addEventListener('DOMContentLoaded', () => {
    resizeApp();
    loadRecords();
    renderStart();
    showScreen('screen-start');
});
</script>
