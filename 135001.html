/* ==========================================================================
   5. 演習の進行【共通】
   ========================================================================== */
/* --- 各タイプのパターンを同じ割合で出題する（1周に全パターンを1回ずつ。ブラウザを閉じるとリセット） --- */
const PATTERNS = {
    k_kafusoku: ['k1', 'k2'],
    k_hirei: ['k1', 'k2', 'k3'],
    k_hayasa: ['k1', 'k2', 'k3'],
    k_otsuri: ['k1', 'k2', 'k3', 'k4'],
    k_daikin: ['k1', 'k2', 'k3', 'k4'],
    otsuri:   ['basic', 'a1', 'count'],
    daikin:   ['basic', 'bai', 'zan'],
    kafusoku: ['haifu', 'seki', 'kai'],
    hayasa:   ['dist', 'time', 'oikake', 'chigai', 'deau'],
    hirei:    ['mix', 'ratio', 'recipe', 'add', 'give'],
    nenrei:   ['now', 'ratio', 'diff', 'sum'],
    wariai:   ['waribiki', 'zouka', 'nokori', 'megane'],
    hatten1:  ['fixed'],
    hatten2:  ['fixed']
};

function pickPattern(typeId) {
    let bag = {};
    try { bag = JSON.parse(sessionStorage.getItem(BAG_KEY)) || {}; } catch (e) { bag = {}; }
    bag.last = bag.last || {};
    if (!Array.isArray(bag[typeId]) || bag[typeId].length === 0) {
        const next = shuffle(PATTERNS[typeId]);
        if (next.length > 1 && next[0] === bag.last[typeId]) next.push(next.shift());
        bag[typeId] = next;
    }
    const kind = bag[typeId].shift();
    bag.last[typeId] = kind;
    try { sessionStorage.setItem(BAG_KEY, JSON.stringify(bag)); } catch (e) { /* 保存失敗時は何もしない */ }
    return kind;
}

function newSession(typeId) {
    return {typeId: typeId, p: GENS[typeId](pickPattern(typeId)), step: 'var', method: null, fills: null, sel: 0, miss: 0};
}

function buildSpec() {
    const sp = SPECS[S.typeId](S.p);
    /* 整理方法ごとに方程式の形が違う問題は、選んだ方法の形に置き換える */
    const forms = (S.method && EQ_FORMS[S.typeId]) ? EQ_FORMS[S.typeId](S.p)[S.method] : null;
    if (forms) {
        sp.eqAns = forms.ans;
        sp.eqWrong = forms.wrong;
        sp.eqHint = forms.hint;
    }
    return sp;
}

function openType(id) {
    const saved = loadSession();
    S = (saved && saved.typeId === id) ? saved : newSession(id);
    startExercise();
}

function resumeSession() {
    S = loadSession();
    if (S) startExercise();
}

function startExercise() {
    hintMsg = '';
    if (S.step === 'fill' && !Array.isArray(S.fills)) {
        const n = S.filled || 0;
        S.fills = buildSpec().fill[S.method].slots.map((q, i) => i < n);
        S.sel = n;
    }
    enterStep();
    saveSession();
    showScreen('screen-exercise');
    render();
}

/* --- ステップに入る時に選択肢をシャッフルして保持する --- */
function enterStep() {
    wrongOpts = [];
    kbReset();
    const sp = buildSpec();
    if (S.step === 'var') curOpts = shuffle([sp.varAns, ...sp.varWrong]);
    else if (S.step === 'fill') curOpts = shuffle(sp.fill[S.method].pool);
    else if (S.step === 'eq') curOpts = shuffle([sp.eqAns, ...sp.eqWrong]);
    else curOpts = [];
}

/* --- 画面に出す選択肢（穴埋め済みのものは除く） --- */
function visibleOpts() {
    if (S.step !== 'fill') return curOpts;
    const rest = curOpts.slice();
    buildSpec().fill[S.method].slots.forEach((q, k) => {
        if (!S.fills[k]) return;
        const i = rest.indexOf(q.ans);
        if (i >= 0) rest.splice(i, 1);
    });
    return rest;
}

/* --- 整理エリアの空欄をタップして、入力する空欄を選ぶ --- */
function selectSlot(i) {
    if (!HATTEN[S.typeId] || S.step !== 'fill' || S.fills[i]) return;
    S.sel = i;
    wrongOpts = [];
    kbReset();
    hintMsg = 'この空欄にあてはまるものを入力しよう。';
    saveSession();
    render();
}

function pickMethod(m) {
    S.method = m;
    S.fills = buildSpec().fill[m].slots.map(() => false);
    S.sel = 0;
    S.step = 'fill';
    hintMsg = HATTEN[S.typeId]
        ? '光っている空欄に入るものを入力しよう。ほかの空欄をタップして、先に入れることもできるよ。'
        : '光っている空欄から順に埋めていこう。';
    enterStep();
    saveSession();
    render();
}

function switchMethod() {
    S.step = 'method';
    S.method = null;
    S.fills = null;
    S.sel = 0;
    hintMsg = '別の方法で整理し直してみよう。やりにくいと感じたことが大事なヒントだよ。';
    enterStep();
    saveSession();
    render();
}

function nextProblem() {
    S = newSession(S.typeId);
    hintMsg = '';
    enterStep();
    saveSession();
    render();
}

function choose(i) {
    const sp = buildSpec();
    const opt = visibleOpts()[i];
    lastOpt = opt;
    if (S.step === 'var') {
        answer(opt === sp.varAns, '今回求めたいものは何かな？問題文の最後の一文を読み直そう。', () => { S.step = 'method'; });
    } else if (S.step === 'fill') {
        const spec = sp.fill[S.method];
        const slot = spec.slots[S.sel];
        answer(opt === slot.ans, slot.hint, () => fillOk(spec));
    } else if (S.step === 'eq') {
        answer(opt === sp.eqAns, sp.eqHint, eqOk);
    }
}

function answer(ok, hint, onOk) {
    if (ok) {
        const before = S.step;
        hintMsg = 'いいね！その調子！';
        wrongOpts = [];
        kbReset();
        onOk();
        if (S.step !== before) enterStep();
    } else {
        S.miss++;
        kbMiss = true;
        hintMsg = hint;
        if (!wrongOpts.includes(lastOpt)) wrongOpts.push(lastOpt);
    }
    if (S.step === 'done') clearSession();
    else saveSession();
    render();
}

/* ==========================================================================
   5b. 発展問題のキー入力【固有】
   ・整理の空欄：「選択肢にあるもの」と同じ書き方だけが正解
   ・方程式：約分した式・項を入れ替えた式・移項した式は正解（計算を進めた式は不正解）
   ・まちがえたあとだけ、そのステップを選択式に切り替えられる
   ========================================================================== */
let kbInput = '';
let kbMiss = false;
let kbSel = false;

function kbReset() {
    kbInput = '';
    kbMiss = false;
    kbSel = false;
}

function useKb() {
    return !!HATTEN[S.typeId] && (S.step === 'fill' || S.step === 'eq') && !kbSel;
}

/* --- 選択肢の書き方（LaTeX・単位つき）を、キーで入力する書き方にそろえる --- */
function kbPlain(ans) {
    let s = ans.replace(/（[^（）]*）$/, '');
    s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, (m, a, b) => (/[+\-]/.test(a) ? `(${a})` : a) + '/' + b);
    return s;
}

/* --- 入力した式の読み取り（足し算・引き算の項／数・x・かっこの積／分数） --- */
function kbParse(text) {
    let pos = 0;
    const fail = () => { throw new Error('parse'); };
    const peek = () => text[pos];
    const isNumCh = c => c !== undefined && /[0-9.]/.test(c);

    function parseNumber() {
        let s = '';
        while (isNumCh(text[pos])) {
            s += text[pos];
            pos++;
        }
        if (!/^\d+(\.\d+)?$/.test(s)) fail();
        return s;
    }
    function parseFactor() {
        const c = peek();
        if (c === 'x') {
            pos++;
            return {k: 'x'};
        }
        if (c === '(') {
            pos++;
            const sum = parseSum();
            if (peek() !== ')') fail();
            pos++;
            return {k: 'group', sum: sum};
        }
        if (isNumCh(c)) return {k: 'num', v: parseNumber()};
        return fail();
    }
    function parseTerm() {
        const factors = [parseFactor()];
        while (pos < text.length && (isNumCh(text[pos]) || text[pos] === 'x' || text[pos] === '(')) {
            factors.push(parseFactor());
        }
        if (peek() === '/') {
            pos++;
            return {k: 'frac', num: factors, den: parseNumber()};
        }
        return {k: 'prod', factors: factors};
    }
    function parseSum() {
        const terms = [];
        let sign = 1;
        if (peek() === '+' || peek() === '-') {
            sign = (peek() === '-') ? -1 : 1;
            pos++;
        }
        terms.push({sign: sign, t: parseTerm()});
        while (peek() === '+' || peek() === '-') {
            sign = (peek() === '-') ? -1 : 1;
            pos++;
            terms.push({sign: sign, t: parseTerm()});
        }
        return terms;
    }

    const sides = [parseSum()];
    if (peek() === '=') {
        pos++;
        sides.push(parseSum());
    }
    if (pos !== text.length) fail();
    return sides;
}

function kbGcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) {
        const t = a % b;
        a = b;
        b = t;
    }
    return a;
}

function kbRat(str) {
    const parts = str.split('.');
    const dec = parts[1] ? parts[1].length : 0;
    const n = parseInt(parts[0] + (parts[1] || ''), 10);
    const d = Math.pow(10, dec);
    const g = kbGcd(n, d) || 1;
    return [n / g, d / g];
}

function kbRatStr(r) {
    return (r[1] === 1) ? String(r[0]) : `${r[0]}/${r[1]}`;
}

/* --- 書き方をそろえた文字列（項の順番・約分だけを無視して比べる） --- */
function kbCanonFactor(f) {
    if (f.k === 'x') return 'x';
    if (f.k === 'num') return kbRatStr(kbRat(f.v));
    return '(' + kbCanonSum(f.sum) + ')';
}

function kbCanonTerm(t) {
    if (t.k === 'prod') return t.factors.map(kbCanonFactor).join('*');
    const den = parseInt(t.den, 10);
    if (!den || String(den) !== t.den.replace(/^0+(?=\d)/, '')) {
        return 'FR(' + t.num.map(kbCanonFactor).join('*') + '|' + t.den + ')';
    }
    const nf = t.num;
    if (nf.length === 1 && nf[0].k === 'num') {
        const r = kbRat(nf[0].v);
        const n = r[0];
        const d = r[1] * den;
        const g = kbGcd(n, d) || 1;
        return kbRatStr([n / g, d / g]);
    }
    const isInt = v => /^\d+$/.test(v);
    let coef = 1;
    let mono = null;
    if (nf.length === 1 && nf[0].k === 'x') mono = true;
    if (nf.length === 2 && nf[0].k === 'num' && isInt(nf[0].v) && nf[1].k === 'x') {
        coef = parseInt(nf[0].v, 10);
        mono = true;
    }
    if (mono) {
        const g = kbGcd(coef, den) || 1;
        const c2 = coef / g;
        const d2 = den / g;
        const body = (c2 === 1) ? 'x' : `${c2}*x`;
        return (d2 === 1) ? body : `FR(${body}|${d2})`;
    }
    return 'FR(' + nf.map(kbCanonFactor).join('*') + '|' + den + ')';
}

function kbCanonSum(terms) {
    return terms.map(x => (x.sign < 0 ? '-' : '+') + kbCanonTerm(x.t)).sort().join(';');
}

/* --- 方程式：すべての項を左辺に集めた形にして比べる（左右の入れ替え・移項はOK） --- */
function kbEqList(sides) {
    const list = [];
    sides[0].forEach(x => list.push([x.sign, kbCanonTerm(x.t)]));
    sides[1].forEach(x => list.push([-x.sign, kbCanonTerm(x.t)]));
    return list.filter(e => e[1] !== '0');
}

function kbEqKey(list, neg) {
    return list.map(e => ((e[0] * (neg ? -1 : 1)) > 0 ? '+' : '-') + e[1]).sort().join(';');
}

/* --- ヒント用：式の値のうえで同じ式か（まとめた・かっこを外した式の見分けに使う） --- */
function kbLin(f) {
    if (f.k === 'x') return {a: 1, b: 0};
    if (f.k === 'num') return {a: 0, b: parseFloat(f.v)};
    return kbLinSum(f.sum);
}

function kbLinTerm(t) {
    const mul = (p, q) => {
        if (!p || !q) return null;
        if (p.a !== 0 && q.a !== 0) return null;
        return {a: p.a * q.b + q.a * p.b, b: p.b * q.b};
    };
    let r = {a: 0, b: 1};
    const fs = (t.k === 'frac') ? t.num : t.factors;
    for (const f of fs) {
        r = mul(r, kbLin(f));
        if (!r) return null;
    }
    if (t.k === 'frac') {
        const d = parseFloat(t.den);
        if (!d) return null;
        r = {a: r.a / d, b: r.b / d};
    }
    return r;
}

function kbLinSum(terms) {
    let r = {a: 0, b: 0};
    for (const x of terms) {
        const v = kbLinTerm(x.t);
        if (!v) return null;
        r = {a: r.a + x.sign * v.a, b: r.b + x.sign * v.b};
    }
    return r;
}

function kbLinEq(sides) {
    const l = kbLinSum(sides[0]);
    const r = kbLinSum(sides[1]);
    if (!l || !r) return null;
    return {a: l.a - r.a, b: l.b - r.b};
}

/* 'ok'：正解／'calc'：正しい式だが計算を進めている／'ng'：ちがう式／'syntax'：式として読み取れない */
function kbEqJudge(text, correctPlain) {
    let u;
    let c;
    try {
        u = kbParse(text);
    } catch (e) {
        return 'syntax';
    }
    if (u.length !== 2) return 'syntax';
    c = kbParse(correctPlain);
    const ul = kbEqList(u);
    const cl = kbEqList(c);
    const uk = kbEqKey(ul, false);
    if (uk === kbEqKey(cl, false) || uk === kbEqKey(cl, true)) return 'ok';
    const lu = kbLinEq(u);
    const lc = kbLinEq(c);
    if (lu && lc && (lu.a !== 0 || lu.b !== 0)) {
        if (Math.abs(lu.a * lc.b - lu.b * lc.a) < 1e-9 && (lc.a !== 0 || lc.b !== 0)) return 'calc';
    }
    return 'ng';
}

/* 空欄：数量は合っているが書き方（順番・約分）がちがうか */
function kbSlotSameForm(text, ansPlain) {
    try {
        return kbCanonSum(kbParse(text)[0]) === kbCanonSum(kbParse(ansPlain)[0]);
    } catch (e) {
        return false;
    }
}

/* --- 入力中の式の表示（読み取れるときは分数の形で表示） --- */
function kbTexTerm(t) {
    const fac = f => {
        if (f.k === 'x') return 'x';
        if (f.k === 'num') return f.v;
        return '(' + kbTexSum(f.sum) + ')';
    };
    if (t.k === 'prod') return t.factors.map(fac).join('');
    const num = (t.num.length === 1 && t.num[0].k === 'group') ? kbTexSum(t.num[0].sum) : t.num.map(fac).join('');
    return `\\frac{${num}}{${t.den}}`;
}

function kbTexSum(terms) {
    return terms.map((x, i) => (x.sign < 0 ? '-' : (i > 0 ? '+' : '')) + kbTexTerm(x.t)).join('');
}

function kbPreviewHtml(text) {
    if (!text) return '<span class="kb-ph">ここに入力</span>';
    let sides = null;
    try {
        sides = kbParse(text);
    } catch (e) {
        sides = null;
    }
    if (!sides) return `<span class="kb-raw">${text.replace(/-/g, '−')}</span>`;
    return '\\(' + sides.map(kbTexSum).join('=') + '\\)';
}

function kbRefreshDisp() {
    const el = $('kb-disp');
    if (!el) return;
    el.innerHTML = kbPreviewHtml(kbInput);
    if (window.MathJax && MathJax.startup && MathJax.typesetPromise) {
        MathJax.startup.promise = MathJax.startup.promise
            .then(() => MathJax.typesetPromise([el]))
            .catch(() => { /* 数式の描画に失敗しても進行は止めない */ });
    }
}

function kbKey(c) {
    if (!useKb() || kbInput.length >= 40) return;
    kbInput += c;
    kbRefreshDisp();
}

function kbBack() {
    if (!useKb()) return;
    kbInput = kbInput.slice(0, -1);
    kbRefreshDisp();
}

/* --- 「決定」：空欄または方程式を判定する --- */
function kbEnter() {
    if (!useKb() || !kbInput) return;
    const sp = buildSpec();
    const text = kbInput;
    lastOpt = '⌨' + text;
    if (S.step === 'fill') {
        const spec = sp.fill[S.method];
        const slot = spec.slots[S.sel];
        const ansPlain = kbPlain(slot.ans);
        let hint = slot.hint;
        if (text !== ansPlain) {
            let parsed = true;
            try {
                kbParse(text);
            } catch (e) {
                parsed = false;
            }
            if (!parsed) hint = '入力の形を見直そう。分数は、分子を入力してから「/」を押して、分母を入力するよ。<br>' + slot.hint;
            else if (kbSlotSameForm(text, ansPlain)) hint = '数量は合っているよ。書き方（項の順番や約分）を、ヒントに合わせて見直そう。<br>' + slot.hint;
        }
        answer(text === ansPlain, hint, () => fillOk(spec));
    } else {
        const res = kbEqJudge(text, kbPlain(sp.eqAns));
        let hint = sp.eqHint;
        if (res === 'syntax') hint = '式になっていないよ。「＝」を1つ入れて、かっこや分数の書き方も見直してみよう。';
        if (res === 'calc') hint = '正しい式だけど、計算を進めているよ。まとめたり、かっこを外したりせずに、問題文のとおりに式をつくろう。';
        answer(res === 'ok', hint, eqOk);
    }
}

/* --- まちがえたあとだけ、選択式に切り替えられる --- */
function kbToSelect() {
    if (!kbMiss) return;
    kbSel = true;
    wrongOpts = [];
    render();
}

function kbToInput() {
    kbSel = false;
    kbInput = '';
    wrongOpts = [];
    render();
}

function kbPadHtml() {
    const key = (label, code, cls, off) =>
        `<button class="kbk${cls ? ' ' + cls : ''}"${off ? ' disabled' : ''} onclick="${code}">${label}</button>`;
    const ch = c => key(c, `kbKey('${c}')`);
    const eqOff = (S.step !== 'eq');
    return `<div class="kb-disp" id="kb-disp">${kbPreviewHtml(kbInput)}</div>`
        + '<div class="kb-pad">'
        + ch('7') + ch('8') + ch('9') + key('⌫', 'kbBack()', 'back')
        + ch('4') + ch('5') + ch('6') + ch('(')
        + ch('1') + ch('2') + ch('3') + ch(')')
        + ch('0') + ch('.') + ch('x') + ch('/')
        + ch('+') + key('−', "kbKey('-')") + key('＝', "kbKey('=')", '', eqOff) + key('決定', 'kbEnter()', 'enter')
        + '</div>'
        + `<button class="kbk sw"${kbMiss ? '' : ' disabled'} onclick="kbToSelect()">選択式にする（まちがえたら使える）</button>`;
}

function kbBackBtn() {
    return HATTEN[S.typeId] ? '<button class="opt back-kb" onclick="kbToInput()">⌨ キー入力にもどる</button>' : '';
}

/* --- 選択式・キー入力で共通の「正解したあとの処理」 --- */
function fillOk(spec) {
    S.fills[S.sel] = true;
    const next = spec.slots.findIndex((q, k) => !S.fills[k] && k > S.sel);
    const first = S.fills.indexOf(false);
    if (first < 0) S.step = 'eq';
    else S.sel = (next >= 0) ? next : first;
}

function eqOk() {
    S.step = 'done';
    const rec = R.types[S.typeId] || (R.types[S.typeId] = {count: 0, nomiss: 0, words: 0, diagram: 0, table: 0});
    rec.count++;
    rec[S.method]++;
    if (S.miss === 0) rec.nomiss++;
    saveRecords();
}

/* ==========================================================================
   6. 描画【共通】
   ========================================================================== */
function slotHtml(sp, allDone) {
    /* 言葉の式では、選択肢についている（円）（時間）（km）などの単位を外して表示する */
    const shown = ans => (S.method === 'words') ? ans.replace(/（[^（）]*）$/, '') : ans;
    return sp.fill[S.method].slots.map((s, i) =>
        (allDone || S.fills[i])
            ? `<span class="slot ok">${toMath(shown(s.ans))}</span>`
            : (i === S.sel)
                ? '<span class="slot act">？</span>'
                : (HATTEN[S.typeId]
                    ? `<span class="slot pick" onclick="selectSlot(${i})">？</span>`
                    : '<span class="slot">？</span>')
    );
}

/* --- 解答枠・選択肢をMathJaxで表示するために、数式部分を \( \) で囲む（（円）などの単位は式の外） --- */
function toMath(str) {
    const m = str.match(/^(.*?)(（[^（）]*）)?$/);
    return `\\(${m[1]}\\)${m[2] || ''}`;
}

function typeset() {
    if (window.MathJax && MathJax.startup && MathJax.typesetPromise) {
        MathJax.startup.promise = MathJax.startup.promise
            .then(() => MathJax.typesetPromise([$('work-area'), $('opt-grid'), $('hint-box')]))
            .catch(() => { /* 数式の描画に失敗しても進行は止めない */ });
    }
}

function optButtons(list) {
    return list.map((o, i) =>
        `<button class="opt${wrongOpts.includes(o) ? ' wrong' : ''}" onclick="choose(${i})">${S.step === 'var' ? o : toMath(o)}</button>`
    ).join('');
}

function methodCards() {
    return '<div class="cards">' + Object.keys(METHODS).map(k =>
        `<button class="card" onclick="pickMethod('${k}')"><div class="card-icon">${METHODS[k].icon}</div><b>${METHODS[k].label}</b><span>${METHODS[k].desc}</span></button>`
    ).join('') + '</div>';
}

function eqWord() {
    return (S.typeId === 'hirei') ? '比例式' : '方程式';
}

function render() {
    const sp = buildSpec();
    $('ex-title').textContent = `一次方程式の利用（${typeName(S.typeId)}）`;
    $('problem-box').className = 'problem-box' + (sp.long ? ' long' : '');
    $('problem-box').textContent = sp.text;
    const talk = (S.step === 'fill' && HATTEN[S.typeId]) ? TALK.fillSel : TALK[S.step];
    $('talk').textContent = talk.replace('方程式', eqWord());
    $('hint-text').innerHTML = hintMsg;

    const xline = (S.step === 'var') ? '' : `<div class="xline">${sp.xText || (sp.varAns + 'をxとおく')}</div>`;
    const mhead = S.method ? `<div class="mhead">整理方法：${METHODS[S.method].icon} ${METHODS[S.method].label}</div>` : '';
    const head = (xline || mhead) ? `<div class="xrow${sp.xText ? ' xwrap' : ''}">${xline}${mhead}</div>` : '';
    let work = '';
    let optTitle = '';
    let opts = '';
    let one = false;
    let kbOn = false;

    if (S.step === 'var') {
        work = '<div class="bigq"><span class="slot act">？</span>をxとおく</div>';
        optTitle = 'x にあてはまるものは？';
        opts = optButtons(visibleOpts());
        one = true;
    } else if (S.step === 'method') {
        work = head + methodCards();
        optTitle = '← 整理の方法を選んでね';
    } else if (S.step === 'fill') {
        work = head + sp.fill[S.method].layout(slotHtml(sp, false));
        if (useKb()) {
            optTitle = 'キーパッドで入力しよう';
            opts = kbPadHtml();
            kbOn = true;
        } else {
            optTitle = 'あてはまるものを選ぼう';
            opts = optButtons(visibleOpts()) + kbBackBtn();
        }
    } else if (S.step === 'eq') {
        work = head + sp.fill[S.method].layout(slotHtml(sp, true))
            + `<div class="bigq">${eqWord()}：<span class="slot act">？</span></div>`;
        if (useKb()) {
            optTitle = eqWord() + 'をキーパッドで入力しよう';
            opts = kbPadHtml();
            kbOn = true;
        } else {
            optTitle = eqWord() + 'を選ぼう';
            opts = optButtons(visibleOpts()) + kbBackBtn();
            one = true;
        }
    } else {
        const f = sp.fit[S.method];
        const best = (S.method !== sp.best) ? `<br>この問題は「${METHODS[sp.best].label}」がいちばん整理しやすいよ。` : '';
        const miss = (S.miss === 0) ? 'ノーミス！' : `まちがい ${S.miss}回`;
        work = head + sp.fill[S.method].layout(slotHtml(sp, true))
            + `<div class="bigq">${eqWord()}：<span class="slot ok">${toMath(sp.eqAns)}</span></div>`;
        $('hint-text').innerHTML = `${miss}　この方法との相性：${f.mark}<br><br>${f.msg}${best}`;
        opts = HATTEN[S.typeId]
            ? '<button class="opt next" onclick="backNyushi()">発展問題にもどる ▶</button>'
            : '<button class="opt next" onclick="nextProblem()">次の問題へ ▶</button>';
    }

    $('work-area').innerHTML = work;
    $('opt-title').textContent = optTitle;
    $('hint-box').className = 'hint-container' + (S.step === 'done' ? ' wide' : '');
    $('opt-grid').className = 'opt-grid' + (one ? ' one' : '') + (kbOn ? ' kb' : '') + (S.step === 'done' ? ' done' : '');
    $('opt-grid').innerHTML = opts;
    $('switch-btn').disabled = !(S.step === 'fill' || S.step === 'eq');
    typeset();
}

/* ==========================================================================
   7. 初期化【共通】
   ========================================================================== */
window.addEventListener('resize', resizeApp);
window.addEventListener('DOMContentLoaded', () => {
    resizeApp();
    loadRecords();
    renderStart();
    showScreen('screen-start');
});
</script>
</body>
</html>
