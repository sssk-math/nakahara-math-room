<script>
/* ==========================================================================
   1. グローバル変数・保存キー【共通】
   ========================================================================== */
const SESSION_KEY = 'riyou_session_v1';
const RECORDS_KEY = 'riyou_records_v1';
const BAG_KEY = 'riyou_bag_v1';
const container = document.getElementById('app-container');
const $ = id => document.getElementById(id);

let S = null;          // 現在の問題の状態
let R = null;          // 記録
let curOpts = [];      // 右パネルの選択肢（シャッフル済み）
let hintMsg = '';
let wrongOpts = [];    // まちがえて選んだ選択肢（赤く表示する）
let lastOpt = '';      // 直前に押した選択肢
let pendingReset = null;

/* ==========================================================================
   2. タイプ一覧・整理方法・出題文言【固有】
   ========================================================================== */
const TYPES = [
    {id: 'otsuri',   name: '代金とおつり',     ready: true},
    {id: 'daikin',   name: '個数と代金',       ready: true},
    {id: 'awasete',  name: '合わせて〇個',     ready: false},
    {id: 'kafusoku', name: '過不足',           ready: true},
    {id: 'nenrei',   name: '年齢',             ready: false},
    {id: 'heikin',   name: '平均',             ready: false},
    {id: 'wariai',   name: '割合',             ready: false},
    {id: 'noudo',    name: '食塩水・濃度',     ready: false},
    {id: 'hayasa',   name: '道のり・速さ・時間', ready: true},
    {id: 'hirei',    name: '比例式',           ready: true}
];
const METHODS = {
    words:   {label: '言葉の式', icon: '📝', desc: '言葉で「〇＋〇＝〇」と表す'},
    diagram: {label: '線分図',   icon: '📏', desc: '全体と部分を線で表す'},
    table:   {label: '表',       icon: '📊', desc: '縦横のマスに整理する'}
};
const TALK = {
    var:    '① 求めたいものを文字 x でおこう。何を x とおく？',
    method: '② 整理の方法を選ぼう。やりにくければ途中で変えてもOK！',
    fill:   '③ 選んだ方法で整理しよう。空欄にあてはまるものをタップ！',
    eq:     '④ 整理をもとに、方程式をつくろう。',
    done:   '🎉 立式できたね！'
};

/* --- 乱数ユーティリティ --- */
function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
/* --- 選択肢の組み立て：正解（同じ文字列が複数あってもそのまま）＋まぎらわしい選択肢（重複は除く） --- */
function mkPool(answers, distractors) {
    return [...answers, ...distractors.filter((d, i) => !answers.includes(d) && distractors.indexOf(d) === i)];
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* ==========================================================================
   3. 問題生成・問題データ：個数と代金【固有】
   ========================================================================== */
function genDaikin(kind) {
    if (kind === 'bai') return genDaikinBai();
    if (kind === 'zan') return genDaikinZan();
    const pairs = [
        ['りんご', '個', 'みかん', '個'],
        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(5, 20) * 10;
        x = randInt(3, 20) * 10;
        p = randInt(2, 8);
        q = randInt(2, 8);
    } while (a === x || p === q);
    return {A, uA, B, uB, a, x, p, q, T: a * p + q * x};
}

function specDaikin(p) {
    if (p.kind === 'bai') return specDaikinBai(p);
    if (p.kind === 'zan') return specDaikinZan(p);
    const uA = p.uA || '個';
    const uB = p.uB || '個';
    const U = (uA === uB) ? uA : `${uA}・${uB}`;   // 表の「数量」行の単位
    const ap = `${p.a}\\times ${p.p}（円）`;
    const aq = `${p.a}\\times ${p.q}（円）`;
    const xq = `${p.q}x（円）`;
    const xp = `${p.p}x（円）`;
    const tot = `${p.T}（円）`;
    const f1 = Math.round(Math.min(0.65, Math.max(0.35, (p.a * p.p) / p.T)) * 100);
    const f2 = 100 - f1;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;

    const slots3 = [
        {ans: ap,  hint: `${p.A}の代金は「単価×数量」だよ。`},
        {ans: xq,  hint: `${p.B}1${uB}の値段が x 円。${p.q}${uB}分の代金は？`},

function genOtsuri(kind) {
    if (kind === 'a1') return genOtsuriA1();
    if (kind === 'count') return genOtsuriCount();
    const pairs = [
        ['りんご', '個', 'みかん', '個'],
        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(3, 15) * 10;
        x = randInt(3, 15) * 10;
        p = randInt(2, 6);
        q = randInt(2, 6);
    } while (a === x || p === q || (Math.floor((a * p + q * x) / 500) + 1) * 500 === 2 * (a * p + q * x));
    const T = a * p + q * x;
    const M = (Math.floor(T / 500) + 1) * 500;
    return {A, uA, B, uB, a, x, p, q, T, M, c: M - T};
}

   ========================================================================== */
const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));

function genHayasa(kind) {
    if (kind === 'oikake') return genOikake();
    if (kind === 'chigai') return genChigai();
    if (kind === 'deau') return genDeau();
    const places = [['家', '駅'], ['学校', '図書館'], ['公園', '店'], ['駅', '病院']];
    const [P, Q] = places[randInt(0, places.length - 1)];

    if (kind === 'dist') {
        const sp = [3, 4, 5, 6, 8, 10, 12];
        let a, b, x, T;
        do {
            a = sp[randInt(0, sp.length - 1)];
            b = sp[randInt(0, sp.length - 1)];
            x = (a * b / gcd(a, b)) * randInt(1, 3);
            T = x / a + x / b;
        } while (a === b || x > 60 || T > 15);
        return {kind: 'dist', P, Q, a, b, x, T};
    }

    let a, b, x, t;
    do {
        a = randInt(3, 6);
        b = [8, 9, 10, 12][randInt(0, 3)];
        x = randInt(1, 4);
        t = randInt(1, 3);
    } while (x === t);
    return {kind: 'time', P, Q, a, b, x, t, D: a * x + b * t};
}

            diagram: {mark: '○', msg: '道のりの線分図は「全体＝部分の和」が見やすいけれど、速さと時間の関係までは表のほうが整理しやすいよ。'},
            table:   {mark: '◎', msg: '表は「速さ・時間・道のり」の関係を縦横に整理できて、速さ×時間＝道のり の計算が見えやすい！'}
        }
    };
}

/* ==========================================================================
   3d. 問題生成・問題データ：過不足【固有】
   kind='haifu'：配る問題／kind='seki'：長椅子・食卓に座る問題／kind='kai'：クラス費を集める問題
   どれも「人数（または数）をx」とおき、a x + r1 = c x − r2 の形になる
   ========================================================================== */
function genHaifu() {
    const items = [
        ['えんぴつ', '本', '生徒'],
        ['あめ', '個', '子ども'],
        ['色紙', '枚', '生徒'],
        ['みかん', '個', '子ども'],
        ['ノート', '冊', '生徒']
    ];
    const [A, u, H] = items[randInt(0, items.length - 1)];
    let a, d, x, r1, r2;
    do {
        a = randInt(2, 6);
        d = randInt(1, 3);
        x = randInt(6, 25);
        r1 = randInt(2, 20);
        r2 = d * x - r1;
    } while (r2 < 2 || r2 > 25 || r1 === r2);
    return {kind: 'haifu', A, u, H, a, c: a + d, x, r1, r2};
}

function genSeki() {
    const nouns = [['長椅子', '脚'], ['食卓', '台']];
    const [N, U] = nouns[randInt(0, nouns.length - 1)];
    let a, d, c, t, x, r1, r2;
    do {
        a = randInt(3, 8);
        d = randInt(1, 2);
        c = a + d;
        t = randInt(1, c - 1);
        x = randInt(5, 20);
        r2 = c - t;
        r1 = d * x - r2;
    } while (r1 < 2 || r1 > 25 || r2 === t);
    return {kind: 'seki', N, U, a, c, t, x, r1, r2};
}

/* --- クラス費：不足が「＋」、余りが「－」になる紛らわしい問題 --- */
function genKai() {
    let a, d, x, r1, r2;
    do {
        a = randInt(4, 8) * 50;
        d = randInt(1, 2) * 50;
        x = randInt(25, 40);
        r1 = randInt(2, 20) * 50;
        r2 = d * x - r1;
    } while (r2 < 100 || r2 > 1500 || r1 > 1500 || r1 === r2);
    return {kind: 'kai', a, c: a + d, x, r1, r2};
}

function genKafusoku(kind) {
    if (kind === 'seki') return genSeki();
    if (kind === 'kai') return genKai();
    return genHaifu();
}

function specKafusoku(p) {
    const {a, c, r1, r2} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
    const clamp = (r, lo, hi) => Math.round(Math.min(hi, Math.max(lo, r)) * 100);

    /* --- 問題ごとの文言・選択肢・ヒント（w：言葉の式、d：線分図） --- */
    let K;
    if (p.kind === 'seki') {
        const {N, U, t} = p;
        const ax = `${a}x（席）`;
        const cx = `${c}x（席）`;
        const hAx = `${a}人ずつ座るとき、${N}1${U}の座席は${a}席。座席の数は「1${U}の席数×${U}の数」だよ。`;
        const hCx = `${c}人ずつ座るときの座席の数も「1${U}の席数×${U}の数」だよ。`;
        const hLast = `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いている座席は何席？`;
        K = {
            text: `${N}を何${U}か並べます。集まった人たちが${N}1${U}に${a}人ずつ座ると${r1}人が座れず、${c}人ずつ座ると${t}人だけ座った${N}が1${U}できました。${N}は全部で何${U}ありますか。`,
            varAns: `${N}の数`,
            varWrong: ['集まった人たちの人数', `${N}1${U}に座る人数`, '座れなかった人数'],
            wNames: ['座席の数', '過不足', '座席の数', '過不足'],
            wAns: [ax, `+${r1}（人）`, cx, `-${r2}（人）`],
            wExtra: [`-${t}（人）`, `+${r2}（人）`, `-${r1}（人）`, `${a + c}x（席）`],
            wHints: [
                hAx,
                `${a}人ずつ座ると${r1}人が座れないね。人が余るので＋の符号をつけて選ぼう。`,
                hCx,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いた席の分は人が足りないので、−の符号をつけよう。空いた席は何席？`
            ],
            dNames: ['座席の数', '余った人数', '座席の数', '余った座席数'],
            dAns: [ax, `${r1}（人）`, cx, `${r2}（席）`],
            dExtra: [`${a + c}x（席）`, `${t}（人）`],
            dHints: [hAx, `${a}人ずつ座ったときに座れなかった人数は、問題文に書いてあるよ。`, hCx, hLast],
            totalName: '集まった人数',
            th: [`${a}人ずつ`, `${c}人ずつ`],
            rows: ['座席の数（席）', '過不足（人）'],
            thints: [
                `${a}人ずつ座るとき、座席の数は「1${U}の席数×${U}の数」。1${U}の席数は${a}席、${U}の数は x だよ。`,
                `${c}人ずつ座るとき、座席の数は「1${U}の席数×${U}の数」。1${U}の席数は${c}席、${U}の数は x だよ。`,
                `${a}人ずつ座ると${r1}人が座れないね。人が余るときは＋の符号をつけよう。`,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いた席の分は人が足りないので、−の符号をつけよう。空いた席は何席？`
            ],
            tExtra: [`+${r2}`, `-${t}`, `${a + c}x`],
            eqWrong: [`${a}x+${r1}=${c}x-${t}`, `${a}x+${r1}=${c}x+${r2}`, `${c}x+${r1}=${a}x-${r2}`],
            eqHint: '集まった人数は「座席の数＋座れなかった人数」でも、「座席の数−空いた座席数」でも表せるよ。この2つが等しいことを式にしよう。',
            whole: '座り方が変わっても集まった人数は同じ'
        };
    } else if (p.kind === 'kai') {
        const ax = `${a}x（円）`;
        const cx = `${c}x（円）`;
        const hAx = `1人${a}円ずつ集めた金額は「1人分×人数」。クラスの人数を x 人とおいたね。`;
        const hCx = `1人${c}円ずつ集めた金額も「1人分×人数」だよ。`;
        const hShort = `${a}円ずつ集めると${r1}円不足するね。必要な金額は「集めた金額＋不足」と表せるので、式では不足に＋の符号をつけよう。`;
        const hOver = `${c}円ずつ集めると${r2}円余るね。必要な金額は「集めた金額−余り」と表せるので、式では余りに−の符号をつけよう。`;
        K = {
            text: `クラス費を集めることにしました。1人${a}円ずつ集めると${r1}円不足し、1人${c}円ずつ集めると${r2}円余ります。このクラスの人数を求めなさい。`,
            varAns: 'クラスの人数',
            varWrong: ['必要な金額', '1人から集める金額', '余った金額'],
            wNames: [`${a}円ずつ集めた金額`, '過不足', `${c}円ずつ集めた金額`, '過不足'],
            wAns: [ax, `+${r1}（円）`, cx, `-${r2}（円）`],
            wExtra: [`-${r1}（円）`, `+${r2}（円）`, `${a + c}x（円）`],
            wHints: [hAx, hShort, hCx, hOver],
            dNames: ['集めた金額', '不足', '集めた金額', '余り'],
            dAns: [ax, `${r1}（円）`, cx, `${r2}（円）`],
            dExtra: [`${a + c}x（円）`, `${r1 + r2}（円）`],
            dHints: [hAx, `${a}円ずつ集めたときの不足は問題文に書いてあるよ。`, hCx, `${c}円ずつ集めたときの余りは問題文に書いてあるよ。`],
            totalName: '必要な金額',
            th: [`1人${a}円ずつ`, `1人${c}円ずつ`],
            rows: ['集めた金額（円）', '過不足（円）'],
            thints: [
                `${a}円ずつ集めた金額は「1人分×人数」。人数は x 人だよ。`,
                `${c}円ずつ集めた金額は「1人分×人数」。人数は x 人だよ。`,
                hShort,
                hOver
            ],
            tExtra: [`-${r1}`, `+${r2}`, `${a + c}x`],
            eqWrong: [`${a}x-${r1}=${c}x+${r2}`, `${a}x+${r1}=${c}x+${r2}`, `${c}x+${r1}=${a}x-${r2}`],
            eqHint: '必要な金額は「集めた金額＋不足」でも「集めた金額−余り」でも表せるよ。不足は＋、余りは−になることに気をつけて、この2つが等しいことを式にしよう。',
            whole: 'どちらの集め方でも必要な金額は同じ'
        };
    } else {
        const {A, u, H} = p;
        const ax = `${a}x（${u}）`;
        const cx = `${c}x（${u}）`;
        const hAx = `${a}${u}ずつ配った数は「1人分×人数」。${H}の人数を x 人とおいたね。`;
        const hCx = `${c}${u}ずつ配った数も「1人分×人数」だよ。`;
        const hR2 = `${c}${u}ずつ配ったときの不足は問題文に書いてあるよ。`;
        K = {
            text: `${A}を何人かの${H}に配ります。${a}${u}ずつ配ると${r1}${u}余り、${c}${u}ずつ配ると${r2}${u}不足します。${H}の人数を求めなさい。`,
            varAns: `${H}の人数`,
            varWrong: [`${A}の全体の数`, `1人に配る${A}の数`, `余った${A}の数`],
            wNames: [`${a}${u}ずつ配る数`, '過不足', `${c}${u}ずつ配る数`, '過不足'],
            wAns: [ax, `+${r1}（${u}）`, cx, `-${r2}（${u}）`],
            wExtra: [`-${r1}（${u}）`, `+${r2}（${u}）`, `${a + c}x（${u}）`],
            wHints: [
                hAx,
                `${a}${u}ずつ配ると${r1}${u}余るね。余りは＋の符号をつけて選ぼう。`,
                hCx,
                `${c}${u}ずつ配ると${r2}${u}不足するね。不足は−の符号をつけて選ぼう。`
            ],
            dNames: ['配った数', '余り', '配った数', '不足'],
            dAns: [ax, `${r1}（${u}）`, cx, `${r2}（${u}）`],
            dExtra: [`${a + c}x（${u}）`, `${r1 + r2}（${u}）`],
            dHints: [hAx, `${a}${u}ずつ配ったときの余りは問題文に書いてあるよ。`, hCx, hR2],
            totalName: `全体の${A}の数`,
            th: [`${a}${u}ずつ`, `${c}${u}ずつ`],
            rows: [`配った数（${u}）`, `過不足（${u}）`],
            thints: [
                `${a}${u}ずつ配った数は「1人分×人数」。${H}の人数は x 人だよ。`,
                `${c}${u}ずつ配った数は「1人分×人数」。${H}の人数は x 人だよ。`,
                `${a}${u}ずつ配ると${r1}${u}余るね。余りは＋の符号をつけよう。`,
                `${c}${u}ずつ配ると${r2}${u}不足するね。不足は−の符号をつけよう。`
            ],
            tExtra: [`+${r2}`, `-${r1}`, `${a + c}x`],
            eqWrong: [`${c}x+${r1}=${a}x-${r2}`, `${a}x-${r1}=${c}x+${r2}`, `${a}x+${r1}=${c}x+${r2}`],
            eqHint: '「配った数＋余り」と「配った数−不足」は、どちらも全体の数。この2つが等しいことを式にしよう。',
            whole: 'どちらの配り方でも全体の数は同じ'
        };
    }

    const wSlots = K.wAns.map((ans, i) => ({ans: ans, hint: K.wHints[i]}));
    const wPool = [...new Set([...K.wAns, ...K.wExtra])];
    const dSlots = K.dAns.map((ans, i) => ({ans: ans, hint: K.dHints[i]}));
    const dPool = [...new Set([...K.dAns, ...K.dExtra])];

    const tans = [`${a}x`, `${c}x`, `+${r1}`, `-${r2}`];
    const tslots = tans.map((ans, i) => ({ans: ans, hint: K.thints[i]}));

    /* --- 線分図（上の線：a x + r1、下の線：全体 + 不足 = c x）を、用語の横に？を置いて小さくまとめる --- */
    const seg = f => `<div class="dg-seg" style="flex:${f}"></div>`;
    const part = (t, s, f) => `<div class="dg-part" style="flex:${f}"><div class="dg-bracket down"></div>${lab(t, s)}</div>`;
    const bar = (parts, w) => `<div style="width:${w}%"><div class="dg-line">${parts.map(q => seg(q[2])).join('')}</div>`
        + `<div class="dg-row">${parts.map(q => part(q[0], q[1], q[2])).join('')}</div></div>`;
    const T = a * p.x + r1;

    const diagramLayout = s => {
        const f1 = clamp((a * p.x) / T, 0.35, 0.65);
        const fr2 = clamp(r2 / (T + r2), 0.28, 0.4);
        const w1 = 100 - fr2;
        return '<div class="dg compact inline">'
            + bar([[K.dNames[0], s[0], f1], [K.dNames[1], s[1], 100 - f1]], w1)
            + `<div class="dg-top" style="margin-top:8px;">${lab(K.dNames[2], s[2])}</div><div class="dg-bracket up"></div>`
            + bar([[K.totalName, '', w1], [K.dNames[3], s[3], fr2]], 100)
            + '</div>';
    };

    return {
        text: K.text,
        varAns: K.varAns,
        varWrong: K.varWrong,
        fill: {
            words: {
                slots: wSlots,
                pool: wPool,
                layout: s => `<div class="words">${lab(K.wNames[0], s[0])}${lab(K.wNames[1], s[1])}<div class="op">＝</div>${lab(K.wNames[2], s[2])}${lab(K.wNames[3], s[3])}</div>`
            },
            diagram: {
                slots: dSlots,
                pool: dPool,
                layout: diagramLayout
            },
            table: {
                slots: tslots,
                pool: mkPool(tans, K.tExtra),
                layout: s => `<table class="tbl"><tr><th></th><th>${K.th[0]}</th><th>${K.th[1]}</th></tr>`
                    + `<tr><th>${K.rows[0]}</th><td>${s[0]}</td><td>${s[1]}</td></tr>`
                    + `<tr><th>${K.rows[1]}</th><td>${s[2]}</td><td>${s[3]}</td></tr></table>`
            }
        },
        eqAns: `${a}x+${r1}=${c}x-${r2}`,
        eqWrong: K.eqWrong,
        eqHint: K.eqHint,
        best: 'diagram',
        fit: {
            words:   {mark: '○', msg: `言葉の式でも書けるけれど、「${K.whole}」という見方は、線分図のほうがつかみやすいかも。`},
            diagram: {mark: '◎', msg: `線分図は、「${K.whole}」という関係が見やすい！`},
            table:   {mark: '△', msg: `表は1回目と2回目の数は整理しやすいけれど、「${K.whole}」という関係が表からは見えにくくて、少し使いづらかったかも。`}
        }
    };
}

/* ==========================================================================
   3e. 問題生成・問題データ：新パターン【固有】
   代金とおつり（A1個の値段／2つの値段で個数）・個数と代金（〇倍／兄弟の残金）
   道のり・速さ・時間（追いかける／時間が〇分違う／出会う）
   ========================================================================== */
const ITEMS = [
    ['りんご', '個'], ['みかん', '個'], ['鉛筆', '本'], ['消しゴム', '個'], ['クッキー', '枚'],
    ['あめ', '個'], ['おにぎり', '個'], ['パン', '個'], ['ノート', '冊'], ['ペン', '本']
];

function pickItems(n) {
    return shuffle(ITEMS).slice(0, n);
}

/* --- 新パターン用の共通部品（言葉の式・線分図・表） --- */
const sl = (ans, hint) => ({ans: ans, hint: hint});
const labT = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
const opT = o => `<div class="op">${o}</div>`;
const wordsT = parts => `<div class="words">${parts.join('')}</div>`;
const fracT = (n, d) => `\\frac{${n}}{${d}}`;
const clampT = (r, lo, hi) => Math.round(Math.min(hi, Math.max(lo, r)) * 100);
const segT = f => `<div class="dg-seg" style="flex:${f}"></div>`;
const partT = (t, s, f) => `<div class="dg-part" style="flex:${f}"><div class="dg-bracket down"></div>${labT(t, s)}</div>`;
const lineRowT = parts => `<div class="dg-line">${parts.map(q => segT(q[2])).join('')}</div>`
    + `<div class="dg-row">${parts.map(q => partT(q[0], q[1], q[2])).join('')}</div>`;
const barT = (parts, w) => `<div style="width:${w}%">${lineRowT(parts)}</div>`;
const barTopT = (t, s, parts, w) => `<div style="width:${w}%"><div class="dg-top">${labT(t, s)}</div><div class="dg-bracket up"></div>${lineRowT(parts)}</div>`;
const dgT = (inner, inline) => `<div class="dg compact${inline ? ' inline' : ''}">${inner}</div>`;
const dgI = inner => dgT(inner, true);
const tableT = (head, rows) => '<table class="tbl"><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>'
    + rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + '</table>';

/* ---------- 代金とおつり①：A1個の値段を求める ---------- */
function genOtsuriA1() {
    const [[A, uA], [B, uB]] = pickItems(2);
    let x, n, b, T, M;
    do {
        x = randInt(3, 15) * 10;
        n = randInt(2, 6);
        b = randInt(3, 15) * 10;
        T = n * x + b;
        M = (Math.floor(T / 500) + 1) * 500;
    } while (M === 2 * T || x === b);
    return {kind: 'a1', A, uA, B, uB, x, n, b, M, c: M - T};
}

function specOtsuriA1(p) {
    const {A, uA, B, uB, x, n, b, M, c} = p;
    const T = M - c;
    const U = (uA === uB) ? uA : `${uA}・${uB}`;
    const pay = `${M}（円）`;
    const ac = `${n}x（円）`;
    const bc = `${b}（円）`;
    const chg = `${c}（円）`;
    const slots4 = [
        sl(pay, '出した金額は問題文に書いてあるよ。'),
        sl(ac, `${A}1${uA}の値段を x 円とおいたね。${A}の代金は「単価×数量」だよ。`),
        sl(bc, `${B}は1${uB}だけ買ったね。${B}の代金は${b}円だよ。`),
        sl(chg, 'おつりは問題文に書いてあるよ。')
    ];
    const pool4 = [...new Set([pay, ac, bc, chg, `${b}\\times ${n}（円）`, `${T}（円）`])];
    const f = [n * x, b, c].map((w, i) => Math.max([34, 34, 24][i], Math.round(w / M * 100)));
    const tans = ['x', `${b}`, `${n}`, '1', `${n}x`, `${b}`, `${M}`, `${c}`];
    const thints = [
        `求めたいものを x とおいたね。${A}の単価の欄だよ。`,
        `${B}の単価は問題文に書いてあるよ。`,
        `${A}は何${uA}買ったかな？`,
        `${B}は何${uB}買ったかな？`,
        `${A}の代金は「単価×数量」。単価は x だよ。`,
        `${B}の代金は「単価×数量」。計算した数を選ぼう。`,
        '出した金額は問題文に書いてあるよ。',
        'おつりは問題文に書いてあるよ。'
    ];
    return {
        text: `${M}円で、${A}を${n}${uA}と、${b}円の${B}を1${uB}買うと、おつりは${c}円でした。${A}1${uA}の値段を求めなさい。`,
        varAns: `${A}1${uA}の値段`,
        varWrong: [`${B}1${uB}の値段`, `${A}の代金`, 'おつり'],
        fill: {
            words: {
                slots: slots4,
                pool: pool4,
                layout: s => wordsT([labT('出した金額', s[0]), opT('−'), opT('('), labT(`${A}の代金`, s[1]), opT('＋'), labT(`${B}の代金`, s[2]), opT(')'), opT('＝'), labT('おつり', s[3])])
            },
            diagram: {

                layout: s => tableT(['', `${A}の量（${uA}）`, `${B}の数（${uB}）`], [
                    ['はじめ', s[0], s[1]],
                    ['つくる', s[2], s[3]]
                ])
            }
        },
        eqAns: `${a}:${b}=x:${c}`,
        eqWrong: [`${a}:${b}=${c}:x`, `${b}:${a}=x:${c}`, `${a}:${c}=x:${b}`],
        eqHint: '「はじめの材料：はじめの個数 ＝ 必要な材料：つくる個数」を式にしよう。同じ種類のものを同じ側にそろえるよ。',
        best: 'words',
        fit: {
            words:   {mark: '◎', msg: '言葉の式は「はじめの材料：はじめの個数 ＝ 必要な材料：つくる個数」と、そのまま比例式にできる！'},
            diagram: {mark: '△', msg: '線分図は、材料と個数という単位のちがうものを1本の線に並べることになって、図に表しにくかったかも。'},
            table:   {mark: '○', msg: '表は「はじめ」と「つくる」を並べて整理できるけれど、比例式にするには言葉の式のほうが近道かも。'}
        }
    };
}

/* ---------- 比例式④：加えて比を合わせる ---------- */
function genHireiAdd() {
    const mats = [['小麦粉', '砂糖'], ['薄力粉', '砂糖'], ['米粉', '砂糖']];
    const [A, B] = mats[randInt(0, mats.length - 1)];
    let m, n, k, x, Q;
    do {
        m = randInt(2, 7);
        n = randInt(2, 7);
        k = randInt(2, 9) * 5;
        x = randInt(1, 6) * 5;
        Q = n * k - x;
    } while (m === n || gcd(m, n) !== 1 || Q < 10);
    return {kind: 'add', A, B, m, n, P: m * k, Q, x};
}

function specHireiAdd(p) {
    const {A, B, m, n, P, Q} = p;
    const slots4 = [
        sl(`${P}（g）`, `${A}の量は問題文に書いてあるよ。`),
        sl(`${Q}+x（g）`, `加えたあとの${B}の量は「もとの量＋加えた量」。加えた量を x g とおいたね。`),
        sl(`${m}`, `${A}の比は、問題文の「${m}：${n}」の左側だよ。`),
        sl(`${n}`, `${B}の比は、問題文の「${m}：${n}」の右側だよ。`)
    ];
    const pool4 = [...new Set([...slots4.map(q => q.ans), 'x（g）', `${Q}（g）`, `${P + Q}（g）`])];
    const tans = [`${P}`, `${Q}`, 'x', `${P}`, `${Q}+x`, `${m}`, `${n}`];
    const thints = [
        `${A}のはじめの量は問題文に書いてあるよ。`,
        `${B}のはじめの量は問題文に書いてあるよ。`,
        `求めたいもの（加えた${B}の量）を x とおいたね。${B}の「加える量」の欄だよ。`,
        `${A}は加えないので、加えたあとの量は、はじめの量と同じだよ。`,
        slots4[1].hint,
        slots4[2].hint,
        slots4[3].hint
    ];
    const f = clampT(m / (m + n), 0.35, 0.65);
    return {
        text: `${A}が${P}g、${B}が${Q}gある。${A}と${B}の重さの比が${m}：${n}になるように${B}を加えてケーキをつくる。加えた${B}の量を求めなさい。`,
        varAns: `加えた${B}の量`,
        varWrong: [`はじめの${B}の量`, `加えたあとの${B}の量`, `${A}の量`],
        fill: {
            words: {
                slots: slots4,
                pool: pool4,
                layout: s => wordsT([labT(`${A}の量`, s[0]), opT('：'), labT(`加えたあとの${B}の量`, s[1]), opT('＝'), labT(`${A}の比`, s[2]), opT('：'), labT(`${B}の比`, s[3])])
            },
            diagram: {
                slots: slots4,
                pool: pool4,
                layout: s => dgT(
                    bar2T([[`${A}の量`, s[0], `${A}の比`, s[2], f], [`加えたあとの${B}`, s[1], `${B}の比`, s[3], 100 - f]])
                )
            },
            table: {
                slots: tans.map((ans, i) => sl(ans, thints[i])),
                pool: mkPool(tans, [`${P + Q}`, `${Q}x`, `${P}+x`]),
                layout: s => tableT(['', A, B], [
                    ['はじめの量（g）', s[0], s[1]],
                    ['加える量（g）', '−', s[2]],
                    ['加えたあとの量（g）', s[3], s[4]],
                    ['比', s[5], s[6]]
                ])
            }
        },
        eqAns: `${P}:(${Q}+x)=${m}:${n}`,
        eqWrong: [`${P}:${Q}+x=${m}:${n}`, `${P}:(${Q}+x)=${n}:${m}`, `${P}:x=${m}:${n}`],
        eqHint: `「${A}の量：加えたあとの${B}の量 ＝ ${A}の比：${B}の比」を式にしよう。加えたあとの${B}の量は、かっこでひとまとめにするよ。`,
        best: 'table',
        fit: {
            words:   {mark: '○', msg: `言葉の式は「${A}の量：加えたあとの${B}の量 ＝ 比」と書けるけれど、「加えたあと」が「はじめの量＋x」になることを忘れやすいかも。`},
            diagram: {mark: '△', msg: '線分図は、加える前と加えたあとの量を図に表すと線が増えて、少し使いづらかったかも。'},
            table:   {mark: '◎', msg: '表は「はじめの量」「加えたあとの量」「比」を縦に整理できるので、加えたあとの量が「はじめ＋x」になることが見えやすい！'}
        }
    };
}

/* ---------- 比例式⑤：あげたあとの比 ---------- */
function genHireiGive() {
    const items = [['折り紙', '枚'], ['シール', '枚'], ['ビー玉', '個']];
    const pairs = [['姉', '妹'], ['兄', '弟']];
    const [A, u] = items[randInt(0, items.length - 1)];
    const [P1, P2] = pairs[randInt(0, pairs.length - 1)];
    let m, n, k, a;
    do {
        m = randInt(2, 15);
        n = randInt(m + 1, 20);
        k = randInt(1, 12);
        a = (m + n) * k / 2;
    } while (gcd(m, n) !== 1 || !Number.isInteger(a) || a % 10 !== 0 || a < 30 || a > 150 || (n - m) * k % 2 !== 0);
    return {kind: 'give', A, u, P1, P2, m, n, a, x: (n - m) * k / 2};
}

function specHireiGive(p) {
    const {A, u, P1, P2, m, n, a} = p;
    const slots4 = [
        sl(`${a}-x（${u}）`, `${P1}が x ${u}あげたので、${P1}の数は、もとの${a}${u}から x ${u}へるよ。`),
        sl(`${a}+x（${u}）`, `${P2}は x ${u}もらったので、${P2}の数は、もとの${a}${u}から x ${u}ふえるよ。`),
        sl(`${m}`, `${P1}の比は、問題文の「${m}：${n}」の左側だよ。`),
        sl(`${n}`, `${P2}の比は、問題文の「${m}：${n}」の右側だよ。`)
    ];
    const pool4 = [...new Set([...slots4.map(q => q.ans), `x（${u}）`, `${a}（${u}）`, `${a}x（${u}）`])];
    const tans = [`${a}`, `${a}`, `${a}-x`, `${a}+x`, `${m}`, `${n}`];
    const thints = [
        `${P1}のもとの数は問題文に書いてあるよ。`,
        `${P2}のもとの数は問題文に書いてあるよ。`,
        slots4[0].hint,
        slots4[1].hint,
        slots4[2].hint,
        slots4[3].hint
    ];
    const f = clampT(m / (m + n), 0.35, 0.65);
    return {
        text: `${P1}と${P2}が、${A}を${a}${u}ずつ持っている。${P1}が${P2}に何${u}かあげたら、${P1}と${P2}の持っている${A}の数の比は${m}：${n}になった。${P1}が${P2}にあげた${A}の数を求めなさい。`,
        varAns: `${P1}が${P2}にあげた${A}の数`,
        varWrong: [`${P1}のあとの${A}の数`, `${P2}のあとの${A}の数`, `${P1}と${P2}の${A}の合計`],
        fill: {
            words: {
                slots: slots4,
                pool: pool4,
                layout: s => wordsT([labT(`${P1}のあとの数`, s[0]), opT('：'), labT(`${P2}のあとの数`, s[1]), opT('＝'), labT(`${P1}の比`, s[2]), opT('：'), labT(`${P2}の比`, s[3])])
            },
            diagram: {
                slots: slots4,
                pool: pool4,
                layout: s => dgT(
                    bar2T([[`${P1}のあとの数`, s[0], `${P1}の比`, s[2], f], [`${P2}のあとの数`, s[1], `${P2}の比`, s[3], 100 - f]])
                )
            },
            table: {
                slots: tans.map((ans, i) => sl(ans, thints[i])),
                pool: mkPool(tans, ['x', `${m + n}`, `${a}x`]),
                layout: s => tableT(['', P1, P2], [
                    [`もとの数（${u}）`, s[0], s[1]],
                    [`あとの数（${u}）`, s[2], s[3]],
                    ['比', s[4], s[5]]
                ])
            }
        },
        eqAns: `${a}-x:${a}+x=${m}:${n}`,
        eqWrong: [`${a}-x:${a}+x=${n}:${m}`, `${a}+x:${a}-x=${m}:${n}`, `${a}-x:${a}=${m}:${n}`],
        eqHint: `「${P1}のあとの数：${P2}のあとの数 ＝ ${P1}の比：${P2}の比」を式にしよう。あげた${P1}はへり、もらった${P2}はふえるよ。`,
        best: 'table',
        fit: {
            words:   {mark: '○', msg: `言葉の式は「${P1}のあとの数：${P2}のあとの数 ＝ 比」と書けるけれど、へる・ふえるの向きを混ぜやすいかも。`},
            diagram: {mark: '△', msg: '線分図は、あげる前とあとで2人の数が変わる様子を図に表しにくくて、少し使いづらかったかも。'},
            table:   {mark: '◎', msg: '表は「もとの数」「あとの数」「比」を2人分並べて整理できるので、へる・ふえるの向きが見えやすい！'}
        }
    };
}
const GENS  = {
daikin: genDaikin, otsuri: genOtsuri, kafusoku: genKafusoku, hayasa: genHayasa, hirei: genHirei};
const SPECS = {daikin: specDaikin, otsuri: specOtsuri, kafusoku: specKafusoku, hayasa: specHayasa, hirei: specHirei};

   4. 画面・保存・記録【共通】

function resizeApp() {

function showScreen(id) {

}

function goStart() {

}

function saveSession() {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(S)); } catch (e) { /* 保存失敗時は何もしない */ }
}

function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 何もしない */ }
}

function loadSession() {
    try {
        const s = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (s && GENS[s.typeId] && s.p && s.step) return s;
    } catch (e) { /* 読み込み失敗時は無視 */ }

}

function saveRecords() {

}

function loadRecords() {

/* ==========================================================================
   5. 演習の進行【共通】
   ========================================================================== */
/* --- 各タイプのパターンを同じ割合で出題する（1周に全パターンを1回ずつ。ブラウザを閉じるとリセット） --- */
const PATTERNS = {
    otsuri:   ['basic', 'a1', 'count'],
    daikin:   ['basic', 'bai', 'zan'],
    kafusoku: ['haifu', 'seki', 'kai'],
    hayasa:   ['dist', 'time', 'oikake', 'chigai', 'deau'],
    hirei:    ['mix', 'ratio', 'recipe', 'add', 'give']
};

function pickPattern(typeId) {
    let bag = {};
    try { bag = JSON.parse(sessionStorage.getItem(BAG_KEY)) || {}; } catch (e) { bag = {}; }
    bag.last = bag.last || {};
    if (!Array.isArray(bag[typeId]) || bag[typeId].length === 0) {
        const next = shuffle(PATTERNS[typeId]);
        if (next.length > 1 && next[0] === bag.last[typeId]) next.push(next.shift());
        bag[typeId] = next;
    }
    const kind = bag[typeId].shift();
    bag.last[typeId] = kind;
    try { sessionStorage.setItem(BAG_KEY, JSON.stringify(bag)); } catch (e) { /* 保存失敗時は何もしない */ }
    return kind;
}

function newSession(typeId) {
    return {typeId: typeId, p: GENS[typeId](pickPattern(typeId)), step: 'var', method: null, filled: 0, miss: 0};
}

function buildSpec() {
    return SPECS[S.typeId](S.p);
}

function openType(id) {
    const saved = loadSession();
    S = (saved && saved.typeId === id) ? saved : newSession(id);
    startExercise();
}

function resumeSession() {
    S = loadSession();
    if (S) startExercise();
}

function startExercise() {
    hintMsg = '';
    enterStep();
    saveSession();
    showScreen('screen-exercise');
    render();
}

/* --- ステップに入る時に選択肢をシャッフルして保持する --- */
function enterStep() {
    wrongOpts = [];
    const sp = buildSpec();
    if (S.step === 'var') curOpts = shuffle([sp.varAns, ...sp.varWrong]);
    else if (S.step === 'fill') curOpts = shuffle(sp.fill[S.method].pool);
    else if (S.step === 'eq') curOpts = shuffle([sp.eqAns, ...sp.eqWrong]);
    else curOpts = [];
}

/* --- 画面に出す選択肢（穴埋め済みのものは除く） --- */
function visibleOpts() {
    if (S.step !== 'fill') return curOpts;
    const rest = curOpts.slice();
    buildSpec().fill[S.method].slots.slice(0, S.filled).forEach(sl => {
        const i = rest.indexOf(sl.ans);
        if (i >= 0) rest.splice(i, 1);
    });
    return rest;
}

function pickMethod(m) {
    S.method = m;
    S.filled = 0;
    S.step = 'fill';
    hintMsg = '光っている空欄から順に埋めていこう。';
    enterStep();
    saveSession();
    render();
}

function switchMethod() {
    S.step = 'method';
    S.method = null;
    S.filled = 0;
    hintMsg = '別の方法で整理し直してみよう。やりにくいと感じたことが大事なヒントだよ。';
    enterStep();
    saveSession();
    render();
}

function nextProblem() {
    S = newSession(S.typeId);
    hintMsg = '';
    enterStep();
    saveSession();
    render();
}

function choose(i) {
    const sp = buildSpec();
    const opt = visibleOpts()[i];
    lastOpt = opt;
    if (S.step === 'var') {
        answer(opt === sp.varAns, '今回求めたいものは何かな？問題文の最後の一文を読み直そう。', () => { S.step = 'method'; });
    } else if (S.step === 'fill') {
        const spec = sp.fill[S.method];
        const slot = spec.slots[S.filled];
        answer(opt === slot.ans, slot.hint, () => {
            S.filled++;
            if (S.filled === spec.slots.length) S.step = 'eq';
        });
    } else if (S.step === 'eq') {
        answer(opt === sp.eqAns, sp.eqHint, () => {
            S.step = 'done';
            const rec = R.types[S.typeId];
            rec.count++;
            rec[S.method]++;
            if (S.miss === 0) rec.nomiss++;
            saveRecords();
        });
    }
}

function answer(ok, hint, onOk) {
    if (ok) {
        const before = S.step;
        hintMsg = 'いいね！その調子！';
        wrongOpts = [];
        onOk();
        if (S.step !== before) enterStep();
    } else {
        S.miss++;
        hintMsg = hint;
        if (!wrongOpts.includes(lastOpt)) wrongOpts.push(lastOpt);
    }
    if (S.step === 'done') clearSession();
    else saveSession();
    render();
}

/* ==========================================================================
   6. 描画【共通】
   ========================================================================== */
function slotHtml(sp, filled) {
    /* 言葉の式では、選択肢についている（円）（時間）（km）などの単位を外して表示する */
    const shown = ans => (S.method === 'words') ? ans.replace(/（[^（）]*）$/, '') : ans;
    return sp.fill[S.method].slots.map((s, i) =>
        i < filled
            ? `<span class="slot ok">${toMath(shown(s.ans))}</span>`
            : `<span class="slot${i === filled ? ' act' : ''}">？</span>`
    );
}

/* --- 解答枠・選択肢をMathJaxで表示するために、数式部分を \( \) で囲む（（円）などの単位は式の外） --- */
function toMath(str) {
    const m = str.match(/^(.*?)(（[^（）]*）)?$/);
    return `\\(${m[1]}\\)${m[2] || ''}`;
}

function typeset() {
    if (window.MathJax && MathJax.startup && MathJax.typesetPromise) {
        MathJax.startup.promise = MathJax.startup.promise
            .then(() => MathJax.typesetPromise([$('work-area'), $('opt-grid')]))
            .catch(() => { /* 数式の描画に失敗しても進行は止めない */ });
    }
}

function optButtons(list) {
    return list.map((o, i) =>
        `<button class="opt${wrongOpts.includes(o) ? ' wrong' : ''}" onclick="choose(${i})">${S.step === 'var' ? o : toMath(o)}</button>`
    ).join('');
}

function methodCards() {
    return '<div class="cards">' + Object.keys(METHODS).map(k =>
        `<button class="card" onclick="pickMethod('${k}')"><div class="card-icon">${METHODS[k].icon}</div><b>${METHODS[k].label}</b><span>${METHODS[k].desc}</span></button>`
    ).join('') + '</div>';
}

function render() {
    const sp = buildSpec();
    const type = TYPES.find(t => t.id === S.typeId);
    $('ex-title').textContent = `一次方程式の利用（${type.name}）`;
    $('problem-box').textContent = sp.text;
    $('talk').textContent = TALK[S.step];
    $('hint-text').innerHTML = hintMsg;

    const xline = (S.step === 'var') ? '' : `<div class="xline">${sp.varAns}をxとおく</div>`;
    const mhead = S.method ? `<div class="mhead">整理方法：${METHODS[S.method].icon} ${METHODS[S.method].label}</div>` : '';
    let work = '';
    let optTitle = '';
    let opts = '';
    let one = false;

    if (S.step === 'var') {
        work = '<div class="bigq"><span class="slot act">？</span>をxとおく</div>';
        optTitle = 'x にあてはまるものは？';
        opts = optButtons(visibleOpts());
        one = true;
    } else if (S.step === 'method') {
        work = xline + methodCards();
        optTitle = '← 整理の方法を選んでね';
    } else if (S.step === 'fill') {
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, S.filled));
        optTitle = 'あてはまるものを選ぼう';
        opts = optButtons(visibleOpts());
    } else if (S.step === 'eq') {
        const n = sp.fill[S.method].slots.length;
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, n))
            + '<div class="bigq">方程式：<span class="slot act">？</span></div>';
        optTitle = '方程式を選ぼう';
        opts = optButtons(visibleOpts());
        one = true;
    } else {
        const n = sp.fill[S.method].slots.length;
        const f = sp.fit[S.method];
        const best = (S.method !== sp.best) ? `<br>この問題は「${METHODS[sp.best].label}」がいちばん整理しやすいよ。` : '';
        const miss = (S.miss === 0) ? 'ノーミス！' : `まちがい ${S.miss}回`;
        work = xline + mhead + sp.fill[S.method].layout(slotHtml(sp, n))
            + `<div class="bigq">方程式：<span class="slot ok">${toMath(sp.eqAns)}</span></div>`;
        $('hint-text').innerHTML = `${miss}　この方法との相性：${f.mark}<br><br>${f.msg}${best}`;
        opts = '<button class="opt next" onclick="nextProblem()">次の問題へ ▶</button>';
    }

    $('work-area').innerHTML = work;
    $('opt-title').textContent = optTitle;
    $('hint-box').className = 'hint-container' + (S.step === 'done' ? ' wide' : '');
    $('opt-grid').className = 'opt-grid' + (one ? ' one' : '') + (S.step === 'done' ? ' done' : '');
    $('opt-grid').innerHTML = opts;
    $('switch-btn').disabled = !(S.step === 'fill' || S.step === 'eq');
    typeset();
}

/* ==========================================================================
   7. 初期化【共通】
   ========================================================================== */
window.addEventListener('resize', resizeApp);
window.addEventListener('DOMContentLoaded', () => {
    resizeApp();
    loadRecords();
    renderStart();
    showScreen('screen-start');
});
</script>
