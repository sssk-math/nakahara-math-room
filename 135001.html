<div id="app-container">

    <div id="screen-start" class="app-screen center">

   ========================================================================== */
const SESSION_KEY = 'riyou_session_v1';
const RECORDS_KEY = 'riyou_records_v1';
const BAG_KEY = 'riyou_bag_v1';
const container = document.getElementById('app-container');
const $ = id => document.getElementById(id);

let S = null;          // 現在の問題の状態
let R = null;          // 記録
let curOpts = [];      // 右パネルの選択肢（シャッフル済み）
let hintMsg = '';
let wrongOpts = [];    // まちがえて選んだ選択肢（赤く表示する）
let lastOpt = '';      // 直前に押した選択肢
let pendingReset = null;

/* ==========================================================================
   2. タイプ一覧・整理方法・出題文言【固有】
   ========================================================================== */
const TYPES = [
    {id: 'daikin',   name: '個数と代金',       ready: true},
    {id: 'otsuri',   name: '代金とおつり',     ready: true},
    {id: 'awasete',  name: '合わせて〇個',     ready: false},
    {id: 'kafusoku', name: '過不足',           ready: true},
    {id: 'nenrei',   name: '年齢',             ready: true},
    {id: 'heikin',   name: '平均',             ready: false},

/* --- 乱数ユーティリティ --- */
function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
/* --- 選択肢の組み立て：正解（同じ文字列が複数あってもそのまま）＋まぎらわしい選択肢（重複は除く） --- */
function mkPool(answers, distractors) {
    return [...answers, ...distractors.filter((d, i) => !answers.includes(d) && distractors.indexOf(d) === i)];
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function genDaikin(kind) {
    if (kind === 'bai') return genDaikinBai();
    if (kind === 'zan') return genDaikinZan();
    const pairs = [
        ['りんご', '個', 'みかん', '個'],
        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(5, 20) * 10;
        x = randInt(3, 20) * 10;
        p = randInt(2, 8);
        q = randInt(2, 8);
    } while (a === x || p === q);
    return {A, uA, B, uB, a, x, p, q, T: a * p + q * x};
}

function genOtsuri(kind) {

    const pairs = [

        ['鉛筆', '本', '消しゴム', '個'],
        ['クッキー', '枚', 'あめ', '個'],
        ['おにぎり', '個', 'パン', '個'],
        ['ノート', '冊', 'ペン', '本']
    ];
    const [A, uA, B, uB] = pairs[randInt(0, pairs.length - 1)];
    let a, x, p, q;
    do {
        a = randInt(3, 15) * 10;

        q = randInt(2, 6);
    } while (a === x || p === q || (Math.floor((a * p + q * x) / 500) + 1) * 500 === 2 * (a * p + q * x));

/* ==========================================================================
   3c. 問題生成・問題データ：道のり・速さ・時間【固有】
   kind='dist'：道のりを求める（往復の時間の合計）／kind='time'：時間を求める（道のりの合計）
   ========================================================================== */
const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));

function genHayasa(kind) {
    if (kind === 'oikake') return genOikake();
    if (kind === 'chigai') return genChigai();
    if (kind === 'deau') return genDeau();
    const places = [['家', '駅'], ['学校', '図書館'], ['公園', '店'], ['駅', '病院']];
    const [P, Q] = places[randInt(0, places.length - 1)];

    if (kind === 'dist') {
        const sp = [3, 4, 5, 6, 8, 10, 12];
        let a, b, x, T;
        do {
            a = sp[randInt(0, sp.length - 1)];
            b = sp[randInt(0, sp.length - 1)];
            x = (a * b / gcd(a, b)) * randInt(1, 3);
            T = x / a + x / b;
        } while (a === b || x > 60 || T > 15);
        return {kind: 'dist', P, Q, a, b, x, T};
    }

    let a, b, x, t;
    do {
        a = randInt(3, 6);
        b = [8, 9, 10, 12][randInt(0, 3)];
        x = randInt(1, 4);
        t = randInt(1, 3);
    } while (x === t);
    return {kind: 'time', P, Q, a, b, x, t, D: a * x + b * t};
}

                words:   {mark: '○', msg: '言葉の式は「行きの時間＋帰りの時間＝往復の時間」と書けて、立式につながりやすいよ。'},
                diagram: {mark: '△', msg: '線分図は「全体＝部分の和」が見やすいけれど、この問題で足すのは「時間」。道のり x が行きと帰りで2回出てくるので、図に表しにくかったかも。'},
                table:   {mark: '◎', msg: '表は「速さ・時間・道のり」の関係を縦横に整理できるので、時間＝道のり÷速さ の計算が見えやすい！'}
            }
        };
    }

    /* --- 時間を求める（道のりの合計） --- */
    const walk = `${p.a}x（km）`;
    const run = `${p.b}\\times ${p.t}（km）`;
    const tot = `${p.D}（km）`;
    const names = ['歩いた道のり', '走った道のり', '全体の道のり'];
    const slots3 = [
        {ans: walk, hint: '歩いた道のりは「速さ×時間」。歩いた時間を x 時間とおいたね。'},
        {ans: run,  hint: `走った道のりも「速さ×時間」。時速${p.b}kmで${p.t}時間だよ。`},
        {ans: tot,  hint: '全体の道のりは問題文に書いてあるよ。'}
    ];
    const pool3 = [...new Set([walk, run, tot, `${p.b}x（km）`, `${p.a}\\times ${p.t}（km）`, `${p.a + p.b}（km）`])];
    const tslots = [
        {ans: `${p.a}`,       hint: '歩く速さは問題文に書いてあるよ。'},
        {ans: `${p.b}`,       hint: '走る速さは問題文に書いてあるよ。'},
        {ans: 'x',            hint: '求めたいものを x とおいたね。歩いた時間の欄だよ。'},
        {ans: `${p.t}`,       hint: '走った時間は問題文に書いてあるよ。'},
        {ans: `${p.a}x`,      hint: '歩いた道のりは「速さ×時間」。速さ × x だよ。'},
        {ans: `${p.b * p.t}`, hint: '走った道のりは「速さ×時間」。計算した数を選ぼう。'},
        {ans: `${p.D}`,       hint: '全体の道のりは問題文に書いてあるよ。'}
    ];
    return {
        text: `${p.P}から${p.Q}まで、はじめは時速${p.a}kmで歩き、そのあと時速${p.b}kmで${p.t}時間走ったところ、全部で${p.D}kmの道のりでした。歩いた時間は何時間ですか。`,
        varAns: '歩いた時間',
        varWrong: ['走った時間', '歩いた道のり', '全体の道のり'],
        fill: {
            words:   {slots: slots3, pool: pool3, layout: s => wordsHtml(names, s)},
            diagram: {slots: slots3, pool: pool3, layout: s => dgHtml(names, clamp((p.a * p.x) / p.D), s)},
            table: {
                slots: tslots,
                pool: mkPool(tslots.map(t => t.ans), [`${p.b}x`, `${p.a * p.t}`, `${p.a + p.b}`]),
                layout: s => `<table class="tbl"><tr><th></th><th>歩く</th><th>走る</th><th>合計</th></tr>`
                    + `<tr><th>道のり（km）</th><td>${s[4]}</td><td>${s[5]}</td><td>${s[6]}</td></tr>`
                    + `<tr><th>速さ（km/時）</th><td>${s[0]}</td><td>${s[1]}</td><td></td></tr>`
                    + `<tr><th>時間（時間）</th><td>${s[2]}</td><td>${s[3]}</td><td></td></tr></table>`
            }
        },
        eqAns: `${p.a}x+${p.b * p.t}=${p.D}`,
        eqWrong: [`${p.a}x+${p.b}x=${p.D}`, `${p.a * p.t}+${p.b}x=${p.D}`, `${p.a}+x+${p.b * p.t}=${p.D}`],
        eqHint: '「歩いた道のり＋走った道のり＝全体の道のり」を式にしよう。道のり＝速さ×時間。走った道のりは計算した数にしてね。',
        best: 'table',
        fit: {
            words:   {mark: '○', msg: '言葉の式は「歩いた道のり＋走った道のり＝全体の道のり」と、そのまま書けるね。'},
            diagram: {mark: '○', msg: '道のりの線分図は「全体＝部分の和」が見やすいけれど、速さと時間の関係までは表のほうが整理しやすいよ。'},
            table:   {mark: '◎', msg: '表は「速さ・時間・道のり」の関係を縦横に整理できて、速さ×時間＝道のり の計算が見えやすい！'}
        }
    };
}

/* ==========================================================================
   3d. 問題生成・問題データ：過不足【固有】
   kind='haifu'：配る問題／kind='seki'：長椅子・食卓に座る問題／kind='kai'：クラス費を集める問題
   どれも「人数（または数）をx」とおき、a x + r1 = c x − r2 の形になる
   ========================================================================== */
function genHaifu() {
    const items = [
        ['えんぴつ', '本', '生徒'],
        ['あめ', '個', '子ども'],
        ['色紙', '枚', '生徒'],
        ['みかん', '個', '子ども'],
        ['ノート', '冊', '生徒']
    ];
    const [A, u, H] = items[randInt(0, items.length - 1)];
    let a, d, x, r1, r2;
    do {
        a = randInt(2, 6);
        d = randInt(1, 3);
        x = randInt(6, 25);
        r1 = randInt(2, 20);
        r2 = d * x - r1;
    } while (r2 < 2 || r2 > 25 || r1 === r2);
    return {kind: 'haifu', A, u, H, a, c: a + d, x, r1, r2};
}

function genSeki() {
    const nouns = [['長椅子', '脚'], ['食卓', '台']];
    const [N, U] = nouns[randInt(0, nouns.length - 1)];
    let a, d, c, t, x, r1, r2;
    do {
        a = randInt(3, 8);
        d = randInt(1, 2);
        c = a + d;
        t = randInt(1, c - 1);
        x = randInt(5, 20);
        r2 = c - t;
        r1 = d * x - r2;
    } while (r1 < 2 || r1 > 25 || r2 === t);
    return {kind: 'seki', N, U, a, c, t, x, r1, r2};
}

/* --- クラス費：不足が「＋」、余りが「－」になる紛らわしい問題 --- */
function genKai() {
    let a, d, x, r1, r2;
    do {
        a = randInt(4, 8) * 50;
        d = randInt(1, 2) * 50;
        x = randInt(25, 40);
        r1 = randInt(2, 20) * 50;
        r2 = d * x - r1;
    } while (r2 < 100 || r2 > 1500 || r1 > 1500 || r1 === r2);
    return {kind: 'kai', a, c: a + d, x, r1, r2};
}

function genKafusoku(kind) {
    if (kind === 'seki') return genSeki();
    if (kind === 'kai') return genKai();
    return genHaifu();
}

function specKafusoku(p) {
    const {a, c, r1, r2} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;

    /* --- 問題ごとの文言・選択肢・ヒント（w：言葉の式、d：線分図） --- */
    let K;

        const {N, U, t} = p;

        const cx = `${c}x（席）`;
        const hAx = `${a}人ずつ座るとき、${N}1${U}の座席は${a}席。座席の数は「1${U}の席数×${U}の数」だよ。`;
        const hCx = `${c}人ずつ座るときの座席の数も「1${U}の席数×${U}の数」だよ。`;
        const hLast = `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いている座席は何席？`;

            text: `${N}を何${U}か並べます。集まった人たちが${N}1${U}に${a}人ずつ座ると${r1}人が座れず、${c}人ずつ座ると${t}人だけ座った${N}が1${U}できました。${N}は全部で何${U}ありますか。`,
            varAns: `${N}の数`,
            varWrong: ['集まった人たちの人数', `${N}1${U}に座る人数`, '座れなかった人数'],
            wNames: ['座席の数', '過不足', '座席の数', '過不足'],
            wAns: [ax, `+${r1}（人）`, cx, `-${r2}（人）`],
            wExtra: [`-${t}（人）`, `+${r2}（人）`, `-${r1}（人）`, `${a + c}x（席）`],
            wHints: [
                hAx,
                `${a}人ずつ座ると${r1}人が座れないね。人が余るので＋の符号をつけて選ぼう。`,
                hCx,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いた席の分は人が足りないので、−の符号をつけよう。空いた席は何席？`
            ],
            dNames: ['座席の数', '余った人数', '座席の数', '余った座席数'],
            dAns: [ax, `${r1}（人）`, cx, `${r2}（席）`],
            dExtra: [`${a + c}x（席）`, `${t}（人）`],
            dHints: [hAx, `${a}人ずつ座ったときに座れなかった人数は、問題文に書いてあるよ。`, hCx, hLast],
            totalName: '集まった人数',
            th: [`${a}人ずつ`, `${c}人ずつ`],
            rows: ['座席の数（席）', '過不足（人）'],
            thints: [
                `${a}人ずつ座るとき、座席の数は「1${U}の席数×${U}の数」。1${U}の席数は${a}席、${U}の数は x だよ。`,
                `${c}人ずつ座るとき、座席の数は「1${U}の席数×${U}の数」。1${U}の席数は${c}席、${U}の数は x だよ。`,
                `${a}人ずつ座ると${r1}人が座れないね。人が余るときは＋の符号をつけよう。`,
                `最後の${N}1${U}は、${c}席のうち${t}人だけが座ったね。空いた席の分は人が足りないので、−の符号をつけよう。空いた席は何席？`
            ],
            tExtra: [`+${r2}`, `-${t}`, `${a + c}x`],
            eqWrong: [`${a}x+${r1}=${c}x-${t}`, `${a}x+${r1}=${c}x+${r2}`, `${c}x+${r1}=${a}x-${r2}`],
            eqHint: '集まった人数は「座席の数＋座れなかった人数」でも、「座席の数−空いた座席数」でも表せるよ。この2つが等しいことを式にしよう。',
            whole: '座り方が変わっても集まった人数は同じ'
        };
    } else if (p.kind === 'kai') {
        const ax = `${a}x（円）`;
        const cx = `${c}x（円）`;
        const hAx = `1人${a}円ずつ集めた金額は「1人分×人数」。クラスの人数を x 人とおいたね。`;
        const hCx = `1人${c}円ずつ集めた金額も「1人分×人数」だよ。`;
        const hShort = `${a}円ずつ集めると${r1}円不足するね。必要な金額は「集めた金額＋不足」と表せるので、式では不足に＋の符号をつけよう。`;
        const hOver = `${c}円ずつ集めると${r2}円余るね。必要な金額は「集めた金額−余り」と表せるので、式では余りに−の符号をつけよう。`;
        K = {
            text: `クラス費を集めることにしました。1人${a}円ずつ集めると${r1}円不足し、1人${c}円ずつ集めると${r2}円余ります。このクラスの人数を求めなさい。`,
            varAns: 'クラスの人数',
            varWrong: ['必要な金額', '1人から集める金額', '余った金額'],
            wNames: [`${a}円ずつ集めた金額`, '過不足', `${c}円ずつ集めた金額`, '過不足'],
            wAns: [ax, `+${r1}（円）`, cx, `-${r2}（円）`],
            wExtra: [`-${r1}（円）`, `+${r2}（円）`, `${a + c}x（円）`],
            wHints: [hAx, hShort, hCx, hOver],
            dNames: ['集めた金額', '不足', '集めた金額', '余り'],
            dAns: [ax, `${r1}（円）`, cx, `${r2}（円）`],
            dExtra: [`${a + c}x（円）`, `${r1 + r2}（円）`],
            dHints: [hAx, `${a}円ずつ集めたときの不足は問題文に書いてあるよ。`, hCx, `${c}円ずつ集めたときの余りは問題文に書いてあるよ。`],
            totalName: '必要な金額',
            th: [`1人${a}円ずつ`, `1人${c}円ずつ`],
            rows: ['集めた金額（円）', '過不足（円）'],
            thints: [
                `${a}円ずつ集めた金額は「1人分×人数」。人数は x 人だよ。`,
                `${c}円ずつ集めた金額は「1人分×人数」。人数は x 人だよ。`,
                hShort,
                hOver
            ],
            tExtra: [`-${r1}`, `+${r2}`, `${a + c}x`],

        };
    } else {
        const {A, u, H} = p;
        const ax = `${a}x（${u}）`;
        const cx = `${c}x（${u}）`;
        const hAx = `${a}${u}ずつ配った数は「1人分×人数」。${H}の人数を x 人とおいたね。`;
        const hCx = `${c}${u}ずつ配った数も「1人分×人数」だよ。`;
        const hR2 = `${c}${u}ずつ配ったときの不足は問題文に書いてあるよ。`;
        K = {
            text: `${A}を何人かの${H}に配ります。${a}${u}ずつ配ると${r1}${u}余り、${c}${u}ずつ配ると${r2}${u}不足します。${H}の人数を求めなさい。`,
            varAns: `${H}の人数`,
            varWrong: [`${A}の全体の数`, `1人に配る${A}の数`, `余った${A}の数`],
            wNames: [`${a}${u}ずつ配る数`, '過不足', `${c}${u}ずつ配る数`, '過不足'],
            wAns: [ax, `+${r1}（${u}）`, cx, `-${r2}（${u}）`],
            wExtra: [`-${r1}（${u}）`, `+${r2}（${u}）`, `${a + c}x（${u}）`],
            wHints: [
                hAx,
                `${a}${u}ずつ配ると${r1}${u}余るね。余りは＋の符号をつけて選ぼう。`,
                hCx,
                `${c}${u}ずつ配ると${r2}${u}不足するね。不足は−の符号をつけて選ぼう。`
            ],
            dNames: ['配った数', '余り', '配った数', '不足'],
            dAns: [ax, `${r1}（${u}）`, cx, `${r2}（${u}）`],
            dExtra: [`${a + c}x（${u}）`, `${r1 + r2}（${u}）`],
            dHints: [hAx, `${a}${u}ずつ配ったときの余りは問題文に書いてあるよ。`, hCx, hR2],
            totalName: `全体の${A}の数`,
            th: [`${a}${u}ずつ`, `${c}${u}ずつ`],
            rows: [`配った数（${u}）`, `過不足（${u}）`],
            thints: [
                `${a}${u}ずつ配った数は「1人分×人数」。${H}の人数は x 人だよ。`,
                `${c}${u}ずつ配った数は「1人分×人数」。${H}の人数は x 人だよ。`,
                `${a}${u}ずつ配ると${r1}${u}余るね。余りは＋の符号をつけよう。`,
                `${c}${u}ずつ配ると${r2}${u}不足するね。不足は−の符号をつけよう。`
            ],
            tExtra: [`+${r2}`, `-${r1}`, `${a + c}x`],
            eqWrong: [`${c}x+${r1}=${a}x-${r2}`, `${a}x-${r1}=${c}x+${r2}`, `${a}x+${r1}=${c}x+${r2}`],
            eqHint: '「配った数＋余り」と「配った数−不足」は、どちらも全体の数。この2つが等しいことを式にしよう。',
            whole: 'どちらの配り方でも全体の数は同じ'
        };
    }

    const wSlots = K.wAns.map((ans, i) => ({ans: ans, hint: K.wHints[i]}));
    const wPool = [...new Set([...K.wAns, ...K.wExtra])];
    const dSlots = K.dAns.map((ans, i) => ({ans: ans, hint: K.dHints[i]}));
    const dPool = [...new Set([...K.dAns, ...K.dExtra])];

    const tans = [`${a}x`, `${c}x`, `+${r1}`, `-${r2}`];
    const tslots = tans.map((ans, i) => ({ans: ans, hint: K.thints[i]}));

    /* --- 線分図（上の線：a x + r1、下の線：全体 + 不足 = c x）を、用語の横に？を置いて小さくまとめる --- */
    const seg = f => `<div class="dg-seg" style="flex:${f}"></div>`;
    const part = (t, s, f) => `<div class="dg-part" style="flex:${f}"><div class="dg-bracket down"></div>${lab(t, s)}</div>`;
    const bar = (parts, w) => `<div style="width:${w}%"><div class="dg-line">${parts.map(q => seg(q[2])).join('')}</div>`
        + `<div class="dg-row">${parts.map(q => part(q[0], q[1], q[2])).join('')}</div></div>`;
    const T = a * p.x + r1;

    const diagramLayout = s => {
        const f1 = clamp((a * p.x) / T, 0.35, 0.65);
        const fr2 = clamp(r2 / (T + r2), 0.28, 0.4);
        const w1 = 100 - fr2;
        return '<div class="dg compact inline">'
            + barTopT(K.totalName, '', [[K.dNames[0], s[0], f1], [K.dNames[1], s[1], 100 - f1]], w1)
            + `<div class="dg-top" style="margin-top:8px;">${lab(K.dNames[2], s[2])}</div><div class="dg-bracket up"></div>`
            + bar([[K.totalName, '', w1], [K.dNames[3], s[3], fr2]], 100)
            + '</div>';
    };

    return {
        text: K.text,
        varAns: K.varAns,
        varWrong: K.varWrong,
        fill: {
            words: {
                slots: wSlots,
                pool: wPool,
                layout: s => `<div class="words">${lab(K.wNames[0], s[0])}${lab(K.wNames[1], s[1])}<div class="op">＝</div>${lab(K.wNames[2], s[2])}${lab(K.wNames[3], s[3])}</div>`
            },
            diagram: {
                slots: dSlots,
                pool: dPool,
                layout: diagramLayout
            },
            table: {
                slots: tslots,
                pool: mkPool(tans, K.tExtra),
                layout: s => `<table class="tbl"><tr><th></th><th>${K.th[0]}</th><th>${K.th[1]}</th></tr>`
                    + `<tr><th>${K.rows[0]}</th><td>${s[0]}</td><td>${s[1]}</td></tr>`
                    + `<tr><th>${K.rows[1]}</th><td>${s[2]}</td><td>${s[3]}</td></tr></table>`
            }
        },
        eqAns: `${a}x+${r1}=${c}x-${r2}`,
        eqWrong: K.eqWrong,
        eqHint: K.eqHint,
        best: 'diagram',
        fit: {
            words:   {mark: '○', msg: `言葉の式でも書けるけれど、「${K.whole}」という見方は、線分図のほうがつかみやすいかも。`},
            diagram: {mark: '◎', msg: `線分図は、「${K.whole}」という関係が見やすい！`},
            table:   {mark: '△', msg: `表は1回目と2回目の数は整理しやすいけれど、「${K.whole}」という関係が表からは見えにくくて、少し使いづらかったかも。`}
        }
    };
}

/* ==========================================================================
   3e. 問題生成・問題データ：新パターン【固有】
   代金とおつり（A1個の値段／2つの値段で個数）・個数と代金（〇倍／兄弟の残金）
   道のり・速さ・時間（追いかける／時間が〇分違う／出会う）
   ========================================================================== */
const ITEMS = [
    ['りんご', '個'], ['みかん', '個'], ['鉛筆', '本'], ['消しゴム', '個'], ['クッキー', '枚'],
    ['あめ', '個'], ['おにぎり', '個'], ['パン', '個'], ['ノート', '冊'], ['ペン', '本']
];

function pickItems(n) {
    return shuffle(ITEMS).slice(0, n);
}

/* --- 新パターン用の共通部品（言葉の式・線分図・表） --- */
const sl = (ans, hint) => ({ans: ans, hint: hint});
const labT = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
const opT = o => `<div class="op">${o}</div>`;
const wordsT = parts => `<div class="words">${parts.join('')}</div>`;
const fracT = (n, d) => `\\frac{${n}}{${d}}`;
const clampT = (r, lo, hi) => Math.round(Math.min(hi, Math.max(lo, r)) * 100);

   3h. 問題生成・問題データ：年齢【固有】
   kind='now'：父が子の○倍になるのは何年後か／kind='ratio'：倍の関係が変わる（現在の子の年齢）
   kind='diff'：年の差がわかっている（現在の子の年齢）／kind='sum'：父が2人の子の年齢の和の○倍になるのは何年後か
   どれも「父の○年後の年齢 ＝ ○倍 ×（子の○年後の年齢）」の形になる
   ========================================================================== */
function genNenrei(kind) {
    if (kind === 'ratio') return genNenreiRatio();
    if (kind === 'diff') return genNenreiDiff();
    if (kind === 'sum') return genNenreiSum();
    let C, x, k, F;
    do {
        C = randInt(8, 16);
        x = randInt(3, 20);
        k = randInt(2, 3);
        F = k * (C + x) - x;
    } while (F > 62);
    return {kind: 'now', F, C, k, x};
}

function genNenreiRatio() {
    let k1, k2, x, n;
    do {
        k1 = randInt(3, 5);
        k2 = randInt(2, k1 - 1);
        x = randInt(8, 20);
        n = x * (k1 - k2) / (k2 - 1);
    } while (!Number.isInteger(n) || n < 3 || n > 25 || k1 * x > 60);
    return {kind: 'ratio', k1, k2, x, n};
}

function genNenreiDiff() {
    let k, x, n, d;
    do {
        k = randInt(2, 4);
        x = randInt(6, 16);
        n = randInt(2, 10);
        d = (k - 1) * (x + n);
    } while (d < 10 || d > 40);
    return {kind: 'diff', k, x, n, d};
}

function genNenreiSum() {
    let C1, C2, k, x, F;
    do {
        C1 = randInt(6, 12);
        C2 = randInt(2, C1 - 1);
        k = randInt(2, 3);
        x = randInt(3, 12);
        F = k * (C1 + C2) + (2 * k - 1) * x;
    } while (F > 65);
    return {kind: 'sum', C1, C2, k, x, F};
}

/* --- 2人の子の和の問題：2人の子を「下の子」「上の子」に分けて、年齢順（下の子→上の子→父）に整理する --- */
function specNenreiSum(p) {
    const A = ageParams(p);
    const {C1, C2, F, k} = p;
    const U = s => `${s}（歳）`;
    const nF = 'x年後の父の年齢';
    const nL = 'x年後の下の子の年齢';
    const nU = 'x年後の上の子の年齢';
    const hF = 'x年後の父の年齢は「現在の年齢＋増える年齢」だよ。';
    const hL = `x年後の下の子（現在${C2}歳）の年齢は「現在の年齢＋増える年齢」だよ。`;
    const hU = `x年後の上の子（現在${C1}歳）の年齢は「現在の年齢＋増える年齢」だよ。`;
    const hF0 = '現在の父の年齢は問題文に書いてあるよ。';
    const hL0 = `現在の下の子の年齢は${C2}歳だよ。`;
    const hU0 = `現在の上の子の年齢は${C1}歳だよ。`;
    const hFi = '求めたいもの（何年後か）を x 年とおいたね。x年間で父の年齢は何歳増える？';
    const hLi = '下の子の年齢も、同じ x 年間で増えるよ。';
    const hUi = '上の子の年齢も、同じ x 年間で増えるよ。';

    /* --- 言葉の式 --- */
    const wAns = [U(`${F}+x`), U(`${C2}+x`), U(`${C1}+x`)];
    const wSlots = [sl(wAns[0], hF), sl(wAns[1], hL), sl(wAns[2], hU)];
    const wPool = mkPool(wAns, [U(`${F}`), U(`${C2}`), U(`${C1}`), U(`${F}-x`)]);

    /* --- 線分図（上の線：父、下の2本の線：下の子と上の子。上の線は下の2本の和の k 倍） --- */
    const dAns = [U(`${F}`), U('x'), U(`${C2}`), U('x'), U(`${C1}`), U('x')];
    const dSlots = [sl(dAns[0], hF0), sl(dAns[1], hFi), sl(dAns[2], hL0), sl(dAns[3], hLi), sl(dAns[4], hU0), sl(dAns[5], hUi)];
    const dPool = mkPool(dAns, [U(`${F}+x`), U(`${C2}+x`), U(`${F}-x`)]);

    /* --- 表（左から下の子→上の子→父の順。下の子の欄から埋める） --- */
    const tans = [`${C2}`, `${C1}`, `${F}`, 'x', 'x', 'x', `${C2}+x`, `${C1}+x`, `${F}+x`];
    const thints = [hL0, hU0, hF0, hLi, hUi, hFi, hL, hU, hF];

    return {
        text: A.text,
        varAns: A.varAns,
        varWrong: A.varWrong,
        fill: {
            words: {
                slots: wSlots,
                pool: wPool,
                layout: s => wordsT([
                    labT(nF, s[0]),
                    opT('＝'),
                    opT(`${k}`),
                    opT('×'),
                    opT('('),
                    labT(nL, s[1]),
                    opT('＋'),
                    labT(nU, s[2]),
                    opT(')')
                ])
            },
            diagram: {
                slots: dSlots,
                pool: dPool,
                layout: s => dgI(
                    barTopT(nF, '', [['現在', s[0], 62], ['増える分', s[1], 38]], 100)
                    + `<div class="lab" style="margin:6px 3px;">↑ 上の線は、下の2本の線（下の子と上の子のx年後の年齢）の和の${k}倍の長さ</div>`
                    + '<div style="display:flex; gap:14px;">'
                    + `<div class="stack" style="flex:1;">${barTopT(nL, '', [['現在', s[2], 50], ['増える分', s[3], 50]], 100)}</div>`
                    + `<div class="stack" style="flex:1;">${barTopT(nU, '', [['現在', s[4], 50], ['増える分', s[5], 50]], 100)}</div>`
                    + '</div>'
                )
            },
            table: {
                slots: tans.map((ans, i) => sl(ans, thints[i])),
                pool: mkPool(tans, [`${F}-x`, `${C1}-x`, `${C1 + C2}`]),
                layout: s => tableT(['', '下の子', '上の子', '父'], [
                    ['現在の年齢（歳）', s[0], s[1], s[2]],
                    ['増える年齢（歳）', s[3], s[4], s[5]],
                    ['x年後の年齢（歳）', s[6], s[7], s[8]]

        },

}

function specNenrei(p) {
    if (p.kind === 'sum') return specNenreiSum(p);
    const A = ageParams(p);
    const {Fh, Ch, Fl, Cl, when, k, F0, C0, iF, iC, aF, aC, ex, h} = A;
    const U = s => `${s}（歳）`;

    /* --- 言葉の式 --- */
    const wSlots = [sl(U(aF), h[4]), sl(U(aC), h[5])];
    const wPool = [...new Set([U(aF), U(aC), U(F0), U(C0), U(ex[0]), U(ex[1])])];

    /* --- 線分図（上の線：父、下の線：子。上の線は下の線の k 倍） --- */
    const dAns = [U(F0), U(iF), U(C0), U(iC)];
    const dSlots = [sl(dAns[0], h[0]), sl(dAns[1], h[2]), sl(dAns[2], h[1]), sl(dAns[3], h[3])];
    const dPool = mkPool(dAns, [U(aF), U(aC), U(ex[0])]);

    return {

        fill: {

const frH = (n, d) => `\\(\\frac{${n}}{${d}}\\)`;

function genWariai(kind) {
    if (kind === 'megane') return genWariaiMegane();
    const x = randInt(6, 30) * 20;
    if (kind === 'waribiki') {
        const w = randInt(1, 4);
        return {kind: 'waribiki', A: pickItems(1)[0][0], w, x: x * 5, P: x * 5 * (10 - w) / 10};
    }
    if (kind === 'zouka') {
        const r = [10, 20, 25, 30, 40, 60][randInt(0, 5)];
        return {kind: 'zouka', r, x, P: x * (100 + r) / 100};
    }
    if (kind === 'nokori') {
        const r = [20, 25, 30, 35, 40, 45][randInt(0, 5)];
        return {kind: 'nokori', r, x, P: x * (100 - r) / 100};
    }
    const r = [20, 25, 30, 40, 60, 75][randInt(0, 5)];
    return {kind: 'bubun', r, x, P: x * r / 100};
}

/* 割合・最後の問題：男子a%と女子b%で合わせてM人がメガネ（数値はランダム） */
function genWariaiMegane() {
    const rs = [10, 15, 20, 25, 30, 40, 50];
    for (let i = 0; i < 300; i++) {
        const a = rs[randInt(0, rs.length - 1)];
        const b = rs[randInt(0, rs.length - 1)];
        const x = randInt(12, 24);
        const y = randInt(12, 24);
        if (a === b || x === y) continue;
        if ((a * x) % 100 !== 0 || (b * y) % 100 !== 0) continue;
        return {kind: 'megane', x, a, b, T: x + y, M: (a * x + b * y) / 100};
    }
    return {kind: 'megane', x: 16, a: 25, b: 15, T: 36, M: 7};
}

function specWariaiMegane(p) {
    const {x, a, b, T, M} = p;
    const fr = n => fracT(n, 100);
    const U = s => `${s}（人）`;
    const bm = `${fr(a)}x`;
    const gm = `${fr(b)}(${T}-x)`;
    const hx = '求めたいもの（男子の人数）を x 人とおいたね。';
    const hg = `男女合わせて${T}人だから、女子は「${T}−x」人だよ。`;
    const hbm = `男子x人の${a}%だから、「x×${frH(a, 100)}」だよ。`;
    const hgm = `女子(${T}−x)人の${b}%だから、「(${T}−x)×${frH(b, 100)}」だよ。`;
    const hT = `男女合わせて${T}人と問題文に書いてあるよ。`;
    const hM = `合わせて${M}人と問題文に書いてあるよ。`;
    const ex = [`${fr(b)}x`, `${fr(a)}(${T}-x)`, `${T}`];
    const wa = [U(bm), U(gm), U(`${M}`)];
    const wh = [hbm, hgm, hM];
    const da = [U(`${T}`), U('x'), U(`${T}-x`), U(`${M}`), U(bm), U(gm)];
    const dh = [hT, hx, hg, hM, hbm, hgm];
    const ta = [`${T}`, `${M}`, 'x', `${T}-x`, bm, gm];
    const th = [hT, hM, hx, hg, hbm, hgm];
    const wb = Math.min(75, Math.max(25, Math.round(x / T * 100)));
    const wm = Math.min(75, Math.max(25, Math.round((a * x / 100) / M * 100)));
    return {
        text: `男女合わせて${T}人のクラスで、男子の${a}%と女子の${b}%の合わせて${M}人がメガネをかけている。クラスの男子の人数を求めなさい。`,
        varAns: '男子の人数',
        varWrong: ['女子の人数', 'メガネをかけている人数', 'クラス全体の人数'],
        fill: {
            words: {
                slots: wa.map((q, i) => sl(q, wh[i])),
                pool: mkPool(wa, ex.map(U)),
                layout: s => wordsT([labT('男子のメガネ', s[0]), opT('＋'), labT('女子のメガネ', s[1]), opT('＝'), labT('メガネの人数', s[2])])
            },
            diagram: {
                slots: da.map((q, i) => sl(q, dh[i])),
                pool: mkPool(da, [...ex.map(U), U(`x-${T}`)]),
                layout: s => dgI(barTopT('クラス全体', s[0], [['男子', s[1], wb], ['女子', s[2], 100 - wb]], 100)
                    + '<div style="height:10px"></div>'
                    + barTopT('メガネの人', s[3], [[`男子の${a}%`, s[4], wm], [`女子の${b}%`, s[5], 100 - wm]], 100))
            },
            table: {
                slots: ta.map((q, i) => sl(q, th[i])),
                pool: mkPool(ta, [...ex, `x-${T}`]),
                layout: s => tableT(['', '男子', '女子', '合計'], [
                    ['人数（人）', s[2], s[3], s[0]],
                    ['メガネの人数（人）', s[4], s[5], s[1]]
                ], true)
            }
        },
        eqAns: `${fr(a)}x+${fr(b)}(${T}-x)=${M}`,
        eqWrong: [`${fr(a)}x+${fr(b)}x=${M}`, `${fr(a)}(${T}-x)+${fr(b)}x=${M}`, `${fr(a)}x+${fr(b)}(${T}-x)=${T}`],
        eqHint: `「男子のメガネ ＋ 女子のメガネ ＝ ${M}人」を式にしよう。女子は(${T}−x)人だよ。`,
        best: 'diagram',
        fit: {
            words:   {mark: '○', msg: '言葉の式は「男子のメガネ＋女子のメガネ＝合計」と書けるけれど、女子の人数のつながりが見えにくいかも。'},
            diagram: {mark: '◎', msg: '線分図は「クラス全体」と「メガネの人」を続けて見られるので、男女の関係がわかりやすい！'},
            table: {mark: '◎', msg: '表は男子・女子ごとに人数とメガネの人数を整理できるので、あとの式づくりが楽になる！'}
        }
    };
}

function specWariai(p) {
    if (p.kind === 'megane') return specWariaiMegane(p);
    if (p.kind === 'bubun') return specWariaiBubun(p);
    const D = wariaiData(p);
    const U = s => `${s}（${D.unit}）`;
    const names = D.names;
    const wans = D.amts.map(U);
    const wslots = wans.map((a, i) => sl(a, D.ah[i]));
    const wpool = mkPool(wans, D.ex.map(U));
    const tans = ['x', `${D.fd}x`, D.amts[2]];
    const thints = D.ah;
    return {
        text: D.text,
        varAns: D.varAns,
        varWrong: D.varWrong,
        fill: {
            words: {
                slots: wslots,
                pool: wpool,
                layout: s => wordsT([labT(names[0], s[0]), opT(D.ops[0]), labT(names[1], s[1]), opT(D.ops[1]), labT(names[2], s[2])])
            },
            diagram: {
                slots: wslots,
                pool: wpool,
                layout: s => dgI(barTopT(names[D.whole], s[D.whole],
                    D.parts.map((i, j) => [names[i], s[i], j === 0 ? D.share : 100 - D.share]), 100))
            },
            table: {
                slots: tans.map((a, i) => sl(a, thints[i])),
                pool: mkPool(tans, D.tex),
                layout: s => {
                    if (D.rname) {
                        const tn = n => (n === '増えた分') ? '増加数' : n;
                        const rows = names.map((n, i) => [tn(n), s[i]]);
                        rows.splice(1, 0, [D.rname, `\\(${D.fd}\\)`]);
                        return tableT(['', D.mn], rows, true);
                    }
                    return tableT(['', names[1], names[2], names[0]], [[D.mn, s[1], s[2], s[0]]]);
                }
            }
        },
        eqAns: D.eqAns,
        eqWrong: D.eqWrong,
        eqHint: D.eqHint,
        best: D.best,
        fit: {
            words:   {mark: D.fm.words[0], msg: D.fm.words[1]},
            diagram: {mark: D.fm.diagram[0], msg: D.fm.diagram[1]},
            table:   {mark: D.fm.table[0], msg: D.fm.table[1]}
        }
    };
}

/* ==========================================================================
   3g. 方法ごとの方程式の形【固有】
   言葉の式…各 spec の eqAns（言葉の式のとおり）
   線分図  …「全体＝部分の和」の形
   表      …表に並ぶ数量の順にまとめた形
   ここに書いた方法だけ、spec の eqAns・eqWrong・eqHint を置き換える（書いていない方法は spec のまま）
   ========================================================================== */
const eqf = (ans, wrong, hint) => ({ans: ans, wrong: wrong, hint: hint});

function eqFormOtsuri(p) {
    const {M, c} = p;
    if (p.kind === 'a1') {
        const {n, b} = p;
        return {
            diagram: eqf(`${M}=${n}x+${b}+${c}`,
                [`${M}=${n}x+${b}`, `${M}=${b * n}+x+${c}`, `${M}+${c}=${n}x+${b}`],
                '線分図は「全体＝部分の和」。「出した金額 ＝ 代金 ＋ 代金 ＋ おつり」を式にしよう。'),
            table: eqf(`${n}x+${b}=${M}-${c}`,
                [`${n}x+${b}=${M}+${c}`, `${b * n}+x=${M}-${c}`, `${n}x=${M}-${c}`],
                '表の「代金」の欄を読もう。「代金の合計 ＝ 出した金額 − おつり」を式にしよう。')
        };
    }
    if (p.kind === 'count') {
        const {a, b, n} = p;
        return {
            diagram: eqf(`${M}=${a}x+${b}(${n}-x)+${c}`,
                [`${M}=${a}x+${b}x+${c}`, `${M}=${a}x+${b}(${n}-x)`, `${M}=${b}x+${a}(${n}-x)+${c}`],
                '線分図は「全体＝部分の和」。「出した金額 ＝ 代金 ＋ 代金 ＋ おつり」を式にしよう。もう一方の個数は(全部の数−x)だよ。'),
            table: eqf(`${a}x+${b}(${n}-x)=${M}-${c}`,
                [`${a}x+${b}(${n}-x)=${M}+${c}`, `${a}x+${b}x=${M}-${c}`, `${b}x+${a}(${n}-x)=${M}-${c}`],
                '表の「代金」の欄を読もう。「代金の合計 ＝ 出した金額 − おつり」を式にしよう。')
        };
    }
    const {a, p: pp, q} = p;
    return {
        diagram: eqf(`${M}=${a * pp}+${q}x+${c}`,
            [`${M}=${a * pp}+${q}x`, `${M}=${a * q}+${pp}x+${c}`, `${M}+${c}=${a * pp}+${q}x`],
            '線分図は「全体＝部分の和」。「出した金額 ＝ 代金 ＋ 代金 ＋ おつり」を式にしよう。'),
        table: eqf(`${a * pp}+${q}x=${M}-${c}`,
            [`${a * pp}+${q}x=${M}+${c}`, `${a * q}+${pp}x=${M}-${c}`, `${a * pp}+x=${M}-${c}`],
            '表の「代金」の欄を読もう。「代金の合計 ＝ 出した金額 − おつり」を式にしよう。')
    };
}

function eqFormDaikin(p) {
    if (p.kind === 'bai') {
        const {n, b, q, c, k} = p;
        return {
            diagram: eqf(`${k}(${q}x+${c})=${n}x+${b}`,
                [`${k}${q}x+${c}=${n}x+${b}`, `${q}x+${c}=${n}x+${b}`, `${k}(${n}x+${b})=${q}x+${c}`],
                `線分図の上の線は、下の線の${k}倍。「${k}×(下の線) ＝ 上の線」を式にしよう。`)
        };
    }
    if (p.kind === 'zan') {
        const {m1, m2, k} = p;
        return {
            diagram: eqf(`${m1}=${k}(${m2}-x)+x`,
                [`${m1}=${k}(${m2}-x)`, `${m1}=${k}(${m2}-x)-x`, `${m1}=${m2}-x+x`],
                `線分図で、兄の所持金は「兄の残金＋値段」。兄の残金は弟の残金の${k}倍だよ。`)
        };
    }
    const {a, p: pp, q, T} = p;
    return {
        diagram: eqf(`${T}=${a * pp}+${q}x`,
            [`${T}=${a * q}+${pp}x`, `${T}=${a * pp}+x`, `${T}=${a + pp}+${q}x`],
            '線分図は「全体＝部分の和」。「代金の合計 ＝ 代金 ＋ 代金」を式にしよう。')
    };
}

/* ---------- 基本問題：個数と代金（k1:個数x／k2:値段x／k3:1個の品物がある／k4:2品の合計） ---------- */
function genKDaikin(kind) {
    const g = genDaikin('basic');
    if (kind === 'k4') return Object.assign(g, {kind: 'k4'});
    const base = {kind: kind, A: g.A, uA: g.uA, B: g.B, uB: g.uB};
    if (kind === 'k1') {
        const n = randInt(3, 12);
        return Object.assign(base, {u: g.a, n: n, T: g.a * n});
    }
    if (kind === 'k2') {
        return Object.assign(base, {u: g.x, n: g.p, T: g.x * g.p});
    }
    return Object.assign(base, {u: g.x, n: g.p, b: g.a, T: g.x * g.p + g.a});
}

function specKDaikin(p) {
    if (p.kind === 'k4') return specDaikin(Object.assign({}, p, {kind: 'basic'}));
    const {A, uA, B, uB, u, n, b, T} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
    const tot = `${T}（円）`;
    const fit = {
        words:   {mark: '◎', msg: '言葉の式は「単価×個数＝代金」「Aの代金＋Bの代金＝合計」と、そのまま式につなげられる。この問題にぴったり！'},
        diagram: {mark: '△', msg: '線分図は「全体＝部分の和」は見やすいけれど、「単価×個数」の掛け算が入ると図に書くことが多くて、少し使いづらかったかも。'},

        const ts = [

            {ans: '1',        hint: `${B}は何${uB}買ったかな？`},

        return {
            text: `${A}を${n}${uA}と、1${uB}${b}円の${B}を1${uB}買ったところ、代金の合計は${T}円でした。${A}1${uA}の値段を求めなさい。`,
            varAns: `${A}1${uA}の値段`,
            varWrong: [`${B}1${uB}の値段`, `${A}の個数`, '代金の合計'],
            fill: {
                words: {
                    slots: slots3,
                    pool: pool3,
                    layout: s => `<div class="words">${lab(A + 'の代金', s[0])}<div class="op">＋</div>${lab(B + 'の代金', s[1])}<div class="op">＝</div>${lab('代金の合計', s[2])}</div>`
                },
                diagram: {
                    slots: [slots3[2], slots3[0], slots3[1]],
                    pool: pool3,
                    layout: s => `<div class="dg compact"><div class="dg-top">${lab('代金の合計', s[0])}</div><div class="dg-bracket up"></div><div class="dg-line"><div class="dg-seg" style="flex:${f1}"></div><div class="dg-seg" style="flex:${100 - f1}"></div></div><div class="dg-row"><div class="dg-part" style="flex:${f1}"><div class="dg-bracket down"></div>${lab(A + 'の代金', s[1])}</div><div class="dg-part" style="flex:${100 - f1}"><div class="dg-bracket down"></div>${lab(B + 'の代金', s[2])}</div></div></div>`
                },
                table: {
                    slots: ts,
                    pool: mkPool(ts.map(t => t.ans), [`${n}`, `${n + 1}`, `${b}x`]),
                    layout: s => `<table class="tbl"><tr><th></th><th>${A}</th><th>${B}</th><th>合計</th></tr>`
                        + `<tr><th>単価（円）</th><td>${s[0]}</td><td>${s[1]}</td><td></td></tr>`
                        + `<tr><th>数量（${uA === uB ? uA : uA + '・' + uB}）</th><td>${s[2]}</td><td>${s[3]}</td><td></td></tr>`
                        + `<tr><th>代金（円）</th><td>${s[4]}</td><td>${s[5]}</td><td>${s[6]}</td></tr></table>`

            },

            eqWrong: [`${n}x=${T}`, `x+${b}=${T}`, `${n}x+${b}x=${T}`],

            fit: fit

    /* k1：個数をxとおく／k2：値段をxとおく */
    const k1 = (p.kind === 'k1');
    const slots3 = [
        {ans: k1 ? `${u}（円）` : 'x（円）',    hint: k1 ? `${A}1${uA}の単価は問題文に書いてあるよ。` : `${A}1${uA}の値段が x 円だよ。`},

    return {
        text: k1
            ? `1${uA}${u}円の${A}を何${uA}か買ったところ、代金は${T}円でした。買った${A}の個数を求めなさい。`
            : `${A}を${n}${uA}買ったところ、代金は${T}円でした。${A}1${uA}の値段を求めなさい。`,
        varAns: k1 ? `買った${A}の個数` : `${A}1${uA}の値段`,
        varWrong: k1 ? [`${A}1${uA}の値段`, '代金', `${A}の代金の合計`] : [`買った${A}の個数`, '代金', `${A}の代金の合計`],
        fill: {
            words: {
                slots: slots3,
                pool: pool3,
                layout: s => `<div class="words">${lab('単価', s[0])}<div class="op">×</div>${lab('数量', s[1])}<div class="op">＝</div>${lab('代金', s[2])}</div>`
            },
            diagram: {
                slots: [slots3[2], slots3[0], slots3[1]],
                pool: pool3,
                layout: s => `<div class="dg compact"><div class="dg-top">${lab('代金', s[0])}</div><div class="dg-bracket up"></div><div class="dg-line"><div class="dg-seg" style="flex:1"></div><div class="dg-seg" style="flex:1"></div><div class="dg-seg" style="flex:1"></div></div><div class="dg-row"><div class="dg-part" style="flex:1"><div class="dg-bracket down"></div><div class="words">${lab('単価', s[1])}<div class="op">×</div>${lab('数量', s[2])}</div></div></div></div>`
            },
            table: {
                slots: ts,
                pool: mkPool(ts.map(t => t.ans), k1 ? [`${T}x`, `${u}x`] : [`${T}x`, `${n}x`]),
                layout: s => `<table class="tbl"><tr><th></th><th>${A}</th></tr>`
                    + `<tr><th>単価（円）</th><td>${s[0]}</td></tr>`
                    + `<tr><th>数量（${uA}）</th><td>${s[1]}</td></tr>`
                    + `<tr><th>代金（円）</th><td>${s[2]}</td></tr></table>`
            }
        },
        eqAns: k1 ? `${u}x=${T}` : `${n}x=${T}`,
        eqWrong: k1 ? [`${u}+x=${T}`, `${T}x=${u}`, `${u}x=${T}x`] : [`${n}+x=${T}`, `${T}x=${n}`, `x=${T}+${n}`],
        eqHint: '整理した「単価×数量＝代金」と見比べよう。',
        best: 'words',
        fit: fit
    };
}

function eqFormKDaikin(p) {
    if (p.kind === 'k4') return eqFormDaikin(Object.assign({}, p, {kind: 'basic'}));

        return {
            diagram: eqf(`${T}=${n}x+${b}`,
                [`${T}=${n}x`, `${T}=${b}x+${n}`, `${T}=x+${b}`],
                '線分図は「全体＝部分の和」。「代金の合計 ＝ 代金 ＋ 代金」を式にしよう。')
        };

    return {

            p.kind === 'k1' ? [`${T}=${u}+x`, `${u}=${T}x`, `${T}x=${u}`] : [`${T}=${n}+x`, `${n}=${T}x`, `${T}x=${n}`],
            '線分図は「全体＝部分」。「代金 ＝ 単価×数量」を式にしよう。')
    };
}

/* ---------- 基本問題：代金とおつり（k1:個数x／k2:値段x／k3:出した金額x・1個／k4:出した金額x・複数個） ---------- */
function genKOtsuri(kind) {
    const g = genDaikin('basic');
    const base = {kind: kind, A: g.A, uA: g.uA};
    const up500 = v => (Math.floor(v / 500) + 1) * 500;
    if (kind === 'k1') {
        const n = randInt(3, 9);
        const M = up500(g.a * n);
        return Object.assign(base, {u: g.a, n: n, M: M, c: M - g.a * n});
    }
    if (kind === 'k2') {
        const M = up500(g.x * g.p);
        return Object.assign(base, {u: g.x, n: g.p, M: M, c: M - g.x * g.p});
    }
    if (kind === 'k3') {
        const M = [500, 1000][randInt(0, 1)];
        const b = randInt(5, 30) * 10;
        return Object.assign(base, {b: b, n: 1, M: M, c: M - b});
    }
    const M = up500(g.a * g.p);
    return Object.assign(base, {b: g.a, n: g.p, M: M, c: M - g.a * g.p});
}

function specKOtsuri(p) {
    const {A, uA, u, n, b, M, c} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
    const k = p.kind;
    /* 単価・数量・代金・出した金額・おつり（表に入れる数と文字） */
    const unit  = (k === 'k1') ? `${u}` : (k === 'k2') ? 'x' : `${b}`;
    const qty   = (k === 'k1') ? 'x' : (k === 'k2') ? `${n}` : (k === 'k3') ? '1' : `${n}`;
    const price = (k === 'k1') ? `${u}x` : (k === 'k2') ? `${n}x` : (k === 'k3') ? `${b}` : `${b * n}`;
    const pay   = (k === 'k1' || k === 'k2') ? `${M}` : 'x';
    const slots3 = [
        {ans: `${pay}（円）`,   hint: (pay === 'x') ? '求めたい出した金額を x とおいたね。' : '出した金額（はらったお金）は問題文に書いてあるよ。'},
        {ans: `${price}（円）`, hint: `${A}の代金は「単価×数量」。` + ((k === 'k4') ? '計算した数を選ぼう。' : '')},
        {ans: `${c}（円）`,     hint: 'おつりは問題文に書いてあるよ。'}
    ];
    const wrong3 = {
        k1: [`${u}（円）`, 'x（円）', `${c}x（円）`],
        k2: ['x（円）', `${n}（円）`, `${c}x（円）`],
        k3: ['x（円）', `${b}x（円）`, `${c}x（円）`],
        k4: ['x（円）', `${b}x（円）`, `${n}x（円）`]
    }[k];
    const pool3 = mkPool(slots3.map(s => s.ans), wrong3);
    const ts = [
        {ans: unit,  hint: (k === 'k2') ? `${A}1${uA}の値段が x 円だね。単価の欄だよ。` : '単価は問題文に書いてあるよ。'},
        {ans: qty,   hint: (k === 'k1') ? '求めたい個数を x とおいたね。' : `${A}は何${uA}買ったかな？`},
        {ans: price, hint: '代金は「単価×数量」。計算した数を選ぼう。'},
        {ans: pay,   hint: (pay === 'x') ? '求めたい出した金額を x とおいたね。' : '出した金額は問題文に書いてあるよ。'},
        {ans: `${c}`, hint: 'おつりは問題文に書いてあるよ。'}
    ];
    const tw = {
        k1: [`${M - c}x`, `${c}x`], k2: [`${M - c}x`, `${c}x`],
        k3: [`${b}x`, `${c}x`],    k4: [`${b}x`, `${n}x`]
    }[k];
    /* 問題4：線分図・言葉の式の代金は「200×6」の形を選ばせる（方程式は計算した数） */
    const dSlots = (k === 'k4')
        ? [slots3[0], {ans: `${b}\\times ${n}（円）`, hint: `${A}の代金は「単価×数量」。かけ算の形で表そう。`}, slots3[2]]
        : slots3;
    const dPool = (k === 'k4')
        ? mkPool(dSlots.map(s => s.ans), wrong3.concat([`${b}\\times ${n + 1}（円）`]))
        : pool3;
    const f = [Math.max(34, 100 - Math.round(c / M * 100)), Math.max(24, Math.round(c / M * 100))];

    return {
        text: {
            k1: `${M}円出して、1${uA}${u}円の${A}を何${uA}か買ったところ、おつりは${c}円でした。買った${A}の個数を求めなさい。`,
            k2: `${M}円出して、${A}を${n}${uA}買ったところ、おつりは${c}円でした。${A}1${uA}の値段を求めなさい。`,
            k3: `何円か出して、${b}円の${A}を1${uA}買ったところ、おつりは${c}円でした。出した金額を求めなさい。`,
            k4: `何円か出して、1${uA}${b}円の${A}を${n}${uA}買ったところ、おつりは${c}円でした。出した金額を求めなさい。`
        }[k],
        varAns: {k1: `買った${A}の個数`, k2: `${A}1${uA}の値段`, k3: '出した金額', k4: '出した金額'}[k],
        varWrong: (k === 'k1') ? [`${A}1${uA}の値段`, '出した金額', 'おつり']
            : (k === 'k2') ? [`買った${A}の個数`, '出した金額', 'おつり']
            : [`${A}1${uA}の値段`, `${A}の代金`, 'おつり'],
        fill: {
            words: {
                slots: dSlots,
                pool: dPool,
                layout: s => `<div class="words">${lab('出した金額', s[0])}<div class="op">−</div>${lab(A + 'の代金', s[1])}<div class="op">＝</div>${lab('おつり', s[2])}</div>`
            },
            diagram: {
                slots: dSlots,
                pool: dPool,
                layout: s => `<div class="dg compact"><div class="dg-top">${lab('出した金額', s[0])}</div><div class="dg-bracket up"></div>`
                    + `<div class="dg-line">${f.map(w => `<div class="dg-seg" style="flex:${w}"></div>`).join('')}</div>`
                    + '<div class="dg-row">'
                    + [[A + 'の代金', s[1], f[0]], ['おつり', s[2], f[1]]].map(([t, sl, w]) =>
                        `<div class="dg-part" style="flex:${w}"><div class="dg-bracket down"></div>${lab(t, sl)}</div>`
                    ).join('')
                    + '</div></div>'
            },
            table: {
                slots: ts,
                pool: mkPool(ts.map(t => t.ans), tw),
                layout: s => `<table class="tbl"><tr><th></th><th>${A}</th><th>出した金額</th><th>おつり</th></tr>`
                    + `<tr><th>単価（円）</th><td>${s[0]}</td><td></td><td></td></tr>`
                    + `<tr><th>数量（${uA}）</th><td>${s[1]}</td><td></td><td></td></tr>`
                    + `<tr><th>代金（円）</th><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td></tr></table>`
            }
        },
        eqAns: `${pay}-${price}=${c}`,
        eqWrong: [`${pay}+${price}=${c}`, `${price}-${pay}=${c}`, `${pay}-${price}=${pay}`],
        eqHint: '整理した「出した金額 − 代金 ＝ おつり」と見比べよう。代金は計算した数にしてね！',
        best: 'words',
        fit: {
            words:   {mark: '◎', msg: '言葉の式は「出した金額 − 代金 ＝ おつり」と、お金の流れをそのまま書けるので、いちばん立式しやすい！'},
            diagram: {mark: '○', msg: '線分図も「出した金額が、代金とおつりに分かれる」関係が見やすいよ。ただし、式にするには言葉の式のほうが近道かも。'},
            table:   {mark: '△', msg: '表は単価・数量・代金は整理しやすいけれど、「出した金額 − 代金 ＝ おつり」の引き算の関係が表からは見えにくくて、少し使いづらかったかも。'}
        }
    };
}

function eqFormKOtsuri(p) {
    const {u, n, b, M, c} = p;
    const k = p.kind;
    const price = (k === 'k1') ? `${u}x` : (k === 'k2') ? `${n}x` : (k === 'k3') ? `${b}` : `${b * n}`;
    const pay = (k === 'k1' || k === 'k2') ? `${M}` : 'x';
    return {
        diagram: eqf(`${pay}=${price}+${c}`,
            [`${pay}=${price}-${c}`, `${pay}+${c}=${price}`, `${pay}=${price}`],
            '線分図は「全体＝部分の和」。「出した金額 ＝ 代金 ＋ おつり」を式にしよう。'),
        table: eqf(`${price}=${pay}-${c}`,
            [`${price}=${pay}+${c}`, `${pay}=${price}-${c}`, `${price}=${pay}`],
            '表の「代金」の欄を読もう。「代金 ＝ 出した金額 − おつり」を式にしよう。')
    };
}

/* ---------- 基本問題：道のり・速さ・時間（k1:時間をx／k2:速さをx／k3:道のりをx） ---------- */
function genKHayasa(kind) {
    const places = [['家', '駅'], ['学校', '図書館'], ['公園', '店'], ['駅', '病院']];
    const [P, Q] = places[randInt(0, places.length - 1)];
    const modes = [
        {how: '歩いた',         n: '歩く',   v: [3, 4, 5, 6]},
        {how: '自転車で走った', n: '自転車', v: [10, 12, 15]},
        {how: '車で走った',     n: '車',     v: [40, 50, 60]}
    ];
    const m = modes[randInt(0, modes.length - 1)];
    const a = m.v[randInt(0, m.v.length - 1)];
    const t = randInt(2, 6);
    return {kind: kind, P: P, Q: Q, how: m.how, n: m.n, a: a, t: t, D: a * t};
}

function specKHayasa(p) {
    const {P, Q, how, n, a, t, D} = p;
    const k = p.kind;
    const lab = (tt, s) => `<div class="col"><div class="lab">${tt}</div>${s}</div>`;
    /* 速さ・時間・道のり（単位つき） */
    const S = (k === 'k2') ? 'x（km/時）' : `${a}（km/時）`;
    const T = (k === 'k1') ? 'x（時間）' : `${t}（時間）`;
    const L = (k === 'k3') ? 'x（km）' : `${D}（km）`;
    const hS = (k === 'k2') ? '求めたい速さを x とおいたね。' : '速さは問題文に書いてあるよ。';
    const hT = (k === 'k1') ? '求めたい時間を x とおいたね。' : '時間は問題文に書いてあるよ。';
    const hL = (k === 'k3') ? '求めたい道のりを x とおいたね。' : '道のりは問題文に書いてあるよ。';
    const sS = {ans: S, hint: hS};
    const sT = {ans: T, hint: hT};
    const sL = {ans: L, hint: hL};
    /* 言葉の式：公式の右辺を完成させる（k1:時間＝道のり÷速さ／k2:速さ＝道のり÷時間／k3:道のり＝速さ×時間） */
    const formula = {
        k1: {left: '時間',   r: ['道のり', '\\div', '速さ']},
        k2: {left: '速さ',   r: ['道のり', '\\div', '時間']},
        k3: {left: '道のり', r: ['速さ', '\\times', '時間']}
    }[k];
    const ftxt = formula.r.map(r => (r === '\\div') ? '÷' : (r === '\\times') ? '×' : r).join('');
    const fhint = `公式「${formula.left}＝${ftxt}」を使おう。`;
    const wSlots = formula.r.map(r => ({ans: r, hint: fhint}));
    const wPool = mkPool(formula.r, ['道のり', '速さ', '時間', '\\times', '\\div']);
    const dSlots = [sL, sS, sT];
    const wrong = {
        k1: ['x（km/時）', `${a}（時間）`, 'x（km）'],
        k2: ['x（時間）', `${t}（km/時）`, 'x（km）'],
        k3: ['x（時間）', `${a}（km）`, `${t}（km/時）`]
    }[k];
    const pool = mkPool([S, T, L], wrong);
    const ts = [
        {ans: (k === 'k3') ? 'x' : `${D}`, hint: hL},
        {ans: (k === 'k2') ? 'x' : `${a}`, hint: hS},
        {ans: (k === 'k1') ? 'x' : `${t}`, hint: hT}
    ];
    const tw = {k1: [`${a}x`, `${D}x`], k2: [`${t}x`, `${D}x`], k3: [`${a}x`, `${t}x`]}[k];
    const how2 = `${P}から${Q}まで、`;
    return {
        text: {
            k1: `${how2}時速${a}kmの速さで${how}ところ、道のりは${D}kmでした。かかった時間を求めなさい。`,
            k2: `${how2}${t}時間かけて${how}ところ、道のりは${D}kmでした。速さは時速何kmですか。`,
            k3: `${how2}時速${a}kmの速さで${how}ところ、${t}時間かかりました。${P}から${Q}までの道のりを求めなさい。`
        }[k],
        varAns: {k1: 'かかった時間', k2: '速さ', k3: `${P}から${Q}までの道のり`}[k],
        varWrong: {
            k1: ['速さ', '道のり', '出発する時刻'],
            k2: ['かかった時間', '道のり', '出発する時刻'],
            k3: ['速さ', 'かかった時間', '出発する時刻']
        }[k],
        fill: {
            words: {
                slots: wSlots,
                pool: wPool,
                layout: s => `<div class="words"><div class="op" style="font-weight:700;">${formula.left}</div><div class="op">＝</div><div class="col">${s[0]}</div><div class="col">${s[1]}</div><div class="col">${s[2]}</div></div>`
            },
            diagram: {
                slots: dSlots,
                pool: pool,
                layout: s => `<div class="dg compact"><div class="dg-top">${lab('道のり', s[0])}</div><div class="dg-bracket up"></div>`
                    + '<div class="dg-line"><div class="dg-seg" style="flex:1"></div><div class="dg-seg" style="flex:1"></div><div class="dg-seg" style="flex:1"></div></div>'
                    + `<div class="dg-row"><div class="dg-part" style="flex:1"><div class="dg-bracket down"></div><div class="words">${lab('速さ', s[1])}<div class="op">×</div>${lab('時間', s[2])}</div></div></div></div>`
            },
            table: {
                slots: ts,
                pool: mkPool(ts.map(x => x.ans), tw),
                layout: s => `<table class="tbl"><tr><th></th><th>${n}</th></tr>`
                    + `<tr><th>道のり（km）</th><td>${s[0]}</td></tr>`
                    + `<tr><th>速さ（km/時）</th><td>${s[1]}</td></tr>`
                    + `<tr><th>時間（時間）</th><td>${s[2]}</td></tr></table>`
            }
        },
        eqAns: {k1: `x=${D}\\div ${a}`, k2: `x=${D}\\div ${t}`, k3: `x=${a}\\times ${t}`}[k],
        eqWrong: {
            k1: [`x=${a}\\div ${D}`, `x=${D}\\times ${a}`, `x=${D}+${a}`],
            k2: [`x=${t}\\div ${D}`, `x=${D}\\times ${t}`, `x=${D}+${t}`],
            k3: [`x=${a}\\div ${t}`, `x=${t}\\div ${a}`, `x=${a}+${t}`]
        }[k],
        eqHint: `整理した公式「${formula.left}＝${ftxt}」に、問題の数を当てはめよう。計算はまだしなくていいよ。`,
        best: 'table',
        fit: {
            words:   {mark: '○', msg: `言葉の式は公式「${formula.left}＝${ftxt}」をそのまま使えるので、数を当てはめるだけで式にできるよ。`},
            diagram: {mark: '△', msg: '線分図は「全体と部分」を表すのが得意だけれど、この問題は「速さ×時間＝道のり」のかけ算の関係なので、図には表しにくかったかも。'},
            table:   {mark: '◎', msg: '表は「道のり・速さ・時間」の3つの量を縦に並べて整理できるので、この3つの関係が見えやすい！'}
        }
    };
}

function eqFormKHayasa(p) {
    const {a, t, D} = p;
    if (p.kind === 'k1') {
        return {
            diagram: eqf(`${D}=${a}x`, [`${D}=${a}+x`, `${a}=${D}x`, `${D}x=${a}`], '線分図は「道のり＝速さ×時間」。数を当てはめて式にしよう。'),
            table:   eqf(`${a}x=${D}`, [`${a}+x=${D}`, `${fracT('x', a)}=${D}`, `${D}x=${a}`], '表の「道のり・速さ・時間」を読もう。「速さ×時間＝道のり」を式にしよう。')
        };
    }
    if (p.kind === 'k2') {
        return {
            diagram: eqf(`${D}=${t}x`, [`${D}=${t}+x`, `${t}=${D}x`, `${D}x=${t}`], '線分図は「道のり＝速さ×時間」。数を当てはめて式にしよう。'),
            table:   eqf(`${t}x=${D}`, [`${t}+x=${D}`, `${fracT('x', t)}=${D}`, `${D}x=${t}`], '表の「道のり・速さ・時間」を読もう。「速さ×時間＝道のり」を式にしよう。')
        };
    }
    return {
        diagram: eqf(`x=${a}\\times ${t}`, [`x=${a}\\div ${t}`, `x=${a}+${t}`, `${a}=x\\times ${t}`], '線分図は「道のり＝速さ×時間」。数を当てはめて式にしよう。'),
        table:   eqf(`${fracT('x', a)}=${t}`, [`${fracT(a, 'x')}=${t}`, `${a}x=${t}`, `x=${a}+${t}`], '表の「道のり・速さ・時間」を読もう。「時間＝道のり÷速さ」を式にしよう。')
    };
}

/* ---------- 基本問題：比例式（k1:Aの量をx／k2:Bの量をx／k3:全体をx） ---------- */
function genKHirei(kind) {
    if (kind === 'k3') return Object.assign(genHireiRatio(), {kind: 'k3', sub: 'ratio'});
    if (kind === 'k2') return Object.assign(genHirei('mix'), {kind: 'k2', sub: 'mix'});
    return Object.assign(genHirei('mix'), {kind: 'k1', sub: 'mixA'});
}

function specKHirei(p) {
    if (p.sub === 'ratio') return specHireiRatio(Object.assign({}, p, {kind: 'ratio'}));
    if (p.sub === 'mix') return specHirei(Object.assign({}, p, {kind: 'mix'}));
    /* k1：Aの量をxとおく（Bの量が分かっている） */
    const {A, B, u, m, n} = p;
    const b = p.x;
    const slots4 = [
        sl(`x（${u}）`, `求めたいもの（${A}の量）を x とおいたね。`),
        sl(`${b}（${u}）`, `${B}の量は問題文に書いてあるよ。`),
        sl(`${m}`, `${A}の比は、問題文の「${m}：${n}」の左側だよ。`),
        sl(`${n}`, `${B}の比は、問題文の「${m}：${n}」の右側だよ。`)
    ];
    const pool4 = [...new Set([...slots4.map(q => q.ans), `${m + n}`, `${b}x（${u}）`, `${n}（${u}）`])];
    const tans = ['x', `${b}`, `${m}`, `${n}`];
    const f = clampT(m / (m + n), 0.35, 0.65);
    return {
        text: `${A}と${B}を${m}：${n}の割合で混ぜます。${B}を${b}${u}使うとき、${A}は何${u}必要ですか。`,
        varAns: `${A}の量`,
        varWrong: [`${B}の量`, `${A}と${B}の合計の量`, `${A}の比`],
        fill: {
            words: {
                slots: slots4,
                pool: pool4,
                layout: s => wordsT([labT(`${A}の量`, s[0]), opT('：'), labT(`${B}の量`, s[1]), opT('＝'), labT(`${A}の比`, s[2]), opT('：'), labT(`${B}の比`, s[3])])
            },
            diagram: {
                slots: slots4,
                pool: pool4,
                layout: s => dgT(
                    bar2T([[`${A}の量`, s[0], `${A}の比`, s[2], f], [`${B}の量`, s[1], `${B}の比`, s[3], 100 - f]])
                )
            },
            table: {
                slots: tans.map((ans, i) => sl(ans, slots4[i].hint)),
                pool: mkPool(tans, [`${m + n}`, `${b}x`, `${b + m}`]),
                layout: s => tableT(['', A, B], [
                    [`量（${u}）`, s[0], s[1]],
                    ['比', s[2], s[3]]
                ])
            }
        },
        eqAns: `x:${b}=${m}:${n}`,
        eqWrong: [`${b}:x=${m}:${n}`, `x:${b}=${n}:${m}`, `x:${m}=${n}:${b}`],
        eqHint: `「${A}の量：${B}の量 ＝ ${A}の比：${B}の比」を式にしよう。順番をそろえることが大切だよ。`,
        best: 'table',
        fit: {
            words:   {mark: '○', msg: `言葉の式は「${A}の量：${B}の量 ＝ ${A}の比：${B}の比」と、そのまま比例式にできるよ。`},
            diagram: {mark: '○', msg: '線分図でも、1本の線の上に量、下に比を並べて表せるけれど、表のほうが同じ品物どうしを縦に見比べやすいかも。'},
            table:   {mark: '◎', msg: '表は「量」と「比」を縦に並べて、同じ品物どうしを横に見比べられるので、比例式の順番がまちがいにくい！'}
        }
    };
}

/* ---------- 基本問題：過不足（k1:人数をx／k2:全体の数をx。1人に配る数の差は1） ---------- */
function genKKafusoku(kind) {
    const items = [
        ['えんぴつ', '本', '生徒'],
        ['あめ', '個', '子ども'],
        ['色紙', '枚', '生徒'],
        ['みかん', '個', '子ども'],
        ['ノート', '冊', '生徒']
    ];
    const [A, u, H] = items[randInt(0, items.length - 1)];
    let a, x, r1, r2;
    do {
        a = randInt(2, 6);
        x = randInt(6, 25);
        r1 = randInt(2, 20);
        r2 = x - r1;
    } while (r2 < 2 || r2 > 25 || r1 === r2);
    return {kind: kind, sub: (kind === 'k1') ? 'haifu' : 'total', A, u, H, a, c: a + 1, x, r1, r2};
}

function specKKafusoku(p) {
    if (p.sub === 'haifu') {
        /* k1：人数をxとおく（演習の「配る」と同じ形。表は縦横を入れ替え） */
        const sp = specKafusoku(Object.assign({}, p, {kind: 'haifu'}));
        const t = sp.fill.table;
        const u = p.u;
        sp.xText = `${p.H}の人数をxとおいて、全体の数を2通りの式で表す。`;
        sp.fill.table = {
            slots: [t.slots[0], t.slots[2], t.slots[1], t.slots[3]],
            pool: t.pool,
            layout: s => tableT(['', `配った数（${u}）`, `過不足（${u}）`], [
                [`${p.a}${u}ずつ`, s[0], s[1]],
                [`${p.c}${u}ずつ`, s[2], s[3]]
            ])
        };
        return sp;
    }
    /* k2：全体の数をxとおく（p.x は人数で、図の長さの計算にだけ使う） */
    const {A, u, H, a, c, r1, r2} = p;
    const lab = (t, s) => `<div class="col"><div class="lab">${t}</div>${s}</div>`;
    const g1 = `x-${r1}（${u}）`;
    const g2 = `x+${r2}（${u}）`;
    const xs = `x（${u}）`;
    const hG1 = `${a}${u}ずつ配ると${r1}${u}余るね。配った数は「全体の数−余り」だよ。`;
    const hG2 = `${c}${u}ずつ配ると${r2}${u}不足するね。配りたい数は「全体の数＋不足」だよ。`;
    const hA = `${a}${u}ずつ配るときの1人分は${a}${u}だよ。`;
    const hC = `${c}${u}ずつ配るときの1人分は${c}${u}だよ。`;
    const hX = '求めたいもの（全体の数）を x とおいたね。';
    const hR1 = `${a}${u}ずつ配ると${r1}${u}余るね。余りは問題文に書いてあるよ。`;
    const hR2 = `${c}${u}ずつ配ると${r2}${u}不足するね。不足は問題文に書いてあるよ。`;

    /* 言葉の式：（全体の数−余り）÷1人分＝（全体の数＋不足）÷1人分 */
    const wAns = [xs, `${r1}（${u}）`, `${a}（${u}）`, xs, `${r2}（${u}）`, `${c}（${u}）`];
    const wHints = [hX, hR1, hA, hX, hR2, hC];
    const wSlots = wAns.map((ans, i) => sl(ans, wHints[i]));
    const wPool = mkPool(wAns, [`${r1 + r2}（${u}）`, `${a + c}（${u}）`]);

    /* 線分図：全体の個数→余り→配った数、全体の個数→不足→配った数 の順 */
    const dAns = [xs, `${r1}（${u}）`, g1, xs, `${r2}（${u}）`, g2];
    const dHints = [hX, hR1, hG1, hX, hR2, hG2];
    const dSlots = dAns.map((ans, i) => sl(ans, dHints[i]));
    const dPool = mkPool(dAns, [`x+${r1}（${u}）`, `x-${r2}（${u}）`, `${r1 + r2}（${u}）`]);

    /* 表：過不足→配った数（5個ずつ、6個ずつ の順） */
    const tans = [`+${r1}`, `x-${r1}`, `-${r2}`, `x+${r2}`];
    const thints = [
        `${a}${u}ずつ配ると${r1}${u}余るね。余りは「＋」で表そう。`,
        hG1,
        `${c}${u}ずつ配ると${r2}${u}不足するね。不足は「−」で表そう。`,
        hG2
    ];

    const T = a * p.x + r1;
    const f1 = clampT(a * p.x / T, 0.35, 0.65);
    const fr2 = clampT(r2 / (T + r2), 0.28, 0.4);
    const w1 = 100 - fr2;
    return {
        text: `${A}を何人かの${H}に配ります。${a}${u}ずつ配ると${r1}${u}余り、${c}${u}ずつ配ると${r2}${u}不足します。${A}は全部で何${u}ありますか。`,
        varAns: `${A}の全体の数`,
        xText: `全体の数をxとおいて、${H}の人数を2通りの式で表す。`,
        varWrong: [`${H}の人数`, `1人に配る${A}の数`, `余った${A}の数`],
        fill: {
            words: {
                slots: wSlots,
                pool: wPool,
                layout: s => `<div class="words tight">`
                    + `<div class="op">（</div>${lab(`${A}の数`, s[0])}<div class="op">−</div>${lab('余り', s[1])}<div class="op">）</div>`
                    + `<div class="op">÷</div>${lab('1人分', s[2])}`
                    + `<div class="op">＝</div>`
                    + `<div class="op">（</div>${lab(`${A}の数`, s[3])}<div class="op">＋</div>${lab('不足', s[4])}<div class="op">）</div>`
                    + `<div class="op">÷</div>${lab('1人分', s[5])}</div>`
            },
            diagram: {
                slots: dSlots,
                pool: dPool,
                layout: s => dgI(
                    barTopT('全体の個数', s[0], [['配った数', s[2], f1], ['余り', s[1], 100 - f1]], w1)
                    + '<div style="height:8px;"></div>'
                    + barTopT('配った数', s[5], [['全体の個数', s[3], w1], ['不足', s[4], fr2]], 100)
                )
            },
            table: {
                slots: tans.map((ans, i) => sl(ans, thints[i])),
                pool: mkPool(tans, [`-${r1}`, `+${r2}`, `x+${r1}`, `x-${r2}`]),
                layout: s => tableT(['', `過不足（${u}）`, `配った数（${u}）`], [
                    [`${a}${u}ずつ`, s[0], s[1]],
                    [`${c}${u}ずつ`, s[2], s[3]]
                ])
            }
        },
        eqAns: `${fracT(`x-${r1}`, a)}=${fracT(`x+${r2}`, c)}`,
        eqWrong: [
            `${fracT(`x+${r1}`, a)}=${fracT(`x-${r2}`, c)}`,
            `${fracT(a, `x-${r1}`)}=${fracT(c, `x+${r2}`)}`,
            `${fracT(`x-${r1}`, c)}=${fracT(`x+${r2}`, a)}`
        ],
        eqHint: '「（全体の数−余り）÷1人分」と「（全体の数＋不足）÷1人分」は、どちらも人数。どちらの配り方でも人数は同じだから、この2つが等しいことを式にしよう。',
        best: 'words',
        fit: {
            words:   {mark: '◎', msg: `言葉の式は「（${A}の数−余り）÷1人分＝（${A}の数＋不足）÷1人分」と書けるので、2通りの配り方の人数が等しいことを、そのまま式にできるよ！`},
            diagram: {mark: '△', msg: '線分図は「全体の数−余り」「全体の数＋不足」を表せるけれど、何個ずつ配ったのかは図に書かれていないので、方程式までは見えにくくて、少し使いづらかったかも。'},
            table:   {mark: '○', msg: '表は「過不足」と「配った数」を、配り方ごとに整理できるよ。ただ、「配った数÷何個ずつ」が人数になる関係は、言葉の式のほうが式にしやすいかも。'}
        }
    };
}

function eqFormKKafusoku(p) {
    return {};
}

function eqFormKHirei(p) {
    return (p.sub === 'ratio') ? eqFormHirei(Object.assign({}, p, {kind: 'ratio'})) : {};
}

function eqFormKafusoku(p) {
    const {a, c, r1, r2} = p;
    return {
        diagram: eqf(`${a}x+${r1}+${r2}=${c}x`,
            [`${a}x+${r1}-${r2}=${c}x`, `${a}x+${r1}=${c}x`, `${a}x-${r1}-${r2}=${c}x`],
            '線分図で、上の線の全体に不足の分を足すと、下の線の全体と等しくなるよ。')
    };
}

function eqFormHayasa(p) {
    if (p.kind === 'oikake') {
        const {v1, v2, t} = p;
        return {
            diagram: eqf(`${v1}(x+${t})=${v2}x`,
                [`${v1}x+${t}=${v2}x`, `${v1}(x-${t})=${v2}x`, `${v1}(x+${t})=${v2}(x+${t})`],
                '線分図は、兄と弟の道のりが同じ長さ。「弟の道のり ＝ 兄の道のり」を式にしよう。')
        };
    }
    if (p.kind === 'chigai') {
        const {a, b, t} = p;
        return {
            diagram: eqf(`${fracT('x', a)}=${fracT('x', b)}+${t}`,
                [`${fracT('x', b)}=${fracT('x', a)}+${t}`, `${fracT(a, 'x')}=${fracT(b, 'x')}+${t}`, `${fracT('x', a)}=${fracT('x', b)}-${t}`],
                '線分図は「遅い方の時間 ＝ 速い方の時間 ＋ 時間の差」。時間＝道のり÷速さ だよ。')
        };
    }
    if (p.kind === 'deau') {
        const {v1, v2, t, D, Dm} = p;
        return {
            diagram: eqf(`${Dm}=${v1}x+${v2}(x-${t})`,
                [`${D}=${v1}x+${v2}(x-${t})`, `${Dm}=${v1}x+${v2}(x+${t})`, `${Dm}=${v1}x+${v2}x-${t}`],
                '線分図は「全体＝部分の和」。「家の間の道のり ＝ Aさんの道のり ＋ Bさんの道のり」を式にしよう。単位をそろえることと、Bさんの時間に気をつけよう。')
        };
    }
    if (p.kind === 'dist') {
        const {a, b, T} = p;
        return {
            diagram: eqf(`${T}=${fracT('x', a)}+${fracT('x', b)}`,
                [`${T}=${fracT(a, 'x')}+${fracT(b, 'x')}`, `${T}=${a}x+${b}x`, `${T}=${fracT('x', a)}-${fracT('x', b)}`],
                '線分図は「全体＝部分の和」。「往復の時間 ＝ 行きの時間 ＋ 帰りの時間」を式にしよう。時間＝道のり÷速さ だよ。')
        };
    }
    const {a, b, t, D} = p;
    return {
        diagram: eqf(`${D}=${a}x+${b * t}`,
            [`${D}=${a}x+${b}x`, `${D}=${a * t}+${b}x`, `${D}=${a}+x+${b * t}`],
            '線分図は「全体＝部分の和」。「全体の道のり ＝ 歩いた道のり ＋ 走った道のり」を式にしよう。')
    };
}

/* 比例式は、表も線分図も「横に読むとそのまま比」になるので、言葉の式と同じ形。「比で分ける」の線分図だけ縦に読む */
function eqFormHirei(p) {
    if (p.kind === 'ratio') {
        const {m, n, a} = p;
        return {
            diagram: eqf(`x:${a}=${m + n}:${m}`,
                [`x:${a}=${m}:${m + n}`, `x:${a}=${m}:${n}`, `${a}:x=${m + n}:${m}`],
                '線分図で、「全体の数：兄の数 ＝ 全体の比：兄の比」と読んで式にしよう。')
        };
    }
    return {};
}

/* 年齢の表は「子→父」の順に並ぶので、方程式も表の順（左が子、右が父）にそろえる */
function eqFormNenrei(p) {
    const A = ageParams(p);
    const {Fl, Cl, when, k, aF, aC} = A;
    const swapSides = e => e.split('=').reverse().join('=');
    return {
        table: eqf(`${k}(${aC})=${aF}`,
            A.eqWrong.map(swapSides),
            `表の「${when}の年齢」の欄を、左（${Cl}）から順に読もう。「${when}の${Cl}の${k}倍 ＝ ${when}の${Fl}」を式にしよう。`)
    };
}

/* 割合の線分図は「全体＝部分の和」の形で読む（表・言葉の式は計算前の形＝eqAns） */
function eqFormWariai(p) {
    if (p.kind === 'megane') {
        const fa = fracT(p.a, 100);
        const fb = fracT(p.b, 100);
        return {
            diagram: eqf(`${p.M}=${fa}x+${fb}(${p.T}-x)`,
                [`${p.M}=${fa}x+${fb}x`, `${p.M}=${fa}(${p.T}-x)+${fb}x`, `${p.T}=${fa}x+${fb}(${p.T}-x)`],
                '線分図は「全体＝部分の和」。「メガネの人数 ＝ 男子のメガネ ＋ 女子のメガネ」を式にしよう。')
        };
    }
    if (p.kind === 'bubun') return {};
    const D = wariaiData(p);
    const den = (p.kind === 'waribiki') ? 10 : 100;
    const num = (p.kind === 'waribiki') ? p.w : p.r;
    const d = fracT(num, den);
    const s = fracT((p.kind === 'zouka') ? den + num : den - num, den);
    const P = p.P;
    if (p.kind === 'zouka') {
        return {
            diagram: eqf(`${P}=x+${d}x`,
                [`${P}=x+${s}x`, `${P}=x-${d}x`, `${P}=${d}x`],
                '線分図は「全体＝部分の和」。「今年 ＝ 去年 ＋ 増えた分」を式にしよう。')
        };
    }
    const whole = (p.kind === 'waribiki') ? '定価 ＝ 割引額 ＋ 売値' : '全体 ＝ 男子 ＋ 女子';
    const table = (p.kind === 'nokori')
        ? eqf(`${d}x+${P}=x`, [`${s}x+${P}=x`, `${d}x=${P}`, `${d}x+x=${P}`],
            '表の順に読もう。「男子 ＋ 女子 ＝ 全体」を式にしよう。')
        : undefined;
    return {
        table: table,
        diagram: eqf(`x=${d}x+${P}`,
            [`x=${s}x+${P}`, `x+${d}x=${P}`, `${d}x=${P}`],
            `線分図は「全体＝部分の和」。「${whole}」を式にしよう。`)
    };
}

const EQ_FORMS = {k_kafusoku: eqFormKKafusoku, k_hirei: eqFormKHirei, k_hayasa: eqFormKHayasa, k_otsuri: eqFormKOtsuri, k_daikin: eqFormKDaikin, wariai: eqFormWariai, otsuri: eqFormOtsuri, daikin: eqFormDaikin, kafusoku: eqFormKafusoku, hayasa: eqFormHayasa, hirei: eqFormHirei, nenrei: eqFormNenrei};

const GENS  = {
k_kafusoku: genKKafusoku, k_hirei: genKHirei, k_hayasa: genKHayasa, k_otsuri: genKOtsuri, k_daikin: genKDaikin, daikin: genDaikin, otsuri: genOtsuri, kafusoku: genKafusoku, hayasa: genHayasa, hirei: genHirei, nenrei: genNenrei, wariai: genWariai, hatten1: genHatten1, hatten2: genHatten2};
const SPECS = {k_kafusoku: specKKafusoku, k_hirei: specKHirei, k_hayasa: specKHayasa, k_otsuri: specKOtsuri, k_daikin: specKDaikin, daikin: specDaikin, otsuri: specOtsuri, kafusoku: specKafusoku, hayasa: specHayasa, hirei: specHirei, nenrei: specNenrei, wariai: specWariai, hatten1: specHatten1, hatten2: specHatten2};
