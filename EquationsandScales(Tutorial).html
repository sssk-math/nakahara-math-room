      }
    }

    /* 5-5-6. 数式のパース */
    function parseSide(str) {
      let groups = [];
      let x = 0;
      let num = 0;
      const fracGroupRegex = /([+-]?)(?:\(([^)]+)\)|([^\s=/+-]+))\s*\/\s*(-?\d+)(x?)/g;
      let cleanStr = str;
      let match;

      while ((match = fracGroupRegex.exec(str)) !== null) {
        let sign = match[1] === '-' ? -1 : 1;
        let innerStr = match[2] || match[3];
        let inner = parseTerms(innerStr);
        let denom = parseInt(match[4], 10);
        const hasTrailingX = (match[5] === 'x');
        if (denom !== 0) {
          if (denom < 0) { denom = -denom; sign = -sign; }
          if (hasTrailingX) {
            // 分数の直後にxが続く場合(例: "3/4x" = (3/4)×x)は、xにかかる係数の分数として扱う
            groups.push({ x: inner.x + inner.num, num: 0, denom: denom, sign: sign });
          } else {
            // 分子がxそのものの場合(例: "x/5")は、表示でも「x/denom」の形を保つ印を付ける
            const xNumeratorStyle = (innerStr === 'x' && inner.x === 1 && inner.num === 0);
            groups.push({ x: inner.x, num: inner.num, denom: denom, sign: sign, xNumeratorStyle: xNumeratorStyle });
          }
        }
        cleanStr = cleanStr.replace(match[0], '');
      }

      const groupRegex = /([+-]?\d*)\(([^)]+)\)/g;
      let strForGroup = cleanStr;

      while ((match = groupRegex.exec(strForGroup)) !== null) {
        let coeffStr = match[1];
        let coeff = 1;
        if (coeffStr === '-') coeff = -1;
        else if (coeffStr === '+' || coeffStr === '') coeff = 1;
        else coeff = parseInt(coeffStr, 10);

        const inner = parseTerms(match[2]);
        const sign = coeff < 0 ? -1 : 1;
        const count = Math.abs(coeff);

        if (coeff === 1 || inner.num === 0) {
          x += coeff * inner.x;
          num += coeff * inner.num;
        } else {
          groups.push({ x: inner.x, num: inner.num, denom: 1, sign: sign, count: count });
        }
        cleanStr = cleanStr.replace(match[0], '');
      }
      const rest = parseTerms(cleanStr);
      x += rest.x;
      num += rest.num;

      return { x, num, groups };
    }

    function parseTerms(str) {
      let x = 0;
      let num = 0;
      if (!str) return { x, num };
      const terms = str.match(/([+-]?[^+-]+)/g) || [];
      terms.forEach(term => {
        if (term.includes('x')) {
          let coeffStr = term.replace('x', '');
          if (coeffStr.includes('/')) {
            const parts = coeffStr.split('/');
            let nStr = parts[0];
            let dStr = parts[1].replace(/[()]/g, '');
            let nVal = (nStr === '' || nStr === '+') ? 1 : (nStr === '-' ? -1 : parseFloat(nStr));
            let dVal = parseFloat(dStr);
            if (!isNaN(nVal) && !isNaN(dVal) && dVal !== 0) {
              x += nVal / dVal;
            }
          } else {
            if (coeffStr === '' || coeffStr === '+') coeffStr = '1';
            if (coeffStr === '-') coeffStr = '-1';
            x += parseFloat(coeffStr);
          }
        } else {
          num += parseFloat(term);
        }
      });
      return { x, num };
    }

    function resetToInput() {
      if (window.isAnimating) return;
      setupFromInput();
    }

    // ========================================================
    // 5-6. ランダム問題生成
    // ========================================================
    /* 5-6-1. ランダム問題生成 */
    function generateQuizData() {
      if (window.isAnimating) return;
      const chkEquality = document.getElementById('chkEquality').checked;
      const chkWithBrackets = document.getElementById('chkWithBrackets').checked;
      const chkWithFractions = document.getElementById('chkWithFractions').checked;

      const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const getRandomNonZero = (min, max, excludeList = []) => {
          let val;
          do { val = getRandomInt(min, max); } while (val === 0 || excludeList.includes(val));
          return val;
      };

      let leftStr = '';
      let rightStr = '';
      let valid = false;

      while (!valid) {
          let xVal = getRandomNonZero(-5, 5);
          if (chkEquality) {
              const type = getRandomInt(0, 2);
              if (type === 0) {
                  const a = getRandomNonZero(-9, 9);
                  const b = xVal + a;
                  leftStr = a > 0 ? `x + ${a}` : `x - ${Math.abs(a)}`;
                  rightStr = `${b}`;
                  valid = true;
              } else if (type === 1) {
                  const a = getRandomNonZero(-5, 5, [1]);
                  const b = a * xVal;
                  leftStr = a === -1 ? `-x` : `${a}x`;
                  rightStr = `${b}`;
                  valid = true;
              } else {
                  const allowed = [-6, -4, -3, -2, 2, 3, 4, 6];
                  const a = allowed[getRandomInt(0, allowed.length - 1)];
                  const b = allowed[getRandomInt(0, allowed.length - 1)];
                  const xSol = a * b;
                  if (xSol >= -36 && xSol <= 36) {
                      leftStr = a > 0 ? `x/${a}` : `-x/${Math.abs(a)}`;
                      rightStr = `${b}`;
                      valid = true;
                  }
              }
          } else {
              let leftCandidates = [];
              let rightCandidates = [];
              if (!chkWithBrackets && !chkWithFractions) {
                leftCandidates = ['N']; rightCandidates = ['N'];
              } else if (chkWithBrackets && !chkWithFractions) {
                leftCandidates = ['N', 'K']; rightCandidates = ['N', 'K'];
              } else if (!chkWithBrackets && chkWithFractions) {
                leftCandidates = ['N', 'B']; rightCandidates = ['N', 'B'];
              } else {
                leftCandidates = ['N', 'K', 'B', 'F']; rightCandidates = ['N', 'K', 'B', 'F'];
              }

              let lPat = leftCandidates[getRandomInt(0, leftCandidates.length - 1)];
              let rPat = rightCandidates[getRandomInt(0, rightCandidates.length - 1)];

              if (chkWithFractions && !['B', 'F'].includes(lPat) && !['B', 'F'].includes(rPat)) continue;

              let freeLDenom = null, freeRDenom = null;
              if (!chkWithBrackets && chkWithFractions) {
                const denomPool = [2, 3, 4, 6, -2, -3, -4, -6];
                if (lPat === 'B') freeLDenom = denomPool[getRandomInt(0, denomPool.length - 1)];
                if (rPat === 'B') freeRDenom = denomPool[getRandomInt(0, denomPool.length - 1)];
                if (freeLDenom !== null || freeRDenom !== null) {
                  const a1 = Math.abs(freeLDenom || 1);
                  const a2 = Math.abs(freeRDenom || 1);
                  const lcmVal = (a1 * a2) / gcd(a1, a2);
                  xVal = lcmVal * getRandomNonZero(-3, 3);
                }
              }

              let leftVal = 0, leftCoeff = 0, lStr = '';
              const getDivisors = (n) => {
                  let divs = []; let absN = Math.abs(n);
                  for (let i = 2; i <= absN; i++) {
                      if (absN % i === 0) { divs.push(i); divs.push(-i); }
                  }
                  return divs;
              };

              let lA, lB;
              if (lPat === 'N') {
                  lA = getRandomNonZero(-5, 5); lB = getRandomInt(-5, 5);
                  leftVal = lA * xVal + lB; leftCoeff = lA;
                  const parts = [];
                  if (lA !== 0) parts.push(formatTerm(lA, true, true));
                  if (lB !== 0) parts.push(formatTerm(lB, false, parts.length === 0));
                  lStr = parts.length > 0 ? parts.join(' ') : '0';
              } else if (lPat === 'K') {
                  lA = getRandomNonZero(-5, 5, [1]); lB = getRandomInt(-5, 5);
                  if (Math.abs(lA * lB) > 9) continue;
                  leftVal = lA * (xVal + lB); leftCoeff = lA;
                  let innerStr = formatTerm(1, true, true);
                  if (lB !== 0) innerStr += ' ' + formatTerm(lB, false, false);
                  let prefix = lA === 1 ? '' : (lA === -1 ? '-' : `${lA}`);
                  lStr = lB === 0 ? formatTerm(lA, true, true) : (lA === 1 ? innerStr : `${prefix}(${innerStr})`);
              } else if (lPat === 'B') {
                  if (freeLDenom !== null) {
                    lA = freeLDenom;
                  } else {
                    let divs = getDivisors(xVal).filter(d => [2, 3, 4, 6, -2, -3, -4, -6].includes(d));
                    if (divs.length === 0) continue;
                    lA = divs[getRandomInt(0, divs.length - 1)];
                  }
                  lB = getRandomInt(-5, 5);
                  leftVal = (xVal / lA) + lB; leftCoeff = 1 / lA;
                  const parts = [];
                  parts.push(lA > 0 ? `x/${lA}` : `-x/${Math.abs(lA)}`);
                  if (lB !== 0) parts.push(lB > 0 ? `+ ${lB}` : `- ${Math.abs(lB)}`);
                  lStr = parts.join(' ');
              } else if (lPat === 'F') {
                  const allowedDenoms = [-6, -4, -3, -2, 2, 3, 4, 6];
                  lA = allowedDenoms[getRandomInt(0, allowedDenoms.length - 1)];
                  let bCands = [];
                  for (let b = -5; b <= 5; b++) {
                      if ((xVal + b) % lA === 0) bCands.push(b);
                  }
                  if (bCands.length === 0) continue;
                  lB = bCands[getRandomInt(0, bCands.length - 1)];
                  leftVal = (xVal + lB) / lA; leftCoeff = 1 / lA;
                  let innerStr = formatTerm(1, true, true);
                  if (lB !== 0) innerStr += ' ' + formatTerm(lB, false, false);
                  lStr = lA > 0 ? `(${innerStr})/${lA}` : `-(${innerStr})/${Math.abs(lA)}`;
              }

              let rightCoeff = 0, rStr = '', rA, rB;
              if (rPat === 'N') {
                  rA = getRandomNonZero(-5, 5); rB = leftVal - rA * xVal;
                  if (rB < -15 || rB > 15) continue;
                  rightCoeff = rA;
                  const parts = [];
                  if (rA !== 0) parts.push(formatTerm(rA, true, true));
                  if (rB !== 0) parts.push(formatTerm(rB, false, parts.length === 0));
                  rStr = parts.length > 0 ? parts.join(' ') : '0';
              } else if (rPat === 'K') {
                  rA = getRandomNonZero(-5, 5, [1]);
                  if (leftVal % rA !== 0) continue;
                  rB = (leftVal / rA) - xVal;
                  if (rB < -5 || rB > 5) continue;
                  if (Math.abs(rA * rB) > 9) continue;
                  rightCoeff = rA;
                  let innerStr = formatTerm(1, true, true);
                  if (rB !== 0) innerStr += ' ' + formatTerm(rB, false, false);
                  let prefix = rA === 1 ? '' : (rA === -1 ? '-' : `${rA}`);
                  rStr = rB === 0 ? formatTerm(rA, true, true) : (rA === 1 ? innerStr : `${prefix}(${innerStr})`);
              } else if (rPat === 'B') {
                  if (freeRDenom !== null) {
                    rA = freeRDenom;
                  } else {
                    let divs = getDivisors(xVal).filter(d => [2, 3, 4, 6, -2, -3, -4, -6].includes(d));
                    if (divs.length === 0) continue;
                    rA = divs[getRandomInt(0, divs.length - 1)];
                  }
                  rB = leftVal - (xVal / rA);
                  if (rB < -15 || rB > 15) continue;
                  rightCoeff = 1 / rA;
                  const parts = [];
                  parts.push(rA > 0 ? `x/${rA}` : `-x/${Math.abs(rA)}`);
                  if (rB !== 0) parts.push(rB > 0 ? `+ ${rB}` : `- ${Math.abs(rB)}`);
                  rStr = parts.join(' ');
              } else if (rPat === 'F') {
                  const allowedDenoms = [-6, -4, -3, -2, 2, 3, 4, 6];
                  rA = allowedDenoms[getRandomInt(0, allowedDenoms.length - 1)];
                  rB = leftVal * rA - xVal;
                  if (rB < -15 || rB > 15) continue;
                  rightCoeff = 1 / rA;
                  let innerStr = formatTerm(1, true, true);
                  if (rB !== 0) innerStr += ' ' + formatTerm(rB, false, false);
                  rStr = rA > 0 ? `(${innerStr})/${rA}` : `-(${innerStr})/${Math.abs(rA)}`;
              }

              if (chkWithBrackets && !lStr.includes('(') && !rStr.includes('(')) continue;

              if (Math.abs(leftCoeff - rightCoeff) < 0.001) continue;

              leftStr = lStr;
              rightStr = rStr;
              valid = true;
          }
      }
      document.getElementById('eqInput').value = `${leftStr} = ${rightStr}`;
      setupFromInput();
      showEqPreview();
    }

    }

    // ========================================================
    // 5-8. 天秤操作（ボタンアクション）
    // ========================================================
    /* 5-8-1. 袋を破く（展開） */
    function popBag(side, index) {
      if (isCompleted || window.isAnimating) return;
      if (isPendingOp()) {
        showAlert('反対側の皿の操作を先に終えてね！', false);
        return;
      }
      const group = state[side].groups[index];
      if (group.denom && group.denom > 1) {
        showAlert(`先に両辺を ${group.denom} 倍して分母を払おう！`, false);
        return;
      }
      window.isAnimating = true;
      setLockState(true);

      const plateEl = document.getElementById(side === 'left' ? 'plateLeft' : 'plateRight');
      const bagEls = plateEl.querySelectorAll('.bag-item');

      if (bagEls[index]) bagEls[index].classList.add('bursting');

      setTimeout(() => {
        const gSign = group.sign || 1;
        const gCount = group.count || 1;
        const gx = gSign * group.x * gCount;
        const gnum = gSign * group.num * gCount;
        state[side].groups.splice(index, 1);

        const hasSplit = Array.isArray(state[side].x) || Array.isArray(state[side].num);
        const curX = Array.isArray(state[side].x) ? state[side].x.reduce((a, b) => a + b, 0) : state[side].x;
        const curNum = Array.isArray(state[side].num) ? state[side].num.reduce((a, b) => a + b, 0) : state[side].num;
        const cancelXCount = (!hasSplit && curX * gx < 0) ? Math.min(Math.abs(curX), Math.abs(gx)) : 0;
        const cancelNumCount = (!hasSplit && curNum * gnum < 0) ? Math.min(Math.abs(curNum), Math.abs(gnum)) : 0;
        const willAnnihilate = cancelXCount > 0 || cancelNumCount > 0;

        if (willAnnihilate) {
          renderPlate('plateLeft', state.left, 'left');
          renderPlate('plateRight', state.right, 'right');
          state[side].x += gx;
          state[side].num += gnum;
          updateScaleAndStatus();

          const targetPlateEl = document.getElementById(side === 'left' ? 'plateLeft' : 'plateRight');
          let ballX = null;
          let ballNum = null;

          if (gx !== 0) {
            ballX = document.createElement('div');
            ballX.className = `ball ${gx > 0 ? 'ball-x-pos' : 'ball-x-neg'}`;
            ballX.textContent = formatTerm(gx, true, true);
            setBallSize(ballX, 'x', gx);
            targetPlateEl.appendChild(ballX);
          }
          if (gnum !== 0) {
            ballNum = document.createElement('div');
            ballNum.className = `ball ${gnum > 0 ? 'ball-num-pos' : 'ball-num-neg'}`;
            ballNum.textContent = formatTerm(gnum, false, true);
            setBallSize(ballNum, '1', gnum);
            targetPlateEl.appendChild(ballNum);
          }

          setTimeout(() => {
            if (cancelXCount > 0 && ballX) {
              ballX.classList.add('annihilating');
              const selector = gx > 0 ? '.ball-x-neg' : '.ball-x-pos';
              const existingBall = targetPlateEl.querySelector(selector);
              if (existingBall) existingBall.classList.add('annihilating');
            }
            if (cancelNumCount > 0 && ballNum) {
              ballNum.classList.add('annihilating');
              const selector = gnum > 0 ? '.ball-num-neg' : '.ball-num-pos';
              const existingBall = targetPlateEl.querySelector(selector);
              if (existingBall) existingBall.classList.add('annihilating');
            }
            setTimeout(() => {
              window.isAnimating = false;
              setLockState(false);
              showAlert('かっこをはずしたよ！', false);
              render();
              addNotebookEntry(formatSideState(state.left), formatSideState(state.right), 'かっこを\n　はずした');
              checkCompletion();
            }, 800);
          }, 500);
        } else {
          if (Array.isArray(state[side].x)) state[side].x.push(gx); else state[side].x += gx;
          if (Array.isArray(state[side].num)) state[side].num.push(gnum); else state[side].num += gnum;
          window.isAnimating = false;
          setLockState(false);
          showAlert('かっこをはずしたよ！', false);
          render();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), 'かっこを\n　はずした');
          checkCompletion();
        }
      }, 800);
    }

    /* 5-8-3. 両辺入れかえ */
   function swapSides() {
      if (document.getElementById('btnSwap').disabled || window.isAnimating) return;
      if (isPendingOp()) {
        showAlert('反対側の皿の操作を先に終えてね！', false);
        return;
      }
      const tempState = state.left;
      state.left = state.right;
      state.right = tempState;
      const tempBase = baseState.left;
      baseState.left = baseState.right;
      baseState.right = tempBase;

      showAlert('両辺を入れかえたよ！', false);
      render();
      addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '両辺を\n　入れかえた', true);
      checkCompletion();
    }

    /* 5-8-4. 符号入れかえ */
    function changeSigns() {
      if (window.isAnimating) return;
      if (isPendingOp()) {
        showAlert('反対側の皿の操作を先に終えてね！', false);
        return;
      }

      const invertSide = (s) => {
        s.x = Array.isArray(s.x) ? s.x.map(v => -v) : -s.x;
        s.num = Array.isArray(s.num) ? s.num.map(v => -v) : -s.num;
        s.groups.forEach(g => { g.sign = -(g.sign || 1); });
        s.groups = s.groups.filter(g => {
          if ((g.denom || 1) === 1) {
            const isSingleTerm = g.num === 0 || g.x === 0;
            const isPositiveSingleCount = (g.sign || 1) === 1 && (g.count || 1) === 1;
            if (isSingleTerm || isPositiveSingleCount) {
              s.x += (g.sign || 1) * g.x * (g.count || 1);
              s.num += (g.sign || 1) * g.num * (g.count || 1);
              return false;
            }
          }
          return true;
        });
      };

      // 直前が「等分（divide）」または「かけ算（mult）」の一連の操作だった場合、そのノート履歴を削除して取得する
      let divideEntries = [];
      while (calcNotebook.length > 0 && calcNotebook[calcNotebook.length - 1].opType === 'divide') {
        divideEntries.unshift(calcNotebook.pop());
      }

      let multEntries = [];
      while (calcNotebook.length > 0 && calcNotebook[calcNotebook.length - 1].opType === 'mult') {
        multEntries.unshift(calcNotebook.pop());
      }

      invertSide(state.left);
      invertSide(state.right);
      invertSide(baseState.left);
      invertSide(baseState.right);

      if (divideEntries.length > 0) {
        // 直前の等分処理をマイナスで割る処理へ書き換える
        const firstDiv = divideEntries[0];
        const prevK = firstDiv.divideK;
        const newK = -prevK;
        const origLeft = firstDiv.origLeft;
        const origRight = firstDiv.origRight;

        showAlert(`すべての項の符号を入れかえたよ！`, false);

        const chkEquality = document.getElementById('chkEquality').checked;
        if (chkEquality && origLeft !== undefined && origRight !== undefined) {
          const stepLeft = toPerTermFraction(origLeft, newK);
          const stepRight = toPerTermFraction(origRight, newK);
          addNotebookEntry(stepLeft, stepRight, `両辺を\n　${newK}で割った`, false, { opType: 'divide', origLeft, origRight, divideK: newK });
          addNotebookEntry(formatSideState(state.left), stepRight, '', false, { opType: 'divide', divideK: newK });
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'divide', divideK: newK });
        } else {
          const stepLeft = toPerTermFraction(origLeft, newK);
          const stepRight = toPerTermFraction(origRight, newK);
          addNotebookEntry(stepLeft, stepRight, `両辺を\n　 ${newK} で割った`, false, { opType: 'divide', origLeft, origRight, divideK: newK });
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'divide', origLeft, origRight, divideK: newK });
        }
      } else if (multEntries.length > 0) {
        // 直前がかけ算（mult）だった場合、直前の3つの式を消去してマイナス倍の処理に書き換える（修正②）
        const firstMult = multEntries[0];
        const origLeft = firstMult.origLeft;
        const origRight = firstMult.origRight;
        const origFactor = firstMult.origFactor;
        const newFactor = -origFactor;

        showAlert(`すべての項の符号を入れかえたよ！`, false);

        const factorStr = newFactor > 0 ? `${newFactor}` : `(${newFactor})`;
        const wrapPoly = (str) => {
            const trimmed = str.trim();
            if (/^-?\d*\(.+\)$/.test(trimmed)) return str;
            const terms = splitTopLevelTerms(trimmed);
            return terms.length > 1 ? `(${str})` : str;
          };
        const stepLeft = `${wrapPoly(origLeft)} * ${factorStr}`;
        const stepRight = `${wrapPoly(origRight)} * ${factorStr}`;

        const chkEquality = document.getElementById('chkEquality').checked;
        if (chkEquality) {
          addNotebookEntry(stepLeft, stepRight, `両辺を\n　${newFactor}倍した`, false, { opType: 'mult', origLeft, origRight, origFactor: newFactor });
          addNotebookEntry(formatSideState(state.left), stepRight, '', false, { opType: 'mult', origLeft, origRight, origFactor: newFactor });
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'mult', origLeft, origRight, origFactor: newFactor });
        } else {
          addNotebookEntry(stepLeft, stepRight, `両辺を\n　${newFactor} 倍した`, false, { opType: 'mult', origLeft, origRight, origFactor: newFactor });
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'mult', origLeft, origRight, origFactor: newFactor });
        }
      } else {
        showAlert('すべての項の符号を入れかえたよ！', false);
        addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '符号を\n　入れかえた', true, { opType: 'sign' });
      }

      isCompleted = false;
      const isSolved = checkCompletion();
      if (!isSolved) {
        setLockState(false);
      }
      render();
    }

    // ========================================================
    // 5-9. 描画・アニメーション処理
    // ========================================================
    /* 5-9-1. アラートメッセージ表示 */
    function showAlert(msg, isSuccess = false) {
      const alertEl = document.getElementById('alertMessage');
      alertEl.innerHTML = msg;
      if (isSuccess) alertEl.classList.add('success');
      else alertEl.classList.remove('success');
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([alertEl]).catch(() => {});
      }
    }

    /* 5-9-2. 画面全体の再描画 */
    function render() {
      renderPlate('plateLeft', state.left, 'left');
      renderPlate('plateRight', state.right, 'right');
      updateScaleAndStatus();
    }

    /* 5-9-3. お皿の描画 */
    function renderPlate(plateId, plateState, side) {
      const plate = document.getElementById(plateId);
      plate.innerHTML = '';
      plateState.groups.forEach((g, index) => {
        const bag = document.createElement('div');
        const isFrac = g.denom && g.denom > 1;
        bag.className = `bag-item ${isFrac ? 'frac-bag' : ''} ${isCompleted ? 'disabled' : ''}`;
        
        let innerParts = [];
        if (g.x !== 0) innerParts.push(formatTerm(g.x, true, true));
        if (g.num !== 0) innerParts.push(formatTerm(g.num, false, innerParts.length === 0));
        let innerStr = innerParts.join(' ');
        const sign = g.sign || 1;
        const cnt = g.count || 1;
        const cntStr = cnt > 1 ? cnt : '';
        const hasOp = innerParts.length > 1;
        const needsParen = hasOp || (sign === -1 && innerStr.startsWith('-'));

        if (isFrac) {
          const needsFracParen = hasOp || innerStr.startsWith('-');
          const numStr = (cnt > 1 || needsFracParen) ? `${cntStr}(${innerStr})` : innerStr;
          bag.innerHTML = `${sign === -1 ? '-' : ''}<div class="frac-box"><div class="frac-num">${numStr}</div><div class="frac-den">${g.denom}</div></div>`;
          bag.title = '両辺をかけて分母を払うと開けます';
        } else {
          if (sign === 1 && cnt === 1) {
            bag.textContent = innerStr;
          } else {
            bag.textContent = (cnt > 1 || needsParen) ? `${sign === -1 ? '-' : ''}${cntStr}(${innerStr})` : `${sign === -1 ? '-' : ''}${innerStr}`;
          }
          bag.title = 'クリックして袋を破く（展開）';
        }
        if (!isCompleted) bag.onclick = () => popBag(side, index);
        plate.appendChild(bag);
      });
      renderBalls(plate, 'x', plateState.x, side);
      renderBalls(plate, '1', plateState.num, side);
    }
    
    function renderBalls(container, type, count, side) {
      const vals = Array.isArray(count) ? count : [count];
      vals.forEach((val, index) => {
        if (Math.abs(val) < 1e-9) return;
        const isPositive = val > 0;
        const ball = document.createElement('div');
        ball.className = `ball ${type === 'x' ? (isPositive ? 'ball-x-pos' : 'ball-x-neg') : (isPositive ? 'ball-num-pos' : 'ball-num-neg')}`;
        ball.textContent = formatTerm(val, type === 'x', true);
        setBallSize(ball, type, val);

        if (!isCompleted) {
          if (typeof handlePointerDown === 'function') {
            ball.onpointerdown = (e) => handlePointerDown(e, 'plate', side, type, val, index);
          }
        } else {
          ball.classList.add('disabled');
        }
        container.appendChild(ball);
      });
    }

    /* 5-9-3-2. 球の分裂（分解）処理 */
    function splitBall(side, type, val) {
      if (isCompleted || window.isAnimating) return;
      if (isPendingOpForGrab()) {
        showAlert('反対側の皿の操作を先に終えてね！', false);
        return;
      }

      // すでに配列（2つ以上に分裂済み）の場合は3つ以上には分裂させない
      if (Array.isArray(state[side][type === 'x' ? 'x' : 'num'])) return;

      if (side === 'left' && type === 'x') {
        const B = getTotalX(baseState.right);
        if (B === 0) return; // 相手の皿にターゲットが存在しない（0）場合はクリック不可
        const A = val;
        state.left.x = [B, A - B];
        render();
      } else if (side === 'right' && (type === '1' || type === 'num')) {
        const D = getTotalNum(baseState.left);
        if (D === 0) return; // 相手の皿にターゲットが存在しない（0）場合はクリック不可
        const C = val;
        state.right.num = [D, C - D];
        render();
        if (window.tutorialHandsOnActive) tutorialAdvanceHandsOnStep();
      }
    }

    /* 分裂状態に対応したボール取り除き処理 */
    function removeBallFromState(side, type, val, index) {
      const prop = (type === 'x' || type === 'ball-x-pos' || type === 'ball-x-neg') ? 'x' : 'num';
      const current = state[side][prop];
      if (Array.isArray(current)) {
        if (index !== undefined && index !== null && index >= 0 && index < current.length) {
          current.splice(index, 1);
        } else {
          const idx = current.indexOf(val);
          if (idx !== -1) current.splice(idx, 1);
        }
        if (current.length === 1) {
          state[side][prop] = current[0];
        } else if (current.length === 0) {
          state[side][prop] = 0;
        }
      } else {
        state[side][prop] -= val;
      }
    }

    /* 5-9-4. 状態変更の有無をチェック */
    function hasStateDiff() {
      return (
        getTotalX(state.left) !== getTotalX(baseState.left) ||
        getTotalNum(state.left) !== getTotalNum(baseState.left) ||
        getTotalX(state.right) !== getTotalX(baseState.right) ||
        getTotalNum(state.right) !== getTotalNum(baseState.right) ||
        state.left.groups.length !== baseState.left.groups.length ||
        state.right.groups.length !== baseState.right.groups.length
      );
    }

    /* 5-9-5. 天秤の傾きとステータスの更新 */
    function updateScaleAndStatus() {
      const weightLeft = (getTotalX(state.left) * currentXValue) + getTotalNum(state.left);
      const weightRight = (getTotalX(state.right) * currentXValue) + getTotalNum(state.right);
      let diff = weightLeft - weightRight;

      if (pendingMult !== null) {
        diff = pendingMult.side === 'left' ? 1 : -1;
      } else if (pendingDiv !== null) {
        diff = pendingDiv.side === 'left' ? -1 : 1;
      } else if (pendingAdd !== null) {
        const isHeavy = pendingAdd.val > 0;
        diff = pendingAdd.side === 'left' ? (isHeavy ? 1 : -1) : (isHeavy ? -1 : 1);
      } else if (pendingRemove !== null) {
        const isHeavy = pendingRemove.val < 0;
        diff = pendingRemove.side === 'left' ? (isHeavy ? 1 : -1) : (isHeavy ? -1 : 1);
      }

      const unitLeft = document.getElementById('unitLeft');
      const unitRight = document.getElementById('unitRight');
      const needle = document.getElementById('needle');

      const FIXED_SHIFT = 20; 
      const FIXED_ANGLE = 20; 
      let targetShiftY = 0;
      let targetAngle = 0;

      if (diff > 0.001) {
        targetShiftY = FIXED_SHIFT;   
        targetAngle = FIXED_ANGLE;
      } else if (diff < -0.001) {
        targetShiftY = -FIXED_SHIFT;  
        targetAngle = -FIXED_ANGLE;
      }

      const prevDiff = window.currentDiff !== undefined ? window.currentDiff : diff;
      window.currentDiff = diff;
      const diffChange = diff - prevDiff;

      const prevShiftY = window.currentShiftY !== undefined ? window.currentShiftY : 0;
      window.currentShiftY = targetShiftY;

      if (targetShiftY !== 0 && targetShiftY === prevShiftY && Math.abs(diffChange) > 0.001) {
        const bounceOffset = diffChange > 0 ? 5 : -5;
        unitLeft.style.transform = `translateY(${targetShiftY + bounceOffset}px)`;
        unitRight.style.transform = `translateY(${-targetShiftY - bounceOffset}px)`;
        needle.style.transform = `translateX(-50%) rotate(${targetAngle + (bounceOffset > 0 ? 5 : -5)}deg)`;

        setTimeout(() => {
          unitLeft.style.transform = `translateY(${targetShiftY}px)`;
          unitRight.style.transform = `translateY(${-targetShiftY}px)`;
          needle.style.transform = `translateX(-50%) rotate(${targetAngle}deg)`;
        }, 150);
      } else {
        unitLeft.style.transform = `translateY(${targetShiftY}px)`;
        unitRight.style.transform = `translateY(${-targetShiftY}px)`;
        needle.style.transform = `translateX(-50%) rotate(${targetAngle}deg)`;
      }

      const isBalanced = Math.abs(diff) < 0.001;

      const btnResetPal = document.getElementById('btnResetPalette');
      if (btnResetPal && !isCompleted) btnResetPal.disabled = !isBalanced;

      if (isBalanced && hasStateDiff() && !window.isAnimating && pendingMult === null) {
        saveBaseState();
      }
    }

    /* 5-9-6. 辺の状態を文字列フォーマット化 */
    function formatSideState(s) {
      let parts = [];
      const xVals = Array.isArray(s.x) ? s.x : [s.x];
      xVals.forEach(v => {
        if (Math.abs(v) > 1e-9) parts.push(formatTerm(v, true, parts.length === 0));
      });
      const numVals = Array.isArray(s.num) ? s.num : [s.num];
      numVals.forEach(v => {
        if (Math.abs(v) > 1e-9) parts.push(formatTerm(v, false, parts.length === 0));
      });
      if (s.groups.length > 0) {
        let groupCounts = {};
        s.groups.forEach(g => {
          const denom = g.denom || 1;
          const sign = g.sign || 1;
          // xだけの係数分数(例: 3/4x)は、xを分子に含めず分数の外に出して表示する
          const isXCoeffFrac = (denom > 1 && g.num === 0 && g.x !== 0 && !g.xNumeratorStyle);
          let innerStr, hasOp, needsParen;
          if (isXCoeffFrac) {
            innerStr = String(Math.abs(g.x));
            hasOp = false;
            needsParen = false;
          } else {
            let innerParts = [];
            if (g.x !== 0) innerParts.push(formatTerm(g.x, true, true));
            if (g.num !== 0) innerParts.push(formatTerm(g.num, false, innerParts.length === 0));
            innerStr = innerParts.join(' ');
            hasOp = innerParts.length > 1;
            needsParen = hasOp || (sign === -1 && innerStr.startsWith('-'));
          }
          let key = '';
          if (denom > 1) {
            if (sign === -1) {
              key = needsParen ? `-( ${innerStr} )/${denom}` : `-${innerStr}/${denom}`;
            } else {
              key = needsParen ? `(${innerStr})/${denom}` : `${innerStr}/${denom}`;
            }
          } else {
            key = needsParen ? (sign === -1 ? `-(${innerStr})` : `(${innerStr})`) : (sign === -1 ? `-${innerStr}` : innerStr);
          }
          if (isXCoeffFrac) key += '_x';
          if (!groupCounts[key]) {
            groupCounts[key] = { count: 0, sign: sign, isFrac: denom > 1, isXCoeffFrac: isXCoeffFrac, innerStr: innerStr, denom: denom, hasOp: hasOp, needsParen: needsParen };
          }
          groupCounts[key].count += (g.count || 1);
        });

        for (let key in groupCounts) {
          const item = groupCounts[key];
          const count = item.count;
          const sign = item.sign;
          const isFirst = parts.length === 0;
          let term = '';
          const needsParen = item.needsParen;
          if (item.isFrac) {
            const core = item.isXCoeffFrac
              ? `${item.innerStr}/${item.denom}x`
              : (needsParen ? `(${item.innerStr})/${item.denom}` : `${item.innerStr}/${item.denom}`);
            if (sign === -1) {
              if (count === 1) {
                term = isFirst ? `-${core}` : `- ${core}`;
              } else {
                term = isFirst ? `-${count}*${core}` : `- ${count}*${core}`;
              }
            } else {
              if (count === 1) {
                term = isFirst ? core : (core.startsWith('-') ? `- ${core.slice(1)}` : `+ ${core}`);
              } else {
                term = isFirst ? `${count}${core}` : `+ ${count}${core}`;
              }
            }
          } else {
            const core = needsParen ? `(${item.innerStr})` : item.innerStr;
            if (sign === -1) {
              if (count === 1) {
                term = isFirst ? `-${core}` : `- ${core}`;
              } else {
                term = isFirst ? `-${count}${core}` : `- ${count}${core}`;
              }
            } else {
              if (count === 1) {
                term = isFirst ? item.innerStr : (item.innerStr.startsWith('-') ? `- ${item.innerStr.slice(1)}` : `+ ${item.innerStr}`);
              } else {
                term = isFirst ? `${count}${core}` : `+ ${count}${core}`;
              }
            }
          }
          parts.push(term);
        }
      }
      return parts.length > 0 ? parts.join(' ') : '0';
    }

    // ========================================================
    // 5-10. ドラッグ＆ドロップ制御
    // ========================================================
    /* 5-10-1. 変更タイプの判定 */
    function getActiveChangeType() {
      const deltaX_L = getTotalX(state.left) - getTotalX(baseState.left);
      const deltaNum_L = getTotalNum(state.left) - getTotalNum(baseState.left);
      const deltaX_R = getTotalX(state.right) - getTotalX(baseState.right);
      const deltaNum_R = getTotalNum(state.right) - getTotalNum(baseState.right);
      const leftChanged = (Math.abs(deltaX_L) > 1e-9 || Math.abs(deltaNum_L) > 1e-9);
      const rightChanged = (Math.abs(deltaX_R) > 1e-9 || Math.abs(deltaNum_R) > 1e-9);

      if (leftChanged && !rightChanged) {
        if (Math.abs(deltaX_L) > 1e-9) return 'x';
        if (Math.abs(deltaNum_L) > 1e-9) return '1';
      } else if (rightChanged && !leftChanged) {
        if (Math.abs(deltaX_R) > 1e-9) return 'x';
        if (Math.abs(deltaNum_R) > 1e-9) return '1';
      }
      return null;
    }

    /* 5-10-2. ドラッグ開始イベント */
    function handlePaletteDragStart(e, type, val) {
      if (isCompleted) return;
      draggedData = { source: 'palette', type, val };
    }
    function handlePlateDragStart(e, side, type, val) {
      if (isCompleted) return;
      draggedData = { source: 'plate', side, type, val };
      e.stopPropagation();
    }

    /* 5-10-3. お皿へのドロップ制御 */
    function handleDragOverPlate(e) {
      if (isCompleted) return;
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.add('drag-over');
    }
    function handleDragLeavePlate(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function handleDropPlate(e, targetSide) {
      if (isCompleted) return;
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.remove('drag-over');

      if (!draggedData) return;
      if (window.isAnimating) return;
 
      if (draggedData.type === 'mult') {
        let factor = draggedData.val;
        if (!tutorialCheckOp('mult', undefined, factor, targetSide, pendingMult !== null)) { draggedData = null; return; }
        if (window.tutorialHandsOnActive && pendingMult === null) tutorialAdvanceHandsOnStep();
        if (pendingMult && pendingMult.side !== targetSide && pendingMult.factor !== factor) {
          showAlert(`左右で違う倍率はかけられないよ！（現在は ×${pendingMult.factor} です）`, false);
          draggedData = null;
          return;
        }
        if (pendingMult && pendingMult.side === targetSide) {
          showAlert(`反対側の皿も ${pendingMult.factor} 倍してね！`, false);
          draggedData = null;
          return;
        }
        // 整数にならない（分母が割り切れない）かどうかの判定
        const hasUnreducibleFraction = state[targetSide].groups.some(g => {
          const d = g.denom || 1;
          return (factor % d !== 0);
        });

        if (hasUnreducibleFraction) {
          showAlert('整数にならないよ', false);
          draggedData = null;
          return;
        }

        const multiplySide = applyMultiplyToSide;

        const targetPlateEl = document.getElementById(targetSide === 'left' ? 'plateLeft' : 'plateRight');

        if (!pendingMult) {
          pendingMult = { factor: factor, side: targetSide };
          multiplySide(state[targetSide], factor);
          targetPlateEl.classList.add('flash-green');
          setTimeout(() => targetPlateEl.classList.remove('flash-green'), 500);
          render();
          updatePaletteUI();
          showAlert(`片方の皿を ${factor} 倍したよ！反対側の皿も ${factor} 倍してね。`, false);
          draggedData = null;
          return;
        } else {
          multiplySide(state[targetSide], factor);

          targetPlateEl.classList.add('flash-green');
          setTimeout(() => targetPlateEl.classList.remove('flash-green'), 500);

          let effectiveFactor = factor;
          let origLeft = formatSideState(baseState.left);
          let origRight = formatSideState(baseState.right);

          // 直前が「符号入れかえ」だった場合、そのノート履歴を削除してマイナス倍（-2倍など）の処理に書き換える
          if (calcNotebook.length > 0 && calcNotebook[calcNotebook.length - 1].opType === 'sign') {
            calcNotebook.pop();
            effectiveFactor = -factor;
            if (calcNotebook.length > 0) {
              const prevEntry = calcNotebook[calcNotebook.length - 1];
              origLeft = prevEntry.left;
              origRight = prevEntry.right;
            }
          }

          const factorStr = effectiveFactor > 0 ? `${effectiveFactor}` : `(${effectiveFactor})`;
          const wrapPoly = (str) => {
            const trimmed = str.trim();
            if (/^-?\d*\(.+\)$/.test(trimmed)) return str;
            const terms = splitTopLevelTerms(trimmed);
            return terms.length > 1 ? `(${str})` : str;
          };
          const stepLeft = `${wrapPoly(origLeft)} * ${factorStr}`;
          const stepRight = `${wrapPoly(origRight)} * ${factorStr}`;

          const chkEquality = document.getElementById('chkEquality').checked;
          if (chkEquality) {
            // 2. 両辺への操作
            addNotebookEntry(stepLeft, stepRight, `両辺を\n　 ${effectiveFactor} 倍した`, false, { opType: 'mult', origLeft, origRight, origFactor: effectiveFactor });
            // 3. 左辺のみ整理（右辺未計算）
            addNotebookEntry(formatSideState(state.left), stepRight, '', false, { opType: 'mult', origLeft, origRight, origFactor: effectiveFactor });
            // 4. 基準状態更新 & 計算結果
            saveBaseState();
            pendingMult = null;
            multFactor = 2;
            paletteState.selectedKey = null;
            render();
            updatePaletteUI();
            addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'mult', origLeft, origRight, origFactor: effectiveFactor });
          } else {
            saveBaseState();
            pendingMult = null;
            multFactor = 2;
            paletteState.selectedKey = null;
            render();
            updatePaletteUI();
            addNotebookEntry(formatSideState(state.left), formatSideState(state.right), `両辺を\n　 ${effectiveFactor} 倍した`, false, { opType: 'mult', origLeft, origRight, origFactor: effectiveFactor });
          }
          showAlert(`両辺を ${effectiveFactor} 倍して再び釣り合ったね！`, false);
          checkCompletion();
          draggedData = null;
          return;
        }
      }

    if (draggedData.type === 'div') {
        let factor = draggedData.val;
        if (!tutorialCheckOp('div', undefined, factor, targetSide, pendingDiv !== null)) { draggedData = null; return; }
        if (window.tutorialHandsOnActive && pendingDiv === null) tutorialAdvanceHandsOnStep();
        if (pendingDiv && pendingDiv.side !== targetSide && pendingDiv.factor !== factor) {
          showAlert(`左右で違う数では割れないよ！（現在は ÷${pendingDiv.factor} です）`, false);
          draggedData = null;
          return;
        }
        if (pendingDiv && pendingDiv.side === targetSide) {
          showAlert(`反対側の皿も ${pendingDiv.factor} で割ってね！`, false);
          draggedData = null;
          return;
        }

        const targetState = state[targetSide];
        const hasFraction = targetState.groups.some(g => (g.denom || 1) > 1);
        const hasSplit = Array.isArray(targetState.x) || Array.isArray(targetState.num);

        if (hasFraction || hasSplit) {
          showAlert('これ以上割れないよ', false);
          draggedData = null;
          return;
        }

        const divisorVals = [targetState.x, targetState.num, ...targetState.groups.map(g => g.count || 1)];
        const canDivide = divisorVals.every(v => v % factor === 0);

        if (!canDivide) {
          showAlert('これは割れないよ', false);
          draggedData = null;
          return;
        }

        const divideSide = applyDivideToSide;

        const targetPlateEl = document.getElementById(targetSide === 'left' ? 'plateLeft' : 'plateRight');

        if (!pendingDiv) {
          pendingDiv = { factor: factor, side: targetSide };
          divideSide(state[targetSide], factor);
          targetPlateEl.classList.add('flash-green');
          setTimeout(() => targetPlateEl.classList.remove('flash-green'), 500);
          render();
          updatePaletteUI();
          showAlert(`片方の皿を ${factor} で割ったよ！反対側の皿も ${factor} で割ってね。`, false);
          draggedData = null;
          return;
        } else {
          divideSide(state[targetSide], factor);

          targetPlateEl.classList.add('flash-green');
          setTimeout(() => targetPlateEl.classList.remove('flash-green'), 500);

          let effectiveDivFactor = factor;
          let origLeft = formatSideState(baseState.left);
          let origRight = formatSideState(baseState.right);

          if (calcNotebook.length > 0 && calcNotebook[calcNotebook.length - 1].opType === 'sign') {
            calcNotebook.pop();
            effectiveDivFactor = -factor;
            if (calcNotebook.length > 0) {
              const prevEntry = calcNotebook[calcNotebook.length - 1];
              origLeft = prevEntry.left;
              origRight = prevEntry.right;
            }
          }

          const stepLeft = toPerTermFraction(origLeft, effectiveDivFactor);
          const stepRight = toPerTermFraction(origRight, effectiveDivFactor);

          const chkEquality = document.getElementById('chkEquality').checked;
          if (chkEquality) {
            addNotebookEntry(stepLeft, stepRight, `両辺を\n　 ${effectiveDivFactor}で割った`, false, { opType: 'divide', origLeft, origRight, divideK: effectiveDivFactor });
            addNotebookEntry(formatSideState(state.left), stepRight, '', false, { opType: 'divide', origLeft, origRight, divideK: effectiveDivFactor });
            saveBaseState();
            pendingDiv = null;
            divFactor = 2;
            paletteState.selectedKey = null;
            render();
            updatePaletteUI();
            addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'divide', origLeft, origRight, divideK: effectiveDivFactor });
          } else {
            saveBaseState();
            pendingDiv = null;
            divFactor = 2;
            paletteState.selectedKey = null;
            render();
            updatePaletteUI();
            addNotebookEntry(formatSideState(state.left), formatSideState(state.right), `両辺を\n　 ${effectiveDivFactor} で割った`, false, { opType: 'divide', origLeft, origRight, divideK: effectiveDivFactor });
          }
          showAlert(`両辺を ${effectiveDivFactor} で割って再び釣り合ったね！`, false);
          checkCompletion();
          draggedData = null;
          return;
        }
      }

    if (draggedData.source === 'palette' && draggedData.type !== 'mult' && draggedData.type !== 'div') {
        if (pendingAdd && pendingAdd.side === targetSide) {
          showAlert('反対側の皿にも同じ球を置いてね！', false);
          draggedData = null;
          render();
          return;
        }
        if (pendingAdd && (pendingAdd.key !== draggedData.key || pendingAdd.val !== draggedData.val)) {
          showAlert('左右で違う球では合わせられないよ！', false);
          draggedData = null;
          render();
          return;
        }
      }

      const isTransfer = (draggedData.source === 'plate' && draggedData.side !== targetSide);

      if (pendingRemove !== null) {
        showAlert('反対側の皿からおろしてね！', false);
        draggedData = null;
        render();
        return;
      }

      const activeType = getActiveChangeType();

      if (activeType && activeType !== draggedData.type) {
        if (draggedData.source === 'palette') showAlert('それは増やせないよ', false);
        else if (isTransfer) showAlert('それは移項できないよ', false);
        else showAlert('それは減らせないよ', false);
        draggedData = null;
        render();
        return;
      }

      let nextState = JSON.parse(JSON.stringify(state));
      const droppedVal = (isTransfer) ? -draggedData.val : draggedData.val;
      const target = state[targetSide];

      if (isTransfer && document.getElementById('chkEquality').checked) {
        showAlert('パレットから両辺に同じ操作をしてね。', false);
        draggedData = null;
        render();
        return;
      }

      if (isTransfer) {
        window.isAnimating = true;
        setLockState(true);

        const targetPlateEl = document.getElementById(targetSide === 'left' ? 'plateLeft' : 'plateRight');
        const srcSide = draggedData.side === 'left' ? '左辺' : '右辺';
        const tgtSide = targetSide === 'left' ? '左辺' : '右辺';
        let termStr = '';
        let opStr = '';
        if (draggedData.type === 'x') {
          const absVal = Math.abs(draggedData.val);
          const xStr = absVal === 1 ? 'x' : `${absVal}x`;
          termStr = draggedData.val > 0 ? `+${xStr}` : `-${xStr}`;
          opStr = draggedData.val > 0 ? `- ${xStr}` : `+ ${xStr}`;
        } else {
          termStr = draggedData.val > 0 ? `+${draggedData.val}` : `${draggedData.val}`;
          opStr = draggedData.val > 0 ? `- ${draggedData.val}` : `+ ${Math.abs(draggedData.val)}`;
        }

        const isContinuousTranspose = calcNotebook.length > 0 && 
            (calcNotebook[calcNotebook.length - 1].opType === 'transpose' || 
             calcNotebook[calcNotebook.length - 1].opType === 'transpose_result');

        let startLeft = null;
        let startRight = null;
        let transToLeft = [];
        let transToRight = [];
        let transferredItems = [];
        let lastTranspose = null;

        if (isContinuousTranspose) {
          for (let i = calcNotebook.length - 1; i >= 0; i--) {
            if (calcNotebook[i].opType === 'transpose') {
              lastTranspose = calcNotebook[i];
            } else if (calcNotebook[i].opType !== 'transpose_result') {
              break;
            }
          }
          if (lastTranspose && lastTranspose.startLeft) {
            startLeft = JSON.parse(JSON.stringify(lastTranspose.startLeft));
            startRight = JSON.parse(JSON.stringify(lastTranspose.startRight));
            transToLeft = lastTranspose.transToLeft ? [...lastTranspose.transToLeft] : [];
            transToRight = lastTranspose.transToRight ? [...lastTranspose.transToRight] : [];
            transferredItems = lastTranspose.transferredItems ? [...lastTranspose.transferredItems] : [];
          }
          while (calcNotebook.length > 0 && 
                (calcNotebook[calcNotebook.length - 1].opType === 'transpose' || 
                 calcNotebook[calcNotebook.length - 1].opType === 'transpose_result')) {
            calcNotebook.pop();
          }
        }

        if (!startLeft) {
          startLeft = JSON.parse(JSON.stringify(baseState.left));
          startRight = JSON.parse(JSON.stringify(baseState.right));
        }

        let curLeft = JSON.parse(JSON.stringify(startLeft));
        let curRight = JSON.parse(JSON.stringify(startRight));

        if (draggedData.side === 'left') {
          transToRight.push(opStr);
        } else {
          transToLeft.push(opStr);
        }

        var details = (isContinuousTranspose && lastTranspose && lastTranspose.transferredDetails)
          ? [...lastTranspose.transferredDetails, { side: draggedData.side, type: draggedData.type, val: draggedData.val }]
          : [{ side: draggedData.side, type: draggedData.type, val: draggedData.val }];

        details.forEach(item => {
          if (item.side === 'left') {
            if (item.type === 'x') curLeft.x -= item.val;
            else curLeft.num -= item.val;
          } else {
            if (item.type === 'x') curRight.x -= item.val;
            else curRight.num -= item.val;
          }
        });

        let stepLeft = formatSideState(curLeft);
        if (transToLeft.length > 0) {
          if (stepLeft === '0') stepLeft = transToLeft.join(' ').replace(/^\+\s*/, '');
          else stepLeft += ' ' + transToLeft.join(' ');
        }
        
        let stepRight = formatSideState(curRight);
        if (transToRight.length > 0) {
          if (stepRight === '0') stepRight = transToRight.join(' ').replace(/^\+\s*/, '');
          else stepRight += ' ' + transToRight.join(' ');
        }

        const formatTermText = (type, val) => {
          if (type === 'x') {
            const absVal = Math.abs(val);
            const xStr = absVal === 1 ? 'x' : `${absVal}x`;
            return val > 0 ? `${xStr}` : `-${xStr}`;
          } else {
            return val > 0 ? `+${val}` : `${val}`;
          }
        };

        const leftTermList = details.filter(d => d.side === 'left').map(d => formatTermText(d.type, d.val));
        const rightTermList = details.filter(d => d.side === 'right').map(d => formatTermText(d.type, d.val));
        const noteText = `${[...leftTermList, ...rightTermList].join(' と ')} を\n　移項した`;

        addNotebookEntry(stepLeft, stepRight, noteText, false, { 
          opType: 'transpose',
          startLeft: startLeft,
          startRight: startRight,
          transToLeft: transToLeft,
          transToRight: transToRight,
          transferredItems: transferredItems,
          transferredDetails: details
        });

        const willCancel = (draggedData.type === 'x' && state[targetSide].x * droppedVal < 0) || 
                           (draggedData.type === '1' && state[targetSide].num * droppedVal < 0);

        if (draggedData.type === 'x') {
          state[draggedData.side].x -= draggedData.val;
          baseState[draggedData.side].x -= draggedData.val;
        } else {
          state[draggedData.side].num -= draggedData.val;
          baseState[draggedData.side].num -= draggedData.val;
        }

        renderPlate('plateLeft', state.left, 'left');
        renderPlate('plateRight', state.right, 'right');

        if (draggedData.type === 'x') {
          state[targetSide].x += droppedVal;
        } else {
          state[targetSide].num += droppedVal;
        }

        if (!willCancel) saveBaseState();

        updateScaleAndStatus();

        const flipBall = document.createElement('div');
        const initialClass = draggedData.type === 'x' 
          ? (draggedData.val > 0 ? 'ball-x-pos' : 'ball-x-neg') 
          : (draggedData.val > 0 ? 'ball-num-pos' : 'ball-num-neg');
        
        flipBall.className = `ball ${initialClass} flipping`;
        flipBall.textContent = formatTerm(draggedData.val, draggedData.type === 'x', true);
        setBallSize(flipBall, draggedData.type, draggedData.val);
        targetPlateEl.appendChild(flipBall);

        setTimeout(() => {
          const flippedClass = draggedData.type === 'x' 
            ? (droppedVal > 0 ? 'ball-x-pos' : 'ball-x-neg') 
            : (droppedVal > 0 ? 'ball-num-pos' : 'ball-num-neg');
          
          flipBall.className = `ball ${flippedClass} flipping`;
          flipBall.textContent = formatTerm(droppedVal, draggedData.type === 'x', true);
        }, 250);

        setTimeout(() => {
          flipBall.classList.remove('flipping');
          if (willCancel) {
            flipBall.classList.add('annihilating');
            const existingClass = draggedData.type === 'x' 
              ? (droppedVal > 0 ? '.ball-x-neg' : '.ball-x-pos') 
              : (droppedVal > 0 ? '.ball-num-neg' : '.ball-num-pos');
            const targetExisting = targetPlateEl.querySelector(existingClass);
            if (targetExisting) targetExisting.classList.add('annihilating');

            setTimeout(() => {
              window.isAnimating = false;
              setLockState(false);
              applyStateChange();
            }, 1000);
          } else {
            window.isAnimating = false;
            setLockState(false);
            applyStateChange();
          }
        }, 500);

        return;
      }

      const hasOpposite = (val, dropped) => Array.isArray(val) ? val.some(v => v * dropped < 0) : (val * dropped < 0);
      const willCancel = (draggedData.type === 'x' && hasOpposite(target.x, droppedVal)) || 
                         (draggedData.type === '1' && hasOpposite(target.num, droppedVal));

      if (willCancel) {
        window.isAnimating = true;
        setLockState(true);

        const plateEl = document.getElementById(targetSide === 'left' ? 'plateLeft' : 'plateRight');
        const dummyBall = document.createElement('div');
        dummyBall.className = `ball ${draggedData.type === 'x' ? (droppedVal > 0 ? 'ball-x-pos' : 'ball-x-neg') : (droppedVal > 0 ? 'ball-num-pos' : 'ball-num-neg')} annihilating`;
        dummyBall.textContent = formatTerm(droppedVal, draggedData.type === 'x', true);
        setBallSize(dummyBall, draggedData.type, droppedVal);
        plateEl.appendChild(dummyBall);

        const existingClass = draggedData.type === 'x' ? (droppedVal > 0 ? '.ball-x-neg' : '.ball-x-pos') : (droppedVal > 0 ? '.ball-num-neg' : '.ball-num-pos');
        const targetExisting = plateEl.querySelector(existingClass);
        if (targetExisting) targetExisting.classList.add('annihilating');

        setTimeout(() => {
          window.isAnimating = false;
          setLockState(false);
          applyStateChange();
        }, 1000);
      } else {
        applyStateChange();
      }

      function applyStateChange() {
        if (draggedData.source === 'palette') {
          const tgt = nextState[targetSide];
          const applyToProp = (prop) => {
            if (Array.isArray(tgt[prop])) {
              const idx = tgt[prop].findIndex(v => v * draggedData.val < 0);
              if (idx !== -1) {
                tgt[prop][idx] += draggedData.val;
                if (tgt[prop][idx] === 0) tgt[prop].splice(idx, 1);
                if (tgt[prop].length === 1) tgt[prop] = tgt[prop][0];
              } else {
                tgt[prop].push(draggedData.val);
              }
            } else {
              tgt[prop] += draggedData.val;
            }
          };
          if (draggedData.type === 'x') applyToProp('x');
          else applyToProp('num');
        } else if (draggedData.source === 'plate') {
          if (isTransfer) {
            const src = nextState[draggedData.side];
            const tgt = nextState[targetSide];
            if (draggedData.type === 'x') {
              src.x -= draggedData.val;
              tgt.x += (-draggedData.val);
            } else {
              src.num -= draggedData.val;
              tgt.num += (-draggedData.val);
            }
          }
        }

        if (isTransfer) {
          saveBaseState();
          render();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '', false, { opType: 'transpose_result' });
          if (!checkCompletion()) showAlert('移項したよ！（符号が変わったね）', false);
          draggedData = null;
        } else if (draggedData.source === 'palette') {
          const wasPending = (pendingAdd !== null);
          const addKey = draggedData.key;
          const addVal = draggedData.val;
          if (!tutorialCheckOp('add', draggedData.type, addVal, targetSide, wasPending)) { draggedData = null; render(); return; }
          if (window.tutorialHandsOnActive && !wasPending) tutorialAdvanceHandsOnStep();
          const chkEquality = document.getElementById('chkEquality').checked;
          
          if (wasPending) {
            pendingAdd = null;
            paletteState.selectedKey = null;
            paletteState.count = 1;
          } else {
            pendingAdd = { key: addKey, val: addVal, side: targetSide };
            paletteState.selectedKey = addKey;
          }
          
          validateAndUpdateState(nextState, 'add');
          
          if (!wasPending && !chkEquality) {
            showAlert('反対側の皿にも同じ球を置いてね！', false);
          }
          
          updatePaletteUI();
          draggedData = null;
        } else {
          validateAndUpdateState(nextState);
          draggedData = null;
        }
      }
    }

    /* 5-10-4. 画面外（body）へのドロップ制御 */
    function handleDragOverBody(e) {
      if (isCompleted) return;
      e.preventDefault();
    }
    function handleDropBody(e) {
      if (isCompleted) return;
      e.preventDefault();
      if (draggedData && draggedData.source === 'plate') {
        const chkEqualityForRemove = document.getElementById('chkEquality').checked;

        // 等式の性質OFFのときは、マイナスの球(-x, -1)は皿の外に取り除けないようにする(反対側の皿への移項は可)
        if (!chkEqualityForRemove && draggedData.val < 0) {
          showAlert('それは取れないよ。', false);
          draggedData = null;
          render();
          return;
        }

        const activeType = getActiveChangeType();
        if (activeType && activeType !== draggedData.type) {
          showAlert('それは減らせないよ', false);
          draggedData = null;
          render();
          return;
        }

        if (chkEqualityForRemove && draggedData.side === 'left' && draggedData.type === '1' && draggedData.val < 0) {
          showAlert('それは取れないよ。パレットから同じ数をたそう！', false);
          draggedData = null;
          render();
          return;
        }

        if (pendingRemove && pendingRemove.side === draggedData.side) {
          showAlert('反対側の皿からおろしてね！', false);
          draggedData = null;
          render();
          return;
        }
        if (pendingRemove && (pendingRemove.type !== draggedData.type || pendingRemove.val !== draggedData.val)) {
          showAlert('左右で違う球では揃えられないよ！', false);
          draggedData = null;
          render();
          return;
        }

        const wasPending = (pendingRemove !== null);
        const removeType = draggedData.type;
        const removeVal = draggedData.val;
        const removeSide = draggedData.side;
        if (!tutorialCheckOp('remove', removeType, removeVal, removeSide, wasPending)) { draggedData = null; render(); return; }
        if (window.tutorialHandsOnActive && !wasPending) tutorialAdvanceHandsOnStep();

        // 直接減算ではなく、配列対応の removeBallFromState を呼び出して除去処理を行う
        removeBallFromState(draggedData.side, draggedData.type, draggedData.val, draggedData.index);
        let nextState = JSON.parse(JSON.stringify(state));

        if (wasPending) {
          pendingRemove = null;
        } else {
          pendingRemove = { type: removeType, val: removeVal, side: removeSide };
        }

        validateAndUpdateState(nextState, 'remove');

        if (!wasPending && !document.getElementById('chkEquality').checked) {
          showAlert('反対側の皿からも同じ球をおろしてね！', false);
        }
        
        updatePaletteUI();
        draggedData = null;
      }
    }

    /* 5-10-5. アプリのスケール取得 */
    function getAppScale() {
      const container = document.querySelector('.app-container');
      if (!container) return 1;
      const rect = container.getBoundingClientRect();
      return rect.width / 960 || 1;
    }

    /* 5-10-6. お皿のアイテムドラッグ処理 */
    function handlePointerDown(e, source, side, type, val, index) {
      if (isCompleted || window.isAnimating) return;
      if (isPendingOpForGrab()) {
        showAlert('反対側の皿の操作を先に終えてね！', false);
        return;
      }
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();

      const startX = e.clientX;
      const startY = e.clientY;
      let isDragging = false;
      let ghost = null;
      const targetEl = e.currentTarget;

      const onPointerMove = (moveEvent) => {
        const dist = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
        
        // 5px以上動いたらドラッグ操作を開始
        if (!isDragging && dist > 5) {
          isDragging = true;
          draggedData = { source, side, type, val, index };

          if (targetEl) targetEl.style.visibility = 'hidden';

          ghost = document.createElement('div');
          ghost.className = `ball ${type === 'x' ? (val > 0 ? 'ball-x-pos' : 'ball-x-neg') : (val > 0 ? 'ball-num-pos' : 'ball-num-neg')}`;
          ghost.textContent = formatTerm(val, type === 'x', true);
          setBallSize(ghost, type, val);
          ghost.style.position = 'fixed';
          ghost.style.pointerEvents = 'none'; 
          ghost.style.zIndex = '9999';
          ghost.style.transform = `scale(${getAppScale()})`;
          ghost.style.transformOrigin = 'center center';
          document.body.appendChild(ghost);
        }

        if (isDragging && ghost) {
          ghost.style.left = `${moveEvent.clientX - 15}px`;
          ghost.style.top = `${moveEvent.clientY - 15}px`;
        }
      };

      const onPointerUp = (upEvent) => {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);

        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);

        if (isDragging) {
          // ドロップ先の判定と処理を実行
          const droppedElement = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
          if (droppedElement) {
            const plateLeftEl = document.getElementById('plateLeft');
            const plateRightEl = document.getElementById('plateRight');
            const isLeftPlate = plateLeftEl.contains(droppedElement) || droppedElement === plateLeftEl;
            const isRightPlate = plateRightEl.contains(droppedElement) || droppedElement === plateRightEl;

            const dummyEvent = {
              preventDefault: () => {}, stopPropagation: () => {},
              currentTarget: isLeftPlate ? plateLeftEl : plateRightEl
            };

            if (isLeftPlate) {
              handleDropPlate(dummyEvent, 'left');
            } else if (isRightPlate) {
              handleDropPlate(dummyEvent, 'right');
            } else {
              handleDropBody(upEvent);
            }
          } else {
            handleDropBody(upEvent);
          }
        } else {
          // ドラッグされずにクリックされた場合は球の分裂（分解）処理を呼び出す
          if (targetEl) targetEl.style.visibility = 'visible';
          splitBall(side, type, val);
        }
      };
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    }

    // ========================================================
    // 5-11. バリデーション・完了判定・その他
    // ========================================================
    /* 5-11-1. 状態の検証と更新 */
    function validateAndUpdateState(nextState, actionType) {
      const chkEquality = document.getElementById('chkEquality').checked;
      const deltaX_L = getTotalX(nextState.left) - getTotalX(baseState.left);
      const deltaNum_L = getTotalNum(nextState.left) - getTotalNum(baseState.left);
      const deltaX_R = getTotalX(nextState.right) - getTotalX(baseState.right);
      const deltaNum_R = getTotalNum(nextState.right) - getTotalNum(baseState.right);

      const leftChanged = (Math.abs(deltaX_L) > 1e-9 || Math.abs(deltaNum_L) > 1e-9);
      const rightChanged = (Math.abs(deltaX_R) > 1e-9 || Math.abs(deltaNum_R) > 1e-9);
      const isSameOp = (Math.abs(deltaX_L - deltaX_R) < 1e-9) && (Math.abs(deltaNum_L - deltaNum_R) < 1e-9);

      // 一時的な操作状態（片側の変更）を保持するために state を更新
      state = JSON.parse(JSON.stringify(nextState));

      if (isSameOp && leftChanged) {
        // 1行目（操作直後）専用の表記。actionTypeが分かる場合は「たした/ひいた」、
        // 分からない場合（同一皿内の操作など）は従来通りdeltaの符号で判定する。
        let opStr = '';
        let opTerm = '';
        // 2行目以降（従来通りの表記）は、actionTypeに関わらず常にこちらを使う。
        let plainOpStr = '';
        let plainOpTerm = '';

        const isAdd = (actionType === 'add') ? true : (actionType === 'remove') ? false : null;

        if (Math.abs(deltaX_L) > 1e-9) {
          const absVal = cleanNum(Math.abs(deltaX_L));
          const term = absVal === 1 ? 'x' : `${absVal}x`;
          plainOpTerm = deltaX_L > 0 ? `+ ${term}` : `- ${term}`;
          plainOpStr = deltaX_L > 0 ? `両辺に\n　 ${term} を加えた` : `両辺から\n　 ${term} を引いた`;

          if (isAdd === null) {
            opTerm = plainOpTerm;
            opStr = plainOpStr;
          } else {
            const rawVal = cleanNum(isAdd ? deltaX_L : -deltaX_L);
            const absTerm = Math.abs(rawVal) === 1 ? 'x' : `${Math.abs(rawVal)}x`;
            const plainTerm = rawVal < 0 ? `-${absTerm}` : absTerm;
            const parenTerm = rawVal < 0 ? `(-${absTerm})` : absTerm;
            opTerm = isAdd ? `+ ${parenTerm}` : `- ${parenTerm}`;
            opStr = isAdd ? `両辺に\n　 ${plainTerm} をたした` : `両辺から\n　 ${plainTerm} をひいた`;
          }
        } else if (Math.abs(deltaNum_L) > 1e-9) {
          const absVal = cleanNum(Math.abs(deltaNum_L));
          plainOpTerm = deltaNum_L > 0 ? `+ ${absVal}` : `- ${absVal}`;
          plainOpStr = deltaNum_L > 0 ? `両辺に\n　 ${absVal} を加えた` : `両辺から\n　 ${absVal} を引いた`;

          if (isAdd === null) {
            opTerm = plainOpTerm;
            opStr = plainOpStr;
          } else {
            const rawVal = cleanNum(isAdd ? deltaNum_L : -deltaNum_L);
            const absValRaw = Math.abs(rawVal);
            const plainTerm = rawVal < 0 ? `-${absValRaw}` : `${absValRaw}`;
            const parenTerm = rawVal < 0 ? `(-${absValRaw})` : `${absValRaw}`;
            opTerm = isAdd ? `+ ${parenTerm}` : `- ${parenTerm}`;
            opStr = isAdd ? `両辺に\n　 ${plainTerm} をたした` : `両辺から\n　 ${plainTerm} をひいた`;
          }
        }

        const baseLeftStr = formatSideState(baseState.left);
        const baseRightStr = formatSideState(baseState.right);
        const stepLeft = baseLeftStr === '0' ? opTerm.replace(/^\+\s*/, '') : `${baseLeftStr} ${opTerm}`;
        const stepRight = baseRightStr === '0' ? opTerm.replace(/^\+\s*/, '') : `${baseRightStr} ${opTerm}`;
        // 2行目以降で使う、従来通りの（+3 / -3のような）表記
        const plainStepRight = baseRightStr === '0' ? plainOpTerm.replace(/^\+\s*/, '') : `${baseRightStr} ${plainOpTerm}`;

        if (chkEquality) {
          // 2. 両辺への操作
          addNotebookEntry(stepLeft, stepRight, opStr);
          // 3. 左辺のみ整理（右辺未計算）
          addNotebookEntry(formatSideState(state.left), plainStepRight, '');
          // 4. 基準状態更新 & 計算結果
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '');
        } else {
          addNotebookEntry(stepLeft, stepRight, opStr);
          saveBaseState();
          addNotebookEntry(formatSideState(state.left), formatSideState(state.right), '');
        }

        showAlert('両辺に同じ操作をしたので、釣り合っているね！', false);
      } else if (chkEquality && (leftChanged !== rightChanged)) {
        showAlert('反対側の皿にも同じ操作をしてね！', false);
      }

      render();
      checkCompletion();
    }
    
    /* 5-11-2. 正解判定 */
    function checkCompletion() {
      if (state.left.groups.length > 0 || state.right.groups.length > 0) return false;

      // 天秤が釣り合っていない場合は正解判定を行わない
      const weightLeft = (getTotalX(state.left) * currentXValue) + getTotalNum(state.left);
      const weightRight = (getTotalX(state.right) * currentXValue) + getTotalNum(state.right);
      if (Math.abs(weightLeft - weightRight) >= 0.001) return false;

      const lx = state.left.x, ln = state.left.num;
      const rx = state.right.x, rn = state.right.num;
      const isZero = (v) => Math.abs(v) < 1e-9;
      const isOne = (v) => Math.abs(v - 1) < 1e-9;

      const solvedNormal = (isOne(lx) && isZero(ln) && isZero(rx));
      const solvedReverse = (isOne(rx) && isZero(rn) && isZero(lx));

      if (solvedNormal || solvedReverse) {
        setLockState(true, solvedReverse, false);

        if (window.presetMode && solvedNormal) {
          presetCompleted[currentPresetCategory + '-' + currentPresetIndex] = true;
          savePresetCompleted();
        }

        const leftIsX = solvedNormal;
        if (leftIsX) {
          const xVal = cleanNum(state.right.num);
          showAlert(`🎉 x の値がわかったよ！$( x = ${xVal} )$`, true);
          if (calcNotebook.length > 0) {
            const lastEntry = calcNotebook[calcNotebook.length - 1];
            if (lastEntry.note) {
              if (!lastEntry.note.endsWith('解')) {
                lastEntry.note += '\n　／解';
              }
            } else {
              lastEntry.note = '解';
            }
          }
        } else {
          showAlert(`最後に両辺を入れかえよう！`, false);
        }
        renderNotebook();
        if (window.tutorialMode && leftIsX) {
          tutorialOnSolved();
        }
        return true;
      }

      const almostNormal = (lx === -1 && ln === 0 && rx === 0);
      const almostReverse = (rx === -1 && rn === 0 && lx === 0);
      
      if (almostNormal || almostReverse) {
        setLockState(true, false, true);
        return false;
      }
      return false;
    }

    /* 5-11-3. 利き手の切り替え */
    function changeHandedness(hand) {
      const leftBtn = document.getElementById('hand-left-btn');
      const rightBtn = document.getElementById('hand-right-btn');
      const mainContent = document.querySelector('.main-content');

      if (hand === 'left') {
        leftBtn.classList.add('active');
        rightBtn.classList.remove('active');
        mainContent.classList.add('left-handed');
      } else {
        rightBtn.classList.add('active');
        leftBtn.classList.remove('active');
        mainContent.classList.remove('left-handed');
      }
    }

  </script>
